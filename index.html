<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>2026 法考主觀題 Case Coach</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f9;color:#18202a}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.boot-card{width:min(560px,100%);background:#fff;border:1px solid #e3e7ec;border-radius:18px;padding:28px;box-sizing:border-box;box-shadow:0 12px 35px rgba(0,0,0,.06)}
    .boot h1{font-size:22px;margin:0 0 10px}.boot p{line-height:1.6;color:#5b6470;margin:8px 0}.bar{height:8px;border-radius:999px;background:#edf0f3;overflow:hidden;margin-top:18px}.bar>span{display:block;height:100%;width:35%;background:#8b1e2d;border-radius:999px;animation:load 1.2s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(185%)}}
    .err{white-space:pre-wrap;color:#a32929;background:#fff3f3;border:1px solid #ffd4d4;border-radius:12px;padding:12px;margin-top:16px;display:none;font-size:14px}
    .skill-beta-entry{position:fixed;right:18px;bottom:18px;z-index:99999;background:#8b1e2d;color:#fff;text-decoration:none;padding:12px 15px;border-radius:14px;box-shadow:0 10px 28px rgba(60,10,18,.25);font:700 14px/1.25 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.skill-beta-entry small{display:block;font-weight:500;opacity:.84;margin-top:2px}.skill-beta-entry:hover{background:#a32536}@media(max-width:640px){.skill-beta-entry{right:10px;bottom:10px;padding:10px 12px;font-size:13px}}
  </style>
</head>
<body>
  <main class="boot" id="boot">
    <section class="boot-card">
      <h1>2026 法考主觀題 Case Coach</h1>
      <p id="bootMsg">正在載入 Coach Learn V3 及兩冊案例教材……</p>
      <div class="bar"><span></span></div>
      <div class="err" id="bootErr"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
  <script>
  (async function(){
    const msg=document.getElementById('bootMsg');
    const err=document.getElementById('bootErr');
    try{
      if(!globalThis.fflate) throw new Error('解壓元件載入失敗');
      msg.textContent='正在下載教材資料……';
      const [r,g]=await Promise.all([
        fetch('./FAKAO_CASE_COACH_2026_STATIC.zip?coach=v3',{cache:'no-store'}),
        fetch('./guided-v3.js?coach=v3',{cache:'no-store'})
      ]);
      if(!r.ok) throw new Error('ZIP 下載失敗：HTTP '+r.status);
      if(!g.ok) throw new Error('Coach Learn V3 載入失敗：HTTP '+g.status);
      const guided=await g.text();
      const bytes=new Uint8Array(await r.arrayBuffer());
      msg.textContent='正在解壓及建立題庫……';
      const files=fflate.unzipSync(bytes);
      const base='FAKAO_CASE_COACH_2026/';
      const need=['index.html','styles.css','data.js','app.js'];
      for(const n of need){if(!files[base+n]) throw new Error('ZIP 缺少 '+n);}
      const dec=new TextDecoder('utf-8');
      const inner=dec.decode(files[base+'index.html']);
      const css=dec.decode(files[base+'styles.css']);
      const data=dec.decode(files[base+'data.js']);
      const app=dec.decode(files[base+'app.js']);
      const parsed=new DOMParser().parseFromString(inner,'text/html');
      parsed.querySelectorAll('script,link[rel="stylesheet"]').forEach(n=>n.remove());
      document.title=parsed.title||'2026 法考主觀題 Case Coach';
      const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);
      document.body.innerHTML=parsed.body.innerHTML;
      (0,eval)(data);
      (0,eval)(app);
      (0,eval)(guided);

      const beta=document.createElement('a');
      beta.className='skill-beta-entry';
      beta.href='./criminal-law-beta.html';
      beta.innerHTML='刑法新教學 Beta<small>未遂 vs 中止 · 手拉手學</small>';
      document.body.appendChild(beta);

      // Hotfix: free-text Coach steps save on input, but V3 originally left the
      // Continue button disabled until a re-render. Keep button state synced.
      document.addEventListener('input',function(e){
        const t=e.target && e.target.closest ? e.target.closest('[data-text-key]') : null;
        if(!t) return;
        const next=document.querySelector('[data-cv3="next"]');
        if(next) next.disabled=!String(t.value||'').trim();
      },true);
    }catch(e){
      console.error(e);msg.textContent='載入失敗';err.style.display='block';err.textContent=String(e&&e.message?e.message:e)+'\n\n請重新整理頁面再試。';
    }
  })();
  </script>
</body>
</html>
