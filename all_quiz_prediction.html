<script>
const questions=[{"id": "卷一-1", "subject": "卷一", "type": "單選題", "question": "刑事訴訟中的強制措施，是指公安機關、人民檢察院和人民法院為了保證刑事訴訟的順利進行，依法對刑事案件的犯罪嫌疑人、被告人的人身自由進行限制或者剝奪的各種強制性方法。根據刑事訴訟法和相關司法解釋，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "人民法院可以對被告單位的訴訟代表人採用拘傳這一強制措施"}, {"key": "B", "text": "對於被拘傳的犯罪嫌疑人，連續訊問最長不得超過24小時"}, {"key": "C", "text": "取保候審的保證人未履行保證義務的，應當沒收保證金，並由公安機關處以1000元以上兩萬以下的罰款"}, {"key": "D", "text": "人民檢察院審查批准逮捕未成年人的，應當聽取其辯護律師的意見"}], "answer": ["D"], "explanation_full": "【羿文解析】A項：拘傳是指公安機關、人民檢察院和人民法院對未被羈押的犯罪嫌疑人、被告人，依法強制其到案接受訊問的一種強制措施。單位犯罪的訴訟代表人不承擔刑事責任，不能採用強制措施。A選項錯誤。 B項：一次拘傳的時間不得超過12小時，案情特別重大、複雜，需要採取拘留、逮捕措施的，拘傳持續的時間不得超過24小時。不得以連續拘傳的形式變相拘禁犯罪嫌疑人、被告人，兩次拘傳間隔的時間一般不得少於 12小時。拘傳犯罪嫌疑人、被告人，應當保證其飲食和必要的休息時間。B選項錯誤。 C項：對同一犯罪嫌疑人、被告人決定取保候審的，不能同時適用保證人保證和保證金保證。C選項錯誤。 D項：人民檢察院審查批准逮捕，可以聽取辯護律師的意見。如果辯護律師提出表達意見的要求的，人民檢察院辦案人員應當聽取辯護律師的意見。對於犯罪嫌疑人、被告人是未成年人的，應當聽取辯護律師的意見。 D選項正確。"}, {"id": "卷一-2", "subject": "卷一", "type": "單選題", "question": "關於被害人承諾，下列哪一選項是正確的？（　　）", "options": [{"key": "A", "text": "兒童趙某生活在貧困家庭，甲徵得趙某父母的同意，將趙某賣至富貴人家。甲的行為得到了趙某父母的有效承諾，並有利於兒童的成長，故不構成拐賣兒童罪"}, {"key": "B", "text": "在錢某家發生火災之際，乙獨自闖入錢某的住宅搬出貴重物品。由於乙的行為事後並未得到錢某的認可 ，故應當成立非法侵入住宅罪"}, {"key": "C", "text": "孫某為戒掉網癮，讓其妻子丙將其反鎖在沒有電腦的房間一星期。孫某對放棄自己人身自由的承諾是無效的，丙的行為依然成立非法拘禁罪"}, {"key": "D", "text": "李某同意丁砍掉自己的一個小手指，而丁卻砍掉了李某的大拇指。丁的行為成立故意傷害罪"}], "answer": ["D"], "explanation_full": "【羿文解析】依照刑法通說，經被害人承諾的行為符合下列條件時，才排除犯罪的成立：（1）承諾者對被侵害的法益具有處分權限。對於國家、公共利益與他人利益，不存在被害人承諾的問題，故只有被害人承諾侵害自己的法益時，才有可能排除犯罪的成立。A選項中趙某的父母就不得承諾侵害趙某的法益，因而A錯誤。 另外，即使是承諾侵害自己的法益時，也有一定的限度。但學界一般認為，放棄自己人身自由的承諾是有效的，因而C錯誤。（2）承諾者必須對所承諾的事項的意義、範圍具有理解能力。（3）承諾必須出於被害人的真實意志，戲言性的承諾、基於強制或者威壓作出的承諾，不排除犯罪的成立。（4）必須存在現實的承諾。 現實上沒有被害人的承諾，但如果被害人知道事實真相後，當然會承諾，在這種情況下，推定被害人的意志所實施的保護被害人法益的行為，構成基於推定的承諾的行為。基於推定承諾所實施的行為，符合一定條件的，也排除犯罪的成立。如發生火災之際，為了避免燒毀被害人的貴重財產，闖入屋內搬出貴重物品的行為 ，就是基於推定的承諾的行為，即使被害人事後不認可，仍然可阻卻犯罪的成立。故B錯誤。（5）承諾至遲必須存在於結果發生時，被害人在結果發生前變更承諾的，則原來的承諾無效。事後承諾不影響行為成立犯罪。（6）經承諾所實施的行為不得超出承諾的範圍。D選項中李某同意丁砍掉自己的一個小手指，而丁卻砍掉了李某的大拇指，這就已經超出了承諾的範圍。這種行為仍然成立故意傷害罪。故D正確。"}, {"id": "卷一-3", "subject": "卷一", "type": "單選題", "question": "關於全面貫徹實施憲法，堅定維護憲法尊嚴和權威，下列哪一選項是不正確的？（）", "options": [{"key": "A", "text": "堅持依憲治國、依憲執政，把全面貫徹實施憲法作為首要任務"}, {"key": "B", "text": "黨帶頭尊崇和執行憲法，把黨領導人民制定和實施憲法法律同黨堅持在憲法法律範圍內活動統一起來，保專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 1 障憲法法律的有效實施"}, {"key": "C", "text": "凡涉及憲法有關規定如何理解、實施、適用問題的，都應當依照有關規定向全國人大書面提出合憲性審查請求"}, {"key": "D", "text": "在備案審查工作中，應當注重審查是否存在不符合憲法規定和憲法精神的內容"}], "answer": ["C"], "explanation_full": "【羿文解析】A選項正確。建設法治中國，必須高度重視憲法在治國理政中的重要地位和作用，堅持依憲治國 、依憲執政，把全面貫徹實施憲法作為首要任務，健全保證憲法全面實施的體制機制，將憲法實施和監督提高到新水平。 B選項正確。堅持把憲法作為根本活動準則。全國各族人民、一切國家機關和武裝力量、各政黨和各社會團體 、各企業事業組織，都負有維護憲法尊嚴、保證憲法實施的職責，都不得有超越憲法法律的特權。堅持憲法法律至上，維護國家法制統一、尊嚴、權威，一切法律法規規章規範性文件都不得同憲法相牴觸，一切違反憲法法律的行為都必須予以追究。黨帶頭尊崇和執行憲法，把黨領導人民制定和實施憲法法律同黨堅持在憲法法律範圍內活動統一起來，保障憲法法律的有效實施。 C選項錯誤，D項正確。加強憲法實施和監督。全國人大及其常委會要切實擔負起憲法監督職責，加強憲法實施和監督，並將其作為全國人大常委會年度工作報告的重要事項。全國人大及其常委會通過的法律和作出的決定決議，應當確保符合憲法規定、憲法精神。推進合憲性審查工作，健全合憲性審查制度，明確合憲性審查的原則、內容、程序。建立健全涉及憲法問題的事先審查和咨詢制度，有關方面擬出台的行政法規、軍事法規、監察法規、地方性法規、經濟特區法規、自治條例和單行條例、部門規章、地方政府規章、司法解釋以及其他規範性文件和重要政策、重大舉措，凡涉及憲法有關規定如何理解、實施、適用問題的，都應當依照有關規定向全國人大常委會書面提出合憲性審查請求。在備案審查工作中，應當注重審查是否存在不符合憲法規定和憲法精神的內容。加強憲法解釋工作，落實憲法解釋程序機制，回應涉及憲法有關問題的關切。"}, {"id": "卷一-4", "subject": "卷一", "type": "單選題", "question": "關於行政復議，下列哪一說法是正確的？（）", "options": [{"key": "A", "text": "《行政復議法》規定，被申請人應自收到復議申請書或筆錄複印件之日起10日提出書面答覆，此處的10日指工作日"}, {"key": "B", "text": "行政復議期間，被申請人不得改變被申請復議的具體行政行為"}, {"key": "C", "text": "行政復議期間，復議機關發現被申請人的相關行政行為違法，可以製作行政復議意見書"}, {"key": "D", "text": "行政復議實行對具體行政行為進行合法性審■原則"}], "answer": ["C"], "explanation_full": "【羿文解析】《行政復議法》第40條規定，行政復議期間的計算和行政復議文書的送達，依照民事訴訟法關於期間、送達的規定執行。本法關於行政復議期間有關“5日”、“7日”的規定是指工作日，不含節假日。 行政復議期間只有5日、7日才是工作日，而10日就是自然日了，所以A選項錯誤。《行政復議法實施條例》第 39條規定，行政復議期間被申請人改變原具體行政行為的，不影響行政復議案件的審理。《行政復議法》及其實施條例均未禁止行政復議期間被申請人改變原具體行政行為。B選項的說法沒有法律根據，錯誤。《行政復議法實施條例》第57條第1款規定，行政復議期間行政復議機關發現被申請人或者其他下級行政機關的相關行政行為違法或者需要做好善後工作的，可以製作行政復議意見書。有關機關應當自收到行政復議意見書之日起60日內將糾正相關行政違法行為或者做好善後工作的情況通報行政復議機構。C選項正確。《行政復議法 》第1條規定，行政復議法的立法目的之一是“防止和糾正違法的或者不當的具體行政行為”，因此行政復議可以對具體行政行為的合法性和合理性進行審查，行政訴訟一般只審查具體行政行為的合法性，只有在特定情況下（行政處罰明顯不當或行政行為涉及對款額的確定、認定確有錯誤）才審查合理性。D選項錯誤。"}, {"id": "卷一-5", "subject": "卷一", "type": "單選題", "question": "關於犯罪嫌疑人、被告人逃匿、死亡案件違法所得的沒收程序，下列哪一說法是正確的？（）", "options": [{"key": "A", "text": "貪污賄賂犯罪案件的犯罪嫌疑人潛逃，通緝1年後不能到案的，依照《刑法》規定應當追繳其違法所得及其他涉案財產的，公安機關可以向法院提出沒收違法所得的申請"}, {"key": "B", "text": "在A選項所列情形下，檢察院可以向法院提■沒收違法所得的申請"}, {"key": "C", "text": "沒收違法所得及其他涉案財產的申請，由犯罪地的基層法院組成合議庭進行審理專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 2"}, {"key": "D", "text": "沒收違法所得案件審理中，在逃犯罪嫌疑人被抓獲的，法院應當中止審理"}], "answer": ["B"], "explanation_full": "【羿文解析】《刑事訴訟法》第五編第四章規定了“犯罪嫌疑人、被告人逃匿、死亡案件違法所得的沒收程序”。《刑事訴訟法》第298條第1款規定：“對於貪污賄賂犯罪、恐怖活動犯罪等重大犯罪案件，犯罪嫌疑人、被告人逃匿，在通緝一年後不能到案，或者犯罪嫌疑人、被告人死亡，依照刑法規定應當追繳其違法所得及其他涉案財產的，人民檢察院可以向人民法院提出沒收違法所得的申請。”故A選項錯誤，申請主體應為人民檢察院，B選項正確。第299條第1款規定：“沒收違法所得的申請，由犯罪地或者犯罪嫌疑人、被告人居住地的中級人民法院組成合議庭進行審理。”故C項由基層法院審理錯誤。第301條第1款規定：“在審理過程中，在逃的犯罪嫌疑人、被告人自動投案或者被抓獲的，人民法院應當終止審理。”故D項“中止審理”表述錯誤。綜上，本題正確答案為B。"}, {"id": "卷一-6", "subject": "卷一", "type": "單選題", "question": "秦始皇時期，某地有甲乙兩家相鄰而居，但積怨甚深。有一天，該地發生了一起搶劫殺人案件，乙遂向官府告發系甲所為。甲遭逮捕並被定為死罪。不久案犯被捕獲，始知甲無辜系被乙誣告。依據秦律，誣告者乙應獲下列哪種刑罰？（　）", "options": [{"key": "A", "text": "死刑"}, {"key": "B", "text": "遷刑"}, {"key": "C", "text": "城旦舂"}, {"key": "D", "text": "笞一百"}], "answer": ["A"], "explanation_full": "【羿文解析】秦律規定，故意捏造事實與罪名誣告他人，即構成誣告罪。誣告者實行反坐原則，即以被誣告人所受的處罰，反過來制裁誣告者。本題案例中甲被乙誣告而被定為死罪，根據秦代誣告反坐的刑罰適用原則，對乙應以甲被判處的刑罰加以制裁，即乙應當被判處死刑。故本題選A。"}, {"id": "卷一-7", "subject": "卷一", "type": "單選題", "question": "關於憲法實施，下列哪一選項是不正確的？（　　）", "options": [{"key": "A", "text": "憲法的遵守是憲法實施最基本的形式"}, {"key": "B", "text": "制度保障是憲法實施的主要方式"}, {"key": "C", "text": "憲法解釋是憲法實施的一種方式"}, {"key": "D", "text": "憲法適用是憲法實施的重要途徑"}], "answer": ["B"], "explanation_full": "【羿文解析】憲法的實施是指憲法規範在現實生活中的貫徹落實，使憲法規範的內容轉化為具體社會關係中的人的行為。憲法的實施主要包括：憲法的執行、憲法的適用、憲法的遵守。憲法的遵守既是憲法實施最基本的要求，也是憲法實施最基本的方式。A項正確。憲法適用不僅是憲法實施的重要途徑，也是法治國家加強憲政建設、樹立憲法權威的重要內容。D項正確。憲法解釋是憲法適用的必然環節和內在要素，因為有權機關必須先解釋憲法規範的意義才能將之適用於具體事件，因此，憲法解釋是憲法實施的一種方式。C項正確。對於B項，制度保障是憲法實施保障機制的重要方面，而非憲法實施的方式，更不能說是主要方式，B項錯誤。 綜上，本題答案為B項。"}, {"id": "卷一-8", "subject": "卷一", "type": "單選題", "question": "根據我國《律師法》的規定，下列哪一選項是正確的？（　　）", "options": [{"key": "A", "text": "律師事務所變更名稱、負責人、章程、合夥協議的，應當報原審核部門備案"}, {"key": "B", "text": "律師服務機構一般釆用公司形式，但在經濟社會發展欠發達地區仍可保留少數合作制律師事務所"}, {"key": "C", "text": "個人律師事務所實行無限責任，因此在成立條件上比合夥律師事務所要寬鬆"}, {"key": "D", "text": "律師事務所釆用特殊的普通合夥形式的，當個別合夥人因故意或重大過失造成對外債務時，其他合夥人不承擔對外責任"}], "answer": ["D"], "explanation_full": "【羿文解析】《律師法》第21條規定，律師事務所變更名稱、負責人、章程、合夥協議的，應當報原審核部門批准。律師事務所變更住所、合夥人的，應當自變更之日起15日內報原審核部門備案。故A項說法錯誤。 3 B項說法錯誤，律師事務所可以是合夥形式或個人律師事務所。C項說法錯誤，設立個人律師事務所除滿足一般律師事務所的條件外，設立人還應當是具有5年以上執業經歷的律師。本題的正確答案為D。"}, {"id": "卷一-9", "subject": "卷一", "type": "單選題", "question": "關於法律漏洞及其填補，下列表述正確的有？（）", "options": [{"key": "A", "text": "法律漏洞專指法律沒有規定的情形，包括顯性漏洞和隱性漏洞"}, {"key": "B", "text": "目的論擴張是擴大解釋的另一種說法"}, {"key": "C", "text": "無論是目的論擴張還是目的論限縮，都需要進行充分的論證"}, {"key": "D", "text": "目的論擴張往往需要進行內部證成，目的論限縮往往需要進行外部證成"}], "answer": ["C"], "explanation_full": "【羿文解析】法律漏洞可以從不同的角度進行分類，比如，根據漏洞產生的時間，可以將法律漏洞分為自始漏洞和嗣後漏洞；根據漏洞的表現形式，可以將法律漏洞分為顯性漏洞和隱形漏洞，不僅僅只包括顯性漏洞和隱形漏洞。A項錯誤。目的論擴張與擴大解釋不同，目的論擴張脫離了“原詞語”的限制，旨在擴大法條涵蓋的案件類型。B項錯誤。無論是目的論擴張還是目的論限縮，都需要針對立法目的以及案件類型是否能被立法目的所包含進行論證。C項正確。無論是目的論擴張還是目的論限縮，由於都對現有法律規定作出了“改造 ”，並需要論證特定的案件類型是否符合立法目的，因此，都需要藉助外在的參照標準，都側重使用外部證成（當然，也都會涉及內部證成，只不過不是側重點）。D項錯誤。"}, {"id": "卷一-10", "subject": "卷一", "type": "單選題", "question": "關於堅持黨對全面依法治國的領導，下列哪一選項是不正確的（　）", "options": [{"key": "A", "text": "黨的領導是推進全面依法治國的根本保證"}, {"key": "B", "text": "黨的領導和依法治國高度統一，必須堅持黨的領導、人民當家作主、依法治國有機統一"}, {"key": "C", "text": "要堅持黨領導立法、支持執法、保證司法、帶頭守法，健全黨領導全面依法治國的制度和工作機制"}, {"key": "D", "text": "堅持依法治國和依規治黨有機統一，確保黨既依據憲法法律治國理政，又依據黨內法規管黨治黨、從嚴治黨"}], "answer": ["C"], "explanation_full": "【羿文解析】堅持黨對全面依法治國的領導。黨的領導是推進全面依法治國的根本保證，是中國特色社會主義法治之魂。黨的領導和依法治國高度統一，必須堅持黨的領導、人民當家作主、依法治國有機統一。全面依法治國決不是要削弱黨的領導，而是要加強和改善黨的領導，不斷提高黨領導全面依法治國的能力和水平 ，鞏固黨的執政地位。要堅持黨領導立法、保證執法、支持司法、帶頭守法，健全黨領導全面依法治國的制度和工作機制，推進黨的領導制度化、法治化，通過法治保障黨的路線方針政策有效實施。堅持依法治國和依規治黨有機統一，確保黨既依據憲法法律治國理政，又依據黨內法規管黨治黨、從嚴治黨。綜上所述，A、 B、D項正確，C項錯誤。"}, {"id": "卷一-11", "subject": "卷一", "type": "單選題", "question": "村民陳某在本村建一住宅。鎮政府認定其非法占用土地，違反《土地管理法》，作出拆除房屋、退還土地的決定，隨後將房屋強制拆除。陳某向法院提起訴訟，請求撤銷鎮政府的決定、確認拆除行為違法。關於鎮政府的權力，下列哪一選項是正確的？（　　）", "options": [{"key": "A", "text": "有權作出拆除決定,但無權強制執行"}, {"key": "B", "text": "有權作出拆除決定,也有權強制執行"}, {"key": "C", "text": "無權作出拆除決定,也無權強制執行"}, {"key": "D", "text": "無權作出拆除決定,但可以強制執行"}], "answer": ["C"], "explanation_full": "4 單位或者個人對責令限期拆除的行政處罰決定不服的，可以在接到責令限期拆除決定之日起15日內，向人民法院起訴；期滿不起訴又不自行拆除的，由作出處罰決定的機關依法申請人民法院強制執行，費用由違法者承擔。可見，縣農業農村主管部門作出限期拆除決定之後，陳某既不履行又不起訴的，應由縣農業農村主管部門申請人民法院強制執行，而無權自行強制執行，鎮政府更無權強制執行。據此，正確答案為C。"}, {"id": "卷一-12", "subject": "卷一", "type": "單選題", "question": "《中華人民共和國著作權法》第4條規定，著作權人和與著作權有關的權利人行使權利，不得違反憲法和法律，不得損害公共利益。國家對作品的出版、傳播依法進行監督管理。關於該條文，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "規定了否定式的法律後果"}, {"key": "B", "text": "沒有規定假定條件"}, {"key": "C", "text": "規定了勿為模式"}, {"key": "D", "text": "屬於非規範性條文"}], "answer": ["C"], "explanation_full": "【羿文解析】該條文並沒有規定法律後果，因此A項錯誤。“著作權人和與著作權有關的權利人行使權利 ”，這屬於假定條件，因此B項錯誤。“不得違反憲法和法律，不得損害公共利益”，這屬於勿為模式。因此 C項正確。法律條文分為規範性條文和非規範性條文，規範性條文直接表述法律規則和法律原則，而非規範性條文則規定法律技術內容，例如專門法律術語的界定。該條文表述法律規則，屬於規範性條文，因此D項錯誤 。"}, {"id": "卷一-13", "subject": "卷一", "type": "單選題", "question": "徐方因貪污罪被K市監察委立案調查，在調查期間，徐方逃往澳大利亞，K市檢察院按照缺席審判程序向 K市中級人民法院提起公訴。下列關於該案的說法，正確的是：（）", "options": [{"key": "A", "text": "K市中級人民法院在庭前審查階段和庭審後，發現不構成貪污罪，而構成職務侵占罪，均應退回K市檢察院"}, {"key": "B", "text": "K市中級人民法院立案後，應當將傳票和起訴書副本送達被告人及其近親屬"}, {"key": "C", "text": "徐方在澳大利亞委託律師擔任辯護人，只能委託中國的執業律師，而且應當依照相關規定對授權委託進行公證、認證"}, {"key": "D", "text": "徐方的近親屬參加訴訟，有權申請證人、鑒定人出庭，並做最後陳述"}], "answer": ["C"], "explanation_full": "【羿文解析】依據《刑訴解釋》第599條的規定，法院對檢察院按照對境外的被告人缺席審判程序提起公訴的案件，在庭前審查後，認為不屬於可以適用缺席審判程序的案件範圍、不屬於本院管轄或者不符合缺席審判程序的其他適用條件的，應當退回人民檢察院。依據《刑事訴訟法》第291條第1款的規定，對境外的被告人的缺席審判只適用於貪污賄賂犯罪案件、危害國家安全犯罪案件、恐怖活動犯罪案件，本題A項中的職務侵占罪不屬於該案件範圍，所以，法院應當退回檢察院。但是，依據《刑訴解釋》第604條的規定，法院對境外的被告人缺席的案件審理後，認定的罪名不屬於《刑事訴訟法》第291條第1款規定的罪名的，應當終止審理。 所以，A項的錯誤在於，在庭審中發現徐方不構成貪污罪，而構成職務侵占罪，應終止審理，而不是退回K市檢察院。 依據《刑訴解釋》第600條的規定，對人民檢察院依照《刑事訴訟法》第291條第1款的規定提起公訴的案件 ，人民法院立案後，應當將傳票和起訴書副本送達被告人；應當將起訴書副本送達被告人近親屬。所以，B項的錯誤在於，法院無需將傳票送達被告人徐方的近親屬。 《刑訴解釋》第601條第1款規定，人民法院審理人民檢察院依照《刑事訴訟法》第291條第1款的規定提起公訴的案件，被告人有權委託或者由近親屬代為委託一至二名辯護人。委託律師擔任辯護人的，應當委託具有中華人民共和國律師資格並依法取得執業證書的律師；在境外委託的，應當依照本解釋第486條的規定對授權委託進行公證、認證。適用此法條可知，C項正確。 《刑訴解釋》第603條規定，人民法院審理人民檢察院依照《刑事訴訟法》第291條第1款的規定提起公訴的案件，參照適用公訴案件第一審普通程序的有關規定。被告人的近親屬參加訴訟的，可以發表意見，出示證據 ，申請法庭通知證人、鑒定人等出庭，進行辯論。故D項的錯誤在於，被告人徐方的近親屬參見訴訟，沒有最後陳述權。 5"}, {"id": "卷一-14", "subject": "卷一", "type": "單選題", "question": "下列哪一選項屬於違反律師或公證有關制度及執業規範規定的情形？（　　）", "options": [{"key": "A", "text": "劉律師受當事人甲委託為其追索1萬元欠款，因該事項與另一委託事項時間衝突，經甲同意後另交本所律師辦理，但未告其支出增加"}, {"key": "B", "text": "李律師承辦當事人乙的繼承糾紛案，表示乙依法可以繼承2間房屋，並作為代理意見提交法庭，未被釆納 ，乙僅分得萬元存款"}, {"key": "C", "text": "林公證員對丙以貴重金飾用於抵押的事項，辦理了抵押登記"}, {"key": "D", "text": "王公證員對丁代理他人申辦合同和公司章程公證的事項，出具了公證書"}], "answer": ["A"], "explanation_full": "【羿文解析】律師接受當事人委託後，如果由於精力有限或特殊緊急情況不能及時完成當事人的委託事項 ，可以在徵得當事人同意的情況下交由其他適當人選來辦理，但是應當與委託人通報和溝通相關情況，故A項中未告知支出增加的情況不適當。B項中的律師根據對法律和事實的理解提交了代理意見，但未得到支持不屬於違反執業規範的情形；根據《公證機構辦理抵押登記辦法》的規定，金銀珠寶是可以向公證機關辦理抵押登記的，C項中林公證員的行為不存在違規的情況。代理他人申辦合同和公司章程也屬於可以辦理公證的事項 ，D項中王公證員的行為無不妥之處。"}, {"id": "卷一-15", "subject": "卷一", "type": "單選題", "question": "M市N區公安局警察張三涉嫌刑訊逼供罪被檢察院立案偵查，在偵■中，發現張三還涉嫌受賄罪，下列關於該案管轄的表述，正確的是：（）", "options": [{"key": "A", "text": "M市檢察院根據張三刑訊逼供案件的情況應將該案交由N區檢察院立案偵查"}, {"key": "B", "text": "若最高人民檢察院發現張三涉嫌刑訊逼供罪的線索，可以自行立案偵查，也可以將犯罪線索交由指定的M市檢察院立案偵查"}, {"key": "C", "text": "M市檢察院在偵■中發現張三還涉嫌受賄罪，與M市監察委員會溝通後，認為刑訊逼供罪是主罪，由M市檢察院對張三的刑訊逼供罪和受賄罪並案偵查"}, {"key": "D", "text": "M市檢察院在與M市監察委員會溝通時，可暫停對刑訊逼供罪的偵查"}], "answer": ["B"], "explanation_full": "【羿文解析】《高檢規則》第14條規定，人民檢察院辦理直接受理偵查的案件，由設區的市級人民檢察院立案偵查。基層人民檢察院發現犯罪線索的，應當報設區的市級人民檢察院決定立案偵查。設區的市級人民檢察院根據案件情況也可以將案件交由基層人民檢察院立案偵查，或者要求基層人民檢察院協助偵查。對於刑事執行派出檢察院轄區內與刑事執行活動有關的犯罪線索，可以交由刑事執行派出檢察院立案偵查。最高人民檢察院、省級人民檢察院發現犯罪線索的，可以自行立案偵查，也可以將犯罪線索交由指定的省級人民檢察院或者設區的市級人民檢察院立案偵查。本題A項中，M市檢察院根據張三刑訊逼供案件的情況可以將該案交由N區檢察院立案偵查，或者要求N區檢察院協助偵查，A項表述太絕對，錯誤。B項中，若最高人民檢察院發現張三涉嫌刑訊逼供罪的線索，可以自行立案偵查，也可以將犯罪線索交由指定的M市檢察院立案偵查。這一表述正確。 《高檢規則》第17條規定，人民檢察院辦理直接受理偵查的案件，發現犯罪嫌疑人同時涉嫌監察機關管轄的職務犯罪線索的，應當及時與同級監察機關溝通。經溝通，認為全案由監察機關管轄更為適宜的，人民檢察院應當將案件和相應職務犯罪線索一併移送監察機關；認為由監察機關和人民檢察院分別管轄更為適宜的 ，人民檢察院應當將監察機關管轄的相應職務犯罪線索移送監察機關，對依法由人民檢察院管轄的犯罪案件繼續偵查。人民檢察院應當及時將溝通情況報告上一級人民檢察院。溝通期間不得停止對案件的偵查。本題 C項的錯誤在於，M市檢察院與M市監察委員會溝通後，要麼將全案一併移送監察機關，要麼將受賄的犯罪線索移送監察機關，對刑訊逼供罪繼續偵查，而不能由M市檢察院對張三的刑訊逼供罪和受賄罪並案偵查。D項的錯誤在於，M市檢察院在與M市監察委員會溝通期間，不得停止對刑訊逼供案的偵查。"}, {"id": "卷一-16", "subject": "卷一", "type": "單選題", "question": "未成年人小蔡和其父親老蔡共同販賣淫穢光盤，公安機關在立案後，小蔡被取保候審，老蔡被檢察院批准逮捕。關於該案訴訟程序的說法，下列哪一選項是正確的？（）", "options": [{"key": "A", "text": "檢察院審■批捕小蔡和老蔡時，都應訊問兩位犯罪嫌疑人專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 6"}, {"key": "B", "text": "檢察院在對小蔡作出附條件不起訴時，應該徵得老蔡同意"}, {"key": "C", "text": "對小蔡作出附條件不起訴的同時，可以禁止其進入娛樂場所"}, {"key": "D", "text": "檢察院對小蔡和老蔡分案起訴，則應由不同的審判組織審理"}], "answer": ["C"], "explanation_full": "【羿文解析】《高檢規則》第280條中規定：“人民檢察院辦理審查逮捕案件，可以訊問犯罪嫌疑人；具有下列情形之一的，應當訊問犯罪嫌疑人：（一）對是否符合逮捕條件有疑問的；（二）犯罪嫌疑人要求向檢察人員當面陳述的；（三）偵查活動可能有重大違法行為的；（四）案情重大、疑難、複雜的；（五）犯罪嫌疑人認罪認罰的；（六）犯罪嫌疑人系未成年人的；（七）犯罪嫌疑人是盲、聾、啞人或者是尚未完全喪失辨認或者控制自己行為能力的精神病人的。”本題中，小蔡是未成年人，老蔡是成年人，檢察院對小蔡審查批捕時，應當訊問小蔡，對老蔡不是必須應當訊問。故A項錯誤。 儘管《高檢規則》第469條第2款規定：“人民檢察院在作出附條件不起訴的決定以前，應當聽取公安機關、 被害人、未成年犯罪嫌疑人及其法定代理人、辯護人的意見，並製作筆錄附卷。”《刑事訴訟法》第282條第 3款規定：“未成年犯罪嫌疑人及其法定代理人對人民檢察院決定附條件不起訴有異議的，人民檢察院應當作出起訴的決定。”但是，本題中，老蔡和小蔡是同案犯，二者有利害關係，所以，檢察院在對小蔡作出附條件不起訴時，無需徵得老蔡同意。故B項錯誤。 《高檢規則》第476條規定：“人民檢察院可以要求被附條件不起訴的未成年犯罪嫌疑人接受下列矯治和教育 ：（一）完成戒癮治療、心理輔導或者其他適當的處遇措施；（二）向社區或者公益團體提供公益勞動 ；（三）不得進入特定場所，與特定的人員會見或者通信，從事特定的活動；（四）向被害人賠償損失、賠禮道歉等；（五）接受相關教育；（六）遵守其他保護被害人安全以及預防再犯的禁止性規定。”本題中 ，對小蔡作出附條件不起訴的同時，禁止其進入娛樂場所，屬於上述第3項的規定。故C項正確。 《刑訴解釋》第551條第1款規定：“對分案起訴至同一人民法院的未成年人與成年人共同犯罪案件，可以由同一個審判組織審理；不宜由同一個審判組織審理的，可以分別審理。”故D項表述過於絕對，表述錯誤。"}, {"id": "卷一-17", "subject": "卷一", "type": "單選題", "question": "甲市乙區公安分局以孫某涉嫌詐騙罪為由將其刑事拘留，並經乙區檢察院批准逮捕。後因案情特殊由丙區檢察院提起公訴。2006年，丙區法院判處孫某有期徒刑3年，孫某不服上訴，甲市中級法院裁定發回丙區法院重新審理。重審期間，丙區檢察院經准許撤回起訴，並最終作出不起訴決定。孫某申請國家賠償。關於賠償義務機關，下列哪一選項是正確的？（）", "options": [{"key": "A", "text": "乙區公安分局、乙區檢察院和丙區法院"}, {"key": "B", "text": "乙區公安分局、丙區檢察院和丙區法院"}, {"key": "C", "text": "丙區檢察院和丙區法院"}, {"key": "D", "text": "丙區法院"}], "answer": ["D"], "explanation_full": "【羿文解析】根據《國家賠償法》第21條第4款的規定，二審改判無罪，以及二審發回重審後作無罪處理的 ，作出一審有罪判決的人民法院為賠償義務機關。關於刑事賠償義務機關的規定，是《國家賠償法》的重要內容。《國家賠償法》在確定刑事賠償義務機關時遵循的一個基本原則是，案件在刑事訴訟過程中的哪一個階段、哪一個機關最後作出侵犯受害人合法權益的決定，該機關即為賠償義務機關。本題屬於“二審發回重審後作無罪處理”的情形，根據《國家賠償法》的規定，應當由作出一審有罪判決的丙區法院作為賠償義務機關。故D項正確。"}, {"id": "卷一-18", "subject": "卷一", "type": "單選題", "question": "關於法律解釋和法律推理，下列哪一說法可以成立？（　　）", "options": [{"key": "A", "text": "作為一種法律思維活動，法律推理的根本目的在於發現絕對事實和真相"}, {"key": "B", "text": "法律解釋和法律推理屬於完全不同的兩種思維活動，法律推理完全獨立於法律解釋"}, {"key": "C", "text": "法官在進行法律推理時，既要遵守和服從法律規則又要在不同利益衝突間進行價值平衡和選擇"}, {"key": "D", "text": "法律推理是嚴格的形式推理，不受人的價值觀影響"}], "answer": ["C"], "explanation_full": "7 尋求正當性證明的推理。法律推理的核心主要是為行為規範或人的行為是否正確或妥當提供正當理由。故A錯 。法律解釋和法律推理往往相互交織，法律推理的過程中要涉及法律解釋，法律解釋也包含著一定的法律推理，兩者並不是完全獨立的。故B錯。法律推理不僅包括嚴格的形式推理，也包括辯證推理，後者具有明顯的價值取向性，要受到人的價值觀影響。故D錯。C項表述正確。"}, {"id": "卷一-19", "subject": "卷一", "type": "單選題", "question": "關於中國古代的繼承制度，下列說法哪一選項是正確的？（）", "options": [{"key": "A", "text": "西周時期主張“以德配天、明德慎罰”，強調統治者的“德”性的後果之一便是在繼承問題上主張“立嫡以賢不以長”"}, {"key": "B", "text": "西周時期的繼承主要是財產的繼承，此外還包括政治身份的繼承"}, {"key": "C", "text": "宋代的繼承制度比較靈活，沿襲了遺產兄弟均分制，還允許在室女享受部分財產繼承權"}, {"key": "D", "text": "宋代的繼承制度規定，在存在遺腹子的情況下，親生子享有3/4的財產繼承權，遺腹子享有1/4的財產繼承權"}], "answer": ["C"], "explanation_full": "【羿文解析】西周時期采行的是嫡長子繼承制，即“立嫡以長不以賢，立子以貴不以長”。王位的繼承人必須是正妻所生的長子，不論其賢愚。所以，A項錯誤。就繼承的內容而言，主要是政治身份的繼承，土地、財產的繼承是其次。B項錯誤。宋代的繼承制度比較靈活，除沿襲以往遺產兄弟均分制外，還允許在室女享受部分財產繼承權，同時承認遺腹子與親生子享有同樣的繼承權。因此，C項正確，D項錯誤。"}, {"id": "卷一-20", "subject": "卷一", "type": "單選題", "question": "關於興奮劑有關犯罪行為，下列哪一說法錯誤？（）", "options": [{"key": "A", "text": "對殘疾人運動員負有監護、看護職責的教練員甲長期強迫多名殘疾人運動員在各項國家體育競賽中非法使用興奮劑，構成虐待被監護人、看護人罪"}, {"key": "B", "text": "長跑運動員的教練乙走私興奮劑目錄所列物質，準備讓該運動員在國際重大賽事中使用，事後查明涉案物質屬於國家禁止進出口的貨物、物品，乙的行為構成走私國家禁止進出口的貨物、物品罪"}, {"key": "C", "text": "商販丙多次向多名運動員出售法律規定限制買賣的含興奮劑物質，構成銷售有毒、有害食品罪"}, {"key": "D", "text": "國家機關工作人員丁在行使反興奮劑管理職權時濫用職權，造成嚴重興奮劑違規事件，嚴重損害國家聲譽 ，構成濫用職權罪"}], "answer": ["C"], "explanation_full": "【羿文解析】本題考查《興奮劑解釋》中的有關規定。 A項正確。《興奮劑解釋》第3條規定，“對未成年人、殘疾人負有監護、看護職責的人組織未成年人、殘疾人在體育運動中非法使用興奮劑，具有下列情形之一的，應當認定為刑法第二百六十條之一規定的'情節惡劣 ’，以虐待被監護、看護人罪定罪處罰：（一）強迫未成年人、殘疾人使用的；（二）引誘、欺騙未成年人 、殘疾人長期使用的；（三）其他嚴重損害未成年人、殘疾人身心健康的情形”。 B項正確。《興奮劑解釋》第1條第1款規定，“運動員、運動員輔助人員走私興奮劑目錄所列物質，或者其他人員以在體育競賽中非法使用為目的走私興奮劑目錄所列物質，涉案物質屬於國家禁止進出口的貨物、物品 ，具有下列情形之一的，應當依照刑法第一百五十一條第三款的規定，以走私國家禁止進出口的貨物、物品罪定罪處罰：（一）一年內曾因走私被給予二次以上行政處罰後又走私的；（二）用於或者準備用於未成年人運動員、殘疾人運動員的；（三）用於或者準備用於國內、國際重大體育競賽的；（四）其他造成嚴重惡劣社會影響的情形”。 C項錯誤。《興奮劑解釋》第2條規定：“違反國家規定，未經許可經營興奮劑目錄所列物質，涉案物質屬於法律、行政法規規定的限制買賣的物品，擾亂市場秩序，情節嚴重的，應當依照刑法第二百二十五條的規定 ，以非法經營罪定罪處罰。”該解釋第5條規定：“生產、銷售含有興奮劑目錄所列物質的食品，符合刑法第一百四十三條、第一百四十四條規定的，以生產、銷售不符合安全標準的食品罪、生產、銷售有毒、有害食品罪定罪處罰。”本案中，由於丙並未銷售食品，僅銷售含興奮劑物質，因此丙的行為構成非法經營罪，如果丙銷售的是含有興奮劑物質的食品，則可能構成銷售有毒、有害食品罪。 8 定的，以濫用職權罪、玩忽職守罪定罪處罰。”"}, {"id": "卷一-21", "subject": "卷一", "type": "單選題", "question": "2018年進行了憲法修正，將1982年憲法第70條第1款中“法律委員會”修改為“憲法和法律委員會”。關於憲法和法律委員會，下列哪個選項是正確的？（　　）", "options": [{"key": "A", "text": "成員人選由全國人大主席團在全國人大代表中決定"}, {"key": "B", "text": "為全國人大常委會設立的專門委員會"}, {"key": "C", "text": "統一審議向全國人大或其常委會提出的法律草案"}, {"key": "D", "text": "為合憲性審查的專門機關"}], "answer": ["C"], "explanation_full": "【羿文解析】全國人大各專門委員會的主任委員、副主任委員和委員的人選，由主席團在代表中提名，大會通過。在大會閉會期間，全國人大常委會可以補充任命專門委員會的個別副主任委員和部分委員，由委員長會議提名，常務委員會會議通過。據此，憲法和法律委員會成員人選由全國人大或其常委會決定，而非由全國人大主席團決定，故A項錯誤。憲法和法律委員會由全國人大設立，而非全國人大常委會設立，故B項錯誤 。根據《全國人民代表大會常務委員會關於全國人民代表大會憲法和法律委員會職責問題的決定》，憲法和法律委員會在繼續承擔統一審議法律草案等工作的基礎上，增加推動憲法實施、開展憲法解釋、推進合憲性審查、加強憲法監督、配合憲法宣傳等工作職責。故C項正確。憲法和法律委員會有推進合憲性審查的工作職責，但並非專門的合憲性審查機關，僅享有提出、研究、審議和擬訂有關議案的權限，不具有獨立決定權。 故D項錯誤。"}, {"id": "卷一-22", "subject": "卷一", "type": "單選題", "question": "蘇某和熊某毗鄰而居。熊某在其居住樓頂為50隻鴿子搭建了一座鴿舍。蘇某以養鴿行為嚴重影響居住環境為由，將熊某訴至法院，要求熊某拆除鴿棚，賠禮道歉。法院判定原告訴求不成立。關於本案，下列哪一判斷是錯誤的？（）", "options": [{"key": "A", "text": "本案涉及的是安居權與養鴿權之間的衝突"}, {"key": "B", "text": "從案情看，蘇某的安居權屬於憲法所規定的文化生活權利"}, {"key": "C", "text": "從判決看，解決權利衝突首先看一個人在行使權利的同時是否造成對他人權利的實際侵害"}, {"key": "D", "text": "本案表明，權利的行使與義務的承擔相關聯"}], "answer": ["B"], "explanation_full": "【羿文解析】B項錯誤，憲法規定的文化生活權利，指的是科學研究、文學藝術創作和其他文化活動的自由 ，蘇某的安居權不在此列。D項正確，蘇某享有和行使安居權的同時，也負有尊重他人權利（養鴿權）的義務 ，在必要的範圍內負有容忍的義務。AC表述正確。綜上，本題的正確答案為B。"}, {"id": "卷一-23", "subject": "卷一", "type": "單選題", "question": "某市市場監督管理局發現，某中外合資遊戲軟件開發公司生產的一種軟件帶有暴力和色情內容，決定沒收該軟件，並對該公司處以三萬元罰款。中方投資者接受處罰，但外方投資者認為處罰決定既損害了公司的利益也侵害自己的權益，向法院提起行政訴訟。下列哪一選項是正確的？（）", "options": [{"key": "A", "text": "外方投資者只能以合資公司的名義起訴"}, {"key": "B", "text": "外方投資者可以自己的名義起訴"}, {"key": "C", "text": "法院受理外方投資者起訴後，應追加未起訴的中方投資者為共同原告"}, {"key": "D", "text": "外方投資者只能以保護自己的權益為由提起訴訟"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《行政訴訟法解釋》第16條第2款規定，聯營企業、中外合資或者合作企業的聯營、合資、 9 加訴訟，而不能主動追加為原告。據此，本案中，外方投資者起訴而中方投資者未起訴，人民法院應當通知中方投資者作為第三人蔘加訴訟，而非追加其為原告。C項錯誤。"}, {"id": "卷一-24", "subject": "卷一", "type": "單選題", "question": "關於檢察官的行為，下列哪一觀點是正確的？", "options": [{"key": "A", "text": "張檢察官在同鄉聚會時向李法官打聽其在辦案件審理情況，並讓其估計判處結果。根據我國國情，張檢察官的行為可以被理解"}, {"key": "B", "text": "陳檢察長以暫停工作要挾何檢察官放棄個人意見，按照周科長的判斷處理某案。陳檢察長的行為與依法獨立行使檢察權的要求相一致"}, {"key": "C", "text": "蔡檢察官在本地香蕉滯銷，蕉農面臨重大損失時，多方奔走將10萬斤香蕉銷往外地，為蕉農輓回了損失 ，本人獲辛苦費5000元。蔡檢察官沒有違反有關經商辦企業、違法違規營利活動的規定"}, {"key": "D", "text": "張檢察官從檢察院離任4年後，以律師身份擔任各類案件的訴訟代理人或者辯護人，受到當事人及其家屬的一致肯定。張檢察官的行為符合《檢察官法》的有關規定"}], "answer": ["D"], "explanation_full": "【羿文解析】檢察官不得干預其他司法機關辦案，而張檢察官向許法官打聽未決案件的結果違反了該規定 ，故A選項錯誤。B選項中陳檢察長的做法違反了司法獨立原則，故B選項錯誤。根據《檢察官法》的規定，檢察官不得從事營利性的經營活動，C屬於從事營利性的經營活動，故C選項錯誤。檢察官從檢察院離任2年後 ，就可以律師身份擔任各類案件的訴訟代理人或者辯護人。本題中已經4年，過了2年的限制，故D選項正確。"}, {"id": "卷一-25", "subject": "卷一", "type": "單選題", "question": "下列哪一個法律文件是中國近現代歷史上第一部憲法性文件？", "options": [{"key": "A", "text": "《重大信條十九條》"}, {"key": "B", "text": "《欽定憲法大綱》"}, {"key": "C", "text": "《中華民國約法》"}, {"key": "D", "text": "《中華蘇維埃共和國憲法大綱》"}], "answer": ["B"], "explanation_full": "【羿文解析】清廷憲政編查館於1908年8月頒布了以君上大權為核心的《欽定憲法大綱》，是中國近代史上第一部憲法性文件，是中國歷史上第一次將君主的權力寫入了一個明確的文件，這本身就是對君主權力的限制 ；而且還破天荒地將民眾的權利作為附則寫入。《憲法重大信條十九條》是清政府於辛亥革命武昌起義爆發後拋出的又一個憲法性文件，其形式上被迫縮小了皇帝的權力，相對擴大了議會和總理的權力，但仍強調皇權至上，且對人民權利隻字未提，更暴露其虛偽性，也未能輓回清王朝的敗局。中華民國北京政府於1914年 5月1日公布的《中華民國約法》（袁記約法），共10章68條，受袁世凱一手操縱制定。它與《臨時約法》有著根本性的差別：其一，以根本法的形式徹底否定了《臨時約法》確立的民主共和制度，代之以個人獨裁 ；其二，用總統獨裁否定了責任內閣制；其三，用有名無實的立法院取消了國會制；其四，為限制、否定《 臨時約法》規定的人民基本權利提供了憲法根據。它是對《臨時約法》的反動，是軍閥專制全面確立的標誌 。《中華蘇維埃共和國憲法大綱》是1931年11月在江西瑞金由第一次全國蘇維埃代表大會通過的。因此，本題的正確答案是B。"}, {"id": "卷一-26", "subject": "卷一", "type": "單選題", "question": "習近平總書記強調，“全面推進依法治國，建設一支德才兼備的高素質法治隊伍至關重要。”下列哪一選項是不正確的？（）", "options": [{"key": "A", "text": "要把擁護中國共產黨領導、擁護我國社會主義法治作為法律服務人員從業的基本要求"}, {"key": "B", "text": "推進法治專門隊伍革命化、正規化、專業化、職業化"}, {"key": "C", "text": "全面推進依法治國，首先要把法律服務隊伍建設好"}, {"key": "D", "text": "加強教育、管理、引導，引導法律服務工作者堅持正確的政治方向，依法依規誠信執業，認真履行社會責任"}], "answer": ["C"], "explanation_full": "【羿文解析】全面推進依法治國，首先要把專門隊伍建設好。要加強理想信念教育，深入開展社會主義核心價值觀和社會主義法治理念教育，推進法治專門隊伍革命化、正規化、專業化、職業化，確保做到忠於黨、 10 忠於國家、忠於人民、忠於法律。對法治專門隊伍的管理必須堅持更嚴標準、更高要求。一些執法司法人員手握重器而不自重，貪贓枉法、徇私枉法，辦“金錢案”“權力案”“人情案”，嚴重損害法治權威。要制定完善鐵規禁令、紀律規定，用制度管好關鍵人、管到關鍵處、管住關鍵事。要堅決清查貪贓枉法、對黨不忠誠不老實的人，深查執法司法腐敗。最近，政法系統開展隊伍教育整頓試點工作，查處了一批害群之馬 ，得到廣大群眾好評。要鞏固和擴大試點工作成果，堅持零容忍，敢於刀刃向內、刮骨療毒。法律服務隊伍是全面依法治國的重要力量。總體而言，這支隊伍是好的，但也存在不少問題，有的熱衷於“揚名逐利 ”，行為不端、誠信缺失、形象不佳；極個別法律從業人員政治意識淡薄，甚至惡意攻擊我國政治制度和法治制度。要把擁護中國共產黨領導、擁護我國社會主義法治作為法律服務人員從業的基本要求，加強教育、 管理、引導，引導法律服務工作者堅持正確政治方向，依法依規誠信執業，認真履行社會責任，滿腔熱忱投入社會主義法治國家建設。要推進法學院校改革發展，提高人才培養質量。要加大涉外法學教育力度，重點做好涉外執法司法和法律服務人才培養、國際組織法律人才培養推送工作，更好服務對外工作大局。綜上所述，A、B、D項正確，C項錯誤。"}, {"id": "卷一-27", "subject": "卷一", "type": "單選題", "question": "關乾堅持依憲治國、依憲執政，下列說法錯誤的是∶", "options": [{"key": "A", "text": "依憲治國、依憲執政是建設社會主義法治國家的本質要求"}, {"key": "B", "text": "堅持依法治國首先要堅持依憲治國，堅持依法執政首先要堅持依憲執政"}, {"key": "C", "text": "堅持依憲治國、依憲執政，要堅持憲法確定的中國共產黨領導地位不動搖，堅持憲法確定的人民民主專政的國體和人民代表大會制度的政體不動搖"}, {"key": "D", "text": "將全國人大法律委員會更名為全國人大憲法和法律委員會，增加推動憲法實施、開展憲法解釋、推進合憲性審查、加強憲法監督、配合憲法宣傳等工作職責"}], "answer": ["A"], "explanation_full": "【羿文解析】A項錯誤，依憲治國依憲執政是首要任務。十一個堅持是一個科學系統的思想體系，所以要注意每—個堅持與其定位的匹配性。"}, {"id": "卷一-28", "subject": "卷一", "type": "單選題", "question": "李某在耕地上擅自建房，縣土地局對其罰款500元，李某不服，提起訴訟，下列說法錯誤是", "options": [{"key": "A", "text": "本案的起訴期為3個月"}, {"key": "B", "text": "因起訴狀內容欠缺而通知原告限期補正的，審理期從補正後遞交法院的次日起算"}, {"key": "C", "text": "審理當事人提出的管轄異議不計算在審理期限內"}, {"key": "D", "text": "當事人申請延長舉證期限，應當在舉證期限屆滿前向法院提出書面申請"}], "answer": ["A"], "explanation_full": "【羿文解析】A項錯誤，行政訴訟的起訴期為六個月。B項正確，因起訴狀內容欠缺或者有其他錯誤通知原告期限補正的，從補正後遞交法院的次日起算。C項正確，審理當事人提出管轄權異議不計算在審理期限內。 D項正確，申請延長舉證期限，應當在舉證期限屆滿前向法院提出書面申請。"}, {"id": "卷一-29", "subject": "卷一", "type": "單選題", "question": "甲經常開車購買某工廠的廢鋁料。甲事先向貨車的車廂底部夾層注了水（約50公斤），開到該工廠後，進行空車過磅，然後在裝運廢鋁料過程中悄悄將水放掉，在貨車裝滿廢鋁料後再次進行過磅。甲多次採取這種方法，後被該工廠驗磅人員發現，遂報案。下列說法正確的有", "options": [{"key": "A", "text": "甲構成盜竊罪"}, {"key": "B", "text": "甲構成詐騙罪"}, {"key": "C", "text": "甲構成盜竊罪的間接正犯"}, {"key": "D", "text": "甲構成詐騙罪的間接正犯"}], "answer": ["B"], "explanation_full": "【羿文解析】甲構成詐騙罪，B項正確。盜竊罪與詐騙罪的區別在於受騙人有無處分財物的行為和處分意識。 11 人與受害人是同一人。"}, {"id": "卷一-30", "subject": "卷一", "type": "單選題", "question": "關於拐賣婦女、兒童罪，下列說法不正確的是？（　）", "options": [{"key": "A", "text": "甲、乙二人出生於偏遠地區，在得知有人會花大價錢收買小孩，遂生育多名幼子再給需要小孩的家庭，收取一定的費用。甲、乙二人的行為構成拐賣兒童罪"}, {"key": "B", "text": "甲結婚多年未能生有孩子，於是萌生收養他人小孩的念頭。某日在大街上看到一抱著小孩的婦女，遂尾隨至偏僻小路將其擊昏，抱走小孩。甲抱走小孩的行為構成拐賣兒童罪"}, {"key": "C", "text": "甲單身多年討不到老婆，在得知同村的乙有外國\"渠道\"可以讓他挑選媳婦，價格1萬到10萬不等，後甲從乙處花5萬元娶得一越南女子。甲構成收買被拐賣婦女罪，乙構成拐賣婦女罪"}, {"key": "D", "text": "陶某明知杜某是\"兩性人\"，仍然揚賣來以高價賣給他人為妻。陶某的行為構成拐賣婦女罪"}], "answer": ["B"], "explanation_full": "【羿文解析】A項正確。最高人民法院最高人民檢察院公安部司法部印發《關於依法懲治拐賣婦女兒童犯罪的意見》的通知……具有下列情形之一的，可以認定屬於出賣親生子女，應當以拐賣婦女、兒童罪論處 ∶（1）將生育作為非法獲利手段，生育後即出賣子女的……因此，甲乙兩人生育多名幼子，賣出獲利的行為構成拐賣兒童罪。B項錯誤。甲抱走小孩的行為構成拐騙兒童罪。拐賣兒童罪是基於出賣目的（賣給別人用 ），拐騙兒童罪主要是基於收養等目的（騙來自己用，不想賣），使兒童脫離家庭或者監護的。故，單論抱走小孩的行為，因甲只有收養的故意，不構成拐賣兒童罪，定拐騙兒童罪。C項正確。拐賣婦女、兒童罪的行為對象不限於具有中國國籍的婦女和兒童，行為也不限於將境內婦女兒童賣往境外，還包括境外賣往境內。 D項正確。行為人拐賣兩性人的，仍然能夠成立拐賣婦女罪。因為兩性人既具備男性生理特徵也具備女性生理特徵，那就意味著，已經滿足了拐賣婦女罪裡面\"婦女\"這個要件，至於多出來的男性生理特徵部分，並不影響犯罪的認定。案件事實多於構成要件要素的，不影響構成要件符合性的判斷。綜上，B項當選。"}, {"id": "卷一-31", "subject": "卷一", "type": "單選題", "question": "關於組織出賣人體器官罪，下列哪項是正確的？（　）", "options": [{"key": "A", "text": "初中生甲（15周歲）為買革果手機在同學面前攀比，通過QQ群找乙去出賣自己的腎臟。最後乙花3萬元將甲一顆腎臟摘取並賣出，乙未收取任何中介費，將全部所得款交給甲，甲用該錢款買得最新款手機。乙的行為僅構成組織出賣人體器官罪"}, {"key": "B", "text": "某女大學生甲看到廁所中的收購卵子的小廣告，為迅速得到錢財，聯繫廣告上的乙出售了自己一顆卵子 ，得到4000元。乙收購卵子的行為構成組織出賣人體器官罪"}, {"key": "C", "text": "某醫院太平間看管人員甲，秘密建立了一個器官買賣交易所，專門從太平間挑選合適的屍體，摘取器官賣給迫切需要器官移植的病患及其家屬，進而從中獲取利益。甲的行為成立組織出賣人體器官罪"}, {"key": "D", "text": "醫生甲欺騙乙說將其肝臟捐獻給乙的好友丙，實際上捐獻給乙的仇人丁。甲的行為成立故意傷害罪"}], "answer": ["D"], "explanation_full": "【羿文解析】A項錯誤。乙的行為同時觸犯了組織出賣人體器官罪與故意傷害罪。摘取不滿十八周歲的人的器官，即使經過未成年人同意。也成立故意傷害罪。故意殺人罪。甲並未出現死亡結果。故乙的行為同時觸犯了組織出賣人體器官罪與故意傷害罪，從一重罪處罰。B項錯誤。乙的行為不屬於組織出賣人體器官罪。組織出賣人體器官罪的犯罪對象是人體器官，但卵子不屬於人體器官。《人體器官移植條例》採用狹義的器官定義，僅將器官限定在心臟、肺髒、肝臟、腎臟或者胰腺等器官的全部或者部分的範圍內。張明楷教授認為 ，本罪所指器官可以進而理解為一旦喪失會嚴重侵害被害人的身體健康的人體組織集合體。包括角膜、皮膚 、肢體、骨頭等，而血液、骨髓、脂肪、細胞等則不屬於器官範圍。單個卵子是一種生殖細胞，無法形成集合體。無論採用狹義說還是廣義說都難以將其定義為人體器官。勉強將其解釋為器官已超越人體器官的語義邊界，屬於違反罪刑法定原則的類推解釋，組織出賣卵子的行為不宜適用組織出賣人體器官罪。C項錯誤。甲的行為成立盜竊、侮辱、故意毀壞屍體罪。組織出賣人體器官罪的對象是活人的器官，而本題中，醫院太平間看管人員甲只是利用屍體的器官進行交易，不屬於組織出賣人體器官罪的犯罪對象。根據《刑法》第234條之一的第3款規定，甲的行為應當以盜竊、侮辱、故意毀壞屍體、屍骨、骨灰罪定罪處罰。D項正確。甲的行為構成故意傷害罪。乙雖然承諾了，但屬於被騙的承諾，其方向錯誤，甲的行為構成故意傷害罪。綜上，D項當選。 12"}, {"id": "卷一-32", "subject": "卷一", "type": "單選題", "question": "馮某來到某珠寶店，以買金項鏈為名，誘使營業員將金項鏈交其手中，戴在脖子上，讓營業員拿—個鏡子 。但假裝審視，並詢問站在櫃檯裡面的營業員是否好看。營業員回答很好看。馮某說那就要了，遂趁營業員不備，戴走迅速逃離。馮某的行為構成", "options": [{"key": "A", "text": "詐騙罪"}, {"key": "B", "text": "搶奪罪"}, {"key": "C", "text": "盜竊罪"}, {"key": "D", "text": "侵占罪"}], "answer": ["C"], "explanation_full": "【羿文解析】馮某試戴的時候，項鏈並沒有轉移占有，仍是營業員在占有，馮某將他人占有之物脫離控制據為己有，構成盜竊罪，C項正確。A項錯誤，馮某不構成詐騙罪，因為營業員並沒有處分項鏈，項鏈仍為營業員在占有。馮某也不構成搶奪罪，B項錯誤，因為轉移占有的方式比較平和，沒有暴力。馮某也不構成侵占罪 ，D項錯誤，因為項鏈仍為營業員在占有，是他人占有之物。"}, {"id": "卷一-33", "subject": "卷一", "type": "單選題", "question": "下列說法不正確的是？", "options": [{"key": "A", "text": "周建平在廣州註冊成立了廣州化探商務調查有限公司，並在此後多次以該公司網頁為平台，搜集、購買他人電話清單、身份資料等信息轉賣牟利。周建平的行為構成侵犯公民個人信息罪"}, {"key": "B", "text": "被告人孫銀東接堂他人的委託，採用偷拍、偷錄、跟蹤等方式獲取被調查人的手機通話記錄、短信記錄等個人信息，並將獲得的信息加價出售給委託人，從中獲利人民幣1萬餘元。孫銀東的行為構成侵犯公民個人信息罪"}, {"key": "C", "text": "2009年3月至12月間，時任北京京馳天限通信技術有限公司運維部經理的被告人謝新衝。利用中國移動通信集團北京有限公司授予其所在公司開展手機定位業務的權限，先後多次為他人提供的90余個手機號碼進行定位，非法獲利人民幣9萬元。被告人謝新衝犯侵犯公民個人信息罪"}, {"key": "D", "text": "A原系某市寬帶公司的技術經理，其跳槽至他處後，通過原公司內部朋友獲得公司寬帶服務器後台賬號，通過賬號其篩選出大量超過3個月以上未使用的寬帶賬號。後A又通過後台賬號修改之前篩選所得寬帶帳號，並將修改後的寬帶賬號予以低價售賣，獲利1萬餘元。A的行為構成侵犯公民個人信息罪"}], "answer": ["D"], "explanation_full": "【羿文解析】A項正確。B項正確。本項中被告人使用偷拍、偷錄、跟蹤等手段，在一定程度上侵犯了公民的隱私權C項正確。當公民從事某些活動不希望被他人獲悉時，因其所處具體方位與所從事的活動之間具有直接聯繫，一旦被他人獲悉，其所從事的活動也就相當程度被暴露，損害其利益，故其所處具體位置就具有明顯的隱私性和權益性，屬於刑法所保護的公民個人信息。D項錯誤。實務中，大量的行為人通過不法手段獲取其他公民在網絡上所註冊使用的賬號密碼，如QQ號、郵箱賬戶密碼等，這些賬戶的共同特點是∶除賬戶本身的數字符號外，賬戶內往往還記載或者能反映出註冊人的手機號、身份證號等個人信息，換言之這些賬號最終都指向具體的個人。但在本項中，行為人獲取的是寬帶上網賬號由字母組成，行為人獲取賬號密碼後，只是獲得了寬帶的使用權，並無法獲知該賬號所有人的其他信息，更無法將這些賬號與特定公民個人進行對應。 因此，對這些賬號的非法獲取可能涉嫌其他侵犯財產類、破壞計算機信息管理類犯罪，但不屬於侵犯公民個人信息罪。綜上所述，本題答案為D。"}, {"id": "卷一-34", "subject": "卷一", "type": "單選題", "question": "根據《憲法》和法律的規定，關於國家機構，下列選項正確的是", "options": [{"key": "A", "text": "省、自治區、直轄市政府經國院批准，可以設立行政公署"}, {"key": "B", "text": "地方各級政府服從上級政府的領導，向上一級政府負責和報告工作"}, {"key": "C", "text": "地方各級審計機關依法獨立行使審計監督權，對上一級審計機關負責"}, {"key": "D", "text": "市轄區的政府本級人大批准可設立若干街道辦，作為派出機關"}], "answer": ["B"], "explanation_full": "13 批准，可以設立街道辦。"}, {"id": "卷一-35", "subject": "卷一", "type": "單選題", "question": "建設法治政府必然要求建立權責統一、權威高效的依法行政體制。關於建設法治政府，下列哪一觀點是正確的？（）", "options": [{"key": "A", "text": "明晰各級政府事權配置的著力點，強化市縣政府宏觀管理的職責"}, {"key": "B", "text": "明確地方事權，必要時可以適當犧牲其他地區利益"}, {"key": "C", "text": "政府權力清單制度是促進全面履行政府職能、釐清權責、提高效率的有效制度"}, {"key": "D", "text": "推行政府法律顧問制度的主要目的是幫助行政機關擺脫具體行政事務，加強宏觀管理"}], "answer": ["C"], "explanation_full": "【羿文解析】A項，明晰各級政府事權配置的著力點，包括強化中央政府宏觀管理、制度設定職責和必要的執法權，強化省級政府統籌推進區域內基本公共服務均等化職責，強化市縣政府執行職責。故A錯誤。B項，明確地方事權，是為了建立事權和支出責任相適應的制度，而不是犧牲其他地區利益。故B錯誤。D項，推行政府法律顧問制度的主要目的是促進行政機關在法治軌道上開展工作，做到依法決策、依法行政。故D錯誤。 C項正確。"}, {"id": "卷一-36", "subject": "卷一", "type": "單選題", "question": "關於我國憲法的制定與修改，下列哪一說法是正確的？", "options": [{"key": "A", "text": "全國人大常委會是法定的修憲主體"}, {"key": "B", "text": "《憲法》沒有規定明確的修憲方式"}, {"key": "C", "text": "全國人大主席團或者1/5以上全國人大代表有權提出憲法修正案"}, {"key": "D", "text": "凡憲法規範與社會生活發生衝突時，必須進行憲法修改"}], "answer": ["B"], "explanation_full": "【羿文解析】A項錯誤，修憲權專屬於全國人大。B項正確。C項錯誤，全國人大常委會或1/5以上全國人大代表可以提出憲法修正案。D項錯誤，也可以進行憲法解釋。"}, {"id": "卷一-37", "subject": "卷一", "type": "單選題", "question": "關於司法制度的表述，下列哪一說法是錯誤的", "options": [{"key": "A", "text": "我國司法制度主要由兩個方面的體系構成：司法規範體系、司法組織體系"}, {"key": "B", "text": "司法具有交涉性，要求各方參與，相互論辯，且裁判必須是在受判決直接影響的有關各方參與下，通過提出證據並進行理性說服和辯論之後作出來的"}, {"key": "C", "text": "當代中國，司法構成社會糾紛解決體系中最具普適性的方式，法院已成為最主要的糾紛解決主體"}, {"key": "D", "text": "解決糾紛是司法制度的普遍性特徵，它構成司法制度產生的基礎、運作的主要內容和直接任務，是其他功能發揮的先決條件"}], "answer": ["A"], "explanation_full": "【羿文解析】司法的特徵：（1）獨立性：司法機關只服從法律，不受上級機關、行政機關的干涉；（2）被動性：司法程序的啟動以及裁判範圍，要以當事人的訴請為前提；（3）交涉性：裁判是在受判決直接影響的有關各方參與下，通過提出證據並進行理性說服和辯論作出的；（4）程序性：法定程序是保證司法機關正確 、合法、及時地適用法律的前提，是實現司法公正的重要保證；（5）普遍性：司法構成社會糾紛解決體系中最具普適性的方式；（6）終極性：司法是解決糾紛、處理衝突的最後環節，其結果是最終性的決定。司法的功能：（1）應然功能：“定分止爭”“懲奸除惡”“止惡揚善”“實現公平正義”“最後一道防線”，以及亞裡士多德講的“校正正義”；（2）實然功能：1、直接功能：解決糾紛（包括懲罰犯罪）。2、間接功能 ：人權保障、調整社會關係、解釋和補充法律、形成公共政策。A項錯誤，我國司法制度主要由四個方面的體系構成：司法規範體系、司法組織體系、司法制度體系、司法人員管理體系。BCD說法均正確。"}, {"id": "卷一-38", "subject": "卷一", "type": "單選題", "question": "甲因涉嫌詐騙被某縣檢察院起訴至某縣法院，某縣法院經過審理，認為本案事實不清，證據不足，檢察院經過補充偵查仍然認為證據不足，某縣法院判決甲無罪，案件在過了上訴抗訴期後生效。—年後，某縣檢察院收集到甲實施詐騙的新證據，下列表述正確的有∶", "options": [{"key": "A", "text": "某縣檢察院向某縣法院重新提起公訴專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 14"}, {"key": "B", "text": "某縣檢察院向某市中級法院提起抗訴"}, {"key": "C", "text": "某縣檢察院報請某市檢察院向某市中級法院提起抗訴"}, {"key": "D", "text": "法院重新開庭審理後應當裁定撤銷之前的無罪判決不正確"}], "answer": ["A"], "explanation_full": "【羿文解析】A項正確，BCD錯誤。對於已經生效的判決確有錯誤的，檢察院或法院都可以啟動再審，檢查院啟動的程序是：上對下，同級抗。就本案而言，縣法院在事實不清證據不足的情況下依法判決甲無罪並無錯誤，故不能啟動再審程序。若檢察院發現新事實新證據，可以向法院重新提起公訴。"}, {"id": "卷一-39", "subject": "卷一", "type": "單選題", "question": "關於累犯，下列說法錯誤的是", "options": [{"key": "A", "text": "甲因販賣毒品罪一審被判處有期徒刑一年六個月，由於其先前被羈押的時間已經超過一審所判處的一年六個月，在二審期間，法院對甲取保候審，並最終作出維持原判的裁定。甲在取保候審期間，又犯販賣毒品罪 。甲構成累犯"}, {"key": "B", "text": "甲曾因犯A罪（詐騙罪）被判處有期徒刑七年，2017年6月30日刑滿釋放。又因犯B罪（盜竊罪），於2017年 11月被認定為累犯，判處有期徒刑十個月，同年12月在監服刑。服刑的某日晚，故意傷害乙致其重傷。對甲所實施的C罪（故意傷害罪），仍可以認定為是累犯，從重處罰"}, {"key": "C", "text": "甲因搶劫罪被判處有期徒刑三年，2017年11月刑滿釋放，2020年5月又觸犯妨害傳染病防治罪，甲不構成累犯"}, {"key": "D", "text": "甲因故意殺人罪被判處有期徒刑3年，在假釋考驗期結束後的第4年又分別犯盜竊罪和使用虛假身份證件罪 ，其中盜竊罪應判處有期徒刑4年，使用虛假身份證件應判處拘役。對於使用虛假身份證件罪不能根據累犯從重處罰"}], "answer": ["A"], "explanation_full": "【羿文解析】A項錯誤。累犯是指被判處有期徒刑以上刑罰的犯罪分子，刑罰執行完畢或赦免後，五年內再犯應當判處有期徒刑以上刑罰之罪的。由此可見，構成一般累犯，後罪必須發生在前罪判處的刑罰執行完畢或赦免後五年內。本項中，雖然對甲的原判刑罰在二審期間已經與先前的羈押期限完全折抵，無可執行的內容 ，但由於本案進入二審程序，一審判決尚未生效，未進入執行程序，因此不能認為原判刑罰已經執行完畢。 甲在取保候審期間犯新罪，不符合累犯構成的時間條件，不成立累犯。 B項正確。累犯在客觀上表現為再次犯罪，是對再次犯罪從重處罰的刑罰制度。該規定更多的是強調犯罪人的人身特徵，將累犯視為人身危險性較大的一種犯罪人類型，對此類人進行從重處罰。五年內出現多次犯罪 ，證明其人身危險性大，因此每次犯罪均要與第一次犯罪進行評價，符合累犯的均認定為累犯從重處罰，才符合累犯制度內在精神。我國刑法沒有規定五年內只能適用一次累犯，其後的犯罪就不能再適用，這樣更符合寬嚴相濟刑事司法政策要求，有利於從嚴懲治屢教不改的犯罪分子。故對後續的故意傷害罪，仍可認定為是累犯，從重處罰。 C項正確。根據《刑法》第65條的規定，構成累犯的前提必須前後都是故意犯罪，妨害傳染病防治罪屬於過失犯罪，因此裡不構成累犯。在判定是否構成累犯時需注意一些難以發現的過失犯罪∶例如，妨害傳染病防治罪;傳染病菌種、毒種擴散罪;妨害國境衛生檢疫罪;為他人提供書號出版淫穢書刊罪，這些犯罪罪名貌似為故意犯罪，實則為過失犯罪。 D項正確。根據《刑法》第65條的規定，被判處有期徒刑以上刑罰的犯罪分子，刑罰執行完畢或者赦免以後 ，在五年以內再犯應當判處有期徒刑以上刑罰之罪的，是累犯。也就是說構成累犯要求前後犯罪都是被判處有期徒刑以上刑罰的犯罪。當累犯中的後罪為數罪時，需要特別注意，對於應該判處拘役、管制或者單處附加刑的犯罪，不構成累犯，本項甲實施的使用虛假身份證罪應該判處拘役，不滿足累犯的構成條件，不得適用累犯從重處罰的規定。 綜上，A項當選。"}, {"id": "卷一-40", "subject": "卷一", "type": "單選題", "question": "關於財產犯罪，下列說法正確的是", "options": [{"key": "A", "text": "甲正當租用乙的汽車，後使用虛假資料，謊稱汽車為自己所有而出賣給丙。甲僅有一個違法行為，僅成立詐騙罪專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 15"}, {"key": "B", "text": "劉某來到孫某家嫖娼，事後，劉某離開。孫某穿好衣服起床，打開厚厚的信封，一看竟全是冥幣。劉某的行為成立詐騙罪"}, {"key": "C", "text": "林某、羅某竄到工地欲偷柴油未得逞，林某便指著工地山坡果園中的一間房子說∶\"聽說那邊果園的房子裡有炸藥。\"兩人將房子磚墻撬開一個洞，鑽入房內盜走二號岩石銨梯炸藥各一箱。林某、羅某的行為成立盜竊罪"}, {"key": "D", "text": "甲趁便利店店主乙不注意，偷了乙便利店的數碼相機一台（價值5000元）。隨後甲偽裝退貨，以退貨為由 ，將該數碼相機退給乙，從乙處獲利退貨款5000元。甲的行為構成盜竊罪"}], "answer": ["D"], "explanation_full": "【羿文解析】A項錯誤，甲實際上既對汽車的所有人乙成立侵占罪，如果認為購買者有財產損失，又對汽車的購買者丙成立詐騙罪。B項錯誤。從客觀行為方式來看，完全符合詐騙罪的因果進程，劉某也有詐騙的責任 ，但詐騙罪侵犯的法益是公私財產物，不包括其他非法利益。另外，劉某騙取的是孫某的性利益，不能用財產價值來衡量，性利益不屬於詐騙罪侵犯的法益。故劉某不成立詐騙罪。C項錯誤。特殊法條應該優先於普通法條適用。我國《刑法》另外規定了違反槍支、彈藥管理危害公共安全的犯罪。林某、羅某以非法占有為目的，竊取爆炸物，危害公共安全的行為，成立盜竊爆炸物罪。D項正確。甲對於數碼相機有非法占有目的，退貨是為了獲得\"對價\"，成立盜竊罪。綜上，D項當選。"}, {"id": "卷一-41", "subject": "卷一", "type": "單選題", "question": "關於刑罰體系，下列說法正確的是", "options": [{"key": "A", "text": "甲因銷售偽劣產品罪，依法應該判處罰金。但法院考慮到甲家庭經濟較為困難，故沒有判處罰金"}, {"key": "B", "text": "甲有20萬元現金以及兩套住房，後因犯貪污罪，法院判決沒收其部分財產，具體為50萬元現金。該法院判決沒收的具體財產是錯誤的"}, {"key": "C", "text": "越南人方某與中國人周某結婚，後方某與周某之母長期不和，便採取投毒方式將周某之母殺害，法院以故意殺人罪判處方某死刑，並剝奪政治權利終身"}, {"key": "D", "text": "甲前往某賭場將攜帶的5萬元用作賭注賭博，其間贏得7萬元，不久公安人員接到報警趕到現場，將甲抓獲 。甲因賭博其賭資應該被收繳，但只能收繳甲贏得的7萬元"}], "answer": ["B"], "explanation_full": "【羿文解析】A項錯誤。根據《最高人民法院關於適用財產刑若干問題的規定》第2條，人民法院應該根據犯罪情節，如違法所得數額、造成損失的大小等，並綜合考慮犯罪分子繳納罰金的能力，依法判處罰金。在能否適用罰金這一問題上，必須以刑法的規定為準。當刑法對某一犯罪規定了必須判處罰金刑，不能因為犯罪分子的家庭經濟困難就免除罰金刑。B項正確。沒收財產是沒收犯罪分子個人所有財產的一部分或者全部。所謂犯罪分子個人所有財產，是指屬於犯罪分子本人實際、現實所有的財產及與他人共有財產中依法應得的份額。本項中，甲現實具有的財產只有20萬元現金以及兩套住房，在沒收財產時只能沒收以上財產的一部分或全部。因此法院判決沒收甲50萬元現金是錯誤的，甲沒有這麼多現金。C項錯誤。政治權利是憲法賦予中國公民的權利，外國籍被告人並不享有。方某雖與周某結婚，但並未加入中國國籍，不符合適用剝奪政治權利的對象條件，對其不能附加剝奪政治權利終身。D項錯誤。根據《最高人民法院、最高人民檢察院關於辦理賭博刑事案件具體應用法律若於問題的解釋》第8條，賭博犯罪中用作賭注的款物、換取籌碼的款物和通過賭博贏取的款物屬於賭資。賭資應當依法予以追繳。因此，甲身上的12萬都應被收繳。綜上，B項當選。"}, {"id": "卷一-42", "subject": "卷一", "type": "單選題", "question": "下列關於數罪論的說法，哪一項是錯誤的", "options": [{"key": "A", "text": "甲以非法占有為目的偽造A銀行的存單後將其作為擔保憑證到"}, {"key": "B", "text": "銀行申請貸款，獲得貸款後潛逃國外。甲屬於偽造金融票證罪和貸款詐騙罪的牽連犯，應以貸款詐騙罪論處B.罪犯甲在監所內毀壞門窗（不考慮金額），破壞監獄設施後逃脫的，屬於吸收犯，以脫逃罪論處"}, {"key": "C", "text": "甲偽造身份證本來為出差方便之用，數年後出於偶然機會又用於詐騙。甲構成偽造身份證件罪和詐騙罪 ，數罪並罰"}, {"key": "D", "text": "甲在盜竊槍支後，用該槍支殺害了乙。甲屬於牽連犯，以故意殺人罪論處"}], "answer": ["D"], "explanation_full": "16 款）針對的是不同的對象人，侵害的是不同的法益，不能認定後行為是事後不可罰行為。其次，根據《刑法 》第177條規定，甲偽造銀行存單的行為構成偽造金融票證罪。甲偽造銀行存單目的是騙取銀行貸款，事實上甲也實施了騙取銀行貸款的行為，而且甲具有非法占有目的，所以後行為應當認定為貸款詐騙罪。最後，前行為（偽造銀行存單）與貸款詐騙行為具有類型化關係，也就是說日常生活中，人們一般會將偽造銀行存單作為實施貸款詐騙的通常手段，而且前後行為都侵害了同一法益，即國家金融管理制度，應該肯定具有牽連關係，因此甲成立偽造金融票證罪和貸款詐騙罪的牽連犯，應以貸款詐騙罪論處。 B項正確。考查吸收犯的特性。所謂吸收，是指一個行為包容其他行為，只成立一罪，其他行為構成的犯罪失去其存在意義，不再予以定罪。吸收犯中，兩罪之間的聯繫非常密切，分也分不開。本項中，甲總共實施了兩個犯罪行為，即在監所內毀壞門窗的，構成故意毀壞財物罪;破壞監獄設施後脫逃的，又構成脫逃罪。應當指出，甲破壞監所門窗是其實施脫逃行為所伴隨的，破壞監所門窗的行為與脫逃行為具有非常緊密的關係 ，分也分不開。可以認為，甲的兩種行為存在吸收關係。因為脫逃行為屬於重行為，破壞財物行為屬於輕行為，重行為吸收輕行為，以脫逃罪論處。 C項正確。成立牽連犯要求除了前行為與後行為之間具有類型化關係外，還需考察不可分離性。即是說如果要成立牽連犯，前後兩行為不能因為時空間隔區隔開來，本項中的前後行為相隔數年，所以不成立牽連犯，應該構成偽造身份證件罪和詐騙罪，數罪並罰。 D項錯誤。考查牽連犯的特性。成立牽連犯需要前行為與後行為之間具有類型化的關係，即是說只有當手段通常用於實施某種犯罪，或者某種原因行為通常導致某種結果行為時，才宜認定為牽連犯。本項中，甲存在兩個行為，即盜竊槍支行為和殺害行為，雖然槍支經常用來殺人，但是因為盜竊槍支行為並非殺人的通常手段行為，因而不符合牽連犯的特徵。故甲不屬於牽連犯，應當認定盜竊槍支罪和故意殺人罪，數罪並罰。 綜上所述，本題答案為D項。"}, {"id": "卷一-43", "subject": "卷一", "type": "單選題", "question": "關於法官職務任免，下列哪一說法是錯誤的？", "options": [{"key": "A", "text": "最高人民法院巡迴法庭庭長、副庭長，由最高人民法院院長提請全常任免"}, {"key": "B", "text": "省、自治區、直轄市設立法官遴選委員會，負責初任法官人選專業能力的審核"}, {"key": "C", "text": "省級法官遴選委員會的組成人員應當包括地方各級人民法院法官代表、其他從事法律職業的人員和有關方面代表，其中法官代表不少於半數"}, {"key": "D", "text": "除具備法官任職條件外，參加公開選拔的律師應當實際執業不少於五年，執業經驗豐富，從業聲譽良好"}], "answer": ["C"], "explanation_full": "【羿文解析】遴選委員會：（1）設立：最高人民法院，省、自治區、直轄市。（2）組成：省級法官代表不少於三分之一。（3）職責：負責法官人選專業能力的審核（省級負責初任）。（4）規則：1、初任法官一般到基層人民法院任職。2、上級人民法院法官一般逐級遴選。3、最高人民法院和高級人民法院法官可以從下兩級人民法院遴選。參加上級人民法院遴選的法官應當在下級人民法院擔任法官一定年限，並具有遴選職位相關工作經歷。4、律師、學者：5年以上，突出成果（學者中級以上職稱）。C項錯誤，法官代表不少於三分之一。ABD說法均正確。"}, {"id": "卷一-44", "subject": "卷一", "type": "單選題", "question": "關於不作為犯罪，下列哪一選項是錯誤的", "options": [{"key": "A", "text": "消防員甲衝入火場救援，被坍塌的木梁砸中，眼看著他人被大火吞噬但卻動彈不得。雖然甲具有救助他人的作為義務，但因為沒有作為的可能性而不成立不作為犯罪"}, {"key": "B", "text": "司機乙過失造成交通事故，導致被害人頭蓋骨粉碎性骨折，即使立即送往醫院也不能輓救生命。即使乙沒有救助被害人，也因沒有救助可能性而不成立不作為犯罪"}, {"key": "C", "text": "母親丙看到自己5周歲的孩子落水而故意不救助，但路人趙某發現後及時救助孩子，使其脫險。即使丙沒有救助孩子，也因為他人的救助而不成立不作為犯罪"}, {"key": "D", "text": "出租車被他人追尾，坐在後面的乘客傷勢嚴重，而且事故完全由追尾的司機負責，但追尾司機已經死亡。 如果出租車司機丁不救助乘客，乘客未得到及時救助而死亡，丁成立不作為犯罪"}], "answer": ["C"], "explanation_full": "17 式的犯罪也存在未遂狀態。D項正確，此時出租車司機負有救助義務。 不作為犯的成立條件："}, {"id": "卷一-1", "subject": "卷一", "type": "單選題", "question": "具有作為義務（處於保證人地位） （1）基於對危險源的支配產生的監督義務（行為人處於控制危險源的地位）：a、對危險物的管理義務；b、 對他人危險行為的監督義務；c、對自己先前行為造成的法益侵害的緊迫危險的防止義務：1.行為沒有製造、 增加危險，不產生作為義務2.行為雖然製造、增加了危險，但是該危險並不緊迫或者微不足道的，不產生作為義務3.行為製造、增加的危險屬於被害人自我答責範圍時，不產生作為義務4.正當防衛人對不法侵害者是否具有救助義務？否定說：無救助義務，侵害者的法律地位不能高於陌生者肯定說：分情況處理①正當防衛造成死亡結果也不過當的，無救助義務②防衛行為未過當，也沒有過當的危險，無救助義務③防衛行為未過當，但是具有過當的危險，有救助義務5.故意犯罪可以成為作為義務的來源。 （2）基於與法益的無助狀態的特殊關係產生的保護義務：a、基於法規範產生的保護義務；b、基於制度或者體制產生的保護義務；c基於自願承擔（合同與自願接受等）而產生的保護義務。 （3）基於對法益的危險發生領域的支配產生的阻止務：a、對於自己支配的建築物、汽車等場所內的危險的阻止義務；b、對發生在自己身體上的危險行為的阻止義務", "options": [], "answer": null, "explanation_full": null}, {"id": "卷一-2", "subject": "卷一", "type": "單選題", "question": "具有作為可能性：是指負有作為義務的人具有履行義務的可能性（法不強人所難）。", "options": [], "answer": null, "explanation_full": null}, {"id": "卷一-3", "subject": "卷一", "type": "單選題", "question": "具有結果迴避可能性：即使保證人履行義務也不可能避免結果發生的情況下，不能將保證人沒有履行作為義務認定為不作為犯。 不作為犯罪的解釋原理：不作為與作為具有等價性，是指無論是以作為方式實施還是不作為方式實施均具有同等的法益侵犯性。 注意一：不真正不作為犯可以由不作為方式實施，也可以由作為方式實施。 注意二：作為與不作為只是犯罪方式的區別，罪名相同，法定刑相同。", "options": [], "answer": null, "explanation_full": null}, {"id": "卷一-45", "subject": "卷一", "type": "單選題", "question": "關於故意犯罪形態，下列說法哪一選項是錯誤的", "options": [{"key": "A", "text": "甲計劃搶劫便利店，為此購買了匕首和蒙面絲襪，並構思好了退出路線，但當天甲患重感冒，沒能實施搶劫的，甲成立犯罪預備"}, {"key": "B", "text": "乙去公交車上扒竊，但被盜的乘客是附近派出所的便衣警察，乙手剛伸進被害人口袋就被抓獲的，乙成立犯罪未遂"}, {"key": "C", "text": "丙以賣保健品為名詐騙老年人的錢財，但老人家正要付錢的時候，丙突然心生憐憫，沒有收錢就離開的 ，丙成立犯罪中止"}, {"key": "D", "text": "丁為實施搶劫行為而購買了一瓶胡椒粉，但丁的妻子炒菜時不慎將胡椒粉用完的，丁成立犯罪預備"}], "answer": ["D"], "explanation_full": "【羿文解析】A項正確，購買匕首和絲襪屬於製造條件、準備工具的行為，成立犯罪預備。B項正確，系意志以外的原因未得逞，成立犯罪未遂。C項正確，因為憐憫而放棄的可以肯定中止的自動性。D項錯誤，購買胡椒粉的行為是一種日常生活行為，雖然在形式上符合犯罪預備的特徵，但是不能作為預備犯處罰。也就是說 ，購買胡椒粉的行為本身並不是一種具有危險性的行為，即使行為人承認是為了搶劫，但他隨時也可以否認自己是為了炒菜，難以證明他是為了搶劫。所以，對類似這樣的行為不應當以犯罪預備處罰。"}, {"id": "卷一-46", "subject": "卷一", "type": "單選題", "question": "乘客趙某在公交車上與售票員李某發生口角，遂追打、辱罵李某，並將李某打成輕傷。司機錢某指責趙某 ，趙某持手中木棍毆打錢某的頭部並搶奪方向盤，錢某緊急剎車致使公交車失控，公交車與後車相撞，乘客王某頭部被撞傷，所幸無其他人員傷亡。關於趙某的行為，下列哪一選項是錯誤的", "options": [{"key": "A", "text": "趙某追打、辱罵李某的行為成立妨害安全駕駛罪與尋釁滋事罪的想象競合犯"}, {"key": "B", "text": "趙某打傷李某的行為成立尋釁滋事罪與故意傷害罪的想象競合犯"}, {"key": "C", "text": "趙某毆打錢某的行為成立妨害安全駕駛罪與以危險方法危害公共安全罪的想象競合犯"}, {"key": "D", "text": "錢某緊急剎車的行為在符合其他條件的情況下可以認定為緊急避險"}], "answer": ["A"], "explanation_full": "18 駕駛罪。B項正確。C項正確，與後車相撞，具有危及公共安全的具體危險，成立妨害安全駕駛罪和以危險方法危害公共安全罪的想象競合犯。D項正確。 注意：1.在《刑法修正案（十一）》頒布之前，根據最高人民法院、最高人民檢察院、公安部《關於依法懲治妨害公共交通工具安全駕駛違法犯罪行為的指導意見》的規定，妨害安全駕駛的行為是按照以危險方法危害公共安全罪定罪處罰，最低亦要判處三年有期徒刑，最高為死刑。但是妨害安全駕駛的行為和放火罪等危害公共安全的犯罪相比，在危險性上明顯較低，因為特設新罪“妨害安全駕駛罪”，其法定最高刑為一年。"}, {"id": "卷一-2", "subject": "卷一", "type": "單選題", "question": "成立本罪，要求行為發生在行駛中的車輛、船舶、飛機等公共交通工具上。如果公共交通工具處於停止狀態，比如在公交站台停止，司機起身毆打乘客的，不成立該罪。3.該罪包含兩種行為方式：其一為乘客對駕駛人員（不包含調度員、安全員、售票員）使用暴力或者搶控駕駛操作裝置，干擾公共交通工具（公共汽車 、公路客運車、大中型出租車，不含小型出租車）正常行駛；其二為駕駛人員擅離職守（只是辱罵排除在外 ），與他人互毆或者毆打他人（駕駛人員在遭受突如其來的暴力時，依然可以實施防衛，但是要保障承載人員的安全）4.駕駛人員遭到妨害安全駕駛行為侵害時，為避免公共交通工具傾覆或者人員傷亡等危害後果發生，採取緊急制動措施，造成公共交通工具、交通設施損壞或者人身損害，符合法定條件的，可以認定為緊急避險。5.乘客在公共交通工具行駛過程中，隨意毆打其他乘客，追逐、辱罵他人，或者起哄鬧事的，不危及公共安全，但是妨害公共交通工具運營秩序，可以認定為尋釁滋事罪。6.關於危及公共安全的理解。此處的公共安全是指交通運輸安全，具體包含兩個方面：其一是該交通工具本身的安全和所載人員的安全，其二是公共交通工具以外的道路上其他人員、車輛的安全。7.妨害安全駕駛罪屬於抽象危險犯（命題人觀點 ），且不存在與之對應的實害犯，但是妨害安全駕駛的行為完全可能具有危害公共安全的緊迫危險，如公交車在彎道處與其他車輛會車時，乘客突然搶控方向盤，致使公交車與對面車輛相撞時，乘客構成本罪與以危險方法危害公共安全罪的想象競合犯。", "options": [], "answer": null, "explanation_full": null}, {"id": "卷一-47", "subject": "卷一", "type": "單選題", "question": "根據國際法關於國際爭端解決的相關規則和實踐，下列關於爭端解決方式的表述中，正確的是哪一項", "options": [{"key": "A", "text": "甲乙兩國之間就移民問題發生糾紛，丙國為支持甲國出面進行干涉，這是符合國際法的"}, {"key": "B", "text": "乙丙兩國之間就邊界問題發生爭端，聯合國秘書長出面說服乙丙兩國以協商方式解決爭端，聯合國秘書長的行為超越了其職權範圍"}, {"key": "C", "text": "丙丁兩國隔海相望，兩國之間經常就專屬經濟區和大陸架劃界的問題發生爭端，後雙方達成書面協議同意將此爭端提交聯合國國際法院，國際法院對此爭端有管轄權"}, {"key": "D", "text": "甲國爆發大規模傳染病，乙國為避免傳染病蔓延至本國，宣布禁止甲國人入境，一周後甲國也宣布禁止乙國人入境。本案中甲國採用的爭端解決方式稱為報復"}], "answer": ["C"], "explanation_full": "【羿文解析】國際爭端的解決方式：一、強制方法：1.戰爭或非戰爭武力解決方法（不合法）；2.干涉內政 （不合法）；3.平時封鎖：安理會決定合法；4.反報：針對不違法行為；5.報復：針對違法行為。二、非強制方法：1.政治方法：①談判與協商；②斡旋（第三者促使談判協商）與調停（第三者提出方案並參加或主持談判）；③調查（只解決事實問題）與和解（解決事實和法律問題）；2.法律解決：仲裁：國際常設仲裁法院（1900年，海牙）；法院：國際法院；國際海洋法法庭。A項錯誤，丙國行為屬於干涉內政。B項錯誤 ，聯合國秘書長的行為屬於斡旋。C項正確。D項錯誤，針對不違法行為，屬於反報。"}, {"id": "卷一-48", "subject": "卷一", "type": "單選題", "question": "關於深入推進全民守法，下列哪一選項是錯誤的？（　）", "options": [{"key": "A", "text": "建立健全立法工作宣傳報道常態化機制，對立法熱點問題主動發聲、解疑釋惑"}, {"key": "B", "text": "深入開展法官、檢察官、監察官、行政復議人員、行政執法人員、律師等以案釋法活動"}, {"key": "C", "text": "廣泛推動人民群眾參與社會治理，打造共建共治共享的社會治理格局"}, {"key": "D", "text": "積極引導人民群眾依法維權和化解矛盾糾紛，堅持和發展新時代“楓橋經驗”"}], "answer": ["B"], "explanation_full": "19 主動發聲、解疑釋惑。全面落實“誰執法，誰普法”的普法責任制。深入開展法官、檢察官、行政復議人員 、行政執法人員、律師等以案釋法活動。加強突發事件應對法治宣傳教育和法律服務。故A項正確，B項錯誤 。廣泛推動人民群眾參與社會治理，打造共建共治共享的社會治理格局。完善群眾參與基層社會治理的制度化渠道。加快推進市域社會治理現代化。健全社會治理規範體系。發揮工會、共青團、婦聯等群團組織引領聯繫群眾參與杜會治理的作用。加快推進社會信用立法，完善失信懲戒機制。規範失信懲戒對象名單制度 ，依法依規明確制定依據、適用範圍、懲治標準和救濟機制，在加強失信懲戒的同時保護公民、企業合法權益。加強對產權的執法司法保護，健全涉產權錯案甄別糾正機制。完善對暴力襲警行為的刑事責任追究制度 。加大對暴力傷害醫務人員犯罪行為打擊力度。故C項正確。積極引導人民群眾依法維權和化解矛盾糾紛，堅持和發展新時代“楓橋經驗”。充分發揮人民調解的第一道防線作用，完善人民調解、行政調解、司法調解聯動工作體系。全面開展律師調解工作。完善調解、信訪、仲裁、行政裁決、行政復議、訴訟等社會矛盾糾紛多元預防調處化解綜合機制，整合基層矛盾糾紛化解資源和力量，充分發揮非訴糾紛解決機制的作用。深化法律援助制度改革，擴大法律援助覆蓋面。有序推進行政裁決工作，探索擴大行政裁決適用範圍。故D項正確。"}, {"id": "卷一-49", "subject": "卷一", "type": "單選題", "question": "關於組織考試作弊罪，下列哪一說法正確？（）", "options": [{"key": "A", "text": "甲應乙的要求為乙尋找替考者丙，後丙代替乙參加了高考，甲成立組織考試作弊罪"}, {"key": "B", "text": "組織考試作弊罪發生在“法律規定的國家考試”中，不包括地方或者行業組織的考試"}, {"key": "C", "text": "丁在普通高等學校招生的體能測試中，組織多名考生非法使用興奮劑，構成組織考試作弊罪"}, {"key": "D", "text": "戊從考試工作人員張某處重金收買地方公務員錄用考試的試題之後，又組織十餘名考生在考試中作弊，戊構成非法獲取國家秘密罪和組織考試作弊罪，屬於牽連犯，從一重罪處罰"}], "answer": ["C"], "explanation_full": "【羿文解析】A項錯誤。組織作弊行為，是指組織、策劃、指揮3人以上參與考試作弊。甲應乙的要求為乙尋找替考者丙，讓丙為乙代替參加高考，甲僅是為特定的人尋找替考者，沒有組織多人作弊，不成立本罪，構成代替考試罪的共犯，如果甲在不特定的應考人與替考者之間從事中介服務的，甲成立組織考試作弊罪。B項錯誤。《考試作弊解釋》第1條規定，依照法律由中央或者地方主管部門以及行業組織的國家考試都屬於法律規定的國家考試，如地方公務員錄用考試、註冊會計師全國統一考試、會計專業技術資格考試、資產評估師資格考試、醫師資格考試、執業藥師職業資格考試、註冊建築師考試、建造師執業資格考試等專業技術資格考試等，注意“法律規定的國家考試”，僅限於全國人民代表大會及其常務委員會制定的法律所規定的考試 。C項正確。《興奮劑解釋》第4條第1款規定：“在普通高等學校招生、公務員錄用等法律規定的國家考試涉及的體育、體能測試等體育運動中，組織考生非法使用興奮劑的，應當依照刑法第二百八十四條之一的規定 ，以組織考試作弊罪定罪處罰。”D項錯誤。以收買方法獲取國家考試的試題、答案，並不是組織考試作弊的通常手段，而牽連關係要具有類型化、通常性的特徵，即只有兩種不同行為在實踐中經常併發在一起，具有了類型化的特徵，才能構成牽連犯，因此對戊以非法獲取國家秘密罪和組織考試作弊罪，數罪並罰。"}, {"id": "卷一-50", "subject": "卷一", "type": "單選題", "question": "下列關於附帶民事訴訟的提起程序和審理程序的說法，哪一選項是錯誤的？", "options": [{"key": "A", "text": "附帶民事訴訟原告人或檢察院未提出申請財產保全的，必要時，法院也可以採取保全措施"}, {"key": "B", "text": "在提起附帶民事訴訟前，有權提起附帶民事訴訟的人在特定情形下可以向被保全財產所在地、被申請人居住地或者對案件有管轄權的法院申請採取保全措施"}, {"key": "C", "text": "法院採取保全措施，只適用刑事訴訟法的有關規定，不適用民事訴訟法的有關規定"}, {"key": "D", "text": "附帶民事訴訟案件審理中，檢察機關只能申請法院查封被告人財產，不能決定查封被告人財產"}], "answer": ["C"], "explanation_full": "【羿文解析】A項正確，附帶民事訴訟中保全措施的採取分為依申請與依職權。B項正確，保全行為管轄法院為被保全財產所在地、被申請人居住地或者對案件有管轄權的法院。C項錯誤，可以適用民事訴訟的有關規定 。D項正確，決定權在法院。 20"}, {"id": "卷一-51", "subject": "卷一", "type": "多選題", "question": "憲法傚力是指憲法作為法律規範所發揮的約束力與強制性。關於我國憲法傚力，下列哪些說法是正確的？", "options": [{"key": "A", "text": "居住在國外的華人華僑仍受中國憲法保護"}, {"key": "B", "text": "憲法的效力及於中華人民共和國的所有領域"}, {"key": "C", "text": "憲法的最高法律效力首先源於憲法的正當性"}, {"key": "D", "text": "憲法對法院的審判活動沒有約束力"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】A選項錯誤，華人並不具有我國國籍。而華僑仍具有中國國籍，仍受我國憲法保護。B選項正確 ，任何一個主權國家的憲法的空間效力都及於國土的所有領域，這是主權的唯一性和不可分割性決定的，也是憲法的根本法地位決定的。C選項正確，憲法之所以具有最高法律效力，是因為憲法是社會共同體的基本規則，是社會多數人共同意志的最高體現，具體包括：憲法制定權的正當性、憲法內容的合理性、憲法程序的正當性。D選項錯誤，一切國家機關和武裝力量、各政黨和各社會團體、各企業事業組織都必須遵守憲法和法律，法院的審判活動也必須遵守憲法與法律。"}, {"id": "卷一-52", "subject": "卷一", "type": "多選題", "question": "根據國際法相關規則，關於國際爭端解決方式，下列哪些表述是正確的？（　　）", "options": [{"key": "A", "text": "甲乙兩國就界河使用發生糾紛，丙國為支持甲國可出面進行武裝干涉"}, {"key": "B", "text": "甲乙兩國發生邊界爭端，丙國總統可出面進行調停"}, {"key": "C", "text": "甲乙兩國可書面協議將兩國的專屬經濟區爭端提交聯合國國際法院，國際法院對此爭端擁有管轄權"}, {"key": "D", "text": "國際法院可就國際爭端解決提出咨詢意見，該意見具有法律拘束力"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】現代國際法確立了和平解決國際爭端的基本原則，使用戰爭或武力解決爭端是被禁止的。所以 A選項錯誤。和平解決國際爭端的方法分為政治解決方法和法律解決方法。政治方法包括談判、協商、斡旋、 調停、調查、和解等。法律方法包括仲裁和法院解決。所以B選項正確。國際法院管轄案件的範圍有三個方面 ，第一種是自願管轄。對於任何爭端，當事國都可以在爭端發生後，達成協議，將爭端提交國際法院。法院根據當事國各方的同意進行管轄。第二種是協定管轄。在現行條約或協定中，規定各方同意將有關的爭端提交國際法院解決。提交法院的爭端及範圍等可以通過在條約中設立專門條款，也可以在訂立條約的同時，再訂立專門的協定加以規定。第三種是任擇強制管轄。《國際法院規約》的當事國，可以通過發表聲明，就具有下列性質之一的爭端，對於接受同樣義務的任何其他當事國，接受法院的管轄為當然具有強制性，而不需要再有特別的協定。這些爭端是：對於條約的解釋、違反國際義務的任何事實、違反國際義務而產生的賠償的性質和範圍等。所以C選項正確。國際法院作出的咨詢意見雖然沒有法律拘束力，但對於有關問題的解決以及國際法的發展都具有重要的影響。所以D選項錯誤。"}, {"id": "卷一-53", "subject": "卷一", "type": "多選題", "question": "下列哪些做法違反了上訴不加刑原則？（）", "options": [{"key": "A", "text": "張三因搶劫罪被甲市乙縣法院判處10年有期徒刑，張三提起上訴，甲市中級人民法院以事實不清、證據不足為由，發回乙縣法院重審，乙縣法院重審後依然以搶劫罪，判處張三10年有期徒刑。乙縣檢察院提出抗訴 ，甲市中級人民法院認為一審判決對張三量刑偏輕，改判張三15年有期徒刑"}, {"key": "B", "text": "A市B區法院一審認定張三犯盜竊罪，判處有期徒刑5年，犯搶劫罪，判處有期徒刑11年，數罪並罰，決定執行有期徒刑13年。張三不服，提出上訴。A市中級人民法院認定的犯罪事實與一審相同，但是認為張三搶劫相關事實應當認定為盜竊。A市中級人民法院改判張三盜竊罪，有期徒刑13年"}, {"key": "C", "text": "甲市乙區法院一審認定小帆貪污公款370萬元，構成貪污罪，判處有期徒刑8年。小帆提出上訴，甲市中級人民法院認為，一審認定的370萬元中有160萬元構成貪污罪，其餘210萬元構成挪用公款罪，甲市中級人民法院以貪污罪判處小帆有期徒刑5年，以挪用公款罪判處有期徒刑3年6個月，決定執行有期徒刑6年"}, {"key": "D", "text": "A市B區法院一審認定張三犯盜竊罪，判處有期徒刑13年，張三不服，提出上訴。A市中級人民法院二審改判張三搶劫罪，有期徒刑13年"}], "answer": ["A", "D"], "explanation_full": "21 ，原審人民法院不得加重被告人的刑罰。對前款規定的案件，原審人民法院對上訴發回重新審判的案件依法作出判決後，人民檢察院抗訴的，第二審人民法院不得改判為重於原審人民法院第一次判處的刑罰”。本題 A項中，甲市中級法院改判張三15年有期徒刑，違反了該條的規定，違反了上訴不加刑原則，當選。 《刑訴解釋》第401條規定，“審理被告人或者其法定代理人、辯護人、近親屬提出上訴的案件，不得對被告人的刑罰作出實質不利的改判，並應當執行下列規定：（一）同案審理的案件，只有部分被告人上訴的，既不得加重上訴人的刑罰，也不得加重其他同案被告人的刑罰；（二）原判認定的罪名不當的，可以改變罪名 ，但不得加重刑罰或者對刑罰執行產生不利影響；（三）原判認定的罪數不當的，可以改變罪數，並調整刑罰，但不得加重決定執行的刑罰或者對刑罰執行產生不利影響；（四）原判對被告人宣告緩刑的，不得撤銷緩刑或者延長緩刑考驗期；（五）原判沒有宣告職業禁止、禁止令的，不得增加宣告；原判宣告職業禁止、 禁止令的，不得增加內容、延長期限；（六）原判對被告人判處死刑緩期執行沒有限制減刑、決定終身監禁的，不得限制減刑、決定終身監禁；（七）原判判處的刑罰不當、應當適用附加刑而沒有適用的，不得直接加重刑罰、適用附加刑。原判判處的刑罰畸輕，必須依法改判的，應當在第二審判決、裁定生效後，依照審判監督程序重新審判。人民檢察院抗訴或者自訴人上訴的案件，不受前款規定的限制”。本題B項不違反第 3項的規定，而且在減刑、假釋時對張三有利。C項不違反上訴不加刑原則，因為原審判處被告人一罪，在只有被告一方上訴的情形下，二審法院在認定的犯罪事實不變的情況下，改判數罪後決定執行的刑罰低於原判刑罰的，可以改判為數罪。D項違反了上述第2項規定，將盜竊改判為搶劫，刑期儘管維持13年，但由原來的可以假釋變為了不得假釋，在刑罰的執行上對被告人張三不利。"}, {"id": "卷一-54", "subject": "卷一", "type": "多選題", "question": "下列哪些選項的行為人具有非法占有目的？（）", "options": [{"key": "A", "text": "男性基於癖好入戶竊取女士內衣"}, {"key": "B", "text": "為了燃柴取暖而竊取他人木質傢具"}, {"key": "C", "text": "騙取他人鋼材後作為廢品賣給廢品回收公司"}, {"key": "D", "text": "殺人後為避免公安機關識別被害人身份，將被害人錢包等物丟棄"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】根據刑法理論，非法占有目的是指行為人將他人的財物作為自己的所有物進行支配，排除權利人的權利，遵從財物的用途進行利用和處分。選項A中男性基於癖好入戶竊取女士內衣，存在著非法占有的目的，A選項是正確的；選項B為了燃柴取暖而竊取他人木質傢具，顯然具有非法占有的目的；選項C騙取他人鋼材後作為廢品賣給廢品回收公司也具有非法占有的目的；選項D殺人後為避免公安機關識別被害人身份，將被害人的錢包予以丟棄，說明行為人沒有將他人的財物作為自己的所有物進行支配的意圖，也就不具有非法占有的目的。因此，本題的正確答案是ABC。"}, {"id": "卷一-55", "subject": "卷一", "type": "多選題", "question": "魏晉南北朝時期法律發生了許多發展變化，對後世法律具有重要影響。下列哪些表述正確揭示了這些發展變化？", "options": [{"key": "A", "text": "《北齊律》共12篇，首先將刑名與法例律合為名例律一篇"}, {"key": "B", "text": "《魏律》以《周禮》“八辟”為依據，正式規定了“八議”制度"}, {"key": "C", "text": "《北周律》首次規定了“重罪十條”"}, {"key": "D", "text": "《北魏律》與《陳律》正式確立了“官當”制度"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】C項錯在“重罪十條”首次規定在《北齊律》中，而不是《北周律》。北齊為維護封建國家根本利益，在《北齊律》中首次規定“重罪十條”，是對危害統治階級根本利益的十種重罪的總稱。把“重罪十條”置於律首，作為嚴厲打擊的對象，增加了法律的威懾力量。ABD均表述正確。"}, {"id": "卷一-56", "subject": "卷一", "type": "多選題", "question": "某縣衛生和計劃生育局對秦某夫婦征收社會撫養費5萬元，縣政府經復議將費用減為4萬元。秦某不服遂向法院起訴。法院經審理認為征收4萬元仍錯誤。法院可如何處理？（　）", "options": [{"key": "A", "text": "變更縣政府的決定，確定應交納費用的具體標準"}, {"key": "B", "text": "確認縣政府的決定違法，責令縣衛生和計劃生育局重新作出決定專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 22"}, {"key": "C", "text": "撤銷縣政府的決定，責令縣衛生和計劃生育局重新作出決定"}, {"key": "D", "text": "撤銷縣政府的決定，責令縣政府重新作出決定"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】本案為復議改變案件，被告為縣政府，被訴行政行為是縣政府的決定，法院的判決只能針對縣政府，故排除B、C項。根據《行政訴訟法》第77條第1款，行政行為涉及對款額的確定、認定確有錯誤的，法院可以判決變更。故A項正確。既然縣政府的征收決定違法，故法院也可判決撤銷。根據《行訴法解釋》第 89條，復議決定改變原行政行為錯誤，人民法院判決撤銷復議決定時，可以一併責令復議機關重新作出復議決定或者判決恢復原行政行為的法律效力。故D項正確。"}, {"id": "卷一-57", "subject": "卷一", "type": "多選題", "question": "法系是法學上的一個重要概念。關於法系，下列哪些選項是正確的？（）", "options": [{"key": "A", "text": "法系是一個比較法學上的概念，是根據法的歷史傳統和外部特徵的不同對法所作的分類"}, {"key": "B", "text": "歷史上曾經存在很多個法系，但大多都已經消亡，目前世界上僅存的法系只有民法法系和普通法系"}, {"key": "C", "text": "民法法系有編纂成文法典的傳統，因此，有成文法典的國家都屬於民法法系"}, {"key": "D", "text": "法律移植是一國對外國法的借鑒、吸收和攝取，因此，法律移植是法系形成和發展的重要途徑"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】法系是比較法學上的基本概念，指根據法的歷史傳統和外部特徵的不同，對法所作的分類。當今世界上除民法法系和普通法系外，尚存伊斯蘭法系等。近來以來，普通法系國家也出現了少量法典。故 AD正確，BC錯誤。"}, {"id": "卷一-58", "subject": "卷一", "type": "多選題", "question": "甲盜掘國家重點保護的古墓葬，竊取大量珍貴文物，並將部分文物偷偷運往境外出售牟利。司法機關發現後，甲為毀滅罪證將剩餘珍貴文物損毀。關於本案，下列哪些選項是錯誤的？（）", "options": [{"key": "A", "text": "運往境外出售與損毀文物，屬於不可罰的事後行為，對甲應以盜掘古墓葬罪、盜竊罪論處"}, {"key": "B", "text": "損毀文物是為自己毀滅證據的行為，不成立犯罪，對甲應以盜掘古墓葬罪、盜竊罪、走私文物罪論處"}, {"key": "C", "text": "盜竊文物是盜掘古墓葬罪的法定刑升格條件，對甲應以盜掘古墓葬罪、走私文物罪、故意損毀文物罪論處"}, {"key": "D", "text": "盜掘古墓葬罪的成立不以盜竊文物為前提，對甲應以盜掘古墓葬罪、盜竊罪、走私文物罪、故意損毀文物罪論處"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】根據《刑法》第328條的規定，盜竊珍貴文物是盜掘古墓葬罪法定刑升格條件，因此，本案中盜竊文物的行為不構成盜竊罪。選項ABD都是錯誤的。不可罰的事後行為，也稱為共罰的事後行為，是指在狀態犯的場合，利用該犯罪行為的結果的行為，如果孤立地看，符合其他犯罪的構成要件，但是由於被綜合評價在該狀態犯中，故沒有必要另認定為其他犯罪。但是如果事後行為侵犯新的法益，則後一行為構成其他犯罪 。與屬於種類物的一般財物不同，文物是特定物，將文物運往境外出售與損毀文物的行為，都已經侵害了新的法益，因此不能將其視為不可罰的事後行為，而是構成走私文物罪與故意損毀文物罪。因此選項C是正確的 。"}, {"id": "卷一-59", "subject": "卷一", "type": "多選題", "question": "關於受賄罪，下列哪些說法是正確的？（）", "options": [{"key": "A", "text": "地稅局局長甲的妻子張某大肆收受他人賄賂，通過甲的職權為他人謀取不正當利益，張某成立利用影響力受賄罪，若甲事後知情後未將賄賂退還或上繳的，甲成立受賄罪"}, {"key": "B", "text": "副縣長乙讓其情人李某在某企業掛名領取酬薪，乙成立受賄罪"}, {"key": "C", "text": "國企總經理領導丙多次結婚、離婚，每次辦婚禮均收受下級王某禮金3萬元，但王某未向丙提出任何請託事項，丙總是不時給王某一些關照，丙成立受賄罪"}, {"key": "D", "text": "公安局局長丁收受下級高某的名車後（從未辦理汽車過戶手續），利用職權幫助高某獲得職務晉升，造成嚴重後果，對丁應以受賄罪未遂和濫用職權罪，擇一重罪處罰"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】本題重點考查了《最高人民法院、最高人民檢察院關於辦理貪污賄賂刑事案件適用法律若干問題的解釋》中的一些規定。 23 A項正確。《最高人民法院、最高人民檢察院關於辦理貪污賄賂刑事案件適用法律若干問題的解釋》規定：特定關係人索取、收受他人財物，國家工作人員知道後未退還或者上交的，應當認定國家工作人員具有受賄故意，張某為甲的特定關係人。 B項正確。《最高人民法院、最高人民檢察院關於辦理受賄刑事案件適用法律若干問題的意見》中規定，以特定關係人“掛名”領取薪酬的，成立受賄罪。 C項正確。《最高人民法院、最高人民檢察院關於辦理貪污賄賂刑事案件適用法律若干問題的解釋》規定：國家工作人員索取、收受具有上下級關係的下屬或者具有行政管理關係的被管理人員的財物價值3萬元以上，可能影響職權行使的，視為承諾為他人謀取利益。據此，上下級之間的某些“感情投資”也可認定為'‘為他人謀取利益”，收受下屬或者行政被管理人超出人情往來範圍財物的，視為承諾為他人謀取利益，逢年過節送一些禮品、紅包，行賄人也沒有明確的請託事項，受賄人可能還沒有利用職務為他人辦任何事，也可成立受賄罪。 D項錯誤。收受請託人房屋、汽車，未變更權屬登記的，不影響受賄既遂的成立。對丁應以受賄罪既遂與濫用職權罪並罰。"}, {"id": "卷一-60", "subject": "卷一", "type": "多選題", "question": "錢某從梁某處購得假幣2萬餘元，並用假幣交納了房租2萬元。錢某為了發財，便偽造貨幣10萬元後，找到關某予以出售。關於錢某的行為，下列哪些選項是正確的？（　）", "options": [{"key": "A", "text": "錢某的行為構成購買假幣罪"}, {"key": "B", "text": "錢某的行為構成使用假幣罪"}, {"key": "C", "text": "錢某的行為構成出售假幣罪"}, {"key": "D", "text": "錢某的行為構成偽造貨幣罪"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】根據《關於審理偽造貨幣等案件具體應用法律若干問題的解釋》第2條規定：“行為人購買假幣後使用，構成犯罪的，依照刑法第一百七十一條的規定，以購買假幣罪定罪，從重處罰。”本案中，錢某從梁某處購得假幣2萬餘元，並用假幣交納了房租2萬元，屬於購買假幣後又使用了假幣的行為，應當按照購買假幣罪定罪，從重處罰。根據《刑法》第171條第3款規定，偽造貨幣並出售或者運輸偽造的貨幣的，依照本法第一百七十條的規定定罪從重處罰。錢某後又偽造貨幣並將貨幣出售給關某，成立偽造貨幣罪一罪，並從重處罰。故A、D項正確。"}, {"id": "卷一-61", "subject": "卷一", "type": "多選題", "question": "依據法官職業道德規範，關於法官行為，下列哪些評論是正確的？（　　）", "options": [{"key": "A", "text": "徐法官在接待當事人的過程中，針對當事人對判決書提出的質疑，以不屑的口吻說：“你一個文盲加法盲 ，有什麼資格來質問我？”評論：徐法官的行為不符合司法禮儀"}, {"key": "B", "text": "藍法官在開庭調解時，為營造輕鬆和諧的氣氛，身著便裝，談笑風生。評論：藍法官的行為違反法庭規則"}, {"key": "C", "text": "周法官在當地出席大學同學私人投資的公司開業典禮，並在被公開介紹法官身份後登台致賀辭。評論：周法官的此行為違反了不得以職業、身份、聲譽謀取利益的義務"}, {"key": "D", "text": "謝法官正在承辦一宗合同糾紛案件。該案被告向謝法官的配偶林某任職的A公司表示，願將一個工程項目發包給該公司，條件是讓林某任該項目的主管。林某將此事告訴了謝法官，並提及發包人是該案的被告。謝法官聽後未置一詞。評論：謝法官的行為違反了約束家庭成員的義務"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】C項的評論錯誤，因為周法官並未以職業、身份、聲譽謀取利益，而是從事不合適的業外活動。"}, {"id": "卷一-62", "subject": "卷一", "type": "多選題", "question": "甲乙兩國因邊境衝突引發戰爭，甲國軍隊俘獲數十名乙國戰俘。依《日內瓦公約》，關於戰俘待遇，下列哪些選項是正確的？（　　）", "options": [{"key": "A", "text": "乙國戰俘應保有其被俘時所享有的民事權利"}, {"key": "B", "text": "戰事停止後甲國可依乙國戰俘的情形決定遣返或關押"}, {"key": "C", "text": "甲國不得將乙國戰俘扣為人質"}, {"key": "D", "text": "甲國為使本國某地區免受乙國軍事攻擊可在該地區安置乙國戰俘專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 24"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】根據《日內瓦第三公約》（簡稱《公約》）的規定，戰俘應保有其被俘時所享有的民事權利 ，戰俘的個人財物除武器、馬匹、軍事裝備和軍事文件以外的自用物品一律歸其個人所有；戰俘的金錢和貴重物品可由拘留國保存，但不得沒收。故選項A正確。《公約》規定不得將戰俘扣為人質，選項C正確。根據 《公約》規定，戰事停止後，戰俘應即予以釋放並遣返，不得遲延，選項B錯誤。交戰方應將戰俘拘留所設在比較安全的地帶，無論何時都不得把戰俘送往或拘留在戰鬥地帶或炮火所及的地方，也不得為使某地點或某地區免受軍事攻擊而在這些地區安置戰俘，選項D錯誤。"}, {"id": "卷一-63", "subject": "卷一", "type": "多選題", "question": "下列哪些地方性法規的規定違反《行政許可法》？（　　）", "options": [{"key": "A", "text": "申請餐飲服務許可證，須到當地餐飲行業協會辦理認證手續"}, {"key": "B", "text": "申請娛樂場所表演許可證，文化主管部門收取的費用由財政部門按一定比例返還"}, {"key": "C", "text": "外地人員到本地經營網吧，應當到本地電信管理部門註冊並繳納特別管理費"}, {"key": "D", "text": "申請建設工程規劃許可證，需安裝建設主管部門指定的節能設施"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】根據《行政許可法》第15條第2款規定：“地方性法規和省、自治區、直轄市人民政府規章，不得設定應當由國家統一確定的公民、法人或者其他組織的資格、資質的行政許可；不得設定企業或者其他組織的設立登記及其前置性行政許可。其設定的行政許可，不得限制其他地區的個人或者企業到本地區從事生產經營和提供服務，不得限制其他地區的商品進入本地區市場。”據此AC選項違反行政許可法。根據《行政許可法》第59條規定：“行政機關實施行政許可，……所收取的費用必須全部上繳國庫，任何機關或者個人不得以任何形式截留、挪用、私分或者變相私分。財政部門不得以任何形式向行政機關返還或者變相返還實施行政許可所收取的費用。”故B選項違反了行政許可法。根據《行政許可法》第16條第4款規定：“對行政許可條件作出的具體規定，不得增設違反上位法的其他條件。”D選項中地方性法規規定申請建設工程規劃許可證，需安裝建設主管部門指定的節能設施，實際上是增設了違反上位法的其他條件，D選項也當選。"}, {"id": "卷一-64", "subject": "卷一", "type": "多選題", "question": "關於行政處罰的設定下列哪些說法是錯誤的？（）", "options": [{"key": "A", "text": "法律設定行政處罰沒有任何限制"}, {"key": "B", "text": "地方性法規可以設定除限制人身自由、降低資質等級以外的行政處罰"}, {"key": "C", "text": "市級政府規章可以設定警告、通報批評或者一定數額罰款的行政處罰"}, {"key": "D", "text": "除法律、法規、省級政府規章外，其他規範性文件不得設定行政處罰"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】A選項錯誤。《行政處罰法》（2021年修訂）第10條規定，“法律可以設定各種行政處罰。 限制人身自由的行政處罰，只能由法律設定。”該條款只是表明法律可以設定各種行政處罰種類，但是作為一種立法行為，即使是法律設定行政處罰的過程中也要受到立法法的約束，而不是沒有任何限制。這一選項實際上考察的是語言理解。 B選項錯誤。《行政處罰法》（2021年修訂）第12條笫1款規定，“地方性法規可以設定除限制人身自由、吊銷營業執照以外的行政處罰。” C選項正確。《行政處罰法》（2021年修訂）第14條規定，“地方政府規章可以在法律、法規規定的給予行政處罰的行為、種類和幅度的範圍內作出具體規定。尚未制定法律、法規的，地方政府規章對違反行政管理秩序的行為，可以設定警告、通報批評或者一定數額罰款的行政處罰。罰款的限額由省、自治區、直轄市人民代表大會常務委員會規定。” D選項錯誤。《行政處罰法》（2021年修訂）第14條規定，“地方政府規章可以在法律、法規規定的給予行政處罰的行為、種類和幅度的範圍內作出具體規定。尚未制定法律、法規的，地方政府規章對違反行政管理秩序的行為，可以設定警告、通報批評或者一定數額罰款的行政處罰。罰款的限額由省、自治區、直轄市人民代表大會常務委員會規定。”這說明市級政府規章也可以設定行政處罰。既然C選項正確，那麼D選項則肯定是錯誤的。 25"}, {"id": "卷一-65", "subject": "卷一", "type": "多選題", "question": "關於明清時期的司法制度，下列哪些選項是正確的？", "options": [{"key": "A", "text": "明清時期各中央司法機構的職能與隋唐時期相反，刑部負責審判，大理寺負責復核"}, {"key": "B", "text": "明朝的廷杖之制是根據皇帝意志而形成的法外用刑慣例"}, {"key": "C", "text": "明清會審制度是慎刑思想的反映，但是導致多方干預司法，使實際執法與法律制度日益脫節"}, {"key": "D", "text": "“申明亭”為明代法定的基層調解機構，對維護社會秩序有一定積極作用"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】明清時期刑部負責審理中央百官犯罪、審核地方上報的重案（死刑交大理寺復核）、審理髮生在京師的笞杖刑以上案件、處理地方上訴案及秋審事宜、主持司法行政與律例修訂事宜。大理寺掌復核駁正 ，以及死刑復核。而隋唐時期的大理寺掌審判，而刑部掌案件復核。可見，明清時期大理寺和刑部的職能與隋唐正好相反。因此，A項說法正確。廷杖是由皇帝下令，錦衣衛施刑，司禮監監刑，在朝堂上杖責大臣的制度。因此，B項說法正確。明清時期的會審制度是一種慎刑思想的反映，但卻導致多方干預司法，以致皇帝家奴也插手司法，最終結果是司法更加冤濫，法律制度與實際執法日益脫節，加速了王朝整個政體的腐朽。因此，C項說法正確。申明亭是明太祖朱元璋於洪武五年（1372）創建的讀法、明理、彰善抑惡、剖決爭訟小事 、輔弼刑治之所。每裡推選一年高有德之人掌其事，曰老人，老人除執掌教化外，老人還剖斷裡中人戶爭訟之事。可見，老人有調解中間人的作用，在創立之初，申明亭對維護社會秩序有一定的積極作用。因此，D項說法正確。"}, {"id": "卷一-66", "subject": "卷一", "type": "多選題", "question": "關於構成要件要素的分類，下列哪些選項是正確的？（　　）", "options": [{"key": "A", "text": "販賣淫穢物品牟利罪中的“販賣”是記述的構成要件要素，“淫穢物品”是規範的構成要件要素"}, {"key": "B", "text": "販賣毒品罪中的“販賣”是記述的構成要件要素，“毒品”是規範的構成要件要素"}, {"key": "C", "text": "強制猥褻婦女罪中的“婦女”是記述的構成要件要素，“猥褻”是規範的構成要件要素"}, {"key": "D", "text": "搶劫罪的客觀構成要件要素是成文的構成要件要素，“非法占有目的”是不成文的構成要件要素"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】依照刑法理論，構成要件要素可分為記述的構成要件要素與規範的構成要件要素。在解釋構成要件要素和認定是否存在符合構成要件要素的事實時，如果只需要法官的認識活動即可確定，這種構成要件要素便是記述的構成要件要素；如果需要法官的規範的、評價的價值判斷才能認定，這種構成要件要素就是規範的構成要件要素。對於“販賣”、“毒品”、“婦女”的理解，以及對客觀事實是否符合這些要素，都只需要一般的認識活動與基本的對比判斷就可以得出結論，因而屬於記述的構成要件要素。反之，例如“猥褻”和“淫穢物品”，則需要司法者的規範的、評價的行為才能認定。因此AC正確，B錯誤。構成要件要素還可分為成文的構成要件要素與不成文的構成要件要素。成文的構成要件要素，是指刑法明文規定的構成要件要素。絕大多數構成要件要素都是成文的構成要件要素。不成文的構成要件要素，是指刑法條文表面上沒有明文規定，但根據刑法條文之間的相互關係、刑法條文對相關要素的描述所確定的，成立犯罪所必須具備的要素。就一些具體犯罪而言，由於眾所周知的理由或者其他原因，刑法並沒有將所有的構成要件要素完整地規定下來，而是需要法官在適用過程中進行補充。搶劫罪中的“非法占有目的”就屬於不成文的構成要件要素。故D正確。"}, {"id": "卷一-67", "subject": "卷一", "type": "多選題", "question": "某培訓企業與風投機構簽訂股權投資對賭協議，後因協議履行發生糾紛訴至法院。法官在審理時根據《民法典》第153條“違反法律、行政法規的強制性規定的民事法律行為無效。但是，該強制性規定不導致該民事法律行為無效的除外”，認為該股權投資對賭協議違反了國務院頒布的某《條例》的規定，應屬無效。法官遂引用《民法典》第153條與國務院頒布的《條例》相關條文作出裁判。關於本案，下列說法錯誤的是：", "options": [{"key": "A", "text": "法官找尋裁判本案所需法律條文的過程屬於外部證成"}, {"key": "B", "text": "法官在本案採用了歸納推理"}, {"key": "C", "text": "若法官審理過程中發現《條例》的有關規定違反《民法典》，可以對其進行審查並宣告其是否有效"}, {"key": "D", "text": "法官找尋裁判本案所需法律條文，並作出裁判的過程屬於涵攝"}], "answer": ["B", "C"], "explanation_full": "26 正確。B項錯誤，本案採用的是演繹推理。C項錯誤，法院無權對其進行審查並宣告其是否有效。D項正確。涵攝：讓針對不特定主體反覆適用的規範適用於特定案件中的特定主體的一個過程。"}, {"id": "卷一-68", "subject": "卷一", "type": "多選題", "question": "下列情形，構成以危險方法危害公共安全罪的有", "options": [{"key": "A", "text": "在火災現場破壞消防器材，危害公共安全"}, {"key": "B", "text": "生產、銷售有毒、有害食品，危害公共安全"}, {"key": "C", "text": "邪教組織人員以自焚、自爆方法危害公共安全"}, {"key": "D", "text": "故意傳播突發傳染病病原體，危害公共安全"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】以危險方法危害公共安全罪是指除放火、決水、爆炸、投放危險物質以外的其他危險方法危害公共安全的行為。由於本罪的罪狀不明確，在認定時容易違反罪刑法定原則，所以成為考試重點，考生應該注意這塊內容的復習。A項，在火災現場破壞消防器材，因為已經發生了火災這種具體危險，破壞消防器材也就產生了具體危險，這種具體危險的程度與放火罪、決水罪、爆炸罪、投放危險物質罪的具體危險具有相當性，構成了以危險方法危害公共安全罪，A項正確。B項，如果某種行為符合其他犯罪的構成要件，應盡量認定為其他犯罪，不宜認定為以危險方法危害公共安全罪，故B項中應定生產、銷售有毒、有害食品罪，B項錯誤。C項和D項，根據司法解釋，故意傳播突發傳染病病原體危害公共安全和邪教組織人員以白焚、白爆方法危害公共安全可以認定為以危險方法危害公共安全罪，C項和D項正確。"}, {"id": "卷一-69", "subject": "卷一", "type": "多選題", "question": "根據《憲法》和法律的規定，關於民族區域自治制度，下列選項正確的是", "options": [{"key": "A", "text": "自治區人大制定的地方性法規報全國人大常委會批准，不用備案"}, {"key": "B", "text": "民族自治地方法院的審判工作，受最高法院和上級法院監督"}, {"key": "C", "text": "經國務院批准，自治機關可組織公安部隊"}, {"key": "D", "text": "民族自治地方自主決定本地區人口政策，不實行計劃生育"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】A錯誤，自治區人大制定的民族法規需要報全常批准，不用備案。自治區人大及其常委會制定的地方性法規不需要批准，需要報全常和國務院備案。B項正確，《民族區域自治法》第46條規定：民族自治地方人民法院的審判工作，受最高人民法院和上級人民法院監督。C項正確，公安邊貿國務院批。D錯誤，計劃生育是基本國策，自治地方也要實行。"}, {"id": "卷一-70", "subject": "卷一", "type": "多選題", "question": "關於扣押程序，下列說法或做法正確的是", "options": [{"key": "A", "text": "實施扣押時，司機梁某拒絕在現場筆錄上簽名蓋章，執法人員應當邀請見證人到場"}, {"key": "B", "text": "扣押清單一式二份，由當事人和行政機關分別保存"}, {"key": "C", "text": "交管局應當當場告知當事人實施扣押的理由、依據以及依法享有的權利、救濟途徑"}, {"key": "D", "text": "因情況複雜，執法人員周某決定延長扣押期限，並將延長扣押的決定及理由口頭告知當事人"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】A項錯誤，現場筆錄由當事人（當事人不在場的邀請見證人）和執法人員簽名或蓋章，當事人拒絕簽名的在筆錄中註明。B項正確，扣押清單一式兩份，由當事人和行政機關分別保存。C項正確，對採取行政強制措施的當事人，當場告知其理由、依據和權利。D項錯誤，扣押期限不得超過30日，情況複雜的經行政機關負責人批准可以延長，延長期限不得超過30日，法律、行政法規另有規定的除外。延長決定應及時書面告知當事人，並說明理由。"}, {"id": "卷一-71", "subject": "卷一", "type": "多選題", "question": "馬某未經批准擅自在小區中搭建了儲藏室，區規劃局對其罰款500元，馬某不服，提起訴訟，下列說法正確是", "options": [{"key": "A", "text": "馬某確有證據證明被告持有的證據對其有利的，可以在開庭審理前書面申請法院責令行政機關提交該證據"}, {"key": "B", "text": "法院可以要求馬某本人到庭接受詢問並簽署保證書"}, {"key": "C", "text": "文盲馬某可以口頭委託訴訟代理人專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 27"}, {"key": "D", "text": "本案應當由不動產所在地法院管轄"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】A項正確，原告或者第三人確有證據證明被告持有的證據對原告或者第三人有利的，可以在開庭審理前書面申請法院責令行政機關提交。B項正確，法院認為確有必要的，可以要求當事人本人或者行政機關執法人員到庭，就案件有關事實接受詢問。在詢問之前，可以要求其簽署保證書。C項錯誤，行政訴訟中，公民只有因被限制人身自由而不能提起訴訟的，其近親屬可依其口頭委託以該公民的名義起訴。本案中馬某不可以口頭委託，但可以讓他人代書來進行委託（注意復議可以口頭申請）。D項錯誤，涉及物權變動才屬於不動產案件，本案行政機關僅作出處罰，故不適用不動產案件的專屬管轄。"}, {"id": "卷一-72", "subject": "卷一", "type": "多選題", "question": "鄒某因在其居住的小區被狗咬過，想要將小區的狗毒死，便用氟乙酸類鼠藥浸泡雞肝，將毒雞肝投放在小區草坪。由於小區的草坪並沒有被柵欄圍起來，鄒某的行為導致在小區內玩耍的4歲的王某誤食毒雞肝死亡 ，同時導致小區5名業主飼養的6隻寵物犬誤食毒雞肝死亡。鄒某構成什麼犯罪", "options": [{"key": "A", "text": "過失致人死亡罪"}, {"key": "B", "text": "故意毀壞財物罪"}, {"key": "C", "text": "投放危險物質罪"}, {"key": "D", "text": "故意殺人罪"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】鄒某將毒雞肝投放在小區的草坪上，由於小區的草坪沒有被柵欄圍起來，屬於觸手可及的範圍 ，存在毒雞肝被小區中小孩誤食的危險，鄒某應當對這種危險有所認識，但鄒某為達到將狗毒死的目的，仍實施投放行為，且沒有放置危險警示標誌，因此應當認為鄒某存在殺人的間接故意，因此對王某的死亡，應當認定其鄒某具有殺人的間接故意，而非過失。所以，A選項錯誤，D選項正確。鄒某的行為導致小區的6隻寵物狗死亡，該行為符合構成故意財物罪的構成要件。所以，B選項正確。同時，將毒雞肝投放在屬於公共領域的草坪，有可能會導致不特定多數的人死亡或不特定的多數的財物損失，可以認定該行為的公共危險性質 ，鄒某對此具有概括的認識，因此該行為也同時構成投放危險物質罪（與故意殺人罪、故意毀壞財物罪構成想象競合，擇一重罪處罰）。所以，C選項正確。"}, {"id": "卷一-73", "subject": "卷一", "type": "多選題", "question": "關於村委會組織法，下列說法錯誤的是∶", "options": [{"key": "A", "text": "鄉政府指導支持幫助村委會的工作，但不幹預自治事項。村委會協助鄉政府開展工作"}, {"key": "B", "text": "選委會應當在選舉日20日前公布登記參加選舉的村民名單，有異議者應自名單公布之日5日內向選委會申訴 ，選委會應在收到申訴之日起3日內做出決定"}, {"key": "C", "text": "村委會有權制定村規民約，經村民會議批准後，報鄉政府備案"}, {"key": "D", "text": "村民會議的工作報告由村委會負責審議"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】A項正確。根據《村民委員會組織法》第5條：鄉、民族鄉、鎮的人民政府對村民委員會的工作給予指導、支持和幫助，但是不得干預依法屬於村民自治範圍內的事項。村民委員會協助鄉、民族鄉、鎮的人民政府開展工作。B項正確，根據《村民委員會組織法》第14條：登記參加選舉的村民名單應當在選舉日的二十日前由村民選舉委員會公布。對登記參加選舉的村民名單有異議的，應當自名單公布之日起五日內向村民選舉委員會申訴，村民選舉委員會應當自收到申訴之日起三日內作出處理決定，並公布處理結果。C項錯誤 ，村民會議可以制定和修改村規民約，並報鄉政府備案。D項錯誤，村民會議審議村委會的工作報告。"}, {"id": "卷一-74", "subject": "卷一", "type": "多選題", "question": "關於全國人大的開會程序，以下說法錯誤的是∶", "options": [{"key": "A", "text": "全國人大會議每年至少舉行一次"}, {"key": "B", "text": "全國人大常委會召集並主持全國人大會議"}, {"key": "C", "text": "全體會議一般公開舉行，必要時經主席團和各代表團團長會議決定可以舉行秘密會議"}, {"key": "D", "text": "臨時舉行的全國人大會議由全國人大常委會或者1/5以上的人大代表召集 28"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】A項錯誤，全國人大每年舉行一次會議。地方人大每年至少舉行一次會議。B項錯誤，全常召集全國人大會議，正式開會由主席團主持。C項正確。D項錯誤，全常、1/5以上全國人大代表可以提議召開臨時會議。"}, {"id": "卷一-75", "subject": "卷一", "type": "多選題", "question": "關於憲法修正案，下列哪些說法是錯誤的", "options": [{"key": "A", "text": "2018年憲法修正案首次將中國共產黨的領導是社會主義的最本質的特徵寫入憲法"}, {"key": "B", "text": "1999年憲法修正案規定非公有制經濟是社會主義市場經濟的重要組成"}, {"key": "C", "text": "2004年憲法修正案將“法律委員會”更名為“憲法和法律委員會”"}, {"key": "D", "text": "1999年憲法修正案規定中國共產黨領導的多黨合作和政治協商制度將長期存在和發展"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】A項錯誤，首次寫入憲法總綱。B項正確。C項錯誤，2018年修正案將“法律委員會”更名為“憲法和法律委員會”。D項錯誤，1993年修正案規定中國共產黨領導的多黨合作和政治協商制度將長期存在和發展。"}, {"id": "卷一-76", "subject": "卷一", "type": "多選題", "question": "甲因詐騙被某縣公安機關立案偵查，下列表述不正確的有∶", "options": [{"key": "A", "text": "偵查機關可以赴某銀行扣押甲詐騙所得的贓款"}, {"key": "B", "text": "偵查機關可以查封甲用於詐騙的手機"}, {"key": "C", "text": "偵查機關凍結甲涉案銀行卡的期限不得超過12個月"}, {"key": "D", "text": "偵查機關不得扣押與甲案無關的財物"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】A項∶查封、扣押與查詢、凍結的對象不同。查封、扣押一般針對物證、書證等實物證據；查詢 、凍結則針對存款、匯款、債券、股票、基金等財產。甲詐騙所得的贓款應為存款或匯款，因而應當是凍結而非扣押。故A選項說法錯誤。B項∶查封一般是針對不可移動的財物就地封存；扣押一般是將可移動的財產轉移至有關機關的控制下。因而甲用於詐騙的手機應當是進行扣押而非查封。故B選項說法錯誤。C項∶凍結存款、匯款等財產的期限為6個月。對於重大、複雜案件經設區的市一級以上公安機關負責人批准凍結的期限可為1年。本題中並未提及是重大、複雜的案件因而期限不得超過6個月而非12個月。故C選項說法錯誤。D項 ∶與案件無關的財物不可以查封扣押。故D選項說法正確。"}, {"id": "卷一-77", "subject": "卷一", "type": "多選題", "question": "下列關於刑事通緝的表述，正確的有∶", "options": [{"key": "A", "text": "檢察院可以決定通緝"}, {"key": "B", "text": "監察委員會可以決定通緝"}, {"key": "C", "text": "法院可以決定通緝"}, {"key": "D", "text": "A某縣公安機關發現犯罪嫌疑人已逃往B縣，如需通緝，A縣公安機關應當通知B縣公安機關發布通緝令"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】可以決定通緝的主體有∶公安機關、檢察院（只能決定不能實施）、監委會，法院沒有權利決定通緝，故A、B正確，C錯誤。D錯誤，各級公安機關在自己管轄的地區以內，經縣級以上公安機關負責人批准，可以直接發布通緝令;超過自己管轄的地區，應當報請有權決定的上級機關發布。故本題中，A縣只能報請A與B縣的共同上級發布通緝令。"}, {"id": "卷一-78", "subject": "卷一", "type": "多選題", "question": "下列關於補充偵查的表述，不正確的有∶", "options": [{"key": "A", "text": "公安機關將案件偵查終結移送檢察院審查起訴，公安機關發現案件事實不清，需要補充偵查的，可以將案件撤回進行補充偵查"}, {"key": "B", "text": "公安機關報請檢察院審香批准逮捕犯罪嫌疑人，檢察院認為事實不清，需要補充偵查的，可以自行補充偵查"}, {"key": "C", "text": "檢察院審查起訴時發現案件事實不清，需要補充偵查的，可以自行補充偵查"}, {"key": "D", "text": "審判階段，法院經過審理認為案件事實不清，需要補充偵查的，可以將案件退回檢察院進行補充偵查專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 29"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】審查起訴階段，檢察院對需要補充偵查的案件可以退回公安補充偵查也可以自行偵查。故C選項說法正確。A項錯誤，偵查終結移送檢察院審查起訴後，公安不能將案件撤回。B項錯誤，審查批捕時只能公安機關補充偵查。D項錯誤，審判階段只能檢察院補偵。"}, {"id": "卷一-79", "subject": "卷一", "type": "多選題", "question": "A因詐騙被甲縣檢察院向甲縣法院提起公訴，法院進行庭前審查，下列表述不正確的有∶", "options": [{"key": "A", "text": "若發現A詐騙案應當屬於乙縣法院審理，應當裁定不予受理"}, {"key": "B", "text": "若發現A詐騙行為已過追訴時效，應當裁定終止審理"}, {"key": "C", "text": "若發現A已經脫逃，應當將案件退回甲縣檢察院"}, {"key": "D", "text": "若發現甲縣檢察院移送的案卷材料有遺漏，應當將案件退回甲縣檢察院"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】A項∶公訴案件庭前審查若發現案件不屬於本院管轄應當將案件退回檢察院，而非不予受理。故 A選項說法錯誤。B項∶若審查發現存在時特告死的情況應將案件退回檢察院。該選項是過時效，故B選項說法錯誤。C項∶被告人不在案的應當退回檢察院。故C選項說法正確。D項∶發現需要補充材料的，應通知檢察院在三日內補送，而非退回檢察院。故D選項說法錯誤。"}, {"id": "卷一-80", "subject": "卷一", "type": "多選題", "question": "甲向某縣法院訴乙侮辱罪，某縣法院對乙決定逮捕，經過審理，甲與乙達成和解協議，下列表述不正確的有∶", "options": [{"key": "A", "text": "某具法院若經過審理，認為甲缺乏罪證，目無法提出補充證據，某縣法院應當說服甲撤回起訴"}, {"key": "B", "text": "某縣法院可以要求某縣公安機關協助收集乙相關犯罪證據"}, {"key": "C", "text": "若甲申請撤訴，法院應當裁定准許"}, {"key": "D", "text": "鑒於甲與乙達成和解協議，某縣法院應當立即釋放乙"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】A項∶缺乏罪證且無法提出補充證據，應當說服撤訴或裁定駁回起訴。故A選項說法錯誤。B項 ∶提供證據確有困難的，法院可要求公安協助收集。故B選項說法錯誤。C項∶自訴人撤訴法院應先審查其是否自願撤訴。故C選項說法錯誤。D項∶法院裁定准予撤訴後才能變更強制措施。故D選項說法錯誤。"}, {"id": "卷一-81", "subject": "卷一", "type": "多選題", "question": "甲乙因詐騙在某具法院受審，甲認罪認罰，乙拒不認罪，法院使用普通程序進行審理，某縣檢察院提出了量刑建議，下列表述不正確的有：", "options": [{"key": "A", "text": "某具檢察院認為案件事實清楚，應當對甲提出量刑建議，無需對乙提出量刑建議"}, {"key": "B", "text": "某縣檢察院對甲提出的量刑建議應當具有一定幅度"}, {"key": "C", "text": "某具法院對甲乙全案不得適用認罪認罰從寬制度"}, {"key": "D", "text": "某縣法院若認為某縣檢察院提出的量刑建議不當，可以告知某縣檢察院，由某縣檢察院決定是否調整量刑建議"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】A項錯誤，被告人認罪認罰的，檢察院應當提出量刑建議。犯罪事實清楚，證據確實充分，可以提出量刑建議。甲應當提，乙可以提。B項錯誤，主刑可以有一定的幅度，也可以提出確定的刑期的量刑建議 。C項錯誤，甲認罪認罰可以適用。D項正確，量刑建議不當可以告知檢察院。檢察院調整量刑建議應當在法庭審理結束前提出。"}, {"id": "卷一-82", "subject": "卷一", "type": "多選題", "question": "關於健全依法維權和化解糾紛機制，下列哪些選項是正確的？（）", "options": [{"key": "A", "text": "健全社會矛盾糾紛預防化解機制，完善調解、仲裁、行政裁決、行政復議、訴訟等有機銜接、相互協調的多元化糾紛解決機制"}, {"key": "B", "text": "建立健全社會矛盾預警機制、利益表達機制、協商溝通機制、救濟救助機制"}, {"key": "C", "text": "依法嚴厲打擊暴力恐怖、涉黑犯罪、邪教和黃賭毒等違法犯罪活動，絕不允許其形成氣候"}, {"key": "D", "text": "依法強化危害食品藥品安全、影響安全生產、損害生態環境、破壞網絡安全等重點問題治理專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 30"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】健全社會矛盾糾紛預防化解機制，完善調解、仲裁、行政裁決、行政復議、訴訟等有機銜接、 相互協調的多元化糾紛解決機制。加強行業性、專業性人民調解組織建設，完善人民調解、行政調解、司法調解聯動工作體系。完善仲裁制度，提高仲裁公信力。健全行政裁決制度，強化行政機關解決同行政管理活動密切相關的民事糾紛功能。故A項正確。構建對維護群眾利益具有重大作用的制度體系，建立健全社會矛盾預警機制、利益表達機制、協商溝通機制、救濟救助機制，暢通群眾利益協調、權益保障法律渠道。把信訪納入法治化軌道，保障合理合法訴求依照法律規定和程序就能得到合理合法的結果。故B項正確。深入推進社會治安綜合治理，健全落實領導責任制。完善立體化社會治安防控體系，有效防範化解管控影響社會安定的問題，保障人民生命財產安全。依法嚴厲打擊暴力恐怖、涉黑犯罪、邪教和黃賭毒等違法犯罪活動，絕不允許其形成氣候。依法強化危害食品藥品安全、影響安全生產、損害生態環境、破壞網絡安全等重點問題治理 。故C、D項正確。"}, {"id": "卷一-83", "subject": "卷一", "type": "多選題", "question": "關於律師違規行為的處分，下列哪些說法是錯誤的", "options": [{"key": "A", "text": "只有中華全國律師協會及各省、自治區、直轄市律師協會有權設立懲戒委員會，負責律師行業處分相關規則的制定及對地方律師協會處分工作的指導與監督"}, {"key": "B", "text": "投訴人可以採用信函、郵件和直接來訪等方式投訴，但不可以委託他人代為投訴"}, {"key": "C", "text": "設區的市律師協會可以作出訓誡、警告、通報批評、公開譴責、中止會員權利一個月以上一年以下、取消會員資格的紀律處分"}, {"key": "D", "text": "投訴人就被投訴會員的違規行為已提起訴訟、仲裁等司法程序案件的，不予立案"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】根據《律師協會會員違規行為處分規則（試行）》第8條的規定：“中華全國律師協會設立懲戒委員會，負責律師行業處分相關規則的制定及對地方律師協會處分工作的指導與監督。”第9條的規定：“各省、自治區、直轄市律師協會及設區的市律師協會設立懲戒委員會，負責對違規會員進行處分。”故A選項錯誤，設區的市律師協會也有權設立懲戒委員會。 根據《律師協會會員違規行為處分規則（試行）》第42條的規定：“投訴人可以採用信函、郵件和直接來訪等方式投訴，也可以委託他人代為投訴。”故B選項錯誤。 根據《律師協會會員違規行為處分規則（試行）》第17條的規定：“訓誡、警告、通報批評、公開譴責、中止會員權利一個月以上一年以下的紀律處分由省、自治區、直轄市律師協會或者設區的市律師協會作出；取消會員資格的紀律處分由省、自治區、直轄市律師協會作出；設區的市律師協會可以建議省、自治區、直轄市律師協會依本規則給予會員取消會員資格的紀律處分。”故C選項錯誤，取消會員資格的紀律處分由省、自治區、直轄市律師協會作出，設區的市律協無權作出。 根據《律師協會會員違規行為處分規則（試行）》第49條的規定：“具有下列情形之一的不予立案：（一 ）不屬於本協會受理範圍的；（二）不能提供相關證據材料或者證據材料不足的；（三）證據材料與投訴事實沒有直接或者必然聯繫的；（四）匿名投訴或者投訴人身份無法核實，導致相關事實無法查清的；（五 ）超過處分時效的；（六）投訴人就被投訴會員的違規行為已提起訴訟、仲裁等司法程序案件的；（七）對律師協會已經處理過的違規行為，沒有新的事由和證據而重複投訴的；（八）其它不應立案的情形。”故D選項正確。"}, {"id": "卷一-84", "subject": "卷一", "type": "多選題", "question": "關於習近平法治思想的重大意義，下列哪些選項是正確的？（）", "options": [{"key": "A", "text": "習近平法治思想是馬克思主義法治理論同中國實際相結合的最新成果"}, {"key": "B", "text": "習近平法治思想是黨領導法治建設豐富實踐和寶貴經驗的科學總結"}, {"key": "C", "text": "習近平法治思想是法治軌道上推進國家治理體系和治理能力現代化的根本遵循"}, {"key": "D", "text": "習近平法治思想是引領法治中國建設實現高質量發展的思想旗幟"}], "answer": ["A", "B", "C", "D"], "explanation_full": "31 大以來，以習近平同志為核心的黨中央推動我國社會主義法治建設發生歷史性變革、取得歷史性成就。在這一進程中，習近平總書記創造性地提出了關於全面依法治國的一系列新理念新思想新戰略，形成了習近平法治思想，把中國特色社會主義法治理論和實踐推上了歷史新高度。習近平法治思想的重大意義是：馬克思主義法治理論同中國實際相結合的最新成果。習近平法治思想，堅持馬克思主義立場觀點方法，植根於中華優秀傳統法律文化，借鑒了人類法治文明有益成果，在理論上有許多重大突破、重大創新、重大發展，是馬克思主義法治理論中國化最新成果，是習近平新時代中國特色社會主義思想的重要組成部分，為新時代推進全面依法治國提供了根本遵循和行動指南。黨領導法治建設豐富實踐和寶貴經驗的科學總結。黨的十八大以來 ，我國社會主義法治建設之所以能發生歷史性變革、取得歷史性成就，根本在於習近平法治思想的科學指引 。習近平法治思想，在繼承和發揚優良傳統的基礎上，對我國社會主義法治建設經驗進行提煉和升華，以新的視野、新的認識賦予新的時代內涵，深入回答了事關新時代我國社會主義法治建設的一系列重大問題，是中國特色社會主義法治理論的歷史性飛躍。法治軌道上推進國家治理體系和治理能力現代化的根本遵循。習近平法治思想，貫穿經濟、政治、文化、社會、生態文明建設各個領域，涵蓋改革發展穩定、內政外交國防 、治黨治國治軍各個方面，為全黨全國各族人民深刻認識全面依法治國在治國理政中的全局性、戰略，性、 基礎性、保障性地位提供了科學指引，為依法應對重大挑戰、抵禦重大風險、克服重大阻力、解決重大矛盾 ，推進國家治理體系和治理能力現代化提供了行動指南。引領法治中國建設實現高質量發展的思想旗幟。習近平法治思想是順應實現中華民族偉大復興時代要求應運而生的重大戰略思想，著眼當今世界百年未有之大變局和中華民族偉大復興戰略全局，統籌推進國內法治和涉外法治，立足新發展階段、貫徹新發展理念、加快構建新發展格局，為實現法治中國建設高質量發展提供了強有力的思想武器。"}, {"id": "卷一-85", "subject": "卷一", "type": "多選題", "question": "關於法的發展說法，下列哪些選項是不正確的？（）", "options": [{"key": "A", "text": "法的繼承體現的是時間關係，不同階級屬性之間的法律不得進行繼承"}, {"key": "B", "text": "法律移植的對象是外國法，不包括國際條約和國際慣例"}, {"key": "C", "text": "能否處理好本國法律傳統與移植的法律制度之間的衝突，是法治現代化成敗的關鍵"}, {"key": "D", "text": "英美法系與大陸法系是根據法的經濟基礎及統治階級意志的不同而進行的分類"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】法的繼承是指不同歷史類型之間的法的承繼，體現的是時間關係，不同階級屬性之間的法律可以進行繼承。A項錯誤。法的移植是指一國對外國法律制度的借鑒，包括外國法、國際法及國際慣例，B項錯誤。本國法律制度與外來法律制度能否兼容的問題，是法律發展的關鍵。C項正確。英美法系與大陸法系是根據法的歷史傳統和表現形式進行的分類，D項錯誤。 不定項選擇題"}, {"id": "卷一-86", "subject": "卷一", "type": "多選題", "question": "根據《憲法》和《國家安全法》的規定，下列選項正確的是：（）", "options": [{"key": "A", "text": "為提升全社會的國家安全意識，將每年4月15日定為全民國家安全教育日"}, {"key": "B", "text": "全國人大決定戰爭和和平的問題，行使憲法規定的涉及國家安全的其他職權"}, {"key": "C", "text": "香港和澳門特別行政區負有維護國家安全的責任"}, {"key": "D", "text": "對已經發生的危害國家安全的事件，縣級以上地方人民政府及其有關主管部門應當立即按照規定向上一級人民政府及其有關主管部門報告，必要時可以越級上報"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】根據《國家安全法》第14條規定：“每年4月15日為全民國家安全教育日。”故A項正確。 根據《國家安全法》笫35條規定：“全國人民代表大會依照憲法規定，決定戰爭和和平的問題，行使憲法規定的涉及國家安全的其他職權。全國人民代表大會常務委員會依照憲法規定，決定戰爭狀態的宣布，決定全國總動員或者局部動員，決定全國或者個別省、自治區、直轄市進入緊急狀態，行使憲法規定的和全國人民代表大會授予的涉及國家安全的其他職權。”故B項正確。 根據《國家安全法》第40條規定：“地方各級人民代表大會和縣級以上地方各級人民代表大會常務委員會在本行政區域內，保證國家安全法律法規的遵守和執行。地方各級人民政府依照法律法規規定管理本行政區域內的國家安全工作。香港特別行政區、澳門特別行政區應當履行維護國家安全的責任。”故C項正確。 32 根據《國家安全法》第58條規定：“對可能即將發生或者已經發生的危害國家安全的事件，縣級以上地方人民政府及其有關主管部門應當立即按照規定向上一級人民政府及其有關主管部門報告，必要時可以越級上報 。”故D項正確。"}, {"id": "卷一-87", "subject": "卷一", "type": "多選題", "question": "如果法院決定對張某強制醫療，下列說法正確的是：（）", "options": [{"key": "A", "text": "張某有權對強制醫療決定申請復議"}, {"key": "B", "text": "申請復議的時間為收到決定書之日起10日內"}, {"key": "C", "text": "復議期間可以暫停執行強制醫療的決定"}, {"key": "D", "text": "向上一級法院申請復議，上一級法院應當組成合議庭審理並在1個月內作出復議決定"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】《刑訴解釋》第642條規定：“被決定強制醫療的人、被害人及其法定代理人、近親屬對強制醫療決定不服的，可以自收到決定書第二日起五日以內向上一級人民法院申請復議。復議期間不停止執行強制醫療的決定。'‘據此，A項正確；B項錯誤，應為5日以內；C項錯誤，復議期間應為不停止執行強制醫療的決定。《刑訴解釋》第643條規定：“對不服強制醫療決定的復議申請，上一級人民法院應當組成合議庭審理 ，並在一個月以內，按照下列情形分別作出復議決定：（一）被決定強制醫療的人符合強制醫療條件的，應當駁回覆議申請，維持原決定；（二）被決定強制醫療的人不符合強制醫療條件的，應當撤銷原決定；（三 ）原審違反法定訴訟程序，可能影響公正審判的，應當撤銷原決定，發回原審人民法院重新審判。”據此 ，D項正確。"}, {"id": "卷一-88", "subject": "卷一", "type": "多選題", "question": "刑事訴訟中關於適用簡易程序，下列表述錯誤的是：", "options": [{"key": "A", "text": "若檢察院未提出適用簡易程序的建議，法院則不得適用簡易程序審理該案"}, {"key": "B", "text": "由於適用簡易程序，法院決定由審判員一人獨任審判"}, {"key": "C", "text": "由於被告人對定罪量刑問題無異議，法庭在宣布辯論終結後，直接進行宣判"}, {"key": "D", "text": "法庭審理過程中，被告人翻供，不承認犯罪，法院決定按照普通程序重新審理"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】《刑訴解釋》第359條規定，基層人民法院受理公訴案件後，經審查認為案件事實清楚、證據充分的，在將起訴書副本送達被告人時，應當詢問被告人對指控的犯罪事實的意見，告知其適用簡易程序的法律規定。被告人對指控的犯罪事實沒有異議並同意適用簡易程序的，可以決定適用簡易程序，並在開庭前通知人民檢察院和辯護人。對人民檢察院建議或者被告人及其辯護人申請適用簡易程序審理的案件，依照前款規定處理；不符合簡易程序適用條件的，應當通知人民檢察院或者被告人及其辯護人。由此可見，適用簡易程序只需法院和被告方同意，無須檢察院同意。檢察院只有建議適用簡易程序的權力。故A項表述錯誤，當選 。 《刑事訴訟法》第216條規定，適用簡易程序審理案件，對可能判處3年有期徒刑以下刑罰的，可以組成合議庭進行審判，也可以由審判員一人獨任審判：對可能判處的有期徒刑超過3年的，應當組成合議庭進行審判。 本案中王某因盜竊數額巨大，法定刑最低為10年，因此本案應當組成合議庭進行審判，B選項表述錯誤，當選 。 《刑事訴訟法》第219條規定：“適用簡易程序審理案件，不受本章第一節關於送達期限、訊問被告人、詢問證人、鑒定人、出示證據、法庭辯論程序規定的限制。但在判決宣告前應當聽取被告人的最後陳述意見。 ”C項中，辯論終結後，被告人有最後陳述的權利，因此C項表述錯誤，當選。 《刑事訴訟法》第221條規定：“人民法院在審理過程中，發現不宜適用簡易程序的，應當按照本章第一節或者第二節的規定重新審理。”因此，D選項表述正確，不當選。"}, {"id": "卷一-89", "subject": "卷一", "type": "多選題", "question": "大毛和二毛是鄰居，大毛髮現二毛私自篡改公用電路，存在嚴重安全隱患，威脅到鄰居用電安全，遂向小區所在街道辦事處舉報，街道辦事處認為二毛的行為不存在安全問題遲遲不予處理。下列說法錯誤的是：（ ）", "options": [{"key": "A", "text": "大毛對街道辦事處不予處理自己舉報事項的行為不得提起行政訴訟專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 33"}, {"key": "B", "text": "大毛對街道辦事處不予處理自己舉報事項的行為不得提起行政復議"}, {"key": "C", "text": "街道辦事處的行為屬於不作為違法"}, {"key": "D", "text": "大毛舉報二毛的行為不具有法律效力"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】《行訴法解釋》第12條規定：“有下列情形之一的，屬於行政訴訟法第二十五條第一款規定的 ’與行政行為有利害關係'：（一）被訴的行政行為涉及其相鄰權或者公平競爭權的；（二）在行政復議等行政程序中被追加為第三人的；（三）要求行政機關依法追究加害人法律責任的；（四）撤銷或者變更行政行為涉及其合法權益的；（五）為維護自身合法權益向行政機關投訴，具有處理投訴職責的行政機關作出或者未作出處理的；（六）其他與行政行為有利害關係的情形。”在本案中，大毛是為了維護自己的生命財產安全向有關部門舉報，有關部門有履行管理職責的作為義務，而舉報人在這種情形下也具有原告資格，可以提起行政訴訟，當然也就可以提起行政復議。"}, {"id": "卷一-90", "subject": "卷一", "type": "單選題", "question": "下列對於法的淵源的各種說法的評價，正確的有：（　）甲：（1）英美法系國家法的正式淵源主要是判例法，我國作為大陸法系國家正式淵源只有制定法；（2）正式淵源的效力高於非正式淵源，因此，對於一個法律事項，二者同時存在時必須適用法的正式淵源。乙：（1）在我國，憲法、法律、行政法規、地方性法規等主要是根據其所調整的社會關係而作出的分類；（2）政策是我國法律的一個重要淵源，可以作為法院審理案件的依據。丙：（1）我國不實行判例法制度；（2）在特殊情況下，即使有正式法源，也可以適用非正式法源。丁：（1）生效的國際條約都構成我國的正式法的淵源；（2）近代以來西方國家法的淵源，在英美法系國家只有判例法，而大陸法系國家只有制定法。", "options": [{"key": "A", "text": "甲（1）錯誤，丙（2）正確"}, {"key": "B", "text": "甲（2）正確，乙（1）錯誤"}, {"key": "C", "text": "乙（2）錯誤，丁（1）錯誤"}, {"key": "D", "text": "丙（1）正確，丁（2）正確"}], "answer": ["A"], "explanation_full": "【羿文解析】我國分屬於不同的法域，不能說是大陸法系國家，我國法的正式淵源包括制定法和習慣法，因此甲（1）錯誤。如果正式淵源不能為所需要解決的法律問題提供合理依據，可以適用非正式淵源，因此甲 （2）錯誤。憲法、法律、行政法規、地方性法規等主要是根據法的制定機關不同而作出的分類，因此乙 （1）錯誤。政策是我國法的非正式淵源，可以作為法院審理案件的依據，因此乙（2）正確。判例屬於我國非正式法律淵源，但我國不實行判例法制度，因此丙（1）正確。解決法律問題時，正式法源具有優先適用性 ，但在特殊情況下，為了實現個案的正義，即使有正式法源，也可以適用非正式法源，因此丙（2）正確。國際條約成為我國法的正式淵源的前提是我國參加或者承認，因此丁（1）錯誤。無論英美法系還是大陸法系 ，法律淵源都是既有制定法又有判例法，因此丁（2）錯誤。"}, {"id": "卷一-91", "subject": "卷一", "type": "多選題", "question": "2000年，甲國分立為乙丙兩個國家。2004年，丁國與乙國互設大使館。2010年，丙國通過議會換屆選舉 ，產生了新一屆政府。2014年，丁國元首與丙國政府首腦共同參加了聯合國大會主持的會議，期間雙方締結了一項和平友好條約。根據國際法的相關規則和實踐，下列哪些判斷是正確的", "options": [{"key": "A", "text": "除非另有協議，乙丙兩國依據領土實際生存原則繼承甲國的動產和檔案"}, {"key": "B", "text": "丁國已經正式承認乙國為新國家"}, {"key": "C", "text": "甲國曾向丁國借債8000萬用於甲國基礎設施的建設，除非另有協議，乙丙兩國應公平地按比例繼承該筆債務"}, {"key": "D", "text": "丁國元首與丙國政府首腦締結和平友好條約的行為構成對丙國新政府的承認"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】國家的承認是指現存國家對新國家產生的事實給予確認並接受由此而產生的法律效果，與新國家進行正常交往的行為。新國家可以由於殖民地獨立、現存國家的合併、分離或解體等原因而產生。 A項正確，所涉領土的實際生存原則主要針對動產。B項正確，領土發生變更，屬於承認新國家。C項正確，不是國家惡債，首先應通過協議解決；沒有協議，則應按公平的比例轉屬繼承國。D項錯誤，屬於承認新國家。 34"}, {"id": "卷一-92", "subject": "卷一", "type": "多選題", "question": "下列案件不屬於行政訴訟受案範圍的是", "options": [{"key": "A", "text": "某市政府就外賣大戰召開協調會，形成了會議紀要，內容為市交通局主要負責公路外賣電瓶車的管理，市市場監管局負責食品質量的管理，飽了嗎公司對會議紀要不服提起訴訟"}, {"key": "B", "text": "飽了嗎公司舉報噠噠公司戶外樹立的廣告牌惡意詆毀競爭對手，某市工商局立案調查，噠噠公司對立案調查行為不服提起訴訟"}, {"key": "C", "text": "某市工商局約談了涉嫌不正當競爭的飽了嗎公司，飽了嗎公司對約談不服提起訴訟"}, {"key": "D", "text": "為了從源頭上管控混亂的外賣市場，市政府建立了統一網絡外賣平台，建議外賣公司統一使用該電召平台 ，飽了嗎公司對此不服提起訴訟"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】A項當選，該會議紀要涉及行政機關內部的分工屬於內部行為，不可訴。B項當選，過程性行為不可訴，立案調查不必然會影響權利義務。C項當選，約談相當於一種勸告，不必然會影響當事人的權利義務 ，故不可訴。D項當選，市政府的建議是一種柔性的行政指導，不可訴。"}, {"id": "卷一-93", "subject": "卷一", "type": "多選題", "question": "甲乙二人商議了非法取財的辦法，深夜在鄉村公路中間拉—道鋼絲繩，兩端綁在兩邊的樹樁上。行人丙走路時被絆倒，摔倒在地。甲乙上前趁機拿走丙的錢包。過一會兒，丁騎自行車被絆倒，摔成重傷。甲乙上前趁機拿走丁的錢包。過—會幾，戊騎摩托車被絆倒，頸部被鋼絲勒住，當場死亡。甲乙上前趁機拿走戊的錢包，收工迅速逃離現場。下列說法正確的有", "options": [{"key": "A", "text": "甲乙對丙構成搶劫罪"}, {"key": "B", "text": "甲乙對丁構成搶劫罪致人重傷"}, {"key": "C", "text": "甲乙對戊構成搶劫罪致人死亡"}, {"key": "D", "text": "甲乙構成以危險方法危害公共安全罪"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】甲乙的行為構成搶劫罪（致人重傷、死亡），以危險方法危害公共安全罪，數罪並罰。甲乙使用了暴力手段，強取丙、丁、戊的財物，構成搶劫罪，A項正確。另外拉鋼絲繩的暴力行為分別導致了丁重傷 、戊死亡的後果，因丁重傷、戊死亡的後果與槍劫行為之間有因果關係，所以構成搶劫致人重傷和搶劫致人死亡，B、C項正確。此外，甲乙在鄉村公路上拉鋼絲繩，有危及不特定的多數人的可能性，而且這種具體危險的程度與放火罪、決水罪、爆炸罪、投放危險物質罪的具體危險具有相當性。所以構成以危險方法危害公共安全罪，D項正確。"}, {"id": "卷一-94", "subject": "卷一", "type": "多選題", "question": "以下說法錯誤的是", "options": [{"key": "A", "text": "國家勛章和國家榮譽稱號為其獲得者終身享有，不可被剝奪，不可用於出售、經營、出租"}, {"key": "B", "text": "根據全國人大常委會的決定，主席向國家榮譽稱號獲得者授予國家勛章、國家榮譽稱號獎章，簽發證書"}, {"key": "C", "text": "主席進行國事活動時，根據全國人大常委會的決定，授予外國政要、國際友人等人士友誼勛章"}, {"key": "D", "text": "國家設立國家功勛簿，記載國家勛章和國家榮譽稱號獲得者及其功績"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】A項錯誤，可以被剝奪。B項正確。根據《中華人民共和國國家勛章和國家榮譽稱號法》第7條 ：中華人民共和國主席根據全國人民代表大會常務委員會的決定，向國家勛章和國家榮譽稱號獲得者授予國家勛章、國家榮譽稱號獎章，簽發證書。C項錯誤，《國家勛章和國家榮譽稱號法》第8條規定，中華人民共和國主席進行國事活動，可以直接授予外國政要、國際友人等人士“友誼勛章”。D項正確。《國家勛章和國家榮譽稱號法》第10條規定，國家設立國家功勛簿，記載國家勛章和國家榮譽稱號獲得者及其功績。"}, {"id": "卷一-95", "subject": "卷一", "type": "多選題", "question": "關於犯罪預備，下列選項中說法錯誤的有", "options": [{"key": "A", "text": "甲欲實施搶劫行為，因為自己身材不夠高大，為了防止搶劫時對方反抗，甲遂去商店購買胡椒粉，碰到巡邏警察，甲因形跡可疑被盤問，遂案發。甲的行為成立犯罪預備"}, {"key": "B", "text": "甲意圖搶劫，尾隨婦女乙。當該婦女回家，打開房門進屋並準備關門時，甲以為其家中無人，也強行擠進專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 35 屋內，並隨手鎖上門，乙被嚇得驚叫一聲。乙的丈夫聞聲起床後，在鄰居的幫助下，將甲扭送到公安機關。 甲的行為成立搶劫罪的未遂"}, {"key": "C", "text": "薛某提出以殺人埋屍的手段搶劫，劉某表示同意。二人遂駕駛劉某的摩托車兩次尋找埋屍的地點未果，遂將鐵銀藏乾—草從內。之後返回鎮上各購買尖刀—把隨身攜帶。次日。薛某才打電話叫劉某出來。遭到劉某的拒絕。後薛某單獨完成殺人搶劫。劉某的行為構成犯罪預備階段的中止"}, {"key": "D", "text": "甲為了實施搶劫，制定了周密的犯罪計劃，其在日記本上詳述了其遇到犯罪對象會採取何種行為，遇到警察會採取何種行為，發現對象有幫手時會作何反應，種種可能性都詳細列舉，對策也一一列出。後被人發現舉報，甲的行為成立犯罪預備"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】A項錯誤。購買胡椒粉的行為是一種日常生活行為，雖然在形式上符合犯罪預備的特徵，但是不能作為預備犯處罰。也就是說，購買胡椒粉的行為本身並不是一種具有危險性的行為，即使行為人承認是為了搶劫，但他隨時也可以否認自己是為了炒菜，難以證明他是為了搶劫。所以，對類似這樣的行為不應當以犯罪預備處罰。B項錯誤。甲的行為屬於犯罪預備。搶劫罪的著手是指行為人已經實施暴力等足以危害被害人人身安全的行為。本題中。甲主觀，上想搶劫。但只實施，了尾隨、進屋。該行為還沒有對乙的人身和財產權利造成緊迫的危險，即甲還沒來得及著手就因為意志以外的原因而未能著手實現犯罪，故甲的行為構成搶劫罪（犯罪預備）。C項錯誤。劉某的行為認定為搶劫既遂。本題中，劉某夥同薛某預謀搶劫殺人，並在預備階段準備工具、製造條件，構成共同犯罪。劉某雖然中途放棄犯罪，未參與搶劫犯罪的實行過程，但在共同犯罪中，其未制止薛占全繼續實施犯罪行為，亦未能有效避免危害結果的發生。劉某之前所參與的購買刀具 ，該刀具也被薛某事實上用於搶劫，與薛某搶劫行為所致的危害結果未脫離因果關係，不能成立犯罪中止。 D項正確。單純的犯意表示，如行為人揚言要殺死或搶劫某人的行為，不構成犯罪預備行為，不以犯罪論處。 但是，本題中，甲已經為實施犯罪做好了主觀上的準備，此時已超出單純的犯意表示，而是體現為一種行為 ，這實際上是製造了犯罪的主觀條件，甲的行為屬於犯罪預備。綜上，ABC當選。"}, {"id": "卷一-96", "subject": "卷一", "type": "多選題", "question": "關於因果關係與客觀歸責，下列說法正確的是", "options": [{"key": "A", "text": "甲糾集乙、丙等人分別持木棍、魚叉、砍刀對李某進行段打，致使李某頭部堂傷倒地，後被送往醫院治療 。兩個月後，李某出院回老家康復治療。經鑒定，李某頭部外傷致左側額、顳、頂部硬膜下血腫，並腦疝形成，出現失語、四肢強直性瘴瘓等嚴重併發症，其損傷程度己構成重傷，傷殘程度為一級傷殘。兩年後。李某在家中病情發作，經搶救無效死亡。李某的死亡與甲等人具有因果關係"}, {"key": "B", "text": "甲駕駛小型客車從事非法營運，超員載客12人，在車輛行駛至高速公路時，甲在應急車道內停車違法下客 。乘客乙下車後，在橫穿至高速路中心隔離帶附近時，被正常行駛的一輛越野車撞上，乙當場死亡。甲的違法下客行為與乙的死亡之間具有因果關係"}, {"key": "C", "text": "某晚，甲被乙帶至某包廂唱歌喝酒，二人發生口角。甲意圖教訓乙，23時許，甲趁乙醉酒無反抗能力之際 ，用三輪車將其帶至某橋頭附近對乙進行毆打，並脫去乙的全身衣褲，後將乙衣褲丟至附近河道，第二天 ，乙被發現溺水身亡。甲的行為與乙的死亡具有因果關係"}, {"key": "D", "text": "甲為向乙索債，在乙家中與其同吃住，一個月後，乙借丟棄垃圾為名欲從家中下樓逃跑，但途中被甲堵截抓回，乙親屬報警稱乙遭人拘禁，民警到場後將甲從乙家中驅離。但甲仍糾集他人留在乙家樓下監視，不時上門查看，並防止乙出逃，在屋外用事先準備好的502膠水封堵乙的房門鎖孔，於是乙用床單製作繩索從十二樓窗戶攀爬下樓，最終墜樓死亡。乙的死亡可歸責於甲"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】A項正確。本案的特殊之處在於，李某沒有在當受甲等人毆打後，短時間內死亡，而是在時隔兩年後才死亡。然而，甲等人先前的故意傷害行為已經致李某嚴重殘疾，李某雖經長時間治療後死亡。但其間並不存在諸如醫療事故等中斷因素，故先前傷害行為與死亡結果之間的因果關係並不中斷。因此，李某的死亡與甲等人具有因果關係。 36 斷甲違法下客與乙的死亡結果之間的因果關係。其次，再分析乙橫穿馬路的行為。本案中，乙是具有完全行為能力的成年人，其完全明知橫穿高速公路的危險性。且除橫穿高速公路外，乙可以選擇沿相對安全的應急車道行至收費站出站，因此可以認為乙的行為是獨立於甲行為之外的自主獨立行為，換言之，乙橫穿馬路的行為屬於異常因素，且因為乙橫穿馬路，被正常行駛的車輛撞死，因此乙橫穿馬路的行為中斷了甲違法下客的行為與其死亡之間的因果關係。因此，甲的違法下客行為與乙的死亡結果之間不具有因果關係。 C正確。本案中，甲將醉酒意識不清的乙帶至橋頭，對乙實施毆打、脫衣行為，並將其衣褲丟至附近河道，從而導致乙落水溺死。如果沒有甲的毆打和脫衣行為，就不會發生乙落水溺死的危害後果，毆打行為及脫衣行為與乙死亡之間具有條件關係。本案介入了乙自行走到河邊而落水的行為，但據甲實施毆打、脫衣行為時乙的醉酒狀態和周邊高度危險的環境，乙落水並不具有異常性。乙處於醉酒狀態之下，已經具有一定的意識和行為障礙，在距離河岸較近、深夜光線暗的情境下，因意識和行為障礙落入河水中，具有通常性。因此，乙的落水行為並未阻斷甲的行為與死亡結果之間的因果關係。 D錯誤。本案中，在判斷甲的拘禁行為與乙的死亡結果之間的因果關係需要考慮乙的介入行為，即乙用床單製作繩索從十二樓窗戶攀爬下樓的行為。乙死亡的直接原因是墜樓，因此，只需判斷乙的介入行為是否異常。 在甲被民警驅離乙家中之後，甲雖然仍糾集他人留在乙家樓下監視，不時上門查看，用膠水堵鎖芯，但是上述行為本身對乙並不起到實際控製作用，且不具有造成乙死亡這一加重結果發生的高度緊迫性和危險性，當時乙採用報警、通知家屬等更穩安安全的方法離開現場亦非不能實現。在這種情況下，乙採用以床單製成繩索從十二層高樓窗戶攀爬下樓這種極度危險方法離開，顯然不具有高度緊迫性和合理性，在一般人看來此舉亦屬於不必要且是異常冒險的舉動，該死亡結果對於甲而言亦難以預見。因此，本案乙的介入行為是異常的 ，從而中斷了甲的拘禁行為與死亡結果之間的刑法意義上的因果關係。故乙的死亡不可歸責於甲。 綜上，A、C當選。"}, {"id": "卷一-97", "subject": "卷一", "type": "單選題", "question": "關於侵犯性的自主決定權的行為，下列哪一選項是正確的", "options": [{"key": "A", "text": "甲（男）姦淫9周歲幼女趙某，致使其輕傷的，成立強姦罪的基本犯（從重處罰）與故意傷害（輕傷）罪的想象競合犯"}, {"key": "B", "text": "乙（男）徵得14周歲的養女錢某同意而與其發生性關係的，即使乙不成立強姦罪，也成立負有照護職責人員性侵罪"}, {"key": "C", "text": "丙（男）利用自己班主任的身份追求15周歲的女生孫某，雙方自願發生性關係的，丙的行為不成立犯罪"}, {"key": "D", "text": "丁（女）在治療15周歲的孫某（男）過程中，迫使孫某與自己發生性交行為的，丁成立負有照護職責人員性侵罪"}], "answer": ["B"], "explanation_full": "【羿文解析】A項錯誤，姦淫不滿十四周歲的幼女或者造成幼女傷害的屬於強姦罪的結果加重犯。B項正確、 C項錯誤，即使未成年女性同意發生性關係，也不影響本罪的成立。D項錯誤，成立強制猥褻、侮辱罪。負有照護職責人員性侵罪：1.行為對象為已滿14周歲不滿16周歲的未成年女性。與不滿14周歲女性發生性關係的 ，成立強姦罪，與已滿16周歲女性發生性關係的，不成立本罪。2.行為主體為負有監護、收養、看護、教育 、醫療等特殊職責的人員，主要原因在於負有照護職責的人員承擔的特殊職責決定了行為人對未成年女性之間具有一定的從屬性、依附性關係，該關係會對未成年女性產生一定的心理壓迫，進而導致雙方發生性關係違背未成年女性的本意。3.本罪和強姦罪存在交叉關係（部分重合），重合部分限於負有照護職責人員強迫已滿14周歲不滿16周歲的人與其發生性關係的行為部分。可以認定為兩罪的想象競合。"}, {"id": "卷一-98", "subject": "卷一", "type": "單選題", "question": "關於瀆職犯罪，下列哪一選項是錯誤的", "options": [{"key": "A", "text": "依法配備公務用槍的國家工作機關人員丟失槍支後沒有及時報告，槍支被人撿拾後用於故意殺人，導致他人死亡，成立丟
