賣合同，A公司依約開具了信用證，B公司發貨後向銀行交單收款時，因存在單證不一致的瑕疵導致銀行拒絕付款，且B公司交付的部分貨物還存在質量瑕疵，雙方因此發生糾紛，並依照合同約定向中國國際經濟貿易仲裁委員會提起仲裁。下列哪些選項是錯誤的？（　）", "options": [{"key": "A", "text": "根據《跟單信用證統一慣例》，銀行審單發現單證不一致的，沒有義務通知A公司是否接受不符點"}, {"key": "B", "text": "若銀行審單後通知A公司單證存在不符點，A公司同意接受的，銀行應付款給B公司"}, {"key": "C", "text": "B公司單證瑕疵導致銀行拒付，因A公司已履行開證義務，故A公司收貨後無義務再付款給B公司專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 34"}, {"key": "D", "text": "由於貨物存在質量瑕疵，A公司可以要求開證銀行拒付"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】根據《跟單信用證統一慣例》，銀行審單遵循“一致性”原則，即單證一致、單單一致和單內一致，若不符合一致性的，銀行有權拒絕付款，銀行可以聯繫開證申請人是否接受不符點，“可以”表明是銀行的權利而非義務，故A選項正確，不當選。 銀行審單後徵求開證申請人的意見是否接受不符點的，若開證申請人接受不符點，銀行仍有權拒絕付款，慣例作此規定在於便於銀行控制風險，因為在實踐中開證申請人開證時僅向開證銀行交存信用證金額一定比例的保證金，故B選項錯誤，當選。 信用證實則是開證銀行對於信用證受益人的一項承諾，因單證瑕疵不符合一致性原則要求的，僅僅是開證銀行不再承擔付款義務(開證銀行的承諾失效)，買賣雙方存在買賣合同關係，買方有付款義務，故C選項錯誤 ，當選。 根據《跟單信用證統一慣例》，信用證交易的另一原則是獨立性，即獨立於基礎交易，銀行僅負有審單的義務，對於基礎合同的實際履行狀況不予審查，基礎合同履行的爭議由基礎合同的當事人之間解決，貨物存在質量瑕疵，S公司不能要求開證銀行拒付，故D選項錯誤，當選。"}, {"id": "卷二-85", "subject": "卷二", "type": "多選題", "question": "甲公司向乙公司出口一批貨物(FOB)，投保了平安險，由丙公司承運。在裝運港裝貨時。一包貨物落人海中。運輸途中船舶擱淺，為起浮拋棄了部分貨物。繼續航行中又遇惡劣天氣，部分貨物被打人海中。航行中的相關規則適用《海牙規則》，下列哪些說法是正確的？（　）", "options": [{"key": "A", "text": "本案中貨物的風險在裝運港越過船舷時由甲公司轉移給乙公司"}, {"key": "B", "text": "本案中為起浮拋棄貨物造成的損失屬於共同海損，保險公司應當賠償"}, {"key": "C", "text": "因惡劣天氣造成的貨物損失，保險公司應當賠償"}, {"key": "D", "text": "裝卸過程中導致貨物落海的損失，保險公司均應賠償"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】FOB中貨物的風險在裝運港越過船舷由賣方轉移給買方，故A選項說法正確。 本題乙公司投保的是平安險，其承保範圍有：①自然災害造成全部損失；②運輸工具意外事故造成貨物的全部或部分損失；③在運輸工具已經發生擱淺、觸礁、沉沒、焚毀等意外事故的情況下。貨物在此前後又在海上遭受惡劣氣候、雷電、海嘯等自然災害所造成的部分損失；④在裝卸或轉運時由於一件或數件整件貨物落海造成的全部或部分損失；⑤共同海損的犧牲、分攤和救助費用。運輸途中船舶擱淺，為起浮拋棄了部分貨物，說明其是為了船貨共同安全，人為的有意選擇拋棄一部分貨物，構成共同海損，屬於平安險的承保範圍 ，保險公司應當賠償，故B選項說法正確。 因惡劣天氣造成的貨物損失屬於部分損失，不在平安險的承保範圍，保險公司不予賠償，故C選項說法錯誤。 在裝運港裝貨時，一包貨物落人海中，屬於平安險承保範圍中的第④種情形，保險公司要予以賠償，故D選項說法正確。 不定項選擇題"}, {"id": "卷二-86", "subject": "卷二", "type": "單選題", "question": "甲和乙系再婚夫妻。2014年3月，甲將乙訴至法院請求離婚；同年4月，在法院調解下。雙方和好。同年 11月，甲再次將乙訴至法院請求離婚；法院經審理認為雙方感情確已破裂。准予離婚。經查：甲名下有存款 40萬元，其中有30萬元屬於婚前個人房屋在婚後拆遷所得的拆遷款；乙名下有夫妻共同存款25萬元，在離婚期間乙將其中的20萬元轉移至其兄名下。關於本案，下列說法正確的是？（　）", "options": [{"key": "A", "text": "若乙在法院調解和好後的6個月內又起訴離婚，則法院不予受理，除非有新情況、新理由"}, {"key": "B", "text": "甲的30萬元房屋拆遷款系婚後取得，故該30萬元屬於夫妻共同財產"}, {"key": "C", "text": "在分割乙名下的存款時。對乙可以少分"}, {"key": "D", "text": "若甲在離婚後才發現乙轉移財產的行為，則其再次請求分割夫妻共同財產不受訴訟時效的限制"}], "answer": ["C"], "explanation_full": "35 。因此，A選項錯誤。 (2)根據《民法典》第1065條規定，夫妻一方所有的財產，不因婚姻關係的延續而轉化為夫妻共同財產，除非當事人之間另有約定。本案中，雖然甲30萬元的房屋拆遷款是在婚姻關係存續期間取得的，但是該30萬元是由甲婚前個人房屋轉化而來的.在甲和乙沒有約定該30萬元為夫妻共同財產的情況下，該30萬元屬於甲的個人財產。因此，B選項錯誤。 (3)根據《民法典》第1092條規定，離婚時一方轉移夫妻共同財產的，在分割夫妻共同財產時，對該方可以少分或不分。本案中，因乙在離婚期問將夫妻共同財產中的20萬元轉移至其兄名下，故在分割乙名下的存款時 ，對乙可以少分。因此，C選項正確。 (4)根據《民法典》第1092條規定，離婚後一方發現另一方有隱藏、轉移、變賣、毀損夫妻共同財產或偽造債務企圖侵占另一方財產行為的，可以向法院起訴，請求再次分割夫妻共同財產。另外，根據《民法典婚姻家庭編解釋(一)》第84條規定，當事人依據民法典第一千零九十二條的規定向人民法院提起訴訟，請求再次分割父子共同財產的訴訟時效為三年，從當事人發現之日起計算。本案中，若甲在離婚後才發現乙轉移財產的行為.則其再次請求分割夫妻共同財產受訴訟時效的限制。因此，D選項錯誤。 綜上所述，本題選C。"}, {"id": "卷二-87", "subject": "卷二", "type": "多選題", "question": "汪某將其父老汪去世時留下的珍貴研究手稿贈與其父之母校。並且在贈與合同中約定該手稿只能用於本校科研參考，不得轉讓和出賣。但該大學在接受甲的捐款時.將該手稿贈給甲。下列錯誤的是？（　）", "options": [{"key": "A", "text": "該大學對甲的贈與無效，甲不能取得手稿的所有權"}, {"key": "B", "text": "該大學對甲的贈與無效，但甲已取得手稿的所有權"}, {"key": "C", "text": "只有經汪某同意後，甲才能取得手稿的所有權"}, {"key": "D", "text": "該大學對甲的贈與有效，甲已取得手稿的所有權"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】《民法典》第661條規定，贈與可以附義務。贈與附義務的，受贈人應當按照約定履行義務。該附加的負擔僅為合同上的限制。而不能否認學校已經取得該贈與物的所有權。據此，本案中，學校是所有人 ，其轉贈行為是有權處分而不是無權處分，故A、B選項關於“該大學對甲的贈與無效”的表述是錯誤的。 即使贈與人在贈與合同中限制受贈人對於該贈與物的處分權，該限制也不得對抗第三人。 對於受贈人違反贈與合同所附的條件的，贈與人可以追究其違約責任。甚至可以援引《民法典》第663條的規定行使法定撤銷權撤銷贈與合同，並向受贈人主張返還贈與物。《民法典》第663條規定，受贈人有下列情形之一的，贈與人可以撤銷贈與：(1)嚴重侵害贈與人或者贈與人的近親屬的合法權益；(2)對贈與人有扶養義務而不履行；(3)不履行贈與合同約定的義務。贈與人的撤銷權，自知道或者應當知道撤銷原因之日起1年內行使。但問題在於，如果贈與人不行使撤銷權並向受贈人追回贈與物，就不能否定贈與人的處分權。既然本案中大學與甲之間的轉贈行為有效，那麼，甲可以依據有效合同取得手稿的所有權，故D選項正確。當然，這並不妨礙汪某事後追究大學的違約責任。 故，A、B、C選項錯誤，當選。"}, {"id": "卷二-88", "subject": "卷二", "type": "單選題", "question": "2014年12月1日，袁某將自有房屋出租給劉某，租期2年。2015年3月6日，因房屋價格上漲，袁某將該房屋出賣給其外甥吳某並交付，但未辦理過戶手續。2015年5月1日，吳某來收房，劉某才知該房已被出賣。下列說法正確的是？（　）", "options": [{"key": "A", "text": "劉某不能行使優先購買權對抗吳某"}, {"key": "B", "text": "劉某不能以侵害優先購買權為由向袁某主張賠償"}, {"key": "C", "text": "劉某可以侵害優先購買權為由主張袁某與吳某的房屋買賣合同無效"}, {"key": "D", "text": "即使吳某依據有效房屋買賣合同取得房屋所有權，也無權要求劉某騰房"}], "answer": ["D"], "explanation_full": "【羿文解析】根據《民法典》第726條規定，買受人吳某並非法律所保護的出租人近親屬（近親屬，包括配偶 、父母、子女、兄弟姐妹、祖父母、外祖父母、孫子女、外孫子女），房屋也未辦理登記手續，承租人劉某可以對其主張優先購買權。A選項說法錯誤，不當選。 36 出租人出賣租賃房屋未在合理期限內通知承租人或者存在其他侵害承租人優先購買權情形，承租人請求出租人承擔賠償責任的，人民法院應予支持。但請求確認出租人與第三人簽訂的房屋買賣合同無效的，人民法院不予支持。B、C選項說法均錯誤，不當選。 租賃房屋在租賃期間發生所有權變動，承租人請求房屋受讓人繼續履行原租賃合同的，人民法院應予支持 ，因此吳某無權請求劉某搬出房屋。D選項說法正確，當選。"}, {"id": "卷二-89", "subject": "卷二", "type": "多選題", "question": "利達公司於2015年1月與改威公司簽訂了《瀝青改性加工合同》，約定利達公司提供基質瀝青暫定2000噸 ，改威公司按照對方實際需求將其加工成改性瀝青。合同履行後，2015年4月經改威公司確認，其尚存利達公司的基質瀝青450噸。2018年5月利達公司向改威公司發函催告返還剩餘瀝青，改威公司隨即告知庫存基質瀝青已經滅失。雙方遂起糾紛。據此，下列說法是錯誤的是？（　）", "options": [{"key": "A", "text": "若利達公司尚欠付改威公司加工費，改威公司可以就存留瀝青行使相應留置權"}, {"key": "B", "text": "利達公司基於物權主張改威公司返還存留瀝青的請求權，不受訴訟時效限制"}, {"key": "C", "text": "利達公司向改威公司主張瀝青滅失的賠償請求權，已過訴訟時效期間"}, {"key": "D", "text": "利達公司對存留瀝青的滅失後果應按照“輕過失免責”處理"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】《民法典》第783條規定：“定作人未向承攬人支付報酬或者材料費等價款的，承攬人對完成的工作成果享有留置權或者有權拒絕交付，但當事人另有約定的除外。”一般情況下工作成果屬於定作人所有 ，包括原材料。利達公司可就剩餘原材料行使留置權。A選項說法正確，不當選。 《民法典》第458條規定：“基於合同關係等產生的占有，有關不動產或者動產的使用、收益、違約責任等 ，按照合同約定；合同沒有約定或者約定不明確的，依照有關法律規定。”針對加工承攬合同的標的物 ——加工成果和剩餘材料，定作人作為所有權人可以行使物權請求權。利達公司有權要求改威公司返還剩餘基質瀝青，但該項動產未予登記，其返還請求權適用訴訟時效規定。B選項說法不正確，當選。 利達公司基於物權受到侵害(瀝青因管理不善而滅失)而產生的賠償請求權是債權請求權，當然受訴訟時效期間的限制，但該期間應自權利人知道受侵害時起算。2018年5月利達公司向改威公司發函催告時才知庫存基質瀝青已經滅失。至起訴時未屆滿3年。C選項說法錯誤，當選。 利達公司對存留瀝青的保管義務是基於加工承攬合同而產生，並非無因管理。基於有償合同而產生的管理責任，不適用“輕過失免責”原則。D選項說法不正確，當選。"}, {"id": "卷二-90", "subject": "卷二", "type": "單選題", "question": "金達公司欠利合公司貨款10萬元，利合公司委託金達公司裝修商鋪店面，共欠金達公司裝修費5萬元。當前利合公司所欠金達公司的裝修費已經到期，而金達公司欠利合公司的貨款尚未到期。下列說法正確的是 ？（　）", "options": [{"key": "A", "text": "金達公司不能採用法定抵銷來抵銷所欠貨款"}, {"key": "B", "text": "金達公司欲以裝修費抵銷所欠利合公司的貨款，無須經過利合公司的同意"}, {"key": "C", "text": "雙方屬於不同的債務，因此不得互相抵銷債款"}, {"key": "D", "text": "金達公司若主張相互抵銷欠款，應經過利合公司的同意"}], "answer": ["B"], "explanation_full": "【羿文解析】抵銷分為合意抵銷和法定抵銷。法定抵銷是指符合法律規定的構成要件時，可依當事人一方的意思表示而發生的抵銷，該抵銷權屬於形成權。合意抵銷是按照雙方當事人的合意所為的抵銷。 二者的主要區別在於：法定抵銷要求標的物的種類、品質相同，而合意抵銷的標的物種類、品質可以不同 ；法定抵銷要求主動債權已到期，而對於合意抵銷而言，雙方當事人互負的債務即使沒有到期，只要雙方當事人協商一致，也可以抵銷；當事人基於法定抵銷而主張抵銷的，應當通知對方。通知自達到對方時生效。 而對於合意抵銷，雙方經協商一致，達成抵銷協議時，發生抵銷的法律效力。本題中，因為利合公司欠金達公司的裝修費已經到期，因此金達公司可以適用法定抵銷。法定抵銷權是形成權的一種，無須經過對方的同意即可適用，但是應當通知對方。因此金達公司可以行使法定抵銷權，無須經過利合公司的同意。B選項說法正確，A、C、D選項均不選。 37"}, {"id": "卷二-91", "subject": "卷二", "type": "多選題", "question": "甲公司和乙公司簽訂了汽車買賣合同，約定甲公司向乙公司提供10輛奧迪，甲公司需要代為辦理運輸，並且應當在交付汽車的同時將和汽車有關的單證和資料交付給乙公司，雙方並未約定交貨地點。第二日，甲公司將汽車交給了承運人丁公司，但是忘了附上相關單證、資料。第三日，乙公司又和丙公司簽訂買賣合同 ，將該批汽車以更高的價格賣給丙公司，並指示承運人直接將汽車運到丙公司處。關於本案中標的物的風險轉移.下列說法正確的是？（　）", "options": [{"key": "A", "text": "甲公司將汽車交給承運人丁公司之後。汽車的毀損、滅失的風險就轉移給了乙公司"}, {"key": "B", "text": "甲公司將汽車交給承運人丁公司以後，汽車的毀損、滅失的風險就轉移給了承運人丁公司"}, {"key": "C", "text": "由於甲公司沒有將有關汽車的單證、資料交給承運人丁公司，故汽車毀損、滅失的風險仍然由甲公司承擔"}, {"key": "D", "text": "在乙公司和丙公司的買賣合同成立之時，汽車毀損、滅失的風險就轉移給丙公司了"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】《買賣合同解釋》第9條規定，出賣人根據合同約定將標的物運送至買受人指定地點並交付給承運人後，標的物毀損、滅失的風險由買受人負擔，但當事人另有約定的除外。本案中，甲公司和乙公司並未約定交貨地點，而且標的物需要運輸，故自甲公司將汽車交付給承運人丁公司，汽車毀損、滅失的風險由乙公司承擔；此外，《民法典》第609條規定：出賣人按照約定未交付有關標的物的單證和資料的，不影響標的物毀損、滅失風險的轉移，因此，A選項正確，B、C選項錯誤。 乙公司和丙公司之間屬於在途標的物的買賣，根據《民法典》第606條規定.出賣人出賣交由承運人運輸的在途標的物，除當事人另有約定的以外，毀損、滅失的風險自合同成立時起由買受人承擔，因此D選項正確。"}, {"id": "卷二-92", "subject": "卷二", "type": "單選題", "question": "甲公司訴乙公司拖欠貨款糾紛一案中，甲公司請求支付本金150萬元及利息10萬元，一審中，雙方協商達成和解協議，由乙公司在3個月內分3次付清本金，並且不再支付利息。甲公司向法院申請撤訴，法院裁定准許。在此種情況下，從法律上產生的後果是什麼？（　）", "options": [{"key": "A", "text": "如果沒有新證據，甲公司不得再向法院就同一事實起訴"}, {"key": "B", "text": "該訴訟費用由甲承擔"}, {"key": "C", "text": "若乙不履行和解協議，甲可以向法院申請執行"}, {"key": "D", "text": "因為甲已經撤訴，所以訴訟時效不中斷，仍然繼續計算"}], "answer": ["B"], "explanation_full": "【羿文解析】一審撤訴後仍可起訴，因此，A項錯誤。 因撤訴由原告方提出，訴訟費用自然由其承擔，因此B項正確。 對於D項，目前理論上有爭議。但是通行的做法是認為起訴構成訴訟時效的中斷，無論撤訴與否。而且在本案中雙方達成了還款協議，訴訟時效已經中斷，所以D項錯誤。 本案中雙方達成的協議為和解協議，而不是司法和解協議，也沒有經過司法確認，因此不具有法律上的強制執行力，不能直接申請強制執行。因此C項錯誤。"}, {"id": "卷二-93", "subject": "卷二", "type": "多選題", "question": "原告趙某與被告錢某的前夫孫某(錢某和孫某已經離婚)經朋友介紹認識，此後兩人往來頻繁，關係比較密切。錢某於是帶領兒子孫某某在某日化廠門口毆打趙某。當晚，趙某到某市第一人民醫院就診，並經鑒定為輕傷。上述事實有下列證據證明：(1)趙某和錢某對打鬥事件經過的陳述；(2)某市法醫活體檢驗鑒定中心的法醫鑒定書；(3)日化廠保安李某的妻子陳述的曾聽李某說起的趙某和錢某打鬥的證人證言；(4)錢某的兒子孫某某關於日化廠門前打鬥經過的證人證言；(5)趙某出示的於案發後所拍攝的錢某打人用的磚頭的照片 ；(6)某市第一人民醫院為趙某出具的醫藥費、住院費以及病情診斷書等的複印件。其中屬於本案中的原始證據的是？（　）", "options": [{"key": "A", "text": "趙某和錢某對打鬥事件經過的陳述"}, {"key": "B", "text": "趙某出示的錢某作為打人工具的磚頭的照片"}, {"key": "C", "text": "日化廠保安李某的妻子的證人證言"}, {"key": "D", "text": "錢某的兒子孫某某關於打鬥事件經過的證人證言"}], "answer": ["A", "B", "D"], "explanation_full": "38 來證據是經過轉手傳抄等第二手或者第二手以上的材料，如各種物證的複製品，證人轉述從別人聽到的情況等。傳來證據由原始證據派生而來，其證明力小於原始證據，但是多個傳來證據的發現可以聯繫起來從而發現原始證據。必須仔細分析四個選項中涉及的證據，尤其是C選項，必須回到案例中，注意以下關鍵詞“日化廠保安李某的妻子陳述的曾聽李某說起的趙某和錢某打鬥的證人證言”，接著判斷選項的內容有沒有傳遞的痕跡。本題中ABD項均系原始證據。C項系傳來證據。"}, {"id": "卷二-94", "subject": "卷二", "type": "多選題", "question": "根據最高人民法院《關於適用(中華人民共和國民事訴訟法)執行程序若干問題的解釋》，對於執行案件的管轄問題，下列說法正確的有：（　）", "options": [{"key": "A", "text": "有管轄權的人民法院在立案前發現其他有管轄權的人民法院已經立案的，不得再重複立案"}, {"key": "B", "text": "有管轄權的人民法院在立案後發現其他有管轄權的人民法院已經立案的，應撤銷案件"}, {"key": "C", "text": "有管轄權的人民法院在立案後發現其他有管轄權的人民法院已經立案的，一般交由雙方共同上一級法院處理"}, {"key": "D", "text": "有管轄權的人民法院在立案後發現其他有管轄權的人民法院已經立案的，如果已執行財產控制的，應將此財產交給先立案的執行法院處理"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】最高人民法院《關於適用(中華人民共和國民事訴訟法)執行程序若干問題的解釋》第2條規定 ，對兩個以上人民法院都有管轄權的執行案件，人民法院在立案前發現其他有管轄權的人民法院已經立案的 ，不得重複立案。立案後發現其他有管轄權的人民法院已經立案的，應當撤銷案件；已經採取執行措施的 ，應當將控制的財產交先立案的執行法院處理。故選項ABD說法正確。"}, {"id": "卷二-95", "subject": "卷二", "type": "單選題", "question": "關於查閱會計賬簿的主體問題，下列說法正確的是？（　）", "options": [{"key": "A", "text": "有限責任公司的股東有權請求查閱公司的會計賬簿。公司不可拒絕其查閱請求"}, {"key": "B", "text": "股份有限公司的股東在有正當目的情況下。公司應當允許其查閱公司會計賬簿"}, {"key": "C", "text": "有限合夥人可以查閱合夥企業的會計賬簿.不能複製"}, {"key": "D", "text": "普通合夥人可以查閱合夥企業的會計賬簿.不能複製"}], "answer": ["D"], "explanation_full": "【羿文解析】《公司法》第33條規定，股東有權查閱、複製公司章程、股東會會議記錄、董事會會議決議、 監事會會議決議和財務會計報告。股東可以要求查閱公司會計賬簿。股東要求查閱公司會計賬簿的，應當向公司提出書面請求，說明目的。公司有合理根據認為股東查閱會計賬簿有不正當目的，可能損害公司合法利益的，可以拒絕提供查閱，並應當自股東提出書面請求之日起15日內書面答覆股東並說明理由。公司拒絕提供查閱的，股東可以請求人民法院要求公司提供查閱。A選項錯誤，公司不能以商業秘密為由拒絕提供查閱。 公司在有合理根據認為股東有不正當目的，可能損害公司利益時可以拒絕股東查閱會計賬簿的請求。A選項錯誤。 股份公司的股東無權請求查閱會計賬簿，B選項錯誤。 有限合夥人可以查閱與其自身利益相關的會計賬簿，C選項沒有寫明限定條件，過於絕對，錯誤。 普通合夥人可以查閱合夥企業會計賬簿，沒有限制，但是不能複製，D選項正確，當選。 本題答案為D。"}, {"id": "卷二-96", "subject": "卷二", "type": "多選題", "question": "根據《外商投資法》，關於負面清單，下列哪些說法是正確的？（　）", "options": [{"key": "A", "text": "外商投資準入負面清單規定禁止投資的領域，外國投資者不得投資"}, {"key": "B", "text": "外商投資準入負面清單規定限制投資的領域，外國投資者不得投資"}, {"key": "C", "text": "外商投資準入負面清單規定限制投資的領域，外國投資者進行投資應當符合負面清單規定的條件"}, {"key": "D", "text": "外商投資準入負面清單以外的領域，按照外資優先的原則實施管理"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】根據《外商投資法》第28條第1款的規定，“外商投資準入負面清單規定禁止投資的領域，外國投資者不得投資”。A選項正確。 39 根據《外商投資法》第28條第2款的規定，“外商投資準入負面清單規定限制投資的領域，外國投資者進行投資應當符合負面清單規定的條件”。B選項錯誤，C選項正確。 根據《外商投資法》第28條第3款的規定，“外商投資準入負面清單以外的領域，按照內外資一致的原則實施管理”。D選項錯誤。"}, {"id": "卷二-97", "subject": "卷二", "type": "多選題", "question": "甲、乙、丙成立A有限合夥企業，甲、乙是普通合夥人，丙是有限合夥合夥人。一日丙路遇丁出賣古董花瓶，丙想替合夥企業購買該花瓶，於是自稱合夥事務執行人，以合夥企業的名義向戊借得300萬元，購買了該花瓶。該花瓶實為贗品，合夥企業向戊償債200萬元後無力繼續還債，下列說法正確的是（　）。", "options": [{"key": "A", "text": "戊只能要求丙承擔清償責任"}, {"key": "B", "text": "戊只能要求甲、乙承擔連帶清償責任"}, {"key": "C", "text": "戊可以要求甲、乙、丙承擔連帶清償責任"}, {"key": "D", "text": "合夥企業有權要求丙賠償損失"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】《合夥企業法》第76條規定：“第三人有理由相信有限合夥人為普通合夥人並與其交易的，該有限合夥人對該筆交易承擔與普通合夥人同樣的責任。有限合夥人未經授權以有限合夥企業名義與他人進行交易，給有限合夥企業或者其他合夥人造成損失的，該有限合夥人應當承擔賠償責任。”A、B選項錯誤，C、 D選項正確。"}, {"id": "卷二-98", "subject": "卷二", "type": "多選題", "question": "黃某被甲公司以勞務派遣用工的形式派遣到乙銀行從事保潔工作，乙銀行與其簽訂了3個連續的短期勞務派遣協議，並向黃某收取了部分派遣費，後因乙銀行違章指揮黃某高處作業，造成其跌落後摔傷。對黃某在乙銀行的工作及所遭受的損害，下列說法正確的是？（　）", "options": [{"key": "A", "text": "乙銀行作為接受派遣一方，可以向被派遣者收取部分費用"}, {"key": "B", "text": "乙銀行與黃某簽訂的勞務派遣協議不存在瑕疵"}, {"key": "C", "text": "針對乙銀行對黃某造成的損害，甲公司應當承擔連帶賠償責任"}, {"key": "D", "text": "甲公司應當與乙銀行訂立勞務派遣協議，約定黃某的派遣期限、勞動報酬和社會保險費的數額與支付方式以及違反協議的責任"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】A選項，根據《勞動合同法》第60條的規定，勞務派遣單位和用工單位不得向被派遣勞動者收取費用。因此乙銀行的做法錯誤，A選項錯誤。 B選項，《勞動合同法》第58條第二款規定，勞務派遣單位應當與被派遣勞動者訂立二年以上的固定期限勞動合同，按月支付勞動報酬。因此，乙銀行與黃某的合同不符合法律的規定。B選項錯誤。 C選項，根據《勞動合同法》第92條規定，用工單位給被派遣勞動者造成損害的，勞務派遣單位與用工單位承擔連帶賠償責任。C選項正確。 D選項，根據《勞動合同法》第59條規定，勞務派遣單位派遣勞動者應當與接受以勞務派遣形式用工的單位 (以下稱用工單位)訂立勞務派遣協議。勞務派遣協議應當約定派遣崗位和人員數量、派遣期限、勞動報酬和社會保險費的數額與支付方式以及違反協議的責任。D選項正確。 綜上，本題的答案為CD。"}, {"id": "卷二-99", "subject": "卷二", "type": "多選題", "question": "王某於2015年7月1日畢業後即入職工作，甲公司與其簽訂了2年的固定期限勞動合同，約定試用期3個月。 合同簽訂之後，甲公司將王某的合同文本一併收回保存。 2017年7月，甲公司因開拓新項目，要求王某以後每個工作日加班4小時。王某拒絕了甲公司的要求，甲公司以拒不服從工作安排為由，解除了與王某的勞動合同。王某對此不服，欲通過法律途徑維護自己權益。關於王某有權採取的維權措施，下列說法正確的是？（　）", "options": [{"key": "A", "text": "直接向法院提起訴訟"}, {"key": "B", "text": "王某可主張約定的試用期違法向甲公司要求支付賠償金"}, {"key": "C", "text": "對勞動仲裁裁決不服，有權向法院起訴專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 40"}, {"key": "D", "text": "在甲公司拒絕調解組織調解的情況下，有權向法院起訴"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】根據《勞動爭議調解仲裁法》第5條規定，發生勞動爭議，當事人不願協商、協商不成或者達成和解協議後不履行的，可以向調解組織申請調解；不願調解、調解不成或者達成調解協議後不履行的，可以向勞動爭議仲裁委員會申請仲裁；對仲裁裁決不服的，除本法另有規定的外。可以向人民法院提起訴訟。由此可知，王某可以直接向勞動爭議仲裁委申請仲裁，但無權向法院直接提起訴訟；勞動仲裁為前置程序，只有在不服勞動仲裁的情況下，才有權向法院提起訴訟；即使用人單位拒絕調解組織調解，王某也無權直接提起訴訟。故A選項錯誤，C選項正確，D選項錯誤。 《勞動合同法》第19條規定，勞動合同期限一年以上不滿三年的，試用期不得超過二個月，該法第83條規定 ，違法約定的試用期已經履行的，由用人單位以勞動者試用期滿月工資為標準，按已經履行的超過法定試用期的期間向勞動者支付賠償金。因此，B選項正確。 綜上所述，本題答案為BC。"}, {"id": "卷二-100", "subject": "卷二", "type": "多選題", "question": "鴻天公司於2016年就企業廠房和設備向甲保險公司投保了企業財產保險，保險金額100萬元，為足額保險 。2016年4月又就該廠房和設備向乙保險公司投保了保險。保險金額也是100萬元。2016年7月該單位所在地遭受洪水襲擊，廠房倒塌，設備受損，估損90萬元。甲、乙兩家保險公司知悉該企業廠房重複保險的情況，則下列關於賠償的哪些表述是錯誤的？", "options": [{"key": "A", "text": "甲保險公司先承保，由甲保險公司按實際損失90萬元賠償"}, {"key": "B", "text": "甲、乙兩家保險公司各應賠償90萬元"}, {"key": "C", "text": "甲、乙兩家保險公司各應賠償45萬元"}, {"key": "D", "text": "乙保險公司承保後，甲保險公司的承保失去意義，由乙保險公司賠償90萬元的損失"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】《保險法》第56條規定：“重複保險的投保人應當將重複保險的有關情況通知各保險人。重複保險的各保險人賠償保險金的總和不得超過保險價值。除合同另有約定外，各保險人按照其保險金額與保險金額總和的比例承擔賠償保險金的責任。重複保險的投保人可以就保險金額總和超過保險價值的部分，請求各保險人按比例返還保險費。重複保險是指投保人對同一保險標的、同一保險利益、同一保險事故分別與兩個以上保險人訂立保險合同，且保險金額總和超過保險價值的保險。”在財產保險中，因為各種各樣的原因會出現重複保險，在重複保險出現後，投保人負有通知各保險人的義務。保險人在接到通知後，可以通過合同約定保險責任範圍的事故發生時保險人如何承擔責任，如果合同對保險責任的承擔有約定的，則從其約定 ；沒有約定的，按照《保險法》的規定，由各保險人按照其保險金額與保險金額總和的比例承擔賠償責任。 據此，選項C是正確的，選項A、B、D是錯誤的。 綜上所述，本題選ABD。 41"}, {"id": "卷二-1", "subject": "卷二", "type": "單選題", "question": "關於民事權利，下列哪個選項是正確的？", "options": [{"key": "A", "text": "王某因繼承獲得的房屋所有權在變更登記前不屬於支配權"}, {"key": "B", "text": "合同因欺詐撤銷後.返還財產的權利屬於請求權"}, {"key": "C", "text": "享有撤銷權的當事人一方請求撤銷合同的權利屬於請求權"}, {"key": "D", "text": "合同先履行一方提供適當擔保，則後履行一方無權再主張順序履行抗辯權"}], "answer": ["B"], "explanation_full": "【羿文解析】繼承屬於非基於法律行為的物權變動，於被繼承人死亡時發生物權變動，無需登記、交付。A選項中，登記前王某已經取得房屋的所有權，而所有權屬於支配權.故A選項錯誤。 合同被撤銷後，請求返還財產的權利屬於不當得利返還請求權，故B選項正確。 只要具備撤銷的法定事由，撤銷權人撤銷合同無需相對方同意，撤銷後合同從有效變為自始無效，故請求撤銷合同的權利屬於形成權，C選項錯誤。 行使順序履行抗辯權需滿足以下條件：(1)當事人因同一雙務合同互負對待給付義務；(2)債務有先後履行順序；(3)先履行一方未履行或履行不適當；(4)應當先履行一方請求後履行一方履行。據此，只要先履行一方未履行義務，無論基於何種緣由，後履行一方均可以行使抗辯權。所以先履行一方提供適當擔保的，後履行一方依然享有順序履行抗辯權，故D選項錯誤。"}, {"id": "卷二-2", "subject": "卷二", "type": "單選題", "question": "甲、乙、丙三人夜間喝了少量啤酒後相約去洗澡，因浴室在夜間停止營業，故丙提議去丁公司管理的公園水塘裡游泳。三人避開丁公司巡視人員的巡視，不顧禁止游泳的警示標識，翻越護欄進入水塘游泳。後甲、 乙上岸後喊叫丙沒有回應，見丙的衣物仍在岸邊，甲提議再等等，因乙著急回家不同意，故甲、乙拿上丙的衣物徑直回家，次日將游泳情況告知丙的家屬。後丙溺水死亡。丙的遺屬要求索賠，下列哪一表述是正確的 ？", "options": [{"key": "A", "text": "丙提議去公園水塘游泳.應當自負其責"}, {"key": "B", "text": "丁應負侵權責任"}, {"key": "C", "text": "乙應負侵權責任"}, {"key": "D", "text": "甲沒有過錯，不負侵權責任"}], "answer": ["C"], "explanation_full": "【羿文解析】甲乙丙三人相約喝酒的行為引起了互相負有照顧和保護的義務，甲、乙對丙有保護義務，發現丙沒上來還有衣服，卻直接回家，構成不作為的過錯侵權責任。甲乙應承擔侵權責任。故AD選項錯誤.C選項正確。 《民法典》第1198條：“賓館、商場、銀行、車站、機場、體育場館、娛樂場所等經營場所、公共場所的經營者、管理者或者群眾性活動的組織者，未盡到安全保障義務，造成他人損害的，應當承擔侵權責任。因第三人的行為造成他人損害的，由第三人承擔侵權責任;經營者、管理者或者組織者未盡到安全保障義務的，承擔相應的補充責任。經營者、管理者或者組織者承擔補充責任後，可以向第三人追償。本題中，公園沒有過錯，不負賠償責任，故B選項錯誤。"}, {"id": "卷二-3", "subject": "卷二", "type": "單選題", "question": "胡某為某地刑滿釋放人員，一直討不到媳婦。胡某見鄰村女青年李某漂亮便向其求婚，遭拒絕後，胡某多次帶領一夥手下到李某家鬧事甚至揚言要是不答應婚事就燒了李家，李家無奈將李某嫁與胡某。1個月後，李某不堪忍受，向法院提起離婚訴訟，法院正確的做法是：", "options": [{"key": "A", "text": "依職權撤銷該婚姻"}, {"key": "B", "text": "依職權宣告婚姻無效"}, {"key": "C", "text": "如符合離婚條件，可依法作出離婚判決"}, {"key": "D", "text": "駁回李某起訴.告知其另行提起撤銷婚姻之訴"}], "answer": ["C"], "explanation_full": "1 法院請求撤銷該婚姻。”據此，當事人因受到脅迫而結婚的，可向登記機關或法院申請撤銷婚姻。法院在沒有當事人請求的情況下，不能依據職權撤銷婚姻。本題中雖有脅迫，但是法院不能依據職權撤銷，A錯誤。 《民法典》第1051條規定：“有下列情形之一的，婚姻無效：(一)重婚的；(二)有禁止結婚的親屬關係的 ；(三)未到法定婚齡的。”無效婚姻的案件通常由當事人及相關近親屬向法院申請；重婚的，基層組織也可以申請。法院審案過程中，發現無效的事由，也可以依據職權進行宣告，但是本題中，不具有婚姻無效的理由，故B錯誤。 既然李某提起了離婚之訴，如符合離婚的條件，可以判決離婚，因為可撤銷的婚姻在撤銷之前是有效的，符合離婚條件的，起訴離婚，法院也可作出離婚判決，故C正確，D錯誤。"}, {"id": "卷二-4", "subject": "卷二", "type": "單選題", "question": "甲公司因經營需要，分別欠乙銀行借款三筆。第一筆數額為100萬元.甲公司以其150萬元的設備對該筆借款設定抵押並辦理登記；第二筆借款數額為50萬元；最後一筆借款數額為90萬元，也以該機器設備抵押並登記 。三筆借款現均已到期，2009年5月12日，甲公司持90萬元向乙銀行還款。下列說法正確的是：", "options": [{"key": "A", "text": "優先清償第一筆借款90萬元"}, {"key": "B", "text": "優先清償第二筆借款50萬元，剩餘的40萬元清償第三筆"}, {"key": "C", "text": "優先清償第三筆"}, {"key": "D", "text": "優先清償第二筆50萬元，剩餘的40萬元清償第一筆"}], "answer": ["B"], "explanation_full": "【羿文解析】《民法典》第560條規定：“債務人對同一債權人負擔的數項債務種類相同，債務人的給付不足以清償全部債務的，除當事人另有約定外，由債務人在清償時指定其履行的債務。債務人未作指定的，應當優先履行已經到期的債務；數項債務均到期的，優先履行對債權人缺乏擔保或者擔保最少的債務；均無擔保或者擔保相等的，優先履行債務人負擔較重的債務；負擔相同的，按照債務到期的先後順序履行；到期時間相同的，按照債務比例履行。”本題中三筆借款沒有約定清償順序，且均已到期，故優先抵充沒有擔保或擔保數額較少的。第二筆50萬元沒有擔保，應當優先清償，第一筆有充分的擔保，對於第三筆債權進行擔保的 ，是在機器設備上設定的第二順位的抵押權，故不夠充分，因此，優先抵充第二筆後，剩餘的40萬元應當優先抵充第三筆，故B正確。"}, {"id": "卷二-5", "subject": "卷二", "type": "單選題", "question": "2013年5月10日，A地的甲小學與B地的乙服裝公司訂立承攬合同，由甲小學提供樣品，乙公司自備原材料 ，為甲公司加工校服，2013年8月10日交付貨物，甲小學貨到付款。以下說法何者是正確的？", "options": [{"key": "A", "text": "如果2013年7月10日，A地發生地震，甲小學的校舍完全毀損。此時，甲小學有權解除合同"}, {"key": "B", "text": "如果2013年7月10日，乙公司將其廠房、加工設備轉讓給丙公司，甲小學無權解除合同.只能待2013年8月 10日後，追究乙公司的違約責任"}, {"key": "C", "text": "如果2013年8月10日，乙公司未交付校服，甲小學有權解除合同"}, {"key": "D", "text": "如果甲小學訂購該批校服，是為了在2013年8月11日迎接國家領導人的典禮上使用.則若2013年8月10日，乙公司未交付校服，甲小學有權解除合同"}], "answer": ["D"], "explanation_full": "【羿文解析】《民法典》563規定，因不可抗力致使不能實現合同目的，當事人可以解除合同。本題中，A地發生地震，甲小學的校舍完全毀損的事實，並未導致甲、乙的合同目的不能實現，故任何一方當事人均不得以地震為由解除合同，A選項錯誤。 《民法典》第563條規定，在履行期限屆滿之前，當事人一方明確表示或者以自己的行為表明不履行主要債務的，對方當事人可以解除合同。本題中，乙公司債務履行期限屆滿之前，處置廠房、設備的行為，構成默示的預期履行，甲小學享有合同解除權。因此，甲小學可以行使解除權解除合同，並追究乙公司的預期違約責任，也可以不行使解除權，待債務到期後，追究乙公司的現實違約責任，故B選項錯誤。 《民法典》第563條規定當事人一方遲延履行主要債務。經催告後在合理期限內仍未履行，對方當事人可以解除合同。據此，乙公司遲延履行主要債務.甲小學需經催告後，方能解除合同，C選項錯誤。 在甲小學需要校服用於接待工作的情況下.乙公司的遲延履行，構成根本性違約，甲小學可立即解除合同 ，D選項正確。 2"}, {"id": "卷二-6", "subject": "卷二", "type": "單選題", "question": "甲乙夫妻共有一套房屋市值100萬，登記在甲名下。甲擅自和丙達成協議，以房屋抵償甲欠丙的80萬元借款 .該筆借款用於甲乙家庭共同生活。房屋過戶給丙後，乙反對並要求丙退回房屋。經查，乙和丙是同父異母的姐妹，丙曾向乙借住過該房屋。下列哪一表述是正確的？", "options": [{"key": "A", "text": "因為房屋登記在甲名下，丙構成善意取得"}, {"key": "B", "text": "丙明知房屋為甲、乙共有而低價購買，故甲、丙之間的協議因惡意串通損害第三人利益而無效"}, {"key": "C", "text": "因80萬元借款用於甲、乙家庭共同生活，故乙無權反對甲、丙之間的協議"}, {"key": "D", "text": "因丙對於房屋權屬狀況知情，故丙不構成善意取得"}], "answer": ["D"], "explanation_full": "【羿文解析】《民法典》第311條規定：“無處分權人將不動產或者動產轉讓給受讓人的，所有權人有權追回 ;除法律另有規定外，符合下列情形的，受讓人取得該不動產或者動產的所有權:(一)受讓人受讓該不動產或者動產時是善意;(二)以合理的價格轉讓;(三)轉讓的不動產或者動產依照法律規定應當登記的已經登記，不需要登記的已經交付給受讓人。受讓人依據前款規定取得不動產或者動產的所有權的，原所有權人有權向無處分權人請求損害賠償。當事人善意取得其他物權的，參照適用前兩款規定。” 本題中，甲乙夫妻共有房屋雖登記在甲名下但不影響屬於夫妻共有。甲擅自處分構成無權處分，但丙曾向乙借住過該房屋，對物權狀況知情，故不符合善意這一主觀要件，不能善意取得房屋所有權。故A選項錯誤 ，D選項正確。 B錯，不選。明顯不合理低價，指的是達不到市場價值的70％，本題中80萬價格不屬於不合理低價，而且丙雖知情，但並未與甲惡意串通，故B選項錯誤。 80萬元借款用於甲、乙家庭共同生活，屬於夫妻共同債務，應當由夫妻雙方共同清償，但如何清償仍需要雙方協議，甲不能擅自處分共有物。即不能混淆夫妻共同債務清償和夫妻共有物之處分。故C選項錯誤。"}, {"id": "卷二-7", "subject": "卷二", "type": "單選題", "question": "甲向某電腦公司購買一批電腦送給母校。甲指示電腦公司將電腦交給學校，並將訂貨情況通知了學校。後電腦公司委託某快遞公司將電腦運至學校，運輸過程中兩台電腦毀壞。下列選項中正確的是：", "options": [{"key": "A", "text": "甲有權要求電腦公司承擔違約責任"}, {"key": "B", "text": "甲有權要扣快遞公司承擔違約責任"}, {"key": "C", "text": "學校有權要求電腦公司承擔侵權責任"}, {"key": "D", "text": "學校有權要求快遞公司承擔侵權責任"}], "answer": ["A"], "explanation_full": "【羿文解析】《民法典》第522條第一款規定：“當事人約定由債務人向第三人履行債務的，債務人未向第三人履行債務或者履行債務不符合約定，應當向債權人承擔違約責任。”本題中甲與電腦公司約定，由電腦公司直接向學校履行，在電腦公司向學校履行不合約定時，應當向甲承擔違約責任，故A正確。 甲與快遞公司之間沒有合同關係，因此，不存在違約責任的前提，故B錯誤。 本題中，電腦公司委託快遞公司將電腦運送至學校，此種情形應認定為送貨上門，在將電腦交付給學校之前 ，學校並沒有取得電腦的所有權，因此，不能主張侵權責任，故C、D錯誤。"}, {"id": "卷二-8", "subject": "卷二", "type": "單選題", "question": "甲公司通過電視發布廣告，稱其有100輛某型號汽車，每輛價格15萬元.廣告有效期10天。乙公司看到該則廣告後於第3天自帶金額為300萬元的匯票去甲公司買車，但甲公司的車此時已全部售完。無貨可供。依照法律規定，有關本案的正確表述是：", "options": [{"key": "A", "text": "甲發布廣告的行為構成要約，乙的行為構成承諾，甲應承擔違約責任"}, {"key": "B", "text": "甲發布廣告的行為構成要約，乙的行為構成承諾，甲應補償乙實際支出的費用損失"}, {"key": "C", "text": "甲發布廣告的行為構成要約，但乙的行為不構成承諾，甲不承擔民事責任"}, {"key": "D", "text": "甲發布廣告的行為不構成要約，乙的行為不構成承諾，甲不承擔民事責任"}], "answer": ["A"], "explanation_full": "3 ，視為要約。”據此可知，商業廣告一般不構成要約，而屬於要約邀請。但如果廣告的內容符合要約的規定 ，應視為要約。本題中，甲公司的廣告說明了標的物及其價格，且有有效期，說明在此期限內相對人只要作出承諾合同即告成立，因此，甲公司的廣告構成要約。乙公司去甲公司買車的行為構成承諾，甲、乙公司之間的買賣合同已經成立。甲公司不能履行合同，應承擔違約責任。故A項正確，當選。"}, {"id": "卷二-9", "subject": "卷二", "type": "單選題", "question": "張老將自己的汽車贈與李四，但要求李四每月花一天時間帶自己出去兜兜風。李四得到汽車後總是推諉 ，半年沒有帶張老出去一次。張老每每想把車要回去，但總是下不了決心。夏天的某夜，張老不幸中風去世 。張老的孩子認為李四沒有履行自己的義務，要求撤銷這一贈與。對此，下列說法正確的是：", "options": [{"key": "A", "text": "張老的繼承人有權撤銷贈與"}, {"key": "B", "text": "張老繼承人的撤銷權。自知道或者應當知道撤銷原因之日起6個月內行使"}, {"key": "C", "text": "若贈與合同已經公證，則張老無權撤銷"}, {"key": "D", "text": "該贈與合同屬於附義務的贈與"}], "answer": ["D"], "explanation_full": "【羿文解析】受贈人李四不履行贈與合同所附義務，贈與人張老有權撤銷贈與合同。《民法典》第664條 ：“因受贈人的違法行為致使贈與人死亡或者喪失民事行為能力的，贈與人的繼承人或者法定代理人可以撤銷贈與。贈與人的繼承人或者法定代理人的撤銷權，自知道或者應當知道撤銷事由之日起六個月內行使。 ”由此可知，僅在張老因為受贈人的違法行為而死亡或者喪失行為能力的情形下，張老的繼承人才享有撤銷贈與合同的權利，故A選項錯誤，B選項錯誤。即使該贈與合同已經公證，張老行使法定撤銷權不受贈與合同已經公證的影響(限制的僅僅是任意撤銷權)，故C選項錯誤。 綜上，D選項正確。"}, {"id": "卷二-10", "subject": "卷二", "type": "單選題", "question": "甲演出公司與乙訂立合同，約定由甲提供布料，由乙進行加工，在1個月內完成旗袍50件。對此，下列說法正確的是：", "options": [{"key": "A", "text": "如果乙發現甲提供的布料有瑕疵。加工的旗袍會有質量問題，於是自行購買了質量更好的布料.乙的行為不屬於違約行為"}, {"key": "B", "text": "即使甲不按時支付乙的加工報酬，乙也不得留置其所加工的旗袍；而如果布料是由乙提供的，則乙享有留置權"}, {"key": "C", "text": "甲有權隨時終止合同，只是若因此對乙造成損失，需要進行賠償"}, {"key": "D", "text": "乙有權隨時終止合同，只是若因此對甲造成損失.需要進行賠償"}], "answer": ["C"], "explanation_full": "【羿文解析】《民法典》第775條規定，定作人提供材料的，定作人應當按照約定提供材料。承攬人對定作人提供的材料，應當及時檢驗，發現不符合約定時，應當及時通知定作人更換、補齊或者採取其他補救措施。 承攬人不得擅自更換定作人提供的材料，不得更換不需要修理的零部件。因此，乙不應自行更換布料，否則其行為構成違約行為，A選項錯誤。 《民法典》第783條：“定作人未向承攬人支付報酬或者材料費等價款的，承攬人對完成的工作成果享有留置權或者有權拒絕交付，但是當事人另有約定的除外。”這一法條規定了承攬人的留置權，並不以材料由定作人提供或者承攬人提供為區分，只要當事人沒有相反約定，承攬人在相應條件下均享有留置權，B選項錯誤。 《民法典》第787條：“定作人在承攬人完成工作前可以隨時解除合同，造成承攬人損失的，應當賠償損失。 ”而承攬人對承攬合同沒有任意解除權，C選項正確，D選項錯誤。"}, {"id": "卷二-11", "subject": "卷二", "type": "單選題", "question": "甲到乙家做客，離去時將提包遺忘在乙家。乙翻看提包，發現裡面有1瓶茅台酒及3萬元現金。下列說法正確的是：", "options": [{"key": "A", "text": "甲有權基於物權請求權請求乙返還茅台酒及3萬元現金"}, {"key": "B", "text": "如果乙將茅台酒喝了，甲有權請求乙返還該瓶酒的價值"}, {"key": "C", "text": "如果當時茅台酒單價市值為1000元，乙將該瓶茅台酒以1500元的價格出賣給不知情的丙，甲有權請求乙返還1000元價金專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 4"}, {"key": "D", "text": "如果乙將3萬元現金中的1萬元存入銀行，另2萬元投入股市。1個月後，甲尋到乙處，請求乙返還。此時 ，投入股市的2萬元已經獲利1000元，存入銀行的1萬元已獲得利息200元。乙應向甲返還現金31200元"}], "answer": ["B"], "explanation_full": "【羿文解析】乙占有甲的3萬元現金，根據金錢“占有即所有”的法律屬性.乙根據占有取得了3萬元現金的所有權，故乙對3萬元現金構成有權占有，甲不得行使物權請求權，僅得請求返還“不當得利”，系債權請求權 ；乙占有甲的茅台酒，並不能取得其所有權，故乙對該瓶茅台酒的占有構成無權占有。甲可基於返還原物請求權請求乙返還該瓶茅台酒，性質為物權請求權。故A選項錯誤。 本題中，如果乙占有該酒，而未飲用，則乙並未取得該酒，即其對該酒構成無權占有，而非不當得利。一旦乙將該瓶茅台酒喝完，乙即取得了該酒的無形利益，構成不當得利。因此，甲此時有權基於不當得利，請求乙返還該瓶茅台酒的價值。故B選項正確。 不當得利的制度目的在於去除不當利益，所以當獲得的利益大於受有的損失時，返還以實際損失為準；當獲得的利益小於所受損失時，返還以獲得的利益為準，即“取低者”。其次應結合不當得利人的主觀惡意考慮 ，如不當得利人是善意的，應當適當傾向於不當得利人的利益；如果不當得利人是惡意的，則應當傾向於保護利益受損方的利益。例如，乙將不當得利取得的貨物對外出售。如果是高於市場價售出，且乙為善意，可以按照市場價作為返還標準；若乙為惡意，則可以實際收益作為返還標準。本題中，如果當時茅台酒單價市值為1000元，乙將該瓶茅台酒以1500元的價格出賣給丙，甲有權請求乙返還1500元損失。故C選項錯誤。 返還的不當利益，應當包括原物和原物所生的孳息。在這裡，“孳息”是指不當得利之原物所生的利息、租金、中獎、天然孳息等。據此，乙應向甲返還3萬元本金和1個月的利息。利用不當得利所取得的其他利益 ，扣除勞務管理費用後，應當予以收繳。在這裡，“其他利益”是指不當得利之原物的商事投資、經營收益 。據此。乙所取得的本金、利息應向甲返還，乙所取得的1000元收益，應予收繳。故D選項錯誤。"}, {"id": "卷二-12", "subject": "卷二", "type": "單選題", "question": "甲公司因乙公司不支付到期貨款，遂通知乙公司留置租借給甲公司的機械設備。乙公司當日即同甲公司溝通，希望能夠寬限一段時間，甲公司表示同意，並在達成諒解備忘錄中聲明“留置乙公司的機械設備，乙公司應盡快還款”，對此。下列說法正確的是：", "options": [{"key": "A", "text": "留置權因諒解備忘錄的簽訂而設立"}, {"key": "B", "text": "雖然諒解備忘錄約定不明確.但甲公司仍應給乙公司2個月以上的債務履行期間"}, {"key": "C", "text": "諒解備忘錄實質上不能約束甲公司。故甲公司可以隨時拍賣該機械設備"}, {"key": "D", "text": "根據物權法定原則，當事人無權約定留置財產後的債務履行期間"}], "answer": ["B"], "explanation_full": "【羿文解析】留置權屬於法定擔保物權，不需要當事人之間達成合意，只要符合法律規定的條件，債權人就可行使留置權。根據《民法典》第447條的規定，可知留置權的構成要件有三：(1)債權人合法占有債務人的動產；(2)債權已屆清償期；(3)需債權人占有動產與所擔保的債權屬於同一法律關係，但企業之間留置除外 。故A選項錯誤。 甲公司有權依據《民法典》第448條的規定行使商事留置權，同時，根據《民法典》第453條的規定，除另有約定外，甲公司留置機械設備後，應當給乙公司六十日以上的履行寬限期，故B選項正確，C選項錯誤。 根據《民法典》第453條的規定，甲、乙可以約定乙公司履行債務的寬限期，故D選項錯誤。"}, {"id": "卷二-13", "subject": "卷二", "type": "單選題", "question": "甲與乙訂立了一份蘋果購銷合同，約定：甲向乙交付20萬公斤蘋果，貨款為40萬元，乙向甲支付定金4萬元；如任何一方不履行合同應支付違約金6萬元。甲因將蘋果賣與丙而無法向乙交付蘋果，乙提出的如下訴訟請求中，既能最大限度保護自己的利益，又能獲得法院支持的訴訟請求是什麼？", "options": [{"key": "A", "text": "請求甲雙倍返還定金8萬元"}, {"key": "B", "text": "請求甲雙倍返還定金8萬元，同時請求甲支付違約金6萬元"}, {"key": "C", "text": "請求甲支付違約金6萬元，同時請求返還支付的定金4萬元"}, {"key": "D", "text": "請求甲支付違約金6萬元"}], "answer": ["A"], "explanation_full": "5 違約金或者定金條款。”據此，BC選項錯誤。乙選擇定金，有權請求甲雙倍返還8萬元，此時乙所得利益為 4萬元。乙選擇違約金，有權請求甲支付違約金6萬元，此時乙所得利益為2萬元。由此比較，A選項能獲得最大利益。"}, {"id": "卷二-14", "subject": "卷二", "type": "單選題", "question": "甲因出差，故把自己的珍藏多年的古董花瓶交給自己的好友乙，讓其幫忙保管。據此，下列選項不正確的是：（　）", "options": [{"key": "A", "text": "若在保管期間，該古董花瓶在乙家中被小偷盜走，乙應承擔賠償責任"}, {"key": "B", "text": "若在保管期間，乙因出差將古董交給自己的好友丙保管，後該古董在丙家中被盜，乙應承擔賠償責任"}, {"key": "C", "text": "若在保管期間，乙未在颱風天氣將窗戶關閉，致使花瓶被風吹倒打碎，乙應承擔賠償責任"}, {"key": "D", "text": "若雙方約定保管期限為甲出差的3個月，後甲提前歸家，乙無權要求甲提前將花瓶取回"}], "answer": ["A"], "explanation_full": "【羿文解析】《民法典》第897條規定，保管期間，因保管人保管不善造成保管物毀損、滅失的，保管人應當承擔損害賠償責任，但保管是無償的，保管人證明自己沒有重大過失的，不承擔損害賠償責任。在A選項中 ，乙並無重大過失，不應承擔賠償責任，故選項A錯誤。 在C選項中，乙明知有颱風天氣而未關窗，亦未妥善對該易碎花瓶進行妥善保管，存在重大過失，故C選項正確。 《民法典》第894條規定，保管人不得將保管物轉交第三人保管，但當事人另有約定的除外。保管人違反前款規定，將保管物轉交第三人保管，對保管物造成損失的，應當承擔損害賠償責任。乙在未有約定的情況下將花瓶轉交給第三人丙保管，致使花瓶被盜，應承擔賠償責任，故B選項正確。 《民法典》第899條規定第2款規定，約定保管期間的，保管人無特別事由，不得要求寄存人提前領取保管物 。故D選項正確。"}, {"id": "卷二-15", "subject": "卷二", "type": "單選題", "question": "林某聘請張某負責照看小孩，王某聘請錢某做家務。林某和王某為鄰居，張某和錢某為好友。林某突生急病昏迷不醒，張某聯繫不上林某的親屬，急將林某送往醫院，並將林某的小孩委託給錢某臨時照看。錢某疏於照看，致林某的小孩在玩耍中受傷。下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "張某將林某送往醫院的行為屬於無因管理"}, {"key": "B", "text": "錢某照看小孩的行為屬於無因管理，不構成侵權行為"}, {"key": "C", "text": "王某應當承擔林某小孩的醫療費"}, {"key": "D", "text": "張某和錢某對林某小孩的醫療費承擔連帶責任"}], "answer": ["A"], "explanation_full": "【羿文解析】《民法典》第121條規定，沒有法定的或者約定的義務，為避免他人利益受損失而進行管理的人 ，有權請求受益人償還由此而支出的必要費用。本題中，張某雖受林某聘請，但其職責是照看小孩。張某送林某進醫院沒有法定義務或合同義務，故構成無因管理，A選項正確，當選。 錢某照看林某的小孩本屬於無因管理，但未盡適當管理義務，故構成侵權行為，應當承擔賠償責任，故B選項錯誤，不當選。 王某雖為錢某的雇主，但照看小孩的行為不屬於履行王某聘請錢某的職責範圍，故王某不應當承擔賠償責任 ，C選項錯誤，不當選。 《民法典》第1165條規定，行為人因過錯侵害他人民事權益，應當承擔侵權責任。張某為了林某的利益，在緊急情況下將照看小孩的事務轉委託於好友錢某，合情合理合法，沒有過錯，不應當與錢某承擔連帶責任 ，故D選項錯誤，不當選。"}, {"id": "卷二-16", "subject": "卷二", "type": "單選題", "question": "趙某欠丁某的10萬元已屆期，但趙某無力清償。某日，丁某得知趙某要出賣自己的二手車，但因該車曾被水浸泡而難以找到買主。此時，丁某找到林某，極力勸說林某購買趙某的二手車，以便要回借款。丁某曾向林某許諾該車沒有任何問題，但趙某對此事並不知情。林某覺得其中可能有貓膩，故拒絕購買。後丁某以揭發林某嫖娼一事相要挾，迫使林某與趙某簽訂了買賣合同，趙某亦不知丁某脅迫一事。關於本案，下列哪一表述是正確的？ 6", "options": [{"key": "A", "text": "若林某因丁某的欺詐而與趙某簽訂買賣合同，則林某有權撤銷該買賣合同"}, {"key": "B", "text": "林某無權撤銷該買賣合同"}, {"key": "C", "text": "林某有權向丁某主張撤銷該買賣合同"}, {"key": "D", "text": "林某有權向趙某主張撤銷該買賣合同"}], "answer": ["D"], "explanation_full": "【羿文解析】《民法典》第149條規定：“第三人實施欺詐行為，使一方在違背真實意思的情況下實施的民事法律行為，對方知道或者應當知道該欺詐行為的，受欺詐方有權請求人民法院或者仲裁機構予以撤銷。”據此可知，當第三人實施欺詐時，只有當表意相對人為惡意時，表意人(受欺詐方)才可向表意相對人行使撤銷權；若表意相對人是善意的，則表意人(受欺詐方)無權向表意相對人行使撤銷權。本案中，丁某對於買賣合同的當事人趙某和林某而言，為第三人，若該買賣合同因丁某的欺詐而簽訂，則林某能否撤銷取決於趙某是否知道丁某實施欺詐行為，而題乾中已經交代，趙某對丁某欺詐一事並不知情：因此，林某無權以丁某欺詐為由撤銷該買賣合同。因此，A項錯誤，不當選。 《民法典》第150條規定：“一方或者第三人以脅迫手段，使對方在違背真實意思的情況下實施的民事法律行為，受脅迫方有權請求人民法院或者仲裁機構予以撤銷。”據此可知，在發生第三人脅迫時，不管對方知不知情，受脅迫方均享有撤銷權。另外，需要注意的是，合同行為中的受脅迫方在行使撤銷權時，要遵循相對性原理，即只能向合同的另一方當事人主張撤銷。本案中，趙某和林某的買賣合同是因第三人丁某的脅迫而簽訂的，雖然趙某對丁某脅迫一事並不知情，但是這並不影響林某對趙某主張撤銷該買賣合同。因此，B項錯誤，不當選；C項錯誤，不當選；D項正確，當選。 綜上所述，本題選D。"}, {"id": "卷二-17", "subject": "卷二", "type": "單選題", "question": "為增加資金周轉，甲公司向乙銀行申請貸款。乙銀行提供6000萬元貸款，甲公司董事長楊某用自己的4套獨棟別墅提供抵押擔保。貸款到期後甲公司無力歸還，乙銀行向法院申請適用特別程序實現對獨棟別墅的抵押權（受理案件法院管轄範圍為標的額3000萬以下的案件）。關於本案，下列哪一做法是正確的？（　）", "options": [{"key": "A", "text": "本案由審判員汪某獨任審查"}, {"key": "B", "text": "乙銀行可以口頭或書面方式提出申請"}, {"key": "C", "text": "楊某有權申請實現擔保物權"}, {"key": "D", "text": "審查發現當事人有實質爭議，將該案轉入訴訟程序"}], "answer": ["C"], "explanation_full": "【羿文解析】《民事訴訟法解釋》第367條規定實現擔保物權案件可以由審判員一人獨任審查。擔保財產標的額超過基層人民法院管轄範圍的，應當組成合議庭進行審查。據此，本案的標的額肯定超過基層人民法院的管轄法院，應由合議庭審查。A選項做法錯誤。 《民事訴訟法解釋》第365條第(一)項規定，申請實現擔保物權，應當提交申請書。據此，乙銀行應用書面形式提出申請。B選項做法錯誤。 《民事訴訟法解釋》第359條規定，《民事訴訟法》第203條規定的擔保物權人，包括抵押權人、質權人、留置權人；其他有權請求實現擔保物權的人，包括抵押人、出質人、財產被留置的債務人或者所有權人等。據此，抵押人楊某也有權申請實現擔保物權。C選項做法正確。 《民事訴訟法解釋》第370條第3項規定，當事人對實現擔保物權有實質性爭議的，裁定駁回申請，並告知申請人向人民法院提起訴訟。據此，應告知乙銀行另行起訴，而非轉人訴訟程序。D選項做法錯誤。"}, {"id": "卷二-18", "subject": "卷二", "type": "單選題", "question": "甲、乙、丙3人合夥籌辦一家餐廳，在店面裝修過程中找同鄉丁幫忙卸磚。丁不慎將磚堆弄倒，砸傷了路過的戊。因賠償協商無果，戊向法院起訴，要求賠償各項損失2萬元。關於本案，下列哪一說法是正確的 ？（　）", "options": [{"key": "A", "text": "戊應起訴丁，並承擔被告主觀有過錯的證明責任"}, {"key": "B", "text": "戊應起訴丁，由被告承擔其主觀無過錯的證明責任"}, {"key": "C", "text": "戊應起訴甲、乙、丙，並承擔被告主觀有過錯的證明責任"}, {"key": "D", "text": "戊應起訴甲、乙、丙，由被告承擔其主觀無過錯的證明責任專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 7"}], "answer": ["D"], "explanation_full": "【羿文解析】《民事訴訟法解釋》第57條規定，提供勞務一方因勞務造成他人損害，受害人提起訴訟的，以接受勞務一方為被告。又根據《民事訴訟法解釋》第60條規定，在訴訟中，未依法登記領取營業執照的個人合夥的全體合夥人為共同訴訟人。據此，接受丁勞務的是甲、乙、丙3人，因此本案的適格被告是甲、乙、丙 。《民法典》第1255條規定，堆放物倒塌、滾落或者滑落造成他人損害，堆放人不能證明自己沒有過錯的 ，應當承擔侵權責任。據此，堆放物倒塌致人損害糾紛中過錯要件倒置，即應由被告承擔其主觀無過錯的證明責任。綜上所述，D選項為本題正確答案。"}, {"id": "卷二-19", "subject": "卷二", "type": "單選題", "question": "因租戶張某拖欠房租，房主李某向法院起訴，要求判令張某支付房租及違約金。李某委託劉律師作為“一般授權”的訴訟代理人，在訴訟過程中，劉律師請求法院判決解除租賃合同。關於本案，下列哪一說法是錯誤的？（　）", "options": [{"key": "A", "text": "本案的訴訟標的未發生變更"}, {"key": "B", "text": "劉律師無權變更訴訟請求"}, {"key": "C", "text": "若劉律師有權請求解除合同，則該訴變為變更之訴"}, {"key": "D", "text": "訴訟中張某可以變更訴訟請求"}], "answer": ["D"], "explanation_full": "【羿文解析】訴訟標的是指當事人之間發生爭執並要求法院作出裁判的民事權利義務關係。本案的訴訟標的是租賃合同關係，交納房租和違約金變為解除租賃合同，僅為訴訟請求的變更，訴訟標的並未改變。A選項說法正確，不當選。 《民事訴訟法》第62條第2款規定，授權委託書必須記明委託事項和權限。訴訟代理人代為承認、放棄、變更訴訟請求，進行和解，提起反訴或者上訴，必須有委託人的特別授權。本案中劉律師的代理權限是一般授權 ，他無權變更訴訟請求。B選項說法正確，不當選。 要求對方支付房租和違約金屬於給付之訴，但本案變更訴訟請求為解除合同，其訴的類型變為變更之訴。因為變更之訴是指原告請求法院以判決改變或消滅既存的某種民事法律關係的訴。C選項說法正確，不當選。 《民事訴訟法》第54條規定，原告可以放棄或者變更訴訟請求。被告可以承認或者反駁訴訟請求，有權提起反訴。據此，張某是該訴的被告，其無權變更訴訟請求。D選項說法錯誤，當選。"}, {"id": "卷二-20", "subject": "卷二", "type": "單選題", "question": "某判決生效後，權利人吳某據此申請強制執行劉某10萬元，被執行人劉某向執行法院提出自己無法清償債務，但是對案外人鄭某享有到期債權，法院遂向鄭某發出履行到期債務通知。關於本案，下列說法正確的是 （　）", "options": [{"key": "A", "text": "鄭某可以在收到通知之日起15日內提出異議，或者向吳某履行債務，否則，法院可以強制執行"}, {"key": "B", "text": "鄭某在15日內提出異議，法院經審查，認為異議成立的，不能對鄭某強制執行"}, {"key": "C", "text": "鄭某主張其與吳某不存在債權債務關係，法院不能對鄭某強制執行"}, {"key": "D", "text": "鄭某確無可供執行財產，但對孫某享有到期債權，可申請法院向孫某發出履行債務通知"}], "answer": ["A"], "explanation_full": "【羿文解析】代位申請執行指被執行人不能清償債務，但是對第三人享有到期債權，經申請執行人或者被執行人申請，法院向第三人發出履行到期債務的通知。第三人收到該通知之日起15日內向申請執行人履行債務或者提出異議，如果第三人在15日內既不履行債務也不提出異議，法院裁定對該第三人強制執行；如果第三人在15日內提出異議。則不得對該第三人強制執行，法院對該異議不審查。當然，第三人提出自己沒有履行能力或者自己與申請人之問無直接法律義務關係的不屬於異議。綜上所述，A選項是對履行通知效力的表述 ，表述正確。 B選項中，第三人向法院提出異議的，法院不能對第三人強制執行，法院對該異議不審查，選項錯在“經審查 ”的表述上。 C選項第三人鄭某主張其與申請人吳某不存在債權債務關係不屬於異議，不影響履行通知的效力，表述錯誤。 D選項中，考查不得再代位的規定，即該第三人確無可供執行的財產，不得就第三人對他人享有的到期債權強制執行，表述錯誤。 8 綜上，本題答案為A。"}, {"id": "卷二-21", "subject": "卷二", "type": "單選題", "question": "A區的甲公司與B區的乙公司簽訂木材買賣合同，約定在C區由乙公司交付甲公司一批木材，雙方書面簽訂補充協議“因合同糾紛，由合同實際履行地法院管轄”後乙公司在D區完成木材交付，因為木材質量問題，甲公司欲起訴乙公司，應當由哪些(個)法院管轄（　）", "options": [{"key": "A", "text": "A區法院"}, {"key": "B", "text": "B區法院"}, {"key": "C", "text": "C區法院"}, {"key": "D", "text": "D區法院"}], "answer": ["D"], "explanation_full": "【羿文解析】本題中不存在專屬管轄，進入第二步協議管轄，“雙方書面簽訂補充協議‘因合同糾紛，由合同實際履行地法院管轄’”，該管轄協議有效，故原告應向管轄協議約定的“合同實際履行地”即D區法院起訴。既然存在協議管轄，則無需進入法定管轄的判斷，即無需考慮被告住所地以及約定履行地與實際履行地不一致問題，故D正確。"}, {"id": "卷二-22", "subject": "卷二", "type": "單選題", "question": "甲公司與乙公司簽訂了一份買賣合同，合同約定因為合同發生的任何爭議，雙方當事人應當提交南京仲裁委員會仲裁。下列說法正確的是（　）", "options": [{"key": "A", "text": "若該合同由於違反法律規定而無效，由此產生的締約過失責任問題，甲公司可以向法院起訴乙公司"}, {"key": "B", "text": "甲公司在合同簽訂後將合同項下的權利義務轉讓給了騰達公司，騰達公司與乙公司履行合同過程產生爭議 ，可以通過訴訟途徑解決糾紛"}, {"key": "C", "text": "甲公司在合同履行過程中分立為了甲、乙公司，現在甲、乙公司與乙公司因為履行合同產生爭議，可以通過訴訟途徑解決"}, {"key": "D", "text": "甲公司和乙公司就這份仲裁協議效力產生了爭議，可以在仲裁庭首次開庭前申請南京仲裁委員會或者南京市中級人民法院確認該協議的效力"}], "answer": ["D"], "explanation_full": "【羿文解析】A選項考查仲裁條款效力的獨立性，合同無效不影響仲裁條款的效力，關於締約過失責任這一糾紛，雙方當事人存在有效的仲裁協議，應當根據仲裁協議申請仲裁委員會仲裁，而不能向法院起訴，表述錯誤。 B選項中騰達公司作為合同債權債務的受讓人，應當受仲裁條款效力的約束，即在騰達公司與乙公司之間存在有效仲裁協議。發生糾紛應當根據仲裁協議向仲裁委員會申請仲裁，而不能向法院起訴。 C選項甲公司分立後，甲、乙公司作為甲公司的權利義務繼受人，應當受到仲裁條款的約束，即甲、乙公司與乙公司之間存在有效仲裁協議，發生糾紛應當根據仲裁協議向仲裁委申請仲裁，而不能向法院起訴。 D選項考查仲裁協議效力的確認，當事人因為仲裁協議的效力發生爭議，可以請求法院作出裁定或者仲裁委作出決定，同時請注意，申請確認仲裁協議效力應當在仲裁庭首次開庭前，表述正確。"}, {"id": "卷二-23", "subject": "卷二", "type": "單選題", "question": "張三、李四因為生活瑣事發生矛盾，李四將張三打傷，張三的表弟陸某(32歲)、路人陳某(34歲)以及其子陳小(11歲)目睹了整個案件事實；後張三起訴李四要求賠償醫療費、誤工費等損失共計5000元，申請法庭通知陸某、陳某以及陳小作為證人出庭作證。法庭上陸某陳述李四無端尋釁將張三打傷，而陳某陳述張三與李四推搡過程中李四失手將張三打傷。關於本案，下列表述正確的是（　）", "options": [{"key": "A", "text": "張三應當在舉證期限屆滿前申請法庭通知證人出庭作證，且應當承擔證人出庭作證產生的交通、住宿、就餐等必要費用以及誤工損失"}, {"key": "B", "text": "法院應當要求以上證人簽署如實陳述保證書，證人拒絕簽署的，不得作證，並且自行承擔費用"}, {"key": "C", "text": "陸某與案件有利害關係，陳小是未成年人，不得作為證人"}, {"key": "D", "text": "陸某的證言證明力小於路人陳某的證言，且不得單獨作為認定案件事實的依據"}], "answer": ["D"], "explanation_full": "9 權調查收集的證據的，可以由法院依職權通知證人出庭，未經通知，證人不得出庭作證，但雙方當事人均同意並經法院准許的除外。故A選項中關於當事人申請法院通知證人出庭的表述正確；但關於證人出庭的費用 ，包括交通、就餐、住宿等必要費用以及誤工損失應當由敗訴方承擔，而不應當由申請方當事人承擔，故A選項關於證人出庭費用補助的表述錯誤，A選項表述錯誤。 其次，關於證人出庭作證的保證書，法院應當責令證人簽署如實作證保證書，但無、限制民事行為能力人除外，證人拒絕簽署保證書的，不得作證，且應當自行承擔費用。本案中陸某、陳某應當簽署如實作證保證書 ，如其拒絕簽署則不得作證，且應當自行承擔費用，而陳小是限制民事行為能力人，無需簽署保證書，故B選項關於法院應當要求本案三名證人均簽署保證書的表述錯誤。 再次，關於證人資格問題，凡是知道案件情況且能夠正確表達的人都有義務作證，故一來無、限制民事行為能力人如果能夠正確表達亦能作為證人，二來與案件有利害關係的人也可以作為證人(證人不適用迴避制度 )，只是其證言的證明力較小，不能單獨作為認定案件事實的依據，故C選項關於證人資格的表述錯誤。 最後，關於證明力的問題，首先與案件有利害關係的人所提供的證言證明力較小，不能單獨作為認定案件事實的依據(需要其他證據對其證明力予以補強)；其次關於證明力大小的比較問題，與當事人有親屬或者其他密切關係的人出具的有利於該方當事人的證言證明力小於其他證人證言，本案中證人陸某作為張三的表弟 ，其提供的證言對張三有利，其證明力小於路人陳某的證人證言，故D選項關於證言證明力的表述正確。 綜上，本題答案為D。"}, {"id": "卷二-24", "subject": "卷二", "type": "單選題", "question": "張某、李某侵權糾紛一案，某縣法院於6月1日向當事人送達一審判決後，李某不服，欲提出上訴，關於本案上訴期間表述正確的是（　）", "options": [{"key": "A", "text": "李某赴法院提交上訴狀的在途期間不計算在上訴期間內"}, {"key": "B", "text": "李某在6月16日將上訴狀交郵，上訴狀於6月18日寄到法院，本案上訴有效"}, {"key": "C", "text": "如果李某在提交上訴狀的路上發生車禍昏迷至6月17日，法院應當依職權為其順延期間"}, {"key": "D", "text": "在上訴期內有法定節假日的，應當予以扣除"}], "answer": ["B"], "explanation_full": "【羿文解析】6月1日送達一審判決，上訴期自6月2日開始計算15天，即6月16日為上訴期的最後一天。關於在途期間不計算在期間內的規定僅僅指訴訟文書在途期間不計算在期間內，只要在期間屆滿前將文書交郵的 ，均不算過期，故B選項中劉某在6月16日將上訴狀交郵的，不算過期，其上訴行為有效，表述正確。 當事人蔘加訴訟的在途期間應當計算在期間內，故A選項表述錯誤。 C選項考查期間的耽誤與順延，當事人因不可抗拒的事由或者其他正當理由耽誤期限的，可以在障礙消除後 10日內向法院申請順延期限，是否准許由法院決定，可見因為不可抗拒的事由耽誤期限而順延期限的需要經過當事人申請，法院不能依職權順延，故本題C選項錯誤。 D選項關於節假日的問題，期間屆滿的最後一日為法定節假日的，期間順延到節假日後的第一個工作日，但是期間開始或者期間中有節假日的不能予以扣除，所以D選項表述錯誤。 綜上，本題答案為B。"}, {"id": "卷二-25", "subject": "卷二", "type": "單選題", "question": "甲市欣欣百貨商場訴王某購銷合同糾紛一案，該市中級人民法院於6月20日作出終審判決，判令王某於判決生效之日起10日內向欣欣百貨商場支付貨款50萬元。判決書於6月23日送達雙方當事人。王某未及時履行 ，欣欣百貨商場應於何期限內申請執行？", "options": [{"key": "A", "text": "自欣欣百貨商場收到判決書之日起6個月"}, {"key": "B", "text": "判決確定的王某支付貨款期間的最後一日起6個月"}, {"key": "C", "text": "自王某收到判決書之日起2年"}, {"key": "D", "text": "判決確定的王某支付貨款期間的最後一日起2年"}], "answer": ["D"], "explanation_full": "【羿文解析】根據《民事訴訟法》第246條的規定，申申請執行的期間為二年。申請執行時效的中止、中斷 ，適用法律有關訴訟時效中止、中斷的規定。前款規定的期間，從法律文書規定履行期間的最後一日起計算 10 書生效之日起計算。故D項說法正確。"}, {"id": "卷二-26", "subject": "卷二", "type": "單選題", "question": "萬某因與劉某的侵權糾紛向甲區人民法院起訴，要求劉某向其支付醫療費1.2萬元，法院根據本案相關證據，判決萬某勝訴。判決生效後，劉某發現新證據向甲區人民檢察院申請抗訴，檢察院告知其向法院申請再審。後甲區人民檢察院又依職權向法院發出再審檢察建議，法院未予審查即決定再審，卻並未中止對本案判決書的執行。關於本案，下列哪一做法不符合法律規定？（　）", "options": [{"key": "A", "text": "檢察院告知劉某向法院申請再審"}, {"key": "B", "text": "檢察院依職權發出再審檢察建議"}, {"key": "C", "text": "法院對再審檢察建議未予審查"}, {"key": "D", "text": "法院未中止判決書的執行"}], "answer": ["C"], "explanation_full": "【羿文解析】《民事訴訟法》第209條規定，有下列情形之一的，當事人可以向人民檢察院申請檢察建議或者抗訴：①人民法院駁回再審申請的；②人民法院逾期未對再審申請作出裁定的；③再審判決、裁定有明顯錯誤的。據此，再審啟動應當遵循“法院糾錯在先，檢察院監督在後”的原則，劉某發現新證據應首先向法院申請再審，不服法院的處理才可向檢察院申請抗訴。A選項做法符合法律規定，不當選。 檢察院啟動抗訴或檢察建議，包括當事人申請和檢察院自行發現錯誤兩條路徑。兩者並行不悖，且檢察院自行啟動檢察監督並無前提條件限制。B選項做法符合法律規定，不當選。 根據《民事訴訟法解釋》第417條規定，人民法院收到再審檢察建議後，應當組成合議庭，在三個月內進行審查，發現原判決、裁定、調解書確有錯誤，需要再審的，依照民事訴訟法第一百九十八條規定裁定再審，並通知當事人；經審查，決定不予再審的，應當書面回覆人民檢察院。據此，法院對檢察院的檢察建議未予審查即決定再審，不符合規定。C選項為正確答案。 《民事訴訟法》第206條規定，按照審判監督程序決定再審的案件，裁定中止原判決、裁定、調解書的執行 ，但追索贍養費、扶養費、撫育費、撫恤金、醫療費用、勞動報酬等案件，可以不中止執行。本案屬於追索醫療費用案件，法院未中止執行符合規定。D選項做法符合法律規定，不當選。"}, {"id": "卷二-27", "subject": "卷二", "type": "單選題", "question": "以下哪一情形適用訴訟時效的抗辯？", "options": [{"key": "A", "text": "張大爺5年前到期的定期存款請求權"}, {"key": "B", "text": "甲公司對股東乙的繳付出資請求權"}, {"key": "C", "text": "王大媽持有的2001年購買的期限為5年的國庫券"}, {"key": "D", "text": "丁公司受丙公司欺詐，簽訂的合同被撤銷後，向丙公司主張賠償損失的請求權"}], "answer": ["D"], "explanation_full": "【羿文解析】《訴訟時效規定》第1條規定：當事人可以對債權請求權提出訴訟時效抗辯，但對下列債權請求權提出訴訟時效抗辯的，人民法院不予支持：（一）支付存款本金及利息請求權；（二）兌付國債、金融債券以及向不特定對象發行的企業債券本息請求權；（三）基於投資關係產生的繳付出資請求權；（四）其他依法不適用訴訟時效規定的債權請求權。故ABC項均不適用訴訟時效的抗辯，不當選。D項中丁公司主張賠償損失的請求權是債權請求權，屬於訴訟時效的適用對象，當選。"}, {"id": "卷二-28", "subject": "卷二", "type": "單選題", "question": "某法院受理中國人王某與美國人湯姆的離婚訴訟，適用普通程序審理。兩人均承認存在婚姻關係，但認為感情已經破裂。經法官調解無果，雙方達成離婚調解協議。關於本案的處理，下列哪一選項是正確的？（ ）", "options": [{"key": "A", "text": "一審審理期限為6個月"}, {"key": "B", "text": "就存在婚姻關係的事實法院無須查證"}, {"key": "C", "text": "法院應當製作調解書"}, {"key": "D", "text": "當事人要求依調解協議制發判決書，法院不予准許"}], "answer": ["C"], "explanation_full": "11 ，不受國內民事訴訟一審案件6個月審理期限的限制。A選項錯誤。 《民事訴訟法解釋》第92條第2款規定，對於涉及身份關係、國家利益、社會公共利益等應當由人民法院依職權調查的事實，不適用前款自認的規定。據此，婚姻關係屬於身份關係案件，不適用自認規則。B選項錯誤。 《民事訴訟法解釋》第528條第一款規定，涉外民事訴訟中，經調解雙方達成協議，應當制發調解書。C選項為正確答案。 《民事訴訟法解釋》第528條第二款規定，當事人要求發給判決書的，可以依協議的內容製作判決書送達當事人。D選項錯誤。"}, {"id": "卷二-29", "subject": "卷二", "type": "單選題", "question": "甲、乙、丙共同出資設立A公司。甲擔任董事長。公司章程約定註冊資本100萬元，三股東分別按照 50％，20％和30％的比例出資和分取紅利。甲、乙繳足了出資，丙僅繳付了10萬元的出資，A公司因戰略轉型 。於2017年盈利頗豐，股東會決議按照公司章程向股東分紅，下列說法正確的是：", "options": [{"key": "A", "text": "公司在彌補虧損和提取法定公積金之前向股東分配了紅利，股東會決議用下一年利潤彌補虧損並補提法定公積金"}, {"key": "B", "text": "如果董事會對分紅決議拒不執行，丙有權以公司和甲為被告提起訴訟"}, {"key": "C", "text": "若股東提起訴訟，公司應當就不執行股東會決議分配利潤的法定理由承擔舉證責任"}, {"key": "D", "text": "因為公司未按股東會決議分紅，丙有權要求公司回購其股權退出公司"}], "answer": ["C"], "explanation_full": "【羿文解析】根據《公司法》第166條第5款：“股東會、股東大會或者董事會違反前款規定，在公司彌補虧損和提取法定公積金之前向股東分配利潤的，股東必須將違反規定分配的利潤退還公司。”公司進行了非法分配須退還，不能用將來收益折抵，A項錯誤。 《公司法司法解釋四》第13條第1款：“股東請求公司分配利潤案件，應當列公司為被告。”股東因分紅權被公司損害而提起訴訟，利害關係人是股東和公司。所以本案中，股東丙應為原告，公司應為被告，董事長甲不應成為被告，B項錯誤。 《公司法司法解釋四》第14條：“股東提交載明具體分配方案的股東會或者股東大會的有效決議，請求公司分配利潤，公司拒絕分配利潤且其關於無法執行決議的抗辯理由不成立的，人民法院應當判決公司按照決議載明的具體分配方案向股東分配利潤。”股東會作出分紅決議，公司應按決議執行，因公司沒有執行分紅決議被股東提起訴訟，公司應就其不執行股東會決議中的分紅安排提供可以成立的法定抗辯理由，如果舉證不能則承擔敗訴的後果，C項正確。 《公司法》第74條：“有下列情形之一的，對股東會該項決議投反對票的股東可以請求公司按照合理的價格收購其股權：(一)公司連續五年不向股東分配利潤，而公司該五年連續盈利，並且符合本法規定的分配利潤條件的：(二)公司合併、分立、轉讓主要財產的；(三)公司章程規定的營業期限屆滿或者章程規定的其他解散事由出現，股東會會議通過決議修改章程使公司存續的。自股東會會議決議通過之日起六十日內，股東與公司不能達成股權收購協議的，股東可以自股東會會議決議通過之日起九十日內向人民法院提起訴訟。”股東要求公司回購股權有法定的適用情形，本案中所述情形並不符合可以回購的法定適用情形，所以丙提出的回購請求不能支持。D項錯誤。"}, {"id": "卷二-30", "subject": "卷二", "type": "單選題", "question": "愛愛寵物食品股份有限公司是一家在深交所掛牌上市的公司，以銷售貓糧鳥食為其主營業務，公司資產總額為8000萬元。公司董事會成員五人，分別是樂樂、阿花、阿湯、阿狀、菜菜，五名董事皆為該公司股東。 公司章程約定公司向其他企業投資及擔保事項。由董事會決議。下列表述符合法律規定的是：", "options": [{"key": "A", "text": "公司擬以2500萬元收購某辦公大樓，該大樓為股東菜菜的老公投資的公司所有，菜菜迴避，其他董事表決作出董事會決議"}, {"key": "B", "text": "公司擬向股東樂樂的100萬元貸款提供擔保，樂樂迴避，其他董事表決作出董事會決議"}, {"key": "C", "text": "公司擬向湯咪玩具公司投資200萬元，該玩具公司系股東阿湯獨資設立，阿湯迴避，其他董事表決作出董事會決議"}, {"key": "D", "text": "該公司的董事會構成不合法，因為上市公司董事會中必須有獨立董事，而獨立董事不得是公司的股東 12"}], "answer": ["C"], "explanation_full": "【羿文解析】《公司法》第121條：“上市公司在一年內購買、出售重大資產或者擔保金額超過公司資產總額百分之三十的，應當由股東大會作出決議，並經出席會議的股東所持表決權的三分之二以上通過。”公司用 2500萬元收購辦公大樓，應屬於購買重大資產的行為，是股東大會特別多數決議的範圍，董事會無權對此作出決議，A項違法，不當選。 《公司法》第16條第2款：“公司為公司股東或者實際控制人提供擔保的，必須經股東會或者股東大會決議。 ”公司為股東樂樂提供擔保，屬於對內擔保，應該由股東大會決議。董事會即使經章程授權也不享有決議權 ，B項不合法。 《公司法》第124條：“上市公司董事與董事會會議決議事項所涉及的企業有關聯關係的，不得對該項決議行使表決權，也不得代理其他董事行使表決權。該董事會會議由過半數的無關聯關係董事出席即可舉行，董事會會議所作決議須經無關聯關係董事過半數通過。出席董事會的無關聯關係董事人數不足三人的，應將該事項提交上市公司股東大會審議。”基於上市公司關聯董事迴避制度的要求，C項表述合法。 根據《關於在上市公司建立獨立董事制度的指導意見》，上市公司董事會成員中需要有不低於1／3的比例是獨立董事，直接或間接持有上市公司已發行股份1％以上或者是上市公司前10名股東中的自然人股東及其直系親屬不得擔任獨立董事，所以獨立董事可以是公司股東，只要持股比例符合法定要求即可，D項表述錯誤。"}, {"id": "卷二-31", "subject": "卷二", "type": "單選題", "question": "汪某是甲公司的董事長和法定代表人，汪某代表甲公司與乙公司簽署《貨物買賣合同》，標的額200萬元 ，為支付貨款，汪某擅自以甲公司名義簽發一張200萬元的銀行承兌匯票，汪某在票據上簽章，但未加蓋甲公司印章。關於該票據下列說法正確的是：", "options": [{"key": "A", "text": "該票據有效，汪某應承擔票據責任"}, {"key": "B", "text": "該票據有效，甲公司應承擔票據責任"}, {"key": "C", "text": "該票據無效，但汪某應承擔對乙公司的付款責任"}, {"key": "D", "text": "該票據無效，但甲公司應承擔對乙公司的付款責任"}], "answer": ["D"], "explanation_full": "【羿文解析】根據最高人民法院《關於審理票據糾紛案件若干問題的規定》第40條：“票據出票人在票據上的簽章上不符合票據法以及下述規定的，該簽章不具有票據法上的效力：(一)商業匯票上的出票人的簽章 ，為該法人或者該單位的財務專用章或者公章加其法定代表人、單位負責人或者其授權的代理人的簽名或者蓋章：……”所以本案中的匯票，只有法定代表人簽章，並沒有甲公司印章，該出票人簽章無效。《票據法 》第22條：“匯票必須記載下列事項：(一)表明‘匯票’的字樣；(二)無條件支付的委託；(三)確定的金額 ；(四)付款人名稱；(五)收款人名稱；(六)出票日期；(七)出票人簽章。匯票上未記載前款規定事項之一的 ，匯票無效。”出票人簽章是匯票的絕對必要記載事項，簽章無效導致票據無效，A、B項錯誤。 汪某作為甲公司的法定代表人，代表甲公司與乙公司簽署的《貨物買賣合同》有效，甲公司應該承擔付款責任，D項正確，C項錯誤。"}, {"id": "卷二-32", "subject": "卷二", "type": "單選題", "question": "春華公司、汪某、苗某共同成立A普通合夥企業，其中春華公司由馬某、牛某出資設立，根據《合夥企業法》，下列哪一說法是錯誤的？", "options": [{"key": "A", "text": "春華公司可以成為普通合夥人"}, {"key": "B", "text": "除合夥協議另有約定外，苗某向秋實轉讓其在合夥企業中的財產份額時，須經春華公司、汪某同意"}, {"key": "C", "text": "汪某以其在合夥企業中的財產份額出質的。須經春華公司、苗某同意；但即使未經春華公司、苗某同意 ，其行為依然有效"}, {"key": "D", "text": "汪某以其在合夥企業中的財產份額出質的，須經春華公司、苗某同意；未經春華公司、苗某同意同意，其行為無效，由此給善意第三人造成損失的，由行為人依法承擔賠償責任"}], "answer": ["C"], "explanation_full": "【羿文解析】《合夥企業法》第3條規定：“國有獨資公司、國有企業、上市公司以及公益性的事業單位、社會團體不得成為普通合夥人。”依據該規定，A正確，春華公司不在限制範圍內。 13 時，應當通知其他合夥人。”依據該條規定，選項B正確。 《合夥企業法》第25條規定：“合夥人以其在合夥企業中的財產份額出質的，須經其他合夥人一致同意；未經其他合夥人一致同意，其行為無效，由此給善意第三人造成損失的，由行為人依法承擔賠償責任。”依據該條規定，選項C錯誤，選項D正確。"}, {"id": "卷二-33", "subject": "卷二", "type": "單選題", "question": "春秋公司於2015年5月召開股東會議，決議公司解散，分立為春華公司和秋實公司。雙方約定平均分擔春秋公司的債權和債務。春秋公司的債權人夏雨公司於2015年6月向法院起訴，要求分立後的兩家公司對其債務進行清償。對於本案敘述正確的是哪個？", "options": [{"key": "A", "text": "春秋公司是註銷分立，應該進行註銷登記"}, {"key": "B", "text": "如春秋公司股東趙某對公司分立表示異議，只能向他人轉讓股權退出公司"}, {"key": "C", "text": "夏雨公司既可以要求春華公司清償其全部債務，也可以要求秋實公司清償其全部債務"}, {"key": "D", "text": "春秋公司債權人自接到通知書之日起30日內，有權要求公司清償債務或者提供相應的擔保"}], "answer": ["C"], "explanation_full": "【羿文解析】根據《公司法》理論，公司分立分為新設分立(A=B+C)和存續分立(A=A+B)，沒有註銷分立的種類，A項錯誤。 根據《公司法》第74條：“有下列情形之一的，對股東會該項決議投反對票的股東可以請求公司按照合理的價格收購其股權：(一)公司連續五年不向股東分配利潤，而公司該五年連續盈利，並且符合本法規定的分配利潤條件的；(二)公司合併、分立、轉讓主要財產的；(三)公司章程規定的營業期限屆滿或者章程規定的其他解散事由出現，股東會會議通過決議修改章程使公司存續的。自股東會會議決議通過之日起六十日內，股東與公司不能達成股權收購協議的，股東可以自股東會會議決議通過之日起九十日內向人民法院提起訴訟。 ”股東趙某對公司分立決議不認可的，是行使股權回購請求權的法定事由之一，並不一定只有對外轉讓一條出路。注意：公司成立後股東退出公司有四種法定形(在滿足法定條件的前提下)：(1)對內轉讓；(2)對外轉讓；(3)股權回購；(4)公司解散。所以B項錯誤。 《公司法》第176條：“公司分立前的債務由分立後的公司承擔連帶責任。但是，公司在分立前與債權人就債務清償達成的書面協議另有約定的除外。”所以如果公司分立前沒有債務清償協議，分立後只能由分立後的公司對原債權人承擔無限連帶責任，分立後的公司就債務償還所作的協議對外不生效，C項正確。 因為公司分立，原則上由分立後的主體對原債權人承擔連帶責任，對債權人的債權償付沒有任何損害或削弱 。所以公司分立的程序中沒有為債權人提供要求還債或擔保的救濟，D項錯誤。"}, {"id": "卷二-34", "subject": "卷二", "type": "單選題", "question": "某有限合夥企業有李某、夏某與韓某三名合夥人，李某是有限合夥人，合夥協議約定，所有的合夥人不得與合夥企業進行交易。2018年3月，李某擅自將自有的一套設備賣與合夥企業，收益10萬元，下列說法正確的是：", "options": [{"key": "A", "text": "李某將設備賣與合夥企業是有效行為，收益歸合夥企業所有"}, {"key": "B", "text": "李某將設備賣與合夥企業是效力待定行為，夏某與韓某有權追認"}, {"key": "C", "text": "李某將設備賣與合夥企業是可撤銷行為。夏某與韓某有權申請法院或仲裁機構撤銷"}, {"key": "D", "text": "李某將設備賣與合夥企業無效，應當恢復原狀"}], "answer": ["A"], "explanation_full": "【羿文解析】《合夥企業法》第99條：“合夥人違反本法規定或者合夥協議的約定，從事與本合夥企業相競爭的業務或者與本合夥企業進行交易的，該收益歸合夥企業所有；給合夥企業或者其他合夥人造成損失的 ，依法承擔賠償責任。”本案中，李某作為有限合夥人突破合夥協議的約定，做出了自我交易行為，該行為依舊是有效行為，只是所得收益應收歸合夥企業所有，所以只有A項正確。"}, {"id": "卷二-35", "subject": "卷二", "type": "單選題", "question": "甲公司借用乙公司一套機器設備，甲公司被人民法院受理破產清算程序，乙公司向甲公司主張取回權，發現此機器設備已經被轉讓給張三。丙公司對甲公司負擔有100萬元的債務，甲公司被受理破產後，丙公司通過債權轉移受讓了丁公司對甲公司享有的一筆債權100萬元。甲公司股東李四對甲公司尚有150萬元出資未履行到位，但是李四與甲公司約定了20年的出資期限。基於以上事實，下列說法正確的是？（　） 14", "options": [{"key": "A", "text": "乙公司有權向甲公司主張取回其租給甲公司的機器設備"}, {"key": "B", "text": "丙公司受讓債權後，無需對甲公司履行債務清償責任"}, {"key": "C", "text": "甲公司管理人向李四主張履行出資義務，李四可以與甲公司約定的出資期限尚未到期而拒絕"}, {"key": "D", "text": "如果李四對甲公司享有100萬元債權，不得以此債權對應抵銷其對甲公司欠繳的出資"}], "answer": ["D"], "explanation_full": "【羿文解析】《破產法司法解釋二》第30條：“債務人占有的他人財產被違法轉讓給第三人，依據民法典第三百一十一條的規定第三人已善意取得財產所有權，原權利人無法取回該財產的，人民法院應當按照以下規定處理：(一)轉讓行為發生在破產申請受理前的，原權利人因財產損失形成的債權，作為普通破產債權清償 ；(二)轉讓行為發生在破產申請受理後的，因管理人或者相關人員執行職務導致原權利人損害產生的債務 ，作為共益債務清償。”甲公司將借來的機器設備轉讓給張三屬於無權處分行為，根據“善意取得”制度 ，如果該買賣行為完全符合善意取得的要件，則買賣行為有效，善意第三人張三取得設備的所有權，原權利人乙公司無法取回該設備，如果未能完全滿足善意取得的要件，乙公司能取回設備，A項未能包含善意取得完成的情形，錯誤。 《企業破產法》第40條：“債權人在破產申請受理前對債務人負有債務的，可以向管理人主張抵銷。但是 ，有下列情形之一的，不得抵銷：(一)債務人的債務人在破產申請受理後取得他人對債務人的債權的 ：……”為了防止債務人惡意抵銷損害其他債權人利益，禁止用破產受理後受讓的債權抵銷自身的債務，所以丙公司於甲公司被受理破產後受讓了丁公司的債權，也不能抵銷丙公司原本對甲公司負擔的債務，所以丙公司仍需向甲公司全額清償債務，B項錯誤。 《破產法司法解釋二》第20條第1款：“管理人代表債務人提起訴訟。主張出資人向債務人依法繳付未履行的出資或者返還抽逃的出資本息，出資人以認繳出資尚未屆至公司章程規定的繳納期限或者違反出資義務已經超過訴訟時效為由抗辯的，人民法院不予支持。”當公司被受理破產後，股東與公司約定的出資期限尚未到期，但其期限利益不再受保護，即使尚未到約定的期限，按照“加速到期”的要求，股東需足額向公司繳納欠繳的出資，C項錯誤。 《破產法司法解釋二》第46條：“債務人的股東主張以下列債務與債務人對其負有的債務抵銷，債務人管理人提出異議的，人民法院應予支持：(一)債務人股東因欠繳債務人的出資或者抽逃出資對債務人所負的債務 ；(二)債務人股東濫用股東權利或者關聯關係損害公司利益對債務人所負的債務。”股東對公司的出資義務是基於股東身份而需負擔的義務，不能用來抵銷普通的債權，所以李四不得主張抵銷，D項正確。"}, {"id": "卷二-36", "subject": "卷二", "type": "單選題", "question": "豪味有限公司是2012年註冊於北京的餐飲公司，主營產品是速食食品，經過近十年的發展，積累了一定的影響力和實力。為了進一步擴大業務和影響力，豪味公司決定在廣州設立全資子公司豪恰公司，在西安開辦分公司。下列有關說法正確的是：", "options": [{"key": "A", "text": "豪恰公司經批准後，可以在證券交易所自由轉讓股權"}, {"key": "B", "text": "豪恰公司是豪味公司的全資子公司，所以豪恰公司與豪味公司財產共有，責任共擔"}, {"key": "C", "text": "豪味公司西安分公司對外欠債，無力償付，債權人有權申請執行豪味公司的財產"}, {"key": "D", "text": "豪恰公司以其全部的資產對債權人承擔獨立償付責任，體現了人合屬性"}], "answer": ["C"], "explanation_full": "【羿文解析】本案豪恰公司作為全資子公司，為有限責任公司，屬於封閉性公司，股權不能在證券交易所自由轉讓，A項錯誤。 子公司具有獨立法人資格，子公司與母公司是彼此獨立的兩個公司，所以財產和責任都各自享有、分別承擔 ，彼此互不混同，B項錯誤。分公司是附屬於總公司而存在的辦事機構、經營場所等，所以其與總公司是一個整體，分公司的債務，當分公司財產無法償付時，總公司要承擔連帶責任，債權人在執行程序中，允許申請執行總公司財產，反之亦然。如果總公司經營控制的財產仍無法滿足所有債務的清償，債權人可以申請執行其他分公司經營控制的財產。C項正確。 根據《公司法》理論，人合性是指在股東之間存在著某種個人信賴和依附關係，有限公司屬於人合為主兼具資合性公司，股份公司屬於資合性公司，其中上市公司屬於典型資合公司，非上市股份公司屬於資合為主兼具人合性公司，D項應該體現的是資合屬性，表述有誤。 15"}, {"id": "卷二-37", "subject": "卷二", "type": "單選題", "question": "甲用家庭居住用的一套樓房出資設立了某個人獨資企業，但在申請登記時沒有明確以家庭財產出資。企業經營數年後，經營不善無力償債，下列關於該企業設立及責任承擔說法正確的是：", "options": [{"key": "A", "text": "甲設立該個人獨資企業應在申請書中附有企業章程"}, {"key": "B", "text": "甲設立該個人獨資企業應設置固定的經營期限"}, {"key": "C", "text": "甲應以個人財產對企業債務承擔無限責任"}, {"key": "D", "text": "如果合夥企業收益用於家庭生活的，應以家庭財產對企業債務承擔無限責任"}], "answer": ["C"], "explanation_full": "【羿文解析】《個人獨資企業法》第8條：“設立個人獨資企業應當具備下列條件：(一)投資人為一個自然人 ；(二)有合法的企業名稱；(三)有投資人申報的出資；(四)有固定的生產經營場所和必要的生產經營條件 ；(五)有必要的從業人員。”所以，個人獨資企業設立的條件中並不包括企業章程和固定經營期限，A、B項錯誤。 《個人獨資企業法》第18條：“個人獨資企業投資人在申請企業設立登記時明確以其家庭共有財產作為個人出資的，應當依法以家庭共有財產對企業債務承擔無限責任。”所以個人獨資企業中投資人只有在登記時明確以家庭財產出資的，才會以家庭財產承擔責任，本案中並未在登記時明確這一點，所以應以投資人個人財產承擔責任，所以C項正確，D項錯誤。"}, {"id": "卷二-38", "subject": "卷二", "type": "單選題", "question": "王某經過多年的潛心研究，總結出一套應對高考的“數學逆向解題思維”，對於提高應試水平非常有效。 學校指派青年教師肖某對王某的學習方法總結成文以便推廣，肖某遂認真跟班聽課，與王某探討，並根據自己的構思編撰成文《高中數學寶典》署名肖某出版發行，遭到了王某和學校的強烈抗議。下列關於《高中數學寶典》的著作權歸屬，說法正確的是：", "options": [{"key": "A", "text": "“逆向解題思維”是王某獨創，《高中數學寶典》的著作權應當歸王某所有"}, {"key": "B", "text": "《高中數學寶典》是肖某獨創，著作權應當歸肖某所有"}, {"key": "C", "text": "《高中數學寶典》的著作權應當歸王某和肖某共同所有"}, {"key": "D", "text": "《高中數學寶典》的著作權應當歸學校所有"}], "answer": ["B"], "explanation_full": "【羿文解析】《著作權法》第13條：“改編、翻譯、注釋、整理已有作品而產生的作品，其著作權由改編、 翻譯、注釋、整理人享有，但行使著作權時不得侵犯原作品的著作權。”本案中，王某獨創“逆向解題思維 ”，通過課堂教學表達出來.形成口述作品，肖某通過聽課根據自己的構思編撰成文，屬於整理的過程，形成的作品《高中數學寶典》的著作權應該歸肖某所有。 《著作權法》第18條第1款：“自然人為完成法人或者非法人組織工作任務所創作的作品是職務作品，除本條第二款的規定以外，著作權由作者享有，但法人或者非法人組織有權在其業務範圍內優先使用。作品完成兩年內，未經單位同意，作者不得許可第三人以與單位使用的相同方式使用該作品。”肖某雖然為了完成學校交辦的工作任務，完成了《高中數學寶典》，屬於職務作品，但沒有事先約定的情形下，該書的著作權歸肖某所有。綜上，本案中《高中數學寶典》的著作權歸肖某。只有B項正確。"}, {"id": "卷二-39", "subject": "卷二", "type": "單選題", "question": "關於出租權問題，下列哪一選項是錯誤的？", "options": [{"key": "A", "text": "甲購買正版暢銷圖書用於出租的行為不屬於侵犯出租權的行為"}, {"key": "B", "text": "乙購買正版殺毒軟件用於出租的行為侵犯了軟件著作權人的出租權"}, {"key": "C", "text": "丙購買正版唱片用於出租侵犯了唱片製作者的出租權"}, {"key": "D", "text": "丁購買正宗專利產品用於出租屬於侵權行為"}], "answer": ["D"], "explanation_full": "【羿文解析】圖書作品的著作權人不享有出租權，甲購買正版暢銷圖書用於出租的行為不屬於侵犯出租權的行為，A選項正確。 16 主要標的的除外)，乙購買正版殺毒軟件用於出租的行為侵犯了軟件著作權人的出租權，B選項正確。 《著作權法》第44條規定，錄音錄像製作者對其製作的錄音錄像製品，享有許可他人複製、發行、出租、通過信息網絡向公眾傳播並獲得報酬的權利。錄音錄像製品製作者享有出租權，丙購買正版唱片用於出租侵犯了唱片製作者的出租權，C選項正確。 專利產品適用“權利窮竭原則”，丁購買正宗專利產品用於出租不屬於侵權行為，D選項錯誤。"}, {"id": "卷二-40", "subject": "卷二", "type": "單選題", "question": "2015年，甲公司欠繳稅款300萬元被稅務機關責令限期繳納，但期滿仍未繳納。2016年3月，經批准，稅務機關決定對其採取稅收強制執行措施。稅務機關在強制執行中發現：①2016年2月，甲公司以公司債券作質押向某銀行短期貸款，貸款已到期而甲公司拒絕償還；②2016年1月，市場監督管理機關依法對甲公司處以50萬元罰款，其尚未繳納；③2015年10月，甲公司主動放棄對某企業的到期債權。對此，下列哪一說法是正確的 ？（　）", "options": [{"key": "A", "text": "稅務機關對該銀行質押貸款不享有稅收優先權"}, {"key": "B", "text": "稅務機關對市場監督管理機關的罰款享有稅收優先權"}, {"key": "C", "text": "稅務機關有權直接撤銷甲公司放棄到期債權的行為"}, {"key": "D", "text": "稅務機關行使撤銷權後，甲公司尚未履行的納稅義務可以免除"}], "answer": ["B"], "explanation_full": "【羿文解析】《稅收征收管理法》第45條第1款規定：“稅務機關征收稅款，稅收優先於無擔保債權，法律另有規定的除外；納稅人欠繳的稅款發生在納稅人以其財產設定抵押、質押或者納稅人的財產被留置之前的 ，稅收應當先於抵押權、質權、留置權執行。”在本案中，甲公司2015年欠繳稅款發生在其以公司債券設定質押之前，稅務機關對該貸款享有稅收優先權。A選項說法錯誤，不當選。 《稅收征收管理法》第45條第2款規定：“納稅人欠繳稅款，同時又被行政機關決定處以罰款、沒收違法所得的，稅收優先於罰款、沒收違法所得。”B選項說法正確，當選。 《稅收征收管理法》第50條第1款規定：“欠繳稅款的納稅人因怠於行使到期債權，或者放棄到期債權，或者無償轉讓財產，或者以明顯不合理的低價轉讓財產而受讓人知道該情形，對國家稅收造成損害的，稅務機關可以依照合同法第七十三、第七十四條的規定行使代位權、撤銷權。”依《合同法》，稅務機關可以向人民法院申請撤銷甲公司放棄到期債權的行為。C選項說法錯誤，不當選。 《稅收征收管理法》第50條第2款規定：“稅務機關依照前款規定行使代位權、撤銷權的，不免除欠繳稅款的納稅人尚未履行的納稅義務和應承擔的法律責任。”D選項說法錯誤，不當選。"}, {"id": "卷二-41", "subject": "卷二", "type": "單選題", "question": "2018年6月25日，甲在豪優惠超市購買某品牌火腿腸一袋，價款共計12.8元，回家後食用該火腿腸後，導致腸胃炎，上吐下瀉，到醫院救治，花去醫療費90元，後經查發現，甲在豪優惠超市購買的某品牌火腿腸是過期的，因為食用過期的火腿腸造成了甲的腸胃炎。甲遂向豪優惠超市提出索賠請求，但協商未果，訴至法院。根據《食品安全法》的相關規定，下列說法應該被支持的是：", "options": [{"key": "A", "text": "豪優惠超市辯稱，火腿腸系綠元公司廠家生產，甲應該向廠家索賠"}, {"key": "B", "text": "豪優惠超市辯稱，其可以退還過期火腿腸的價款12.8元.但不承擔賠償責任"}, {"key": "C", "text": "甲要求關物超市賠償其醫療費90元，並增加賠償精神損失費"}, {"key": "D", "text": "甲要求豪優惠超市賠償其醫療費90元，並增加賠償1000元"}], "answer": ["D"], "explanation_full": "【羿文解析】《食品安全法》第148條：“消費者因不符合食品安全標準的食品受到損害的，可以向經營者要求賠償損失，也可以向生產者要求賠償損失。接到消費者賠償要求的生產經營者，應當實行首負責任制，先行賠付，不得推諉；屬於生產者責任的，經營者賠償後有權向生產者追償；屬於經營者責任的，生產者賠償後有權向經營者追償。生產不符合食品安全標準的食品或者經營明知是不符合食品安全標準的食品，消費者除要求賠償損失外，還可以向生產者或者經營者要求支付價款十倍或者損失三倍的賠償金：增加賠償的金額不足一千元的，為一千元。但是，食品的標籤、說明書存在不影響食品安全且不會對消費者造成誤導的瑕疵的除外。” 17 ，所以A、B項，作為經營者的豪優惠超市的抗辯不能支持。 對於不符合食品安全標準的食品的生產者和經營者應當對消費者承擔的責任，《食品安全法》明確對消費者的救濟為“退實際損失。增加懲罰性賠償”。而增加的部分可以由消費者自行選擇為“十倍價款”或“三倍損失”且規定了最低懲罰性賠償額為1000元，本案中無論十倍價款還是三倍損失金額均較小，所以甲可要求最低1000元的懲罰性賠償，D項正確。 題目中所述情形，並沒有嚴重身體損害達到精神損害的程度，所以精神損害賠償無法支持，C項錯誤。"}, {"id": "卷二-42", "subject": "卷二", "type": "單選題", "question": "張某跟甲公司簽訂有競業限制和保密義務的協議，乙公司仍高薪聘請張某並獲取其提供的技術資料，下列有關說法正確的是：", "options": [{"key": "A", "text": "乙公司通過正常的招聘流程，錄用技術人員，屬正常的經營行為"}, {"key": "B", "text": "乙公司並沒有脅迫張某披露甲公司的技術資料，並無不正當競爭行為"}, {"key": "C", "text": "乙公司的行為侵犯了甲公司的商業秘密"}, {"key": "D", "text": "乙公司的行為情節嚴重的，監督檢查部門可吊銷其營業執照"}], "answer": ["C"], "explanation_full": "【羿文解析】根據《反不正當競爭法》第9條：“經營者不得實施下列侵犯商業秘密的行為：(一)以盜竊、賄賂、欺詐、脅迫、電子侵入或者其他不正當手段獲取權利人的商業秘密；(二)披露、使用或者允許他人使用以前項手段獲取的權利人的商業秘密；(三)違反保密義務或者違反權利人有關保守商業秘密的要求.披露、使用或者允許他人使用其所掌握的商業秘密；(四)教唆、引誘、幫助他人違反保密義務或者違反權利人有關保守商業秘密的要求，獲取、披露、使用或者允許他人使用權利人的商業秘密。經營者以外的其他自然人、法人和非法人組織實施前款所列違法行為的，視為侵犯商業秘密。第三人明知或者應知商業秘密權利人的員工 、前員工或者其他單位、個人實施本條第一款所列違法行為，仍獲取、披露、使用或者允許他人使用該商業秘密的。視為侵犯商業秘密。本法所稱的商業秘密，是指不為公眾所知悉、具有商業價值並經權利人採取相應保密措施的技術信息、經營信息等商業信息。” 本案中，乙公司與甲公司為同業競爭關係，高薪聘請甲公司的高級工程師.且獲取其提供的技術資料，應認定其對張某非法泄密具有“應知或明知”的過錯，且依舊使用了該信息，屬於侵犯甲公司商業秘密的不正當競爭行為，A、B項錯誤，C項正確。 《反不正當競爭法》第21條：“經營者以及其他自然人、法人和非法人組織違反本法第九條規定侵犯商業秘密的，由監督檢查部門責令停止違法行為，沒收違法所得，處十萬元以上一百萬元以下的罰款：情節嚴重的 ，處五十萬元以上五百萬元以下的罰款。”侵犯商業秘密，並沒有吊銷營業執照的罰則，D項錯誤。"}, {"id": "卷二-43", "subject": "卷二", "type": "單選題", "question": "現代企業是獨立的經濟主體，自主經營自負盈虧，因此用人單位享有自主經營權。企業既可以自主招用人員，在經營困難情況下也可以裁減人員。依照《勞動合同法》的規定，現在某大型國有企業在重整期間需要大規模裁減人員時，應遵循的規定有：（　）", "options": [{"key": "A", "text": "應當召集職工代表大會，對裁員方案進行表決"}, {"key": "B", "text": "應當徵求工會的意見並接受工會的指導和監督"}, {"key": "C", "text": "裁員方案實施前，應當向勞動行政部門報告"}, {"key": "D", "text": "被裁減人員提起勞動仲裁有困難的，工會可以代表職工提起仲裁"}], "answer": ["C"], "explanation_full": "【羿文解析】A、B選項不當選、C項當選。A選項錯在“表決”；B選項錯在“工會指導監督”。用人單位裁員時，只需要“向工會或者全體職工說明情況，聽取意見”。職工無權對裁員方案進行表決。見《勞動合同法 》第41條規定：“有下列情形之一，需要裁減人員20人以上或者裁減不足20人但占企業職工總數10％以上的 。用人單位提前30日向工會或者全體職工說明情況，聽取工會或者職工的意見後.裁減人員方案經向勞動行政部門報告。可以裁減人員……” D選項不當選。工會不是勞動合同一方當事人，所以不能代表職工提起訴訟或者仲裁。勞動者申請仲裁、提起訴訟的，工會依法給予支持和幫助。 18"}, {"id": "卷二-44", "subject": "卷二", "type": "單選題", "question": "根據《環境保護法》，下列哪一表述是錯誤的？", "options": [{"key": "A", "text": "甲地區屬於超過國家重點污染物排放總量控制指標的地區，該省人民政府環境保護主管部門暫停審批其新增重點污染物排放總量的建設項目環境影響評價文件"}, {"key": "B", "text": "乙企業未取得排污許可證，該地人民政府環境保護主管部門允許其排放污染物"}, {"key": "C", "text": "國家對嚴重污染環境的工藝、設備和產品實行淘汰制度"}, {"key": "D", "text": "禁止引進不符合我國環境保護規定的技術、設備、材料和產品"}], "answer": ["B"], "explanation_full": "【羿文解析】A、C、D選項符合《環境保護法》的相關規定；根據《環境保護法》第45條：“國家依照法律規定實行排污許可管理制度。實行排污許可管理的企業事業單位和其他生產經營者應當按照排污許可證的要求排放污染物；未取得排污許可證的，不得排放污染物。”B選項錯誤，乙企業未取得排污許可證不得排放污染物。"}, {"id": "卷二-45", "subject": "卷二", "type": "單選題", "question": "“麥隆號”是在巴拿馬登記並懸掛巴拿馬國旗的貨輪，該貨輪所有人是英國的A公司，光船承租人是中國", "options": [{"key": "B", "text": "公司，雇傭的船長是新加坡甲公民。2011年7月，該貨輪在公海遭遇海難，經韓國C公司救助得以脫險。現船主與貨物所有人就救助費用分攤發生爭議，貨主均為中國公民。此外，B公司拒絕支付甲的工資。2011年10月 ，英國A公司與公民甲均向大連海事法院起訴。分別要求對救助費用的分攤進行理算以及支付工資。大連海事法院針對該兩項請求，應適用何種法律？（　）"}, {"key": "A", "text": "救助費用的理算適用巴拿馬法律，工資支付適用中國法律"}, {"key": "B", "text": "救助費用的理算和工資支付均適用巴拿馬法律"}, {"key": "C", "text": "救助費用的理算和工資支付均適用中國法律"}, {"key": "D", "text": "救助費用的理算適用中國法律，工資支付適用巴拿馬法律"}], "answer": ["C"], "explanation_full": "【羿文解析】救助費用的理算和工資支付均屬於優先權範疇。根據《海商法》第272條的規定，船舶優先權適用受理案件的法院所在地法。據此，本題C正確，當選。"}, {"id": "卷二-46", "subject": "卷二", "type": "單選題", "question": "定居在北京的中國公民王某到印度旅遊期間在某珠寶店購買了一枚藍寶石戒指，回國後經過鑒定發現該戒指實際上是藍色玻璃。王某遂以該珠寶店違反消費者合同為由訴至我國法院，下列說法正確的是", "options": [{"key": "A", "text": "本案應該適用印度法律，因為印度是特徵性履行方經常居所地"}, {"key": "B", "text": "本案中王某和該珠寶店可以協議選擇該合同適用的法律"}, {"key": "C", "text": "如果該珠寶店在中國境內沒有任何經營活動，且王某對法律適用沒有意見，則該案應該適用印度法"}, {"key": "D", "text": "王某有權單向選擇適用中國法"}], "answer": ["C"], "explanation_full": "【羿文解析】選項A錯誤。首先必須注意的是本題考查的是消費者合同的法律適用。根據我國《法律適用法》 第42條的規定，消費者合同，適用消費者經常居所地法律：消費者選擇適用商品、服務提供地法律或者經營者在消費者經常居所地沒有從事相關經營活動的，適用商品、服務提供地法律。顯然，在消費者合同的法律適用規則中並不考慮特徵性履行方經常居所地這一因素。 選項B錯誤。如A項解析所述，雙方當事人並不能對消費者合同所適用的法律進行選擇。其實也好理解，消費者合同的雙方其實地位並不平等，所謂的選擇其實主要是看其中一方的意思。在這樣的情況下禁止選擇更有利於公平保護相關主體的合法權益。 選項C正確。根據A項解析所述，消費者合同的法律適用規則可以分為兩個層次：(1)有消費者單向選擇適用提供地法律的，適用提供地法律；(2)消費者沒有選擇的：①在消費者經常居所地有經營活動的，適用消費者經常居所地法；②在消費者經常居所地沒有經營活動的，適用提供地法。C項中表明一沒有選擇、二在消費者經常居所地沒有經營活動，所以適用商品服務提供地法，即印度法。 選項D錯誤。如A項和C項解析所述，當事人雖然能夠單向選擇.但只能選擇商品服務提供地法，本案中中國法顯然不是商品服務提供地法。所以D項中的說法是錯誤的。 19"}, {"id": "卷二-47", "subject": "卷二", "type": "單選題", "question": "定居在紐約的中國公民甲在旅居日本期間身染重病。甲在日本立下遺囑規定自己的全部財產由自己的大兒子繼承，包括一棟位於北京的房產，一筆存在紐約銀行的現金和一棟位於瑞士的房產。甲病愈後返回紐約並在紐約離世。關於本案的法律適用問題，下列說法錯誤的是：", "options": [{"key": "A", "text": "遺囑的方式適用美國法、中國法或日本法"}, {"key": "B", "text": "遺囑的效力適用美國法、中國法或日本法"}, {"key": "C", "text": "遺產管理則分別適用美國法、中國法和瑞士法"}, {"key": "D", "text": "如該遺產無人繼承，則其歸屬應分別適用美國法、中國法和瑞士法"}], "answer": ["B"], "explanation_full": "【羿文解析】選項A正確。根據我國《法律適用法》第32條的規定，遺囑方式，符合遺囑人立遺囑時或者死亡時經常居所地法律、國籍國法律或者遺囑行為地法律的，遺囑均為成立。本案中立遺囑人立遺囑時和死亡時的經常居所地為紐約，國籍國為中國.遺囑行為地則在日本。所以遺囑的方式適用中國法、日本法或美國法。 所以A項的表述符合法律的規定，不應選。 選項B錯誤。根據我國《法律適用法》第33條的規定，遺囑效力，適用遺囑人立遺囑時或者死亡時經常居所地法律或者國籍國法律。注意，與遺囑的方式相比，遺囑效力的法律適用不考慮遺囑行為地這一要素，所以日本法不應得到適用。所以B項的表述不符合法律的規定，應當選。 選項C正確。根據我國《法律適用法》第34條的規定，遺產管理等事項，適用遺產所在地法律。本案中的遺產分別位於瑞士、紐約和北京，則應分別適用中國法、美國法和瑞士法。所以C項的表述符合法律的規定，不應選。 選項D正確。根據我國《法律適用法》第35條的規定，無人繼承遺產的歸屬，適用被繼承人死亡時遺產所在地法律。本案中被繼承人死亡時的遺產所在地分別在北京、瑞士和紐約。所以應分別適用中國法、美國法和瑞士法。"}, {"id": "卷二-48", "subject": "卷二", "type": "單選題", "question": "中國信德公司以CIF條件向美國友善公司出口一批棉花，由中海公司的“阜豐”號貨輪承運。信德公司為該批貨物投保了中國人民保險公司的平安險，下列哪一選項是錯誤的？", "options": [{"key": "A", "text": "在海上運輸中由於強烈風暴造成貨物的全部損失，保險人應承擔賠償責任"}, {"key": "B", "text": "“阜豐”號船員駕船過失導致該輪擱淺造成部分貨物受損，保險人應承擔賠償責任"}, {"key": "C", "text": "在中途轉船時由於裝卸工疏忽導致數箱貨物跌落大海，保險人應承擔賠償責任"}, {"key": "D", "text": "在中途轉船時數箱貨物被偷，保險人應承擔賠償責任"}], "answer": ["D"], "explanation_full": "【羿文解析】被保險貨物在運輸途中由於惡劣氣候、雷電、海嘯、地震、洪水等自然災害造成的整批貨物的全部損失或推定全損，屬於平安險承保範圍，故A項正確。 由於運輸工具遭受擱淺、觸礁、沉沒、互撞、與流冰或其他物體碰撞以及失火、爆炸等意外事故造成貨物的全部或部分損失，屬於平安險承保範圍，故B項正確。 在裝卸或轉運時由於一件或數件整件貨物落海造成的全部或部分損失，屬於平安險承保範圍，故C項正確。 由於偷竊、短量、雨淋、玷污、滲漏、破碎、受熱受潮、串味等原因所造成的風險，屬於一切險的承保範圍 ，不屬於平安險承保範圍，故D項錯誤。 故本題答案為D。"}, {"id": "卷二-49", "subject": "卷二", "type": "單選題", "question": "2015年9月1日，安伯和艾德琳(美國夫婦)一起來到中國發展。安伯開辦了一家律師事務所，艾德琳在一所中國民辦大學任英語教師。2016年3月，該夫婦因家族事務臨時決定返回美國。安伯遂關閉了律師事務所，艾德琳也辭去英語老師的工作。安伯和艾德琳於2016年4月10日離開中國。下列說法錯誤的是？（　）", "options": [{"key": "A", "text": "安伯在華期間所取得的收入為個人獨立勞務所得"}, {"key": "B", "text": "艾德琳在華期間所取得的收入為非個人獨立勞務所得"}, {"key": "C", "text": "安伯在華期間的收入，中國有權向其徵稅"}, {"key": "D", "text": "艾德琳在華期間的收入，中國無權向其徵稅 20"}], "answer": ["D"], "explanation_full": "【羿文解析】個人非居民勞務所得包括個人獨立勞務所得和非個人獨立勞務所得。(1)個人獨立勞務所得指個人獨立從事獨立性的專業活動所取得的收入。如醫生、律師、會計師、工程師等從事獨立活動取得的所得。 對獨立的個人勞務所得，應僅由居住國行使徵稅權。但如取得獨立勞務所得的個人在來源國設有固定基地或者連續或累計停留超過183天者，則由來源國徵稅。固定基地指個人從事專業性活動的場所，如診所、事務所等。後者指在境內停留的時間，即應以提供勞務的非居民某一會計年度在境內連續或累計停留達183天或在境內設有經營從事獨立活動的固定基地為徵稅的前提條件。(2)非個人獨立勞務所得，即非居民受雇於他人的所得，一般由收入來源國一方從源徵稅。 由此可知，安伯的收入為個人獨立勞務所得，艾德琳的收人為非個人獨立勞務所得。故AB兩項正確。 勞務提供者在來源國設有經常從事獨立勞務活動的固定基地(本題中為律師事務所)，或一個會計年度內連續或累計停留183天以上者，來源國有權徵稅。對於非獨立勞務所得，來源國一般有權徵稅。故C選項正確，D選項錯誤。 本題答案為D。"}, {"id": "卷二-50", "subject": "卷二", "type": "單選題", "question": "近兩年來，美國甲公司向我國出口的一批商品數量激增並對我國相關產業造成了嚴重損害。商務部應申請對該批商品發起了保障措施調查。根據我國《保障措施條例》，下列說法正確的是：", "options": [{"key": "A", "text": "商務部應該及時將立案調查的決定和結果通知世界貿易組織保障措施委員會"}, {"key": "B", "text": "商務部可以到相關國家和地區進行調查，相關國家和地區提出異議的除外"}, {"key": "C", "text": "甲公司可以向商務部作出價格承諾"}, {"key": "D", "text": "保障措施的最終措施為提高關稅一種"}], "answer": ["A"], "explanation_full": "【羿文解析】選項A正確。根據《保障措施條例》第5條的規定，商務部應當將立案調查的決定及調查結果及時通知世界貿易組織保障措施委員會。 選項B錯誤。根據《保障措施條例》的規定，商務部是不能出國進行調查的。因為保障措施針對的是“正常 ”進口的商品，所以不存在出國調查的情形。只有反傾銷和反補貼能夠去國外調查，相關國家和地區提出異議的除外。 選項C錯誤。《保障措施條例》中不存在所謂的承諾。 選項D錯誤。根據《保障措施條例》第19條的規定，保障措施的最終措施有兩種，分別為提高關稅和數量限制 。這在“兩反一保”中是比較特殊的，反傾銷和反補貼中都只有一種最終措施。 多項選擇題"}, {"id": "卷二-51", "subject": "卷二", "type": "多選題", "question": "甲公司向乙公司借款1000萬元，丙公司在借款協議“保證人”下蓋章，但未約定保證方式。丁公司以自有房屋為該債權設定抵押，並辦理了抵押登記。債權到期後，甲公司無力還款，乙公司向丙公司和丁公司主張權利，下列說法正確的有（　）", "options": [{"key": "A", "text": "丙公司應承擔一般保證責任"}, {"key": "B", "text": "丙公司承擔擔保責任後可向甲公司追償"}, {"key": "C", "text": "丁公司承擔擔保責任後可向甲公司追償"}, {"key": "D", "text": "丁公司承擔擔保責任後可向丙公司追償"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】選項A考查保證方式的推定規則。《民法典》第686條規定：“保證的方式包括一般保證和連帶責任保證。當事人在保證合同中對保證方式沒有約定或者約定不明確的，按照一般保證承擔保證責任。”本題中，丙公司為乙公司的債權提供保證，但是未約定具體的保證方式，根據該條，甲公司應當按照一般保證承擔保證責任。因此，選項A正確。 21 ，債權人可以就物的擔保實現債權，也可以請求保證人承擔保證責任。提供擔保的第三人承擔擔保責任後 ，有權向債務人追償。‘'可知，在混合共同擔保中，債權人實現擔保的順序為：（1）有約定從約定，且該約定不用區分人保、物保的類型；（2）無約定或約定不明的情況下，若債務人自己提供擔保物的，則該物保先於人保進行清償；（3）若第三人提供物保，該物保與人保的清償順序由債權人選擇。因此，選項B、C均正確。 選項D考察混合共同擔保中擔保人間的追償權。根據《擔保制度司法解釋》第13條規定，同一債務有兩個以上第三人提供擔保，擔保人之間約定相互追償及分擔份額，承擔了擔保責任的擔保人請求其他擔保人按照約定分擔份額的，人民法院應予支持；擔保人之間約定承擔連帶共同擔保，或者約定相互追償但是未約定分擔份額的，各擔保人按照比例分擔向債務人不能追償的部分。同一債務有兩個以上第三人提供擔保，擔保人之間未對相互追償作出約定且未約定承擔連帶共同擔保，但是各擔保人在同一份合同書上簽字、蓋章或者按指印 ，承擔了擔保責任的擔保人請求其他擔保人按照比例分擔向債務人不能追償部分的，人民法院應予支持。除前兩款規定的情形外，承擔了擔保責任的擔保人請求其他擔保人分擔向債務人不能追償部分的，人民法院不予支持。根據該條，丁公司與丙公司並無約定，也不構成連帶共同擔保的情形，故對於丁公司向丙公司追償的請求不成立。D選項錯誤。"}, {"id": "卷二-52", "subject": "卷二", "type": "多選題", "question": "以下屬於可以行使債權人撤銷權的情形是？（　）", "options": [{"key": "A", "text": "債務人放棄債權擔保"}, {"key": "B", "text": "債務人放棄繼承權"}, {"key": "C", "text": "債務人惡意延長到期債權的履行期限"}, {"key": "D", "text": "債務人為他人提供擔保"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】根據《民法典》第538條規定，債務人以放棄其債權、放棄債權擔保、無償轉讓財產等方式無償處分財產權益，或者惡意延長其到期債權的履行期限，影響債權人的債權實現的，債權人可以請求人民法院撤銷債務人的行為。《民法典》第539條規定，債務人以明顯不合理的低價轉讓財產、以明顯不合理的高價受讓他人財產或者為他人的債務提供擔保，影響債權人的債權實現，債務人的相對人知道或者應當知道該情形的，債權人可以請求人民法院撤銷債務人的行為。因此，選項A、C、D正確。債務人放棄其繼承權不會導致責任財產的減少，並非對債權人的債權實現產生不利影響，故選項B錯誤。"}, {"id": "卷二-53", "subject": "卷二", "type": "多選題", "question": "張三從李四處借款10萬元，由王五提供連帶責任保證。後李四從張三處購買了5萬元的鋼材，約定貨款從借款中扣除，將原合同中的10萬元修改為5萬元，但未通知王五。若張三到期不能償還借款，下列選項錯誤的是？（　）", "options": [{"key": "A", "text": "王五應當承擔10萬元的保證責任"}, {"key": "B", "text": "王五應當承擔5萬元的保證責任"}, {"key": "C", "text": "王五不應當承擔保證責任"}, {"key": "D", "text": "只有在王五同意變更的情形下，王五才應當承擔保證責任"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】根據《民法典》第695條第1款的規定，債權人和債務人未經保證人書面同意，協商變更主債權債務合同內容，減輕債務的，保證人仍對變更後的債務承擔保證責任；加重債務的，保證人對加重的部分不承擔保證責任。本案中，張三與李四對主合同的價款內容做了變動，減輕了債務人的債務，雖未經王五同意 ，王五仍應當對變更後的合同承擔保證責任，即應當承擔5萬元的保證責任。故選項A、C、D錯誤。"}, {"id": "卷二-54", "subject": "卷二", "type": "多選題", "question": "甲向乙訂購10噸大豆貨物，雙方約定合同簽訂後甲應向乙支付10萬元定金。對此，下列說法錯誤的是 ？（　）", "options": [{"key": "A", "text": "若甲未交付定金，則乙有權請求甲支付定金"}, {"key": "B", "text": "若甲實際交付6萬元定金，則應視為定金合同的變更"}, {"key": "C", "text": "若甲實際交付12萬元定金，則應視為定金合同的變更專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 22"}, {"key": "D", "text": "定金的數額超過主合同標的額的20%的，定金合同無效"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】《民法典》第586條規定：當事人可以約定一方向對方給付定金作為債權的擔保。定金合同自實際交付定金時成立。定金的數額由當事人約定，但是不得超過主合同標的額的20%，超過部分不產生定金的效力。實際交付的定金數額多於或者少於約定數額的，視為變更約定的定金數額。定金合同自實際交付定金時生效，若甲未交付定金則定金合同未生效，乙無權請求甲支付定金。故選項A錯誤。實際交付的定金數額多於或者少於約定數額的，視為變更約定的定金數額。故選項B、選項C正確。定金的數額由當事人約定，但是不得超過主合伺標的額的20%，超過部分不產生定金的效力。故選項D錯誤。故本題答案為AD"}, {"id": "卷二-55", "subject": "卷二", "type": "多選題", "question": "甲於2020年2月1日與乙簽訂房屋買賣合同，約定將其所有的一套房屋出售給乙，並約定於2020年3月1日為乙辦理過戶登記。若甲未於約定時間為乙辦理過戶登記，則應向乙支付違約金30萬元。2月15日，甲又將該房屋出賣給丙，並於2月20日為丙辦理了過戶登記。對此，下列說法正確的是？（　）", "options": [{"key": "A", "text": "2月20日以後，乙即有權對甲主張違約責任"}, {"key": "B", "text": "乙有權請求甲實際履行，為自己辦理過戶登記"}, {"key": "C", "text": "2月20日以後，乙即有權解除合同，並有權請求甲支付30萬元違約金"}, {"key": "D", "text": "2月20日以後，乙即有權解除合同，但無權在解除合同後請求甲支付違約金"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】《民法典》第578條規定：當事人一方明確表示或者以自己的行為表明不履行合同義務的，對方可以在履行期限屆滿前請求其承擔違約責任。本案中，甲於2月20日將房屋出售給丙並辦理過戶登記的行為已經構成預期違約，乙有權向甲主張預期違約的違約責任。故選項A正確。 《民法典》第580條規定：當事人一方不履行非金錢債務或者履行非金錢債務不符合約定的，對方可以請求履行，但是有下列情形之一的除外：（1）法律上或者事實上不能履行；（2）債務的標的不適於強制履行或者履行費用過高；（3）債權人在合理期限內未請求履行。本案中，甲已經給■辦理了過戶登記，甲給乙辦理過戶登記的義務成為法律上不能的義務，乙不得對甲主張實際履行的違約責任。故選項B錯誤。 《民法典》第563條第1款第2項規定，在履行期限屆滿前，當事人一方明確表示或者以自己的行為表明不履行主要債務的，當事人可以解除合同。《民法典》第566條第2款規定：合同因違約解除的，解除權人可以請求違約方承擔違約責任，但是當事人另有約定的除外。因此，選項C正確，選項D錯誤。 綜上，本題答案為AC。"}, {"id": "卷二-56", "subject": "卷二", "type": "多選題", "question": "甲是孤兒，一人獨居，一日下地幹活途中發現一隻癘腿小羊，奄奄一息，甚是可憐，甲心中不忍，便將小羊抱至獸醫站醫治，經過醫生和甲的精心照料，不出數月小羊即已恢復，每日跟隨甲左右，親密無間。乙系鄰村村民，一日路過，見小羊額頭的防疫標記，認出其正是多日前運輸途中丟失的那隻，遂找到甲要求歸還 ，念及甲對小羊的悉心照顧，乙提出補償甲支出的所有費用並贈送100元以示謝意。甲嚴詞拒絕，寧死不歸還小羊。下列選項錯誤的是？（　）", "options": [{"key": "A", "text": "甲對小羊是有權占有"}, {"key": "B", "text": "甲可向乙主張費用補償"}, {"key": "C", "text": "甲可向乙主張酬謝"}, {"key": "D", "text": "甲無權拒絕乙的返還請求"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】依《民法典》第312條，遺失物所有權始終屬於遺失人，除非其在能行使遺失物返還請求權之日起兩年內未行使。乙在發現小羊當時就主張了返還請求權，因此不喪失所有權。拾得人有返還的義務，侵占遺失物的，依《民法典》第317條，喪失補償費用和兌現承諾請求權。本題正確答案為ABC。"}, {"id": "卷二-57", "subject": "卷二", "type": "多選題", "question": "小劉（12歲）邀請同學小崔（13歲）、小馮(14歲)在王某新開的飯店聚餐慶祝生日。用餐中，小崔和小馮因瑣事發生爭吵和扭打，飯店服務員既未勸阻也未報警。後小馮去廁所時，小崔趁其不備用汽水瓶猛擊其頭部，造成小馮顱腦嚴重損傷。關於本案民事責任的承擔，下列哪些選項是正確的？ 23", "options": [{"key": "A", "text": "王某應對小馮的人身損害承擔連帶責任"}, {"key": "B", "text": "小崔的監護人應對小馮的人身損害承擔賠償責任"}, {"key": "C", "text": "小劉的監護人應對小馮的人身損害承擔賠償責任"}, {"key": "D", "text": "王某應對小馮的人身損害承擔補充賠償責任"}], "answer": ["B", "D"], "explanation_full": "【羿文解析】根據《民法典》第1188條的規定：“無民事行為能力人、限制民事行為能力人造成他人損害的 ，由監護人承擔侵權責任。監護人盡到監護職責的，可以減輕其侵權責任。有財產的無民事行為能力人、限制民事行為能力人造成他人損害的，從本人財產中支付賠償費用；不足部分，由監護人賠償。”另根據《民法典》第1198條的規定：“賓館、商場、銀行、車站、機場、體育場館、娛樂場所等經營場所、公共場所的經營者、管理者或者群眾性活動的組織者，未盡到安全保障義務，造成他人損害的，應當承擔侵權責任。因第三人的行為造成他人損害的，由第三人承擔侵權責任；經營者、管理者或者組織者未盡到安全保障義務的 ，承擔相應的補充責任。經營者、管理者或者組織者承擔補充責任後，可以向第三人追償。” 本案中，限制民事行為能力人小崔和小馮因瑣事發生爭吵和扭打，後小崔趁其不備用汽水瓶猛擊其頭部，造成小馮顱腦嚴重損傷，作為小崔的監護人應對小馮的人身損害承擔賠償責任。故B選項正確。 從爭吵、扭打到用酒瓶砸傷，均是在酒店發生的侵權事實，具有連續性，故酒店未勸阻也沒有報警，沒有盡到安全保障義務，對侵權結果的發生有過錯，應當承擔補充賠償責任。故D選項正確。"}, {"id": "卷二-58", "subject": "卷二", "type": "多選題", "question": "汪某、苗某、馬某各出資8萬購買了一輛轎車跑滴滴。經營一段時間後，三人發現無利可圖，於是決定將該汽車出租給徐某，月租金1萬元。12月5日，汪某與苗某、馬某產生矛盾，欲轉讓自己對該汽車的份額。關於本案，下列說法不正確的有？（　）", "options": [{"key": "A", "text": "汪某、苗某、馬某對該汽車的共有屬於按份共有"}, {"key": "B", "text": "汪某處分其份額時，在同等條件下苗某、馬某和徐某均享有優先購買權"}, {"key": "C", "text": "汪某處分其份額時，徐某所享有的優先購買權不得對抗苗某和馬某享有的優先購買權"}, {"key": "D", "text": "若汪某在處分其份額時，未通知苗某，苗某有權請求法院宣告其處分該份額時所簽訂的買賣合同無效"}, {"key": "B", "text": "C項。僅“房屋”的承租人才享有優先購買權。徐某系汽車的承租人，不享有優先購買權。故B、C項說法不正確，當選。"}, {"key": "D", "text": "項。汪某對自己享有份額的處分是“自由的”，無論是否履行了通知義務，份額轉讓合同系合法有效的。故"}, {"key": "D", "text": "項說法不正確，當選。 綜上所述，本題的正確答案為BCD。"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】A項。共有人對共有的不動產或動產沒有約定為按份共有或共同共有，或約定不明確的，除共有人具有家庭關係等外，視為按份共有。本題中，由於汽車系汪某、苗某、馬某三人各出資8萬元購買的。依法應認定為按份共有。故A項說法正確，不當選。"}, {"id": "卷二-59", "subject": "卷二", "type": "多選題", "question": "袁某與馬某系夫妻，婚後購買房屋一套，登記在袁某名下。袁某在生前立下遺囑，在其死後，家裡的存款 30萬元全部由馬某繼承，房子由袁某的兒子袁直繼承，藏書2000冊由其侄子袁方繼承。袁某死後，袁方得知袁某將藏書留給自己，便過來幫助袁家操辦喪事。60日後，諸事已定，袁方向袁直請求交付藏書，被袁直拒絕。關於本案，下列說法中正確的有？（　）", "options": [{"key": "A", "text": "袁某的遺囑部分無效"}, {"key": "B", "text": "袁某死後，袁直無需辦理登記即取得房屋的所有權"}, {"key": "C", "text": "袁方有權請求袁直交付2000冊藏書"}, {"key": "D", "text": "袁直有權拒絕向袁方交付2000冊藏書"}, {"key": "C", "text": "D項，受遺贈人應當在知道受遺贈後60日內，作出接受或放棄受遺贈的表示。到期沒有表示的，視為放棄受遺贈。本題中，袁方(受遺贈人)未在知悉遺贈後60日內表示接受遺贈，視為拒絕接受。故C項錯誤，不當選 ；D項正確，當選。 24"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】A、B項，遺囑人以遺囑處分了屬於國家、集體或他人所有的財產，遺囑的這部分，應認定無效 。本題中，房屋屬於袁某與馬某的夫妻共有財產，而非袁某一人所有，其遺囑中有關房屋的內容部分無效。 故A項正確，當選；B項錯誤，不當選。"}, {"id": "卷二-60", "subject": "卷二", "type": "多選題", "question": "苗某（女）和汪某（男）談戀愛，並已經同居，苗某認為汪某不務正業，不適合成為丈夫，並要與汪某分手，汪某揚言非苗某不娶，並且以同居時存有苗某的不雅照（實際沒有），要求苗某與其結婚，後苗某與汪某領證。請問下列選項中錯誤的是？（　）", "options": [{"key": "A", "text": "因受欺詐婚姻可撤銷"}, {"key": "B", "text": "非當事人真實意思表示，婚姻無效"}, {"key": "C", "text": "因受脅迫婚姻可撤銷"}, {"key": "D", "text": "因受脅迫而婚姻無效"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】《民法典》1052條第1款規定：“因脅迫結婚的，受脅迫的一方可以向人民法院請求撤銷婚姻。 ”《民法典》第1053條第1款規定:“一方患有重大疾病的，應當在結婚登記前如實告知另一方；不如實告知的，另一方可以向人民法院請求撤銷婚姻。'‘可知，我國規定了兩種婚姻可撤銷的事由，分別為受脅迫結婚和隱瞞重大疾病。本題中，汪某以存有苗某的不雅照為由，脅迫苗某與其結婚，苗某屬於因脅迫結婚，所以苗某可以請求撤銷婚姻。另外，本題中汪某向苗某宣稱其存有苗某的不雅照，但汪某實際並沒有照片，苗某受到了汪某的欺詐，但是我國《民法典》並未將受欺詐作為撤銷婚姻的條件，所以苗某不能以受欺詐為由主張撤銷婚姻。因此，選項A錯誤，選項C正確。 《民法典》第1051條規定:“有下列情形之一的，婚姻無效：（一）重婚；（二）有禁止結婚的親屬關係 ；（三）未到法定婚齡。\"可知，我國民法規定了三種婚姻無效事由。本題中，不存在以上三種致使婚姻無效的情況，因此苗某和汪某的婚姻是有效的。因此，選項B、D錯誤。 綜上，本題選擇ABD。"}, {"id": "卷二-61", "subject": "卷二", "type": "多選題", "question": "以下哪些情形導致離婚的，無過錯方有權請求損害賠償？（　）", "options": [{"key": "A", "text": "甲男在婚姻存續期間與其認識的女友在外租房，長期以夫妻名義共同居住"}, {"key": "B", "text": "乙女在婚內長期虐待其和丈夫共同領養的養女"}, {"key": "C", "text": "丙男在婚內多次出軌，並與他人生下私生子"}, {"key": "D", "text": "丁女長期對其丈夫實施家庭暴力"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】《民法典》第1091條規定：“有下列情形之一，導致離婚的，無過錯方有權請求損害賠償 ：（一）重婚；（二）與他人同居；（三）實施家庭暴力；（四）虐待、遺棄家庭成員；（五）有其他重大過錯。”因此ABD均正確。 “婚內多次出軌''在原《婚姻法》中不屬於法定的損害賠償情形，但是在《民法典》第1091條規定中，新增了第5項“有其他重大過錯”。實踐中一般認為一方多次出軌等情形構成''重大過錯”，因此丙男婚內多次出軌，並生下私生子的行為構成“重大過錯”，無過錯方有權請求損害賠償。故C項正確。 因此本題答案為ABCD四項。"}, {"id": "卷二-62", "subject": "卷二", "type": "多選題", "question": "A市甲區甲公司與B市乙區乙公司在C市丙區簽訂房屋租賃合同，約定乙公司將位於D市丁區的一套房屋租賃給甲公司，合同中同時約定因為履行本協議發生糾紛由位於D市的仲裁委(D市僅有一個仲裁委)或者協議簽訂地人民法院管轄。後雙方履行合同發生爭議，關於本案說法正確的是（　）", "options": [{"key": "A", "text": "雙方當事人應當向丙區法院起訴解決合同糾紛"}, {"key": "B", "text": "甲公司主張仲裁協議無效，可以向A市中院、B市中院、C市中院、D市中院或者D市的仲裁委申請確認仲裁協議無效"}, {"key": "C", "text": "甲公司向D市的仲裁委申請確認仲裁協議無效，仲裁委作出相應裁決後，乙公司向B市中院申請確認仲裁協議效力，B市中院應當不予受理專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 25"}, {"key": "D", "text": "甲公司向D市仲裁委申請仲裁，仲裁委受理後組織第一次開庭時乙公司未到庭，而是第二天向B市中院申請確認仲裁協議無效，B市中院應當不予受理"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】本案雙方約定發生糾紛由D市仲裁委仲裁也可以由協議簽訂地法院管轄，為或裁或審，仲裁協議無效。既然仲裁協議無效，故本案屬於人民法院主管。本案為合同糾紛，首先本案屬於不動產租賃合同糾紛 ，應當由不動產所在地法院專屬管轄，故本案應當由房屋所在地丁區人民法院專屬管轄，故A選項錯誤。本案雖然雙方有“發生糾紛由合同簽訂地人民法院管轄”這一關於管轄協議，但是該協議違背了專屬管轄的規定 ，無效。 關於仲裁協議效力的確認，當事人對仲裁協議效力產生爭議，可以向法院或者仲裁協議約定的仲裁委申請確認仲裁協議效力，當事人向法院申請確認仲裁協議效力的，由仲裁協議約定的仲裁機構所在地、仲裁協議簽訂地、申請人住所地、被申請人住所地的中級人民法院或者專門人民法院管轄。故本案當事人可以向A市、 B市、C市、D市中院或者D市仲裁委申請確認仲裁協議效力，故本題B選項正確。 仲裁委和法院均有權確認仲裁協議效力，如果一方向仲裁委申請確認仲裁協議效力，一方向法院申請確認仲裁協議效力，原則上由法院作出裁定，即法院確認優先，但如果仲裁委先於法院接受申請。並已經作出決定的，法院不再受理。故本題C選項中D市仲裁委已經先於法院接受申請，並已經作出決定，乙公司再向法院申請確認仲裁協議效力的，法院不予受理，C選項表述正確。 當事人如果對仲裁協議效力有異議的，應當在仲裁庭首次開庭前提出，當事人在仲裁庭首次開庭前沒有對仲裁協議的效力提出異議，而後向法院申請確認仲裁協議無效的，人民法院不予受理。故D選項中乙公司在仲裁庭首次開庭前沒有對仲裁協議效力提出異議，而是在首次開庭後的第二天向法院申請確認仲裁協議效力，法院不予受理。D選項表述正確。 綜上，本題答案為BCD。"}, {"id": "卷二-63", "subject": "卷二", "type": "多選題", "question": "某研究所研製開發一種新型空氣淨化器，並取得了產品製造方法發明專利。後來，該研究所發現甲公司製造的一種空氣淨化器使用了很類似於自己的專利產品製造方法，認為其侵犯了自己的專利產品製造方法，於是向人民法院起訴要求甲公司停止侵權行為，並賠償給自己造成的損失。在訴訟過程中，甲公司否認侵權 ，因此，甲公司應當就下列哪些事實負舉證責任？", "options": [{"key": "A", "text": "自己製造空氣淨化器獲得的利潤"}, {"key": "B", "text": "自己製造空氣淨化器的技術方法"}, {"key": "C", "text": "研究所享有空氣淨化器的專利權"}, {"key": "D", "text": "自己的產品製造方法不同於空氣淨化器的製造方法"}], "answer": ["B", "D"], "explanation_full": "【羿文解析】本題考查舉證責任倒置的問題。根據《專利法》第66條的規定，專利侵權糾紛涉及新產品製造方法的發明專利的，製造同樣產品的單位或者個人應當提供其產品製造方法不同於專利方法的證明。選項B、 D是正確的。"}, {"id": "卷二-64", "subject": "卷二", "type": "多選題", "question": "梁某被判決向曲某支付借款本金和利息320萬元，梁某未及時履行，曲某申請執行，法院查封梁某名下的房產，梁某的父親老梁向執行法院提出異議，稱該房產為老梁所有。關於本案，以下說法中正確的是？", "options": [{"key": "A", "text": "老梁可以直接向法院提起異議之訴"}, {"key": "B", "text": "在法院審查老梁提出的異議期間，執行法院對該房產可以繼續執行"}, {"key": "C", "text": "如果法院經審查裁定老梁的異議成立，則應當終結對該房產的執行"}, {"key": "D", "text": "如果法院經審查裁定駁回了老梁的異議，老梁可以曲某作為被告提起執行異議之訴"}], "answer": ["B", "D"], "explanation_full": "【羿文解析】執行異議之訴的提起須以提出執行異議為前提，因此老梁不能直接向法院提起執行異議之訴 ，A項錯誤。 執行異議審查期間，不停止執行，B項正確。 執行異議成立的，人民法院應當裁定中止執行，而不是終結執行，C項錯誤。 26 本案中老梁的執行異議與原生效裁判無關，原判的標的物為金錢，而執行的標的物為房產，屬於原判的標的物與執行的標的物不同一，因此假使執行異議被駁回，老梁可以作為原告提起案外人執行異議之訴，而在案外人執行異議之訴中，申請執行人曲某應當作為被告，D項正確。 本題答案為B、D。"}, {"id": "卷二-65", "subject": "卷二", "type": "多選題", "question": "孫某訴朱某借款合同糾紛案，朱某得知人民陪審員唐某曾違反規定私下會見孫某的代理律師李某，遂向法院提出迴避申請。關於本案的迴避，下列表述中正確的有？", "options": [{"key": "A", "text": "唐某有權就迴避決定申請復議"}, {"key": "B", "text": "朱某申請迴避時，必須說明理由"}, {"key": "C", "text": "唐某的迴避應由法院院長決定"}, {"key": "D", "text": "朱某應向法院院長提出針對唐某的迴避申請"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】當事人有權對駁回迴避申請的決定申請復議一次，但被決定迴避的主體無權申請復議。本案中唐某作為被迴避的對象，其本身沒有復議申請權，A項錯誤。 當事人申請迴避的應當說明理由，即我國訴訟法上的迴避屬於典型的\"有因迴避”，B項正確。 審判人員的迴避應當由院長決定，人民陪審員屬於審判人員，故其迴避應當由院長決定，C項正確。 法律並未要求當事人必須向院長提出迴避申請，D項錯誤。 本題答案為B、C。"}, {"id": "卷二-66", "subject": "卷二", "type": "多選題", "question": "常年居住在Y省A縣的王某早年喪妻，獨自一人將兩個兒子和一個女兒養大成人。大兒子王甲居住在Y省B縣 ，二兒子王乙居住在Y省C縣，女兒王丙居住在W省D縣。2000年以來，王某的日常生活費用主要來自大兒子王甲每月給的800元生活費。2003年12月，由於物價上漲，王某要求二兒子王乙每月也給一些生活費，但王乙以自己沒有固定的工作、收入不穩定為由拒絕。於是，王某將王乙告到法院，要求王乙每月支付給自己贍養費 500元。關於對本案享有管轄權的法院，下列選項正確的是？", "options": [{"key": "A", "text": "Y省A縣法院"}, {"key": "B", "text": "Y省B縣法院"}, {"key": "C", "text": "Y省C縣法院"}, {"key": "D", "text": "W省D縣法院"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】追索贍養費案件是必要共同訴訟案件，因為負有贍養義務的子女的義務是共同的。在本題中 ，儘管王某只告了王乙，法院也要追加王甲、王丙作為共同被告。因此，本題案件中的被告實為王甲、王乙 、王丙。 《民事訴訟法》第22條的規定，對公民提起的民事訴訟，由被告住所地人民法院管轄；被告住所地與經常居住地不一致的，由經常居住地人民法院管轄。對法人或者其他組織提起的民事訴訟，由被告住所地人民法院管轄。同一訴訟的幾個被告住所地、經常居住地在兩個以上人民法院轄區的，各該人民法院都有管轄權。可知三個被告的住所地法院都有權管轄。 《民事訴訟法解釋》第9條規定：追索贍養費、扶養費、撫養費案件的幾個被告住所地不在同一轄區的，可以由原告住所地人民法院管轄。可見在本題這一特殊案件中，三個被告的住所地不一致，除了被告住所地有管轄權外，原告住所地法院也有權管轄，因此A、B、C、D四項全選。本題答案為A、B、C、D。"}, {"id": "卷二-67", "subject": "卷二", "type": "多選題", "question": "在訴訟中出現下列情形法院處理不正確的是（　）", "options": [{"key": "A", "text": "張三起訴李四合同糾紛，訴訟中張三死亡，張三的唯一繼承人張小三下落不明，法院應當裁定訴訟終結"}, {"key": "B", "text": "張三起訴李四合同糾紛，法庭辯論終結後第三天，張三遇車禍死亡，法院應當根據庭審結果依法作出判決"}, {"key": "C", "text": "張三起訴李四離婚，訴訟中李四同意離婚。法庭辯論結束後第三天，張三遇車禍死亡。法院應當根據庭審結果以及當事人的認諾，依法判決解除婚姻關係"}, {"key": "D", "text": "張三向法院起訴要求與李四離婚，一審法院判決准予離婚並對財產分割、子女撫養問題作出判決，李四對專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 27 其中的財產分割問題不服提起上訴。在二審中，李四遇車禍死亡，法院裁定訴訟中止"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】A選項中值得注意的是訴訟中一方當事人死亡，沒有繼承人或者繼承人放棄權利的才能訴訟終結 ，而選項中張三死亡，唯一繼承人張小三“下落不明”並不意味著沒有繼承人或者繼承人放棄權利。不能訴訟終結。正是因為唯一繼承人張小三“下落不明”，才需要等待張小三表明是否繼續訴訟，故屬於“一方當事人死亡需要等待繼承人表明是否繼續訴訟”的情形，應當裁定訴訟中止。A選項表述錯誤。 B選項值得注意的是法庭辯論結束後第三天，此時仍然處於訴訟中。屬於“訴訟中一方當事人死亡，需要等待繼承人表明是否繼續訴訟”的情形，故應當裁定訴訟中止，不能根據庭審結果作出判決。故B選項錯誤。 C選項同樣的道理，法庭辯論結束後第三天，此時仍然處於訴訟中。本案屬於離婚訴訟中一方當事人死亡，應當裁定訴訟終結。故C選項錯誤。 D選項值得注意的是不論是解除婚姻關係，還是財產分割、子女撫養，均屬於離婚訴訟；不論是一審還是二審 ，均屬於訴訟中。故本案屬於離婚訴訟中一方當事人死亡，應當裁定訴訟終結。故D選項表述錯誤。"}, {"id": "卷二-68", "subject": "卷二", "type": "多選題", "question": "張三、李四在履行合同中發生糾紛，張三起訴李四要求李四履行合同，並承擔違約金。一審法院判決駁回了原告張三的訴訟請求，張三不服一審判決提起上訴。二審法院審理時，張三、李四達成和解協議，張三申請撤回起訴，關於本案表述正確的是（　）", "options": [{"key": "A", "text": "二審法院認為一審判決認定基本事實不清，可以撤銷原判，發回重審"}, {"key": "B", "text": "二審法院認為和解協議內容與一審判決中認定的基本事實不一致，二審法院應當不予准許撤訴，繼續審理並且作出判決"}, {"key": "C", "text": "二審法院裁定准許撤回起訴時應當一併裁定撤銷原一審判決"}, {"key": "D", "text": "張三撤回起訴後再次就本案合同糾紛提起訴訟的，法院不予受理"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】根據《民訴解釋》第336條的規定，二審中原審原告申請撤回起訴，經其他當事人同意，且不損害國家、社會、第三人合法權益的，法院可以准許。二審法院裁定准許撤回起訴時應當一併裁定撤銷原一審判決。 既然原告撤回起訴，法院不再對案件行使審判權，二審法院應當一併裁定撤銷原一審判決，既然一審判決會被撤銷，那自然就不用管它認定事實是否清楚、和解協議內容與一審判決認定事實是否一致了。二審法院裁定准許撤回起訴的，應當一併裁定撤銷原一審判決，且當事人不能再次起訴，C、D選項正確。"}, {"id": "卷二-69", "subject": "卷二", "type": "多選題", "question": "甲、乙、丙、丁4人擬共同出資500萬元設立能力有限公司。公司成立後，在其設置的股東名冊中記載了甲乙丙3人的姓名與出資額等事項，但股東名冊遺漏了丁，在辦理公司登記時又遺漏了丙，使得公司登記的文件中股東只有甲乙2人。下列哪些說法是正確的？", "options": [{"key": "A", "text": "丁不能取得股東資格"}, {"key": "B", "text": "丙不能取得股東資格"}, {"key": "C", "text": "丙取得股東資格，但不能對抗第三人"}, {"key": "D", "text": "丙不能取得股東資格，但可以參與當年的分紅"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】《公司法》第32條規定：“有限責任公司應當備置股東名冊，記載下列事項：(一)股東的姓名或者名稱及住所；(二)股東的出資額；(三)出資證明書編號。記載於股東名冊的股東，可以依股東名冊主張行使股東權利。公司應當將股東的姓名或者名稱及其出資額向公司登記機關登記；登記事項發生變更的，應當辦理變更登記。未經登記或者變更登記的，不得對抗第三人。”A、C選項正確；B、D選項錯誤。"}, {"id": "卷二-70", "subject": "卷二", "type": "多選題", "question": "全興麵粉加工廠(普通合夥企業)的合夥人是甲公司、乙公司、丙公司、丁公司。在合夥協議中，規定了合夥事務的執行規則。以下哪些規則符合法律規定？", "options": [{"key": "A", "text": "甲公司可以委派代表執行合夥事務"}, {"key": "B", "text": "不執行合夥事務的合夥人有權監督執行事務合夥人執行合夥事務的情況專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 28"}, {"key": "C", "text": "不執行合夥事務的合夥人無權查閱合夥企業的財務會計賬簿"}, {"key": "D", "text": "受委託執行合夥事務的合夥人不按照合夥協議或者全體合夥人的決定執行事務的，其他合夥人可以決定撤銷該委託"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】《合夥企業法》第26條規定：“合夥人對執行合夥事務享有同等的權利。按照合夥協議的約定或者經全體合夥人決定，可以委託一個或者數個合夥人對外代表合夥企業，執行合夥事務。作為合夥人的法人、其他組織執行合夥事務的，由其委派的代表執行。”普通合夥人享有同等的合夥事務執行權，即使法人擔任的普通合夥人也享受此權利，可以通過委派代表來實現，A項正確。 《合夥企業法》第27條規定：“依照本法二十六條第二款規定委託一個或者數個合夥人執行合夥事務的，其他合夥人不再執行合夥事務。不執行合夥事務的合夥人有權監督執行事務合夥人執行合夥事務的情況。”第 29條規定：“合夥人分別執行合夥事務的，執行事務合夥人可以對其他合夥人執行的事務提出異議。提出異議時，應當暫停該項事務的執行。如果發生爭議，依照本法第三十條規定作出決定。受委託執行合夥事務的合夥人不按照合夥協議或者全體合夥人的決定執行事務的，其他合夥人可以決定撤銷該委託。”合夥協議可以約定合夥事務交由部分合夥人執行，但是執行人代表合夥企業實施的所有行為需要合夥企業承擔責任，非執行人也需承擔無限連帶責任，為了保障自身權益，防止執行人“胡作非為”，非執行人對執行人的行為有監督權，通過監督發現執行人未盡到對合夥企業的忠誠、勤勉義務，未按照合夥協議約定或全體合夥人的決定執行事務，而是偏離了既有的軌道，非執行人有權撤銷委託，B、D項正確。 《合夥企業法》第28條規定：“由一個或者數個合夥人執行合夥事務的，執行事務合夥人應當定期向其他合夥人報告事務執行情況以及合夥企業的經營和財務狀況，其執行合夥事務所產生的收益歸合夥企業，所產生的費用和虧損由合夥企業承擔。合夥人為了解合夥企業的經營狀況和財務狀況，有權查閱合夥企業會計賬簿等財務資料。”知情權是合夥人的身份權利，無論是否執行事務均享有此權利，C項錯誤。"}, {"id": "卷二-71", "subject": "卷二", "type": "多選題", "question": "2016年5月，甲、乙、丙三人擬共同投資200萬元建立大華商貿有限公司，投資協議約定：甲、乙各出資 80萬元，甲以房屋出資，乙以專利出資，丙以現金40萬元出資。以下關於出資的說法哪些是符合法律規定的 ？", "options": [{"key": "A", "text": "三股東以實繳的出資額為限對公司承擔責任"}, {"key": "B", "text": "甲只需要將房屋交由公司使用不必轉移所有權"}, {"key": "C", "text": "股東應當按期足額繳納公司章程中規定的各自所認繳的出資額"}, {"key": "D", "text": "丙的出資現金可以分期分批轉入公司賬戶"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】《公司法》第3條規定：“公司是企業法人，有獨立的法人財產，享有法人財產權。公司以其全部財產對公司的債務承擔責任。有限責任公司的股東以其認繳的出資額為限對公司承擔責任：股份有限公司的股東以其認購的股份為限對公司承擔責任。”有限責任的範圍應該是股東認繳的出資額並非實繳的出資 ，A項錯誤。 《公司法》第28條規定：“股東應當按期足額繳納公司章程中規定的各自所認繳的出資額。股東以貨幣出資的，應當將貨幣出資足額存人有限責任公司在銀行開設的賬戶；以非貨幣財產出資的，應當依法辦理其財產權的轉手續。股東不按照前款規定繳納出資的，除應當向公司足額繳納外。還應當向已按期足額繳納出資的股東承擔違約責任。”公司作為獨立法人，享有法人財產權，所以股東出資一般應轉移“所有權”，但基於我國經濟體制的特徵，土地只能歸國家或集體所有，所以如果股東用土地出資，可用土地使用權。甲既然用房產出資，應該轉移所有權給公司，B項錯誤。 現行《公司法》實行認繳資本制，但股東仍需按照章程約定的出資期限、形式、金額等繳足認繳的出資，出資期限和節奏均可由公司章程約定，C、D項正確。"}, {"id": "卷二-72", "subject": "卷二", "type": "多選題", "question": "甲公司因資不抵債於2019年2月15日被人民法院受理破產，法院指定了破產管理人。乙公司以其對甲公司的合同貨款向管理人申報債權80萬，管理人認為乙公司的供貨不完全符合合同要求，故只認可50萬，並記載入債權表。乙公司對債權表記載的債權提出異議，管理人沒有理會。甲、乙公司的供貨合同中約定有仲裁條專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 29 款。下列有關乙公司的債權異議的相關說法正確的是：", "options": [{"key": "A", "text": "債權已經被載入債權表中，乙公司不得再提異議"}, {"key": "B", "text": "乙公司應向選定的仲裁機構申請確認債權債務關係"}, {"key": "C", "text": "如果甲、乙公司沒有約定仲裁條款，乙公司應向受理破產的法院提起訴訟確認債權"}, {"key": "D", "text": "如果乙公司提起確認債權的訴訟，應當以甲公司為被告"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】根據《破產法司法解釋三》第8條的規定：“債務人、債權人對債權表記載的債權有異議的，應當說明理由和法律依據。經管理人解釋或調整後，異議人仍然不服的，或者管理人不予解釋或調整的，異議人應當在債權人會議核查結束後十五日內向人民法院提起債權確認的訴訟。當事人之間在破產申請受理前訂立有仲裁條款或仲裁協議的，應當向選定的仲裁機構申請確認債權債務關係。”債權表的記載不能一錘定音 ，乙公司有異議的，是可以向管理人說明理由和法律依據的。所以A項錯誤。 針對乙公司的異議，管理人應當作出回應，要麼解釋要麼調整。本案中管理人未作回應，因此乙公司可以啟動債權確認的司法程序。有約定仲裁的，走仲裁程序，未約定仲裁的走訴訟程序，訴訟程序一般應由受理破產的法院管轄。根據本案案情，甲、乙公司有約定仲裁條款，故乙公司有權向選定的仲裁機構申請仲裁，B項正確。如果沒有約定仲裁，走訴訟程序，應由受理破產的法院來管轄，C項正確。 《破產法司法解釋三》第9條的規定：“債務人對債權表記載的債權有異議向人民法院提起訴訟的，應將被異議債權人列為被告。債權人對債權表記載的他人債權有異議的，應將被異議債權人列為被告；債權人對債權表記載的本人債權有異議的，應將債務人列為被告。對同一筆債權存在多個異議人，其他異議人申請參加訴訟的，應當列為共同原告。”既然是乙公司對債權表記載的自己的債權有異議而提起訴訟，應當由乙公司為原告，甲公司為被告，D項正確。"}, {"id": "卷二-73", "subject": "卷二", "type": "多選題", "question": "張三於2018年1月甲公司股東會選舉為甲公司第七屆董事會成員，任期三年。2019年2月，甲公司股東會經代表80％表決權的股東同意作出決議解除了張三的董事職務。下列有關說法正確的是？（　）", "options": [{"key": "A", "text": "2019年2月張三的任期尚未到期，張三可向公司主張解除不生效"}, {"key": "B", "text": "甲公司經股東會有效決議，有權解除張三的董事職務"}, {"key": "C", "text": "如果張三未發生違反忠誠、勤勉義務等情形，公司不得單方解除其董事職務"}, {"key": "D", "text": "張三因被公司解除董事職務，可向公司主張補償"}], "answer": ["B", "D"], "explanation_full": "【羿文解析】A、B、C項，公司與董事之間實際上為委託關係，依股東會的選任決議和董事同意任職而成立《 民法典·合同編》的委託合同。既然為委託合同，則合同雙方均有任意解除權，即公司可以隨時解除董事職務，無論任期是否屆滿，董事也可以隨時辭職。所以A、C項錯誤，B項正確。 D項，無因解除不能損害董事的合法權益。為平衡雙方利益，公司解除董事職務應合理補償，以保護董事的合法權益，並防止公司無故任意解除董事職務。所以張三被解除董事職務有權向公司主張補償。如果引發爭議的，法院有權綜合考慮解除的原因、剩餘任期、董事薪酬等因素，確定是否補償以及補償的合理數額。D項正確。 綜上，本題答案為BD。"}, {"id": "卷二-74", "subject": "卷二", "type": "多選題", "question": "關於公司解散清算制度，下列說法錯誤的有：", "options": [{"key": "A", "text": "法院判決解散公司後，公司債權人即可向法院申請對該公司進行強制清算"}, {"key": "B", "text": "公司清算時，債權人在債權申報期限屆滿後公司清算程序終結前申報債權的，清算組不予登記該債權"}, {"key": "C", "text": "公司清算過程中，公司債權人向公司提起民事訴訟的，應以清算組名義應訴，清算組負責人為訴訟代表人"}, {"key": "D", "text": "公司實際控制人在法定期限內未成立清算組清算，導致公司資產流失的，債權人可以在流失的資產範圍內要求實際控制人承擔賠償責任"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】依據《公司法解釋(二)》第7條規定，公司被判決解散後，應首先由公司自行清算。公司在法定期限內不清算或有其他情形的，債權人可以請求法院強制清算。故A項錯誤。 30 依據《公司法解釋(二)》第13條第1款規定，債權人在規定的期限內未申報債權，在公司清算程序終結前補充申報的。清算組應予登記。故B項錯誤。 依據《公司法解釋(二)》第10條規定，公司依法清算結束並辦理註銷登記前，有關公司的民事訴訟，應當以公司的名義進行。公司成立清算組的，由清算組負責人代表公司參加訴訟：尚未成立清算組的，由原法定代表人代表公司參加訴訟，故C項錯誤。 依據《公司法解釋(二)》第18條規定，有限責任公司的股東、股份有限公司的董事和控股股東未在法定期限內成立清算組開始清算，導致公司財產貶值、流失、毀損或者滅失，債權人主張其在造成損失範圍內對公司債務承擔賠償責任的，人民法院應依法予以支持。有限責任公司的股東、股份有限公司的董事和控股股東因怠於履行義務，導致公司主要財產、賬冊、重要文件等滅失，無法進行清算，債權人主張其對公司債務承擔連帶清償責任的，人民法院應依法予以支持。上述情形系實際控制人原因造成，債權人主張實際控制人對公司債務承擔相應民事責任的，人民法院應依法予以支持。D項正確。"}, {"id": "卷二-75", "subject": "卷二", "type": "多選題", "question": "王某將自己居住的房屋向某保險公司投保家庭財產保險。保險合同有效期內，該房屋因鄰居家的小孩玩火而被部分毀損，損失10萬元。下列哪些選項是錯誤的？（　）", "options": [{"key": "A", "text": "王某應當先向鄰居索賠。在鄰居無力賠償的前提下才能向保險公司索賠"}, {"key": "B", "text": "王某可以放棄對鄰居的賠償請求權，單獨向保險公司索賠"}, {"key": "C", "text": "若王某已從鄰居處得到10萬元的賠償，其仍可向保險公司索賠"}, {"key": "D", "text": "若王某從保險公司得到的賠償不足10萬元，其仍可向鄰居索賠"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】《保險法》第60條規定，王某可以選擇向保險公司索賠或者向鄰居行使賠償請求權，並且該選擇都不影響王某就未獲償部分向另一方求償，故A選項明顯錯誤。 《保險法》第61條規定：保險事故發生後，保險人未賠償保險金之前，被保險人放棄對第三者請求賠償的權利的，保險人不承擔賠償保險金的責任。保險人向被保險人賠償保險金後。被保險人未經保險人同意放棄對第三者請求賠償的權利的，該行為無效。被保險人故意或者因重大過失致使保險人不能行使代位請求賠償的權利的，保險人可以扣減或者要求返還相應的保險金。由此可知，B選項錯誤。 《保險法》第60條規定：因第三者對保險標的損害而造成保險事故的，保險人自向被保險人賠償保險金之日起，在賠償金額範圍內代位行使被保險人對第三者請求賠償的權利。前款規定的保險事故發生後，被保險人已經從第三者取得損害賠償的，保險人賠償保險金時，可以相應扣減被保險人從第三者已取得的賠償金額。 保險人依照本條第1款規定行使代位請求賠償的權利，不影響被保險人就未取得賠償的部分向第三者請求賠償的權利。由此可知，C選項錯誤。 《保險法》第60條第3款規定，可知，若王某從保險公司得到的賠償不足10萬元，仍可向鄰居索賠，D選項正確。 本題答案為ABC。"}, {"id": "卷二-76", "subject": "卷二", "type": "多選題", "question": "“寶高”為中國馳名商標，該公司產品為塑料玩具。則下列判斷和處理正確的是：（　）", "options": [{"key": "A", "text": "金童玩具公司6年前搶先以欺詐手段從某巴黎公約成員國註冊取得“寶高”商標並使用，金童公司沒有構成商標侵權"}, {"key": "B", "text": "某遊樂中心使用假冒“寶高”註冊商標專用權的玩具，該遊樂中心沒有侵犯“寶高”的商標權"}, {"key": "C", "text": "東風玩具公司與某百貨商場簽訂協議，由後者經銷前者生產的假冒“寶高”塑料玩具，二者均構成侵權"}, {"key": "D", "text": "“寶高”商標被法院認定為馳名商標後，寶高公司可在玩具包裝上使用“馳名商標”字樣"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】A選項錯誤，寶高公司為“在先權利人”，它可以請求商標評審委員會（現為國家知識產權局商標局）宣告該註冊商標無效。對惡意註冊的，馳名商標所有人不受5年的時間限制(《商標法》第45條)。故金童公司構成侵權。 B選項正確，使用侵權商品，尚不構成侵犯商標權。 31 標專用權。 D選項錯誤，考查馳名商標的使用。《商標法》第14條第5款規定：“生產、經營者不得將‘馳名商標’字樣用於商品、商品包裝或者容器上，或者用於廣告宣傳、展覽以及其他商業活動中。”"}, {"id": "卷二-77", "subject": "卷二", "type": "多選題", "question": "甲是歌曲《不想打工》的演唱者，關於甲的權利以及被許可人的義務，下列表述正確的是？", "options": [{"key": "A", "text": "甲有權表明表演者身份"}, {"key": "B", "text": "甲有權保護表演形象不受歪曲"}, {"key": "C", "text": "甲有權許可他人從現場直播和公開傳送其現場表演，並獲得報酬"}, {"key": "D", "text": "甲許可他人從現場直播，被許可人無須取得著作權人許可，但應支付報酬"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】根據《著作權法》第39條第1款：“表演者對其表演享有下列權利：(一)表明表演者身份；(二 )保護表演形象不受歪曲；(三)許可他人從現場直播和公開傳送其現場表演，並獲得報酬；(四)許可他人錄音錄像，並獲得報酬；(五)許可他人複製、發行、出租錄有其表演的錄音錄像製品，並獲得報酬；(六)許可他人通過信息網絡向公眾傳播其表演，並獲得報酬。”A、B、C選項正確。 根據《著作權法》第39條第2款“被許可人以前款第(三)項至第(六)項規定的方式使用作品，還應當取得著作權人許可，並支付報酬。”D選項錯誤。 綜上，本題選ABC。"}, {"id": "卷二-78", "subject": "卷二", "type": "多選題", "question": "實淵有限責任公司(以下簡稱實淵公司)2017年度向某地區希望小學捐款600萬元，關於該公司可以享受的稅收優惠下列說法錯誤的是：", "options": [{"key": "A", "text": "實淵公司的捐款，可以在計算應納稅所得額時完全扣除"}, {"key": "B", "text": "實淵公司的捐款可以享受20％的優惠稅率"}, {"key": "C", "text": "實淵公司的捐款屬於不徵稅收入"}, {"key": "D", "text": "實淵公司的捐款超過年度利潤總額12％的部分，准予結轉以後3年內在計算應納稅所得額時扣除"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】根據《企業所得稅法》第9條：“企業發生的公益性捐贈支出，在年度利潤總額12％以內的部分 ，准予在計算應納稅所得額時扣除；超過年度利潤總額12％的部分，准予結轉以後三年內在計算應納稅所得額時扣除。”所以公益性捐贈雖然享受稅前扣除的優惠，但有比例限制，並非完全扣除，A項錯誤。捐款沒有優惠稅率的保障，B項錯誤。捐款屬於支出並非收入，更不是不徵稅收入，C項錯誤。D項符合了稅前扣除的要求，正確。 綜上，本題選ABC。"}, {"id": "卷二-79", "subject": "卷二", "type": "多選題", "question": "依據《反壟斷法》的規定，下列有關推定和認定市場支配地位的選項哪些是正確的？（　）", "options": [{"key": "A", "text": "甲企業在相關市場占有的份額高達47%，因此具有市場支配地位"}, {"key": "B", "text": "甲、乙兩家企業在相關市場所占份額合計達到69%，但只要甲能夠舉證其中自己所占的份額其實只有 20%，甲就不具有市場支配地位"}, {"key": "C", "text": "甲、乙、丙三家企業在相關市場所占份額合計達到75%，可以推定甲、乙、丙具有市場支配地位"}, {"key": "D", "text": "即使經營者被推定具有市場支配地位，若有證據證明自己不具有市場支配地位，則不應當被最終認定為具有市場支配地位"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】根據《反壟斷法》第19條規定，A、B選項說法錯誤不當選。A選項中甲企業市場所占份額低於 1/2，不具有市場支配地位，B選項中兩個經營者其中一個經營者所占市場份額低於1/10才被認定其不具備市場支配地位。 C選項中，三家企業市場所占份額達到了3/4，因此具有市場支配地位，因此C選項說法正確。 D選項中，即使經營者被推定具有市場支配地位的，只要有證據證明不具有市場支配地位的，不應當最終認定其具有市場支配地位，因此D選項說法正確。 32"}, {"id": "卷二-80", "subject": "卷二", "type": "多選題", "question": "甲於2018年10月15日從某商場購買騰達牌蘇打水1瓶，花費7.9元，該蘇打水中文標注“生產日期見瓶蓋 ，保質期9個月”，而蘇打水瓶蓋上標注的日期為2018年1月5日。對此，下列哪些說法是正確的？（　）", "options": [{"key": "A", "text": "該蘇打水屬於不符合食品安全標準的食品"}, {"key": "B", "text": "該蘇打水本身水質沒有問題，只是生產日期標識錯誤，屬於存在瑕疵的食品"}, {"key": "C", "text": "甲有權要求商場退還貨款"}, {"key": "D", "text": "甲有權要求商場支付懲罰性賠償金1000元"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】根據日常的生活經驗，食品超過保質期，存在安全的隱患，不符合食品安全的要求。因此屬於不符合食品安全標準的食品。A選項說法正確，當選；B選項說法錯誤，不當選。 《食品安全法》第148條第2款規定：“生產不符合食品安全標準的食品或者經營明知是不符合食品安全標準的食品，消費者除要求賠償損失外，還可以向生產者或者經營者要求支付價款十倍或者損失三倍的賠償金 ；增加賠償的金額不足一千元的，為一千元。但是，食品的標籤、說明書存在不影響食品安全且不會對消費者造成誤導的瑕疵的除外。”故C、D選項說法正確，當選。"}, {"id": "卷二-81", "subject": "卷二", "type": "多選題", "question": "根據《土地管理法》，下列選項正確的是？", "options": [{"key": "A", "text": "國家機關用地經縣級以上人民政府依法批准，可以以劃拔方式取得"}, {"key": "B", "text": "建設單位使用國有土地的，應當按照土地使用權出讓等有償使用合同的約定或者土地使用權劃拔批准文件的規定使用土地"}, {"key": "C", "text": "在城市規劃區內改變土地用途的，在報批前，應當先經有關城市規劃行政主管部門同意"}, {"key": "D", "text": "臨時使用土地的使用者應當按照臨時使用
