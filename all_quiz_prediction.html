key": "B", "text": "根據學說①②，b成立犯罪中止"}, {"key": "C", "text": "根據學說①②③，c成立犯罪中止"}, {"key": "D", "text": "根據學說③，d成立犯罪中止"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】根據學說①，只有基於同情、悔悟等對自己行為持否定評價的規範意識、感情或者動機而放棄犯罪的，才是自動中止，此學說將中止的自動性與倫理性相混淆，過於縮小了犯罪中止的成立範圍，只有案例a可以成立犯罪中止，案例bed均成立犯罪未遂。 根據學說②，能達目的而不欲時，為犯罪中止；欲達目的而不能時，為犯罪未遂。這一學說面臨的問題是如何判斷“能”與“不能”，存在客觀上“能”而倫理上“不能”的情形如何判斷呢？此時採取的判斷方法是 ：客觀上“能”，而倫理上“不能”的案件不能肯定中止的自動性，應認定為犯罪未遂，案例be中均是客觀上“能”，倫理上“不能”，行為人放棄犯罪的，不能肯定中止的自動性。案例ad可以肯定中止的自動性 ，成立犯罪中止。 根據學說③，根據社會的一般觀念對沒有既遂的原因（引起行為人放棄犯罪或防止結果發生的現象）進行客觀評價，如果當時的情況對一般人不會產生強制性影響，即一般人處於該情況下不會放棄犯罪，而行為人放棄的，便是犯罪中止；如果當時的情況能對一般人產生強制性影響，即一般人在當時的情況下也會放棄犯罪時，行為人放棄的，便是犯罪未遂。案例ad成立犯罪中止，案例be成立犯罪未遂。 綜上，本題正確答案為AD選項。"}, {"id": "卷一-94", "subject": "卷一", "type": "單選題", "question": "關於我國的行政區劃，下列說法正確的是（　）", "options": [{"key": "A", "text": "全國人大有權決定省、自治區、直轄市以及特區的設立、撤銷、更名"}, {"key": "B", "text": "全國人大決定重慶直轄市的區域劃分"}, {"key": "C", "text": "國務院決定自治州的設立"}, {"key": "D", "text": "經國務院授權後，省政府有權決定鄉級行政區域的設立、撤銷與更名"}], "answer": ["C"], "explanation_full": "【羿文解析】①全國人大決定省、自治區、直轄市的設立、撤銷與更名，但全國人大隻能決定特別行政區的設立及其制度。故A選項錯誤。 39 ，區域變更，並不需要國務院的授權，其職權來自憲法的明文規定。故D選項錯誤。 綜上，本題正確答案為C選項。"}, {"id": "卷一-95", "subject": "卷一", "type": "單選題", "question": "2011年7月5日，某公司高經理與員工在飯店喝酒聚餐後表示：別開車了，“酒駕”已入刑，咱把車推回去 。隨後，高經理在車內掌控方向盤，其他人推車緩行。記者從交警部門了解到，如機動車未發動，只操縱方向盤，由人力或其他車輛牽引，不屬於酒後駕車。但交警部門指出，路上推車既會造成後方車輛行駛障礙 ，也會構成對推車人的安全威脅，建議酒後將車置於安全地點，或找人代駕。鑒於我國對“酒後代駕”缺乏明確規定，高經理起草了一份《酒後代駕服務規則》，包括總則、代駕人、被代駕人、權利與義務、代為駕駛服務合同、法律責任等共六章二十一條郵寄給國家立法機關。關於高經理和公司員工拒絕“酒駕”所體現的法的作用，下列說法正確的是（　）", "options": [{"key": "A", "text": "法的指引作用"}, {"key": "B", "text": "法的評價作用"}, {"key": "C", "text": "法的預測作用"}, {"key": "D", "text": "法的強製作用"}], "answer": ["A"], "explanation_full": "【羿文解析】高經理知悉了酒駕入刑的法律規定，決定不再酒駕，準備將車推回去。這裡體現了法的指引作用。故A選項正確。"}, {"id": "卷一-96", "subject": "卷一", "type": "多選題", "question": "2018年5月2日區公安分局以張某擾亂社會公共秩序為由將其刑事拘留，5月10日，區檢察院批准逮捕。6月 20日區法院一審判處張某有期徒刑4年。張某不服，提起上訴，7月2日市中級人民法院認為原審事實不清、證據不足，撤銷原判，發回重審，7月10日，檢察院決定不起訴。張某向賠償義務機關申請國家賠償。下列選項錯誤的是（　）", "options": [{"key": "A", "text": "本案賠償義務機關是一審法院"}, {"key": "B", "text": "本案賠償的期限範圍是5月2日至7月10日"}, {"key": "C", "text": "若張某對賠償義務機關的先行處理不服可以向其上一級機關提起復議1次"}, {"key": "D", "text": "若張某對賠償義務機關的先行處理不服可以提起行政訴訟"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】A項正確，不當選。《國家賠償法》第21條第4款規定：“再審改判無罪的，作出原生效判決的人民法院為賠償義務機關。二審改判無罪，以及二審發回重審後作無罪處理的，作出一審有罪判決的人民法院為賠償義務機關。”《刑事賠償解釋》第12條第1款規定：“一審判決有罪，二審發回重審後具有下列情形之一的，屬於國家賠償法第二十一條第四款規定的重審無罪賠償，作出一審有罪判決的人民法院為賠償義務機關：（一）原審人民法院改判無罪並已發生法律效力的；（二）重審期間人民檢察院作出不起訴決定的 ；（三）人民檢察院在重審期間撤回起訴超過三十日或者人民法院決定按撤訴處理超過三十日未作出不起訴決定的。”本案中，二審法院發回重審後，檢察院決定不起訴，因而賠償義務機關是一審法院。 B項錯誤，當選。《刑事賠償解釋》第5條規定：“對公民採取刑事拘留措施後終止追究刑事責任，具有下列情形之一的，屬於國家賠償法第十七條第一項規定的違法刑事拘留：（一）違反刑事訴訟法規定的條件採取拘留措施的；（二）違反刑事訴訟法規定的程序採取拘留措施的；（三）依照刑事訴訟法規定的條件和程序對公民採取拘留措施，但是拘留時間超過刑事訴訟法規定的時限。違法刑事拘留的人身自由賠償金自拘留之日起計算。”可見，刑事拘留的賠償情形有兩種：一是違反了《刑事訴訟法》的程序規定的，二是程序和條件合法，但是超過了拘留期限，最後又被終止追究刑事責任的。本案中，對張某的拘留首先並沒有違反程序規定，其次也沒有超過刑事拘留的期限，儘管最後終止追究刑事責任，但是拘留這一期間是不應當賠償的 ，所以，賠償的期限範圍應該是從5月10日到7月10日。 C項、D項錯誤，當選。《國家賠償法》第24條規定：“賠償義務機關在規定期限內未作出是否賠償的決定 40 的，賠償請求人可以依照本條規定向其上一級人民法院賠償委員會申請作出賠償決定。”可見，在人民法院作為賠償義務機關時不存在復議程序，可以直接向上一級人民法院的賠償委員會申請賠償。同時，在刑事司法賠償程序中，也不存在行政訴訟的救濟階段。"}, {"id": "卷一-97", "subject": "卷一", "type": "多選題", "question": "下列屬於行政協議的是（　）", "options": [{"key": "A", "text": "甲市政府與A公司簽訂的城市污水處理協議"}, {"key": "B", "text": "乙市政府與王大錘簽訂的國有土地上房屋等征收補償安置協議"}, {"key": "C", "text": "丙市政府與B公司簽訂的硫鐵礦釆礦權出讓協議"}, {"key": "D", "text": "三個市政府簽訂的新型冠狀病毒防控合作協議"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】①根據《最高人民法院關於審理行政協議案件若干問題的規定》第2條：“公民、法人或者其他組織就下列行政協議提起行政訴訟的，人民法院應當依法受理：（一）政府特許經營協議；（二）土地、房屋等征收徵用補償協議；（三）礦業權等國有自然資源使用權出讓協議；（四）政府投資的保障性住房的租賃、買賣等協議；（五）符合本規定第一條規定的政府與社會資本合作協議；（六）其他行政協議。”A選項屬於（一），B選項屬於（二），C選項屬於（三），均屬於行政協議。故ABC選項正確，當選。 ②根據《最高人民法院關於審理行政協議案件若干問題的規定》第3條：“因行政機關訂立的下列協議提起訴訟的，不屬於人民法院行政訴訟的受案範圍：（一）行政機關之間因公務協助等事由而訂立的協議；（二 ）行政機關與其工作人員訂立的勞動人事協議。”D選項屬於因公務協助簽訂的內部協議，不是行政協議。故 D選項錯誤，不當選。 綜上，本題正確答案為ABC選項。"}, {"id": "卷一-98", "subject": "卷一", "type": "單選題", "question": "關於其他人身犯罪，下列選項說法正確的是？（　）", "options": [{"key": "A", "text": "甲系某偏遠山村中一已婚男子，但其妻子久久不能懷孕，遂從人販子處買到一名已婚女子乙。乙明確告甲她是有夫之婦，甲無動於衷，靠關係在當地民政局與乙辦理結婚手續。甲、乙均構成重婚罪"}, {"key": "B", "text": "甲系某地一名警察，某日下班回家後發現一名男子乙正在和自己妻子曖昧，遂對乙使用暴力，將乙綁在;子上，逼其承認與自己老婆有染。在乙承認有染後，甲將乙扭送至派出所處理。甲構成刑訊逼供罪"}, {"key": "C", "text": "甲是某地煤礦老闆，準備開採煤礦，需要大量勞動力。乙是其好友，明知甲在煤礦上會限制勞動者自由強迫勞動，仍主動幫忙招募運送人員到甲的煤礦上。後送至煤礦時發現煤礦因手續問題被停業整頓，該被招募的人員只要返回。乙的行為構成強迫勞動罪"}, {"key": "D", "text": "男方洪某因向鄰村女方余某求婚被拒絕，洪某糾集同村多人強制將女方拉到自己家中，強迫余某與自己完成結婚儀式。洪某的行為成立暴力干涉婚姻自由罪"}], "answer": ["D"], "explanation_full": "【羿文解析】A項錯誤。甲構成重婚罪，乙不構成犯罪。甲明知乙已經結婚，仍然執意與乙領結婚證，甲的行為成立重婚罪。乙系客觀條件所迫，被拐賣後再婚的，不以重婚罪論處。B項錯誤。甲不構成刑訊逼供罪。甲雖然是司法工作人員，也對乙實施了捆綁、逼迫其做不法行為的陳述，但是其並不是出於職務之便，即其並未利用司法職權。C項錯誤。乙的行為不構成強迫勞動罪。《刑法》第244條第2款系提示性規定，需要遵行共犯從屬性說，當實行犯沒實行行為，幫助犯也不構成犯罪。也就是說，對於協助強迫勞動類型的犯罪，如果被害人沒有被他人強迫勞動的，由於沒有侵害被害人的人身自由，對乙的行為就不應以強迫勞動罪論處。D項正確。暴力干涉婚姻自由罪中的干涉婚姻自由包括強制他人與某人結婚或者離婚，這裡的\"某人\"包括行為人與第三者。本題中，洪某暴力強迫余某與自己結婚，應以本罪論處。綜上，D當選。"}, {"id": "卷一-99", "subject": "卷一", "type": "單選題", "question": "依法治國方略的實施是一項浩瀚龐大、複雜而艱巨的系統工程，要全面發揮各種社會規範的調整作用，綜合協調地運用多元化的手段和方法實現對國家的治理和管理。關於依法治國理念的基本要求，下列哪一說法是不準確的？（　）", "options": [{"key": "A", "text": "在指導思想上，要堅持黨的領導、人民當家作主和依法治國三者有機統一"}, {"key": "B", "text": "在評價尺度上，要堅持法律效果與政治效果、社會效果有機統一專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 41"}, {"key": "C", "text": "在法的作用上，要構建黨委調解、行政調解、司法調解三位一體糾紛解決機制"}, {"key": "D", "text": "在法的成效上，要實現依法治國與以德治國的結合與統一"}], "answer": ["C"], "explanation_full": "【羿文解析】堅持黨的領導、人民當家作主、依法治國三者有機統一，是社會主義法治理念的本質屬性。社會主義法治理念要求在法治實踐中，堅定不移地把黨的領導、人民當家作主和依法治國密切結合、有機統一 。A項正確。法治機關及其工作人員要善於運用黨的路線、方針、政策去指導法治的具體運用，把法律的實施和適用與黨的路線、方針、政策的貫徹和落實結合起來，實現法律效果與政治效果、社會效果的高度統一。 B項正確。要全面發揮各種社會規範的調整作用，綜合協調地運用多元化的手段和方式來實現對國家的治理和管理；要堅持依法治國與以德治國的有機統一。D項正確。要充分發揮依法治國方略在全面推進社會主義建設事業中的重大作用就需要充分運用法律手段，不斷創新社會管理。要在深刻把握社會運行的規律和特徵的基礎上，探索用法律手段強化社會管理的方式和方法，特別是針對社會管理領域中的重點人群、重點活動、重點區域以及重點行業，建立起以法律手段為主體、多種手段協調與配合的管理和控制體系，構建人民調解、 行政調解、司法調解三位一體的解決社會糾紛的大調解格局和體系。因此，C項錯誤明顯。"}, {"id": "卷一-100", "subject": "卷一", "type": "多選題", "question": "下列說法正確的是（　）", "options": [{"key": "A", "text": "董某為謀取市場競爭優勢，雇傭謝某，多次以同一賬號大量購買智齒科技南京公司淘寶網店鋪的商品，致使該公司店鋪被淘寶公司認定為虛假交易刷銷量，並對其搜索降權，這嚴重影響該公司正常經營。經審計 ，該公司因被搜索降權，影響經營而產生的經濟損失為人民幣13264.29元。董某構成破壞生產經營罪"}, {"key": "B", "text": "甲從網上購買偽基站組件預謀買賣偽基站牟利，經鑒定繳獲的偽基站能發射標準基站頻段範圍內的射頻信號，具有接收短信，能夠阻斷部分手機接入G網基站的功能。甲的行為構成非法經營罪"}, {"key": "C", "text": "甲僅出於非法牟利的目的，而非向製造、販賣毒品的犯罪分子或吸食、注射毒品的人員販賣藥品，在未取得經營藥品資質的情況下，明知\"地西洋注射液\"為國家管制的第二類精神藥品，仍偽造相關資料購買並銷售 。甲構成非法經營罪"}, {"key": "D", "text": "張某與他人合夥成立個體企業某龍骨廠，因某龍骨廠系小規模納稅人，無法為購貨單位開具增值稅專用發票，張某遂以他人開辦的鑫源公司名義對外簽訂銷售合同，購貨單位均將貨款匯入鑫源公司賬戶，鑫源公司為購貨公司開具增值稅專用發票共53張，價稅合計4565441元，稅額651458元。張某無罪"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】A項正確。行為人主觀上具有報復和從中獲利的目的，客觀上實施了通過損害被害單位商業信譽的方式破壞被害單位生產經營的行為，被害單位因行為人的行為遭受了10萬元以上的損失，且行為人的行為與損失間存在因果關係，其行為符合破壞生產經營罪的犯罪構成，應以破壞生產經營罪定罪處罰。 B項正確。甲非法生產、銷售偽基站，其行為擾亂了市場管理秩序，構成非法經營罪。來源於2014年《最高人民法院、最高人民檢察院、公安部、國家安全部關於依法辦理非法生產銷售使用\"偽基站\"設備案件的意見》 。 C項正確。甲違反有關藥品管理規定、非法販賣國家規定管制的能夠使人形成毒癮的精神藥物，且沒有證據證明其以製造毒品或者走私、非法買賣制毒物品為目的，擾亂市場秩序，以非法經營罪定罪。 D項正確。張某借用其他企業名義為自己企業開具增值稅專用發票，雖不符合當時的稅收法律規定，但張某不具有偷逃稅收的目的，其行為未對國家造成稅收損失，不具有社會危害性。綜上所述，本題答案為ABCD。 42"}, {"id": "卷一-1", "subject": "卷一", "type": "單選題", "question": "關於全面依法治國的重大關係，下列哪一說法是錯誤的？", "options": [{"key": "A", "text": "要實現立法和改革決策相銜接，做到重大改革於法有據、立法主動適應改革發展需要"}, {"key": "B", "text": "堅持依法治國和依規治黨有機統一，確保黨既依據憲法法律治國理政，又依據黨內法規管黨治黨、從嚴治黨"}, {"key": "C", "text": "發揮好法律的規範作用，必須以法治體現道德理念、強化法律對道德建設的促進作用"}, {"key": "D", "text": "政策和國家法律都是人民根本意志的反映，政策具有連續性、穩定性、規範性的特點"}], "answer": ["D"], "explanation_full": "【羿文解析】《中共中央關於全面推進依法治國若干重大問題的決定》明確，“實現立法和改革決策相銜接 ，做到重大改革於法有據、立法主動適應改革和經濟社會發展需要。實踐證明行之有效的，要及時上升為法律。實踐條件還不成熟、需要先行先試的，要按照法定程序作出授權。對不適應改革要求的法律法規，要及時修改和廢止。”故A選項正確。 要健全黨領導全面依法治國的制度和工作機制，推進黨的領導制度化、法治化，通過法治保障黨的路線方針政策有效實施。要堅持依法治國和依規治黨有機統一，確保黨既依據憲法法律治國理政，又依據黨內法規管黨治黨、從嚴治黨。故B選項正確。 發揮好法律的規範作用，必須以法治體現道德理念、強化法律對道德建設的促進作用。一方面，道德是法律的基礎，只有那些合乎道德、具有深厚道德基礎的法律才能為更多人所自覺遵行。另一方面，法律是道德的保障，可以通過強制性規範人們行為、懲罰違法行為來引領道德風尚。要注意把一些基本道德規範轉化為法律規範，使法律法規更多體現道德理念和人文關懷，通過法律的強制力來強化道德作用、確保道德底線，推動全社會道德素質提升。故C選項正確。 黨的政策和國家法律都是人民根本意志的反映，在本質上是一致的。政策具有因地制宜、側重指導的特點 ，而法律具有普遍性、統一性、連續性、穩定性、規範性等特點。故D選項錯誤。"}, {"id": "卷一-2", "subject": "卷一", "type": "單選題", "question": "貫徹落實總體國家安全觀，加快國家安全法治建設，以下符合這一部署的措施是？（　）", "options": [{"key": "A", "text": "出台反恐怖等法律"}, {"key": "B", "text": "建立健全自然資源產權法律制度"}, {"key": "C", "text": "加強互聯網領域立法"}, {"key": "D", "text": "制定國家勛章和國家榮譽稱號法"}], "answer": ["A"], "explanation_full": "【羿文解析】《中共中央關於全面推進依法治國若干重大問題的決定》中表述為“抓緊出台反恐怖等一批急需法律，推進公共安全法治化，構建國家安全法律制度體系。”故A選項正確。 B選項屬於“用嚴格的法律制度保護生態環境”的部署，錯誤。 C選項屬於“加強互聯網領域立法，完善網絡信息服務、網絡安全保護、網絡社會管理等方面的法律法規，依法規範網絡行為”的部署，錯誤。 D選項屬於“制定國家勛章和國家榮譽稱號法，表彰有突出貢獻的傑出人士”的部署，錯誤。"}, {"id": "卷一-3", "subject": "卷一", "type": "單選題", "question": "立法中要科學合理地規定權利與義務、權力與責任，下列說法正確的是哪一項？（　）", "options": [{"key": "A", "text": "立法中，要偏重設定公民、法人和其他組織的義務"}, {"key": "B", "text": "立法中職能交叉、多頭執法的現象是合理存在的"}, {"key": "C", "text": "應當遵守權力與責任脫鉤、權利與利益掛鉤的原則"}, {"key": "D", "text": "在立法過程中，要做到有權必有責、用權受監督、違法要追究、侵權要賠償"}], "answer": ["D"], "explanation_full": "【羿文解析】立法中應當偏重設定公民、法人和其他組織的權利，A選項錯誤。 職能交叉，多頭執法是不合理的，應該杜絕，B選項錯誤。 立法中權利與利益不應掛鉤，C選項錯誤。 1 在立法過程中，要做到有權必有責、用權受監督、違法要追究、侵權要賠償，D項正確。"}, {"id": "卷一-4", "subject": "卷一", "type": "單選題", "question": "關於公元前359年商鞅在秦國變法，下列哪一選項是正確的？", "options": [{"key": "A", "text": "商鞅取消郡縣制，實行分封制，剝奪了舊貴族對地方政權的壟斷權"}, {"key": "B", "text": "商鞅“改法為律”，突出了法律規範的倫理基礎"}, {"key": "C", "text": "商鞅推行“連坐”制度，鼓勵臣民相互告發奸謀"}, {"key": "D", "text": "商鞅提出“輕罪重刑”，反對赦免罪犯，認為凡有罪者皆應受罰"}], "answer": ["D"], "explanation_full": "【羿文解析】商鞅取消分封制，建立了郡縣制。A項錯誤。 商鞅改法為律，擴充了法律的內容，強調法律規範的普遍性，具有“范天下不一而歸於一”的功能。作為法家的代表，商鞅也不強調法律規範的倫理基礎。B項錯誤。 商鞅變法的內容之一，就是實行連坐制度，其具體內容包括鄰伍連坐、軍事連坐、職務連坐、家庭連坐等 ，而鼓勵告奸並非連坐制度的內容。C項錯誤。 商鞅提出“輕罪重刑”，反對赦免罪犯，認為凡有罪者皆應受罰。D項正確。"}, {"id": "卷一-5", "subject": "卷一", "type": "單選題", "question": "《大清民律草案》仿照的是（　）", "options": [{"key": "A", "text": "法國式民法"}, {"key": "B", "text": "德國式民法"}, {"key": "C", "text": "英國式民法"}, {"key": "D", "text": "美國式民法"}], "answer": ["B"], "explanation_full": "【羿文解析】大清民律草案由清政府修訂法律館主持起草，1911年完成，仿照德國式民法草擬，分總則、債權、物權、親屬、繼承五編。前三編委託日本法學家松岡義正、志田鉀太郎協助主編，後兩編由法律館會同禮學館起草。草案曾交資政院審議，但至清朝滅亡也未能公布。它是中國第一部民法典草案，對以後的民法立法有一定影響。故本題正確答案為B。"}, {"id": "卷一-6", "subject": "卷一", "type": "單選題", "question": "下列關於法的特徵的表述，不正確的是？", "options": [{"key": "A", "text": "與習慣、道德以及政策不同，法律是一種以公共權力為後盾、具有特殊強制性的社會規範"}, {"key": "B", "text": "與制定法不同，判例法不具有規範性和普遍性的特徵"}, {"key": "C", "text": "法律具有可訴性和程序性，這是法律區別於道德的主要特徵"}, {"key": "D", "text": "法律的實現方式表現在，以制度化的爭議解決機制為權利人提供保障，進而凸顯法律的功能"}], "answer": ["B"], "explanation_full": "【羿文解析】法律以國家強制力這種公共權力為後盾，是具有國家強制力這種特殊強制力保障的社會規範 ；習慣及道德依靠內在強制力，政策依靠政治紀律。A項正確。 判例法也屬於國家法，具備國家法的一般特徵。B項錯誤。 可訴性、程序性、國家意志性、國家強制性、普遍性、建構性、確定性、一元性、外在強制性等，都屬於法律區別於道德的主要特徵。C項正確。 法律具有明顯的程序性，即制度化的爭議解決機制。D項正確。"}, {"id": "卷一-7", "subject": "卷一", "type": "單選題", "question": "我國《民法典》第617條規定：“出賣人交付的標的物不符合質量要求的，買受人可以依據本法第五百八十二條至第五百八十四條的規定請求承擔違約責任。”下列哪一選項符合這一規定的表述？", "options": [{"key": "A", "text": "授權性規則和委任性規則"}, {"key": "B", "text": "授權性規則和準用性規則"}, {"key": "C", "text": "命令性規則和準用性規則"}, {"key": "D", "text": "任意性規則和委任性規則 2"}], "answer": ["B"], "explanation_full": "【羿文解析】授權性規則，是指規定人們有權作一定行為或不作一定行為的規則，即規定人們的“可為模式 ”規則。 義務性規則，是指在內容上規定人們的法律義務，即有關人們應當作出或不作出某種行為的規則。分為兩種 ：(1)命令性規則，是指規定人們的積極義務，即人們必須或應當作出某種行為的規則。(2)禁止性規則，是指規定人們的消極義務(不作為義務)，即禁止人們作出一定行為的規則。 按照規則內容的確定性程度不同，可以把法律規則分為確定性規則、委任性規則和準用性規則。確定性規則 ，是指內容本已明確肯定，無須再援引或參照其他規則來確定其內容的法律規則。委任性規則，是指內容尚未確定，而只規定某種概括性指示，由相應國家機關通過相應途徑或程序加以確定的法律規則。準用性規則 ，是指內容本身沒有規定人們具體的行為模式，而是可以援引或參照其他相應內容規定的規則。 題乾法條中“買受人可以依據本法第五百八十二條至第五百八十四條的規定請求承擔違約責任”的規定屬於授權性規則(授予了買受人權利)，也屬於準用性規則(需引用《民法典》第617條的規定)，故B項正確。"}, {"id": "卷一-8", "subject": "卷一", "type": "單選題", "question": "關於法律規則和法律原則的區別，下列哪一表述是不正確的？（　）", "options": [{"key": "A", "text": "對一般情形之個案，可以先適用原則再適用規則"}, {"key": "B", "text": "對一般情形之個案，須窮盡規則，方可適用原則"}, {"key": "C", "text": "對一般情形之個案，兩個衝突規則，一個有效，另一個就無效"}, {"key": "D", "text": "對一般情形之個案，兩個競爭原則，一個有分量，另一個並非就無分量"}], "answer": ["A"], "explanation_full": "【羿文解析】法律規則因其內容明確具體，能夠最大限度地實現法律的可預測性價值且能夠有效地限制法官的自由裁量，因此在案件裁判中通常具有優先地位，但這並不意味著法律原則無法用於司法裁判，只不過法律原則的適用條件更為嚴格而已，具體包括：（1）窮盡規則方得適用原則。（原則彌補規則漏洞的條件 ）（2）除非為了實現個案正義，否則不得捨棄法律規則而直接適用法律原則。（3）沒有更強理由不得徑行適用法律原則。（原則取代規則的條件）因此A選項錯誤，B選項正確。 法律規則以全有或全無的方式適用於個案，法律原則以權衡強度或分量的方式適用於個案，規則競爭的結果是獲勝的規則排除與其相競爭的規則，原則競爭的結果則是分量重的原則優先適用，落敗的原則並非毫無分量，只是分量較輕不主導案件裁判罷了。故C、D選項正確。"}, {"id": "卷一-9", "subject": "卷一", "type": "單選題", "question": "我國《刑法》規定，故意傷害他人身體……致人重傷的，處以3年以上10年以下有期徒刑。在一起故意傷害案件中，法官推理的步驟是：(1)使人肢體殘廢的，屬於致人重傷。(2)喪失手的機能，就屬於肢體殘廢。 (3)如果手指失去作用，就會喪失手的機能。(4)砍斷他人的左手拇指、食指與中指.手指就失去了作用。 (5)張三砍斷他人的左手拇指、食指與中指。(6)對張三應處以3年以上10年以下有期徒刑。對此，下列選項不正確的是？", "options": [{"key": "A", "text": "法官使用了演繹推理"}, {"key": "B", "text": "法官使用了類比推理"}, {"key": "C", "text": "法官的推理著眼於法律的安定性"}, {"key": "D", "text": "從法律證成的角度看，該推理方法屬於內部證成"}], "answer": ["B"], "explanation_full": "【羿文解析】法官的推理方式是三段論的展開形式——涵攝，屬於演繹推理。A項正確。 類比推理是指對案件或某個要素進行比較而進行的推理，題乾沒有出現類比推理。B項錯誤。 因為法官的推理屬於演繹推理，而演繹推理著眼於法律的安定性。實現的是秩序和平等。C項正確。 涵攝是細化的三段論推理，在法律證成角度看，屬於內部證成的細化。D項正確。"}, {"id": "卷一-10", "subject": "卷一", "type": "單選題", "question": "保證公正司法，提高司法公信力，一個重要的方面是加強對司法活動的監督。下列哪一做法屬於司法機關內部監督？（　）", "options": [{"key": "A", "text": "建立生效法律文書統一上網和公開查詢制度"}, {"key": "B", "text": "完善法官、檢察官辦案責任制，落實誰辦案誰負責專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 3"}, {"key": "C", "text": "檢察院辦案中主動聽取並重視律師意見"}, {"key": "D", "text": "逐步實行人民陪審員只參與審理事實認定、不再審理法律適用問題"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《中共中央關於全面推進依法治國若干重大問題的決定》第四部分“保證公正司法，提高司法公信力”第（2）項“優化司法職權配置”規定：“健全公安機關、檢察機關、審判機關、司法行政機關各司其職，偵查權、檢察權、審判權、執行權相互配合、相互制約的體制機制”；同時規定：“明確司法機關內部各層級權限，健全內部監督制約機制。司法機關內部人員不得違反規定干預其他人員正在辦理的案件 ，建立司法機關內部人員過問案件的記錄製度和責任追究制度。完善主審法官、合議庭、主任檢察官、主辦偵查員辦案責任制，落實誰辦案誰負責。”故B選項正確。 檢察院辦案中主動聽取並重視律師意見、建立人民陪審員制度、建立生效法律文書統一上網和公開查詢制度 ，都屬於來自民眾、來自社會的外部監督。ACD不合題意。"}, {"id": "卷一-11", "subject": "卷一", "type": "單選題", "question": "下列關於我國司法制度的說法中，正確的是：（　）", "options": [{"key": "A", "text": "我國實行的是檢察長負責制"}, {"key": "B", "text": "檢察機關有權實行立案監督、偵查監督、審判監督，以實現對訴訟活動的法律監督"}, {"key": "C", "text": "檢察官獨立不同於法官獨立，上級檢察院監督下級檢察院的工作"}, {"key": "D", "text": "基層法院除審判案件外，還需要對人民調解委員會的工作進行監督"}], "answer": ["B"], "explanation_full": "【羿文解析】我國實行的不是單一的檢察長負責制或檢察官負責制，而是檢察長負責制和檢察委員會集體領導相結合的檢察院負責制。A項錯誤。 檢察機關作為法律監督機關，有權對訴訟活動進行法律監督，包括立案監督、偵查監督和審判監督等。B項正確。 我國的檢察體制實行“檢察一體化”，應當是上級檢察院領導下級檢察院的工作。而我國法院則是上級法院監督下級法院的審判工作。C項錯誤。 基層法院無權對人民調解委員會的工作進行監督。根據《人民調解法》第5條第2款的規定，基層人民法院對人民調解委員會調解民間糾紛進行業務指導，而非監督。D項錯誤。"}, {"id": "卷一-12", "subject": "卷一", "type": "單選題", "question": "關於法官懲戒委員會，下列哪一選項是正確的（　）", "options": [{"key": "A", "text": "各級人民法院設立法官懲戒委員會"}, {"key": "B", "text": "法官懲戒委員會由法官代表組成"}, {"key": "C", "text": "法官懲戒委員會審議懲戒事項時，當事法官無權申請有關人員迴避"}, {"key": "D", "text": "法官懲戒委員會提出審查意見後，人民法院依照有關規定作出是否予以懲戒的決定，並給予相應處理"}], "answer": ["D"], "explanation_full": "【羿文解析】最高法院和省、自治區、直轄市設立法官懲戒委員會，其日常工作由相關人民法院的內設職能部門承擔。A項錯誤。 法官懲戒委員會由法官代表、其他從事法律職業的人員和有關方面代表組成，其中法官代表不少於半數。B項錯誤。 法官懲戒委員會負責從專業角度審查認定法官是否存在違反審判職責的行為，提出構成故意違反職責、存在重大過失、存在一般過失或者沒有違反職責等審查意見。法官懲戒委員會審議懲戒事項時，當事法官有權申請有關人員迴避，有權進行陳述、舉證、辯解。C項錯誤。 法官懲戒委員會作出的審查意見應當送達當事法官。當事法官對審查意見有異議的，可以向懲戒委員會提出 ，懲戒委員會應當對異議及其理由進行審查，作出決定。法官懲戒委員會提出審查意見後，人民法院依照有關規定作出是否予以懲戒的決定，並給予相應處理。D項正確。"}, {"id": "卷一-13", "subject": "卷一", "type": "單選題", "question": "陳某自2018年1月起在甲市乙縣A律師事務所開始執業，2018年11月代理某合同糾紛時，因違規會見該案承辦法官李某被人舉報，2019年1月底陳律師受到停止執業6個月的處罰，李法官也受到了紀律處分。關於本案專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 4 ，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "應由乙縣司法局給予陳某停止執業6個月的處罰"}, {"key": "B", "text": "應給予李法官降級的違紀處分"}, {"key": "C", "text": "如2022年8月A律所在甲市丙縣設立分所，陳某可被確定為分所負責人"}, {"key": "D", "text": "如陳某離開A律所，2022年8月可以自己的名義設立個人律師事務所"}], "answer": ["C"], "explanation_full": "【羿文解析】《律師法》第49條第1款第(一)項規定，律師違反規定會見法官、檢察官、仲裁員以及其他有關工作人員，或者以其他不正當方式影響依法辦理案件，由設區的市級或者直轄市的區人民政府司法行政部門給予停止執業6個月以上1年以下的處罰，可以處5萬元以下的罰款。據此，陳律師違規會見法官，應由甲市司法局而非乙縣司法局作出處罰。A選項錯誤。 《人民法院工作人員處分條例》第31條規定，違反規定會見案件當事人及其辯護人、代理人、請託人的，給予警告處分；造成不良後果的，給予記過或者記大過處分。因此，給予李法官降級的處分不符合規定。B選項錯誤。 《律師事務所管理辦法》第34條第1款第(五)項規定，分所負責人應當是具有3年以上的執業經歷並能夠專職執業，且在擔任負責人前3年內未受過停止執業處罰的律師。據此，陳某執業已滿3年，且擔任負責人前3年內未受到停止執業處罰，可以成為分所的負責人。C選項正確。 《律師法》第16條規定，個人律師事務所的設立人應當是具有5年以上執業經歷的律師。截至2022年8月，陳某執業未滿5年，不能設立個人律師事務所。D選項錯誤。"}, {"id": "卷一-14", "subject": "卷一", "type": "單選題", "question": "監察機關開展監督、調查，根據監督、調查的結果採取的下列措施中，哪一選項是正確的？", "options": [{"key": "A", "text": "對有職務違法行為的公職人員，均按照管理權限，直接或者委託有關機關、人員，進行談話提醒、批評教育、責令檢查，或者予以誡勉"}, {"key": "B", "text": "對監察對象所在單位廉政建設和履行職責存在的問題等提出監察建議"}, {"key": "C", "text": "監察機關經調查，對涉嫌犯罪取得的財物，依法予以沒收、追繳或者責令退賠"}, {"key": "D", "text": "被調■人逃匿，在通緝一年後不能到案的，監察機關有權提請人民法院裁定沒收其違法所得"}], "answer": ["B"], "explanation_full": "【羿文解析】《監察法》第45條第一款規定：“監察機關根據監督、調查結果，依法作出如下處置：（一 ）對有職務違法行為但情節較輕的公職人員，按照管理權限，直接或者委託有關機關、人員，進行談話提醒 、批評教育、責令檢查，或者予以誡勉；（二）對違法的公職人員依照法定程序作出警告、記過、記大過、 降級、撤職、開除等政務處分決定；（三）對不履行或者不正確履行職責負有責任的領導人員，按照管理權限對其直接作出問責決定，或者向有權作出問責決定的機關提出問責建議；（四）對涉嫌職務犯罪的，監察機關經調查認為犯罪事實清楚，證據確實、充分的，製作起訴意見書，連同案卷材料、證據一併移送人民檢察院依法審■、提起公訴；（五）對監察對象所在單位廉政建設和履行職責存在的問題等提出監察建議。” 根據第一項，“進行談話提醒、批評教育、責令檢查，或者予以誡勉”的，不是針對所有具有職務違法行為的公職人員，而是針對有職務違法行為但“情節較輕”的公職人員，A項錯誤。 根據第五項，B項正確。 《監察法》第46條規定：“監察機關經調查，對違法取得的財物，依法予以沒收、追繳或者責令退賠；對涉嫌犯罪取得的財物，應當隨案移送人民檢察院。”C項錯誤。 《監察法》第48條規定：“監察機關在調查貪污賄賂、失職瀆職等職務犯罪案件過程中，被調查人逃匿或者死亡，有必要繼續調查的，經省級以上監察機關批准，應當繼續調查並作出結論。被調查人逃匿，在通緝一年後不能到案，或者死亡的，由監察機關提請人民檢察院依照法定程序，向人民法院提出沒收違法所得的申請。”可見，需要沒收違法所得時，監察機關應提請人民檢察院，由後者依照法定程序向人民法院提出沒收違法所得的申請，再由人民法院依法審理並作出裁定。D項錯誤。"}, {"id": "卷一-15", "subject": "卷一", "type": "單選題", "question": "根據《憲法》和《村民委員會組織法》，下列哪一說法是正確的？", "options": [{"key": "A", "text": "村民委員會成員連續兩次評議不稱職的其職務終止專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 5"}, {"key": "B", "text": "村民委員會有權審議村民會議的年度工作報告，評議村民會議成員的工作"}, {"key": "C", "text": "選舉村民委員會要求村民過半數投票，獲得過半選票當選"}, {"key": "D", "text": "基層政權領導、支持、幫助村委會與居委會的事務，但不得干預自治事項"}], "answer": ["A"], "explanation_full": "【羿文解析】村民委員會成員連續兩次被評議不稱職的，其職務終止。故A選項正確。 根據《村委會組織法》第23條的規定，村民會議審議村民委員會的年度工作報告，評議村民委員會成員的工作；有權撤銷或者變更村民委員會不適當的決定；有權撤銷或者變更村民代表會議不適當的決定。故B選項錯誤。 根據《村委會組織法》第15條規定，選舉村民委員會，有登記參加選舉的村民過半數投票，選舉有效；候選人獲得參加投票的村民過半數的選票，始得當選。注意，必須是有登記參加選舉的村民才有投票權，故C選項錯誤。 根據《村委會組織法》第5條的規定，鄉、民族鄉、鎮的人民政府對村民委員會的工作給予指導、支持和幫助 ，但是不得干預依法屬於村民自治範圍內的事項。注意，是指導而不是領導，故D選項錯誤。"}, {"id": "卷一-16", "subject": "卷一", "type": "單選題", "question": "馬克思主義關於“人民主權”的論述是社會主義法治理念的理論淵源之一。下列哪一憲法原則準確體現了人民主權思想？", "options": [{"key": "A", "text": "國家尊重和保障人權"}, {"key": "B", "text": "中華人民共和國的一切權力屬於人民"}, {"key": "C", "text": "中華人民共和國公民在法律面前一律平等"}, {"key": "D", "text": "中華人民共和國實行依法治國，建設社會主義法治國家"}], "answer": ["B"], "explanation_full": "【羿文解析】人民主權原則在我國憲法中的主要體現包括：憲法第1條第1款明確規定中華人民共和國是工人階級領導的、以工農聯盟為基礎的人民民主專政的社會主義國家；第2條第1款規定：“中華人民共和國的一切權力屬於人民。”憲法同時規定了實現人民主權的具體形式與途徑，憲法第2條第2、3款規定：“人民行使國家權力的機關是全國人民代表大會和地方各級人民代表大會。”“人民依照法律規定，通過各種途徑和形式，管理國家事務，管理經濟和文化事業，管理社會事務。”此外，憲法對公民基本權利和義務的規定也是人民主權原則的具體體現；為了體現人民主權原則，我國憲法規定了選舉制度的主要程序，以實現憲法的基本原則。可見，B項最為直接準確地體現了人民主權思想。"}, {"id": "卷一-17", "subject": "卷一", "type": "單選題", "question": "根據《憲法》和法律法規的規定，關於我國行政區劃變更的法律程序，下列哪一選項是正確的？", "options": [{"key": "A", "text": "甲縣欲更名，須報該縣所屬的省級政府審批"}, {"key": "B", "text": "乙省行政區域界線的變更，應由全國人大審議決定"}, {"key": "C", "text": "丙鎮與鄰近的一個鎮合併，須報兩鎮所屬的縣級政府審批"}, {"key": "D", "text": "丁市部分行政區域界線的變更，可以由國務院授權丁市所屬的省級政府審批"}], "answer": ["D"], "explanation_full": "【羿文解析】我國的行政區域變更的法律程序，根據憲法和法律的規定，審批權限如下：全國人大審批省、 自治區和直轄市的建置（設立、撤銷和更名）以及特別行政區的設立及其制度；國務院負責審批省、自治區 、直轄市的區域劃分（行政區域界限變更）、政府駐地的遷移，自治州、縣、自治縣、市、市轄區的建置和區域劃分（設立、撤銷、更名或隸屬關係、行政區域界線的變更）；省級人民政府負責審批鄉、民族鄉、鎮的建置和區域劃分（設立、撤銷、更名或行政區域變更），特殊情況下根據國務院的授權，還有權審批縣、 市、市轄區的部分行政區域界線的變更。 縣的更名由國務院審批，可見，A項錯誤。 省行政區域界線的變更，由國務院審批，B項錯誤。 鎮的合併，報省級人民政府審批，C項錯誤。 根據國務院的授權，省級人民政府有權審批市的部分行政區域界限的變更，D項正確。 6"}, {"id": "卷一-18", "subject": "卷一", "type": "單選題", "question": "關於村民會議、村民委員會，下列哪一選項是錯誤的？（　）", "options": [{"key": "A", "text": "甲村的村民委員會由主任、副主任、委員、秘書長等9人組成"}, {"key": "B", "text": "因村主任犯罪被判刑，乙村的村民會議開會補選了村民委員會主任"}, {"key": "C", "text": "丙村村民會議授權其村民代表會議評議村民委員會成員的工作，撤銷或者變更村民委員會不適當的決定"}, {"key": "D", "text": "丁村有300戶村民，召開村民會議討論修建水利設施時，因許多村民在外打工無法到會，決定每戶派代表參加，到會的戶代表有220戶，最後111戶同意，通過了修建水利的決議"}], "answer": ["A"], "explanation_full": "【羿文解析】村民委員會由主任、副主任和委員會3～7人組成，沒有秘書長。A選項錯誤。 村民委員會成員喪失行為能力或者被判處刑罰的，其職務自行終止。村民委員會成員出缺，可由村民會議或者村民代表會議進行補選。B選項正確。 村民會議可以授權村民代表會議審議村民委員會的年度工作報告，評議村民委員會成員的工作，撤銷或者變更村民委員會不適當的決定。C選項正確。 根據《村民委員會組織法》第22條的規定，召開村民會議，應當有本村18周歲以上村民的過半數。或者本村 2／3以上戶的代表參加，所作決定應當經到會人員的過半數同意。D選項正確。"}, {"id": "卷一-19", "subject": "卷一", "type": "單選題", "question": "關於憲法實施機制的表述，下列哪一選項是不正確的？（　）", "options": [{"key": "A", "text": "保障憲法實施的專門機關主要有憲法法院、憲法委員會以及議會等機構"}, {"key": "B", "text": "在德國，公民若認為憲法權利受到侵害，無需依賴於具體案件"}, {"key": "C", "text": "專門機關保障憲法實施的機制是當今世界違憲審查的發展趨勢"}, {"key": "D", "text": "司法機關保障憲法實施的機制起源於美國，主要的保障方式是附帶審查"}], "answer": ["A"], "explanation_full": "【羿文解析】保障憲法實施的專門機關主要有憲法法院、憲法委員會兩種形式，議會則是立法機關保障憲法實施的機制。A項錯誤。 德國屬於專門機關保障體制，在保障方式上屬於憲法控訴，不依賴於具體案件。B項正確。 專門機關保障憲法實施是指，在普通法外建立專門的憲法委員會或憲法法院來對法律等進行合憲性審查 ，20世紀下半葉以來，世界上很多國家建立了專門機關審查制，因此，可以說“建立專門機關審查制是今後發展的大方向”。C項正確。 司法機關保障憲法實施的機制起源於美國的“馬伯裡訴麥迪遜”案，主要是附帶於具體案件從而順帶審查相關立法是否違憲。D項正確。"}, {"id": "卷一-20", "subject": "卷一", "type": "單選題", "question": "甲國人張三和乙國人李四在甲國長期從事跨國人口和毒品販賣活動，事發後張三逃往乙國境內，李四逃入乙國駐甲國領事館中。張三以其曾經從事過反對甲國政府的政治活動為由，要求乙國提供庇護。甲乙兩國之間沒有關於引渡和庇護的任何條約。根據國際法的有關規則和制度，下列哪一項判斷是正確的？（　）", "options": [{"key": "A", "text": "由於張三曾從事反對甲國政府的活動，因此乙國必須對其提供庇護"}, {"key": "B", "text": "由於李四是乙國人，因此乙國領事館有權拒絕把納某交給甲國"}, {"key": "C", "text": "根據《維也納領事關係公約》的規定，乙國領館可以行使領事裁判權，即對李四進行審判並作出判決後 ，交由甲國予以執行"}, {"key": "D", "text": "乙國可以對張三的涉嫌犯罪行為在乙國法院提起訴訟，但乙國沒有把其交給甲國審判的義務"}], "answer": ["D"], "explanation_full": "【羿文解析】如果相關國家之間沒有關於引渡或庇護的條約，則引渡和庇護均屬於國家權利而非義務，故A項錯誤。 使領館館舍不得用於與其職務不相符的用途，包括外交庇護或藏匿犯罪嫌疑人等，故B項錯誤。 領事裁判權是指一國駐外領事等對處於接受國領土內的本國國民根據其本國法律行使司法管轄權的制度，是帝國主義在殖民地國家所享有的一種非法特權，已為現代國際法所廢棄，故C項錯誤。 張三長期從事跨國人口和毒品販賣活動屬於普遍管轄權的罪行，乙國有權對其涉嫌犯罪行為在乙國法院提起訴訟，但甲乙兩國沒有關於引渡的條約，因此引渡與否屬於乙國的權利而非義務，D項正確。 7"}, {"id": "卷一-21", "subject": "卷一", "type": "單選題", "question": "依據《海洋法公約》以及中國有關法律和實踐，下列哪一選項是正確的？", "options": [{"key": "A", "text": "外國非軍用船舶在我國瓊州海峽有無害通過權"}, {"key": "B", "text": "《海洋法公約》其他締約國的潛水艇只要浮出水面並展示其船旗就可以在我國領海無害通過"}, {"key": "C", "text": "中華人民共和國從領海基線量起的領海寬度和領海以外的毗連區寬度均為12海里"}, {"key": "D", "text": "我國的毗連區屬於我國領土組成部分，但專屬經濟區不屬於我國的領土組成部分，我國在專屬經濟區只享有勘探和開發自然資源的專屬權利"}], "answer": ["C"], "explanation_full": "【羿文解析】我國瓊州海峽屬於中國內海峽，而外國船舶未經許可不得駛入一國內海，A項錯誤。 我國不允許軍用船舶在我國領海的無害通過，因此如果是其他締約國的軍用潛水艇，即使浮出水面並展示船旗，也不能在我國領海無害通過，B項錯誤。 中華人民共和國從領海基線量起的領海寬度和領海以外的毗連區寬度均為12海里，C項正確。 毗連區和專屬經濟區都不是一國領土組成部分，D項錯誤。"}, {"id": "卷一-22", "subject": "卷一", "type": "單選題", "question": "根據國家責任原則，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "國家元首在國外以私人身份從事的不法行為，除非特別說明，國家一般不承擔相關責任"}, {"key": "B", "text": "按照國際法，如果違反條約必須遵守原則，不履行有關的條約義務，就構成了國際不當行為，違約者應承擔國際責任"}, {"key": "C", "text": "外交使節執行職務內事項時越權，國家一般不承擔責任"}, {"key": "D", "text": "甲國公民詹某酒後開車撞死撞傷數人後逃逸，死者包括乙國駐甲國使館隨員，甲國迅速出動警力破案將其抓獲，針對乙國隨員的死亡，甲國需承擔責任"}], "answer": ["B"], "explanation_full": "【羿文解析】國家元首在國外以私人身份從事的不法行為，除非特別說明，國家一般須承擔相關責任，A項錯誤。 凡有效的條約對其各當事國有拘束力，必須由其善意履行。按照國際法，如果違反條約必須遵守原則，不履行有關的條約義務，就構成國際不當行為，違約者應承擔國際責任，B項正確。 國家機關和國家授權人員的越權或不法行為可歸因於國家，C項錯誤。 對於一般的私人行為，國家對之不承擔直接責任，沒有失職或放縱的情形，亦不承擔間接責任，D項錯誤。"}, {"id": "卷一-23", "subject": "卷一", "type": "單選題", "question": "關於罪刑法定原則，以下說法正確的是？（　）", "options": [{"key": "A", "text": "罪刑法定原則不禁止有利於被告人的類推解釋，也不禁止有利於被告人的事後法"}, {"key": "B", "text": "罪刑法定原則出於保障國民自由的目的，約束了司法機關的活動，但立法活動是國民意志的體現，不受罪刑法定原則的約束"}, {"key": "C", "text": "為了適應犯罪分子改過自新的實際情況，法官可以在宣判時判處具有一定幅度的刑罰，如“1～3年有期徒刑”，在執行過程中根據犯罪分子的表現再確定最終執行年限。這種做法符合預防犯罪的要求，不違反罪刑法定原則"}, {"key": "D", "text": "罪刑法定原則只約束辦理刑事案件的公檢法人員，監察委在辦理刑事案件過程中應當更多地考慮政策性要求，可不受罪刑法定原則約束"}], "answer": ["A"], "explanation_full": "【羿文解析】罪刑法定原則的主要目的是保障國民的行動自由，所以禁止類推解釋、禁止事後法。但有利於被告人的類推解釋、有利於被告人的事後法並不限制國民的行動自由，因此是允許的。《刑法》第12條規定了“從舊兼從輕”原則。“從舊”表明了罪刑法定原則下禁止溯及既往的要求，“從輕”則表明有利於被告人的溯及既往是允許的。A項正確。 一般將罪刑法定原則分為形式的側面與實質的側面（但這種區分只是相對的），形式的側面用以限制司法權 ，實質的側面用以限制立法權。例如，罪刑法定原則要求立法者規定的構成犯罪的各條件具有明確性。B項錯誤。 8 雖然從各國刑法來看，普遍採用的是相對確定的法定刑。這是因為，相對確定的法定刑能夠為司法人員留下斟酌的空間以應對各個犯罪人不同的特殊預防必要性，有利於實現刑罰的目的。但宣告刑必須是確定的，不允許在具體案件中宣告一個浮動的刑罰區間。C項錯誤。 罪刑法定原則貫穿於刑事追訴活動，是刑事司法活動中的“鐵則”，監察委辦理刑事案件時，也必須遵循罪刑法定原則，不得以任何理由違背罪刑法定原則的要求。D項錯誤。"}, {"id": "卷一-24", "subject": "卷一", "type": "單選題", "question": "關於刑法的空間效力，下列哪一項是正確的？（　）", "options": [{"key": "A", "text": "凡在中國領域內犯罪的，都應依據屬地管轄原則適用中國刑法追究刑事責任"}, {"key": "B", "text": "中國公民張某在甲國旅遊期間，偽造乙國貨幣，我國刑法對此案適用屬人管轄原則管轄"}, {"key": "C", "text": "甲國公民約翰在中國留學期間，暑期外出旅遊，途中因與同學丁某(中國人)發生口角，將其打死，對約翰的行為應依據保護管轄原則適用中國刑法追究刑事責任"}, {"key": "D", "text": "甲國人戴森乘坐中國民航飛機從乙國飛至丙國領空時，將毒品賣給丁國人凱特，對戴森應依據普遍管轄原則適用我國《刑法》追究其刑事責任"}], "answer": ["B"], "explanation_full": "【羿文解析】《刑法》第6條規定：凡在中華人民共和國領域內犯罪的，除法律有特別規定的以外，都適用本法。A選項說法太過絕對，錯誤。 《刑法》第7條規定：中華人民共和國公民在中華人民共和國領域外犯本法規定之罪的。適用本法，但是按本法規定的最高刑為三年以下有期徒刑的，可以不予追究。中華人民共和國國家工作人員和軍人在中華人民共和國領域外犯本法規定之罪的，適用本法。故對張某適用屬人管轄原則。B選項正確。 應為屬地管轄。刑事管轄原則適用的先後順序是：屬地原則；屬人原則；保護原則；普遍管轄原則。C選項錯誤。 《刑法》第6條規定：凡在中華人民共和國船舶或者航空器內犯罪的，也適用本法。適用我國刑法追究犯罪人的刑事責任是基於屬地管轄原則。D選項錯誤。"}, {"id": "卷一-25", "subject": "卷一", "type": "單選題", "question": "以下關於槍支犯罪的表述，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "甲持有兩支手槍而無相應的子彈，而乙持有多發子彈卻無相應的手槍，乙用部分子彈換取甲的一支手槍 ，甲、乙成立非法買賣槍支、彈藥罪"}, {"key": "B", "text": "乙將在境外製造的爆炸物非法走私進入我國境內的行為，構成走私武器、彈藥罪"}, {"key": "C", "text": "丙欲盜竊槍支搶劫銀行，趁某公安分局值班人員不在期間，取走放在庫房中的槍支，正欲離開房間時，被回來的值班人員發現，丙為逃脫開槍射擊值班人員致其重傷。丙成立搶劫槍支、彈藥罪"}, {"key": "D", "text": "丁為某公安局的警察，在外出訓練期間，不慎將依法配置的槍支丟失。沒有及時報告。後槍支被行人撿到 ，上交至當地派出所。丁構成丟失槍支不報罪"}], "answer": ["A"], "explanation_full": "【羿文解析】甲、乙之間交換槍支、彈藥的行為會增加公共危險，只有當交換對象的性能與數量完全相同時 ，才可能認為沒有增加公共危險，因此甲、乙成立非法買賣槍支、彈藥罪。A選項正確。 《刑法》第151條規定了走私武器、彈藥罪，但沒有規定走私爆炸物罪；走私爆炸物的行為，同時觸犯走私普通貨物、物品罪與非法運輸爆炸物罪，宜認定為想象競合犯，從一重罪處罰。B選項錯誤。 《刑法》第269條是關於轉化型搶劫罪的規定，其前提是行為人先行實施了盜竊、搶奪、詐騙普通財物的行為 ，此項規定並不適用於盜竊槍支過程中使用暴力抗拒抓捕的行為，故只能成立一般的轉化型的搶劫罪，但不能認定為搶劫槍支、彈藥罪。故C選項錯誤。 丟失槍支不報罪，是指依法配備公務用槍的人員違反槍支管理規定，丟失槍支不及時報告造成嚴重後果的行為，由於未造成嚴重後果，丁不構成丟失槍支不報罪。D選項錯誤。"}, {"id": "卷一-26", "subject": "卷一", "type": "單選題", "question": "關於共同犯罪，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "甲、乙、丙三人共謀對丁女實施輪姦，共同對丁女實施暴力後，甲、乙實施了姦淫行為.但丙自動地沒有實施姦淫行為。甲、乙成立強姦罪的既遂，同時要適用輪姦加重犯的法定刑，丙成立強姦罪的中止，不對甲、 9 乙二人的輪姦負責"}, {"key": "B", "text": "甲、乙二人共同入戶搶劫，甲捆綁了被害人丙女的手腳，乙在一旁搜尋財物。隨後乙打算強姦丙女，甲發現後沒有進行阻止，甲、乙不僅成立搶劫罪的共犯，還成立強姦罪的共犯"}, {"key": "C", "text": "乙為搶劫路人，用腳猛踢路人腰部將其踢昏，在旁邊偷窺的丙也走向案發現場，在乙的示意下，用重拳猛擊路人腰部。後路人因脾臟破裂而死，但無法查明，脾臟到底系誰打破。乙丙均應當對死亡結果承擔責任"}, {"key": "D", "text": "甲作為幫會骨乾，為考驗幫會新人乙是否是警察，故意將一把沒有實彈的手槍交給乙.讓乙殺丙，乙接受教唆開槍射擊，因沒有實彈而未能致丙死亡。甲的行為屬於未遂犯的教唆犯，可以從輕、減輕處罰"}], "answer": ["B"], "explanation_full": "【羿文解析】輪姦是共同正犯類型的強姦。因為對共同正犯採用部分實行全部責任的原則，所以，丙不僅要對自己的行為結果負責，還要對甲、乙的行為結果負責；既然甲、乙的行為已經造成了侵害結果或者說已經既遂，丙理當對甲、乙的犯罪既遂承擔責任。所以，丙只是放棄了自己的行為，並沒有中止犯罪，不能成立中止。當然，丙放棄姦淫行為的情節，對丙而言是一個十分重要的酌定量刑情節。A選項錯誤。 甲的先前行為使得被害人不能反抗，故甲對乙的強姦行為負有阻止義務，甲不阻止的行為成立不作為的幫助犯。B選項正確。 一方面，乙要對自己踢的那一腳負責，另一方面，丙中途加入後，乙丙屬於共同犯罪，乙還需要對丙打的那一拳負責，故，無論路人的脾臟是被乙踢破還是被丙打破，乙都要負責。丙對自己加人之前乙踢的一腳不負責，只對自己打的一拳負責，在無法查清是踢破還是打破的情況下，應本著存疑有利於被告的原則，不能推定是丙打破的，故丙對死亡不負責。C選項錯誤。 乙的行為在客觀上根本不可能導致丙死亡，是不可罰的不能犯，甲唆使乙實施不可能侵犯法益的行為，是未遂的教唆，正犯不成立犯罪，教唆犯當然也不成立犯罪。D選項錯誤。"}, {"id": "卷一-27", "subject": "卷一", "type": "單選題", "question": "關於不作為犯罪，下列哪一選項是不正確的？（　）", "options": [{"key": "A", "text": "甲在車間工作時，不小心使一根鐵鑽刺入乙的心臟，甲沒有立即將乙送往醫院而是逃往外地。醫院證明 ，即使將乙送往醫院，乙也不可能得到救治。甲不送乙就醫的行為構成不作為犯罪"}, {"key": "B", "text": "甲盜伐樹木時砸中他人，明知不立即救治將致人死亡，仍有意不救。甲不救助傷者的行為構成不作為犯罪"}, {"key": "C", "text": "甲帶鄰居小孩出門，小孩失足跌入糞塘，甲嫌髒不願施救，就大聲呼救，待乙聞聲趕來救出小孩時，小孩死亡。甲不及時救助的行為構成不作為犯罪"}, {"key": "D", "text": "甲亂扔煙頭導致所看倉庫起火，能夠撲救而不救，迅速逃離現場，導致火勢蔓延，財產損失巨大。甲不撲救的行為構成不作為犯罪"}], "answer": ["A"], "explanation_full": "【羿文解析】構成不作為犯，須同時具備三個條件：一是有作為義務，二是有作為能力，三是有因果關係 ，即不作為與危害結果之間存在刑法意義上的因果關係，或者說存在結果迴避的可能性(正是由於行為人的不作為才導致了危害結果的出現)，這在理論上也被稱為不作為與作為的等價性。本案中，“即使將乙送往醫院 ，乙也不可能得到救治”。故甲的行為不成立不作為犯。A選項說法錯誤。 要成立不作為犯，必須要具有作為義務。一般認為，行為人只要創設了風險，均具有作為的義務，先前的犯罪行為創造了風險的，也具有作為義務，可以成立不作為犯，除非刑法有特別規定。本案中，行為人違反森林法的規定，非法采伐樹木，樹木倒下時砸著他人頭部，行為人明知或者應知不立即救助他人就會導致死亡結果，但未予救助。盜伐林木罪或非法采伐國家重點保護植物罪分別是《刑法》第345條與第344條規定的犯罪行為，但第344條、345條並沒有就該兩罪規定死亡結果，換言之，造成死亡的行為以及死亡結果不能評價在盜伐林木罪或非法采伐國家重點保護植物罪中，在這種情況下，應當將盜伐林木或非法采伐國家重點保護植物的犯罪行為，視為導致行為人負有搶救義務的先前行為，從而視案情認定為不作為的故意殺人罪或過失致人死亡罪，與盜伐林木罪或非法采伐國家重點保護植物罪實行並罰。B選項說法正確。 甲將一個未成年人帶出來，創造了風險，當然有救助的義務，在小孩面臨風險時不履行救助義務的，當然成立不作為犯。但需要注意的是，如果甲是帶一個成年人出門，發生了此風險的，甲沒有救助義務，因為成年人之間從事社會正常風險行為，相互之間沒有救助義務。C選項說法正確。 10 的發生的，成立不作為的放火罪。D選項說法正確。"}, {"id": "卷一-28", "subject": "卷一", "type": "單選題", "question": "夜裡，甲乙在黑暗的倉庫裡吵架，甲欲教訓一下乙，情急之下順手拿起旁邊的一根木棍毆打乙，未料木棍頂部裝有尖刀，刺中要害部位，導致乙死亡。下列說法正確的有（　）", "options": [{"key": "A", "text": "甲的行為屬於方法錯誤"}, {"key": "B", "text": "甲的行為屬於狹義的因果關係錯誤"}, {"key": "C", "text": "甲構成故意傷害罪致人死亡"}, {"key": "D", "text": "甲構成故意傷害罪與過失致人死亡罪，想象競合"}], "answer": ["D"], "explanation_full": "【羿文解析】方法錯誤也稱為打擊錯誤，要求存在一個欲害對象，一個實害對象。本題中，只有一個行為對象，就是乙，因此不存在打擊錯誤。A項錯誤。 狹義的因果關係錯誤，例如，甲將乙推下井，欲淹死乙，實際摔死了乙。甲主觀上想殺死乙，客觀上也導致了乙死亡，甲只是對導致死亡的因果歷程有認識錯誤。這表明狹義的因果關係錯誤中，主觀想要的結果和實際發生的結果是同一種結果，只是導致該結果的因果關係與主觀預想的因果關係不一致。由於行為人不需要認識到因果關係的具體樣態、具體死法，因此甲構成故意殺人罪既遂。本題中，甲只是想傷害乙，沒有想殺死乙，主觀想要的結果和實際發生的結果不是同一種結果，因此不屬於狹義的因果關係錯誤。B項錯誤。 甲的故意傷害行為（用木棍）與死亡結果沒有因果關係，甲的過失行為（用尖刀）與死亡結果有因果關係。 要成立故意傷害罪致人死亡，要求故意傷害行為與死亡結果有因果關係，因此甲不構成故意傷害罪致人死亡 ，只構成故意傷害罪。同時，甲的過失行為（用尖刀）與死亡結果有因果關係，因此甲構成過失致人死亡罪 。甲的一個行為既是故意傷害行為，又是過失行為，這是不同角度的觀察結果。本題中，甲的這一個行為同時構成故意傷害罪與過失致人死亡罪，想象競合，擇一重罪論處。故C項錯誤、D項正確。"}, {"id": "卷一-29", "subject": "卷一", "type": "單選題", "question": "《刑法》第238條第1款與第2款分別規定，“非法拘禁他人或者以其他方法非法剝奪他人人身自由的，處三年以下有期徒刑、拘役、管制或者剝奪政治權利。具有毆打、侮辱情節的，從重處罰。”“犯前款罪，致人重傷的，處三年以上十年以下有期徒刑；致人死亡的，處十年以上有期徒刑。使用暴力致人傷殘、死亡的 ，依照本法第二百三十四條、第二百三十二條的規定定罪處罰。”關於該條款的理解，下列哪一選項是不正確的？（　）", "options": [{"key": "A", "text": "第1款所稱\"毆打、侮辱”屬於法定量刑情節"}, {"key": "B", "text": "第2款所稱“犯前款罪，致人重傷”屬於結果加重犯"}, {"key": "C", "text": "非法拘禁致人重傷並具有侮辱情節的，適用第2款的規定，侮辱情節不再是法定的從重處罰情節"}, {"key": "D", "text": "第2款規定的“使用暴力致人傷殘、死亡”，是指非法拘禁行為之外的暴力致人傷殘、死亡"}], "answer": ["C"], "explanation_full": "【羿文解析】刑法明文規定的從重處罰情節，當然屬於法定量刑情節。A項正確。 結果加重犯是指基本犯罪行為本身導致了加重結果，刑法對此作了規定，並且規定了加重的法定刑的，屬於結果加重犯。其罪名沒有變，仍然是非法拘禁罪這一基本罪名。B項正確。 “具有毆打、侮辱情節的，從重處罰”規定的適用範圍，應具體分析。《刑法》第238條第1款是一項基本規定。對非法拘禁的認定，必須符合第1款的規定，換言之，適用第2款的法定刑，以行為符合第1款規定的構成要件為前提。所以，第1款的規定，除法定刑以外，仍然適用於第2款與第3款。基於同樣的理由，“具有毆打 、侮辱情節的，從重處罰”是一項基本規定，應當適用於第2款與第3款。但是，其一，在行為人非法拘禁他人，使用暴力致人傷殘、死亡的情況下，則不能再適用“具有毆打……情節的，從重處罰”的規定。其二 ，在行為人非法拘禁他人，使用暴力致人傷殘、死亡的情況下，是否適用“具有……侮辱情節的，從重處罰 ”的規定，應具體分析。如果侮辱行為表現為暴力侮辱，則不能再適用“具有……侮辱情節的，從重處罰 ”的規定，否則違反了禁止重複評價的原則。如果侮辱行為表現為暴力以外的方式，則應適用“具有……侮辱情節的，從重處罰”的規定。C項錯誤。 此種情形下是應該另外成立故意傷害罪、故意殺人罪，這說明不屬於結果加重犯，即不是基本犯罪行為（拘禁行為）本身導致了加重結果。D項正確。 11"}, {"id": "卷一-30", "subject": "卷一", "type": "單選題", "question": "甲入戶搶劫乙家，欲搶劫乙的普通財物，將乙打暈後，發現乙家有兩把54式手槍，便將普通財物和手槍全部拿走。下列說法不正確的是（　）", "options": [{"key": "A", "text": "甲構成搶劫罪既遂"}, {"key": "B", "text": "甲屬於“入戶搶劫”"}, {"key": "C", "text": "甲構成搶劫槍支罪既遂"}, {"key": "D", "text": "甲構成盜竊槍支罪既遂"}], "answer": ["C"], "explanation_full": "【羿文解析】搶劫槍支罪的行為公式是，帶著搶劫槍支的目的，對被害人實施強制手段，壓製對方反抗，對方因為無法反抗而被迫放棄槍支，行為人因此取得槍支。本題中，甲一開始沒有搶劫槍支的目的，只有搶劫普通財物的目的，帶著這個目的對乙實施了強制手段。這個強制手段只能屬於普通搶劫罪的實行行為，而不能視為搶劫槍支罪的實行行為。由於甲缺少搶劫槍支罪的實行行為也即強制手段，因此甲不構成搶劫槍支罪 。甲拿走槍支的行為，屬於單純的利用搶劫普通財物的強制手段，構成盜竊槍支罪既遂。 甲首先構成普通搶劫罪的既遂，同時符合法定刑升格條件也即入戶搶劫。甲拿走手槍的行為構成盜竊槍支罪既遂。對這兩個罪應當數罪並罰，因為屬於獨立的兩個行為。故ABD項正確、C項錯誤。"}, {"id": "卷一-31", "subject": "卷一", "type": "單選題", "question": "對於某項投標，甲具有投標資質，乙沒有投標資質。在投標時，甲向乙出賣投標資質，每次獲利300萬元 ，兩次共獲利600萬元。在第三次投標時，無人購買甲的投標資質，甲也未申請投標。關於甲的行為認定，下列說法正確的是？", "options": [{"key": "A", "text": "詐騙罪"}, {"key": "B", "text": "強迫交易罪"}, {"key": "C", "text": "串通投標罪"}, {"key": "D", "text": "不構成犯罪"}], "answer": ["D"], "explanation_full": "【羿文解析】甲沒有實施虛構事實、隱瞞真相的詐騙行為，不構成詐騙罪。沒有投標資質的李四購買資質後投標，雖然假冒有資質而獲得了項目，但項目並不屬於財物，也不構成詐騙罪。A項錯誤。 強迫交易罪的成立需要“強迫”要素，亦即違背對方交易人的自由交易意願，本案系雙方自願，當然不構成強迫交易罪。B項錯誤。 串通投標罪的成立，要求有相互串通行為，並且損害招標人或者其他投標人利益、其他人的合法利益的損失結果。本案中甲並未參與投標，只是出賣投標資質，沒有實施串通行為，不構成串通投標罪。C項錯誤。 綜上，甲不構成犯罪，是非法出賣投標資質的行政違法行為，非法獲利應當予以行政沒收。D項正確。"}, {"id": "卷一-32", "subject": "卷一", "type": "單選題", "question": "甲於某日早晨在路邊撿回一名棄嬰，撫養了3個月後，聲稱是自己的親生兒子，以3000元賣給乙。關於甲的行為認定，下列說法正確的是？", "options": [{"key": "A", "text": "構成遺棄罪"}, {"key": "B", "text": "構成拐騙兒童罪"}, {"key": "C", "text": "構成詐騙罪"}, {"key": "D", "text": "構成拐賣兒童罪"}], "answer": ["D"], "explanation_full": "【羿文解析】《兩高一部和全國婦聯關於打擊拐賣婦女兒童犯罪有關問題的通知》第四部分：“出賣親生子女的，由公安機關依法沒收非法所得，並處以罰款；以營利為目的，出賣不滿十四周歲子女，情節惡劣的 ，借收養名義拐賣兒童的，以及出賣撿拾兒童的，均應以拐賣兒童罪追究刑事責任。”故本題正確答案為D項 。"}, {"id": "卷一-33", "subject": "卷一", "type": "單選題", "question": "甲在向乙催要賭債無果的情況下，糾集好友把乙挾持至自己家中，並給乙的家人打電話，聲稱如果再不還錢，就砍掉乙一隻手。關於甲的行為認定，下列說法正確的是？ 12", "options": [{"key": "A", "text": "構成非法拘禁罪"}, {"key": "B", "text": "構成綁架罪"}, {"key": "C", "text": "構成非法拘禁罪和綁架罪的想象競合犯"}, {"key": "D", "text": "構成敲詐勒索罪"}], "answer": ["A"], "explanation_full": "【羿文解析】行為人甲為索取賭債，法律不予保護的債務，而非法扣押、拘禁張某，根據《最高人民法院關於對為索取法律不予保護的債務非法拘禁他人行為如何定罪問題的解釋》規定，構成非法拘禁罪，系索債型的非法拘禁。甲客觀上實施了綁架行為，並且以嚴重暴力威脅家屬（“砍掉張某一隻手”）；但因其主觀上僅有索債目的，而無勒贖目的，不構成綁架罪，只構成非法拘禁罪。A項正確，BC項錯誤。 甲客觀上實施了敲詐行為，但因其主觀上僅有索債目的，而無非法占有目的，不構成敲詐勒索罪，D項錯誤， 甲的行為還觸犯了催收非法債務罪，與非法拘禁罪的基本犯，擇一重處，應以催收非法債務罪論處。"}, {"id": "卷一-34", "subject": "卷一", "type": "單選題", "question": "關於生產、銷售偽劣商品犯罪，下列說法正確的是：（　）", "options": [{"key": "A", "text": "甲是醫生，知道某種感冒藥是以麵粉做成的，但仍然開給病人，甲構成提供假藥罪"}, {"key": "B", "text": "乙在其生產的食品中摻入含有有害成分的偽劣“一滴香”，尚未銷售即被查獲，庫存貨值金額達20余萬元 。乙觸犯了生產、銷售有毒、有害食品罪（未遂）和生產、銷售偽劣產品罪（未遂），應依照處罰較重的規定處罰"}, {"key": "C", "text": "丙銷售未經批准生產、進口的仿製藥品，用以抗擊新冠肺炎，丙構成妨害藥品管理罪"}, {"key": "D", "text": "丁公司生產、銷售劣藥，如果無法證明對人體健康造成嚴重危害的，但只要銷售金額在5萬元以上，就可以直接認定為生產、銷售偽劣產品罪。如果可以證明對人體健康造成嚴重危害的，那就不可能再認定為生產、 銷售偽劣產品罪"}], "answer": ["A"], "explanation_full": "【羿文解析】《刑法修正案（十一）》增加了提供假藥罪：“藥品使用單位的人員明知是假藥而提供給他人使用的，依照前款的規定處罰。”A項正確。 成立生產、銷售有毒、有害食品罪的既遂（有行為即既遂）和生產、銷售偽劣產品罪（未遂），應依照處罰較重的規定處罰。B項錯誤。 未取得藥品相關批准證明文件生產、進口藥品或者明知是國務院藥品監督管理部門禁止使用的藥品而銷售 ，足以嚴重危害人體健康的，構成妨害藥品管理罪，但在本案中並未達到這種具體危險。C項錯誤。 如果可以證明對人體造成了嚴重危害，既構成生產、銷售劣藥罪，又構成生產、銷售偽劣產品罪，從一重罪論處。D項錯誤。"}, {"id": "卷一-35", "subject": "卷一", "type": "單選題", "question": "甲、乙（17周歲）迷戀網絡遊戲，平時經常結伴到網吧上網，時常徹夜不歸。某日，二人共謀到某商店 ，持刀對李某、王某實施搶劫，搶走李某5元現金及手機1部。後將所搶的手機賣掉，所得贓款用於上網，法院判處兩人有期徒刑2年6個月，緩刑3年。關於本案，下列說法正確的有：（　）", "options": [{"key": "A", "text": "如果甲、乙在緩刑考驗期間又犯罪的，應當撤銷緩刑，數罪並罰"}, {"key": "B", "text": "在緩刑期間可同時禁止甲、乙進入網吧，但不得超過36個月"}, {"key": "C", "text": "對兩人應當從輕或減輕處罰"}, {"key": "D", "text": "對兩人適用罰金最低分別不少於1000元"}], "answer": ["A"], "explanation_full": "【羿文解析】在緩刑考驗期犯新罪，應當撤銷緩刑，直接數罪並罰，A項正確。 緩刑可以宣布禁止令，禁止令的期限，既可以與管制執行、緩刑考驗的期限相同，也可以短於管制執行、緩刑考驗的期限，禁止令的執行期限，從管制、緩刑執行之日起計算。B項錯誤。 對不滿18歲的人處罰應當從輕或減輕。題乾中並未明確甲系不滿18周歲的人，C項錯誤。 對未成年人而言，罰金最低不少於500元，D項錯誤。"}, {"id": "卷一-36", "subject": "卷一", "type": "單選題", "question": "甲因涉嫌詐騙和故意殺害被某市公安機關並案偵查，後由某市檢察院審查起訴，甲表示認罪認罰，下列表專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 13 述正確的有：（　）", "options": [{"key": "A", "text": "對詐騙罪可以適用認罪認罰從寬制度，但對故意殺人罪不可以適用認罪認罰從寬制度"}, {"key": "B", "text": "若甲在偵查階段和起訴階段拒絕認罪認罰，在審判階段表示認罪認罰，法院不得對甲適用認罪認罰從寬制度"}, {"key": "C", "text": "若甲對詐騙罪認罪認罰，但對故意殺人罪拒絕認罪認罰，則不得對甲適用認罪認罰從寬制度"}, {"key": "D", "text": "甲認罪認罰的，法院不得判處其死刑"}], "answer": ["C"], "explanation_full": "【羿文解析】認罪認罰從寬制度沒有適用罪名和可能判處刑罰的限定，所有刑事案件都可以適用。本案中 ，甲涉嫌的詐騙罪和故意殺人罪均可以適用認罪認罰從寬制度，A項錯誤。 認罪認罰從寬制度貫穿刑事訴訟全過程，適用於偵查、起訴、審判各個階段。本案中，甲雖然在審前階段不認罪，但在審判階段認罪認罰的，仍然可以對其適用認罪認罰從寬制度，當然，在量刑方面，早認罪認罰比晚認罪認罰要更有優勢。B項錯誤。 犯罪嫌疑人犯數罪，僅如實供述其中一罪，全案不作“認罪”的認定，不適用認罪認罰從寬制度。本案中 ，甲涉嫌詐騙罪和故意殺人罪兩罪，但甲僅對詐騙罪認罪認罰，對故意殺人罪拒絕認罪認罰，對甲不得適用認罪認罰從寬制度，C項正確。 被告人認罪認罰的，法院“可以”從寬處罰。可以從寬不是一律從寬，對犯罪性質和危害後果特別嚴重、犯罪手段特別殘忍、社會影響特別惡劣的犯罪嫌疑人、被告人，認罪認罰不足以從輕處罰的，依法不予從寬處罰。本案中，甲若故意殺害孫小希的行為性質、後果特別嚴重，手段特別殘忍、影響特別惡劣，法院無需對甲從寬處罰，仍然有可能判處甲死刑。D項錯誤。"}, {"id": "卷一-37", "subject": "卷一", "type": "單選題", "question": "甲因故意傷害乙被立案偵查，後由檢察院起訴至法院。關於乙的訴訟權利，下列表述正確的有：（　）", "options": [{"key": "A", "text": "甲若積極賠償並取得了乙的諒解，乙有權撤回起訴"}, {"key": "B", "text": "在審查起訴階段，若通知乙作證，檢察機關應當為其補助交通住宿等費用"}, {"key": "C", "text": "若檢察院作出不起訴決定，乙不服，有權向上一級檢察院申訴"}, {"key": "D", "text": "若法院經過審理判決甲無罪，乙有權向上一級法院上訴"}], "answer": ["C"], "explanation_full": "【羿文解析】故意傷害罪為公訴案件，一旦啟動公訴，被害人無權撤回起訴。A項錯誤。 對於證人，應當補助交通、住宿、就餐等費用，但對於被害人無需補助，B項錯誤。 檢察院不起訴的，被害人有權自收到不起訴決定書起7日內向作出不起訴決定的上一級檢察院申訴，C項正確 。 公訴案件中，被害人對一審判決不服，沒有上訴、抗訴資格，只能申請檢察院抗訴。D項錯誤。"}, {"id": "卷一-38", "subject": "卷一", "type": "單選題", "question": "李某原系甲縣人民法院審判員，2015年5月辭職，2016年1月加入乙縣某律師事務所成為專職律師，其同胞兄弟於2015年1月至今擔任乙縣法院副院長。下列案件中李某不可以擔任辯護人的有：（　）", "options": [{"key": "A", "text": "2017年1月，甲縣法院審理的其子故意傷害案"}, {"key": "B", "text": "2018年7月，甲縣法院審理的其表弟受賄案"}, {"key": "C", "text": "2017年1月，乙縣法院審理的其好友貪污案"}, {"key": "D", "text": "2018年1月，乙縣法院審理的其好友詐騙案"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《刑訴解釋》第41條第2款的規定：審判人員和人民法院其他工作人員從人民法院離任後 ，不得擔任原任職法院所審理案件的辯護人，但系被告人的監護人、近親屬的除外。因此，A項中為其子辯護是可以的，B項中為其表弟辯護（非近親屬）是不行的。 根據《刑訴解釋》第41條第1款的規定，審判人員和人民法院其他工作人員從人民法院離任後二年內，不得以律師身份擔任辯護人。離職後已滿3年，且不在原任職法院，所以D選項是可以的。 擔任辯護人既可以以律師身份，也可以以非律師身份，即《刑事訴訟法》第33條中的“（二）人民團體或者犯罪嫌疑人、被告人所在單位推薦的人；（三）犯罪嫌疑人、被告人的監護人、親友”。結合《刑訴解釋》 14 第41條第1款的規定來看，審判人員和人民法院其他工作人員從人民法院離任後二年內，不得以律師身份擔任辯護人。也只是禁止以律師身份擔任辯護人，如果是非律師身份，比如C項中的\"好友”，也是可以的。所以 C項正確。"}, {"id": "卷一-39", "subject": "卷一", "type": "單選題", "question": "甲系某演藝公司總經理，經常組織賣淫活動，甲及其公司被追究刑事責任，下列表述正確的有：（　）", "options": [{"key": "A", "text": "可以由甲擔任訴訟代表人"}, {"key": "B", "text": "若某演藝公司委託會計乙擔任訴訟代表人，乙經過法院通知拒不到庭的，法院可以拘傳"}, {"key": "C", "text": "為了保障裁判的執行，法院對某演藝公司的財產應當先行查封、扣押、凍結"}, {"key": "D", "text": "在庭審中，若某演藝公司進入破產程序，對該公司仍應追究責任"}], "answer": ["D"], "explanation_full": "【羿文解析】甲系某演藝公司主要負責人，原則上應當由甲擔任訴訟代表人。但由於甲本人需要被追究刑事責任，應當由某演藝公司另行委託訴訟代表人或者由檢察院另行確定訴訟代表人，A項錯誤。 由單位的法定代表人、實際控制人或者主要責任人擔任訴訟代表人的，若經過法院傳喚拒不到庭，可以拘傳 。但本案中，乙系某演藝公司會計，不是單位的法定代表人、實際控制人或者主要負責人，法院對乙不能使用拘傳措施，B項錯誤。 對於單位的非法財產，應當予以追繳，應當查封、扣押、凍結。但對於單位的其他財產，可以先行查封、扣押、凍結，若單位提供擔保的，也可以不進行查封、扣押、凍結。本題中，只是泛泛地說“某演藝公司的財產”，沒有明確該財產為非法財產，因此，可以視情況先行查封、扣押、凍結，但不是應當先行查封、扣押 、凍結。C項錯誤。 某演藝公司進入破產程序，但只要沒有完成註銷、撤銷登記，該單位仍然存在，仍需被追究責任，D項正確。"}, {"id": "卷一-40", "subject": "卷一", "type": "單選題", "question": "張某、李某二人酒後偶遇精神病人吳某，為發泄情緒，對其隨意毆打，致其輕傷，花去治療費用1萬元。 案發後，李某逃匿，張某被抓獲並被檢察院以涉嫌尋釁滋事罪提起公訴。關於本案，下列哪一說法是正確的 ？（　）", "options": [{"key": "A", "text": "如張某提出申請，法院可組織張某與吳某的近親屬進行刑事和解"}, {"key": "B", "text": "如吳某的近親屬提起附帶民事訴訟，可將張某和李某列為附帶民事訴訟的被告"}, {"key": "C", "text": "如吳某的近親屬提起附帶民事訴訟後，經傳喚，無正當理由拒不到庭，法院應按撤訴處理"}, {"key": "D", "text": "如法院審理後認為張某行為不構成犯罪，對提起的附帶民事訴訟應裁定駁回起訴"}], "answer": ["C"], "explanation_full": "【羿文解析】尋釁滋事罪是《刑法》第六章的罪名，不屬於刑事和解（《刑法》第四章、第五章）的案件範圍，A項錯誤。 根據《刑訴解釋》第183條規定，共同犯罪案件，同案犯在逃的，不應列為附帶民事訴訟被告人。B項錯誤。 根據《刑訴解釋》第195條第1、2款的規定，附帶民事訴訟原告人經傳喚，無正當理由拒不到庭，或者未經法庭許可中途退庭的，應當按撤訴處理。刑事被告人以外的附帶民事訴訟被告人經傳喚，無正當理由拒不到庭 ，或者未經法庭許可中途退庭的，附帶民事部分可以缺席判決。C項正確。 根據《刑訴解釋》第197條的規定，人民法院認定公訴案件被告人的行為不構成犯罪，對已經提起的附帶民事訴訟，經調解不能達成協議的，可以一併作出刑事附帶民事判決，也可以告知附帶民事原告人另行提起民事訴訟。人民法院准許人民檢察院撤回起訴的公訴案件，對已經提起的附帶民事訴訟，可以進行調解；不宜調解或者經調解不能達成協議的，應當裁定駁回起訴，並告知附帶民事訴訟原告人可以另行提起民事訴訟。因此，D項錯誤。"}, {"id": "卷一-41", "subject": "卷一", "type": "單選題", "question": "關於鑒定人的有關程序，下列表述正確的是：（　）", "options": [{"key": "A", "text": "鑒定人應當出庭作證，否則該鑒定意見不能作為定案依據"}, {"key": "B", "text": "鑒定人必須是沒有利害關係的人，否則該鑒定意見不能作為定案依據"}, {"key": "C", "text": "鑒定人猜測性、評論性、推斷性的意見，不得作為定案依據"}, {"key": "D", "text": "經人民法院通知，鑒定人拒不■庭作證的，法院可以強制其到庭，鑒定人由於不能抗拒的原因或者有其他專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 15 正當理由無法出庭的，人民法院可以根據情況決定延期審理或者重新鑒定"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《刑事訴訟法》第192條第3款的規定，公訴人、當事人或者辯護人、訴訟代理人對鑒定意見有異議，人民法院認為鑒定人有必要出庭的，鑒定人應當出庭作證。經人民法院通知，鑒定人拒不出庭作證的，鑒定意見不得作為定案的根據。可知鑒定人並非必須出庭作證。只有當鑒定人應當出庭，而拒不出庭時，鑒定意見才不得作為定案的根據。選項A錯誤。 根據《刑訴解釋》第98條的規定，鑒定意見具有下列情形之一的，不得作為定案的根據：①鑒定機構不具備法定資質，或者鑒定事項超出該鑒定機構業務範圍、技術條件的；②鑒定人不具備法定資質，不具有相關專業技術或者職稱，或者違反迴避規定的；③送檢材料、樣本來源不明，或者因污染不具備鑒定條件的；④鑒定對象與送檢材料、樣本不一致的；⑤鑒定程序違反規定的；⑥鑒定過程和方法不符合相關專業的規範要求的；⑦鑒定文書缺少簽名、蓋章的；⑧鑒定意見與案件事實沒有關聯的；⑨違反有關規定的其他情形。根據上述第2項的規定可知，鑒定人違反迴避規定的，該鑒定意見不能作為定案依據。選項B正確。 鑒定人是指接受公安司法機關的指派或者聘請，運用自己的專門知識或者技能對刑事案件中的專門性問題進行分析判斷並提出書面鑒定意見的人。根據《刑訴解釋》第88條第2款的規定，證人的猜測性、評論性、推斷性的證言，不得作為證據使用，但根據一般生活經驗判斷符合事實的除外。上述意見證據規則，只是限制證人，並不限制鑒定人。選項C錯誤。 根據《刑訴解釋》第99條的規定，經人民法院通知，鑒定人拒不出庭作證的，鑒定意見不得作為定案的根據 。鑒定人由於不能抗拒的原因或者有其他正當理由無法出庭的，人民法院可以根據情況決定延期審理或者重新鑒定。鑒定人無正當理由拒不出庭作證的，人民法院應當通報司法行政機關或者有關部門。可知，對鑒定人拒不出庭作證的，鑒定意見不得作為定案的根據，而非強制到庭。選項D錯誤。"}, {"id": "卷一-42", "subject": "卷一", "type": "單選題", "question": "李某涉嫌詐騙罪被某縣法院判決無罪。李某沒有上訴，某縣檢察院也沒有抗訴，案件生效。一年後，某縣檢察院發現了李某實施詐騙的新證據，下列選項正確的是？（　）", "options": [{"key": "A", "text": "某縣檢察院通知某縣法院啟動審判監督程序"}, {"key": "B", "text": "某縣檢察院向某縣法院提出檢察建議，建議某縣法院撤銷原判"}, {"key": "C", "text": "某縣檢察院向上一級檢察院提請抗訴"}, {"key": "D", "text": "某縣檢察院向某縣法院提出檢察建議，建議某縣法院改判"}], "answer": ["C"], "explanation_full": "【羿文解析】與終審法院同級的檢察院若發現該法院生效裁判確有錯誤，自己無權啟動再審抗訴，認為需要提出抗訴的，應當提請上一級人民檢察院抗訴。本案中，案件由某縣法院作出判決後，沒有上訴，沒有抗訴 ，案件已經生效。某縣檢察院一年後發現該案確有錯誤，此時只能報請上一級檢察院即某市檢察院向某市中級法院再審抗訴。C選項正確。向法院提出再審的通知、建議等，沒有法律根據。綜上所述，本題應當選C。"}, {"id": "卷一-43", "subject": "卷一", "type": "單選題", "question": "關於強制措施中的拘傳，下列說法正確的是：（　）", "options": [{"key": "A", "text": "公安機關、人民檢察院和人民法院在刑事訴訟過程中，均有權決定和執行拘傳"}, {"key": "B", "text": "拘傳適用於所有當事人，拘傳時必須出示拘傳證"}, {"key": "C", "text": "公安機關根據案件情況對需要拘傳的犯罪嫌疑人，可以拘傳至辦案機關所在市、縣內的指定地點進行訊問"}, {"key": "D", "text": "一次拘傳的時間不得超過24小時，案情特別重大、複雜，需要釆取拘留、逮捕措施的，拘傳持續的時間不得超過48小時"}], "answer": ["A"], "explanation_full": "【羿文解析】拘傳是指公安機關、人民檢察院和人民法院對未被羈押的犯罪嫌疑人、被告人，依法強制其到案接受訊問的一種強制措施。 公安機關、人民檢察院和人民法院在刑事訴訟過程中，均有權決定適用。選項A正確。 16 對犯罪嫌疑人、被告人，對其他當事人不可採取強制措施。選項B錯誤。 根據《公安部規定》第78條的規定，公安機關根據案件情況對需要拘傳的犯罪嫌疑人，或者經過傳喚沒有正當理由不到案的犯罪嫌疑人，可以拘傳到其所在市、縣公安機關執法辦案場所進行訊問。需要拘傳的，應當填寫呈請拘傳報告書，並附有關材料，報縣級以上公安機關負責人批准。可知，公安機關只能將犯罪嫌疑人拘傳至犯罪嫌疑人所在市、縣指定地點，而不是辦案機關所在市、縣的指定地點。選項C錯誤。 根據《公安部規定》第80條第1款的規定，拘傳持續的時間不得超過12小時；案情特別重大、複雜，需要採取拘留、逮捕措施的，經縣級以上公安機關負責人批准，拘傳持續的時間不得超過24小時。不得以連續拘傳的形式變相拘禁犯罪嫌疑人。選項D錯誤。"}, {"id": "卷一-44", "subject": "卷一", "type": "單選題", "question": "關於人民法院在審理案件中對相關情形的處理，下列說法正確的是：（　）", "options": [{"key": "A", "text": "檢察院對張某盜竊一案以盜竊罪起訴到法院，人民法院認為本案事實清楚，證據充分，但是法院認為本案應當定搶奪罪而非盜竊罪，人民法院直接以搶奪罪定罪處罰"}, {"key": "B", "text": "某縣人民法院審理羅某強姦案時，發現被告人還有詐騙的犯罪事實沒有起訴。對此，人民法院應當建議檢察院補充起訴"}, {"key": "C", "text": "某縣人民法院審理向某盜竊案時，發現被告人盜竊後還有暴力抗拒抓捕的行為。對此，人民法院可以直接以搶劫罪定罪處罰"}, {"key": "D", "text": "人民法院審理檢察院指控的殷某盜竊罪，經過審理認為屬於侵占罪，法院直接以侵占罪定罪處罰"}], "answer": ["A"], "explanation_full": "【羿文解析】根據《刑訴解釋》第295條第1款第2項的規定，對第一審公訴案件，人民法院審理後，認為起訴指控的事實清楚，證據確實、充分，但指控的罪名不當的，應當依據法律和審理認定的事實作出有罪判決。 選項A正確。 根據《刑訴解釋》第297條第1款的規定，審判期間，人民法院發現新的事實，可能影響定罪量刑的，或者需要補查補證的，應當通知人民檢察院，由其決定是否補充、變更、追加起訴或者補充偵查。可知，選項BC錯誤。 根據《刑事訴訟法》第16條的規定，有下列情形之一的，不追究刑事責任，已經追究的，應當撤銷案件，或者不起訴，或者終止審理，或者宣告無罪：①情節顯著輕微、危害不大，不認為是犯罪的；②犯罪已過追訴時效期限的；③經特赦令免除刑罰的；④依照刑法告訴才處理的犯罪，沒有告訴或者撤回告訴的；⑤犯罪嫌疑人、被告人死亡的；⑥其他法律規定免予追究刑事責任的。又根據《刑法》第270條第3款的規定，侵占罪 ，告訴的才處理。可知，在審判階段發現本案屬於告訴才處理的犯罪，沒有告訴的，應當裁定終止審理。選項D錯誤。"}, {"id": "卷一-45", "subject": "卷一", "type": "單選題", "question": "下列哪一選項符合合理行政原則要求？（　）", "options": [{"key": "A", "text": "復議機關區政府允許申請人甲查閱被申請人的書面答覆"}, {"key": "B", "text": "國稅局因乙企業主動消除違法行為危害後果而對其從輕處罰"}, {"key": "C", "text": "省人大常委會立法賦予文化行政主管部門扣押違禁品的權力"}, {"key": "D", "text": "規劃局一次告知申請人丙補正全部申請材料的內容"}], "answer": ["B"], "explanation_full": "【羿文解析】A選項符合程序正當原則要求。該原則的第一項內容即是行政公開原則，要求除涉及國家秘密和依法受到保護的商業秘密、個人隱私外，行政機關實施行政管理應當公開，以實現公民的知情權。A選項不當選。 B選項符合合理行政原則的要求。該原則的第二項內容是考慮相關因素原則，即行政機關作出行政決定和進行行政裁量，只能考慮符合立法授權目的的各種因素，不得考慮不相關因素。B選項中，國稅局在對乙企業作出處罰時，依照《行政處罰法》第32條有關從輕處罰的規定（主動消除或者減輕違法行為危害後果的），對其從輕處罰，符合合理行政原則要求，當選。 C選項符合權責統一原則要求。該原則的第一項內容為行政效能原則，即為保證行政機關完成管理經濟、社會和文化事務的職責，需要立法賦予其必要的管理手段。C選項不當選。 17 D選項符合高效便民原則要求。該原則的第二項內容為便利當事人原則，即在實施行政行為時，行政機關應盡量為相對人提供各種便利條件，減輕當事人辦事的成本和負擔。D選項不當選。"}, {"id": "卷一-46", "subject": "卷一", "type": "單選題", "question": "某市衛生健康委員會二級巡視員王某某在新型冠狀肺炎疫情防控工作中嚴重失職失責，造成嚴重不良影響 ，由市監察委員會給予其政務撤職處分。關於王某某的二級巡視員，下列哪一項說法是正確的？（　）", "options": [{"key": "A", "text": "屬於公務員領導職務"}, {"key": "B", "text": "屬於公務員職級"}, {"key": "C", "text": "屬於公務員級別"}, {"key": "D", "text": "不屬於公務員"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《公務員法》第17條的規定，國家實行公務員職務與職級並行制度，根據公務員職位類別和職責設置公務員領導職務、職級序列。《公務員法》第19條第2款規定，綜合管理類公務員職級序列分為 ：一級巡視員、二級巡視員、一級調研員、二級調研員、三級調研員、四級調研員、一級主任科員、二級主任科員、三級主任科員、四級主任科員、一級科員、二級科員。因此，王某某的二級巡視員屬於公務員的職級。故B選項正確。"}, {"id": "卷一-47", "subject": "卷一", "type": "單選題", "question": "審判監督程序的審理對象是已經發生法律效力的判決、裁定，包括正在執行和已經執行完畢的判決、裁定 ，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "申訴人包括當事人及其法定代理人、案外人和經當事人授權的近親屬"}, {"key": "B", "text": "對死刑案件的申訴，可以由原核准的人民法院直接處理，也可以交由原審人民法院處理"}, {"key": "C", "text": "人民法院決定再審的案件，需要對被告人採取強制措施的，由人民法院依法決定；人民檢察院提出抗訴的再審案件，需要對被告人採取強制措施的，由人民檢察院依法決定"}, {"key": "D", "text": "開庭審理再審案件，再審決定書或者抗訴書只針對部分原審被告人，其他同案原審被告人也要出庭"}], "answer": ["C"], "explanation_full": "【羿文解析】《刑訴解釋》第451條：“當事人及其法定代理人、近親屬對已經發生法律效力的判決、裁定提出申訴的，人民法院應當審查處理。案外人認為已經發生法律效力的判決、裁定侵害其合法權益，提出申訴的，人民法院應當審查處理。申訴可以委託律師代為進行。”由於當事人及其法定代理人、近親屬與案件的結局有直接的利害關係，為維護其合法權益，法律賦予了他們對已經發生法律效力的判決、裁定提出申訴的權利。因此當事人近親屬不必經過授權就能申訴。A選項錯誤。 《刑事訴訟法解釋》第455條規定：“對死刑案件的申訴，可以由原核准的人民法院直接處理，也可以交由原審人民法院審查”。向原審人民法院審查的(注意：只能審查不能處理)，原審人民法院應當寫出審查報告 ，提出處理意見，層報原核准的人民法院審查處理。(注意：如是死刑案件，則核准法院視為終審法院)。B選項錯誤。 《刑事訴訟法》第257條規定，人民法院決定再審的案件，需要對被告人採取強制措施的，由人民法院依法決定；人民檢察院提出抗訴的再審案件，需要對被告人採取強制措施的，由人民檢察院依法決定；依據誰啟動再審，誰來決定採取強制措施。C選項正確。 《刑事訴訟法解釋》第468條規定，開庭審理再審案件，再審決定書或者抗訴書只針對部分原審被告人，其他同案原審被告人不出庭不影響審理的，可以不出庭參加訴訟。D選項錯誤。"}, {"id": "卷一-48", "subject": "卷一", "type": "單選題", "question": "關於行政法規，下列說法正確的是？（　）", "options": [{"key": "A", "text": "國務院制定某個經濟類行政法規，應當按照有關規定及時報告黨中央"}, {"key": "B", "text": "國務院法制機構擬訂的國務院年度立法工作計劃，報國務院批准後即可向社會公布"}, {"key": "C", "text": "行政法規可以委託有關專家進行起草"}, {"key": "D", "text": "國務院有關部門對行政法規送審稿涉及的主要制度有不同意見的，應當報國務院決定"}], "answer": ["C"], "explanation_full": "18 行政法規，只有涉及重大體制和重大政策調整的重要行政法規，才應當將行政法規草案或者行政法規草案涉及的重大問題按照有關規定及時報告黨中央。A選項錯誤。 國務院法制機構擬訂的國務院年度立法工作計劃，報黨中央、國務院批准後向社會公布。注意不可直接向社會公布，也不是僅經過國務院批准後就可以公布，還需要黨中央批准。B選項錯誤。 起草專業性較強的行政法規，起草部門可以吸收相關領域的專家參與起草工作，或者委託有關專家、教學科研單位、社會組織起草。所以，C選項表述符合科學立法的要求，正確。 國務院有關部門對行政法規送審稿涉及的主要制度、方針政策、管理體制、權限分工等有不同意見的，經過充分協調不能達成一致意見的，國務院法制機構、起草部門應當將爭議的主要問題、有關部門的意見以及國務院法制機構的意見及時報國務院領導協調，或者報國務院決定。D選項有兩處錯誤:第一。不能直接上報國務院，經過充分協調不能達成一致意見才可以上報:第不一定必須上報國務院決定，還可以及時報國務院領導協調。D選項錯誤。"}, {"id": "卷一-49", "subject": "卷一", "type": "單選題", "question": "阿寶向區市監局申請食品經營許可證，區市監局工作人員發現阿寶遞交的材料系偽造。對此，下列說法正確的是？（　）", "options": [{"key": "A", "text": "市監局應當吊銷食品經營許可證"}, {"key": "B", "text": "市監局應該給予阿寶警告處罰"}, {"key": "C", "text": "阿寶3年之內不得再次申請該項行政許可"}, {"key": "D", "text": "市監局應當撤銷食品經營許可證"}], "answer": ["B"], "explanation_full": "【羿文解析】吊銷許可證是當事人在合法取得許可後，從事了許可證所禁止的活動，構成嚴重違法，行政機關因此對其作出的行政處罰。本題中，阿寶尚未取得食品經營許可證，不存在吊銷的問題，故A選項錯誤。 《行政許可法》第78條規定：行政許可申請人隱瞞有關情況或者提供虛假材料申請行政許可的，行政機關不予受理或者不予行政許可，並給予警告；行政許可申請屬於直接關係公共安全、人身健康、生命財產安全事項的，申請人在一年內不得再次申請該行政許可。可知，阿寶通過遞交偽造的材料申請食品經營許可證的 ，行政機關可以不予受理或者不予許可，並給予警告處罰，故B選項正確。 如果申請人已經取得的許可直接關係公共安全、人身健康、生命財產安全，禁止3年內申請該許可。如果申請人在許可審查過程中就發現申請人隱瞞有關情況或提供虛假材料，且申請的該項許可系直接關係公共安全、 人身健康、生命財產安全，則禁止1年內申請該許可。本案中阿寶尚在申請許可的過程中被發現偽造申請材料 ，因此是1年內而不是3年內不得再次申請該項行政許可。故C選項錯誤。 《行政許可法》第69條第2款規定：被許可人以欺騙、賄賂等不正當手段取得行政許可的，應當予以撤銷。本題中，阿寶還沒有獲得食品經營許可證，不存在撤銷經營許可證的問題，故D選項錯誤。"}, {"id": "卷一-50", "subject": "卷一", "type": "單選題", "question": "下列當事人提起的訴訟，哪一選項不屬於行政訴訟受案範圍？（　）", "options": [{"key": "A", "text": "某造紙廠向市水利局申請發放取水許可證，市水利局作出不予許可決定，該廠不服而起訴"}, {"key": "B", "text": "食品藥品監管局向申請餐飲服務許可證的李某告知補正申請材料的通知，李某認為通知內容違法而起訴"}, {"key": "C", "text": "化肥廠附近居民要求環保局提供對該廠排污許可證監督檢查記錄，遭到拒絕後起訴"}, {"key": "D", "text": "某國土資源局以建城市綠化帶為由撤回向一公司發放的國有土地使用權證，該公司不服而起訴"}], "answer": ["B"], "explanation_full": "【羿文解析】處分性的含義為“必然影響當事人權利義務”的意思表示。這裡的“影響”，包括主觀和客觀兩個維度，主觀上有影響當事人權利義務的目的，客觀上產生了影響當事人權利義務的效果，處分性的影響一定要“主客觀相統一”。 某造紙廠向市水利局申請發放取水許可證，市水利局作出不予許可決定，這個不予許可的決定剝奪了當事人獲得許可，從事該許可活動的機會，影響了相對人造紙廠的權利義務，因此A項屬於行政訴訟受案範圍。。 19 最終性，不必然影響權利義務，一般不可訴。只有等整個許可程序完結，作出准予許可或不予許可決定時才可以起訴。行政機關只是告知當事人補正材料，又沒有確定性地拒絕當事人的許可申請，所以，B項不屬於行政訴訟受案範圍。 化肥廠附近居民要求環保局提供對該廠排污許可證監督檢查記錄，遭到拒絕，該拒絕行為侵犯了要求公開這些特定信息的居民的知情權，處分了當事人的權利義務，對於該行政不作為當事人可以提起行政信息公開之訴。C項屬於行政訴訟受案範圍。 某國土資源局以建城市綠化帶為由撤回向一公司發放的國有土地使用權證，撤回許可證是獨立的具體行政行為，滿足具體行政行為特定性(對象為該公司)、處分性(撤回後當事人無法繼續使用該片土地)、外部性(該公司與國土局沒有任何內部關係)和行政性的四大特性，應當屬於受案範圍。D項屬於受案範圍。 多項選擇題"}, {"id": "卷一-51", "subject": "卷一", "type": "多選題", "question": "完善立法體制是社會主義法治建設的重要環節，關於立法體制下列哪些說法是正確的？", "options": [{"key": "A", "text": "推進科學立法、民主立法，是提高立法質量的根本途徑"}, {"key": "B", "text": "要完善立法體制必須禁止所有地方制定和發布帶有立法性質的文件"}, {"key": "C", "text": "增加有法治實踐經驗的專職常委比例，依法建立健全專門委員會、工作委員會立法專家顧問制度。"}, {"key": "D", "text": "科學立法的核心在於尊重和體現客觀規律，民主立法的核心在於為了人民依靠人民"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】科學立法、民主立法是提高立法質量的根本途徑，科學立法實質是要解決“立什麼樣的法”問題，民主立法實質是要解決“怎樣立法”問題，科學立法與民主立法相輔相成，只有堅持科學立法、民主立法，才能確保每一項立法都符合憲法精神，反映人民意志，得到人民擁護。故A選項正確。 根據《立法法》規定，省、自治區、直轄市和設區的市、自治州兩級享有立法權，《中共中央關於全面推進依法治國若干重大問題的決定》明確要求：禁止地方制定和發布帶有立法性質的文件。該表述的核心是禁止沒有立法權的地方制定和發布帶有立法性質的文件。即，防止沒有立法權的地方以紅頭文件的形式變相立法 。故B選項錯誤。 《中共中央關於全面推進依法治國若干重大問題的決定》明確要求：增加有法治實踐經驗的專職常委比例。 依法建立健全專門委員會、工作委員會立法專家顧問制度。故C選項正確。 科學立法的核心，在於立法要尊重和體現客觀規律。在具體立法實踐中，要進一步完善立法程序、規範立法活動，健全中國特色的立法體制。抓好立法項目論證，科學確定立法項目，健全法律■台前評估和立法後評估制度。綜合運用制定、修改、廢止、解釋等多種形式，增強立法工作的協調性、及時性、系統性。加強立法調查研究，找準立法重點難點，探求科學應對之策，切實增強法律的可執行性和可操作性。民主立法的核心，在於立法要為了人民、依靠人民。在具體立法實踐中，要進一步完善立法機關主導，有關部門參加，人大代表、專家學者、企事業單位、團體組織和人民群眾共同參與的立法工作機制。健全公布法律草案徵求意見機制和公眾意見採納情況反饋機制，重視網絡民意表達，拓展公民有序參與立法途徑。發揮人大代表在立法工作中的作用，把審議代表議案、辦理代表建議同制定和修改法律緊密結合起來，認真研究吸納代表提出的意見。完善法律起草、審議的協調協商機制，廣泛聽取、認真對待各方面意見包括不同意見，充分尊重、 合理吸收各種建設性意見和建議，最大限度地凝聚社會共識。故D選項正確。"}, {"id": "卷一-52", "subject": "卷一", "type": "多選題", "question": "要堅持抓住領導幹部這個“關鍵少數”，堅持抓住領導幹部這個“關鍵少數”是實現全面依法治國目標任務的關鍵所在。下列有關的說法中，正確的是？", "options": [{"key": "A", "text": "領導幹部是全面推進依法治國的重要組織者、推動者、實踐者，是全面依法治國的關鍵"}, {"key": "B", "text": "領導幹部必須做守法的模範，牢記法律紅線不可逾越、法律底線不可觸碰"}, {"key": "C", "text": "領導幹部要善於用法治思維謀劃工作，用法治方式處理問題"}, {"key": "D", "text": "要賦予領導幹部更多的權力，強化領導幹部的權威性"}], "answer": ["A", "B", "C"], "explanation_full": "20 “關鍵少數”。A選項正確。 領導幹部應做尊法學法守法用法的模範，尊崇法治、敬畏法律，是領導幹部必須具備的基本素質。領導幹部必須做用法的模範，帶頭厲行法治、依法辦事，真正做到在法治之下、而不是法治之外、更不是法治之上想問題、作決策、辦事情。B選項正確。 領導幹部要提高法治思維和依法辦事能力，領導幹部要守法律、重程序，帶頭營造辦事依法、遇事找法、解決問題用法、化解矛盾靠法的法治環境，善於用法治思維謀劃工作，用法治方式處理問題。C選項正確。 要把權力關進制度的籠子裡，應當強化對權力的監督和制約，規範、制約並監督領導幹部權力的使用，要牢記職權法定，牢記權力來自哪裡、界線劃在哪裡，做到法定職責必須為、法無授權不可為。讓尊法學法守法用法成為領導幹部的自覺行為和必備素質。D選項錯誤。"}, {"id": "卷一-53", "subject": "卷一", "type": "多選題", "question": "習近平法治思想的核心要義之一是堅持依憲治國、依憲執政。對此，下列哪些選項的說法是不正確的 ？（　）", "options": [{"key": "A", "text": "堅持依憲治國科學回答了憲法如何更好促進全面建設社會主義現代化國家的關鍵性問題"}, {"key": "B", "text": "堅持依憲治國、依憲執政，這是推進全面依法治國的地位和作用決定的"}, {"key": "C", "text": "堅持依憲治國，既強調憲法的根本法地位，又強調在全面依法治國過程中依憲執政"}, {"key": "D", "text": "依憲治國、依憲執政是建設社會主義法治國家的根本任務"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】習近平總書記指出：“憲法是國家的根本法，堅持依法治國首先要堅持依憲治國，堅持依法執政首先要堅持依憲執政。”堅持依憲治國，是推進全面依法治國、建設社會主義法治國家的基礎性工作，科學回答了憲法如何更好促進全面建設社會主義現代化國家的關鍵性問題（A項正確）。堅持依法治國首先要堅持依憲治國，堅持依法執政首先要堅持依憲執政，這是憲法的地位和作用決定的（B項錯誤）。堅持依憲治國 ，既強調憲法的根本法地位，又強調在全面依法治國過程中，必須依據憲法精神、憲法原則以及憲法所確定的各項制度推進依法治理（C項錯誤）。 依憲治國、依憲執政是建設社會主義法治國家的首要任務（D項錯誤）。"}, {"id": "卷一-54", "subject": "卷一", "type": "多選題", "question": "《唐律疏議》又稱《永徽律疏》，是唐高宗永徽年間完成的一部極為重要的法典。下列關於《唐律疏議》 的表述哪些是正確的？", "options": [{"key": "A", "text": "是由張斐、杜預完成的"}, {"key": "B", "text": "法律注釋引用儒家經典作為律文的理論依據"}, {"key": "C", "text": "奠定了中華法系的傳統"}, {"key": "D", "text": "對唐代的《武德律》等法典有很深的影響"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】由張斐、杜預完成法律注釋的是《晉律》，因此A項錯誤。 《唐律疏議》又稱為《永徽律疏》，其不僅對主要的法律原則和制度作了精確的解釋與說明，而且盡可能引用儒家經典作為律文的理論根據。B項正確。 《永徽律疏》全面體現了中國古代法律制度的水平、風格和基本特徵，成為中華法系的代表性法典。C項正確 。 《武德律》是唐代的首部法典，《永徽律疏》頒行在後。因此，D項錯誤。"}, {"id": "卷一-55", "subject": "卷一", "type": "多選題", "question": "下列哪些屬於清末頒行的商事法律？", "options": [{"key": "A", "text": "欽定大清商律"}, {"key": "B", "text": "破產律"}, {"key": "C", "text": "公司註冊試辦章程"}, {"key": "D", "text": "商標註冊試辦章程"}], "answer": ["A", "B", "C", "D"], "explanation_full": "21 第二階段。在第一階段，商事立法主要由新設立的商部負責。1903年清廷成立商部並開始著手商律的擬訂 ，1904年頒布了《欽定大清商律》，是清朝第一部商律。此外，清政府還陸續頒布了有關商務和獎勵實業的法規、章程，如1904年6月頒行的《公司註冊試辦章程》，1904年7月頒布的《商標註冊試辦章程》，1906年 5月頒行的《破產律》等。在第二階段，主要商事法典改由修訂法律館主持起草；單行法規仍由各有關機關擬訂，經憲政編查館和資政院審議後請旨頒行。在此期間，1908年修訂法律館起草了《大清商律草案 ），1911年農工商部起草了《改訂大清商律草案》，此外還草擬了《交易行律草案》《保險規則草案》《破產律草案》等，但均未正式頒行。在此期間公布的單行商事法規有《銀行則例》《銀行註冊章程》《大小輪船公司註冊章程》等。故A、B、C、D四項均當選。"}, {"id": "卷一-56", "subject": "卷一", "type": "多選題", "question": "在古希臘悲劇《安提戈涅》中，安提戈涅之兄背叛了自己的城邦，並在戰爭中死亡。國王命令將叛徒暴屍田野，同時宣布，誰將叛徒埋葬，便處以死刑。安提戈涅將其兄埋葬。當被帶到國王面前時，他說：“我並不認為你的命令是如此強大有力，以至於你，一個凡人，竟敢僭越諸神不成文的，且永恆不衰的法。不是今天，也非昨日，它們永遠存在，沒有人知道它們在時間上的起源。”結合相關法學理論，下列哪些表述是正確的？（　）", "options": [{"key": "A", "text": "安提戈涅的辯解依據的是，永恆不變的自然法對實在法具有更高效力"}, {"key": "B", "text": "國王的處罰理由是公共利益，為了城邦的安定，必須用法律維持秩序"}, {"key": "C", "text": "惡法非法是法律實證主義的基本觀點"}, {"key": "D", "text": "非實證主義者都是以內容的正確性作為法的概念的唯一定義要素"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】安提戈涅在辯解中比較了兩種規則律令：其一是“國王的命令”，其二是“諸神不成文的，且永恆不衰的法”，並且認為後者的效力高於前者。國王克瑞翁對波呂涅刻斯(安提戈涅之兄)的禁葬令代表的是一種國家主義原則，體現的是一種國家道德，具有法律的效力。而根據古希臘的“神律”，埋葬死者是親人最神聖的義務。死者如果得不到埋葬，他的陰魂就不能渡過冥河前往冥土，對天上和下界的神祗是大不敬 ，也是死者家庭和親屬最大的恥辱。因此，可以說安提戈涅的辯解依據的法理是，永恆不變的自然法對實在法具有更高效力。A選項正確。 安提戈涅之兄被判了自己的城邦，他的行為構成了叛國罪。叛國的行為冒犯了城邦的共同價值體系，冒犯了共同體篤信的集體道德，侵犯了城邦的共同利益，必須受到嚴厲懲罰。社會統治的建立意味著統治秩序的形成。發布命令、公布法律、並保證其得到遵守，體現了法律對秩序這一價值的維護。所以，國王的處罰理由是公共利益，為了城邦的安定，必須用法律維持秩序。B選項正確。 法律實證主義否定法與道德存在本質上的必然聯繫，道德上的善或正義不是法律存在並有效力的標準，法律規則不會因違反道德而喪失法的性質和效力，即使那些同道德嚴重對抗的法也依然是法，即“惡法亦法”。 自然法學派肯定法與道德存在本質上的必然聯繫，實在法只有在符合自然法、具有道德上的善的時候，才具有法的本質而成為法。一個同道德嚴重對立的邪惡的法並不是一個壞的法，而是喪失了法的本質的非法的 “法”，因而不是法，即“惡法非法”。所以，C選項錯誤。 非實證主義理論主張，法與道德存在本質上和內容上的聯繫。因此在定義法的概念時，需要將道德因素被包括在內，即以內容的正確性作為法的概念的一個必要的定義要素。非實證主義的法的概念分為兩類：一是以內容的正確性作為法的概念的唯一定義要素，如傳統的自然法理論；二是以內容的正確性與權威性制定或社會實效性要素同時作為法的概念的定義要素，如超越自然法與法實證主義之爭的所謂“第三條道路的法學理論”，代表學者是阿列克西。所以，不能說非實證主義者都是以內容的正確性作為法的概念的唯一定義要素 。D選項錯誤。"}, {"id": "卷一-57", "subject": "卷一", "type": "多選題", "question": "“禮法結合、德主刑輔”是中國傳統法律文化的重要思想之一，關於該觀點的當代意義及價值，下列說法不正確的是？", "options": [{"key": "A", "text": "“禮法結合、德主刑輔”與自由平等的法律無法兼容"}, {"key": "B", "text": "“禮法結合、德主刑輔”是建設中國特色社會主義法治國家的文化基礎"}, {"key": "C", "text": "“禮法結合、德主刑輔”不利於維護社會公平和秩序專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 22"}, {"key": "D", "text": "“禮法結合、德主刑輔”強調道德在社會治理中的主導作用"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】“禮法結合、德主刑輔”的傳統法律文化強調“禮治和德治”，相應的基本規範——禮制和道德與自由、平等(公平)、秩序等價值並不是截然對立的。即便是在中國的傳統社會，也包含這些價值成分 ，例如，強調官員犯法與庶民同罪的平等價值；宋朝時期保護女性的繼承權，重視自由價值；再如，以法律 、道德、禮制共同維護社會穩定，重視秩序價值。因此，不能絕對地說“禮法結合、德主刑輔”與自由平等無法兼容、不利於維護公平和秩序等。AC項錯誤。 “禮法結合、德主刑輔”的傳統法律文化對當代中國特色社會主義法治建設具有重要的借鑒意義，但是達不到“文化基礎”的層次。我國法治建設的文化基礎是新時代中國特色社會主義的理論體系、文化體系。B項錯誤。 “禮法結合、德主刑輔”強調以道德教化為主、法律教化為輔，更加重視道德的主導作用。D項正確。"}, {"id": "卷一-58", "subject": "卷一", "type": "多選題", "question": "下列關於律師權利和義務，表述不正確的有？", "options": [{"key": "A", "text": "律師執業權利保障包括投訴機制、申訴控告機制、維護律師執業權利工作機制等三個層次的救濟機制"}, {"key": "B", "text": "律師接受委託後不得拒絕辯護或代理"}, {"key": "C", "text": "律師應當保守秘密，但委託人正在實施危害國家安全、公共安全以及嚴重侵害他人商業秘密的犯罪事實和信息除外"}, {"key": "D", "text": "曾擔任法官、檢察官的律師，從人民法院、人民檢察院離任後2年內，不得擔任原任職法院的訴訟代理人或者辯護人"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】律師執業權利保障包括投訴機制、申訴控告機制、維護律師執業權利工作機制、各部門聯席會議制度四個層次設置了救濟機制。A項錯誤。 《律師法》第32條規定：“委託人可以拒絕已委託的律師為其繼續辯護或者代理，同時可以另行委託律師擔任辯護人或者代理人。律師接受委託後，無正當理由的，不得拒絕辯護或者代理。但是，委託事項違法、委託人利用律師提供的服務從事違法活動或者委託人故意隱瞞與案件有關的重要事實的，律師有權拒絕辯護或者代理。”B項錯誤。 《律師法》第38條規定：“律師應當保守在執業活動中知悉的國家秘密、商業秘密，不得泄露當事人的隱私 。律師對在執業活動中知悉的委託人和其他人不願泄露的有關情況和信息，應當予以保密。但是，委託人或者其他人準備或者正在實施危害國家安全、公共安全以及嚴重危害他人人身安全的犯罪事實和信息除外。 ”C項錯誤。 《法官法》第36條規定：“法官從人民法院離任後兩年內，不得以律師身份擔任訴訟代理人或者辯護人。法官從人民法院離任後，不得擔任原任職法院辦理案件的訴訟代理人或者辯護人，但是作為當事人的監護人或者近親屬代理訴訟或者進行辯護的除外。法官被開除後，不得擔任訴訟代理人或者辯護人，但是作為當事人的監護人或者近親屬代理訴訟或者進行辯護的除外。”《律師執業管理辦法》第28條第2款規定：“曾經擔任法官、檢察官的律師從人民法院、人民檢察院離任後，二年內不得以律師身份擔任訴訟代理人或者辯護人 ；不得擔任原任職人民法院、人民檢察院辦理案件的訴訟代理人或者辯護人，但法律另有規定的除外。”D項錯誤。"}, {"id": "卷一-59", "subject": "卷一", "type": "多選題", "question": "下列關於法官、檢察官懲戒委員會的表述，不正確的有？", "options": [{"key": "A", "text": "各級法院、檢察院普遍設立法官懲戒委員會"}, {"key": "B", "text": "人大代表的數量不應低於全體委員的50％"}, {"key": "C", "text": "省高院、省檢察院轄區內每個法院、檢察院都應有一名代表參加"}, {"key": "D", "text": "針對法官、檢察官的違紀行為，由法官、檢察官懲戒委員會負責懲戒"}], "answer": ["A", "B", "C", "D"], "explanation_full": "23 第四十六條第四項、第五項規定的違反審判職責的行為，提出構成故意違反職責、存在重大過失、存在一般過失或者沒有違反職責等審查意見。(3)法官懲戒委員會提出審查意見後，人民法院依照有關規定作出是否予以懲戒的決定。並給予相應處理。(4)法官懲戒委員會由法官代表、其他從事法律職業的人員和有關方面代表組成，其中法官代表不少於半數。(5)最高人民法院法官懲戒委員會、省級法官懲戒委員會的日常工作，由相關人民法院的內設職能部門承擔。由此可見，ABC項錯誤。 《關於建立法官、檢察官懲戒制度的意見(試行)》第3條規定：“法官、檢察官懲戒工作由人民法院、人民檢察院與法官、檢察官懲戒委員會分工負責。人民法院、人民檢察院負責對法官、檢察官涉嫌違反審判、檢察職責行為進行調查核實，並根據法官、檢察官懲戒委員會的意見作出處理決定。”D項錯誤。"}, {"id": "卷一-60", "subject": "卷一", "type": "多選題", "question": "下列關於我國的國家基本經濟制度的說法，哪些選項是正確的？（　）", "options": [{"key": "A", "text": "自德國1919年《魏瑪憲法》以來，經濟制度就成為現代憲法調整的重要內容"}, {"key": "B", "text": "1999年憲法修正案規定“國家實行社會主義市場經濟”"}, {"key": "C", "text": "根據我國現行憲法的規定，城市的土地屬於國家所有，農村和城市郊區的土地原則上屬於集體所有"}, {"key": "D", "text": "在我國，國有企業和國有自然資源是國家財產的重要組成部分"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】經濟制度是現代憲法的重要內容之一，始自1919年德國《魏瑪憲法》的規定。A項正確。 1993年而非1999年的憲法修正案規定“國家實行社會主義市場經濟”，1999年憲法修正案將“發展社會主義市場經濟”作為一項重要的國家任務寫進憲法序言。B項錯誤。 根據《憲法》第10條第1、2款的規定，城市的土地屬於國家所有；農村和城市郊區的土地原則上屬於集體所有，但由法律規定屬於國家所有的，屬於國家所有。C項正確。 國有企業和國有自然資源是國家財產的主要部分而非重要組成部分，國家機關、事業單位、軍隊等全民單位的財產是國有財產的重要組成部分。D項錯誤。"}, {"id": "卷一-61", "subject": "卷一", "type": "多選題", "question": "下列關於特區公職人員就職宣誓的說法，哪些選項是正確的？（　）", "options": [{"key": "A", "text": "特區公職人員拒絕宣誓，則不得就任相應公職"}, {"key": "B", "text": "特區公職人員必須依法宣誓擁護特區基本法，效忠特區"}, {"key": "C", "text": "以任何不真誠、不莊重的方式宣誓，均屬於拒絕宣誓，宣誓人即喪失就任公職的資格，並不得重新安排宣誓"}, {"key": "D", "text": "澳門特別行政區與香港特別行政區公職人員的宣誓要求相同"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】就職宣誓是特區公職人員就職的法定條件和必經程序，未進行合法有效宣誓或者拒絕宣誓，不得就任相應公職，不得行使相應職權和享受相應待遇。A項正確。 《香港特別行政區基本法》第104條規定，香港特區行政長官、主要官員、行政會議成員、立法會議員、各級法院法官和其他司法人員在就職時必須依法宣誓擁護中華人民共和國香港特別行政區基本法，效忠中華人民共和國香港特別行政區。《澳門特別行政區基本法》第101條規定，澳門特區行政長官、主要官員、行政會委員、立法會議員、法官和檢察官，必須擁護中華人民共和國澳門特別行政區基本法，盡忠職守，廉潔奉公 ，效忠中華人民共和國澳門特別行政區，並依法宣誓。B項正確。 宣誓必須在法律規定的監誓人面前進行，監誓人負有確保宣誓合法進行的責任，對不符合規定的宣誓，應確定為無效宣誓，並不得重新安排宣誓。C項正確。 澳門特別行政區行政長官、主要官員、立法會主席、終審法院院長、檢察長在就職時，除按一般公職人員的要求宣誓外，還必須宣誓效忠中華人民共和國。D項錯誤。"}, {"id": "卷一-62", "subject": "卷一", "type": "多選題", "question": "按照我國憲法的規定，下列何種選項屬於可以作出改變決定的情形？", "options": [{"key": "A", "text": "全國人大對全國人大常委會不適當的決定"}, {"key": "B", "text": "國務院對市、縣、鄉政府不適當的決定和命令"}, {"key": "C", "text": "全國人大常委會對省人大制定的同憲法、法律和行政法規相牴觸的地方性法規和決議專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 24"}, {"key": "D", "text": "省人大常委會對省政府的不適當的決定和命令"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】根據《立法法》的規定，全國人民代表大會有權改變或者撤銷全國人民代表大會常務委員會不適當的決定，故A選項正確。 國務院有權改變或者撤銷地方各級國家行政機關的不適當的決定和命令，故B項正確。 全國人大常委會有權撤銷省、自治區、直轄市國家權力機關制定的同憲法、法律和行政法規相牴觸的地方性法規和決議，無權改變，因此C項錯誤。 縣級以上的地方各級人民代表大會常務委員會有權撤銷本級人民政府的不適當的決定和命令，無權改變，因此D項錯誤。"}, {"id": "卷一-63", "subject": "卷一", "type": "多選題", "question": "關於一般議案、質詢案的說法，下列選項中，正確的是：（　）", "options": [{"key": "A", "text": "5名以上鄉級人大代表可以向本級人大提出議案，10名以上鄉級人大代表可以向本級人大提質詢案"}, {"key": "B", "text": "最高人民法院、最高人民檢察院可以向全國人大和全國人大常委會提出議案"}, {"key": "C", "text": "縣級以上人大的專門委員會可以向本級人大和本級人大常委會提出議案"}, {"key": "D", "text": "一個代表團或者三十名以上的全國人大代表，可以向全國人大和全國人大常委會提出議案和質詢案"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】5名以上鄉級人大代表可以向鄉人大提出議案，10名以上鄉級人大代表可以向本級人大提質詢案 。故A選項正確。 法院、檢察院提議案只能是最高人民法院和最高人民檢察院向全國人大及其常委會提出，故B選項正確。要注意的是地方的法院、檢察院不能向本級人大及其常委會提議案。只有最高人民法院和最高人民檢察院才有提案權。 地方向本級人大提議案的主體包括本級政府、本級人大常委會、本級人大專門委員會、本級人大主席團，地方向本級人大常委會提議案的主體包括本級政府、本級人大專門委員會、本級人大常委會主任會議，故C選項正確。 一個代表團或者30名以上全國人大代表只能向全國人大提出議案和質詢案，向全國人大常委會提議案和質詢案的是10個以上的常委會成員。故D選項錯誤。"}, {"id": "卷一-64", "subject": "卷一", "type": "多選題", "question": "根據我國《國籍法》的規定，在如下哪些情況下，當事人可以取得中國國籍？", "options": [{"key": "A", "text": "拉姆出生於中國，其父母均為無國籍人，長期定居於中國"}, {"key": "B", "text": "英國人凱特與中國公民張某結婚後，若放棄其英國國籍，即可自動取得中國國籍"}, {"key": "C", "text": "美國人喬丹向中國駐美使館提交加入中國國籍申請後，使館館長口頭許諾給予其中國國籍"}, {"key": "D", "text": "英國人露西與中國公民李某在英國結婚後生育一子，其子並未取得英國國籍則可以取得中國國籍"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】《國籍法》第6條規定：“父母無國籍或國籍不明，定居在中國，本人出生在中國，具有中國國籍。”A項正確。 根據《國籍法》第7條，外國人取得中國國籍，須經申請批准，而不能自動取得，B項錯誤。 根據《國籍法》第16條，加入中國國籍的申請應由公安部審批，C項錯誤。 《國籍法》第5條規定：“父母雙方或一方為中國公民，本人出生在外國，具有中國國籍；但父母雙方或一方為中國公民並定居在外國，本人出生時即具有外國國籍的，不具有中國國籍。”D項正確。"}, {"id": "卷一-65", "subject": "卷一", "type": "多選題", "question": "關於正當防衛，以下說法不正確的是？（　）", "options": [{"key": "A", "text": "如果認為正當防衛以行為人具有防衛意思為成立條件，那麼緊急避險也以行為人具有避險意思為成立條件"}, {"key": "B", "text": "防衛過當既可能成立故意犯罪，也可能成立過失犯罪，還可能屬於意外事件"}, {"key": "C", "text": "對於財產犯罪，行為人已經取得財物，應當視為不法侵害已經結束。即使被害人在現場及時輓回損失，也不可能成立正當防衛，只能是事後防衛"}, {"key": "D", "text": "事前防衛與事後防衛都不是正當防衛，而是防衛過當，應當減輕或者免除處罰專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 25"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】防衛意思與避險意思都屬於主觀的正當化要素，涉及的問題都是成立違法阻卻事由時是否以存在主觀的正當化要素為必要條件。根據學說觀點的不同，存在防衛意思必要說（通說）與防衛意思不要說 （有力觀點），避險意思必要說（通說）與避險意思不要說（有力觀點）的對立。但釆用防衛意思必要說時 ，一定會釆用避險意思必要說；採用防衛意思不要說時，也一定會採用避險意思不要說。A項正確。 防衛過當不是獨立的罪名，根據實施過當行為時的主觀心態不同，分別成立相應的故意犯罪、過失犯罪或意外事件。B項正確。 成立正當防衛時，要求不法侵害正在進行，即已經開始且尚未結束。即便犯罪行為已經既遂，但剛剛既遂後防衛人立即進行追捕、輓回損失的，也屬於不法侵害“尚未結束”，而不是事後防衛。換言之，構成犯罪的不法侵害即便已經既遂，仍然有正當防衛的餘地。C項錯誤。 滿足正當防衛的其他條件，只是不滿足防衛行為的必要性或均衡性時，成立防衛過當。若不滿足正當防衛的其他條件，則既不成立正當防衛，也不成立防衛過當。例如，不滿足急迫性要件的，無論是事前防衛還是事後防衛，都不是正當防衛，也不可能成立防衛過當，所以不能按照第20條第2款“應當減輕或者免除處罰”。 D項錯誤。"}, {"id": "卷一-66", "subject": "卷一", "type": "多選題", "question": "下列哪些情形屬於吸收犯？（　）", "options": [{"key": "A", "text": "製造槍支、彈藥後又持有、私藏所製造的槍支、彈藥的"}, {"key": "B", "text": "盜竊他人汽車後，謊稱所盜汽車為自己的汽車出賣給他人的"}, {"key": "C", "text": "套取金融機構信貸資金後又高利轉貸他人的"}, {"key": "D", "text": "製造毒品後又持有該毒品的"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】吸收犯是指事實上存在數個不同的行為，其一行為吸收其他行為，僅成立吸收行為一個罪名的情況。(例如，盜竊槍支後，私藏在家中)吸收關係的類型：(1)重行為吸收輕行為。如：偽造貨幣後又使用、 出售該貨幣的，定偽造貨幣罪。(2)實行行為吸收預備行為。如：人戶搶劫行為，非法侵入他人住宅本身就是一個犯罪行為，屬於搶劫罪的預備行為，但僅定搶劫罪一罪。(3)主行為吸收從行為。如：甲乙共同犯罪，甲先是起幫助作用，後來參與進來實行。 故AD選項屬於吸收犯。 C選項只觸犯了一個罪名(高利轉貸罪)，不可能成立此罪吸收彼罪的吸收犯，吸收犯要求是此罪吸收彼罪。 B選項屬於事後不可罰的行為，不成立吸收犯。"}, {"id": "卷一-67", "subject": "卷一", "type": "多選題", "question": "《刑法》第269條對轉化型搶劫做出了規定，下列哪些選項不能適用該規定？（　）", "options": [{"key": "A", "text": "甲入室盜竊，被主人李某發現並追趕，甲進入李某廚房，拿出菜刀護在自己胸前，對李某說：“你千萬別過來，我膽子很小。”然後，翻窗逃跑"}, {"key": "B", "text": "乙搶奪王某的財物，王某讓狼狗追趕乙。乙為脫身，打死了狼狗"}, {"key": "C", "text": "丙騙取他人財物後，剛準備離開現場，騙局就被識破。被害人追趕丙。走投無路的丙從身上摸出短刀，扎在自己手臂上，並對被害人說：“你們再追，我就死在你們面前。”被害人見丙鮮血直流，一下愣住了。丙迅速逃離現場"}, {"key": "D", "text": "丁在一網吧裡盜竊財物並往外逃跑時，被管理人員顧某發現。丁為阻止顧某的追趕，提起網吧門邊的開水壺，將開水潑在顧某身上，然後逃離現場"}, {"key": "A", "text": "C選項中，行為人對自己使用暴力，沒有造成新的法益侵害，故不能認為是轉化型搶劫罪。"}, {"key": "B", "text": "選項中，行為人針對的對象是狗，沒有對他人的生命健康造成新的侵害，不符合對象條件，也不能認為成立轉化型搶劫罪。"}, {"key": "D", "text": "選項使用了暴力，並且這種暴力足以抑制被害人的追捕，故成立轉化型搶劫罪。"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】轉化型搶劫的條件是： 26 下，需要達到“數額較大”，但在如下情形下，沒有達到數額較大的標準也可以：(1)盜竊、詐騙、搶奪接近 “數額較大”標準的；(2)入戶或在公共交通工具上盜竊、詐騙、搶奪後在戶外或交通工具外實施上述行為的 ；(3)使用暴力致人輕微傷以上後果的；(4)使用凶器或以凶器相威脅的；(5)具有其他嚴重情節的。 第二，主觀條件：為了窩藏贓物、抗拒抓捕、毀滅罪證(如果行為人在實行盜竊、詐騙、搶奪過程中，尚未取得財物時被他人發現，為了非法取得財物，而使用暴力或者以暴力相威脅的.應直接認定為搶劫罪，不適用刑法第269條之轉化型搶劫)； 第三，客觀條件：當場使用暴力或者以暴力相威脅。注意：(1)當場：是指實施犯罪的現場，但現場發現犯罪人並隨之追趕的過程，應視為現場的延伸：(2)暴力或以暴力相威脅：必須是針對被害人或者其他第三人實施暴力或以暴力相威脅，行為人自己實施暴力，如自殺。從而防止被害人的追捕的，不成立轉化型搶劫。(3)暴力、脅迫的對象：並不限於財物所有人、保管人，也可以是其他相關人員。但不能是行為人本人，因為對本人實施暴力並沒有對他人的生命、健康造成侵害，即沒有製造新的法益侵害。因此，原則上不能夠認定為是轉化型搶劫罪。"}, {"id": "卷一-68", "subject": "卷一", "type": "多選題", "question": "關於貪污賄賂類犯罪，以下說法正確的是？（　）", "options": [{"key": "A", "text": "某縣縣長甲為招商引資，促進當地經濟發展，為諸多外商投資項目精簡手續，提供優惠政策。後一些老闆聽聞其退休後，為感謝甲在任時提供的諸多便利，向其贈送若干貴重財物，但雙方在甲退休前均未約定，故甲不構成受賄罪"}, {"key": "B", "text": "某市市長乙帶團前往國外考察，考察期間接受了當地官員贈送的名貴手錶一塊，按照國家規定應當交公 ，但乙因十分喜愛該手錶並未交公，乙構成貪污罪"}, {"key": "C", "text": "某局副局長丙負責該局辦公大樓重建的招標工作，老闆錢某送給丙10萬元請求丙在招標過程中同等條件下優先採用其生產的合格產品，因錢某謀取的是正當利益，故錢某不構成行賄罪"}, {"key": "D", "text": "某國有企業出納員丁，借管理單位備用資金之便，以假賬方式虛構了50萬元的資金用途，本想等一段時間之後無人發現便將資金轉走。不料，單位進行突擊審計，丁的行為被審計人員發現，因丁並未實際轉移該筆資金，故丁構成貪污罪未遂"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】國家工作人員先為他人謀取利益，後仍在職時收受他人財物的，即“事後（在職時）受財”的 ，構成受賄罪。國家工作人員利用職務上的便利為請託人謀取利益，並與請託人事先約定，在其離職後收受請託人財物的，即便收受財物時不具有國家工作人員身份，也以受賄罪論處。但是，事前無約定，國家工作人員為他人謀取利益，離職後他人才給予財物的，不成立受賄罪。縣長甲屬於“事後受財”，但接受財產時不再具有國家工作人員身份，事前也沒有約定，所以不構成受賄罪，A項正確。 根據《刑法》第394條，國家工作人員在國內公務活動或者對外交往中接受禮物，依照國家規定應當交公而不交公，數額較大的，依照貪污罪定罪處罰。市長乙收受的手錶屬於對外交往中接受的禮物，應當交公而不交公，構成貪污罪。B項正確。 成立行賄罪，必須要“為謀取不正當利益”。為謀取正當利益而行賄的，不構成行賄罪。所謂“不正當利益 ”，是指任何性質、任何形式的不正當利益，包括機會上的不正當利益。錢某生產的產品雖然合格，符合招標要求，但以金錢交易的方式請求丙在招標過程中同等條件下優先釆用其產品，仍然屬於謀取了不正當利益 ，此時表現為機會上的不正當利益。錢某構成行賄罪。C項錯誤。 丁是國有企業的出納員，具有國家工作人員身份。“以假賬方式虛構了50萬元的資金用途”，表明其具有非法占有單位財產的目的。由於資金實際上沒有被轉移，所以丁尚不構成貪污既遂，只構成貪污未遂。D項正確 。"}, {"id": "卷一-69", "subject": "卷一", "type": "多選題", "question": "關於因果關係，下列哪些選項是錯誤的？（　）", "options": [{"key": "A", "text": "甲勸被害人旅遊，被害人在旅遊途中遭遇泥石流死亡。甲行為與被害人死亡具有因果關係"}, {"key": "B", "text": "乙去被害人家中盜竊，因未取得財物，一怒之下，放火燒了被害人家，被害人為救自己的孩子衝入屋內被燒死。乙行為與被害人死亡具有因果關係"}, {"key": "C", "text": "丙與妻子一塊駕車外出旅遊，車子在高速公路上行駛時，因丙與妻子發生爭吵而將妻子從車上推下，導致專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 27 妻子被後面車輛軋死。丙的行為與妻子的死亡之間具有因果關係"}, {"key": "D", "text": "丁因李某害自己丟掉工作而懷恨在心，在吃飯時朝李某的臉上潑了一杯熱水，致使李某面部被嚴重燙傷而毀容，李某感覺無法見人而自殺。丁的行為與李某的死亡具有因果關係"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】勸人旅遊屬於日常行為，即便伴有某種危險，也是法律所允許的危險，不屬於刑法上的危害行為。因此，甲的行為與被害人死亡結果之間不存在因果關係。A選項錯誤。 乙放火後，被害人在家中去救自己嬰兒是一個正常的現象，所以，正常現象不會中斷乙的放火行為與死亡結果之間的因果關係，乙的行為與死亡結果之間具有因果關係。B選項正確。 在高速公路上將被害人推下汽車，被害人遭到後面汽車碰撞的概率是很高的，即後面汽車將被害人軋死屬於一個正常的因素(換言之，在這麼危險的區域把被害人推下車，被害人被後面的車輛軋死，任何人也不會覺得很異常)，正常的因素(被害人遭到後面的汽車碰撞)不會中斷前行為(在高速公路上將被害人推下汽車)與死亡結果之間的因果關係，故丙的行為與被害人死亡結果之間存在因果關係。C選項正確。 丁將被害人毀容後，被害人自殺應認定為是異常的因素。實踐中，大量的被毀容的人，或者長相難看的人 ，如果因為容貌醜陋而自殺的，應屬於低概率事件(異常的因素)。另外，自殺對死亡的貢獻率非常大，故自殺行為中斷了前行為(毀容)與後結果(死亡結果)之間的因果關係，丁的行為與死亡結果之間不存在因果關係 。D選項錯誤。"}, {"id": "卷一-70", "subject": "卷一", "type": "多選題", "question": "以下關於盜竊罪與侵占罪的說法，錯誤的是？（　）", "options": [{"key": "A", "text": "某日，張某在校園內閒逛時，看見教學樓前停放一輛未上鎖的自行車，見四下無人便將車騎走。張某構成盜竊罪"}, {"key": "B", "text": "陳某將自己的瑞士懷錶送至王某的修表鋪修理。王某將表修好後私自變賣。幾天后，陳某前往取表，王某告知陳某其表被偷，陳某只好自認倒霉。王某構成盜竊罪"}, {"key": "C", "text": "吳某搭乘火車時不慎將手機遺失在火車站候車大廳，後站內清潔人員趙某拾得後據為己有。趙某構成盜竊罪"}, {"key": "D", "text": "溫某到謝某家作客，將自己的挎包掛在謝某家的衣帽架上。兩人相談甚歡，遂乘興至樓下小酒館喝酒。謝某妻子見溫某挎包好看，遂據為己有。溫某以為自己的挎包丟失在了小酒館，自認倒霉。謝某妻子構成侵占罪"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】行為時被害財物是否被人占有，是區分盜竊與遺忘物侵占的關鍵。行為時被害財物是由其他人占有，還是由行為人占有，是區分盜竊與委託物侵占的關鍵。行為時被害財物既不在行為人占有之下，又不在其他人占有之下，且不屬於無主物的情形時，非法占為己有的，屬於遺忘物侵占。行為時被害財物本就由行為人占有時，非法占為己有的，屬於委託物侵占。行為時被害財物由其他人占有，行為人將財物轉為自己占有的，屬於盜竊。判斷行為時被害財物的占有狀態時，需同時考慮事實上的支配與社會觀念上的支配。當財物握在手中，放在口袋裡時，事實上的支配力很強，一般能夠認定占有了該財物。即便事實上的支配力並不大，但社會觀念上認為財物屬於他人占有時，仍然能夠成為盜竊罪的行為對象。尤其需注意的是，①在被害人所管轄的專屬空間內的財物，屬於被害人占有；②與被害人事實上的占有支配強烈的狀態存在時間上、 空間上的緊密連續性時，財物仍屬於被害人占有；③在有管理人的場合，社會觀念上認為原物主一旦喪失占有，管理人就獲得占有；④被害人具有明確的占有意思，採用各種方法明確表示自己並未放棄對財物的占有 ，且隨時可以重建對財物的事實上的支配的，財物仍屬於被害人占有。 A選項屬於情形②，雖然自行車沒有上鎖，但社會一般觀念上仍然認為屬於被害人所占有，因此張某成立盜竊罪。A項正確。 陳某將自己的瑞士懷錶送至王某的修表鋪修理時，王某基於委託關係已經事實上占有了該表，王某將表私自變賣的行為，屬於委託物侵占，而不是盜竊，B項錯誤。 火車站候車大廳屬於封閉性低、支配性弱、人流量大的場所，吳某手機遺失在此處時，手機成為了脫離占有物，清潔人員趙某拾取後據為己有的，成立遺忘物侵占，而不是盜竊。C項錯誤。 28 給謝某及其妻子。所以謝某妻子將包據為己有的行為，構成盜竊罪。D項錯誤。"}, {"id": "卷一-71", "subject": "卷一", "type": "多選題", "question": "關於侵犯人身權利的犯罪，下列哪些選項是錯誤的？", "options": [{"key": "A", "text": "甲在陽台上發現樓下無人，遂將一變饅的西瓜拋下樓，結果砸死小孩乙、重傷小孩丙的，甲成立過失致人死亡罪與過失致人重傷罪，應當數罪並罰"}, {"key": "B", "text": "甲誤以為正在抓捕犯罪嫌疑人的便衣警察乙是小偷，而毆打乙，致使乙重傷，後經搶救無效而死亡，如果甲存在犯罪過失，則甲成立過失致人重傷罪與過失致人死亡罪的想象競合犯"}, {"key": "C", "text": "甲以出賣為目的偷盜多名嬰兒，為防止嬰兒啼哭，而為其注射安靜劑，致使一名嬰兒死亡的，甲成立拐賣兒童罪與過失致人死亡罪的牽連犯"}, {"key": "D", "text": "甲、乙為練習槍法輪流開槍，其中一發子彈將路人李某打死，但■不清楚是誰射出的子彈，如果認定甲、 乙成立共犯，則甲、乙都成立過失致人死亡罪"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】甲的行為客觀上致使乙死亡、丙重傷，主觀上甲沒有殺人故意，也沒有傷害故意，但甲至少應當預見自己的行為可能砸死、砸傷他人，因疏忽大意而沒有認識到，表明甲未盡到正常、理性人的足夠謹慎的義務，具有疏忽大意的過失。甲的同一行為針對乙成立過失致人死亡罪，針對丙成立過失致人重傷罪，屬於想象競合犯，從一重罪論處。A選項錯誤。 便衣警察乙正在抓捕犯罪嫌疑人，屬於依法履行公務的行為。甲誤以為乙正在實施盜竊行為，而毆打乙，致使乙重傷，後經搶救無效而死亡，甲的行為屬於假想防衛，屬於事實認識錯誤，不成立故意犯罪，只可能成立過失犯罪或者意外事件。如果甲存在犯罪過失，則成立過失致人死亡罪，因為過失重傷進而引起被害人死亡的，應直接認定為過失致人死亡罪。當然，過失致人死亡的，同時符合過失致人重傷罪與過失致人死亡罪 ，二者之間不屬於想象競合犯，而是法條競合，應適用特殊法條以過失致人死亡罪論處。B選項錯誤。 甲以出賣為目的偷盜嬰兒的，成立拐賣兒童罪的加重情節。為防止嬰兒啼哭，甲為其注射安靜劑，致使一名嬰兒死亡，成立拐賣兒童罪的結果加重犯，因為為防止嬰兒啼哭而注射安靜劑的行為屬於拐賣兒童的行為 ，而犯罪分子拐賣婦女、兒童的行為，直接、間接造成被拐賣的婦女、兒童或者其親屬重傷、死亡或者其他嚴重後果的，都屬於加重情節。當然，刑法理論有觀點認為，甲的行為同時成立過失致人死亡罪，與拐賣兒童罪的結果加重犯屬於想象競合犯。C選項錯誤。 甲、乙輪流開槍，其中一發子彈致使路人李某死亡，查不清楚誰的行為導致李某死亡的，甲、乙的行為屬於共同過失行為。如果認定甲、乙二人不成立共同犯罪，則不能將死亡結果歸屬於甲和乙，甲、乙的過失行為都沒有造成實害結果，甲、乙都不成立犯罪。如果認定甲、乙二人成立共同犯罪，按照部分實行全部責任的原則，應將死亡結果歸屬甲、乙二人的行為，甲、乙二人均成立過失致人死亡罪。D選項正確。"}, {"id": "卷一-72", "subject": "卷一", "type": "多選題", "question": "甲、乙二人系某廠鍋爐工。一天，甲的朋友多次打電話催其赴約，但離交班時間還有15分鐘。甲心想，乙一直以來都是提前15分鐘左右來接班，今天也快來了。於是，在乙到來之前，甲就離開了崗位。恰巧乙這天也有要事。乙心想，平時都是我去後甲才離開，今天遲去15分鐘左右，甲不會有什麼意見的。於是，乙過了正常交接班時間15分鐘左右才趕到崗位。結果由於無人看管，致使鍋爐發生爆炸，損失慘重。關於甲、乙的行為認定，下列說法正確的是？", "options": [{"key": "A", "text": "屬共同犯罪"}, {"key": "B", "text": "屬共同過失犯罪"}, {"key": "C", "text": "各自構成故意犯罪"}, {"key": "D", "text": "應按照甲、乙所犯的罪分別處罰"}], "answer": ["B", "D"], "explanation_full": "【羿文解析】在客觀不法層面上，甲、乙均違反監管職責，實施了過失實行行為。在因果關係上，甲、乙二人如有任何一人履行職責，就不會造成結果，只有在二人都不履行職責時，結果才能發生。二人的過失行為對結果的責任作用一樣大，均有因果關係，系重疊因果關係。主觀責任層面上，二人對於結果的發生主觀上均有過失。根據《刑法》第25條第1款的規定，共同犯罪是指二人以上共同故意犯罪，故二人不是共同犯罪。 29 罰。二人是共同過失犯罪，按所犯之罪分別處罰。選項BD正確。"}, {"id": "卷一-73", "subject": "卷一", "type": "多選題", "question": "下列哪些情形不能認定為過失致人死亡罪？", "options": [{"key": "A", "text": "甲在運輸放射性物質過程中發生事故，造成4人死亡"}, {"key": "B", "text": "乙在工地塌方之後，仍然強令6名工人進入隧道搶救價值2000萬元的機械，6名工人由此遇難"}, {"key": "C", "text": "丙遭受不法侵害，情急之下失手將不法侵害人打死，法院認為丙防衛過當，應當負刑事責任"}, {"key": "D", "text": "聚眾鬥毆致人死亡"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】《刑法》第233條（過失致人死亡罪）規定，“本法另有規定的，依照規定”。當其他罪名中包含過失致人死亡內容時，形成整體法與部分法的法條競合，應以整體法定罪。例如失火罪、過失投放危險物質罪、過失爆炸罪、重大責任事故罪、交通肇事罪等犯罪中都包含過失致人死亡。根據整體法優於部分法的原則，應以上述其他犯罪論處。 A選項，甲的行為構成危險物品肇事罪、過失致人死亡罪，兩罪之間屬整體法與部分法的法條競合情況，以整體法危險物品肇事罪論處，不再認定為■失致人死亡罪。 B選項，乙的行為構成強令、組織他人違章冒險作業罪、過失致人死亡罪，兩罪之間屬整體法與部分法的法條競合情況，以整體法強令、組織他人違章冒險作業罪論處，不再認定為過失致人死亡罪。 C選項，客觀上防衛過當過失致人死亡，系不法行為；主觀上有防衛意圖，即無犯罪故意，“失手”表明行為人對過當結果應當避免而未避免，系過失，構成過失致人死亡罪。 D選項，根據《刑法》第292條，聚眾鬥毆致人死亡的，系轉化犯（實為想象競合的提示規定），以故意殺人罪論處。"}, {"id": "卷一-74", "subject": "卷一", "type": "多選題", "question": "下列說法正確的有：（　）", "options": [{"key": "A", "text": "甲修改某知名網站的域名解析服務器指向，強制用戶偏離目標網站或網頁進入指定網站或網頁，使得訪問某知名網站的網友自動訪問其所設立的賭博網站，甲的行為觸犯破壞計算機信息系統罪"}, {"key": "B", "text": "乙欠丙賭債20萬元，丙獲悉乙的房屋已被其協議賣與他人，便與乙惡意串通偽造借條，多寫借款金額。後丙持偽造的借條以乙因生意經營向其借款20萬元不予歸還為由，向人民法院提起民事訴訟，要求乙歸還借款 ，乙配合作虛假陳述。法院立案後，丙覺得不妥，又撤回訴訟。乙丙構成虛假訴訟罪的共同犯罪"}, {"key": "C", "text": "乙向甲借款100萬元，到期後一直未能歸還。甲以乙■具的真實欠條作為證據向法院提起民事訴訟，請求乙歸還欠款。乙偽造甲的收款憑證應訴，使法院信以為真。由於乙沒有提起虛假的民事訴訟，所以不構成虛假訴訟罪，但構成詐騙罪"}, {"key": "D", "text": "甲銷售改號軟件，改號軟件可以顯示任意修改的號碼，可以顯示110等，造成多人被騙，甲的行為構成非法利用信息網絡罪"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】以修改域名解析服務器指向的方式劫持域名，造成計算機信息系統不能正常運行，是破壞計算機信息系統的行為，A項正確。 虛假訴訟罪包括“單方欺詐”和“雙方串通”兩種類型。前者是指一方當事人提起虛假訴訟，侵害另一方當事人合法權益，雙方當事人之間存在實質的利益對抗關係。後者是指雙方當事人惡意串通進行虛假訴訟，侵害案外第三人合法權益，損害國家、公共利益，或者逃避履行法定義務，規避相關管理義務，雙方當事人之間不存在實質對抗關係。本案屬於雙方串通的虛假訴訟，妨害司法秩序類型的虛假訴訟罪，以法院受理作為既遂標準；行為人雖然以捏造的事實提起民事訴訟，但法院並未受理的，則是未遂。B項正確。 虛假訴訟的主體是提出起訴方，不包括應訴方，因此乙不構成虛假訴訟罪，但其方式仍然屬於欺騙法院的三角詐騙行為，C項正確。 明知他人利用信息網絡實施犯罪，為其犯罪提供互聯網接入、服務器託管、網絡存儲、通訊傳輸等技術支持 ，或者提供廣告推廣、支付結算等幫助的行為獨立入罪，構成幫助信息網絡犯罪活動罪，D項錯誤。"}, {"id": "卷一-75", "subject": "卷一", "type": "多選題", "question": "某鋼廠長期將廢水排人河流，嚴重污染環境，某縣公安機關以污染環境罪開展立案偵查，將某鋼廠負責人專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 30 秦某抓獲，指派鑒定人黃某對污水進行鑒定，秦某委託了辯護律師張某。案件隨後由某縣檢察院向某縣法院提起公訴，某縣法院依法公開開庭審理，下列表述正確的有？（　）", "options": [{"key": "A", "text": "若某縣法院發現鑒定意見中沒有寫明鑒定的水的來源，該鑒定意見不得作為定案根據"}, {"key": "B", "text": "若某縣法院認為有必要，通知黃某出庭，黃某無正當理由拒不出庭的，該鑒定意見不得作為定案根據"}, {"key": "C", "text": "張某不認同該鑒定意見.可以向法庭申請3名有專門知識的人出庭對鑒定意見提出意見"}, {"key": "D", "text": "若法庭同意有專門知識的人出庭，有專門知識的人發表的意見屬於鑒定意見"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】鑒定意見由鑒定人運用專業知識對案件中的專門問題發表專業的意見，專業化程度非常高，因此只要鑒定意見的形成過程存在不合法的情形，即不得作為定案根據。本案中，鑒定人黃某對污水進行鑒定 ，但鑒定意見中卻沒有註明污水的來源，這就使得該鑒定意見與本案喪失關聯性，不得作為定案根據，A項正確。 法院通知鑒定人出庭說明情況，若鑒定人無正當理由拒不出庭，鑒定意見不得作為定案根據。道理很簡單 ，鑒定意見高度專業，若鑒定人不出庭進行解釋說明，法官、當事人很難理解或者信服，自然不具可采性。 當然，若鑒定人系因正當理由或者不可抗力無法到庭的，法庭可以視情況延期審理或者組織重新鑒定。是故 ，B項正確。 對同一種類的鑒定意見，最多可以聘請兩名有專門知識的人提出意見，故本案中秦某向法庭申請3名有專門知識的人出庭是不合法的，C項錯誤。 本題中，張某聘請有專門知識的人，目的是對鑒定意見發表意見，有專門知識的人不是訴訟參與人，其提出的意見也不是鑒定意見，一般只作為法官酌情參考的材料。故，D項錯誤。"}, {"id": "卷一-76", "subject": "卷一", "type": "多選題", "question": "甲涉嫌盜竊罪、搶奪罪被某縣公安機關立案偵查，甲委託了辯護人乙。案件偵查終結後移送某縣檢察院審查起訴，下列表述正確的有？（　）", "options": [{"key": "A", "text": "在偵查階段，甲妻向某縣公安機關控告甲對其長期虐待，某縣公安機關應當接受"}, {"key": "B", "text": "在A中，某縣公安機關經過審查決定不立案，甲妻又向某縣法院起訴，某縣法院要求公安機關調取甲妻遭受虐待的證據"}, {"key": "C", "text": "某縣檢察院審查起訴時發現甲盜竊罪事實清楚，但搶奪罪事實不清，某縣檢察院應當將搶奪事實查清後再一併向某縣法院提起公訴"}, {"key": "D", "text": "某縣法院審理甲盜竊罪過程中，乙申請某縣法院調取一份書證，某縣法院同意調取的。可以在調取時通知乙到場"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】從立案管轄的角度來說，虐待罪屬於第一類自訴案件，親告罪，若沒有致被害人重傷或者死亡的程度，應當由自訴人赴法院提起自訴，公安機關沒有管轄權。但是，對於公安機關而言，面對老百姓的報案、控告、舉報，都應當先接受下來，然後再進行審查，如果發現不屬於自己管轄的，再移送給有管轄權的機關。本題中，甲妻向某縣公安機關控告甲對其長期虐待，某縣公安機關應當先接受，A項正確。 自訴案件主要奉行“誰主張、誰舉證”的舉證責任分配規則，應當由自訴人舉證並證明被告人有罪。當然 ，若自訴人以自己的能力無法調取證據，可以申請法院調查取證。法院經過審查若認為有必要的，應當調取 。但是，即便法院為自訴人調查取證，也應當由法官自行調取，法官不能要求公安機關調查取證，是故，B項中某縣法院要求公安機關調取甲妻遭受虐待的證據是錯誤的。 提起公訴應當保證辦案效率，對於一人犯數罪的，部分罪行已經查清事實，但其他罪行無法查清的，應當以已經查清的事實提起公訴，其他罪行隨後查清的，再補充或者追加起訴。本題中，某縣檢察院發現甲盜竊罪事實清楚，搶奪罪事實不清，應當將盜竊罪向某縣法院提起公訴，無需待搶奪罪查清事實後再一併起訴。C項錯誤。 辯護律師申請法院調查取證，法院同意的，在收集、調取證據材料時，可以通知辯護律師在場。D項正確。"}, {"id": "卷一-77", "subject": "卷一", "type": "多選題", "question": "關於行政機關和機構的設立，下列說法哪些是正確的？（　）", "options": [{"key": "A", "text": "經國務院批准，自治區人民政府可以設立地區行政公署專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 31"}, {"key": "B", "text": "經省人大常委會批准，省人民政府可以設立工作部門"}, {"key": "C", "text": "經市人民政府批准，市轄區人民政府可以設立街道辦事處"}, {"key": "D", "text": "經縣人民政府批准，縣人民政府工作部門可以設立派■機構"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】根據《地方各級人民代表大會和地方各級人民政府組織法》第68條第1款的規定，省、自治區的人民政府在必要的時候，經國務院批准，可以設立若干派出機關。因此，自治區人民政府設立地區行政公署 ，需經國務院批准。故A選項正確。 根據《地方各級人民代表大會和地方各級人民政府組織法》第64條第3款的規定，省、自治區、直轄市的人民政府的廳、局、委員會等工作部門的設立、增加、減少或者合併，由本級人民政府報請國務院批准，並報本級人民代表大會常務委員會備案。因此，省級人民政府設立工作部門由省級人民政府報請國務院批准，並報省級人民代表大會常務委員會備案，而非經省人大常委會批准。故B選項錯誤。 根據《地方各級人民代表大會和地方各級人民政府組織法》第68條第3款的規定，市轄區、不設區的市的人民政府，經上一級人民政府批准，可以設立若干街道辦事處，作為它的派出機關。因此，市轄區人民政府設立街道辦事處，需經區人民政府的上一級政府——市人民政府批准。故C選項正確。 派出機構作為地方各級人民政府行政機構的特殊內設機構，其設置與地方各級人民政府行政機構的內設機構的設置規則相同。根據《地方各級人民政府機構設置和編製管理條例》第13條的規定，地方各級人民政府行政機構根據工作需要和精幹的原則，設立必要的內設機構。縣級以上地方各級人民政府行政機構的內設機構的設立、撤銷、合併或者變更規格、名稱，由該行政機構報本級人民政府機構編製管理機關審批。因此，縣政府工作部門設立派出機構需報縣政府機構編製管理機關審批，而非報縣政府批准。故D選項錯誤。"}, {"id": "卷一-78", "subject": "卷一", "type": "多選題", "question": "孫某為某縣公安局的聘任制公務員，雙方簽訂聘任合同。下列哪些說法是錯誤的？（　）", "options": [{"key": "A", "text": "聘任合同需經省公務員主管部門批准"}, {"key": "B", "text": "涉及國家秘密職位的聘任合同需經省公務員主管部門批准"}, {"key": "C", "text": "聘任合同約定孫某試用期12個月"}, {"key": "D", "text": "如孫某與該機關因履行聘任合同發生爭議，可以申請勞動仲裁"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】根據《公務員法》第102條第2款的規定，聘任合同的簽訂、變更或者解除，應當報同級公務員主管部門備案。由此可知，聘任合同應當報同級公務員主管部門備案，而無須報省級公務員主管部門批准。 故A選項錯誤。 根據《公務員法》第100條的規定，機關根據工作需要，經省級以上公務員主管部門批准，可以對專業性較強的職位和輔助性職位實行聘任制。前款所列職位涉及國家秘密的，不實行聘任制。由此可知，涉及國家秘密的職位，不實行聘任制。故B選項錯誤。 根據《公務員法》第103條第2款的規定，聘任合同期限為1～5年。聘任合同可以約定試用期，試用期為 1～12個月。由此可知，聘任公務員的試用期最長為12個月。故C選項正確。 聘任制公務員的救濟途徑不同於一般公務員。根據《公務員法》第105條的規定，聘任制公務員與所在機關之間因履行聘任合同發生爭議的，可以自爭議發生之日起60日內申請仲裁。省級以上公務員主管部門根據需要設立人事爭議仲裁委員會，受理仲裁申請。人事爭議仲裁委員會由公務員主管部門的代表、聘用機關的代表 、聘任制公務員的代表以及法律專家組成。當事人對仲裁裁決不服的，可以自接到仲裁裁決書之日起15日內向人民法院提起訴訟。仲裁裁決生效後，一方當事人不履行的，另一方當事人可以申請人民法院執行。因此 ，孫某與所在機關因履行聘任合同發生爭議，孫某可以向人事爭議仲裁委員會申請人事仲裁，而不是申請勞動仲裁。故D選項錯誤。"}, {"id": "卷一-79", "subject": "卷一", "type": "多選題", "question": "甲酒後駕車，撞到被害人乙，致其死亡。撞人後甲駕車逃逸，次日5時許，到公安機關投案。後賠償被害人近親屬100萬元，獲得諒解。一審檢察院在甲簽署認罪認罰具結書的前提下，在提起公訴時提出了有期徒刑 3年、緩刑4年的量刑建議。關於本案，下列說法正確的是", "options": [{"key": "A", "text": "甲如果僅如實供述其中一罪或部分罪名事實的，全案不作“認罪”的認定，不適用認罪認罰從寬制度專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 32"}, {"key": "B", "text": "甲享有程序選擇權，如果其不同意適用速裁程序、簡易程序的，不影響“認罰”的認定"}, {"key": "C", "text": "甲的認罪認罰情節與自首情節不作重複評價"}, {"key": "D", "text": "人民法院依法作■判決時，應當採納人民檢察院指控的罪名和量刑建議"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】根據《認罪認罰意見》第6條的規定，犯罪嫌疑人、被告人承認指控的主要犯罪事實，僅對個別事實情節提出異議，或者雖然對行為性質提出辯解但表示接受司法機關認定意見的，不影響“認罪”的認定 。犯罪嫌疑人、被告人犯數罪，僅如實供述其中一罪或部分罪名事實的，全案不作“認罪”的認定，不適用認罪認罰從寬制度，但對如實供述的部分，人民檢察院可以提出從寬處罰的建議，人民法院可以從寬處罰。 可知，選項A正確。 根據《認罪認罰意見》第7條的規定，犯罪嫌疑人、被告人享有程序選擇權，不同意適用速裁程序、簡易程序的，不影響\"認罰”的認定。選項B正確。 根據《認罪認罰意見》第9條的規定，認罪認罰的從寬幅度一般應當大於僅有坦白，或者雖認罪但不認罰的從寬幅度。對犯罪嫌疑人、被告人具有自首、坦白情節，同時認罪認罰的，應當在法定刑幅度內給予相對更大的從寬幅度。認罪認罰與自首、坦白不作重複評價。選項C正確。 根據《刑事訴訟法》第201條第1款的規定，對於認罪認罰案件，人民法院依法作出判決時，一般應當採納人民檢察院指控的罪名和量刑建議，但有下列情形的除外：①被告人的行為不構成犯罪或者不應當追究其刑事責任的；②被告人違背意願認罪認罰的；③被告人否認指控的犯罪事實的；④起訴指控的罪名與審理認定的罪名不一致的；⑤其他可能影響公正審判的情形。可知，認罪認罰案件，人民法院一般應當採納人民檢察院指控的罪名和量刑建議，但是也有例外情況。選項D錯誤。"}, {"id": "卷一-80", "subject": "卷一", "type": "多選題", "question": "關於法庭審判階段程序，下列說法錯誤的是：（　）", "options": [{"key": "A", "text": "法庭審理過程中，合議庭對證據有疑問的，可以宣布休庭，對證據進行調■核實，人民法院調查核實證據 ，可以進行勘驗、檢■、■封、扣押、鑒定和查詢、凍結、搜查"}, {"key": "B", "text": "法庭辯論過程中，合議庭發現與定罪、量刑有關的新的事實，有必要調■的，審判長可以宣布暫停辯論 ，恢復法庭調查，在對新的事實調查後，繼續法庭辯論"}, {"key": "C", "text": "被告人在最後陳述中提出新的事實、證據，合議庭認為可能影響正確裁判的，應當恢復法庭辯論"}, {"key": "D", "text": "公訴人當庭發表與起訴書不同的意見，屬於變更、追加、補充或者撤回起訴的，人民法院可以允許人民檢察院當庭以口頭方式提出"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】根據《刑事訴訟法》第196條的規定，法庭審理過程中，合議庭對證據有疑問的，可以宣布休庭 ，對證據進行調查核實。人民法院調查核實證據，可以進行勘驗、檢查、查封、扣押、鑒定和查詢、凍結。 可知，法庭調查核實證據的手段中沒有搜查。選項A錯誤。 根據《刑訴解釋》第286條的規定，法庭辯論過程中，合議庭發現與定罪、量刑有關的新的事實，有必要調查的，審判長可以宣布恢復法庭調查，在對新的事實調查後，繼續法庭辯論。選項B正確。 根據《刑訴解釋》第288條的規定，被告人在最後陳述中提出新的事實、證據，合議庭認為可能影響正確裁判的，應當恢復法庭調查；被告人提出新的辯解理由，合議庭認為可能影響正確裁判的，應當恢復法庭辯論。 可知，被告人在最後陳述中提出新的事實、證據，合議庭認為可能影響正確裁判的，應當恢復的是法庭調查 。選項C錯誤。 根據《刑訴解釋》第289條的規定，公訴人當庭發表與起訴書不同的意見，屬於變更、追加、補充或者撤回起訴的，人民法院應當要求人民檢察院在指定時間內以書面方式提出；必要時，可以宣布休庭。人民檢察院在指定時間內未提出的，人民法院應當根據法庭審理情況，就起訴書指控的犯罪事實依法作出判決、裁定。人民檢察院變更、追加、補充起訴的，人民法院應當給予被告人及其辯護人必要的準備時間。選項D錯誤。"}, {"id": "卷一-81", "subject": "卷一", "type": "多選題", "question": "張某、李某二人酒後偶遇精神病人吳某，為發泄情緒，對其隨意毆打，致其輕傷，花去治療費用1萬元。 案發後，李某逃匿，張某被抓獲並被檢察院以涉嫌尋釁滋事罪提起公訴。關於本案，下列哪些說法是不正確的？（　） 33", "options": [{"key": "A", "text": "如張某提出申請，法院可組織張某與吳某的近親屬進行刑事和解"}, {"key": "B", "text": "如吳某的近親屬提起附帶民事訴訟，可將張某和李某列為附帶民事訴訟的被告"}, {"key": "C", "text": "如吳某的近親屬提起附帶民事訴訟後，經傳喚，無正當理由拒不到庭，法院應按撤訴處理"}, {"key": "D", "text": "如法院審理後認為張某行為不構成犯罪，對提起的附帶民事訴訟應裁定駁回起訴"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】尋釁滋事罪是《刑法》第六章的罪名，不屬於刑事和解（《刑法》第四章、第五章）的案件範圍，A項錯誤。 根據《刑訴解釋》第183條規定，共同犯罪案件，同案犯在逃的，不應列為附帶民事訴訟被告人。B項錯誤。 根據《刑訴解釋》第195條第1、2款的規定，附帶民事訴訟原告人經傳喚，無正當理由拒不到庭，或者未經法庭許可中途退庭的，應當按撤訴處理。刑事被告人以外的附帶民事訴訟被告人經傳喚，無正當理由拒不到庭 ，或者未經法庭許可中途退庭的，附帶民事部分可以缺席判決。C項正確。 根據《刑訴解釋》第197條的規定，人民法院認定公訴案件被告人的行為不構成犯罪，對已經提起的附帶民事訴訟，經調解不能達成協議的，可以一併作出刑事附帶民事判決，也可以告知附帶民事原告人另行提起民事訴訟。人民法院准許人民檢察院撤回起訴的公訴案件，對已經提起的附帶民事訴訟，可以進行調解；不宜調解或者經調解不能達成協議的，應當裁定駁回起訴，並告知附帶民事訴訟原告人可以另行提起民事訴訟。因此，D項錯誤。"}, {"id": "卷一-82", "subject": "卷一", "type": "多選題", "question": "因鄰里矛盾，周某毆打侯某致其傷重不治。關於法庭審理，下列哪些說法是不正確的？（　）", "options": [{"key": "A", "text": "法庭發現周某可能有自首情節，而檢察院移送的案卷中沒有相關證據材料的，應當通知檢察院移送"}, {"key": "B", "text": "周某當庭檢舉他人的重大犯罪行為，法庭應當建議檢察院補充偵■"}, {"key": "C", "text": "法庭發現周某還涉嫌盜竊罪，可以通知人民檢察院補充偵查"}, {"key": "D", "text": "庭審中，周某的辯護律師王某被責令退出法庭後，王某不得繼續擔任周某的辯護律師"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】根據《刑訴解釋》第277條的規定，審判期間，合議庭發現被告人可能有自首、坦白、立功等法定量刑情節，而人民檢察院移送的案卷中沒有相關證據材料的，應當通知人民檢察院在指定時間內移送。審判期間，被告人提出新的立功線索的，人民法院可以建議人民檢察院補充偵查。所以，A項正確。 法院是可以而不是應當建議檢察院補充偵查。B項錯誤。 根據《刑訴解釋》第297條第1款的規定，審判期間，人民法院發現新的事實，可能影響定罪量刑的，或者需要補查補證的，應當通知人民檢察院，由其決定是否補充、變更、追加起訴或者補充偵查。C選項錯誤。 根據《刑訴解釋》第310條的規定，辯護人嚴重擾亂法庭秩序，被責令退出法庭、強行帶■法庭或者被處以罰款、拘留，被告人自行辯護的，庭審繼續進行；被告人要求另行委託辯護人，或者被告人屬於應當提供法律援助情形的，應當宣布休庭。辯護人、訴訟代理人被責令退出法庭、強行帶出法庭或者被處以罰款後，具結保證書，保證服從法庭指揮、不再擾亂法庭秩序的，經法庭許可，可以繼續擔任辯護人、訴訟代理人。辯護人、訴訟代理人具有下列情形之一的，不得繼續擔任同一案件的辯護人、訴訟代理人：（一）擅自退庭的 ；（二）無正當理由不出庭或者不按時出庭，嚴重影響審判順利進行的；（三）被拘留或者具結保證書後再次被責令退出法庭、強行帶出法庭的。由此可見，如果僅是第一次被責令退出法庭，如果具結保證，經過法庭許可，可以繼續擔任辯護人，所以D選項錯誤。"}, {"id": "卷一-83", "subject": "卷一", "type": "多選題", "question": "某市教育局局長李某因違反財經紀律被給予撤職處分。關於李某的處分，下列哪些說法是不正確的？（ ）", "options": [{"key": "A", "text": "應同時降低李某的級別"}, {"key": "B", "text": "李某的受處分期間為18個月"}, {"key": "C", "text": "李某在受處分期間不得晉升職務和級別，但可以晉升工資檔次"}, {"key": "D", "text": "李某對處分決定不服可以向人事爭議仲裁委員會申請仲裁"}], "answer": ["B", "C", "D"], "explanation_full": "34 分時，應當同時降低李某的級別。故A選項正確。 根據《公務員法》第64條第2款的規定，受處分的期間為：警告，6個月；記過，12個月；記大過，18個月 ；降級、撤職，24個月。李某的受處分期間應為24個月。故B選項錯誤。 根據《公務員法》第64條第1款的規定，公務員在受處分期間不得晉升職務、職級和級別，其中受記過、記大過、降級、撤職處分的，不得晉升工資檔次。受記過、記大過、降級、撤職處分的公務員，在受處分期間不得晉升職務、職級、級別和工資檔次；受警告處分的公務員，在受處分期間不得晉升職務、職級和級別，可以晉升工資檔次。題中李某受到的是撤職處分，在受處分期間既不得晉升職務、職級和級別，也不得晉升工資檔次。故C選項錯誤。 根據《公務員法》第95條第1款第1項的規定，公務員對涉及本人的下列人事處理不服的，可以自知道該人事處理之日起30日內向原處理機關申請復核；對復核結果不服的，可以自接到復核決定之日起15日內，按照規定向同級公務員主管部門或者作出該人事處理的機關的上一級機關提出申訴；也可以不經復核，自知道該人事處理之日起30日內直接提出申訴：①處分；……《公務員法》第105條第1款規定，聘任制公務員與所在機關之間因履行聘任合同發生爭議的，可以自爭議發生之日起60日內申請仲裁。因此，李某對處分決定不服可以申請復核或者提出申訴，而不是申請仲裁。故D選項錯誤。"}, {"id": "卷一-84", "subject": "卷一", "type": "多選題", "question": "關於治安管理處罰法，下列哪些說法是錯誤的？", "options": [{"key": "A", "text": "張某因為打架鬥毆被區公安分局作■拘留5天罰款3000元處罰，關於行政拘留，應當送達看守所執行，如果要申請暫緩執行，應當先就拘留處罰申請復議或提起訴訟，經公安局審查其不具有社會危害性的，可以通過提供擔保人或繳納2000元保證金的方式，暫緩執行行政拘留"}, {"key": "B", "text": "李某毆打孫某，孫某報警，民警■警後認為需要傳喚李某接受調查的，必須經辦案部門負責人批准，使用傳喚證傳喚，且不得強制傳喚，警察詢問孫某，可以到其所在單位或者住處進行，必要時，也可以通知其到公安機關提供證言"}, {"key": "C", "text": "甲區公安分局接到舉報，轄區內某酒館有人從事違法犯罪活動，於是派警察前往檢查，要求警察不得少於 2人，並必須出示工作證件和區公安局開具的檢查證明文件，檢查的情況應當製作檢■筆錄，由檢查人、被檢查人和見證人簽名或者蓋章，被檢查人拒絕簽名的，警察應當在筆錄上註明"}, {"key": "D", "text": "王某毆打朱某致輕微傷，經公安機關調解，二人達成協議的，對王某不予處罰"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】拘留處罰的執行場所是拘留所，而不是看守所。暫緩執行期間應按照每日行政拘留200元的標準交納保證金。張某被決定拘留5天，應交納1000元保證金，而不是2000元。故A選項錯誤。 原則上使用傳喚證傳喚；現場辦案可以口頭傳喚，但必須出示工作證件，且在詢問筆錄中註明；對無正當理由不接受傳喚或逃避傳喚的，可強制傳喚；對被害人和證人可以在單位、住所或公安機關詢問。故B選項錯誤 。 檢■住所，應雙證齊全；檢■其他的，原則上應雙證，但對確有必要立即進行檢查的，只出示工作證件就可以當場檢查。故C選項錯誤。 根據《治安管理處罰法》第9條：“對於因民間糾紛引起的打架鬥毆或者損毀他人財物等違反治安管理行為 ，情節較輕的，公安機關可以調解處理。經公安機關調解，當事人達成協議的，不予處罰。……”由此可知 ，經公安機關調解，當事人達成協議的，不再予以處罰。故D選項正確。"}, {"id": "卷一-85", "subject": "卷一", "type": "多選題", "question": "2022年1月15日，某區市場監管局就王某制售假冒偽劣產品行為實施現場檢查，王某拒絕在現場筆錄上簽字，執法人員予以註明。1月20日，該局作■扣押決定，對有關財物實施扣押（未製作扣押清單）。王某起訴請求撤銷扣押行為，並以被扣財物損毀為由請求賠償損失。審理期間，區市場監管局於3月10日解除了扣押行為。下列哪些選項是正確的？", "options": [{"key": "A", "text": "現場筆錄無王某簽字，不能作為證據使用"}, {"key": "B", "text": "王某如對現場筆錄的合法性有異議，可申請法庭通知行政執法人員■庭說明"}, {"key": "C", "text": "因無扣押財物清單，無法證明王某損失，法院確定由被告就損害情況舉證"}, {"key": "D", "text": "法院應判決撤銷被告的扣押行為專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 35"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】《最高人民法院關於行政訴訟證據若干問題的規定》第15條規定：“根據行政訴訟法第三十一條第一款第（七）項的規定，被告向人民法院提供的現場筆錄，應當載明時間、地點和事件等內容，並由執法人員和當事人簽名。當事人拒絕簽名或者不能簽名的，應當註明原因。有其他人在現場的，可由其他人簽名。法律、法規和規章對現場筆錄的製作形式另有規定的，從其規定。”根據該條規定，本題中，雖然王某拒絕在現場筆錄上簽名，但其上由執法人員註明原因，不妨礙該證據的證明作用。A選項錯誤。 《行訴法解釋》第41條規定：“有下列情形之一，原告或者第三人要求相關行政執法人員出庭說明的，人民法院可以准許：（一）對現場筆錄的合法性或者真實性有異議的……”B選項正確。 《行政訴訟法》第38條第2款規定：“在行政賠償、補償的案件中，原告應當對行政行為造成的損害提供證據 。因被告的原因導致原告無法舉證的，由被告承擔舉證責任。”《行訴法解釋》第47條規定：“根據行政訴訟法第三十八條第二款的規定，在行政賠償、補償案件中，因被告的原因導致原告無法就損害情況舉證的 ，應當由被告就該損害情況承擔舉證責任。對於各方主張損失的價值無法認定的，應當由負有舉證責任的一方當事人申請鑒定，但法律、法規、規章規定行政機關在作出行政行為時依法應當評估或者鑒定的除外；負有舉證責任的當事人拒絕申請鑒定的，由其承擔不利的法律後果。當事人的損失因客觀原因無法鑒定的，人民法院應當結合當事人的主張和在案證據，遵循法官職業道德，運用邏輯推理和生活經驗、生活常識等，酌情確定賠償數額。”C選項正確。 《行政訴訟法》第74條第2款規定：“行政行為有下列情形之一，不需要撤銷或者判決履行的，人民法院判決確認違法：（一）行政行為違法，但不具有可撤銷內容的；（二）被告改變原違法行政行為，原告仍要求確認原行政行為違法的；（三）被告不履行或者拖延履行法定職責，判決履行沒有意義的。”依照該條規定 ，當行政行為沒有可撤銷內容的時候，只能適用確認違法判決，不能適用撤銷判決，D選項錯誤。 不定項選擇題"}, {"id": "卷一-86", "subject": "卷一", "type": "多選題", "question": "習近平總書記指出：“推進全面依法治國是國家治理的一場深刻變革，必須以科學理論為指導。”對此 ，下列說法正確的是？（　）", "options": [{"key": "A", "text": "習近平法治思想是新時代全面依法治國的根本遵循和行動指南"}, {"key": "B", "text": "習近平法治思想構成了系統完備、邏輯嚴密、內在統一的科學思想體系"}, {"key": "C", "text": "習近平法治思想為全球治理體系變革提供了中國方案"}, {"key": "D", "text": "貫徹社會主義法治理論是中國特色社會主義法治道路的核心要義之一"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】習近平法治思想是馬克思主義法治理論中國化的最新成果，是全面依法治國的根本遵循和行動指南，A選項正確。 習近平法治思想具有系統性，它科學地指出了當前和今後一個時期推進全面依法治國十一個重要方面的要求 ，構成了系統完備、邏輯嚴密、內在統一的科學思想體系，B選項正確。 習近平法治思想的世界意義在於，為人類政治文明進步貢獻了中國智慧，為全球治理體系變革提供了中國方案，C選項正確。 中國特色社會主義法治道路的核心要義在於堅持黨的領導，堅持中國特色社會主義制度，貫徹中國特色社會主義法治理論，D選項正確。"}, {"id": "卷一-87", "subject": "卷一", "type": "多選題", "question": "改革既不是“法外之地”，更不是“法律禁地”。對此，下列說法正確的有？", "options": [{"key": "A", "text": "不得借改革之名進行違法亂紀活動"}, {"key": "B", "text": "立法時應當為未來的改革預留空間"}, {"key": "C", "text": "不應以現行法無依據為由遲滯改革"}, {"key": "D", "text": "先行先試的改革可以突破法律紅線"}], "answer": ["A", "B", "C"], "explanation_full": "36 動作用，做到在法治的軌道上推進改革。關於改革與法治的關係存在兩種錯誤觀點：一種觀點認為，改革就是要衝破法律禁區；“改革要上路，法律要讓路”。這種觀點很容易導致在實踐中搞違法的“改革”，也就是A選項所講的“不得借改革之名進行違法亂紀活動”。故該選項正確。另一種觀點認為，法律就是要保持穩定性、權威性、適當的滯後性，法律很難引領改革。這種觀點在實踐中就表現為不善於運用法治思維和法治方式引領改革。對於立法工作而言，
