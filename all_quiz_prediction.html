失槍支不報罪與玩忽職守罪的想象競合"}, {"key": "B", "text": "辦案人員因受賄而為實施重罪的犯罪嫌疑人通風報信，致使犯罪嫌疑人改變供述，導致其僅受輕罪追究 ，構成幫助犯罪分子逃避處罰罪"}, {"key": "C", "text": "國家機關工作人員為境外機構提供國家秘密，構成為境外非法提供國家秘密罪和故意泄露國家秘密罪的想象競合專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 37"}, {"key": "D", "text": "國家工作人員收受賄賂並實施瀆職犯罪，同時構成受賄罪的，一律數罪並罰"}], "answer": ["D"], "explanation_full": "【羿文解析】A項正確，依法配備公務用槍的國家機關工作人員丟失槍支，不及時報告，造成嚴重後果的，是丟失槍支不報罪與玩忽職守罪的想象競合，從一重罪處罰；其他依法配備公務用槍的非國家機關工作人員丟失槍支不及時報告，造成嚴重後果的，認定為丟失槍支不報罪。B項正確，徇私枉法罪要求司法工作人員濫用自己的職權，通風報信不屬於徇私枉法罪中的直接瀆職行為。C項正確，一行為觸犯數罪名。D項錯誤，根據刑法第399條第4款：司法工作人員收受賄賂，有前三款行為（徇私枉法罪，民事、行政枉法裁判罪，執行判決、裁定失職罪，執行判決、裁定濫用職權罪），同時又構成受賄罪的，擇一重罪論處。"}, {"id": "卷一-99", "subject": "卷一", "type": "單選題", "question": "關於黨的領導與全面推進依法治國的關係，下列哪一說法是錯誤的？（　）", "options": [{"key": "A", "text": "黨的領導是全面推進依法治國、加快建設社會主義法治國家最根本的保證"}, {"key": "B", "text": "黨的領導是中國特色社會主義法治最本質的特徵"}, {"key": "C", "text": "提高黨員幹部法治思維和依法辦事能力"}, {"key": "D", "text": "黨內法規高於國家法律"}], "answer": ["D"], "explanation_full": "【羿文解析】加強和改進黨對法治工作領導，要求加強黨內法規制度建設，注重黨內法規與國家法律的銜接和協調。要堅持以黨章和憲法為基本遵循，保證黨內法規制度體系與中國特色社會主義法律體系內在統一。 要發揮黨內法規對社會主義建設的引領作用，在有些規範、要求在全社會還不具備實施條件時，可先制定黨規在黨內實行，不斷調整完善，待條件成熟時再通過立法在國家層面施行。因此D項錯誤。其他選項說法都正確。"}, {"id": "卷一-100", "subject": "卷一", "type": "多選題", "question": "下列關於刑事鑒定的表述，不正確的有∶", "options": [{"key": "A", "text": "只有精神病鑒定期間計入辦案期限，其他鑒定期間均不計入辦案期限"}, {"key": "B", "text": "甲乙兩名鑒定人對案件專門事項進行鑒定，但鑒定意見相左，法官應當對該事項重新鑒定"}, {"key": "C", "text": "鑒定人應當出庭就鑒定意見說明情況，否則鑒定意見不得作為定案根據"}, {"key": "D", "text": "鑒定意見上，鑒定單位的公章不能取代鑒定人的簽名"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】A項錯誤，只有精神病鑒定期間不計入辦案期限。B項錯誤，多名鑒定人，鑒定意見不一致，應如實記入筆錄，法官自己審查判斷。C項錯誤，法院通知鑒定人到庭的，鑒定人必須到庭，如果法院沒有要求鑒定人到庭，鑒定人可以不來。D項正確，鑒定意見必須有鑒定人簽名和鑒定機構的蓋章。 38"}, {"id": "卷一-1", "subject": "卷一", "type": "單選題", "question": "小王因故意殺人罪被G省H市中級法院判處死刑立即執行，被告人沒有上訴，H市檢察院未抗訴，下列對該案處理的說法，哪一選項是正確的？", "options": [{"key": "A", "text": "H市中級法院應在上訴、抗訴期滿後3日內報請G省高級法院復核，G省高級法院在復核時可以訊問張某"}, {"key": "B", "text": "最高人民法院復核該案時，應當進行全面審查"}, {"key": "C", "text": "最高人民法院復核該案時，應當組成合議庭開庭審理"}, {"key": "D", "text": "最高人民法院復核該案時，應當在最高人民法院辦公場所當面聽取辯護律師意見，並當面訊問小王"}], "answer": ["B"], "explanation_full": "【羿文解析】①《高法解釋》第423條第1款規定：“報請最高人民法院核准死刑案件，應當按照下列情形分別處理：（一）中級人民法院判處死刑的第一審案件，被告人未上訴、人民檢察院未抗訴的，在上訴、抗訴期滿後十日以內報請高級人民法院復核。高級人民法院同意判處死刑的，應當在作出裁定後十日以內報請最高人民法院核准；認為原判認定的某一具體事實或者引用的法律條款等存在瑕疵，但判處被告人死刑並無不當的，可以在糾正後作出核准的判決、裁定；不同意判處死刑的，應當依照第二審程序提審或者發回重新審判；……”依據此法條可知，A項的錯誤有兩處：第一，不是“3日內”，而是“10日內”報請復核；第二 ，G省高級法院在復核時“應當”而不是“可以”訊問小王，因為《高法解釋》第423條第2款規定，高級人民法院復核死刑案件，應當訊問被告人。 ②《高法解釋》第427條第1款規定：“復核死刑、死刑緩期執行案件，應當全面審查以下內容：（一）被告人的年齡，被告人有無刑事責任能力、是否系懷孕的婦女；（二）原判認定的事實是否清楚，證據是否確實 、充分；（三）犯罪情節、後果及危害程度；（四）原判適用法律是否正確，是否必須判處死刑，是否必須立即執行；（五）有無法定、酌定從重、從輕或者減輕處罰情節；（六）訴訟程序是否合法；（七）應當審查的其他情況。”本題B項中“最高人民法院復核該案時，應當進行全面審查”這一說法是正確的。 ③本題C項的錯誤在於，最高人民法院復核死刑案件，不需要開庭審理，最高人民檢察院也無須派員出庭。 ④D項的錯誤在於，最高人民法院復核死刑案件，應當訊問被告人，但不需要當面訊問。而且，最高人民法院復核死刑案件應當聽取辯護律師意見的前提是“辯護律師提要求”，並且，當面聽取辯護律師意見，應當在最高人民法院或者地方人民法院辦公場所進行。 綜上，本題正確答案為B選項。"}, {"id": "卷一-2", "subject": "卷一", "type": "單選題", "question": "小張因盜竊被判處有期徒刑5年，在交付執行前，因生活不能自理，需保外就醫。下列哪一選項是錯誤的？", "options": [{"key": "A", "text": "在決定監外執行前，由法院負責組織對張某進行生活不能自理的鑒別"}, {"key": "B", "text": "法院在作出暫予監外執行決定前，應當徵求檢察院的意見"}, {"key": "C", "text": "檢察院對監外執行的意見和監外執行的決定，均有權提出書面意見"}, {"key": "D", "text": "監外執行期間，情形消失後刑期未滿的，由監獄提出書面意見，報省級以上監獄管理機關批准收監執行"}], "answer": ["D"], "explanation_full": "【羿文解析】①《全國人民代表大會常務委員會關於[音頻]第二百五十四條（現第二百六十五條）第五款、 第二百五十七條（現第二百六十八條）第二款的解釋》第1款規定，罪犯在被交付執行前，因有嚴重疾病、懷孕或者正在哺乳自己嬰兒的婦女、生活不能自理的原因，依法提出暫予監外執行的申請的，有關病情診斷、 妊娠檢■和生活不能自理的鑒別，由人民法院負責組織進行。故A項表述正確。 ②《高法解釋》第515條第2款，人民法院在作出暫予監外執行決定前，應當徵求人民檢察院的意見。故B項表述正確。 ③依據《刑事訴訟法》第266、267條的規定，檢察院對監外執行的意見和監外執行的決定，均是以提出書面意見的方式監督。故C項表述正確。 ④《刑事訴訟法》第268條第2款規定，對於人民法院決定暫予監外執行的罪犯應當予以收監的，由人民法院作出決定，將有關的法律文書送達公安機關、監獄或者其他執行機關。故D項的錯誤在於，小張在交付執行前由法院決定監外執行，則由法院作出收監決定。 綜上，本題正確答案為D選項。 1"}, {"id": "卷一-3", "subject": "卷一", "type": "單選題", "question": "關於合理行政原則，下列說法哪一選項是錯誤的？（　）", "options": [{"key": "A", "text": "行政機關實施行政管理，應當遵循公平、公正的原則"}, {"key": "B", "text": "要平等對待行政管理相對人，不偏私、不歧視"}, {"key": "C", "text": "行使自由裁量權應當符合法律目的，排除不相關因素的干擾"}, {"key": "D", "text": "行政機關實施行政管理，除涉及國家秘密和依法受到保護的商業秘密、個人隱私的外，應當公開，注意聽取公民、法人和其他組織的意見"}], "answer": ["D"], "explanation_full": "【羿文解析】A、B、C、選項正確。《全面推進依法行政實施綱要》對合理行政的要求是，行政機關實施行政管理，應當遵循公平、公正的原則。要平等對待行政管理相對人，不偏私、不歧視。行使自由裁量權應當符合法律目的，排除不相關因素的干擾；所採取的措施和手段應當必要、適當；行政機關實施行政管理可以採用多種方式實現行政目的的，應當避免採用損害當事人權益的方式。 D選項錯誤。《全面推進依法行政實施綱要》對程序正當的要求是，行政機關實施行政管理，除涉及國家秘密和依法受到保護的商業秘密、個人隱私的外，應當公開，注意聽取公民、法人和其他組織的意見；要嚴格遵循法定程序，依法保障行政管理相對人、利害關係人的知情權、參與權和救濟權。行政機關工作人員履行職責，與行政管理相對人存在利害關係時，應當迴避。"}, {"id": "卷一-4", "subject": "卷一", "type": "單選題", "question": "下列屬於行政訴訟受案範圍的是？（　）", "options": [{"key": "A", "text": "市交通局為了論證專車問題是否應當予以處罰，咨詢了有關專家並進行了論證，噠噠公司對論證結論不滿意，提起行政訴訟"}, {"key": "B", "text": "市環保局督促區環保局應當對霧霾問題積極履責，張某對督促行為提起訴訟"}, {"key": "C", "text": "市政府針對張某的信訪事項作出的交辦行為，張某對交辦行為提起訴訟"}, {"key": "D", "text": "某企業的產品生產許可證有效期限屆滿未申請延續，區市場監督管理局對其許可證予以註銷.該企業不服而起訴"}], "answer": ["D"], "explanation_full": "【羿文解析】（1）行政機關為作出行政行為而實施的準備、論證、研究、層報、咨詢等過程性行為，不必然對外影響權利義務，不可訴，所以，A選項不選。（2）上級行政機關基於內部層級監督關係對下級行政機關作出的聽取報告、執法檢查、督促履責等行為，屬於內部行為，不可訴，所以，B選項不選。（3）行政機關針對信訪事項作出的登記、受理、交辦、轉送、複查、復核意見等行為，未對當事人的權利義務構成新的影響，不可訴，所以，C選項不選。（4）註銷許可證是對當事人的權利義務構成影響的具有可訴性的具體行政行為，所以D選項當選。"}, {"id": "卷一-5", "subject": "卷一", "type": "單選題", "question": "關於犯罪未遂，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "甲以勒索財物為目的搶劫了嬰兒張某後，通過電話向其父張大某勒索財物，但所撥打的電話是空號，甲只好將張某送回。甲屬於綁架罪未遂"}, {"key": "B", "text": "乙欲盜汽車，向劉某借得盜車鑰匙。但在乙盜車之前，劉某將鑰匙要回，乙用其他方法將車盜走。乙屬於盜竊罪既遂，劉某屬於盜竊罪的未遂"}, {"key": "C", "text": "丙將自己剛出生的嬰兒以1萬元賣給朱某。第二天，因擔心嬰兒的安全丙又從朱某處將嬰兒抱回。丙屬於拐賣兒童罪的未遂"}, {"key": "D", "text": "丁在商場將一條金項鏈放在自己的胸罩裡迅速逃離，慌亂中在商場內摔倒，金項鏈被摔出，被路人撿走。 丁屬於盜竊罪的既遂"}], "answer": ["D"], "explanation_full": "【羿文解析】A選項，由於甲已經實際控制了嬰兒張某，之後的行為都算是既遂犯罪的酌定情節，甲成立的是綁架罪既遂。A選項錯誤，不當選。B選項，幫助犯消除自己物理上的影響，如果是在正犯著手之前消除的 2 此丙已經成立拐賣兒童罪的既遂。C選項錯誤，不當選。D選項，金項鏈已經處於丁的管理控制之下，丁已經構成盜竊罪的既遂。D選項正確，當選。"}, {"id": "卷一-6", "subject": "卷一", "type": "單選題", "question": "關於會見權通信權的說法，下列哪一項是正確的？（　）", "options": [{"key": "A", "text": "對於危害國家安全犯罪案件、恐怖活動犯罪案件和貪污賄賂犯罪案件，辯護律師要求會見犯罪嫌疑人的 ，應當經偵查機關許可"}, {"key": "B", "text": "不得限制辯護律師會見的次數和時間"}, {"key": "C", "text": "辯護律師與犯罪嫌疑人、被告人的往來信件，看守所應當及時傳遞，但可以對信件進行必要的檢查"}, {"key": "D", "text": "非律師辯護人經公安機關、人民檢察院的許可，也可以同在押的犯罪嫌疑人、被告人會見和通信"}], "answer": ["C"], "explanation_full": "【羿文解析】新修訂的《刑事訴訟法》第39條規定，對於危害國家安全犯罪案件、恐怖活動犯罪案件，辯護律師在偵查期間要求會見在押的犯罪嫌疑人，應當經偵查機關許可。A選項錯誤。律師會見在押的犯罪嫌疑人 、被告人的，看守所應當保障律師履行辯護職責需要的時間和次數。B選項錯誤。對於辯護律師與犯罪嫌疑人 、被告人的往來信件，看守所應當及時傳遞。看守所可以對信件進行必要的檢查，但不得截留、複製、刪改信件，不得向辦案機關提供信件內容，但信件內容涉及危害國家安全、公共安全、嚴重危害他人人身安全以及涉嫌串供、毀滅證據等情形的除外。C選項正確。其他辯護人經人民法院、人民檢察院許可，也可會見和通信。D選項錯誤。"}, {"id": "卷一-7", "subject": "卷一", "type": "單選題", "question": "甲把商戶的支付寶二維碼換成自己的二維碼，商戶直到月底結款的時候才發現，顧客付款時實際上將貨款支付給了甲。甲通過這種手段共收取了50萬元。關於本案，下列哪一選項是錯誤的？", "options": [{"key": "A", "text": "顧客在付款時不存在民事過錯，商戶無權要求顧客再次付款，故商戶遭受了財產損失，屬於財產犯罪的被害人"}, {"key": "B", "text": "顧客從一開始就沒有將自己的銀行債權轉移給商戶占有，甲不可能盜竊商戶占有的銀行債權，故甲對銀行債權不可能成立盜竊罪"}, {"key": "C", "text": "甲欺騙顧客使其處分了商戶應當得到的銀行債權，故甲的行為與商戶的損失之間存在刑法上的因果關係"}, {"key": "D", "text": "甲欺騙顧客使其處分了自己的財產，致使商家遭受財產損失的，成立詐騙罪，屬於三角詐騙"}], "answer": ["C"], "explanation_full": "【羿文解析】①顧客在付款時不存在民事過錯，商戶無權要求顧客再次付款，因此顧客取得了商品，不存在財產損失，不是財產犯罪的被害人；但遭受財產損失的是商戶，商戶屬於財產犯罪的被害人。A選項說法正確 。 ②顧客購物付款，但商戶未獲得貨款，即從一開始顧客就沒有將自己的銀行債權轉移給商戶占有。因此，不能認為甲盜竊了商戶占有的銀行債權，即甲對銀行債權不可能成立盜竊罪。B選項說法正確。 ③甲欺騙顧客使其處分了自己的財產給甲，致使商家遭受財產損失，即甲的行為與商戶的損失之間存在刑法上的因果關係，甲的行為成立詐騙罪，屬於三角詐騙。D選項說法正確。 ④顧客雖然被騙處分財產，但顧客處分的是自己的錢財，而非處分給商戶應當得到的債權，因為顧客是被騙後直接將現金交給了甲，而非把商戶享有的債權轉移給了甲。C選項說法錯誤。 綜上，本題正確答案為C選項。"}, {"id": "卷一-8", "subject": "卷一", "type": "單選題", "question": "經甲公司申請，市建設局給其頒發建設工程規劃許可證。後該局在復核中發現甲公司在申請時報送的企業法人營業執照已經超過有效期，遂依據《行政許可法》規定，撤銷該公司的規劃許可證，並予以註銷。甲公司不服，向法院提起訴訟。市建設局撤銷甲公司規劃許可證的行為屬於下列哪一類別？（　）", "options": [{"key": "A", "text": "行政處罰"}, {"key": "B", "text": "行政強制措施"}, {"key": "C", "text": "行政行為的撤銷"}, {"key": "D", "text": "行政檢■ 3"}], "answer": ["C"], "explanation_full": "【羿文解析】所謂行政處罰，是指國家行政機關對構成行政違法行為的公民、法人或者其他組織實施的行政法上的制裁。而行政違法，是指公民、法人或者其他組織違反國家管理秩序，依照法律應當由國家行政機關給予行政處罰的危害社會的行為。在該題中，市建設局撤銷規劃許可證是因為該企業營業執照超過有效期限 ，不符合許可條件，而並不是因為該企業的行政違法行為。據此，A選項不正確。所謂行政強制措施，是指行政機關對公民、法人或者其他組織的人身和財產直接使用國家強制手段採取的處置措施。一般包括行政監管中採取的強制檢查措施、防止和制止危害社會行為的強制控制措施、應對突發公共事件的強制措施、行政強制執行中的強制執行措施。國家機關採取強制措施以當事人必須或者應當履行法律義務為重要前提，而本題中建設局既不是對甲公司的財產採取措施，也不是因為甲公司未履行特定義務而撤銷許可證，據此，B選項不當選。行政檢查是指行政機關對公民、法人和其他組織履行法律義務的監督檢查，其主要目的是獲得公民、 法人和其他組織履行法律義務的情況和信息，以作為行政機關作出某種行政行為的前提。很明顯，該題中撤銷規劃許可證的行為本身是行政監督檢查的結果，而非行政檢查。據此，D選項不當選。具體行政行為具有違法情形及明顯不適當的時候，可以撤銷。撤銷可以是本機關自行撤銷、也可以是其他有權機關撤銷。據此 ，建設局依據《行政許可法》第69條的規定對不具備許可條件的人准許許可後而予以撤銷的行為是行政行為的撤銷。C項正確。"}, {"id": "卷一-9", "subject": "卷一", "type": "單選題", "question": "關於依法治國的表述，下列說法哪一選項是不正確的？（　）", "options": [{"key": "A", "text": "建設法治中國，必須堅持法治國家、法治政府、法治社會的一體建設"}, {"key": "B", "text": "各級政府要普遍建立法律顧問制度.促進依法行政"}, {"key": "C", "text": "為了提升執法傚率，需要整合執法主體，相對集中執法權，必要時可以突破現有法律制度的規定"}, {"key": "D", "text": "審判的公開化要求增強法律文書說理性，拓寬群眾參與司法的渠道"}], "answer": ["C"], "explanation_full": "【羿文解析】習近平同志指出，建設法治中國，必須堅持依法行政、依法執政、依法治國共同推進，堅持法治國家、法治政府、法治社會的一體建設。A項正確。建設法治國家，需要推進行政執法體制改革，例如：各級政府要普遍建立法律顧問制度，特別是要完善法規的備案、審查工作，從而促進依法行政。B項正確。為了提升執法傚率，需要整合執法主體，相對集中執法權，減少行政執法層級.加強食品藥品、安全生產、環境保護、勞動保障、海域海島等重點領域基層執法力量。理順城管執法體制，提高執法和服務水平等。但這一系列改革是以現存法律制度為前提的。C項錯誤。建設法治國家，需要推進司法體制改革，尤其是推進審判公開 、檢務公開，錄製並保留全程庭審資料。增強法律文書說理性，推動公開法院生效裁判文書。嚴格規範減刑 、假釋、保外就醫程序，強化監督制度。廣泛實行人民陪審員、人民監督員制度，拓寬人民群眾有序參與司法的渠道等。D項正確。"}, {"id": "卷一-10", "subject": "卷一", "type": "單選題", "question": "根據《選舉法》的規定，關於選舉機構，下列哪一選項是不正確的？（　）", "options": [{"key": "A", "text": "特別行政區全國人大代表的選舉由全國人大常委會主持"}, {"key": "B", "text": "省、自治區、直轄市、設區的市、自治州的人大常委會領導本行政區域內縣級以下人大代表的選舉工作"}, {"key": "C", "text": "鄉、民族鄉、鎮的選舉委員會受不設區的市、市轄區、縣、自治縣人大常委會的領導"}, {"key": "D", "text": "選舉委員會對依法提出的有關選民名單的申訴意見，應在3日內作出處理決定"}], "answer": ["B"], "explanation_full": "【羿文解析】《選舉法》第9條第1款規定，全國人民代表大會常務委員會主持全國人民代表大會代表的選舉 。《選舉法》第16條第二款規定，香港特別行政區、澳門特別行政區應選全國人民代表大會代表的名額和代表產生辦法，由全國人民代表大會另行規定。從慣例來講，歷屆全國人大都會公布港澳特別行政區選舉下一屆全國人民代表大會代表的辦法，如《中華人民共和國香港特別行政區選舉第十一屆全國人民代表大會代表的辦法》、《中華人民共和國澳門特別行政區選舉第十一屆全國人民代表大會代表的辦法》，這兩個辦法的第2條都明確規定了特別行政區選舉全國人民代表大會代表由全國人民代表大會常務委員會主持。從上述規定可以得出，凡全國人大代表的選舉，都由全國人大常委會主持，A選項正確。《選舉法》第9條第3款規定，省 4 選舉委員會受不設區的市、市轄區、縣、自治縣的人民代表大會常務委員會的領導，C選項正確。《選舉法》 第29條規定，對於公布的選民名單有不同意見的，可以在選民名單公布之日起5日內向選舉委員會提出申訴。 選舉委員會對申訴意見，應在3日內作出處理決定，D選項正確。因此本題答案為B。"}, {"id": "卷一-11", "subject": "卷一", "type": "單選題", "question": "某縣政府依田某申請作■復議決定，撤銷某縣公安局對田某車輛的錯誤登記，責令在30日內重新登記，但某縣公安局拒絕進行重新登記。田某可以釆取下列哪一項措施？（　）", "options": [{"key": "A", "text": "申請法院強制執行"}, {"key": "B", "text": "對某縣公安局的行為申請行政復議"}, {"key": "C", "text": "向法院提起行政訴訟"}, {"key": "D", "text": "請求某縣政府責令某縣公安局登記"}], "answer": ["D"], "explanation_full": "【羿文解析】本題當中，某縣政府責令某縣公安局重新登記的決定不是行政裁決，故田某不能申請法院強制執行某縣政府的復議決定。A不當選。縣公安局不履行復議決定的行為不屬於《行政復議法》第6條規定的行政復議範圍和《行政訴訟法》第12條規定的行政訴訟受案範圍，因此B、C兩項錯誤。根據《行政復議法》第 32條之規定，被申請人應當履行行政復議決定。被申請人不履行或者無正當理由拖延履行行政復議決定的 ，行政復議機關或者有關上級行政機關應當責令其限期履行。根據該規定，某縣政府應當責令某縣公安局登記。故正確答案為D。"}, {"id": "卷一-12", "subject": "卷一", "type": "單選題", "question": "關於因果關係，下列哪一選項說法是錯誤的？", "options": [{"key": "A", "text": "護士在注射抗生素時沒有為患者做皮試，患者因注射抗生素而死亡，但是事後查明，即使做皮試也不能查出患者的特殊反應，不能將死亡結果歸屬於護士的行為。"}, {"key": "B", "text": "甲將水性不好的乙推入水庫後離開，但是甲立即就能抓住身邊的可以保住性命的木板，此時與甲沒有任何意思聯絡的丙迅速拿走木板，導致乙溺水身亡，死亡結果應該歸屬於丙的行為"}, {"key": "C", "text": "甲酒後在封閉的高速公路上駕駛機動車，撞死了突然違章橫穿高速公路的乙，死亡結果可以歸屬於甲的酒後駕車行為"}, {"key": "D", "text": "機動車駕駛者甲撞傷乙後，警察立即將具有救助可能性的乙送往醫院，但途中發生事故導致乙死亡，此時死亡結果不能歸屬於甲"}], "answer": ["C"], "explanation_full": "【羿文解析】①只有當行為和結果之間具有條件關係，而且行為的危險已經現實化為侵害結果時，才能將該侵害結果歸屬於行為，沒有結果迴避可能性時，不能將結果歸屬於行為，即使做皮試也不能查出患者的特殊反應，屬於不具有結果迴避可能性的行為，不能將死亡結果歸屬於護士的行為。A選項說法正確。 ②只有當行為和結果之間具有條件關係，而且行為的危險已經現實化為侵害結果時，才能將該侵害結果歸屬於行為，甲的行為結束後，介入了丙的行為，丙的行為導致了乙的死亡結果，甲的行為沒有現實化為侵害結果，故乙的死亡結果應當歸屬於丙的行為。B選項說法正確。 ③行為沒有引起注意規範的保護目的所指向的結果時，不能將結果歸屬於行為，甲醉酒駕駛的行為雖然違反了注意規範，但是禁止酒後駕駛是為了防止因喪失或者減輕控制車輛的能力而造成死亡結果，本案中乙的死亡結果不能歸屬於甲。C選項說法錯誤。 ④在防止結果的發生屬於他人負責的領域時，結果的發生不能歸屬於行為人的行為。在警察介入之後，防止死亡結果的救助義務已經屬於警察負責的領域，故不能將乙的死亡結果歸屬於於甲。D選線說法正確。 綜上，本題正確答案為C選項。"}, {"id": "卷一-13", "subject": "卷一", "type": "單選題", "question": "清末以來，中國封建法制受到內外力量的衝擊而發生了一系列變革。以下關於中國近代法制的表述，哪一說法是正確的？（　）", "options": [{"key": "A", "text": "1908年頒布的《欽定憲法大綱》作為中國近代史上第一部憲法性文件，給皇權專制披上了憲法外衣，其後設立的諮議局和資政院屬於資本主義性質的議會組織"}, {"key": "B", "text": "1911年《大清現行刑律》作為中國第一部近代意義的專門刑法典，在吸納近代資產階級罪刑法定等原則的專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 5 同時，對純屬民事性質的條款不再科刑"}, {"key": "C", "text": "《大清民律草案》並未正式頒布與實施，其立法思想是“中體西用”"}, {"key": "D", "text": "《中華民國臨時約法》是中華民國正式頒行的第一部憲法，肯定了資產階級共和國的國家制度，實行責任內閣制"}], "answer": ["C"], "explanation_full": "【羿文解析】諮議局和資政院是承旨辦事的御用機構，不是議會組織，因此A項錯誤。《大清新刑律》是中國第一部近代意義的專門刑法典，因此B項錯誤。《大清民律草案》完成後僅兩個多月，辛亥革命武昌起義爆發 ，清王朝的腐敗統治隨即迅速崩潰，因此，這部民律草案並未正式頒布與實施，C項正確。《中華民國憲法》 （“賄選憲法”）是近代中國第一部正式頒行的憲法，因此D項錯誤。"}, {"id": "卷一-14", "subject": "卷一", "type": "單選題", "question": "張某出生在美國，且其父母是中國公民並定居在美國。根據美國法律，張某出生時即可獲得美國國籍。 2018年張某在中國毆打中國公民王某造成王某重傷，美國向我國申請將張某引渡同美國接受審判。關於本案 ，下列說法正確的是？（　）", "options": [{"key": "A", "text": "根據我國《國籍法》，張某不能因出生獲得中國國籍"}, {"key": "B", "text": "我國可以對張某打人事件行使保護性管轄權"}, {"key": "C", "text": "如果我國準備對張某提起刑事訴訟，則應當拒絕美國的引渡請求"}, {"key": "D", "text": "應該由最高人民法院指定的高級人民法院對美國的請求進行審查並由最高院復核.最終報國務院決定是否將張某引渡到美國"}], "answer": ["A"], "explanation_full": "【羿文解析】選項A正確。根據我國《國籍法》的規定，下列情形下能夠因出生獲得中國國籍：（1）父母雙方或一方為中國公民，本人出生在中國，具有中國國籍。（2）父母雙方或一方為中國公民，本人出生在外國 ，具有中國國籍；但父母雙方或一方為中國公民並定居在外國，本人出生時即具有外國國籍的，不具有中國國籍。（3）父母無國籍或國籍不明，定居在中國，本人出生在中國，具有中國國籍。本題中張某的父母定居在美國，且其於美國出生時即具有美國國籍，所以張某不能夠因出生獲得中國國籍。國籍獲得和喪失中特別注意“定居”這一因素，自動喪失和不能因出生獲得國籍都有“定居”的要求。選項B錯誤。大家一定要注意區分國家的幾種管轄權。屬地管轄是在我的地盤上發生的事情我要管。屬人管轄則為是我的人（一般題目中多位於國外）我要管。保護性管轄則是在別人的地盤上欺負了我的人我要管（針對加害方）。普遍性管轄則是發生了侵害全人類利益的罪行大家都能管。本案中張某打人事件發生在我國，我國可以根據屬地管轄原則行使管轄權。不符合保護性管轄權的行使條件。注意保護性管轄和普遍性管轄的行使條件。普遍性管轄可以在公海上行使，保護性管轄則不能。保護性管轄針對的是在外國損害內國或內國人利益的行為，針對的是加害方。選項C錯誤。根據我國《引渡法》的規定，我國對於引渡請求所指的犯罪具有刑事管轄權，並且對被請求引渡人正在進行刑事訴訟或者準備提起刑事訴訟的，“可以”而非“應當”拒絕相關引渡請求。一定注意引渡中應當拒絕的理由和可以拒絕的理由。注意準備提起訴訟和正在進行訴訟的是可以拒絕，已經終止訴訟程序和作出生效判決的是應當拒絕。其餘情形參見背誦版。選項D錯誤。根據我國《引渡法》的規定，最高院決定不予引渡的，由外交部直接告知請求方即可。只有最高院決定准許引渡的，才由外交部報國務院最終決定是否引渡。也就是說最高院和國務院各有一部分的決定權。"}, {"id": "卷一-15", "subject": "卷一", "type": "單選題", "question": "甲向乙提議“收拾\"丙，乙同意並與甲共同對丙實施暴力，致使丙死亡。屍檢報告表明，丙身上僅有一處傷口致使其死亡，但無法證明是誰導致該傷口。事後還查明，甲具有殺人故意，乙僅具有傷害故意。關於本案，下列哪一選項是錯誤的？", "options": [{"key": "A", "text": "如果要求故意的內容相同才成立共犯，則甲、乙屬於同時犯，按照存疑時有利於行為人的原則，甲、乙的行為與丙的死亡不具有刑法上的因果關係"}, {"key": "B", "text": "無論甲、乙是否成立共同犯罪，甲都成立故意殺人罪，乙都成立故意傷害罪，但甲、乙對丙的死亡結果均不負刑事責任"}, {"key": "C", "text": "只有認定甲、乙成立共同犯罪，適用部分實行全部責任原則，才能將丙的死亡結果歸屬於甲、乙二人"}, {"key": "D", "text": "倘若堅持共犯是解決危害結果歸屬的觀點，則甲、乙在違法層面成立共同正犯，甲成立故意殺人罪既遂專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 6 ，乙成立故意傷害（致死）罪"}], "answer": ["B"], "explanation_full": "【羿文解析】①如果認為共同犯罪的成立必須要求具有相同的犯罪故意，那麼甲是殺人故意，乙是傷害故意 ，甲乙二人不成立共同犯罪。無法適用“部分實行，全部責任原則”。屬於同時犯，適用“存疑時有利於行為人原則”，不能將死亡結果歸屬於甲乙任何一人。A選項說法正確。 ②如果認為甲乙可以成立共同犯罪（共同正犯），那麼適用“部分實行，全部責任”原則，甲乙均需要對丙的死亡結果負責。B選項說法錯誤，C選項說法正確。 ③如果堅持共犯是解決危害結果歸屬問題的觀點（違法層面的共犯理論），那麼共同犯罪的成立不需要共同的犯罪故意，只是在不法層面成立共犯即可，責任進行單獨認定，甲成立故意殺人罪既遂，乙成立故意傷害 （致死）罪。D選項說法正確。 綜上，本題正確答案為B選項。"}, {"id": "卷一-16", "subject": "卷一", "type": "單選題", "question": "下列哪一判斷是錯誤的？（　）", "options": [{"key": "A", "text": "國有公司的出納甲，為了輓回男朋友的心，利用螺絲刀打開自己保管的保險櫃，偽造盜竊現場，將現金5萬元送給自己的男朋友用於買手錶。甲成立貪污罪"}, {"key": "B", "text": "在某單位徵用土地的過程中，土地管理局的工作人員乙與被徵用土地的農民余某相勾結，由余某多報土地上的莊稼數，乙加蓋土地管理局的印章予以證實.進而從該單位多領補償款。乙成立貪污罪"}, {"key": "C", "text": "丙明知他人使用公款用於販賣毒品，而將公款挪用給他人的行為，成立挪用公款罪的正犯與販賣毒品罪的幫助犯，實行數罪並罰"}, {"key": "D", "text": "國家機關工作人員丁擁有300萬元現金，在檢察機關責令其說明理由時，丁說明了該300萬元來源於經商 （經商行為本身合法，但國家機關工作人員經商是非法行為），而且提供了充分證據。丁不成立巨額財產來源不明罪"}], "answer": ["B"], "explanation_full": "【羿文解析】A項正確。國有公司的出納甲利用職務上的便利，利用螺絲刀將現金從自己保管的保險櫃中取出用以揮霍，並偽造成盜竊現場，甲的行為成立貪污罪。B項錯誤。乙雖然屬於國家工作人員，也利用了職務上的便利幫助余某多領徵地補償款，但是其行為不屬於貪污罪的實行行為，而是成立余某財產犯罪的幫助行為 ，即詐騙罪的幫助行為，因此乙構成詐騙罪的幫助犯，而不成立貪污罪。C項正確。丙在明知他人欲販賣毒品的情況下，挪用公款為其提供販毒資金，前行為構成挪用公款罪，屬於實行犯，後行為構成販賣毒品罪，屬於幫助犯，對其應當數罪並罰。D項正確。國家工作人員丁針對其300萬元資產說明了來源，不成立巨額財產來源刁明罪，本罪屬於真正不作為犯，實行行為是被責令說明來源，不能說明來源。丁作為國家機關工作人員經商是非法行為，應當視具體情況將其行為性質進行認定為無罪或其他犯罪.而不是認定為本罪。"}, {"id": "卷一-17", "subject": "卷一", "type": "單選題", "question": "甲法官處理一起傷害賠償案件，耐心向被告乙解釋計算賠償數額的法律依據，並將最高法院公報發布的已生效同類判決提供乙參考。乙接受甲法官建議，在民事調解書上簽字賠償了原告損失。關於本案，下列哪一判斷是正確的？（　）", "options": [{"key": "A", "text": "法院已生效同類判決具有普遍約束力"}, {"key": "B", "text": "甲法官在該案調解時適用了判例法"}, {"key": "C", "text": "甲法官提供的指導性案例具有說服力"}, {"key": "D", "text": "民事調解書經乙簽署後即具有行政強制執行力"}], "answer": ["C"], "explanation_full": "【羿文解析】在中國，判例的重要性被人們普遍承認。但是，中國不是判例法國家，法院已生效同類判決不具有普遍約束力。最高人民法院發布的裁判文書具有最高的司法傚力，但是作為法的非正式淵源而存在，不具有明文規定的法律效力，只具有法律說服力。故C正確，AB錯誤。人民法院進行調解，達成協議的，人民法院應當製作調解書。調解書經雙方當事人簽收後，即具有法律效力。但是這裡的法律效力，主要是指申請人民法院強制執行，而不是行政強制執行力。故D錯誤。 7"}, {"id": "卷一-18", "subject": "卷一", "type": "單選題", "question": "未成年人小姜涉嫌尋釁滋事，被移送審■起訴的第2天，小姜年滿18周歲，1個月後檢察院決定對小姜適用附條件不起訴並監督考察6個月，在監督考察期間，小姜因實施新的犯罪被撤銷附條件不起訴的決定並被提起公訴。關於本案處理，下列選項哪一項是正確的？（　）", "options": [{"key": "A", "text": "本案應由少年法庭審理"}, {"key": "B", "text": "本案如適用簡易程序審理，應徵得小姜法定代理人的同意"}, {"key": "C", "text": "本案審理和宣判應公開進行，但不得組織人員旁聽"}, {"key": "D", "text": "因審查起訴時小姜已年滿18周歲，檢察院對其適用附條件不起訴違反法律規定"}], "answer": ["A"], "explanation_full": "【羿文解析】《刑訴解釋》第550條第1款規定：“被告人實施被指控的犯罪時不滿十八周歲、人民法院立案時不滿二十周歲的案件，由未成年人案件審判組織審理。”結合題乾，法院立案受理時，小姜肯定不滿20周歲，故A項正確。《刑訴解釋》第566條規定：“對未成年人刑事案件，人民法院決定適用簡易程序審理的 ，應當徵求未成年被告人及其法定代理人、辯護人的意見。上述人員提出異議的，不適用簡易程序。”由於本案開庭審理時，小姜已經年滿18周歲，不再是未成年人了，也就不存在法定代理人一說，因為法定代理人的幫助對象是未成年人。故B項錯誤。《刑訴解釋》第557條第2款規定：“對依法公開審理，但可能需要封存犯罪記錄的案件，不得組織人員旁聽；有旁聽人員的，應當告知其不得傳播案件信息。”而題乾並未說明小姜可能判處5年以下有期徒刑或者免於刑事處罰等需要犯罪記錄封存的條件，故C項錯誤。《人民檢察院辦理未成年人刑事案件的規定》第29條規定：“對於犯罪時已滿十四周歲不滿十八周歲的未成年人，同時符合下列條件的，人民檢察院可以作出附條件不起訴決定：……”可見，檢察院能否適用附條件不起訴的時間起算點不是決定適用時，而是犯罪時不滿18周歲，故D項錯誤。綜上，本題正確答案為A。"}, {"id": "卷一-19", "subject": "卷一", "type": "單選題", "question": "關於沒收財產，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "甲搶劫數額巨大，對其可以判處罰金一萬元並處沒收財產"}, {"key": "B", "text": "乙犯詐騙罪被判處沒收全部財產時，法院對乙未滿18周歲的子女應當保留必需的生活費用，對乙的成年家屬不必考慮"}, {"key": "C", "text": "丙盜竊珍貴文物情節特別嚴重，即便其沒有可供執行的財產，亦可以判處沒收財產"}, {"key": "D", "text": "丁為治病向李某借款五萬元，一年後丁因犯罪被判處沒收財產。無論李某是否提出請求，一旦法院發現該債務存在，就應當判決以沒收的財產償還"}], "answer": ["C"], "explanation_full": "【羿文解析】根據《刑法》第263條的規定，搶劫數額巨大的，處10年以上有期徒刑、無期徒刑或者死刑，並處罰金或者沒收財產。因而沒收財產與罰金可以擇其一而判處，如果選擇科處沒收財產，則只能附加適用 ，不能單獨適用。因此A項錯誤。根據《刑法》第59條的規定，判處沒收財產時，既可以判處沒收犯罪人所有的全部財產，也可以判處沒收犯罪人所有的部分財產；至於是沒收全部財產還是沒收部分財產，要根據犯罪的社會危害性與犯罪人的人身危險性確定。但是，沒收全部財產的，應當對犯罪分子個人及其扶養的家屬保留必要的生活費用。在判處沒收財產的時候，不得沒收屬於犯罪分子家屬所有或者應有的財產。法院不僅應考慮其未成年子女必需的生活費用，還必須保留乙及其扶養的成年家屬必要的生活費用。因此B項錯誤。根據 《刑法》第60條的規定，沒收財產以前犯罪人所負的正當債務，即犯罪人在判決生效前所負他人的合法債務 ，需要以沒收財產償還的，經債權人請求，應當償還。因而以犯罪人被沒收的財產償還債務的，必須同時具備以下幾個條件：（1）該項債務必須是沒收財產以前犯罪分子所負的債務。（2）該項債務必須是犯罪人個人所欠的正當債務。（3）該項債務必須是債權人已經提出償還請求的債務。因此，必須在李某已經提出請求丁償還債務的情形，才可以用丁被沒收的財產償還債務。因此D項錯誤。我國刑法分則對沒收財產在多數情況下作了並科規定，這種方式又可根據是否必須科處沒收財產分為兩種情況：一是必並制，指在判處其他刑罰的同時必須同時並處沒收財產，即刑法分則明確規定“並處沒收財產”；二是得並制，指在判處其他刑罰的同時可以並處沒收財產。根據《刑法》第264條的規定，盜竊公私財物，情節特別嚴重的，並處罰金或者沒收財產，據此本題答案為C。"}, {"id": "卷一-20", "subject": "卷一", "type": "單選題", "question": "關於侵犯知識產權罪，下列哪一說法錯誤？（　） 8", "options": [{"key": "A", "text": "甲未經註冊商標所有人許可，在同一種服務上使用與其註冊商標相同的商標，情節嚴重，構成假冒註冊商標罪"}, {"key": "B", "text": "乙未經表演者許可，通過信息網絡向公眾傳播其表演，違法所得數額較大，構成侵犯著作權罪"}, {"key": "C", "text": "甲晚上潛入乙公司，在電腦裡拷貝了乙公司的商業秘密，事後甲披露出去，即使未給乙公司造成重大損失 ，甲也可成立侵犯商業秘密罪"}, {"key": "D", "text": "外國礦業公司員工胡某某竊取大量我國鋼鐵企業的商業秘密，成立侵犯商業秘密罪"}], "answer": ["D"], "explanation_full": "【羿文解析】A項正確。《刑法修正案（十一）》對假冒註冊商標罪作出了修改，增加侵犯服務商標犯罪規定 ：在商品後增加了“服務”，即未經註冊商標所有人許可，在同一種服務上使用與其註冊商標相同的商標 ，情節嚴重的，也構成本罪。 B項正確。《刑法修正案（十一）》修改侵犯著作權罪，增加了一種新的侵權方式：“未經表演者許可，複製發行錄有其表演的錄音錄像製品，或者通過信息網絡向公眾傳播其表演的”，這項行為保護的是表演者權 ，即表演者依法對其表演所享有的權利。 C項正確。侵犯商業秘密罪過去是結果犯，要求給權利人造成重大損失，但是《刑法修正案（十一）》將本罪的入罪標準由“重大損失”修改為“情節嚴重”，本罪變為情節犯，不再要求造成重大損失。所謂情節犯是指將“情節嚴重、情節惡劣”作為犯罪成立要件的犯罪。因此，即使甲未給乙公司造成重大損失，但如果情節嚴重，也可成立侵犯商業秘密罪。 D項錯誤。《刑法修正案（十一）》為了打擊境外針對我國境內的商業間諜行為，保護我企業商業秘密，新增 ：為境外竊取、刺探、收買、非法提供商業秘密罪，該罪是侵犯商業秘密罪的特別法條，如果行為人為境外竊取、刺探、收買、非法提供商業秘密，構成為境外竊取、刺探、收買、非法提供商業秘密罪，不再定侵犯商業秘密罪。"}, {"id": "卷一-21", "subject": "卷一", "type": "單選題", "question": "《刑法》第17條第3款：“已滿十二周歲不滿十四周歲的人，犯故意殺人、故意傷害罪，致人死亡或者以特別殘忍手段致人重傷造成嚴重殘疾，情節惡劣，經最高人民檢察院核准追訴的，應當負刑事責任。”對於本款規定的理解，下列哪一選項是錯誤的？（　）", "options": [{"key": "A", "text": "本條款是《刑法修正案（十一）》新增，對發生在2021年3月1日《刑法修正案（十一）》施行前的案件不能適用"}, {"key": "B", "text": "根據本條款的規定，已滿12周歲不滿14周歲的人，在實施綁架過程中，故意殺害、故意傷害被綁架人的 ，不負刑事責任"}, {"key": "C", "text": "13周歲的甲使用菜刀砍斷了10周歲乙的拇指，雖然乙構成重傷，但對甲不能適用本條款的規定追究刑事責任"}, {"key": "D", "text": "根據本條款的規定，最高人民檢察院經審查決定，也可以不予核准追訴"}], "answer": ["B"], "explanation_full": "【羿文解析】A項正確。原來不滿14周歲的人，實施任何危害社會的行為，都不負刑事責任。《刑法修正案 （十一）》新增上述條款，在“特定情形”下，經“特別程序”，對法定最低刑事責任年齡作個別下調。顯然不利於被告人，根據《刑法》第12條規定的“從舊兼從輕”原則，該條款不具有溯及力，對發生在2021年 3月1日《刑法修正案（十一）》施行前的案件不能適用。 B項錯誤。本條款中的“故意殺人、故意傷害罪，致人死亡或者以特別殘忍手段致人重傷造成嚴重殘疾”包括在實施綁架、搶劫、強姦等任何其他犯罪的過程中，實施故意殺人、故意傷害行為，致人死亡或者以特別殘忍手段致人重傷造成嚴重殘疾，都應負刑事責任。 C項正確。本條款中“以特別殘忍手段致人重傷造成嚴重殘疾”是指故意要造成他人嚴重殘疾而毀人容貌、挖人眼睛、砍掉雙腳等特別殘忍手段傷害他人的行為，不包括一般重傷，如砍掉他人拇指。 D項正確。為了嚴格限制對已滿12周歲不滿14周歲的人追究刑事責任，最高人民檢察院經審查決定，也可以不予核准追訴。"}, {"id": "卷一-22", "subject": "卷一", "type": "單選題", "question": "下列哪一選項體現直接言詞原則的要求？（　） 9", "options": [{"key": "A", "text": "法官親自收集證據"}, {"key": "B", "text": "法官親自在法庭上聽取當事人、證人及其他訴訟參與人的口頭陳述"}, {"key": "C", "text": "法庭審理盡可能不中斷地進行"}, {"key": "D", "text": "法庭審理應當公開進行證據調查與辯論"}], "answer": ["B"], "explanation_full": "【羿文解析】直接言詞原則是指法官必須在法庭上親自聽取當事人、證人及其他訴訟參與人的口頭陳述，案件事實和證據必須由控辯雙方當庭口頭提出並以口頭辯論和質證的方式進行調查。選項A體現了職權原則的要求，選項C體現了集中審理原則的要求，選項D體現了審判公開原則的要求。只有選項B明確表達了直接言詞原則的含義，故正確答案是B。"}, {"id": "卷一-23", "subject": "卷一", "type": "單選題", "question": "第十二屆全國人民代表大會第一次會議期間，國務院發布《國務院機構改革和職能轉變方案》，撤銷鐵道部，組建國家鐵路局，由交通運輸部管理，負責擬訂鐵路技術標準，監督管理鐵路安全生產、運輸服務質量和鐵路工程質量等。下列關於國家鐵路局的說法哪項是正確的？（　）", "options": [{"key": "A", "text": "它不行使行政管理職能"}, {"key": "B", "text": "它可以只設處級內設機構"}, {"key": "C", "text": "需要調整它的職能的，由交通運輸部決定"}, {"key": "D", "text": "它增減原定編製的，由交通運輸部審核方案，國務院決定"}], "answer": ["B"], "explanation_full": "【羿文解析】《國務院行政機構設置和編製管理條例》第6條第6款規定：“國務院組成部門管理的國家行政機構由國務院組成部門管理，主管特定業務，行使行政管理職能。”國家鐵路局是交通運輸部管理的國家局 ，行使行政管理職能。故A項錯誤。根據該條例第13條，國務院組成部門管理的國家行政機構根據工作需要可以設立司、處兩級內設機構，也可以只設立處級內設機構。故B項正確。根據該條例第12條，國務院行政機構設立後，需要對職能進行調整的，由國務院機構編製管理機關提出方案，報國務院決定。故C項的決定機關錯誤。根據該條例第19條，國務院行政機構增加或者減少編製，由國務院機構編製管理機關審核方案，報國務院批准。故D項的審核機關錯誤。"}, {"id": "卷一-24", "subject": "卷一", "type": "單選題", "question": "根據《憲法》和《選舉法》規定，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "選民登記按選區進行，每次選舉前選民資格都要進行重新登記"}, {"key": "B", "text": "選民名單應在選舉日的十五日以前公布"}, {"key": "C", "text": "對於公布的選民名單有不同意見的，可以向選舉委員會申訴或者直接向法院起訴"}, {"key": "D", "text": "法院對於選民名單意見的起訴應在選舉日以前作出判決"}], "answer": ["D"], "explanation_full": "【羿文解析】根據《選舉法》第27條的規定，選民登記按選區進行，經登記確認的選民資格長期有效。每次選舉前對上次選民登記以後新滿18周歲的、被剝奪政治權利期滿後恢復政治權利的選民，予以登記。對選民經登記後遷出原選區的，列入新遷入的選區的選民名單；對死亡的和依照法律被剝奪政治權利的人，從選民名單上除名。可見A項錯誤。根據《選舉法》第28條的規定，選民名單應在選舉日的20日以前公布，實行憑選民證參加投票選舉的，並應當發給選民證。可見B項錯誤。根據《選舉法》第29條的規定，對於公布的選民名單有不同意見的，可以在選民名單公布之日起五日內向選舉委員會提出申訴。選舉委員會對申訴意見，應在三日內作出處理決定。申訴人如果對處理決定不服，可以在選舉日的五日以前向人民法院起訴，人民法院應在選舉日以前作出判決。人民法院的判決為最後決定。可見C項錯誤（先申訴再起訴）而D項正確。因此，本題的正確答案應當是D項。"}, {"id": "卷一-25", "subject": "卷一", "type": "單選題", "question": "張某涉嫌綁架並殺害人質一案，下列哪一證據不得作為定案根據？", "options": [{"key": "A", "text": "偵查人員詢問作為本案唯一目擊證人的聾啞人王某而製作的詢問筆錄，且詢問過程中提供通曉聾啞手勢的人做翻譯"}, {"key": "B", "text": "偵查人員在指定的某賓館詢問證人李某而獲得的書面證言專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 10"}, {"key": "C", "text": "作為殺人凶器被公訴人提交法庭的匕首，但未附有證明該匕首取得來源的搜查筆錄及扣押清單"}, {"key": "D", "text": "未附有偵■訊問人簽名的訊問筆錄"}], "answer": ["C"], "explanation_full": "【羿文解析】①《高法解釋》第89條規定：“證人證言具有下列情形之一的，不得作為定案的根據：（一 ）詢問證人沒有個別進行的；（二）書面證言沒有經證人核對確認的；（三）詢問聾、啞人，應當提供通曉聾、啞手勢的人員而未提供的；（四）詢問不通曉當地通用語言、文字的證人，應當提供翻譯人員而未提供的。”A項不屬於以上表述的情形，可以作為定案的根據，故不選。 ②《高法解釋》第90條規定：“證人證言的收集程序、方式有下列瑕疵，經補正或者作出合理解釋的，可以採用；不能補正或者作出合理解釋的，不得作為定案的根據：（一）詢問筆錄沒有填寫詢問人、記錄人、法定代理人姓名以及詢問的起止時間、地點的；（二）詢問地點不符合規定的；（三）詢問筆錄沒有記錄告知證人有關作證的權利義務和法律責任的；（四）詢問筆錄反映出在同一時段，同一詢問人員詢問不同證人的 ；（五）詢問未成年人，其法定代理人或者合適成年人不在場的。”B項屬於上述第（二）項規定的情形，是可補證的瑕疵證據，故不當選。 ③《高法解釋》第86條第1款規定，在勘驗、檢查、搜查過程中提取、扣押的物證、書證，未附筆錄或者清單 ，不能證明物證、書證來源的，不得作為定案的根據。故C項當選。 ④《高法解釋》第95條規定：“訊問筆錄有下列瑕疵，經補正或者作出合理解釋的，可以採用；不能補正或者作出合理解釋的，不得作為定案的根據：（一）訊問筆錄填寫的訊問時間、訊問地點、訊問人、記錄人、 法定代理人等有誤或者存在矛盾的；（二）訊問人沒有簽名的；（三）首次訊問筆錄沒有記錄告知被訊問人有關權利和法律規定的。”D項屬於上述第（二）項規定的情形，是可補正的瑕疵證據，故不當選。 綜上，本題正確答案為C選項。"}, {"id": "卷一-26", "subject": "卷一", "type": "單選題", "question": "甲乙兩國1990年建立大使級外交關係，並締結了雙邊的《外交特權豁免議定書》。2007年兩國交惡，甲國先宣布將其駐乙國的外交代表機構由大使館降為代辦處，乙國遂宣布斷絕與甲國的外交關係。之後，雙方分別撤走了各自駐對方的使館人員。對此，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "甲國的行為違反國際法，應承擔國家責任"}, {"key": "B", "text": "乙國的行為違反國際法，應承擔國家責任"}, {"key": "C", "text": "上述《外交特權豁免議定書》終止執行"}, {"key": "D", "text": "甲國可以■封沒收乙國使館在甲國的財產"}], "answer": ["C"], "explanation_full": "【羿文解析】國家責任是指國家就其國際不法行為所承擔的法律後果。國際不法行為是指國家所作出的違背國際義務的行為。與何國建交、確定外交關係的採取何種形式是國家主權的內容之一，甲國宣布將乙國駐甲國的大使館降為代辦處及乙國宣布斷絕與甲國的外交關係不屬於違反國際法的行為，無需承擔國家責任。可見，選項A和B錯誤。根據《維也納外交關係公約》第45條的規定，當兩國斷絕關係時，接受國應尊重並保護使館館舍以及使館財產與檔案，縱有武裝衝突情事，亦應如此辦理，選項D錯誤。《維也納條約法公約》第 63條規定，條約當事國間斷絕外交或領事關係不影響彼此間由條約確定之法律關係，但外交或領事關係之存在為適用條約所必不可少者不在此限。即斷絕外交關係或領事關係使建立在此種關係上的條約終止，其他條約不受斷絕外交關係或領事關係的影響。《外交特權豁免議定書》應屬於以外交關係或領事關係為存在基礎的條約，因此外交關係的斷絕應導致該議定書終止執行，選項C正確。"}, {"id": "卷一-27", "subject": "卷一", "type": "單選題", "question": "關於全面依法治國的基本原則，以下哪一說法是錯誤的？", "options": [{"key": "A", "text": "國家和社會治理需要法律和道德共同發揮作用，我們既要重視發揮法律的規範作用，又要重視發揮道德的教化作用"}, {"key": "B", "text": "充分發揮道德的教化作用，以法治體現道德理念、強化法律對道德建設的促進作用，以道德滋養法治精神 、強化道德對法治文化的支撐作用，實現法律和道德相輔相成、法治和德治相得益彰"}, {"key": "C", "text": "堅持從中國實際出發，以中華法律文化精華為主，借鑒國外法治有益經驗，發展中國特色社會主義法治理論專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 11"}, {"key": "D", "text": "堅持法律面前人人平等，必須以規範和約束公權力為重點，加大監督力度，做到有權必有責、用權受監督 、違法必追究，堅決糾正有法不依、執法不嚴、違法不究行為"}], "answer": ["C"], "explanation_full": "【羿文解析】①有機統一最關鍵，依法治國和以德治國相結合。故A選項正確。 ②依法治國和以德治國相結合，以法治體現道德理念、強化法律對道德建設的促進作用，以道德滋養法治精神、強化道德對法治文化的支撐作用，實現法律和道德相輔相成、法治和德治相得益彰。故B選項正確。 ③堅持從中國實際出發。中國特色社會主義道路、理論體系、制度是全面推進依法治國的根本遵循。必須從我國基本國情出發，同改革開放不斷深化相適應，總結和運用黨領導人民實行法治的成功經驗，圍繞社會主義法治建設重大理論和實踐問題，推進法治理論創新，發展符合中國實際、具有中國特色、體現社會發展規律的社會主義法治理論，為依法治國提供理論指導和學理支撐。汲取中華法律文化精華，借鑒國外法治有益經驗，但決不照搬外國法治理念和模式。故C選項錯誤。注意，不能以中華法律文化為主，必須在中國特色社會主義法治理論的基礎上充分吸收中華法律文化的精華，同時借鑒外國法治的有益經驗。同樣，外國法治不能全部照搬，而只是借鑒有益經驗。 ④堅持法律面前人人平等，必須以規範和約束公權力為重點，加大監督力度，做到有權必有責、用權受監督 、違法必追究，堅決糾正有法不依、執法不嚴、違法不究行為。故D選項正確。 綜上，本題正確答案為C選項。"}, {"id": "卷一-28", "subject": "卷一", "type": "單選題", "question": "關於刑事訴訟強制措施的適用機關及其對象，下列哪一選項是正確的？", "options": [{"key": "A", "text": "法院對尚未羈押的犯罪嫌疑人和被告人都可以進行拘傳"}, {"key": "B", "text": "趙某暴力取證案偵查中，趙某有自殺、逃跑、在逃情形的，應當由檢察院對趙某執行拘留"}, {"key": "C", "text": "某自訴案件需要逮捕被告人的，應當由法院決定"}, {"key": "D", "text": "對正擾亂法庭秩序的被告人的母親以及拒不出庭作證的證人劉某，法院均可對其採取刑事拘留"}], "answer": ["C"], "explanation_full": "【羿文解析】①儘管刑事強制措施適用於犯罪嫌疑人和被告人，但是，在審理階段，被追訴者被稱為被告人 ，所以，法院對尚未羈押的犯罪嫌疑人是不可能適用拘傳的。故A項表述錯誤。 ②《刑事訴訟法》第82條規定：“公安機關對於現行犯或者重大嫌疑分子，如果有下列情形之一的，可以先行拘留：（一）正在預備犯罪、實行犯罪或者在犯罪後即時被發覺的；（二）被害人或者在場親眼看見的人指認他犯罪的；（三）在身邊或者住處發現有犯罪證據的；（四）犯罪後企圖自殺、逃跑或者在逃的；（五 ）有毀滅、偽造證據或者串供可能的；（六）不講真實姓名、住址，身份不明的；（七）有流竄作案、多次作案、結夥作案重大嫌疑的。”《刑事訴訟法》第165條規定：“人民檢察院直接受理的案件中符合本法第八十一條、第八十二條第四項、第五項規定情形，需要逮捕、拘留犯罪嫌疑人的，由人民檢察院作出決定，由公安機關執行。”故B項的錯誤在於，檢察院只能決定拘留，不能執行拘留。 ③自訴案件中被告人的逮捕由法院決定，故C項表述正確。 ④D項中所適用的拘留是司法拘留，而不是刑事拘留，司法拘留不屬於刑事強制措施。故D項表述錯誤。 綜上，本題正確答案為C選項。"}, {"id": "卷一-29", "subject": "卷一", "type": "單選題", "question": "關於侮辱國歌罪，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "侮辱國歌罪必須發生在公眾場合"}, {"key": "B", "text": "本罪侵犯的對象僅限於中華人民共和國國歌，不包括外國國歌"}, {"key": "C", "text": "因五音不全以致歌唱國歌極不悅耳的，構成侮辱國歌罪"}, {"key": "D", "text": "侮辱國歌的行為，無論是否情節嚴重，都成立侮辱國歌罪"}], "answer": ["B"], "explanation_full": "【羿文解析】侮辱國歌罪必須發生在公共場合，而不是公眾場合，A項錯誤。此處的國歌僅指中華人民共和國國歌，不包括外國國歌，侮辱外國國歌的，不成立侮辱國歌罪，B項正確。本罪的主觀為故意，確因五音不全以致歌唱國歌極不悅耳的，不以侮辱國歌罪論處，C項錯誤。侮辱國歌的行為必須達到情節嚴重，才能成立侮辱國歌罪，D項錯誤。綜上所述，本題正確答案為B項。 12"}, {"id": "卷一-30", "subject": "卷一", "type": "單選題", "question": "完善法律體系是社會主義法治建設的重要環節，關於完善法律體系，下列哪一說法是不正確的？（　）", "options": [{"key": "A", "text": "依法建立健全專門委員會立法專家顧問制度"}, {"key": "B", "text": "加強法律解釋工作，及時明確法律規定含義和適用法律依據"}, {"key": "C", "text": "堅持人大主導立法全過程，重要法律草案由有關部門組織全國人大專門委員會、常委會法製工作委員會起草"}, {"key": "D", "text": "健全向下級人大徵詢立法意見機制，建立基層立法聯繫點制度"}], "answer": ["C"], "explanation_full": "【羿文解析】①《中共中央關於全面推進依法治國若干重大問題的決定》提出，“健全有立法權的人大主導立法工作的體制機制，發揮人大及其常委會在立法工作中的主導作用。建立由全國人大相關專門委員會、全國人大常委會法製工作委員會組織有關部門參與起草綜合性、全局性、基礎性等重要法律草案制度。增加有法治實踐經驗的專職常委比例。依法建立健全專門委員會、工作委員會立法專家顧問制度。”故A選項正確。 注意，是全國人大相關專門委員會、常委會法製工作委員會組織，而不是C選項說的“有關部門組織全國人大專門委員會、常委會法製工作委員會起草”。故C選項錯誤。 ②《中共中央關於全面推進依法治國若干重大問題的決定》提出，“明確立法權力邊界，從體制機制和工作程序上有效防止部門利益和地方保護主義法律化。對部門間爭議較大的重要立法事項，由決策機關引入第三方評估，充分聽取各方意見，協調決定，不能久拖不決。加強法律解釋工作，及時明確法律規定含義和適用法律依據。明確地方立法權限和範圍，依法賦予設區的市地方立法權。”故B選項正確。 ③《中共中央關於全面推進依法治國若干重大問題的決定》提出，“深入推進科學立法、民主立法。加強人大對立法工作的組織協調，健全立法起草、論證、協調、審議機制，健全向下級人大徵詢立法意見機制，建立基層立法聯繫點制度，推進立法精細化。”故D選項正確。"}, {"id": "卷一-31", "subject": "卷一", "type": "單選題", "question": "甲經人介紹認識了乙，商定由甲通過銀行卡轉賬的方式為乙等人轉移從網上銀行詐騙的錢款，甲提成 20％。隨後，乙通過黑客技術獲取網上銀行客戶丙等人的銀行卡號和密碼，轉出資金進入甲的賬戶共計200萬元。關於甲的行為，下列哪一說法正確？（　）", "options": [{"key": "A", "text": "甲構成掩飾、隱瞞犯罪所得罪"}, {"key": "B", "text": "甲構成洗錢罪"}, {"key": "C", "text": "甲構成窩藏、包庇罪"}, {"key": "D", "text": "甲構成乙金融犯罪的共犯"}], "answer": ["D"], "explanation_full": "【羿文解析】甲和上游犯罪的主體乙事先通謀，由甲實施相應的洗錢行為，此時甲和乙等人成立上游金融犯罪的共犯，而不認定為洗錢罪，D選項正確。"}, {"id": "卷一-32", "subject": "卷一", "type": "單選題", "question": "關於暫予監外執行的說法，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "張某因盜竊被判處5年有期徒刑，在交付執行前，突患嚴重疾病，需保外就醫，應當由省級以上監獄管理機關決定張某暫予監外執行"}, {"key": "B", "text": "不符合暫予監外執行條件的罪犯通過賄賂等非法手段被暫予監外執行的，在監外執行的期間不計入執行刑期"}, {"key": "C", "text": "罪犯在暫予監外執行期間脫逃的，脫逃的期間不計入執行刑期。被決定收監執行的社區矯正人員在逃的 ，由社區矯正機構負責追捕"}, {"key": "D", "text": "對暫予監外執行的罪犯，由公安機關交所在單位或者基層組織予以考察"}], "answer": ["B"], "explanation_full": "【羿文解析】《刑事訴訟法》第265條第5款規定，在交付執行前，暫予監外執行由交付執行的人民法院決定 13 行期間脫逃的，脫逃的期間不計入執行刑期。”據此，B項正確。《六機關規定》第35條規定：“被決定收監執行的社區矯正人員在逃的，社區矯正機構應當立即通知公安機關，由公安機關負責追捕。”據此，C選項前半句話正確，後半句話不是社區矯正機構，而是公安機關負責追捕，C項錯誤。《刑事訴訟法》第269條規定 ：“對被判處管制、宣告緩刑、假釋或者暫予監外執行的罪犯，依法實行社區矯正，由社區矯正機構負責執行。”故D項錯誤。"}, {"id": "卷一-33", "subject": "卷一", "type": "單選題", "question": "甲國是聯合國的會員國。2006年，聯合國駐甲國的某機構以聯合國的名義，與甲國政府簽訂協議，購買了一批辦公用品。由於甲國交付延期，雙方產生糾紛。根據《聯合國憲章》和有關國際法規則，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "作為政治性國際組織，聯合國組織的上述購買行為自始無效"}, {"key": "B", "text": "上述以聯合國名義進行的行為，應視為聯合國所有會員國的共同行為"}, {"key": "C", "text": "聯合國大會有權就該項糾紛向國際法院提起針對甲國的訴訟，不論甲國是否同意"}, {"key": "D", "text": "聯合國大會有權就該項糾紛請求國際法院發表咨詢意見，不論甲國是否同意"}], "answer": ["D"], "explanation_full": "【羿文解析】聯合國作為國際法主體，除能獨立地參與國際關係，享有和承擔國際法上的權利和義務，也擁有類似於國家所具備的其他的權利能力和行為能力，如能夠以自己的名義對外進行民事行為，故選項A錯誤。 以聯合國名義進行的行為不能代表是所有會員國的行為，選項B錯誤。根據《國際法院規約》第34條第1款的規定，國際法院的訴訟當事方僅限於國家，選項C中聯合國大會有權提起訴訟的觀點錯誤。《聯合國憲章》第 96條規定，大會或安理會對於任何法律問題得請國際法院發表咨詢意見；聯合國其他機關及各種專門機關 ，對於其工作範圍之內任何法律問題，得隨時以大會之授權，請求國際法院發表咨詢意見。可見聯合國大會有權就任何法律問題向國際法院咨詢，而無論甲國是否同意，選項D正確。"}, {"id": "卷一-34", "subject": "卷一", "type": "單選題", "question": "關於刑事證據規則的表述，下列哪一選項是正確的？", "options": [{"key": "A", "text": "“證明證人可信品行的證據，只能在該證人的誠信已受到攻擊時才能採納”，這一規定體現了傳聞證據規則"}, {"key": "B", "text": "“依法應當出庭作證的證人沒有正當理由拒絕出庭或者出庭後拒絕作證，其庭前證言真實性無法確認的 ，不得作為定案的根據”，這一規定體現了意見證據規則"}, {"key": "C", "text": "“不得強迫任何人證實自己有罪”，這一規定體現了關聯性規則"}, {"key": "D", "text": "“書證的副本、複製件不能反映原件及其內容的，不能作為定案的根據”，這一規定體現了最佳證據規則"}], "answer": ["D"], "explanation_full": "【羿文解析】①品格證據是指用以證明一個人品德、品行好壞的證據。品格證據規則或稱排除品格證據規則 ，是指訴訟中當事人提出的關於被告人、被害人、證人品格的證據不可采的證據規則。A項是品格證據規則的體現，該項表述錯誤。 ②傳聞證據規則，也稱傳聞證據排除規則，即法律排除傳聞證據作為認定犯罪事實的根據的規則。根據這一規則，如無法定理由，任何人在庭審期間以外及庭審準備期間以外的陳述，不得作為認定被告人有罪的證據 。所謂傳聞證據，主要包括兩種形式：一是書面傳聞證據，即親身感受了案件事實的證人在庭審期日之外所作的書面證人證言，及警察、檢察人員所作的（證人）詢問筆錄；二是言詞傳聞證據，即證人並非就自己親身感知的事實作證，而是向法庭轉述他從別人那裡聽到的情況。意見證據規則，是指證人只能陳述自己親身感受和經歷的事實，而不得陳述對該事實的意見或者結論。B項是傳聞證據規則的體現，而不是意見證據規則的體現。該項表述錯誤。 ③關聯性規則，是指只有與案件事實有關的材料，才能作為證據使用。自白任意規則，又稱非任意自白排除規則，是指在刑事訴訟中，只有基於被追訴人自由意志而作出的自白（即承認有罪的供述），才具有可釆性 ；違背當事人意願或違反法定程序而強製作出的供述不是自白，而是逼供，不具有可采性，必須予以排除。 C項是自白任意規則的體現，不是關聯性規則的體現。該項表述錯誤。 ④最佳證據規則，又稱原始證據規則，是指以文字、符號、圖形等方式記載的內容來證明案情時，其原件才是最佳證據。D項是最佳證據規則的體現，該項表述正確。 14 綜上，本題正確答案為D選項。"}, {"id": "卷一-35", "subject": "卷一", "type": "單選題", "question": "小明系某國家機關公職人員，品行良好，擁護中華人民共和國憲法，已經取得法律職業資格，下列哪一說法是錯誤的？", "options": [{"key": "A", "text": "小明曾經擔任法官、檢察官、律師一年以上，欲申請公職律師，須經所在單位同意，由所在單位提出申請"}, {"key": "B", "text": "正被列為失信聯合懲戒對象的，不得擔任公職律師"}, {"key": "C", "text": "若小明所在單位為中央黨政機關和人民團體的，應當向司法部提出申請"}, {"key": "D", "text": "小明任職公職律師滿3年，且最後一次年度考核稱職的，可轉為社會律師。但公職律師經歷不計入社會律師執業年限"}], "answer": ["D"], "explanation_full": "【羿文解析】①申請頒發公職律師（公司律師）證書，應當具備下列條件：a.擁護中華人民共和國憲法 ；b.依法取得法律職業資格或者律師資格；c.具有公職人員身份（與國有企業依法訂立勞動合同）；d.從事法律事務工作二年以上，或者曾經擔任法官、檢察官、律師一年以上；e.品行良好；f.所在單位同意其擔任公職律師（公司律師）。申請頒發公職律師、公司律師執業證書的，由所在單位提出申請。故A選項正確。 ②下列情形，不予頒發公職（公司）律師證書：a.無民事行為能力或者限制民事行為能力的；b.曾被吊銷律師、公證員執業證書的；c.涉嫌犯罪、司法程序尚未終結的，或者涉嫌違紀違法、正在接受審查的；d.上一年度公務員年度考核結果被確定為不稱職的；e.正被列為失信聯合懲戒對象的。故B選項正確。 ③中央黨政機關和人民團體公職人員（中央企業員工）申請擔任公職律師的，由所在單位審核同意後向司法部提出申請。故C選項正確。 ④公職（公司）律師任職期間，只能為本單位服務，接受本單位考核。為了鼓勵更多的人從事公職（公司 ）律師，公職（公司）律師任職滿3年，且最後一次年度考核稱職的，可轉為社會律師。公職（公司）律師經歷計入社會律師執業年限。故D選項錯誤。 綜上，本題正確答案為D選項。"}, {"id": "卷一-36", "subject": "卷一", "type": "單選題", "question": "關於懲罰犯罪與保障人權的含義，下列哪一選項的理解是錯誤的？", "options": [{"key": "A", "text": "懲罰犯罪與保障人權發生衝突時，需要根據利益權衡原則作■選擇"}, {"key": "B", "text": "保障人權意味著，無辜的人不受追究，有罪的人受到公正處罰"}, {"key": "C", "text": "為了保障人權，不可放棄■明案件事實、懲罰犯罪"}, {"key": "D", "text": "懲罰犯罪必然能夠保障人權，保障人權必然能夠懲罰犯罪"}, {"key": "B", "text": "有罪的人受到公正處罰；"}, {"key": "C", "text": "訴訟權利得到充分保障和行使。我國憲法莊嚴規定：國家尊重和保障人權。由此可知，B項表述正確。雖然大多數懲罰犯罪與保障人權能同步得到實現，但也存在一些發生衝突和矛盾的情形，此時則需要根據利益權衡原則作出選擇，故A項表述正確。 ②懲罰犯罪與保障人權既統一又對立。如果在刑事訴訟中違反憲法、刑事訴訟法有關權利保障的規範，濫用司法權力，甚至刑訊逼供、誘供等，往往就造成冤假錯案。因此，懲罰犯罪不能忽視保障人權；另外，保障人權也不能脫離懲罰犯罪。如果不去查明案件事實、懲罰犯罪，不僅被害人的實體權利得不到維護，犯罪嫌疑人、被告人的實體權利易受侵犯，而且訴訟參與人的程序性權利保障就失去了原本的含義。因此，懲罰犯罪與保障人權是具有密切聯繫、同等重要的兩個方面。故C項表述正確，D項表述錯誤。 綜上，本題正確答案為D選項。"}], "answer": ["D"], "explanation_full": "【羿文解析】①本題考查懲罰犯罪與保障人權的關係。所謂懲罰犯罪，是指通過刑事訴訟活動，在準確、及時地■明案件事實真相的基礎上，對構成犯罪的被告人公正適用刑法，以抑制犯罪，以及通過刑事程序本身的作用來抑制犯罪。所謂保障人權，是指在通過刑事訴訟懲罰犯罪的過程中，保障公民合法權益不受非法侵犯。具體包括：a，無辜的人不受追究;"}, {"id": "卷一-37", "subject": "卷一", "type": "單選題", "question": "關於綁架罪，下列哪一說法是正確的？ 15", "options": [{"key": "A", "text": "甲使用暴力控制住乙，將其關押在郊外的小屋內，並逼迫乙向自己銀行卡中打入10萬元。乙便給父母打電話聲稱自己開車撞人急需10萬元賠償被害人。乙的父母立即將10萬元打人乙所給的賬號。甲獲得財物之後將乙釋放。甲成立綁架罪"}, {"key": "B", "text": "甲攔住走在路上的乙進行搶劫，發現乙身無分文，威脅乙帶其去乙的住處準備搜刮財物。到乙的住處後發現乙到的丈夫丙也在家。甲便用刀指著乙，讓丙交出財物。丙被迫交出2000元。甲構成綁架罪"}, {"key": "C", "text": "甲為了向乙索要債務，將乙的兒子關押起來，聲稱如果乙不還錢就殺害其兒子。乙擔心兒子的安危，便把錢還給了甲。甲的行為成立綁架罪"}, {"key": "D", "text": "甲殺死仇人乙之後，向乙的家屬打電話聲稱：“不給50萬元就把乙殺死”，甲的前行為成立故意殺人罪 ；後行為成立敲詐勒索罪與詐騙罪的想象競合犯，然後實行數罪並罰"}], "answer": ["D"], "explanation_full": "【羿文解析】A項錯誤。向第三人提出不法要求必須是向第三人提出，不能是向人質本人，否則就構成搶劫罪 。也即本罪與搶劫罪的關鍵區別在於行為人行為時想讓誰擔心：（1）讓第三人擔心成立綁架罪；（2）讓本人擔心成立搶劫罪。甲沒有讓被害人之外第三人擔心的意思，所以只成立搶劫罪。 B項錯誤。甲劫持乙來到乙家是為了進一步獲取財物，正好丙也在乙家，成為了甲獲取財物的直接來源，乙丙二者空間距離很近，視為一個整體，成立搶劫罪。 C項錯誤。根據《刑法》第238條第3款規定：“為索取債務非法扣押、拘禁他人的，依照前兩款的規定（非法拘禁罪）處罰。”其中“他人”包括與債務人有共同財產關係、撫養關係、扶養關係的第三人。所以將乙的兒子拘禁。這和直接拘禁乙是沒有本質區別的，依舊成立非法拘禁罪。 D項正確。之前為了復仇殺死仇人成立故意殺人罪;之後在被害人死亡的情況下編造謊言恐嚇被害人家屬，既符合詐騙罪，同時也滿足敲詐勒索罪的犯罪構成，屬於兩罪的想象競合犯，與之前的故意殺人罪並罰。"}, {"id": "卷一-38", "subject": "卷一", "type": "單選題", "question": "史某在縣城丁字路口擺攤販賣水果，縣城管局將史某的水果及相關物品進行了扣押，史某認為扣押行為違法，提起行政訴訟。關於扣押，下列哪一說法是錯誤的？", "options": [{"key": "A", "text": "扣押時應當製作並當場交付扣押決定書和清單"}, {"key": "B", "text": "扣押時間一般不得超過30日，如法律、行政法規、地方性法規另有規定的，從其規定"}, {"key": "C", "text": "對扣押的物品，城管局可以自己保管"}, {"key": "D", "text": "對物品需要進行檢測、檢驗、檢疫或者技術鑒定的，扣押的期間不包括檢測、檢驗、檢疫或者技術鑒定的期間"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《行政強制法》第24條第1款規定，行政機關決定實施查封、扣押的。應當履行本法第18條規定的程序，製作並當場交付查封、扣押決定書和清單。A選項正確。 根據《行政強制法》第25條第1款規定，查封、扣押的期限不得超過30日：情況複雜的。經行政機關負責人批准，可以延長，但是延長期限不得超過30日。法律、行政法規另有規定的除外。B選項錯誤，另有規定的是法律和行政法規，地方性法規不能作出例外規定。 根據《行政強制法》第26條第1、2款規定，對查封、扣押的場所、設施或者財物，行政機關應當妥善保管 ，不得使用或者損毀；造成損失的，應當承擔賠償責任。對查封的場所、設施或者財物，行政機關可以委託第三人保管，第三人不得損毀或者擅自轉移、處置。因第三人的原因造成的損失，行政機關先行賠付後，有權向第三人追償。對於扣押的物品，行政機關可以自己保管。C選項正確。 根據《行政強制法》第25條第3款規定，對物品需要進行檢測、檢驗、檢疫或者技術鑒定的，查封、扣押的期間不包括檢測、檢驗、檢疫或者技術鑒定的期間。檢測、檢驗、檢疫或者技術鑒定的期間應當明確，並書面告知當事人。檢測、檢驗、檢疫或者技術鑒定的費用由行政機關承擔。D選項正確。本題答案為B。"}, {"id": "卷一-39", "subject": "卷一", "type": "單選題", "question": "孫某的狗曾咬傷過鄰居錢某的小孫子，錢某為此一直耿耿於懷。一天，錢某趁孫某不備，將孫某的狗毒死 。孫某掌握了錢某投毒的證據之後，起訴到法院，法院判決錢某賠償孫某600元錢。對此，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "孫某因對其狗享有所有權而形成的法律關係屬於保護性法律關係專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 16"}, {"key": "B", "text": "由於孫某起訴而形成的訴訟法律關係屬於第二性的法律關係"}, {"key": "C", "text": "因錢某毒死孫某的狗而形成的損害賠償關係屬於縱向的法律關係"}, {"key": "D", "text": "因錢某毒死孫某的狗而形成的損害賠償關係中，孫某不得放棄自己的權利"}], "answer": ["B"], "explanation_full": "【羿文解析】孫某對其狗享有所有權，這是受法律保護的，因此而形成的法律關係屬於調整性法律關係。保護性法律關係則是在違法行為基礎上產生的。錢某毒死孫某的狗的行為屬侵權行為，由此形成的法律關係是保護性法律關係，而由於孫某起訴而形成的訴訟法律關係是由該保護性法律關係而產生的、居於從屬地位的第二性法律關係。因錢某毒死孫某的狗而形成的損害賠償關係屬於橫向的法律關係，故孫某可以放棄自己的權利。所以B項正確。"}, {"id": "卷一-40", "subject": "卷一", "type": "單選題", "question": "關於罪數的認定，下列哪一選項是錯誤的？（　）", "options": [{"key": "A", "text": "司法工作人員刑訊逼供致被告人死亡的，按照故意殺人罪一罪處罰"}, {"key": "B", "text": "在走私普通貨物、物品過程中，以暴力、威脅辦法抗拒緝私的，以走私普通貨物、物品罪和妨害公務罪數罪並罰"}, {"key": "C", "text": "實施綁架過程中，故意致被害人死亡的，以故意殺人罪一罪處罰"}, {"key": "D", "text": "組織他人偷越國（邊）境，以暴力、威脅方法抗拒檢查的，按照組織他人偷越國（邊）境罪一罪處罰"}], "answer": ["C"], "explanation_full": "【羿文解析】根據《刑法》第247條的規定，司法工作人員刑訊逼供致使被告人死亡的。應依照故意殺人罪從重處罰。因此，A項說法正確。按照《刑法》第157條第2款的規定，以暴力、威脅方法抗拒緝私的，以走私罪和妨害公務罪數罪並罰。B項說法正確。根據《刑法》第239條第2款的規定，犯綁架罪，殺害被綁架人的，或者故意傷害被綁架人，致人重傷、死亡的，處無期徒刑或死刑，並處沒收財產。因此實施綁架過程中故意致被害人死亡的，仍應認定為綁架罪一罪，所以，C項說法不正確。根據《刑法》第318條的規定，組織他人偷越國（邊）境的過程中，以暴力、威脅方法抗拒檢查的，仍應定組織他人偷越國（邊）境罪。但應處7年以上有期徒刑或者無期徒刑，並處罰金或者沒收財產，因此，D項說法正確。因為本題為選非題，所以，應選C。"}, {"id": "卷一-41", "subject": "卷一", "type": "單選題", "question": "甲用虛假身份證辦理了一張信用卡（一次能夠透支4萬元），並持該信用卡到商場透支消費4萬元，立即還款。銀行誤以為甲信用良好，遂將甲的信用額度提高至10萬元額度。甲透支消費10萬元後，立即註銷電話號碼，後經銀行兩次催收後超過3個月仍不還款。下列哪一選項是正確的？", "options": [{"key": "A", "text": "甲構成信用卡詐騙罪，犯罪數額為10萬元"}, {"key": "B", "text": "甲的行為屬於“惡意透支”"}, {"key": "C", "text": "甲成立妨害信用卡管理罪與信用卡詐騙罪，應當數罪並罰"}, {"key": "D", "text": "甲構成信用卡詐騙罪，犯罪數額為14萬元"}], "answer": ["A"], "explanation_full": "【羿文解析】①甲使用虛假的身份證明騙領信用卡的行為成立妨害信用卡管理罪，但是其使用該信用卡透支 4萬元並歸還的行為，因為不具有非法占有目的，不構成犯罪。其第二次透支信用卡的行為，成立“使用偽造或假身份證明騙領的信用卡”類型的信用卡詐騙罪，數額為10萬元。“惡意透支”類型的信用卡詐騙罪要求是合法有效的持卡人“惡意透支”。A選項說法正確，BD選項說法錯誤。 ②以虛假的身份證明騙領的信用卡後予以使用，使用行為構成信用卡詐騙罪或者其他犯罪的，屬於牽連犯 ，從一重罪處罰。C選項說法錯誤。 綜上，本題正確答案為A選項。"}, {"id": "卷一-42", "subject": "卷一", "type": "單選題", "question": "《人民法院工作人員處分條例》規定了法院工作人員詳盡的紀律責任。關於法院工作人員的違紀責任，下列哪一說法是錯誤的？", "options": [{"key": "A", "text": "趙法官利用職務便利侵吞執行款物，屬於違反廉政紀律的行為"}, {"key": "B", "text": "張法官在辦案過程中，因為過失導致錯誤釆取財產保全措施，造成不良後果，屬於違反辦案紀律的行為"}, {"key": "C", "text": "李法官違反公車管理規定，造成不良後果，屬於違反管理秩序和社會道德紀律的行為專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 17"}, {"key": "D", "text": "王法官弄虛作假，騙取榮譽，屬於違反組織人事紀律的行為"}], "answer": ["B"], "explanation_full": "【羿文解析】①《人民法院工作人員處分條例》第二章“分則”第三節“違反廉政紀律的行為”第55條規定 ：“利用職務便利，釆取侵吞、竊取、騙取等手段非法占有訴訟費、執行款物、罰沒款物、案件暫存款、贓款贓物及其孳息等涉案財物或者其他公共財物的，給予記大過處分；情節較重的，給予降級或者撤職處分 ；情節嚴重的，給予開除處分。”故A選項正確。 ②第六節“失職行為”第83條規定：“因過失導致錯誤裁判、錯誤採取財產保全措施、強制措施、執行措施 ，或者應當釆取財產保全措施、強制措施、執行措施而未釆取，造成不良後果的，給予警告、記過或者記大過處分；造成嚴重後果的，給予降級、撤職或者開除處分”B選項屬於失職行為，故B選項錯誤。 ③第七節“違反管理秩序和社會道德的行為”第96條規定：“違反公務車管理使用規定，發生嚴重交通事故或者造成其他不良後果的，給予警告、記過或者記大過處分；情節較重的，給予降級或者撤職處分；情節嚴重的，給予開除處分。”故C選項正確。 ④第四節“違反組織人事紀律的行為”第72條規定：“弄虛作假，騙取榮譽，或者謊報學歷、學位、職稱的 ，給予警告、記過或者記大過處分；情節較重的，給予降級或者撤職處分；情節嚴重的，給予開除處分”。 故D選項正確。 綜上，本題正確答案為B選項。"}, {"id": "卷一-43", "subject": "卷一", "type": "單選題", "question": "邢某因涉嫌強姦罪被判處有期徒刑。刑罰執行期間，邢某父母找到證人金某，證明案發時邢某正與金某在外開會，邢某父母提■申訴。法院對該案啟動再審。關於原判決的執行，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "繼續執行原判決"}, {"key": "B", "text": "由再審法院裁定中止執行原判決"}, {"key": "C", "text": "由再審法院決定中止執行原判決"}, {"key": "D", "text": "報省級法院決定中止原判決"}], "answer": ["C"], "explanation_full": "【羿文解析】《刑事訴訟法》第257條規定：“人民法院決定再審的案件，需要對被告人採取強制措施的，由人民法院依法決定；人民檢察院提出抗訴的再審案件，需要對被告人採取強制措施的，由人民檢察院依法決定。人民法院按照審判監督程序審判的案件，可以決定中止原判決、裁定的執行。”《刑訴解釋》第464條規定：“對決定依照審判監督程序重新審判的案件，人民法院應當製作再審決定書。再審期間不停止原判決、 裁定的執行，但被告人可能經再審改判無罪，或者可能經再審減輕原判刑罰而致刑期屆滿的，可以決定中止原判決、裁定的執行，必要時，可以對被告人採取取保候審、監視居住措施。”據此選項C正確。"}, {"id": "卷一-44", "subject": "卷一", "type": "單選題", "question": "某市檢察院對某監獄獄警王某私放多名在押人員案進行立案偵查。掌握有關證據後，檢察院決定依法對王某進行傳喚。王某聞訊逃匿，去向不明。下列哪一選項是正確的？", "options": [{"key": "A", "text": "不符合通緝條件，檢察院發布協查通報"}, {"key": "B", "text": "符合通緝條件，由該市公安機關作出通緝的決定"}, {"key": "C", "text": "符合通緝條件，由該市檢察院報請有決定權的上級檢察院作■通緝決定"}, {"key": "D", "text": "符合通緝條件，由該市檢察院報請上一級檢察院發布通緝令"}], "answer": ["C"], "explanation_full": "【羿文解析】①《刑事訴訟法》第155條規定：“應當逮捕的犯罪嫌疑人如果在逃，公安機關可以發布通緝令 ，釆取有效措施，追捕歸案。各級公安機關在自己管轄的地區以內，可以直接發布通緝令；超出自己管轄的地區，應當報請有權決定的上級機關發布。”本案中王某“聞訊逃匿，去向不明”的情節符合通緝的形式要件，因此判斷王某是否應當被通緝，關鍵在於確定本案是否符合通緝的實質條件，即王某所犯的罪行是否應當被逮捕。《刑事訴訟法》第81條第一款規定了逮捕的條件，即證據條件、罪責條件和社會危險性條件。本案中，檢察院掌握了王某私放在押人員案的相關證據，符合逮捕證據條件。據《刑法》第400條規定，王某私放在押人員案可能會被判處徒刑以上刑罰，因此本案符合逮捕的罪責條件。加之在本案中王某“聞訊而逃 18 ，故A項表述錯誤。 ②《高檢規則》第232條規定，人民檢察院辦理直接受理立案偵查的案件，應當逮捕的犯罪嫌疑人如果在逃 ，或者已被逮捕的犯罪嫌疑人脫逃的，經檢察長批准，可以通緝。本題中監獄獄警王某私放在押人員，屬檢察院自偵案件，所以應由人民檢察院決定通緝，B項是由公安機關決定通緝，故表述錯誤。 ③《高檢規則》第233條規定，各級人民檢察院需要在本轄區內通緝犯罪嫌疑人的，可以直接決定通緝；需要在本轄區外通緝犯罪嫌疑人的，由有決定權的上級人民檢察院決定。因為王某逃匿，去向不明，辦案的檢察院應當交由有決定權的上級人民檢察院決定，故C項表述正確。 ④《刑事訴訟法》第155條規定，應當逮捕的犯罪嫌疑人如果在逃，公安機關可以發布通緝令，採取有效措施 ，追捕歸案。有權發布通緝令的只有公安機關，故D項表述錯誤。 綜上，本題正確答案為C選項。"}, {"id": "卷一-45", "subject": "卷一", "type": "單選題", "question": "甲上了地鐵車廂，看到座椅上有個包，便問旁邊的乙∶\"是您的嗎？\"乙明知不是自己的，而是睡著了的乘客丙的，卻答道∶\"是的\"。甲便將包遞給乙，然後自己坐下。乙拿到包後離開車廂。下列說法正確的有", "options": [{"key": "A", "text": "乙構成詐騙罪，屬於二者間詐騙"}, {"key": "B", "text": "乙構成詐騙罪，屬於三角詐騙"}, {"key": "C", "text": "乙構成盜竊罪，屬於直接正犯"}, {"key": "D", "text": "乙構成盜竊罪，屬於間接正犯"}], "answer": ["D"], "explanation_full": "【羿文解析】三角詐騙與盜竊罪的間接正犯的區別在於，受騙人是不是合格的處分人，也即有無處分財物的權利或地位。本案受騙人是甲，但甲顯然沒有處分丙的財物的權利或地位。因此，乙不構成三角詐騙，A、 B項錯誤，而是盜竊罪的間接正犯。乙不構成盜竊罪的直接正犯，是因為轉移占有這個環節是由甲實施完成的 ，而不是由乙完成的，也即是甲將財物拿起來遞給了乙，故C項錯誤、D項正確。"}, {"id": "卷一-46", "subject": "卷一", "type": "單選題", "question": "關於法與道德的關係的論述，下列各項正確的有（　）", "options": [{"key": "A", "text": "強調依法治國和依德治國相結合，這就意味著在新的歷史時期應當讓法與道德達到渾然一體的狀態"}, {"key": "B", "text": "在推進全面依法治國的過程中，必須堅持法律中心主義，讓法律在社會生活中發揮更為重要的作用"}, {"key": "C", "text": "推進全面依法治國，發揮法律在推動社會發展與進步方面的力量，意味著法律有能力超出社會發展需要創造或“改變”社會"}, {"key": "D", "text": "堅持憲法和法律至上，意味著一切國家機關和武裝力量、各政黨和社會團體、各企業事業組織都必須遵守憲法和法律"}], "answer": ["D"], "explanation_full": "【羿文解析】中國特色社會主義法治理論要求我們反對法律中心主義和法律萬能論的錯誤，實現依法治國和依德治國相結合。但是，在近現代，明確法與道德的界限，“法是最低限度的道德”成為通說，不可能要求二者之間達到渾然一體、彼此不分的狀態。A項錯誤。B項錯誤嚴重，應當反對法律中心主義立場，認識到法律不是萬能的，有其範圍和限度。法律以社會為基礎，不可能超出社會發展需要創造或“改變”社會。C項錯誤。憲法法律至上，就意味著在我國憲法和法律具有最高的權威性，任何主體不得有超越憲法和法律的特權 。D項正確。"}, {"id": "卷一-47", "subject": "卷一", "type": "單選題", "question": "關於“依法治國”，下列哪一選項是錯誤的？", "options": [{"key": "A", "text": "依法治國以國家法律體系的健全、完善、規範、系統、協調為必要條件"}, {"key": "B", "text": "依法治國依賴於法制完備，法律健全完備了，法治就實現了"}, {"key": "C", "text": "依法治國應當樹立憲法法律的權威"}, {"key": "D", "text": "依法治國的實現，必須以規範和制約公權力為前提，做到職權法定、有權必有責、用權受監督、違法受追究"}], "answer": ["B"], "explanation_full": "19 善、規範、系統和協調統一。法制完備是法治建設的重要先決條件，也是法治建設的首要目標。構建和完善中國特色社會主義法律體系是依法治國方略實施的必要前提。故A項正確。在形式上的法制完備之後，還需要法律制度適應社會發展的需要，滿足社會發展的客觀要求，同時符合公平正義的價值要求。進而，執法機關能嚴格執法，司法機關能公正高效權威地司法，社會公眾能普遍守法等等，法治才能真正實現。故B項不正確 。樹立憲法法律的權威是依法治國的必然要求，憲法和法律在調控社會生活中發揮著基礎和主導的作用，一切國家機關和其他社會規範只能在憲法和法律的支配下發揮作用。因此，C項正確。依法治國的關鍵在於依法治權、規範和控制公權力，防止其濫用和擴張，保障人民權益。建立健全決策權、執行權和監督權既相互制約又相互協調的權力結構和運行機制，是建設社會主義法治國家的基本要求和特徵。因此，必須做到職權法定、有權必有責、用權受監督、違法受追究，故D項正確。"}, {"id": "卷一-48", "subject": "卷一", "type": "單選題", "question": "關於《憲法》對自然人的適用效力，下列哪一選項是錯誤的？", "options": [{"key": "A", "text": "我國憲法適用於一切擁有中國國籍的人"}, {"key": "B", "text": "對於因出生取得國籍的確定，我國釆取出生地主義和血統主義相結合的原則"}, {"key": "C", "text": "僑居在國外的華僑受中國憲法保護"}, {"key": "D", "text": "憲法也同等地適用於居住在中國境內的外國人"}], "answer": ["D"], "explanation_full": "【羿文解析】我國的憲法適用於所有中國公民，《憲法》第33條規定，凡具有中華人民共和國國籍的人都是中華人民共和國公民。所以我國憲法適用於一切擁有中國國籍的人，所以A項正確。國籍的取得方式主要有兩種：一種是因出生而取得，一種是加入國籍。我國《國籍法》第4條規定，父母雙方或一方為中國公民，本人出生在中國，具有中國國籍。第5條規定，父母雙方或一方為中國公民，本人出生在外國，具有中國國籍；但父母雙方或一方為中國公民並定居在外國，本人出生時即具有外國國籍的，不具有中國國籍。第6條規定，父母無國籍或國籍不明，定居在中國，本人出生在中國，具有中國國籍。可見，對於因出生取得國籍，我國採用出生地主義和血統主義相結合的原則。所以B項也是正確的。因為我國憲法適用於所有具有中國國籍的中國公民，所以僑居在外國的華僑也受中國憲法的保護。我國《憲法》第50條明確規定：“中華人民共和國保護華僑的正當的權利和利益，保護歸僑和僑眷的合法的權利和利益。”所以C項也是正確的。外國人和外國法人在一定的條件下成為基本權利主體。可見，外國人在享有基本權利的範圍方面，較本國公民為窄，如其並不享有我國憲法規定的選舉權與被選舉權等政治權利。所以D項所表述的“憲法也同等地適用於居住在中國境內的外國人”的表述是錯誤的。"}, {"id": "卷一-49", "subject": "卷一", "type": "單選題", "question": "根據憲法和法律，下列有關國家機構職權的表述中哪項是正確的？", "options": [{"key": "A", "text": "全國人民代表大會無權決定設立國務院各部、各委員會"}, {"key": "B", "text": "國務院有權決定自治州的設立"}, {"key": "C", "text": "自治區人民代表大會常務委員會有權決定民族鄉的設立"}, {"key": "D", "text": "全國人民代表大會常委會有權決定大赦"}], "answer": ["B"], "explanation_full": "【羿文解析】根據國務院組織法第8條的規定，全國人民代表大會有權決定國務院各部、各委員會的設立、撤銷或者合併。故選項A錯誤。根據《憲法》第89條第15項的規定，自治州、縣、自治縣、市的建置和區域劃分由國務院批准。故選項B表述正確。根據《憲法》第107條第3款的規定，民族鄉的設立由省、直轄市的人民政府決定，故選項C錯誤。根據《憲法》第67條第18項的規定，全國人大常委會行使的職權是特赦而不是大赦。 故選項D錯誤。 【相關法條•《國務院組織法》】第8條：國務院各部、各委員會的設立、撤銷或者合併，經總理提出，由全國人民代表大會決定；在全國人民代表大會閉會期間，由全國人民代表大會常務委員會決定。 20 政機關的職權的具體劃分；（五）編製和執行國民經濟和社會發展計劃和國家預算；（六）領導和管理經濟工作和城鄉建設、生態文明建設；（七）領導和管理教育、科學、文化、衛生、體育和計劃生育工作；（八 ）領導和管理民政、公安、司法行政等工作；（九）管理對外事務，同外國締結條約和協定；（十）領導和管理國防建設事業；（十一）領導和管理民族事務，保障少數民族的平等權利和民族自治地方的自治權利 ；（十二）保護華僑的正當的權利和利益，保護歸僑和僑眷的合法的權利和利益；（十三）改變或者撤銷各部、各委員會發布的不適當的命令、指示和規章；（十四）改變或者撤銷地方各級國家行政機關的不適當的決定和命令；（十五）批准省、自治區、直轄市的區域劃分，批准自治州、縣、自治縣、市的建置和區域劃分；（十六）依照法律規定決定省、自治區、直轄市的範圍內部分地區進入緊急狀態；（十七）審定行政機構的編製，依照法律規定任免、培訓、考核和獎懲行政人員；（十八）全國人民代表大會和全國人民代表大會常務委員會授予的其他職權。第一百零七條縣級以上地方各級人民政府依照法律規定的權限，管理本行政區域內的經濟、教育、科學、文化、衛生、體育事業、城鄉建設事業和財政、民政、公安、民族事務、司法行政、計劃生育等行政工作，發布決定和命令，任免、培訓、考核和獎懲行政工作人員。鄉、民族鄉、鎮的人民政府執行本級人民代表大會的決議和上級國家行政機關的決定和命令，管理本行政區域內的行政工作。 省、直轄市的人民政府決定鄉、民族鄉、鎮的建置和區域劃分。"}, {"id": "卷一-50", "subject": "卷一", "type": "單選題", "question": "道德與法律都屬於社會規範的範疇，都具有規範性、強制性和有效性，道德與法律既有區別又有聯繫。下列有關法與道德的幾種表述中，哪種說法是錯誤的？", "options": [{"key": "A", "text": "法律具有既重權利又重義務的“兩面性”，道德具有隻重義務的“一面性”"}, {"key": "B", "text": "道德的強制是一種精神上的強制"}, {"key": "C", "text": "馬克思主義法學認為，片面強調法的安定性優先是錯誤的"}, {"key": "D", "text": "法律所反映的道德是抽象的"}], "answer": ["D"], "explanation_full": "【羿文解析】法律同時關注權利和義務，道德只強調義務，不太重視權利，所以A項正確。法律和道德均具有強制性，只是法律的強制方式是外在強制，或者說是有組織的國家強制，而道德的強制是內在的精神強制 ，主要依靠內在的良知認同和責難。因此B項正確。從馬克思主義法學的立場來說，片面強調任何一點都是錯誤的。因此，C項當然正確。道德本身可能是抽象的、籠統的、模糊的，但一旦上升為法律，則就轉化為具體的、相對明確的行為標準。因此D是錯誤的，當選。 多項選擇題"}, {"id": "卷一-51", "subject": "卷一", "type": "多選題", "question": "2013年2月7日，某縣國土資源局書面通知劉某，其家的部分耕地用於某村組公路暨銀銅礦擴能提質增效項目前期工作進場公路建設。3月16日，該公路開挖至劉某家耕地時，劉某以其未獲補償款為由，到現場自行走到施工機械前邊坡林地躺下以阻止施工，施工方立即停止施工。3月18日，該縣國土資源局書面通知劉某，責令其交出耕地。3月19日，該縣國土資源局組織再次到劉某耕地施工。劉某再次到現場自行走到施工機械前邊坡林地躺下以阻止施工。下列哪些說法是錯誤的？（　）", "options": [{"key": "A", "text": "該縣公安局有權以妨礙公務為由派警察將劉某行政拘留"}, {"key": "B", "text": "該縣國土資源局有權以拒不交出土地妨礙國家建設為由對劉某罰款"}, {"key": "C", "text": "該縣國土資源局於3月20日可申請該縣法院強制執行"}, {"key": "D", "text": "劉某對責令其交出耕地的決定不服，可以提起行政訴訟"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】根據《治安管理處罰法》第50條，所謂妨礙公務的行為，是指下列情形：（1）拒不執行人民政府在緊急狀態情況下依法發布的決定、命令的；（2）阻礙國家機關工作人員依法執行職務的；（3）阻礙執行緊急任務的消防車、救護車、工程搶險車、警車等車輛通行的；（4）強行衝闖公安機關設置的警戒帶、警戒區的。劉某阻止施工行為顯然不屬於上述情形，故A項說法錯誤。特別注意：本題中的施工行為不屬於“國家機關工作人員依法執行職務”行為。根據《土地管理法實施條例》第45條，違反土地管理法律、法規規定 21 縣國土資源局作出的責令交出土地的決定，某縣國土資源局只能申請法院執行，不能進行罰款，故B項說法錯誤。根據《行政強制法》第53條，當事人在法定期限內不申請行政復議或者提起行政訴訟，又不履行行政決定的，沒有行政強制執行權的行政機關可以自期限屆滿之日起3個月內申請人民法院強制執行。據此，行政機關申請法院執行必須等待相對人的申請復議和起訴期限屆滿。本題中，3月20日，劉某對征收其耕地及責令交出土地的決定的起訴期限顯然未屆滿，故C項說法錯誤。D項說法顯然正確。本題為選非題，故應選A、B、C項 。"}, {"id": "卷一-52", "subject": "卷一", "type": "多選題", "question": "關於行政復議有關事項的處理，下列哪些說法是正確的？（　）", "options": [{"key": "A", "text": "申請人因不可抗力不能參加行政復議致行政復議中止滿六十日的，行政復議終止"}, {"key": "B", "text": "復議進行現場勘驗的，現場勘驗所用時間不計入復議審理期限"}, {"key": "C", "text": "申請人對行政拘留不服申請復議，復議期間因申請人同一違法行為涉嫌犯罪，該行政拘留變更為刑事拘留的，行政復議中止"}, {"key": "D", "text": "行政復議期間涉及專門事項需要鑒定的，當事人可以自行委託鑒定機構進行鑒定"}], "answer": ["B", "D"], "explanation_full": "【羿文解析】根據《行政復議法實施條例》第41條、42條的規定，只有在3種中止復議的情況下，中止滿60日的復議才終止：（1）作為申請人的自然人死亡，其近親屬尚未確定是否參加行政復議的；（2）作為申請人的自然人喪失參加行政復議的能力，尚未確定法定代理人蔘加行政復議的；（3）作為申請人的法人或者其他組織終止，尚未確定權利義務承受人的。不可抗力中止滿60日的不能終止復議，A選項錯誤。《行政復議法實施條例》第34條第3款規定：“需要現場勘驗的，現場勘驗所用時間不計入行政復議審理期限。”據此，B選項正確。根據《行政復議法實施條例》第42條第1款第5項規定，申請人對行政拘留或者限制人身自由的行政強制措施不服申請行政復議後，因申請人同一違法行為涉嫌犯罪，該行政拘留或者限制人身自由的行政強制措施變更為刑事拘留的，行政復議終止，而非中止。據此C選項錯誤。根據《行政復議法實施條例》第37條規定：“行政復議期間涉及專門事項需要鑒定的，當事人可以自行委託鑒定機構進行鑒定，也可以申請行政復議機構委託鑒定機構進行鑒定。”據此D選項正確。"}, {"id": "卷一-53", "subject": "卷一", "type": "多選題", "question": "根據《憲法》和法律規定，下列哪些選項是正確的？（　）", "options": [{"key": "A", "text": "中華人民共和國主席對全國人大及其常委會負責"}, {"key": "B", "text": "國務院對全國人大負責並報告工作，在全國人大閉會期間對全國人大常委會負責並報告工作"}, {"key": "C", "text": "最高人民法院、最高人民檢察院對全國人大及其常委會負責"}, {"key": "D", "text": "中央軍事委員會對全國人大負責並報告工作，在全國人大閉會期間對全國人大常委會負責並報告工作"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】《憲法》沒有規定國家主席對全國人大及其常委會負責，可見A項錯誤。根據《憲法》第92條的規定，國務院對全國人民代表大會負責並報告工作；在全國人民代表大會閉會期間，對全國人民代表大會常務委員會負責並報告工作。可見B項正確。根據《憲法》第133條的規定，最高人民法院對全國人民代表大會和全國人民代表大會常務委員會負責。地方各級人民法院對產生它的國家權力機關負責。根據《憲法》第 138條的規定，最高人民檢察院對全國人民代表大會和全國人民代表大會常務委員會負責。地方各級人民檢察院對產生它的國家權力機關和上級人民檢察院負責。可見C項正確。根據《憲法》第94條的規定，中央軍事委員會主席對全國人民代表大會和全國人民代表大會常務委員會負責。可見，D項錯誤。因此，本題的正確答案應當是BC項。"}, {"id": "卷一-54", "subject": "卷一", "type": "多選題", "question": "下列有關“國法”的理解，哪些是不正確的？（　）", "options": [{"key": "A", "text": "“國法”是國家法的另一種說法"}, {"key": "B", "text": "“國法”僅指國家立法機關創制的法律"}, {"key": "C", "text": "只有“國法”才有強制性"}, {"key": "D", "text": "無論自然法學派，還是實證主義法學派，都可能把“國法”看作實在法 22"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】特定國家現行有效的法，籠統地講，就是“國法”。“國法”不同於國家法，國家法在多種意義上被使用，有的與民間法相對，有的與地方法相對，有的指憲法相關法。故A錯誤。“國法”外延包括：國家立法機關創制的法律（成文法），法院或法官創制的規則（判例法），國家通過一定方式認可的習慣法 （不成文法），其他（如教會法）。故B項錯誤。“國法”和其他社會規範（如道德、習慣、宗教等）都具有強制力，但只有“國法”具有國家強制力。故C項錯誤。D項表述正確。綜上，本題的答案為ABC。"}, {"id": "卷一-55", "subject": "卷一", "type": "多選題", "question": "小王是某盜竊案的被害人，小李是該案的證人。小王和小李在刑事訴訟中的不同之處體現在哪些方面 ？（　）", "options": [{"key": "A", "text": "小王有權委託訴訟代理人，小李無權委託訴訟代理人"}, {"key": "B", "text": "小王有權參加法庭審理的全過程，小李無權參加庭審的全過程，只能在作證時到庭"}, {"key": "C", "text": "小王有權申請迴避，小李無權申請迴避"}, {"key": "D", "text": "小王有權用本民族語言文字進行訴訟、小李無權用本民族語言文字進行訴訟"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】①是否有權委託代理人、是否有權申請迴避是當事人與其他訴訟參與人訴訟權利的主要區別 ，小王是被害人，其有權委託訴訟代理人，參加法庭審理的全過程，有權申請迴避，小李是證人，其無權委託訴訟代理人，只有在作證時參加法庭審理，所以A、C兩項表述正確。 ②之所以不允許證人旁聽案件審理的全過程，是為了防止對其作證產生影響，故B項表述正確。 ③使用本民族語言文字進行訴訟，是全部訴訟參與人共同的訴訟權利。因此，小王、小李均有該權利，故D項錯在後半句話。 綜上，本題正確答案為ABC選項。"}, {"id": "卷一-56", "subject": "卷一", "type": "多選題", "question": "關於憲法表現形式的說法，下列哪些選項是正確的？（　）", "options": [{"key": "A", "text": "憲法典是所有國家憲法結構體系的核心，均具有內容完整、邏輯嚴謹的特徵"}, {"key": "B", "text": "憲法判例主要存在於普通法系國家，這些國傢具有“遵從先例”的司法傳統"}, {"key": "C", "text": "憲法判例在美國只能通過聯邦最高法院新的憲法判例才能推翻"}, {"key": "D", "text": "憲法判例在英國有著調整英王、議會、內閣之間關係的決定性作用"}], "answer": ["B", "D"], "explanation_full": "【羿文解析】憲法有成文憲法和不成文憲法之分，成文憲法的體系核心是憲法典，但是不成文憲法的核心並不是憲法典，其憲法結構主要由憲法判例、憲法慣例、憲法性文件等組成，據此A選項錯誤。憲法判例主要存在於普通法系國家，“遵循先例”是其明顯不同於大陸法系國家的司法傳統，據此B選項正確。當然，憲法判例並不是隻在普通法系國家才有，在傳統的大陸法系國家如德國、法國也有憲法判例的存在。美國是成文憲法國家，制定了世界上第一部成文憲法《美利堅合眾國憲法》，憲法判例也是美國憲法的組成部分，但是聯邦最高法院的憲法判例除了可以由聯邦最高法院新的憲法判例推翻以外，還可能以憲法修正案的形式推翻 ，故C選項錯誤。英國的憲法判例是英國憲法的重要組成部分，由於沒有成文憲法典，英國憲法的很多內容都以憲法判例的形式存在，戴雪甚至說英國憲法本身就是普通法的一部分，可見英國憲法判例在憲法結構中的重要性，據此D選項正確。"}, {"id": "卷一-57", "subject": "卷一", "type": "多選題", "question": "甲向市自然資源局申請集體土地使用權的許可證，市自然資源局報經省自然資源廳審批後，依據省政府作出的徵用土地決定，向甲頒發了土地使用權許可證，乙認為該許可侵犯已有的集體土地使用權，準備獲得救濟，下列哪些說法是正確的？", "options": [{"key": "A", "text": "本案是復議前置案件，未經復議不得訴訟"}, {"key": "B", "text": "乙應當向省政府申請行政復議"}, {"key": "C", "text": "乙可以向自然資源部申請行政復議"}, {"key": "D", "text": "經過復議後，乙對復議決定不服的，有權選擇向法院提起訴訟，或者向國務院申請最終裁決"}], "answer": ["A", "B"], "explanation_full": "23 其已經依法取得的土地、礦藏、水流、森林、山嶺、草原、荒地、灘涂、海域等自然資源的所有權或者使用權的，應當先申請行政復議；對行政復議決定不服的，可以依法向人民法院提起行政訴訟。根據國務院或者省、自治區、直轄市人民政府對行政區劃的勘定、調整或者征收土地的決定，省、自治區、直轄市人民政府確認土地、礦藏、水流、森林、山嶺、草原、荒地、灘涂、海域等自然資源的所有權或者使用權的行政復議決定為最終裁決。”由此可知，本案屬於復議前置案件，且依據為省政府作出的徵用土地的決定，復議決定為最終裁決。故A選項正確，當選。 ②依據國務院或省級政府對行政區劃的勘定、調整或徵用土地的決定作■的自然資源確權行為，復議機關是省級政府。故B選項正確，當選，C選項錯誤，不當選。 ③本案屬於復議終局，對復議決定不服，不得再向法院提起訴訟。故D選項錯誤，不當選。"}, {"id": "卷一-58", "subject": "卷一", "type": "多選題", "question": "關於司法公正及實體公正、程序公正問題的理解，下列哪些表述是正確的？（　）", "options": [{"key": "A", "text": "司法公正是法治的組成部分和基本內容，是民眾對法制的必然要求，司法公正包括實體公正和程序公正兩個方面"}, {"key": "B", "text": "追求實體公正，是我國司法制度和法律職業道德的基本準則，主要指努力發現案件事實真相和正確適用實體法律"}, {"key": "C", "text": "程序公正包括當事人平等地參與、嚴格遵循法定程序及法官的居中裁判等，保證當事人受到公平對待"}, {"key": "D", "text": "根據形勢及效率需要，可在有關司法過程中將“類推”和“自由心證”作為司法公正的補充手段"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】雖然很多國家的法律確立了“自由心證”制度，並作為體現程序公正的要求，但是我國並沒有明確根據形勢及效率的需要，可以在有關司法過程中適用“自由心證”，故D項說法錯誤。"}, {"id": "卷一-59", "subject": "卷一", "type": "多選題", "question": "甲、乙、丙、丁四人因盜竊罪被檢察院提起公訴，法院對四名被告人決定逮捕。法院判處甲有期徒刑五年 ，乙有期徒刑二年緩刑三年，丙免除刑罰，丁無罪。之後，甲提出上訴，法院對哪些人應當立即釋放但也可以依法變更強制措施？", "options": [{"key": "A", "text": "甲"}, {"key": "B", "text": "乙"}, {"key": "C", "text": "丙"}, {"key": "D", "text": "丁"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】本題考查強制措施的變更和解除。《高法解釋》第170條規定：“被逮捕的被告人具有下列情形之一的，人民法院應當立即釋放；必要時，可以依法變更強制措施：（一）第一審人民法院判決被告人無罪 、不負刑事責任或者免予刑事處罰的；（二）第一審人民法院判處管制、宣告緩刑、單獨適用附加刑，判決尚未發生法律效力的；（三）被告人被羈押的時間已到第一審人民法院對其判處的刑期期限的；（四）案件不能在法律規定的期限內審結的。”本題中，甲被判有期徒刑五年，不屬於該條規定的應當釋放但也可以變更強制措施的情形，乙被判處緩刑、丙被免除刑罰、丁被判無罪，乙丙丁三人屬於該條規定的應當釋放但也可以變更強制措施的情形。故本題的正確答案為B、C、D三項。 綜上，本題的正確答案為BCD選項。"}, {"id": "卷一-60", "subject": "卷一", "type": "多選題", "question": "王某因詐騙罪被某市公安機關立案偵查，並被某市中級人民法院一審判處無期徒刑.並處沒收個人全部財產。王某不服，上訴至某省高級人民法院，高級人民法院維持原判。下列表述正確的有？（　）", "options": [{"key": "A", "text": "若對王某詐騙時使用的本人汽車進行追繳，應當由某市中級人民法院執行"}, {"key": "B", "text": "若王某的一筆存款被某市公安機關偵查時凍結，法院應當在凍結期限屆滿前續行凍結"}, {"key": "C", "text": "在B中，法院續行凍結的順位應當排在其他凍結王某存款的司法機關之後"}, {"key": "D", "text": "王某將詐騙所得的一部手機轉賣給了善意第三人，法院在執行程序中不得追繳該手機"}], "answer": ["A", "B", "D"], "explanation_full": "24 ，由第一審人民法院執行。第一審人民法院可以委託財產所在地的同級人民法院執行。”本案中，某市中級人民法院為第一審法院，由某市中級人民法院執行沒有問題，A正確。《最高人民法院關於刑事裁判涉財產部分執行的若干規定》第5條第1款規定：“刑事審判或者執行中，對於偵查機關已經採取的查封、扣押、凍結 ，人民法院應當在期限屆滿前及時續行查封、扣押、凍結。人民法院續行查封、扣押、凍結的順位與偵查機關查封、扣押、凍結的順位相同。”可見，法院應當在凍結期限屆滿前續行凍結，B正確。人民法院續行查封 、扣押、凍結的順位與偵查機關查封、扣押、凍結的順位相同，不應排在其他凍結王某存款的司法機關之後 ，C錯誤。《最高人民法院關於刑事裁判涉財產部分執行的若干規定》第11條規定：“被執行人將刑事裁判認定為贓款贓物的涉案財物用於清償債務、轉讓或者設置其他權利負擔，具有下列情形之一的，人民法院應予追繳：（一）第三人明知是涉案財物而接受的；（二）第三人無償或者以明顯低於市場的價格取得涉案財物的；（三）第三人通過非法債務清償或者違法犯罪活動取得涉案財物的；（四）第三人通過其他惡意方式取得涉案財物的。第三人善意取得涉案財物的。執行程序中不予追繳。作為原所有人的被害人對該涉案財物主張權利的，人民法院應當告知其通過訴訟程序處理。”本題中是善意第三人取得了王某詐騙所得的手機，不能追繳，D正確。"}, {"id": "卷一-61", "subject": "卷一", "type": "多選題", "question": "關於《永徽律疏》，下列哪些選項是錯誤的？（　）", "options": [{"key": "A", "text": "《永徽律疏》又稱《唐律疏議》，是唐太宗在位時制定的"}, {"key": "B", "text": "《永徽律疏》首次確立了“十惡”即“重罪十條”制度"}, {"key": "C", "text": "《永徽律疏》對主要的法律原則和制度做了精確的解釋，而且盡可能以儒家經典為根據"}, {"key": "D", "text": "《永徽律疏》是對《貞觀律》的解釋，在中國立法史上的地位不如《貞觀律》"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】《永徽律疏》又稱《唐律疏議》，是唐高宗在位時制定並頒行天下的。其中《永徽律》是唐高宗李治永徽二年完成，而“疏議”部分在永徽四年完成，故A項錯誤。“重罪十條”正式確立於《北齊律》 ，包括反逆、大逆、叛、降、惡逆、不道、不敬、不孝、不義、內亂，在隋朝《開皇律》中將其加以損益 ，確定為謀反、謀大逆、謀叛、惡逆、不道、大不敬、不孝、不睦、不義、內亂，自此“十惡”制度正式確立。《永徽律疏》中的“十惡”只是因襲隋律，非其首創，故B項錯誤。《永徽律疏》中對律文的解釋分為 “注”、“疏”、“議”和“問答”幾個層次，引用大量的儒家經典令、格、式，協調律文間的關係，《永徽律疏》總結了漢魏晉以來立法和注律的經驗，不僅對主要的法律原則和制度作了精確的解釋與說明，而且盡可能引用儒家經典作為律文的理論依據。故C項正確。《永徽律》是在《貞觀律》的基礎上修訂的律典 ，“疏議”是對律文作出的詳細的解釋，二者合為《永徽律疏》，故不能說《永徽律疏》是對《貞觀律》的解釋。《永徽律疏》是我國迄今為止完整保存下來的一部最早、最完備、影響最大的封建成文法典。它總結了中國歷代統治者立法和注律的經驗，繼承了漢代以來德主刑輔的思想和禮律結合的傳統，使中國封建法律至此發展到最成熟、最完備的階段，標誌著中國封建立法技術達到最高水平。故D項錯誤。"}, {"id": "卷一-62", "subject": "卷一", "type": "多選題", "question": "關於檢察官職業道德和紀律，下列哪些做法是不正確的？", "options": [{"key": "A", "text": "張檢察官■於個人對某類案件研究的需要，私下要求鄰縣檢察官為其提供正在辦理的某案情況"}, {"key": "B", "text": "李檢察官與其承辦案件的被害人系來往密切的鄰居，因此提出迴避申請"}, {"key": "C", "text": "穿著檢察正裝、佩戴檢察標識參加單位組織的慰問孤寡老人的公益活動"}, {"key": "D", "text": "劉檢察官從檢察院離任剛滿1年就以律師身份擔任各類案件的訴訟代理人或者辯護人，但受到當事人及其家屬的一致肯定"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】①檢察官應當嚴格遵守檢察紀律，不違反規定過問、干預其他檢察官、其他人民檢察院或者其他司法機關正在辦理的案件，不私自探詢其他檢察官、其他人民檢察院或者其他司法機關正在辦理的案件情況和有關信息。故A選項做法不正確。 ②對法定迴避事由以外可能引起公眾對辦案公正產生合理懷疑的，檢察官應當主動請求迴避。故B選項做法正確。 25 旨，保障人民權益”的良好形象。故C選項做法正確。 ④檢察官離任後2年內，不得以律師身份擔任各類案件的訴訟代理人或者辯護人，劉檢察官離任尚未滿2年 ，故D選項做法不正確。 綜上，本題正確答案為AD選項。"}, {"id": "卷一-63", "subject": "卷一", "type": "多選題", "question": "2018年《憲法修正案》將“中國共產黨領導是中國特色社會主義最本質的特徵”寫入第1條。下列哪些說法是正確的？（　）", "options": [{"key": "A", "text": "是為新時代推進國家治理體系和治理能力現代化提供了有力的憲法保障"}, {"key": "B", "text": "是對中國近代歷史進程和對中國特色社會主義所取得的偉大成就的總結"}, {"key": "C", "text": "是對新時代中國特色社會主義建設發展需求的客觀回應"}, {"key": "D", "text": "是實現“富強民主文明和諧美麗的社會主義現代化強國”目標的科學判斷"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】2018年《憲法修正案》將“中國共產黨領導是中國特色社會主義最本質的特徵”寫入第1條，這是對中國共產黨領導中國人民所取得的歷史經驗和偉大成就的總結，為彰顯人民意志、更好地確立實現中華民族偉大復興的堅強領導核心、為新時代推進國家治理體系和治理能力現代化提供了有力的憲法保障。其意義在於：首先，這是對中國歷史進程和對中國特色社會主義所取得的偉大成就的總結。正是中國共產黨領導中國人民完成了新民主主義革命，建立了新中國；完成了社會主義革命，確立了社會主義基本制度；也正是中國共產黨領導中國人民開啟了改革開放的偉大歷史征程，使中國邁入了國家富強民族振興人民幸福的新時代。其次，這是對新時代中國特色社會主義建設發展需求的客觀回應。新時代有新問題和新需求，只有中國共產黨才能調動、集中和團結最廣泛的力量，積極應對國內外發展環境，著力解決人民日益增長的美好生活需要和不平衡不充分的發展之間的矛盾，並為全球發展貢獻中國智慧與中國方案。最後，這是實現“富強民主文明和諧美麗的社會主義現代化強國”目標的科學判斷。只有中國共產黨才能始終堅持以人民為中心，發揮黨的領導核心作用，不斷總結社會主義建設的經驗和教訓，團結帶領人民進行偉大鬥爭、建設偉大工程、 推進偉大事業、實現偉大夢想，把我國建設成為富強民主文明和諧美麗的社會主義現代化強國。綜上所述 ，A、B、C、D項正確。"}, {"id": "卷一-64", "subject": "卷一", "type": "多選題", "question": "甲系某石油天然氣公司采油廠員工，2013年開始甲以單獨承包方式負責采油廠一單井點的生產設施的看管、維護工作。2014年年初，乙、丙與甲共謀後，甲向乙提供出油信息和開啟儲油罐的專用扳手，傳授開啟油罐的方法並在盜油時關閉照明電源以作掩護，在甲的配合下，乙利用專用扳手打開儲油罐盜竊原油，然後運輸到丙的原油加工廠，由丙進行提純和變賣。自2014年3月至2016年1月，共竊取原油 450余噸，價值人民幣150余萬元。關於本案，下列說法哪些是錯誤的？（　）", "options": [{"key": "A", "text": "甲、乙的行為構成盜竊罪、破壞易燃易爆設備罪的想象競合犯"}, {"key": "B", "text": "甲、乙、丙的行為構成職務侵占罪的共犯"}, {"key": "C", "text": "丙的行為構成掩飾、隱瞞犯罪所得罪"}, {"key": "D", "text": "甲、乙、丙構成共同犯罪，其中，甲、乙均是主犯，丙是從犯"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】最高人民法院、最高人民檢察院、公安部《關於辦理盜竊油氣、破壞油氣設備等刑事案件適用法律若干問題的意見》是2019年法考大綱新增的司法解釋。該司法解釋第4條規定：“關於內外勾結盜竊油氣行為的處理：行為人與油氣企業人員勾結共同盜竊油氣，沒有利用油氣企業人員職務便利，僅僅是利用其易於接近油氣設備、熟悉環境等方便條件的，以盜竊罪的共同犯罪論處。實施上述行為，同時構成破壞易燃易爆設備罪的，依照處罰較重的規定定罪處罰。”根據上述解釋，如果利用油氣企業人員職務便利，內外勾結共同盜竊油氣便成立職務侵占罪的共犯。 26 為涉案油井的承包人，利用看護油井的便利條件，為乙提供出油信息，又為他提供特殊扳手並教會他使用方法，其利用的不僅僅是熟悉環境、便於接近石油的工作便利，而是充分利用了看管和維護采油設施的職務便利。從另一角度來看，采油廠將特殊扳手存放於甲處，相當於將開啟油罐的鑰匙交給甲保管，客觀上使其具備了職務上的便利，因此甲可以構成職務侵占罪，乙、丙與甲勾結，利用甲看管、維護油井的職務便利共同竊取原油，其行為均已構成職務侵占罪共犯。另外，本案中甲、乙等人用專用扳手打開儲油罐盜竊原油，並不足以引發火災、爆炸等危險，沒有危及公共安全，不構成破壞易燃易爆設備罪。 C項錯誤。丙雖然明知原油是盜竊所得而予收購，屬於掩飾隱瞞犯罪所得的行為，但其系事前已經與甲、乙等人通謀，應以職務侵占罪共犯論處。 D項正確。在內外勾結盜油案件中，油田員工在共同犯罪中作用大小對案件定性有重要意義。如果行為人均共同直接實施了盜油行為，或者雖然沒有直接實施盜油行為，但其對犯罪構成要件的實現起到了重要或者關鍵作用，均成立共同正犯；如果犯罪中利用了油田員工的職務便利，案件的定性應依照最高人民法院《關於審理貪污、職務侵占案件如何認定共同犯罪幾個問題的解釋》第2條“行為人與公司、企業或者其他單位的人員勾結，利用公司、企業或者其他單位人員的職務便利，共同將該單位財物非法占為己有，數額較大的，以職務侵占罪共同論處”之規定，均認定為職務侵占罪。如果沒有利用石油公司員工職務便利，僅利用了其熟悉工作環境的工作便利為盜竊石油提供幫助，那麼油田員工的行為性質應按照實行犯來認定。本案中，有的觀點認為，甲提供扳手、關燈掩護等行為僅是一種幫助行為，根據幫助犯的從屬性原則，應按實行犯即乙的犯罪性質認定為盜竊罪。實際上，甲作為內應，其為乙等人提供出油信息，特別是提供特殊扳手開啟油罐的行為對案件順利實施起到決定作用而不僅是幫助作用，甲、乙都是主犯，而丙事前通謀後僅事後收購石油，作用較小，是從犯。根據上述司法解釋，三人均應認定為職務侵占罪共犯，不能因為沒有身份的共犯具有人數優勢而認定為盜竊罪。"}, {"id": "卷一-65", "subject": "卷一", "type": "多選題", "question": "《刑法》規定，在拐賣婦女、兒童過程中姦淫被拐賣的婦女的，僅定拐賣婦女、兒童罪。15周歲的甲在拐賣幼女的過程中，強行姦淫幼女。對此，下列哪些選項是錯誤的？（　）", "options": [{"key": "A", "text": "《刑法》第十七條第二款沒有規定15周歲的人對拐賣婦女、兒童罪負刑事責任，所以，甲不負刑事責任"}, {"key": "B", "text": "拐賣婦女、兒童罪包含了強姦罪，15周歲的人應對強姦罪承擔刑事責任，所以，對甲應認定為拐賣婦女、 兒童罪"}, {"key": "C", "text": "15周歲的人犯強姦罪的應當負刑事責任，所以，對甲應認定為強姦罪"}, {"key": "D", "text": "拐賣婦女、兒童罪重於強姦罪，既然15周歲的人應對強姦罪承擔刑事責任，就應對拐賣婦女、兒童罪承擔刑事責任，所以，對甲應以拐賣婦女、兒童罪與強姦罪實行並罰"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】依照《刑法》第17條第2款的規定，已滿14周歲不滿16周歲的人，犯①故意殺人；②故意傷害致人重傷或者死亡；③強姦；④搶劫；⑤販賣毒品；⑥放火；⑦爆炸；⑧投毒罪的，應當負刑事責任。處在此年齡段的人只對法律明文列舉的上述幾種犯罪負刑事責任，而對其他犯罪不負刑事責任。具體來講：（1）已滿14周歲不滿16周歲的人對法定八種性質的“行為”負刑事責任，而不管他所涉及的“罪名”是什麼。 （2）罪名以《刑法》第17條第2款列舉的8種行為為限。最高人民法院《關於審理未成年人刑事案件具體應用法律若干問題的解釋》第5條規定，已滿14周歲不滿16周歲的人實施《刑法》第17條第2款規定以外的行為 ，如果同時觸犯了《刑法》第17條第2款規定的，應當依照《刑法》第17條第2款的規定確定罪名，定罪處罰 。根據該解釋，應當依據第17條第2款的規定確定罪名，定罪處罰。在本案中，不滿16周歲的人拐賣婦女兒童過程中，強行姦淫幼女，滿足強姦罪的構成要件，應以強姦罪定罪處罰。而不能按照《刑法》第240條加重犯規定以拐賣婦女、兒童罪定罪處罰。故C正確，ABD錯誤。"}, {"id": "卷一-66", "subject": "卷一", "type": "多選題", "question": "清乾隆年間，甲在京城天安門附近打傷乙被判笞刑，甲不服判決，要求複審。關於案件的複審，下列哪些選項是正確的？（　）", "options": [{"key": "A", "text": "應由九卿、詹事、科道及軍機大臣、內閣大學士等重要官員會同審理"}, {"key": "B", "text": "應在霜降後10日舉行"}, {"key": "C", "text": "應由大理寺官員會同各道御史及刑部承辦司會同審理專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 27"}, {"key": "D", "text": "應在小滿後10日至立秋前1日舉行"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】對發生在京師的笞杖刑案件進行複審的制度，叫熱審，於每年小滿後十日至立秋前一日，由大理寺官員會同各道御史及刑部承辦司共同進行，快速決放在監笞杖刑案犯。故CD正確，AB錯誤。"}, {"id": "卷一-67", "subject": "卷一", "type": "多選題", "question": "石某殺人後棄屍河中。在法庭審理中，對下列哪些事實不必提出證據證明？（　）", "options": [{"key": "A", "text": "被棄屍的河流從案發村鎮穿過的事實"}, {"key": "B", "text": "刑法關於殺人罪的法律規定"}, {"key": "C", "text": "檢察機關和石某都沒有異議的案件基本事實"}, {"key": "D", "text": "石某的精神狀態"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】《高檢規則》第401條規定：“在法庭審理中，下列事實不必提出證據進行證明：（一）為一般人共同知曉的常識性事實；（二）人民法院生效裁判所確認的並且未依審判監督程序重新審理的事實；（三 ）法律、法規的內容以及適用等屬於審判人員履行職務所應當知曉的事實；（四）在法庭審理中不存在異議的程序事實；（五）法律規定的推定事實；（六）自然規律或者定律。”被棄屍的河流從案發村鎮穿過的事實屬於一般人共同知曉的常識性事實，故A項正確。刑法關於殺人罪的法律規定屬於審判人員履行職務所應當知曉的事實，故B項正確。檢察機關和石某都沒有異議的案件基本事實涉及的是犯罪構成事實而非程序事實 ，需要證明，故C項不正確。石某的精神狀態關係到其是否具備刑事責任能力，屬於犯罪構成事實，需要證明 ，故D項不正確。本題正確答案是A、B。"}, {"id": "卷一-68", "subject": "卷一", "type": "多選題", "question": "關於證人■庭作證，下列哪些說法是正確的？（　）", "options": [{"key": "A", "text": "需要出庭作證的警察就其執行職務時目擊的犯罪情況出庭作證，適用證人作證的規定"}, {"key": "B", "text": "警察就其非執行職務時目擊的犯罪情況出庭作證，不適用證人作證的規定"}, {"key": "C", "text": "對了解案件情況的人，確有必要時，可以強制到庭作證"}, {"key": "D", "text": "證人沒有正當理由拒絕出庭作證的，只有情節嚴重，才可以處以拘留，且拘留不可以超過10日"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】《刑事訴訟法》第192條第1款、第2款規定：“公訴人、當事人或者辯護人、訴訟代理人對證人證言有異議，且該證人證言對案件定罪量刑有重大影響，人民法院認為證人有必要出庭作證的，證人應當出庭作證。人民警察就其執行職務時目擊的犯罪情況作為證人出庭作證，適用前款規定。”故選項A正確，選項 B明顯錯誤。第193條規定：“經人民法院通知，證人沒有正當理由不出庭作證的，人民法院可以強制其到庭 ，但是被告人的配偶、父母、子女除外。證人沒有正當理由拒絕出庭或者出庭後拒絕作證的，予以訓誡，情節嚴重的，經院長批准，處以十日以下的拘留。被處罰人對拘留決定不服的，可以向上一級人民法院申請復議。復議期間不停止執行。”據此，D選項正確。C選項中強制了解案件情況的人出庭作證應當排除被告人的配偶、父母、子女，故C選項錯誤。綜上，本題正確答案為AD。"}, {"id": "卷一-69", "subject": "卷一", "type": "多選題", "question": "張三涉嫌搶劫罪在某縣人民法院受審，張三聘請了律師李四。在庭審過程中.下列關於辯護權的表述不正確的有？（　）", "options": [{"key": "A", "text": "李四可以向某縣法院申請帶律師助理王五出庭，某縣法院應當准許"}, {"key": "B", "text": "某縣法院允許王五出庭的，王五不得發表辯護意見"}, {"key": "C", "text": "李四在庭審中當庭作無罪辯護，其也可以隨後作有罪的罪輕辯護"}, {"key": "D", "text": "李四在庭審中申請法庭排除非法證據，法庭經過審查後決定駁回申請.李四可當庭提出復議，對復議結論不服的，可以在庭審後向上一級法院申請復核"}], "answer": ["A", "D"], "explanation_full": "28 中，李四可以向某縣法院申請帶律師助理王五出庭，但某縣法院並非應當准許。A錯誤。另外，王五出庭僅能從事相關輔助工作，不得發表辯護、代理意見。B正確。《保障律師執業權利規定》第35條規定：“辯護律師作無罪辯護的，可以當庭就量刑問題發表辯護意見，也可以庭後提交量刑辯護意見。”可見，律師不僅可以作無罪辯護.也可以同時發表有罪的量刑意見。無罪辯護與罪輕辯護可以同時存在。C正確。《保障律師執業權利規定》第38條第1款規定：“法庭審理過程中，律師就迴避，案件管轄，非法證據排除，申請通知證人、 鑒定人、有專門知識的人出庭.申請通知新的證人到庭，調取新的證據，申請重新鑒定、勘驗等問題當庭提出申請，或者對法庭審理程序提出異議的，法庭原則上應當休庭進行審查，依照法定程序作出決定。其他律師有相同異議的，應一併提出，法庭一併休庭審查。法庭決定駁回申請或者異議的，律師可當庭提出復議。經復議後，律師應當尊重法庭的決定，服從法庭的安排。”可見，李四的申請被駁回後，李四確實可以當庭申請復議，但經復議後，李四應當尊重法庭的決定，服從法庭的安排，沒有復核的權利。D錯誤。"}, {"id": "卷一-70", "subject": "卷一", "type": "多選題", "question": "甲乙丙三國相鄰，為爭奪邊境地區的油氣田甲國向乙國宣戰，丙國宣布處於戰時中立狀態。三國在交戰期間及戰爭結束後發生的下列哪些行為是符合國際法的？", "options": [{"key": "A", "text": "甲國宣布停止和乙國之間的任何貿易往來關係"}, {"key": "B", "text": "丙國等額購買甲乙兩國為戰爭在國際市場上發行的債券"}, {"key": "C", "text": "甲國故意發射導彈摧毀了乙國境內一大壩，造成乙國大面積水災"}, {"key": "D", "text": "甲乙兩國簽訂和平條約，乙國宣布立即釋放並遣返甲國戰俘"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】①戰爭開始可導致貿易關係立即中斷，選項A正確。 ②不作為是戰時中立的國家承擔的義務之一，不作為指中立國不得直接或間接地向任何交戰國提供軍事支持或幫助。包括不得提供軍隊、武器、給養、貸款或向交戰國軍隊提供庇護場所等。除基於人道主義考慮所提供的醫藥或醫護人員以外，上述支持或幫助，即使是平等地提供給交戰國雙方，也是中立國所不允許的，選項B錯誤。 ③交戰中禁止改變環境的作戰手段和方法，選項C錯誤。 ④D項符合戰爭法中人道主義原則，正確。 綜上，本題正確答案為AD選項。"}, {"id": "卷一-71", "subject": "卷一", "type": "多選題", "question": "根據《憲法》和法律，有關我國憲法規定的公民權利，下列哪些說法是正確的？", "options": [{"key": "A", "text": "我國憲法規定了人格尊嚴，但並未規定人格尊嚴的具體內容"}, {"key": "B", "text": "人民法院可以基於公共安全或追查刑事犯罪的需要，對公民的通信進行檢查"}, {"key": "C", "text": "中華人民共和國公民在年老、疾病或者喪失勞動能力的情況下有從國家和社會獲得物質幫助的權利"}, {"key": "D", "text": "財產權屬於消極權利"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】①我國憲法規定了人格尊嚴，但並未規定人格尊嚴的具體內容。人格尊嚴的具體內容主要規定在民法部門。故A選項正確。 ②因國家安全或追■刑事犯罪的需要，公安機關或檢察機關可以依法檢查公民通信。法院沒有該項職權，不能檢查公民的通信。故B選項錯誤。 ③我國憲法規定了物質幫助權，即中華人民共和國公民在年老、疾病或者喪失勞動能力的情況下有從國家和社會獲得物質幫助的權利。故C選項正確。 ④根據國家在公民權利中的作用不同，公民權利分為消極權利和積極權利。所謂消極權利是指非經請求，國家不得干預之權利，如人身自由。消極權利需要國家的尊重與容忍。所謂積極權利，是指需國家作為方可實現之權利，如憲法規定的受教育權。積極權利需要國家的積極作為。財產權屬於消極權利，非經請求，政府不得干預。故D選項正確。 綜上，本題正確答案為ACD選項。"}, {"id": "卷一-72", "subject": "卷一", "type": "多選題", "question": "法院領導在本院初任法官任職儀式上，就落實法官職業道德準則中的“文明司法”和踐行執法為民理念的專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 29 “理性文明執法”提出要求。下列哪些選項屬於“文明執法”範圍？（　）", "options": [{"key": "A", "text": "提高素質和修養，遵守執法程序，注重執法藝術"}, {"key": "B", "text": "儀容整潔、舉止得當、言行文明"}, {"key": "C", "text": "杜絕與法官職業形象不相稱的行為"}, {"key": "D", "text": "嚴守辦案時限，禁止拖延辦案"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】根據《法官職業道德基本準則》第24條的規定，法官應當文明司法，遵守司法禮儀，在履行職責過程中行為規範、著裝得體、語言文明、態度平和，保護良好的職業修養和司法作風。選項中ABC均與文明執法有關。"}, {"id": "卷一-73", "subject": "卷一", "type": "多選題", "question": "下列哪些選項屬於積極義務的範疇？（　）", "options": [{"key": "A", "text": "子女贍養父母"}, {"key": "B", "text": "嚴禁刑訊逼供"}, {"key": "C", "text": "公民依法納稅"}, {"key": "D", "text": "緊急避險"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】積極義務是指行為人必須根據權利的內容作出一定的行為，也叫作為義務，如贍養父母、撫養子女、納稅、服兵役等。消極義務是指義務人不得作出一定行為的義務，也叫不作為義務，如不得破壞公共財產，禁止非法拘禁，嚴禁刑訊逼供等。故AC正確，B錯誤。D項屬於權利的範疇，不選。"}, {"id": "卷一-74", "subject": "卷一", "type": "多選題", "question": "欣欣在高某的金店選購了一條項鏈，高某趁欣欣接電話之際，將為其進行禮品包裝的項鏈調換成款式相同的劣等品（兩條項鏈差價約3，000元）。欣欣回家後很快發現項鏈被“調包”，即返回該店要求退還，高某以發票與實物不符為由拒不退換。關於高某的行為，下列哪些說法是錯誤的？（　）", "options": [{"key": "A", "text": "構成盜竊罪"}, {"key": "B", "text": "構成詐騙罪"}, {"key": "C", "text": "構成侵占罪"}, {"key": "D", "text": "不構成犯罪，屬民事糾紛"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】盜竊罪，是指以非法占有為目的，秘密竊取數額較大的公私財物或者多次盜竊、入戶盜竊、攜帶凶器盜竊、扒竊的行為。詐騙罪，是指以非法占有為目的，用虛構事實或者隱瞞真相的方法，騙取數額較大的公私財物的行為。侵占罪，是指以非法占有他人財物為目的，將代為保管的他人財物或者他人的遺忘物 、埋藏物非法占為己有，數額較大，拒不交還的行為。在本案中，高某是在欣欣已經選購項鏈之後，趁為其進行禮品包裝的時候進行“調包”，根據商業慣例和民法相關理論，此時正品項鏈的所有權已經轉移給欣欣 。高某包裝項鏈之時欣欣就在旁邊，由此可見該正品項鏈並非高某代顧客保管的他人財物，也不是顧客的遺忘物或埋藏物，故不構成侵占罪。C項錯誤。本案中高某以劣等品調換正品項鏈後交給欣欣，即隱瞞了所遞交項鏈為劣等品的真相，而欣欣也誤以為該項鏈系自己挑選的正品項鏈，即已經陷入錯誤認識，但欣欣並未在該錯誤認識的支配下實施任何交付行為，因此不構成詐騙罪。B項錯誤。本案中高某得以用劣等品替換正品項鏈，是趁欣欣接電話之機，由此可見其行為方式的實質屬於“秘密竊取”。另外，兩條項鏈價值相差 3，000元，根據相關司法解釋，已經滿足盜竊罪的數額要求。由此可見高某的行為完全符合盜竊罪的犯罪構成，故A項正確，D項錯誤。【陷阱】本題的難點在於盜竊罪、詐騙罪與侵占罪的區分。三種財產性犯罪的主要區別在於行為方式不同：盜竊罪的成立要求行為人秘密竊取他人占有的財物；詐騙罪的成立要求行為人虛構事實或隱瞞真相，並致使被害人或第三人在陷入錯誤認識的基礎上“自願”處分財物；侵占罪的成立要求行為人將代為保管的他人財物或他人的埋藏物、遺忘物據為己有。行為當時財物由誰占有、行為之後有無交付行為、行為是否屬於“代為保管”等問題的判斷會直接影響案件的定性。本案中的“選購”二字至關重要 30 了。"}, {"id": "卷一-75", "subject": "卷一", "type": "多選題", "question": "根據現行《憲法》規定，關於公民權利和自由，下列哪些說法是錯誤的？（　）", "options": [{"key": "A", "text": "勞動、受教育和依法服兵役既是公民的基本權利又是公民的基本義務"}, {"key": "B", "text": "休息權的主體是全體公民"}, {"key": "C", "text": "公民在年老、疾病或者未喪失勞動能力的情況下，有從國家和社會獲得物質幫助的權利"}, {"key": "D", "text": "2004年《憲法修正案》規定，國家尊重和保障人權"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】本題是選非題。根據《憲法》第42條第1款的規定，中華人民共和國公民有勞動的權利和義務。 根據第46條第1款的規定，中華人民共和國公民有受教育的權利和義務。根據第55條的規定，保衛祖國、抵抗侵略是中華人民共和國每一個公民的神聖職責。依照法律服兵役和參加民兵組織是中華人民共和國公民的光榮義務。可見，A項說法錯誤。根據第43條規定，中華人民共和國勞動者有休息的權利。由於“勞動者”的內涵和外延不同於“全體公民”，所以B項說法錯誤。根據第45條第1款的規定，中華人民共和國公民在年老、 疾病或者喪失勞動能力的情況下，有從國家和社會獲得物質幫助的權利。國家發展為公民享受這些權利所需要的社會保險、社會救濟和醫療衛生事業。可見，C項說法錯誤。根據2004年《憲法修正案》第24條的規定 ，《憲法》第33條增加1款，作為第3款：“國家尊重和保障人權。”第3款相應地改為第4款。可見，D項說法正確。故應選ABC。"}, {"id": "卷一-76", "subject": "卷一", "type": "多選題", "question": "關於特別行政區制度，下列哪些說法是不正確的？（　）", "options": [{"key": "A", "text": "香港特別行政區行政長官任職須年滿四十五周歲"}, {"key": "B", "text": "香港特別行政區司法機關由其法院和檢察院組成"}, {"key": "C", "text": "香港和澳門特別行政區的各級法院都有權解釋本特別行政區基本法"}, {"key": "D", "text": "國務院有權對香港和澳門特別行政區的部分地區宣布進入緊急狀態"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】根據《香港特別行政區基本法》第44條規定：“香港特別行政區行政長官由年滿四十周歲，在香港通常居住連續滿二十年並在外國無居留權的香港特別行政區永久性居民中的中國公民擔任。”故A選項錯誤，當選。《香港特別行政區基本法》第80條規定：“香港特別行政區各級法院是香港特別行政區的司法機關，行使香港特別行政區的審判權。”《香港特別行政區基本法》第63條規定：“香港特別行政區律政司主管刑事檢察工作，不受任何干涉。”據此，香港特別行政區的司法機關只限於其法院，律政司主管刑事檢察工作，隸屬行政機關。故B選項錯誤，當選。《香港特別行政區基本法》第158條規定特區基本法的解釋主體包括全國人大常委會和香港各級法院，《澳門特別行政區基本法》第143條做了同樣規定。據此，C選項正確 ，不當選。根據《香港特別行政區基本法》第18條第4款規定，全國人大常委會宣布特區進入緊急狀態後，中央人民政府可發布命令將有關全國性法律在香港特別行政區實施。《澳門特別行政區基本法》第18條第4款作了同樣的規定。據此，D項錯誤，當選。"}, {"id": "卷一-77", "subject": "卷一", "type": "多選題", "question": "甲因意外撞倒小孩丁（5周歲），造成丁重傷，具有死亡的危險。甲的妻子乙與丁的母親丙均在場。關於本案，下列哪些選項是正確的？", "options": [{"key": "A", "text": "甲、丙均有救助丁的義務，但乙沒有救助丁的義務"}, {"key": "B", "text": "如丙及時救助了丁，即使甲沒有實施救助行為，甲也不成立不作為犯罪"}, {"key": "C", "text": "如甲、丙均不救助丁，丁因未得到及時救助而死亡的，甲、丙均成立不作為的故意殺人罪既遂"}, {"key": "D", "text": "如甲、丙不救助丁而逃離現場，即使乙將丁送往醫院而搶救脫險的，甲、丙也成立不作為的故意殺人罪未遂"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】①甲因為自己的先前行為（撞倒丁）產生了對丁的救助義務，丙作為丁的母親，基於法的規範 （民法規範）對丁具有救助義務。在同一案件中，完全可能存在多個負有作為義務的主體。A選項說法正確。 31 使甲沒有實施救助行為，也不成立不作為犯罪。B選項說法正確。 ③甲和丙均對丁的重傷負有作為義務，二人均不實施救助，均成立不作為方式的故意殺人罪既遂。C選項說法正確。 ④甲和丙均對丁的重傷負有作為義務，二人可以履行救助義務而不履行，構成不作為方式的故意殺人罪，但是因為意志以外的原因，二人的不作為沒有導致危害結果的發生，因此成立不作為的故意殺人罪未遂。D選項說法正確。 綜上，本題正確答案為ABCD選項。"}, {"id": "卷一-78", "subject": "卷一", "type": "多選題", "question": "某區規劃局以某公司所蓋廠房違反規劃為由責令拆除。該公司不服向某區政府申請復議。某區政府作出復議決定後，該公司不服起訴。在下列哪些情況下，該公司應當以某區規劃局和某區政府為共同被告向法院起訴？（　）", "options": [{"key": "A", "text": "區政府認為區規劃局現場勘查有違法之處，再度現場勘查後決定維持責令拆除決定"}, {"key": "B", "text": "區政府以程序輕微違法為由確認區規劃局的責令拆除決定違法"}, {"key": "C", "text": "區政府以區規劃局無權作出責令拆除決定為由，作出撤銷決定"}, {"key": "D", "text": "區政府認為區規劃局責令拆除決定合法、合理，作出維持決定"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】復議維持後才以原機關和復議機關為共同被告起訴。復議維持與復議改變的區分，只看對原行政行為的處理結果有無變化，不考慮事實認定、證據采信或規範依據的變化。A、D項對原行政行為的處理結果進行了維持，故應選。B項未改變原行政行為處理結果，只是確認程序違法，故構成復議維持。C項是否定了原行政行為的處理結果，故構成復議改變，應以區政府為單獨的被告起訴，不應選。"}, {"id": "卷一-79", "subject": "卷一", "type": "多選題", "question": "甲欲殺乙，便向乙開槍，但開槍的結果是將乙和丙都打死。關於本案，下列哪些選項是正確的？（　）", "options": [{"key": "A", "text": "根據具體符合說，甲對乙成立故意殺人既遂，對丙成立過失致人死亡罪"}, {"key": "B", "text": "根據法定符合說，甲對乙與丙均成立故意殺人既遂"}, {"key": "C", "text": "不管是根據具體符合說，還是根據法定符合說，甲對乙與丙均成立故意殺人既遂"}, {"key": "D", "text": "不管是根據具體符合說，還是根據法定符合說，甲對乙成立故意殺人既遂，對丙成立過失致人死亡罪"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】具體的事實認識錯誤，是指行為人認識的事實與實際發生的事實雖然不一致，但沒有超出同一犯罪構成的範圍，因而也被稱為同一犯罪構成內的錯誤。具體的事實錯誤主要包括對象錯誤、打擊錯誤與因果關係的錯誤。對於具體的事實錯誤，存在具體的符合說與法定的符合說的爭論。前者認為，行為人所認識的事實與實際發生的事實具體地相一致時，才成立故意的既遂犯；後者認為，行為人所認識的事實與實際發生的事實，只要在犯罪構成範圍內是一致的，就成立故意的既遂犯。通說採取法定符合說。關於打擊錯誤 ，具體符合說認為，由於客觀事實與行為人的主觀認識沒有形成具體的符合，所以，在本案中，甲對乙承擔殺人既遂的責任，對丙則承擔過失致人死亡的責任；由於只有一個行為，故二者屬於想象競合犯，從一重罪論處。而根據法定符合說中的數故意說，行為人對甲與乙都成立故意殺人既遂。當然，採取數故意說並不意味著成立數個故意殺人罪，因為只有一個行為，所以應按想象競合犯以一罪論處。因此AB正確，CD錯誤。"}, {"id": "卷一-80", "subject": "卷一", "type": "多選題", "question": "關於以危險方法危害公共安全罪，下列選項錯誤的是？（　）", "options": [{"key": "A", "text": "甲在家中為少走幾步路，將吃完的梨核直接從29樓丟下，險些砸中樓下跳廣場舞的人群。甲構成以危險方法危害公共安全罪"}, {"key": "B", "text": "乙抱著\"砸著誰誰倒霉\"的心理從高樓窗戶扔出一個煙灰缸，恰巧砸到樓下的一位行人，致其重傷。乙構成以危險方法危害公共安全罪"}, {"key": "C", "text": "丙因工作不順心，將水桶、槓鈴、花盆從18樓扔下，持續時間長達二十分鐘，其樓下為公共道路，行人來往頻繁，但未造成人員傷亡。丙構成以危險方法危害公共安全罪"}, {"key": "D", "text": "丁攜帶彈弓及彈珠到宿舍樓頂玩耍。期間，丁使用彈弓向樓頂的墻體發射彈珠，後又向公共街道方向的路面發射了2粒彈珠，其中一粒彈珠（鋼珠）擊穿途經該處的一輛正載有多名乘客的公共汽車車窗玻璃。經鑒定專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 32 ，該輛公共汽車受損的車窗玻璃損失價格為850元。丁構成以危險方法危害公共安全罪"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】A項錯誤。甲為了少走幾步路將桃核從26樓高空拋下，可見其沒有危害公共安全的故意，且其僅僅拋下一個梨核，其產生的危險範圍有限，危險範圍不具有擴張性。不構成以危險方法危害公共安全罪。但其險些砸中樓下跳廣場舞的人群，達到了《刑法修正案（十一）》中高空拋物罪規定的情節嚴重的標準，應認定為高空拋物罪。B項錯誤。乙從窗台上扔煙灰缸，並不具有危害公共安全的目的，不可能導致具體危險或侵害結果隨時擴大或增加。因此甲不構成以危險方法危害公共安全罪，成立故意傷害罪。乙的行為也同時觸犯了高空拋物罪，應當採取從一重罪處罰的原則，應認定乙的行為為故意傷害罪。C項正確。2019年10月21日最高人民法院《關於依法妥善審理高空拋物、墜物案件的意見》規定∶\"故意人高空拋棄物品，尚未造成嚴重後果，但足以危害公共安全的，依照刑法第一百一十四條規定的以危險方法危害公共安全罪定罪處罰。\"本項中，丙從窗戶扔出數量較多的物品，且其家窗戶下方是公共道路，丙將公共領域變為危險領域，足以危害公共安全，成立以危險方法危害公共安全罪。D項正確。丁的行為已對公共安全造成危險，構成以危險方法危害公共安全罪。綜上，AB當選。"}, {"id": "卷一-81", "subject": "卷一", "type": "多選題", "question": "王某為個體經營的叉車配件門市部老闆，其指派送貨司機邵某將該公司一拋丸機吊運至劉某所在公司。劉某在邵某將拋丸機吊載至指定地點後，要求邵某幫其吊載2個拋丸機附件。邵某見天色昏暗、無法看清場地及被吊物遂將現場施，工環境及可能的危險等情況，通過審話向王某匯報王某明知u當時的現場環境己，不能繼續開展吊裝作業，仍然命令邵某繼續進行吊裝作業。接到指今後，邵某在無法看清場地及被吊物的情況下 ，繼續駕駛吊車將2個拋丸機附件吊載至劉某指定的位置，後在協助劉某進行拋丸機安裝作業時，因吊車在吊提升機向上微調的過程中，初步固定的兩顆螺母蹦脫，導致提升機晃動，遂將劉某撞出施工平台墜落至拋丸機北側的地面，致使劉某頭部流血，後經搶救無效死亡。下列說法正確的是？（　）", "options": [{"key": "A", "text": "邵某構成過失致人死亡罪"}, {"key": "B", "text": "邵某構成重大責任事故罪"}, {"key": "C", "text": "王某構成強令違章冒險作業罪"}, {"key": "D", "text": "王某構成過失致人死亡罪"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】王某明知存在重大事故隱患，仍然命今他人違章冒險作業，因而發生重大傷亡事故，其行為已構成強令違章冒險作業罪;邵某在作業中違反有關安全管理規定，造成被害人死亡的，屬於過失。該行為不能認定為是間接故意，間接故意要求行為人\"明知\"自己的行為會造成危害結果，本案中邵某根本沒有明知。但由於本案是在特定生產作業領域違反了規則，因此，屬於特定領域（即生產、作業領域）過失致人死亡，應成立重大責任事故罪。綜上，BC當選。"}, {"id": "卷一-82", "subject": "卷一", "type": "多選題", "question": "下列說法錯誤的是？（　）", "options": [{"key": "A", "text": "甲既生產、銷售有毒有害的食品，又生產、銷售不符合安全標準的食品，並造成嚴重食物中毒事故，應擇一重罪處罰"}, {"key": "B", "text": "乙生產、銷售偽劣農藥的行為既觸犯了生產、銷售偽劣產品罪，又觸犯生產、銷售偽劣農藥罪，應擇一重罪處罰"}, {"key": "C", "text": "丙發現疫情防控期間口罩稀缺漲價，為謀取非法利益，組織他人對自己生產的以及購進的劣質口罩加以分揀，重新包裝後進行銷售。被查處時，丙出售劣質口罩6萬隻，獲款1.5萬元，尚未銷售口罩價值18萬元。丙銷售金額未達5萬元，不構成犯罪"}, {"key": "D", "text": "丁為醫院醫生，在某次義診活動中將假藥無償提供給他人使用。因並未營利，丁的行為不構成犯罪"}], "answer": ["A", "C", "D"], "explanation_full": "33 尚未銷售的口罩貨值金額超過了15萬元，應以生產、銷售偽劣產品罪（未遂）論處。D項錯誤。藥品使用單位的人員只要實施了提供假藥的行為就構成犯罪，並不限於以有償為目的提供他人使用的情形。提供∶藥品使用單位的人員明知是假藥而提供給他人使用的。不要求行為人主觀上具有特定犯罪目的，也不要求行為人具有牟利的目的，只要行為人明知是假藥而提供給他人使用。《刑法修正案（十一）》將生產、銷售假藥罪修改為生產、銷售、提供假藥罪。綜上，ACD當選。"}, {"id": "卷一-83", "subject": "卷一", "type": "多選題", "question": "下列說法正確的是？（　）", "options": [{"key": "A", "text": "邵某以進貨為由向甲銀行貸款100萬元，約定月息為9釐3（9.3%）。後邵某於同日將該100萬元貸款，以月息9分（9%）出借給孫某賺取利息差，違法所得32萬餘元。邵某構成高利轉貸罪"}, {"key": "B", "text": "曹某、徐某經預謀，利用網上泄露的個人身份信息和建設銀行e付卡註冊漏洞，並藉助支付寶（中國）網絡技術有限公司\"借唄\"平台的漏洞，冒用陳某等人的真實身份信息通過支付寶實名認證，並利用陳某等人的真實信用額度從\"借唄\"平台騙取貸款21筆，共計人民幣20萬元，攜款潛逃。曹某、徐某的行為構成貸款詐騙罪"}, {"key": "C", "text": "孟某以需購買飼料、魚苗、蟹苗為由，使用虛假的經濟合同、證明文件等材料騙取銀行50萬元。實際上孟某將50萬元購房，但其按時歸還借款及利息。孟某的行為構成騙取貸款罪"}, {"key": "D", "text": "馬某按照合法手續取得了銀行貸款，本想用於生產經營，盈利後返還貸款。但因疫情原因，如將貸款資金投入經營可能連成本都無法收回。於是，甲並沒有把貸款用於實際經營，而是以非法占有為目的隱匿了貸款 。甲的行為構成貸款詐騙罪"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】A項正確。邵某以轉貸牟利為目的，套取金融機構信貸資金高利轉貸他人，違法所得數額較大 ，其行為構成高利轉貸罪。B項正確。螞蟻\"借唄\"平台性質上屬於網絡小額借貸公司，已被中國人民銀行納入其他金融機構範疇。以非法占有為目的冒用他人支付寶賬戶騙取螞蟻\"借唄\"貸款的犯罪行為，依法構成貸款詐騙罪。C項錯誤。只有造成銀行或者其他金融機構資金損失的，才能認定為騙取貸款罪。本案中，孟某按時歸還本金及利息，並未造成銀行資金損失，不能被認定為騙取貸款罪。D項錯誤。行為人合法取得貸款之後產生非法占有目的，拒不還本付息，但沒有採取欺騙方法使貸款人免除其還本付息義務的，不成立貸款詐騙罪 ，只能作為民事案件處理。綜上，AB當選。"}, {"id": "卷一-84", "subject": "卷一", "type": "多選題", "question": "關於新時代深化依法治國實踐的主要任務，下列說法正確的有（　）", "options": [{"key": "A", "text": "全面推進依法治國的總目標是建設中國特色社會主義法治體系、建設社會主義法治國家"}, {"key": "B", "text": "建設中國特色社會主義法治體系的具體任務，即形成完備的法律規範體系、高效的法治實施體系、嚴密的法治監督體系、有力的法治保障體系，形成完善的黨內法規體系"}, {"key": "C", "text": "必須堅持厲行法治，推進科學立法、嚴格執法、公正司法、全民守法"}, {"key": "D", "text": "深化司法體制綜合配套改革，全面落實司法責任制，努力讓人民群眾在每一個司法案件中感受到公平正義"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】黨的十八屆四中全會和黨的十九大明確提出，全面推進依法治國的總目標是建設中國特色社會主義法治體系、建設社會主義法治國家。黨的十八屆四中全會明確建設中國特色社會主義法治體系的具體任務，即形成完備的法律規範體系、高效的法治實施體系、嚴密的法治監督體系、有力的法治保障體系，形成完善的黨內法規體系。全面依法治國是國家治理的一場深刻革命，必須堅持厲行法治，推進科學立法、嚴格執法、公正司法、全民守法；成立中央全面依法治國領導小組，加強對法治中國建設的統一領導；加強憲法實施和監督，推進合憲性審查工作，維護憲法權威；推進科學立法、民主立法、依法立法，以良法促進發展 、保障善治；建設法治政府，推進依法行政，嚴格規範公正文明執法；深化司法體制綜合配套改革，全面落實司法責任制，努力讓人民群眾在每一個司法案件中感受到公平正義；加大全民普法力度，建設社會主義法治文化，樹立憲法法律至上、法律面前人人平等的法治理念。各級黨組織和全體黨員要帶頭尊法學法守法用法，任何組織和個人都不得有超越憲法法律的特權，絕不允許以言代法、以權壓法、逐利違法、徇私枉法。 可見，ABCD四項均表述無誤。"}, {"id": "卷一-85", "subject": "卷一", "type": "多選題", "question": "20世紀60年代初，浙江省諸暨市楓橋鎮幹部群眾創造了“發動和依靠群眾，堅持矛盾不上交，就地解決。 34 實現'捕人少，治安好的“楓橋經驗”，為此，1963年毛澤東同志就曾親筆批示“要各地仿傚，經過試點，推廣去做”。“楓橋經驗”由此成為全國政法戰線一個膾炙人口的典型。關於“楓橋經驗”，下列說法正確的有（　）", "options": [{"key": "A", "text": "在我國，法治建設應當堅持群眾路線，從群眾中來，到群眾中去"}, {"key": "B", "text": "法治建設應當堅持為了人民、依靠人民、造福人民、保護人民，以保障人民根本權益為出發點和落腳點"}, {"key": "C", "text": "在基層社會管理中，應當充分發揮黨的政治優勢，依靠基層組織和廣大群眾，就地解決當地發生的各種矛盾、化解糾紛，最大限度地把問題解決在萌芽狀態"}, {"key": "D", "text": "在正確處理人民內部矛盾方面，應當以完善的制度為保障，健全矛盾糾紛排查調處工作機制，狠抓落實責任制，努力做到組織建設走在工作前，預測工作走在預防前，預防工作走在調解前，調解工作走在激化前"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】“楓橋經驗”涉及如下幾個方面的重要經驗：一是發動和依靠群眾，理順群眾情緒，化解矛盾糾紛，使具體的改革和發展措施為廣大群眾所理解、所擁護、所參與；二是就地解決矛盾；三是事先預防為主，盡量把矛盾解決在萌芽狀態；四是一切為了群眾，以保障人民根本權益為出發點和落腳點；五是重心下移，力量下沉，工作重點要放在基層；六是切實加強以黨支部為核心的基層法治隊伍建設。ABCD四項均符合題意。 不定項選擇題"}, {"id": "卷一-86", "subject": "卷一", "type": "多選題", "question": "關於行政訴訟，下列說法正確的是（　）。", "options": [{"key": "A", "text": "區稅務局凍結了王大錘的賬戶，但是向王大錘送達的凍結決定書上並未告知王大錘復議訴訟的權利和期限 ，則王大錘有權在知道起訴期限之日起6個月內起訴，不得超過凍結決定書送達之日起2年"}, {"key": "B", "text": "王二錘不服區政府拒絕公開政府信息而起訴，市中院適用簡易程序審理案件，可以用口頭通知、電話、短信、傳真、電子郵件等簡便方式傳喚當事人、通知證人、送達包括裁判文書在內的訴訟文書；但以簡便方式送達的開庭通知，未經當事人確認或者能夠證明當事人已經收到的，不得缺席判決；舉證期限不得超過15日"}, {"key": "C", "text": "王三錘不服縣計生委作出的征收4萬元社會撫養費的決定，法院審理認為社會撫養費計算錯誤，征收總額應當減少50元的，可以直接作出變更征收數額的判決"}, {"key": "D", "text": "交警大隊以王四錘闖紅燈為由當場處以50元罰款，王四錘不服起訴。法院適用簡易程序審理，法院在審理過程中發現不宜適用簡易程序的，裁定轉為普通程序"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】①根據《行訴解釋》第64條：“行政機關作出行政行為時，未告知公民、法人或者其他組織起訴期限的，起訴期限從公民、法人或者其他組織知道或者應當知道起訴期限之日起計算，但從知道或者應當知道行政行為內容之日起最長不得超過一年。復議決定未告知公民、法人或者其他組織起訴期限的，適用前款規定。”由此可知，只知內容不知訴權，最長保護期為1年。故A選項錯誤，不當選。 ②根據《行訴解釋》第103條：“適用簡易程序審理的行政案件，人民法院可以用口頭通知、電話、短信、傳真、電子郵件等簡便方式傳喚當事人、通知證人、送達裁判文書以外的訴訟文書。以簡便方式送達的開庭通知，未經當事人確認或者沒有其他證據證明當事人已經收到的，人民法院不得缺席判決。”由此可知，簡便方式只能送達裁判文書以外的訴訟文書，不得送達裁判文書。故B選項錯誤，不當選。 ③根據《行政訴訟法》第77條：“行政處罰明顯不當，或者其他行政行為涉及對款額的確定、認定確有錯誤的，人民法院可以判決變更。人民法院判決變更，不得加重原告的義務或者減損原告的權益。但利害關係人同為原告，且訴訟請求相反的除外。”社會撫養費是羈束行政行為，計算錯誤的，屬於款額確定、認定確有錯誤，且法院的變更判決是對征收總額的減少，沒有加重原告的義務，因此可以直接作出變更判決。故C選項正確，當選。 ④根據《行政訴訟法》第84條，“人民法院在審理過程中，發現案件不宜適用簡易程序的，裁定轉為普通程序。”故D選項正確，當選。 綜上，本題正確答案為CD選項。"}, {"id": "卷一-87", "subject": "卷一", "type": "多選題", "question": "張律師在執業過程中，一審為某案件原告代理，在委託關係終止後，二審為該案被告代理，對當事人的利專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 35 益造成嚴重侵害，省級律師協會懲戒委員會對其作出中止會員權利3個月的紀律處分。關於本案，下列說法錯誤的是（　）", "options": [{"key": "A", "text": "中華全國律師協會和省、自治區、直轄市律師協會設立懲戒委員會"}, {"key": "B", "text": "中止會員權利的同時，免除其義務"}, {"key": "C", "text": "張律師若經過原告同意，則不會受到紀律處分"}, {"key": "D", "text": "張律師受到紀律處分後，三年內不得擔任律所的設立人"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】①根據《律師協會會員違規行為處分規則（試行）》第8條：“中華全國律師協會設立懲戒委員會，負責律師行業處分相關規則的制定及對地方律師協會處分工作的指導與監督。”第九條：“各省、自治區、直轄市律師協會及設區的市律師協會設立懲戒委員會，負責對違規會員進行處分。”故A選項錯誤，全國律協、省級、市級律協有權設立懲戒委員會。 ②中止會員權利指中止期間，暫停會員享有律師協會章程規定的全部會員權利，但不免除該會員的義務。故 B選項錯誤。 ③根據《律師執業行為規範（試行）》第51條規定：“有下列情形之一的，律師及律師事務所不得與當事人建立或維持委託關係：……（七）在委託關係終止後，同一律師事務所或同一律師在同一案件後續審理或者處理中又接受對方當事人委託的；（八）其他與本條第（一）至第（七）項情形相似，且依據律師執業經驗和行業常識能夠判斷為應當主動迴避且不得辦理的利益衝突情形。”故C選項錯誤，本案涉及絕對利益衝突 ，即使徵得同意，也不能接受委託。 ④三年內未受過停止執業處罰的，可以作為律所設立人，張律師雖然受到紀律處分，但並不是受到停止執業處罰，不影響其作為設立人。故D選項錯誤。 綜上，本題正確答案為ABCD選項。"}, {"id": "卷一-88", "subject": "卷一", "type": "多選題", "question": "關於習近平法治思想的表述，下列說法正確的是（　）", "options": [{"key": "A", "text": "習近平法治思想是在法治軌道上推進國家治理體系和治理能力現代化的根本遵循"}, {"key": "B", "text": "習近平法治思想體系完整、理論厚重、博大精深，具有原創性、系統性、時代性、人民性和實踐性"}, {"key": "C", "text": "習近平法治思想是習近平新時代中國特色社會主義思想的重要組成部分，具有歷史邏輯、理論邏輯和實踐邏輯"}, {"key": "D", "text": "習近平法治思想是引領法治中國建設實現高質量發展的思想旗幟"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】①習近平法治思想的重要意義包括：第一，習近平法治思想是馬克思主義法治理論同中國實際相結合的最新成果。第二，習近平法治思想是對黨領導法治建設豐富實踐和寶貴經驗的科學總結。第三，習近平法治思想是在法治軌道上推進國家治理體系和治理能力現代化的根本遵循。第四，習近平法治思想是引領法治中國建設實現高質量發展的思想旗幟。故AD選項正確。 ②習近平法治思想形成和發展的邏輯：1.從歷史邏輯來看，習近平法治思想凝聚著中國共產黨人在法治建設長期探索中形成的經驗積累和智慧結晶，標誌著我們黨對共產黨執政規律、社會主義建設規律、人類社會發展規律的認識達到了新高度，開闢了中國特色社會主義法治理論和實踐的新境界。2.從理論邏輯來看，習近平法治思想堅持馬克思主義法治理論的基本原則，貫徹運用馬克思主義法治理論的立場、觀點和方法，繼承我們黨關於法治建設的重要理論，傳承中華優秀傳統法律文化，系統總結新時代中國特色社會主義法治實踐經驗，是馬克思主義法治理論與新時代中國特色社會主義法治實踐相結合的產物，是馬克思主義法治理論中國化的新發展新飛躍，反映了創新馬克思主義法治理論的內在邏輯要求。3.從實踐邏輯來看，習近平法治思想是從統籌中華民族偉大復興戰略全局和世界百年未有之大變局、實現黨和國家長治久安的戰略高度，在推進偉大鬥爭、偉大工程、偉大事業、偉大夢想的實踐之中完善形成的，並會隨著實踐的發展而進一步豐富。 故B選項正確。 ③習近平法治思想具有鮮明特色：1.原創性：馬克思主義創造性地揭示了人類社會發展規律，並隨著實踐的變化而發展。習近平總書記以馬克思主義政治家、思想家、戰略家的深刻洞察力、敏銳判斷力和戰略定力 36 大原創性貢獻。2，系統性：系統觀點是馬克思主義基本原理的重要內容。習近平總書記強調全面依法治國是一個系統工程，注重用整體聯繫、統籌協調、辯證統一的科學方法謀劃和推進法治中國建設，科學指出當前和今後一個時期推進全面依法治國十一個重要方面的要求，構成了系統完備、邏輯嚴密、內在統一的科學思想體系。3.時代性：時代性是馬克思主義的一個基本特性。習近平總書記立足中國特色社會主義進入新時代的歷史方位，立時代之潮頭，發思想之先聲，科學回答了新時代我國法治建設向哪裡走、走什麼路、實現什麼目標等根本性問題，在新時代治國理政實踐中開啟了法治中國新篇章。4.人民性：人民性是馬克思主義最鮮明的品格。習近平總書記強調法治建設要為了人民、依靠人民、造福人民、保護人民，推動把體現人民利益、反映人民願望、維護人民權益、增進人民福祉落實到全面依法治國各領域全過程，不斷增強人民群眾獲得感、幸福感、安全感。5.實踐性：實踐性是馬克思主義理論區別於其他理論的顯著特徵。習近平總書記明確提出全面依法治國並將其納入“四個全面”戰略布局，以破解法治實踐難題為著力點，作出一系列重大決策部署，解決了許多長期想解決而沒有解決的難題，辦成了許多過去想辦而沒有辦成的大事，社會主義法治國家建設發生歷史性變革、取得歷史性成就。故C選項正確。 綜上，本題正確答案為ABCD選項。"}, {"id": "卷一-89", "subject": "卷一", "type": "多選題", "question": "關於利用信用卡的犯罪，不考慮數額和情節，下列選項正確的是（　）", "options": [{"key": "A", "text": "甲在儲蓄所前台偷看了他人信用卡卡號、密碼、身份證號碼等，通過某銀行網絡銀行在網上購買了手機的 ，按照司法解釋，甲成立信用卡詐騙罪"}, {"key": "B", "text": "乙是銀行客服經理，以幫助儲戶存款為由，私藏儲戶銀行卡，再通過銀行櫃檯轉賬的方式獲取客戶銀行存款的，乙屬於“盜竊信用卡並使用”，成立盜竊罪"}, {"key": "C", "text": "丙是銀行櫃檯職員，利用經辦儲戶業務便利，要求儲戶重複輸入密碼，私自將儲戶的存款轉入自己掌控的賬戶的，丙屬於利用職務之便竊取他人財物，成立職務侵占罪"}, {"key": "D", "text": "丁是銀行大堂助理，幫助儲戶辦理信用卡，丁辦好後謊稱沒有辦好，之後持卡在銀行櫃檯將儲戶的存款提現的，因丁合法占有他人所有的信用卡，故丁成立侵占罪"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】①甲的行為屬於竊取、收買、騙取或者以其他方式獲得信用卡資料，終端使用的行為，根據司法解釋的規定，屬於冒用他人信用卡的行為，成立信用卡詐騙罪，A選項說法正確。 ②甲以幫助儲戶存款為由，私藏儲戶銀行卡，屬於盜竊信用卡的行為，再通過銀行櫃檯進行轉賬的行為，屬於“盜竊信用卡並使用”的行為，成立盜竊罪，B選項說法正確。 ③銀行櫃檯職員並不占有儲戶存款，其私自將儲戶的存款轉入自己賬戶的行為，成立盜竊罪，C選項說法錯誤 。 ④銀行大堂助理丁並不占有儲戶存款，其將丁的存款提現的行為不構成侵占罪，構成盜竊罪。D選項說法錯誤 。 綜上，本題正確答案為AB選項。"}, {"id": "卷一-90", "subject": "卷一", "type": "多選題", "question": "根據我國憲法和法律，下列說法錯誤的是（　）", "options": [{"key": "A", "text": "直接選舉的代表候選人數應多於應選名額的1/5~1/2倍"}, {"key": "B", "text": "某縣人大共有代表300人，該縣人大某次會議選舉市人大代表，其中220個人蔘加了投票，候選人丁某獲得 100張選票，被宣布當選市人大代表"}, {"key": "C", "text": "各級人大代表調離本行政區域的，其職務終止"}, {"key": "D", "text": "在我國，代表接受選民或者原選舉單位的監督"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】①直接選舉的代表候選人數應多於應選名額的1/3~1倍；而間接選舉的代表候選人人數應多於應選名額的1/5~1/2倍。故A選項錯誤。 ②縣人大開會選舉市人大代表屬於間接選舉。間接選舉各個場合的決定均要求全體過半，所以至少獲得151張票方能當選。故B選項錯誤。 37 ，全國人大代表不受此限制。 ④誰選舉誰監督。直接選舉的代表由選民監督，間接選舉的代表由原選舉單位監督。故D選項正確。同時還要注意，在我國，所有的代表都受到人民的監督。 綜上，本題正確答案為ABC選項。"}, {"id": "卷一-91", "subject": "卷一", "type": "多選題", "question": "《行政復議法》旨在防止和糾正違法的或者不當的具體行政行為，保護公民、法人和其他組織的合法權益 ，保障和監督行政機關依法行使職權。關於行政復議程序，下列選項錯誤的是（　）", "options": [{"key": "A", "text": "行政復議申請期限為60日，法律另有規定的除外"}, {"key": "B", "text": "申請人申請行政復議必須採用書面形式"}, {"key": "C", "text": "申請人撤回行政復議申請的，不得再以同一事實和理由提出行政復議申請"}, {"key": "D", "text": "行政復議調解書經雙方當事人簽字，即具有法律效力"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】A項錯誤，當選。《行政復議法》第9條第1款規定：“公民、法人或者其他組織認為具體行政行為侵犯其合法權益的，可以自知道該具體行政行為之日起六十日內提出行政復議申請；但是法律規定的申請期限超過六十日的除外。”此處要特別注意法律的另外規定，如果其規定是長於六十日則按照其規定適用 ，若短於六十日則按照六十日適用。因而並不是其他法律有任何規定都可以直接適用。 B項錯誤，當選。《行政復議法》第11條規定：“申請人申請行政復議，可以書面申請，也可以口頭申請；口頭申請的，行政復議機關應當當場記錄申請人的基本情況、行政復議請求、申請行政復議的主要事實、理由和時間。”行政復議的申請既可以書面也可以口頭，在具體行政行為中，比較典型的只能通過書面形式啟動的是行政許可，考生需要注意這一特例。 C項錯誤，當選。《行政復議法實施條例》第38條第2款規定：“申請人撤回行政復議申請的，不得再以同一事實和理由提出行政復議申請。但是，申請人能夠證明撤回行政復議申請違背其真實意思表示的除外。”但書部分的內容不能被忽視，否則答案就是不完整的。這也提醒考生，任何知識點的記憶特別是有但書的條文一定要把內容記全面。 D項正確，不當選。《行政復議法實施條例》第50條第2款規定：“當事人經調解達成協議的，行政復議機關應當製作行政復議調解書。調解書應當載明行政復議請求、事實、理由和調解結果，並加蓋行政復議機關印章。行政復議調解書經雙方當事人簽字，即具有法律效力。”行政復議調解和行政訴訟調解都具有法律效力 ，即具有強制執行力，而行政調解作為一種事實行為不具有強制執行力，這幾個概念要區分清楚。"}, {"id": "卷一-92", "subject": "卷一", "type": "多選題", "question": "在適用刑事特別程序的下列案件中，應當組成合議庭進行審理的是（　）", "options": [{"key": "A", "text": "未成年人王某盜竊自行車案"}, {"key": "B", "text": "犯罪嫌疑人蔡某逃匿案件中違法所得的沒收審理程序"}, {"key": "C", "text": "精神病人韓某強制醫療案"}, {"key": "D", "text": "對涉嫌受賄且逃匿境外的馬某缺席審判案件"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】①《刑事訴訟法》第216條規定，適用簡易程序審理案件，對可能判處三年有期徒刑以下刑罰的 ，可以組成合議庭進行審判，也可以由審判員一人獨任審判；對可能判處的有期徒刑超過三年的，應當組成合議庭進行審判。A項中的未成年人案件可能適用普通程序，也可能適用簡易程序審理，若適用簡易程序，則可能適用獨任審判。故A項不當選。 ②《刑事訴訟法》第299條規定，沒收違法所得的申請，由犯罪地或者犯罪嫌疑人、被告人居住地的中級人民法院組成合議庭進行審理。故B項當選。 ③《刑事訴訟法》第304條第1款規定，人民法院受理強制醫療的申請後，應當組成合議庭進行審理。故C項當選。 ④《刑事訴訟法》第291條規定，對境外的被告人缺席的案件，由犯罪地、被告人離境前居住地或者最高人民法院指定的中級人民法院組成合議庭進行審理。故D項當選。 綜上，本題的正確答案為BCD選項。 38"}, {"id": "卷一-93", "subject": "卷一", "type": "多選題", "question": "學說： ①只有基於悔悟、同情等對自己的行為持否定評價的規範意識、感情或者動機而放棄犯罪的，才是自動中止 ，此外的都是未遂。 ②行為人放棄犯罪的動機是基於對外部障礙的認識時，就是未遂，此外的場合便是自動中止。其判斷基準是弗蘭克（Frank）公式：能達目的而不欲時，為犯罪中止；欲達目的而不能時，為犯罪未遂。 ③根據社會的一般觀念對沒有既遂的原因（引起行為人放棄犯罪或防止結果發生的現象）進行客觀評價，如果當時的情況對一般人不會產生強制性影響，即一般人處於該情況下不會放棄犯罪，而行為人放棄的，便是犯罪中止；如果當時的情況能對一般人產生強制性影響，即一般人在當時的情況下也會放棄犯罪時，行為人放棄的，便是犯罪未遂。 案例： a.甲欲殺乙，乙求饒：“大哥行行好，我上有老下有小\"，甲於是放棄殺乙。 b.甲本欲在黑夜裡搶劫他人財物，但實施暴力時發現是自己的父親而放棄。 c.甲已經近距離地將槍支對準了乙的頭部，正欲扣動扳機時，警察在100米外喊“住手\"，甲便逃走。 d.甲在強姦過程中，見婦女乙正值月經期，知道可以實施強姦行為但是放棄。 下列選項正確的是（　）", "options": [{"key": "A", "text": "根據學說①②③，a成立犯罪中止"}, {"
