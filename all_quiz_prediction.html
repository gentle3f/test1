土地合同約定的用途使用土地，並不得修建永久性建築物。臨時使用土地期限一般不超過五年"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】《土地管理法》第54條規定：“建設單位使用國有土地，應當以出讓等有償使用方式取得；但是，下列建設用地，經縣級以上人民政府依法批准，可以以劃撥方式取得：(一)國家機關用地和軍事用地 ；(二)城市基礎設施用地和公益事業用地；(三)國家重點扶持的能源、交通、水利等基礎設施用地；(四)法律、行政法規規定的其他用地。”A選項正確。 《土地管理法》第56條規定：“建設單位使用國有土地的，應當按照土地使用權出讓等有償使用合同的約定或者土地使用權劃撥批准文件的規定使用土地；確需改變該幅土地建設用途的，應當經有關人民政府土地行政主管部門同意，報原批准用地的人民政府批准。其中，在城市規劃區內改變土地用途的，在報批前，應當先經有關城市規劃行政主管部門同意。”B、C選項正確。 《土地管理法》第57條第2、3款規定：“臨時使用土地的使用者應當按照臨時使用土地合同約定的用途使用土地，並不得修建永久性建築物。臨時使用土地期限一般不超過二年。”D選項錯誤。 故本題答案為ABC。"}, {"id": "卷二-82", "subject": "卷二", "type": "多選題", "question": "甲應聘力途公司公司的經理一職，與力途公司的勞動合同約定：（1）勞動合同期限為3年，試用期為4個月，試用期月工資9000元，試用期滿後約定月工資15000元；（2）合同期滿或因其他原因離職後，甲在3年內不得從事與力途公司同類的業務工作，公司在甲離職時一次性支付補償金5萬元。對力途公司與甲約定的勞動合同條款所作的下列判斷中，表述正確的是（　）", "options": [{"key": "A", "text": "力途公司與甲約定的試用期未超過法定最長期限"}, {"key": "B", "text": "力途公司與甲可以約定離職後不得從事同類行業"}, {"key": "C", "text": "力途公司與甲約定的試用期工資金額符合規定"}, {"key": "D", "text": "力途公司與甲約定離職後不得從事同類行業的時間超過法定最長期限"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】3年以上固定期限勞動合同，試用期不得超過6個月，所以選項A正確。 勞動者在試用期的工資不低於本單位相同崗位最低檔工資或者勞動合同約定工資的80%，選項C表述不正確。 33 對於單位高級管理人員，用人單位可以在勞動合同或者保密協議中與勞動者約定競業限制條款，並約定在解除或者終止勞動合同後，在競業限制期限內按月給予勞動者經濟補償，所以選項B正確。 競業限制期限，不得超過2年，所以選項D正確。"}, {"id": "卷二-83", "subject": "卷二", "type": "多選題", "question": "中國公民苗某，經常居所地在北京，去韓國旅遊期間向uqi公司訂購買了一套高檔化妝品。苗某回國使用該化妝品後臉上出現嚴重紅腫，遂向我國法院提起侵權訴訟，已知uqi公司在中國沒有從事相關經營活動。根據中國相關法律規定，下列說法錯誤的是？（　）", "options": [{"key": "A", "text": "此案中苗某可以選擇適用中國法來審理此案"}, {"key": "B", "text": "此案只能適用韓國法審理"}, {"key": "C", "text": "此案只能適用中國法審理"}, {"key": "D", "text": "苗某與uqi公司可以協議選擇本案適用的法律"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】根據《法律適用法》第45條規定，產品責任，適用被侵權人經常居所地法律；被侵權人選擇適用侵權人主營業地法律、損害發生地法律的。或者侵權人在被侵權人經常居所地沒有從事相關經營活動的 ，適用侵權人主營業地法律或者損害發生地法律。本案中，uqi公司在中國沒有從事相關的經營活動，但是損害發生地在中國，故該產品責任可以適用韓國法或中國法，故BC選項錯誤。上述條文中，只允許且只需要被侵權人自己選擇，無需與侵權人達成合意，即苗某可以自己選擇韓國法或是中國法，無需與uqi公司協議選擇 ，且可以選擇更有利於自己的法律，故A選項正確，D選項錯誤。 綜上，本題答案為BCD。"}, {"id": "卷二-84", "subject": "卷二", "type": "多選題", "question": "中國和德國都是《保護工業產權巴黎公約》的締約國。德國甲公司為了擴大所發明技術的銷售市場參加了位於中國境內的技術展銷會，中國乙公司在展會上和德國甲公司達成購買該項技術的協議。協議許可在中國境內只有乙公司有權使用該項技術，但乙公司每年生產的產品不能超過100萬件。根據《保護工業產權巴黎公約》和我國法律的規定，下列說法哪些是正確的？（　）", "options": [{"key": "A", "text": "如甲公司欲為該產品申請專利，則該專利申請的優先權日為該技術公開展出之日"}, {"key": "B", "text": "甲公司和乙公司達成的許可協議在中國境內屬於獨占許可"}, {"key": "C", "text": "甲公司和乙公司達成的關於產品數量限制的協議違反我國法律的規定"}, {"key": "D", "text": "只要甲公司在德國成功獲批專利，則所有《保護工業產權巴黎公約》的成員國都有義務對該專利進行保護"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】選項A正確。《保護工業產權巴黎公約》規定了對工業產權的臨時性保護原則，要求締約國應對在任何成員國內舉辦的或經官方承認的國際展覽會上展出的商品中可取得專利的發明、實用新型、外觀設計和可註冊的商標給予臨時保護。上述知識成果的優先權日是從展品公開展出之日起算。 選項B正確。根據我國法律的規定，知識產權許可包括三種類型：獨占許可(只有受讓人可用)；排他許可(只有出讓人和受讓人可用)和普通許可(還可以繼續許可他人使用)。本題中在中國只有乙公司能用，顯然在中國境內屬於獨占許可。大家注意判斷許可類型一定要考慮地域因素。 選項C正確。根據我國法律的規定，知識產權轉讓合同中禁止出現可能限制技術進步、限制競爭、限制經營和可能造成壟斷的條款。本題中限制產品數量的條款屬於限制經營的條款。 選項D錯誤。知識產權具有很強的地域屬性，尤其是專利。某個專利要想在其他國家也得到保護，必須在該國也申請一個專利。不存在一國申請，世界保護的情況。"}, {"id": "卷二-85", "subject": "卷二", "type": "多選題", "question": "中國甲公司和美國乙公司有一系列的交易和資金往來。為保障交易順暢進行，中國甲公司申請中國工商銀行開立獨立保函，中國工商銀行則指示浦發銀行向美國乙公司開立了獨立保函。關於本案，下列說法正確的是：", "options": [{"key": "A", "text": "浦發銀行可以要求工商銀行向其開具一份用於保障追償權的獨立保函"}, {"key": "B", "text": "如果該保函內未載明生效日期和事件，則一經開立立即生效"}, {"key": "C", "text": "在無特別約定情況下，如果雙方未約定且保函中未同時載明可轉讓以及確立新受益人的單據，則該保函被專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 34 視為不可轉讓"}, {"key": "D", "text": "如果該獨立保函涉及欺詐，則乙公司和工商銀行可以通過書面協議選擇案件的管轄法院，也可以明示選擇案件所適用的法律"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】選項A正確。根據《最高人民法院關於審理獨立保函糾紛案件若干問題的規定》第1條第三款的規定，獨立保函可以依保函申請人的申請而開立，也可依另一金融機構的指示而開立。開立人依指示開立獨立保函的，可以要求指示人向其開立用以保障追償權的獨立保函。 選項B正確。根據《最高人民法院關於審理獨立保函糾紛案件若干問題的規定》第4條第二款的規定，獨立保函一經開立即生效，但獨立保函載明生效日期或事件的除外。 選項C正確。根據《最高人民法院關於審理獨立保函糾紛案件若干問題的規定》第10條的規定，獨立保函未同時載明可轉讓和據以確定新受益人的單據，開立人主張受益人付款請求權的轉讓對其不發生效力的。人民法院應予支持。獨立保函對受益人付款請求權的轉讓有特別約定的，從其約定。 選項D正確。根據《最高人民法院關於審理獨立保函糾紛案件若干問題的規定》第21條的規定，獨立保函欺詐和獨立保函糾紛案件中雙方當事人都能對管轄法院進行選擇。在獨立保函糾紛案件中，雙方當事人可以在獨立保函中進行選擇；在獨立保函欺詐案件中，雙方當事人則只能在另外的書面協議中進行選擇。 不定項選擇題"}, {"id": "卷二-86", "subject": "卷二", "type": "單選題", "question": "甲、乙訂立買賣合同，約定甲將標的物A交付予乙後，乙應當在1周內完成檢驗。乙收到貨物後才發現1周時間根本不夠，要全面完成檢驗至少需要1個月。乙立刻向甲提出延長檢驗期，甲表示拒絕。第三周，乙發現標的物存在品質瑕疵，遂向甲提出異議，甲則以異議期間屆滿為由，拒不接受。以下說法正確的是？（　）", "options": [{"key": "A", "text": "當事人約定的異議期間過短，約定無效"}, {"key": "B", "text": "當事人約定的異議期間有效，乙提出異議時，異議期間已經屆滿"}, {"key": "C", "text": "如果乙所發現的瑕疵為外觀瑕疵，乙可以提出異議"}, {"key": "D", "text": "如果乙所發現的瑕疵為隱蔽瑕疵，乙可以提出異議"}], "answer": ["D"], "explanation_full": "【羿文解析】根據《民法典》第622條的規定，當事人約定的檢驗期限過短，根據標的物的性質和交易習慣 ，買受人在檢驗期限內難以完成全面檢驗的，該期限僅視為買受人對標的物的外觀瑕疵提出異議的期限。約定的檢驗期限或者質量保證期短於法律、行政法規規定期限的，應當以法律、行政法規規定的期限為準。故 A、B不選。 本題中，外觀瑕疵異議期間按照當事人的約定(1周)，隱蔽瑕疵異議期間則按照合理期間(1個月)。故乙在第三周時，可對隱蔽瑕疵提出異議，而不得對外觀瑕疵提出異議，故C不選，D選。"}, {"id": "卷二-87", "subject": "卷二", "type": "多選題", "question": "孤寡老人甲欲出賣自己的房屋，因出賣房屋後無處居住，遂與購買人乙約定，以甲的生命為期限在房屋上設立居住權，在辦理房屋過戶登記手續時一併辦理居住權登記，後在辦理房屋過戶登記手續時，因故未辦理居住權登記。甲事後找乙要求繼續辦理居住權登記，乙拒絕。對此，下列說法正確的有？（　）", "options": [{"key": "A", "text": "甲有權要求乙配合繼續辦理居住權登記"}, {"key": "B", "text": "甲有權要求乙承擔遲延履行的違約責任"}, {"key": "C", "text": "甲主張的居住權具有債權效力"}, {"key": "D", "text": "居住權作為物權沒有有效設立"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】《民法典》第577條規定：“當事人一方不履行合同義務或者履行合同義務不符合約定的，應當承擔繼續履行、採取補救措施或者賠償損失等違約責任。”本題中，甲與乙約定以甲的生命為期限在房屋上設立居住權，並在辦理房屋過戶登記手續時一併辦理居住權登記，當事人雙方意思表示真實且其約定未違反法律規定及公序良俗，該約定對甲乙雙方具有法律拘束力，但是乙違反了約定未按時辦理居住權登記，構成遲延履行。因此，根據《民法典》第577條，甲有權請求乙繼續履行，即配合乙繼續辦理居住權登記，並於承擔遲延履行的違約責任。因此，選項A、B正確。 35 《民法典》第366條規定：“居住權人有權按照合同約定，對他人的住宅享有占有、使用的用益物權，以滿足生活居住的需要。”居住權指的是權利人以自己的生活需求為限，在他人房屋上進行居住的權利。居住權是民事權利，是用益物權的一種，其特徵是：（1）居住權的基本屬性是他物權，具有用益性；（2）居住權是為特定自然人基於生活用房而設立的物權，具有人身性；（3）居住權是一種長期存在的物權，具有獨立性 ；（4）居住權具有不可轉讓性。居住權人對住宅享有的是用益物權，而非債權。因此，選項C錯誤。 選項D考查居住權的設立條件。《民法典》第368條規定：''居住權無償設立，但是當事人另有約定的除外。 設立居住權的，應當向登記機構申請居住權登記。居住權自登記時設立。”該條規定居住權在登記時設立。 而本題中，甲欲設立居住權但並未進行居住權登記，因此居住權並未有效設立。因此，選項D正確。"}, {"id": "卷二-88", "subject": "卷二", "type": "多選題", "question": "甲公司給乙公司借款500萬元，張三作為連帶保證人，後乙公司經甲公司同意，將200萬元債務轉讓給丙公司，後甲公司通知了張三，張三口頭同意，後乙公司破產無法償還甲公司欠款，丙公司也未償還200萬元，以下說法正確的有？（　）", "options": [{"key": "A", "text": "張三因債務承擔保證責任發生變化"}, {"key": "B", "text": "張三應承擔500萬元的保證責任"}, {"key": "C", "text": "張三隻承擔300萬元的保證責任"}, {"key": "D", "text": "甲公司應徵得張三的書面同意"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】《民法典》第697條規定：“債權人未經保證人書面同意，允許債務人轉移全部或者部分債務 ，保證人對未經其同意轉移的債務不再承擔保證責任，但是債權人和保證人另有約定的除外。第三人加入債務的，保證人的保證責任不受影響。”可知，債務承擔中，保證人繼續承擔原保證責任的條件是：（1）債權人徵得保證人的書面同意；（2）債權人和保證人另有約定，此時則無需保證人書面同意。 本題中乙公司向甲公司借款500萬元，張三為連帶保證人，後來乙公司經甲公司同意將200萬元的債務轉讓給丙公司。對於該債務承擔，甲公司通知了張三，張三僅口頭同意，且甲公司和張三之間並沒有關於張三承擔保證責任的特別約定，因此根據前述法條，張三的保證責任發生了變化，即對轉移的200萬元債務不再承擔保證責任，僅需對剩下的未轉移的300萬元的債務承擔保證責任。因此選項B錯誤，選項A、C、D正確。"}, {"id": "卷二-89", "subject": "卷二", "type": "多選題", "question": "王某妻子早亡，其獨自撫養兒子王勇和女兒王芳。王勇在與張萍結婚3年後去世，兩人並未育有子女。王勇去世後，張萍將王某視為親父，盡心贍養；而王芳因父親小時偏心王勇，拒絕贍養王某。後王某突發疾病而死，對於王某遺產的處理和分割，下列選項正確的是？（　）", "options": [{"key": "A", "text": "應適當分配給張萍少量遺產"}, {"key": "B", "text": "應由張萍和王芳平分王某的遺產"}, {"key": "C", "text": "張萍應作為第一順序繼承人繼承王某的遺產"}, {"key": "D", "text": "可以將全部遺產留給張萍"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】《民法典》第1129條規定，喪偶兒媳對公婆，喪偶女婿對岳父母，盡了主要贍養義務的，作為第一順序繼承人。張萍作為喪偶兒媳，對公公王某盡心贍養，應作為第一順序繼承人繼承遺產，故選項A錯誤 ，C正確。 《民法典》第1130條第4款規定，有扶養能力和有扶養條件的繼承人，不盡扶養義務的，分配遺產時，應當不分或者少分。王芳作為王某的女兒，不盡扶養義務，應當少分或者不分遺產，故選項B錯誤，D正確。 綜上，本題正確答案為CD。"}, {"id": "卷二-90", "subject": "卷二", "type": "多選題", "question": "家住北京市海淀區的梁某想養隻犬，為了自己以及他人的方便與安全，梁某向李律師咨詢了有關飼養動物的相關問題。對於李律師給出的下列答覆，下列選項中符合法律規定的有？", "options": [{"key": "A", "text": "根據《北京市養犬管理規定》，海淀區禁止飼養藏獒，所以當你飼養的藏獒給他人造成損害時，你沒有任何的免責事由"}, {"key": "B", "text": "即使你將自己飼養的犬遺棄，你也應當承擔該犬在遺棄期間給他人造成的損失專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 36"}, {"key": "C", "text": "若因第三人挑逗而使你養的犬給他人造成損害，則受害人依然有權請求你來承擔賠償責任"}, {"key": "D", "text": "若因受害人的一般過失而致你所養的犬將其咬傷，則你可以主張減輕你應承擔的賠償責任"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】《民法典》第1247條：“禁止飼養的烈性犬等危險動物造成他人損害的，動物飼養人或者管理人應當承擔侵權責任。”據此可知，飼養禁止飼養的烈性犬侵權的，采絕對的無過錯責任，也就是說動物飼養人、管理人沒有任何的免責事由。因此，A項於法有據，當選。 《民法典》第1249條：“遺棄、逃逸的動物在遺棄、逃逸期間造成他人損害的，由原動物飼養人或者管理人承擔侵權責任。”據此可知，飼養的動物在遺棄期間侵權的，原飼養人仍然應當承擔侵權責任。因此，B項於法有據，當選。 《民法典》第1250條：“因第三人的過錯致使動物造成他人損害的，被侵權人可以向動物飼養人或者管理人請求賠償，也可以向第三人請求賠償。動物飼養人或者管理人賠償後，有權向第三人追償。”據此可知，因第三人原因導致動物侵權的，受害人可以選擇向飼養人或第三人主張權利。因此，C項於法有據，當選。 《民法典》第1245條：“飼養的動物造成他人損害的，動物飼養人或者管理人應當承擔侵權責任，但能夠證明損害是因被侵權人故意或者重大過失造成的，可以不承擔或者減輕責任。”據此可知，動物侵權的免責事由是受害人故意，減輕責任的事由只能是重大過失，一般過失不是減輕責任的事由。因此，D項於法無據，不當選。 綜上所述，本題選ABC。"}, {"id": "卷二-91", "subject": "卷二", "type": "多選題", "question": "2005年1月，耿男與馬女登記結婚，雙方未書面約定婚後所得財產的歸屬。2007年4月，雙方育有一子耿直 。後耿男經常毆打耿直，給耿直的身心造成了嚴重傷害。耿男也經常毆打馬女，致使馬女離家出走。正在公安機關在調查耿直被毆打一事時。耿男也離家出走。因父母均出走，居委會將耿直送至未成年人社會保護中心。現未成年人社會保護中心向法院起訴要求撤銷耿男、馬女的監護資格。關於本案，下列哪些選項是不正確的？", "options": [{"key": "A", "text": "如婚後馬女為撫育孩子付出較多義務，則馬女在離婚時有權向耿男主張經濟補償請求權"}, {"key": "B", "text": "馬女在離婚時有權向耿男主張損害賠償請求權"}, {"key": "C", "text": "若馬女被宣告死亡，則其與耿男的婚姻關係不可能再恢復"}, {"key": "D", "text": "未成年人社會保護中心無權申請撤銷耿男、馬女的監護資格"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】《民法典》第1088條規定：“夫妻一方因撫育子女、照料老年人、協助另一方工作等負擔較多義務的，離婚時有權向另一方請求補償，另一方應當給予補償。具體辦法由雙方協議；協議不成的，由人民法院判決。”據此可知一方為家庭付出較多義務。馬女在離婚時有權向耿男主張經濟補償請求權。因此，A項正確，不當選。 根據《民法典》第1091條規定，有下列情形之一，導致離婚的，無過錯方有權請求損害賠償：（一）重婚 ；（二）與他人同居；（三）實施家庭暴力；（四）虐待、遺棄家庭成員；（五）有其他重大過錯。本案中 ，耿男經常毆打馬女，已構成家庭暴力，故馬女在離婚時有權向耿男主張損害賠償請求權。因此，B項正確 ，不當選。 《民法典》第51條規定：“被宣告死亡的人的婚姻關係，自死亡宣告之日起消滅。死亡宣告被撤銷的，婚姻關係自撤銷死亡宣告之日起自行恢復，但是其配偶再婚或者向婚姻登記機關書面聲明不願意恢復的除外。 ”據此可知，一旦死亡宣告被撤銷，婚姻關係即自行恢復，除非配偶再婚或向婚姻登記機關(而非人民法院 )“書面”聲明不願意恢復。因此，C項馬女與耿男的婚姻關係“不可能”再恢復的表述過於絕對，是不正確的，當選。 根據《民法典》第36條第2款的規定，有權申請撤銷監護資格的個人和組織包括其他依法具有監護資格的人 ，居民委員會(居)、村民委員會、學校、醫療機構、婦女聯合會、殘疾人聯合會、未成年人保護組織、依法設立的老年人組織、民政部門等。本案中，未成年人社會保護中心作為未成年人保護組織，當然有權申請撤銷耿男、馬女的監護資格。因此，D項不正確，當選。 37"}, {"id": "卷二-92", "subject": "卷二", "type": "多選題", "question": "根據有關司法解釋，下列哪些證據不能單獨作為認定案件事實根據？", "options": [{"key": "A", "text": "周強(12歲)向法院提供的關於其受到傷害的證言"}, {"key": "B", "text": "吳雷出具的證明其妻子鄭媛借出5000元現金給王丹的證言"}, {"key": "C", "text": "原件已經遺失的木材購銷合同複印件"}, {"key": "D", "text": "馮軍由於怕被告報復而不出庭，向法院提交的書面證言"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】《最高人民法院關於民事訴訟證據的若干規定》（2019年修正）第90條規定，下列證據不能單獨作為認定案件事實的根據：（一）當事人的陳述；（二）無民事行為能力人或者限制民事行為能力人所作的與其年齡、智力狀況或者精神健康狀況不相當的證言；（三）與一方當事人或者其代理人有利害關係的證人陳述的證言；（四）存有疑點的視聽資料、電子數據；（五）無法與原件、原物核對的複印件、複製品。 A項屬於當事人陳述，不可以單獨作為認定案件事實的依據。 B項屬於與一方當事人或者其代理人有利害關係的證人出具的證言；C項屬於無法與原件、原物核對的複印件 、複製品；都不能單獨作為認定案件事實的依據。 D項屬於無正當理由未出庭的證人以書面等方式提供的證言，不得作為認定案件事實的根據。"}, {"id": "卷二-93", "subject": "卷二", "type": "多選題", "question": "住所在甲區的王某將位於乙區的住房租賃給住所在丙區的李某，雙方約定，如合同履行發生糾紛，應向丁區法院起訴。後因李某拖欠房租，王某向丙區法院起訴。李某就拖欠房租向丙區法院提交了答辯狀。丙區法院審理後判決李某敗訴。李某不服，以一審法院無管轄權為由提起上訴。關於本案，下列哪些說法是錯誤的 ？（　）", "options": [{"key": "A", "text": "基於雙方的約定，本案應由丁區法院管轄"}, {"key": "B", "text": "李某提交答辯狀，丙區法院獲得管轄權"}, {"key": "C", "text": "二審法院應裁定撤銷一審判決，將案件發回丙區法院重審"}, {"key": "D", "text": "二審法院應裁定撤銷一審判決，將案件移送丁區法院審理"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】A選項，《民事訴訟法解釋》第28條第2款規定，農村土地承包經營合同糾紛、房屋租賃合同糾紛、建設工程施工合同糾紛、政策性房屋買賣合同糾紛，按照不動產糾紛確定管轄。本案屬於房屋租賃合同糾紛，應由不動產所在地乙區法院專屬管轄。又根據《民事訴訟法》第35條規定，協議管轄不得違反本法對級別管轄和專屬管轄的規定。據此，因本案適用專屬管轄的規定，雙方約定由丁區法院管轄無效。A選項說法錯誤，當選。 B選項，《民事訴訟法》第130條第2款規定，當事人未提出管轄異議，並應訴答辯的，視為受訴人民法院有管轄權，但違反級別管轄和專屬管轄規定的除外。據此，本案屬於專屬管轄，不適用應訴管轄制度。李某雖提交了答辯狀，丙區法院並未獲得管轄權。B選項說法錯誤，當選。 C選項和D選項，《民事訴訟法解釋》第329條規定，人民法院依照第二審程序審理案件，認為第一審人民法院受理案件違反專屬管轄規定的，應當裁定撤銷原裁判並移送有管轄權的人民法院。本案有管轄權的法院是乙區法院，二審法院撤銷原判後應當將案件移送乙區法院。C、D選項說法均錯誤，均當選。"}, {"id": "卷二-94", "subject": "卷二", "type": "多選題", "question": "某化工廠向法院起訴，請求某紡織廠支付所拖欠的貨款本息共計53萬元。在訴訟過程中，紡織廠反訴，要求化工廠賠償由於所提供原料質量低劣造成的損失30萬元。根據本案情況，下列選項中，法院的做法正確的有：", "options": [{"key": "A", "text": "化工廠在庭審中未經法庭許可中途退庭，法院對本訴按撤訴處理，對反訴缺席判決"}, {"key": "B", "text": "紡織廠經傳票傳喚，無正當理由拒不到庭，法院對反訴缺席判決，對本訴按撤訴處理"}, {"key": "C", "text": "化工廠經傳票傳喚，無正當理由拒不到庭，法院對本訴和反訴一併缺席判決"}, {"key": "D", "text": "紡織廠在庭審中未經法庭許可中途退庭，法院對本訴缺席判決，對反訴按撤訴處理"}], "answer": ["A", "D"], "explanation_full": "38 到庭的，或者未經法庭許可中途退庭的，可以缺席判決。依此可知，只有在AD兩項中法院的做法是正確的。"}, {"id": "卷二-95", "subject": "卷二", "type": "多選題", "question": "甲公司向乙公司購買一批辦公用品，為了支付貨款向乙公司簽發一張銀行承兌匯票，乙公司將其背書轉讓給丙公司，丙公司背書轉讓給丁公司，同時張三作為票據保證人簽章。在票據流轉過程中，各方當事人曾附加過不同的記載內容，下列有關說法正確的是：", "options": [{"key": "A", "text": "如果甲公司記載“當乙公司按合同約定交付合格貨物時，付款”，則此票據無效"}, {"key": "B", "text": "如果乙公司記載“\"當丙公司按合同約定交付合格貨物時，付款”，則此票據無效"}, {"key": "C", "text": "如果乙公司記載“不得轉讓”，則丙公司向丁公司的背書轉讓行為無效"}, {"key": "D", "text": "如果張三記載“當票據到期丙無法承擔付款責任時，付款”，丁公司依然可以向張三主張連帶付款責任"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】《票據法》第22條規定了匯票必須記載的事項，“無條件支付的委託”是匯票必須記載的事項 ，如果甲公司出票時附有條件，相當於缺失此項絕對必要記載事項，導致票據無效。A項正確。 《票據法》第33條第1款：“背書不得附有條件。背書時附有條件的，所附條件不具有匯票上的效力。”所以 B項中背書人乙公司記載的條件沒有法律效力，但不影響票據效力，也不影響背書效力，B項錯誤。 《票據法》第34條：“背書人在匯票上記載‘不得轉讓’字樣，其後手再背書轉讓的，原背書人對後手的被背書人不承擔保證責任。”所以背書人記載“不得轉讓”的，後手的背書行為是生效的，只是產生“誰寫保護誰”的法律效力，即記載“不得轉讓”的背書人，不對間接後手負責，也即不被間接後手追索。所以C項錯誤。 《票據法》第48條：“保證不得附有條件；附有條件的。不影響對匯票的保證責任。”所以保證人張三記載條件，沒有法律意義，不影響票據本身的效力，也不影響保證行為本身的效力，保證人需承擔對後手權利人的連帶付款責任，D項正確。"}, {"id": "卷二-96", "subject": "卷二", "type": "多選題", "question": "甲公司因不能清償到期債務且明顯缺乏清償能力，於2019年3月被法院受理了破產申請。在破產受理前 ，甲公司與乙公司簽署合同購買一批原材料，乙公司已經將貨物發運。2018年11月甲公司清償了丙公司一筆貨款500萬。針對這兩合同的下列說法中哪些是合法的？", "options": [{"key": "A", "text": "如果乙公司的貨尚在運輸途中，且甲公司未支付貨款，管理人有權要求乙公司交付該批貨物"}, {"key": "B", "text": "如果乙公司未主張取回貨物，待貨物運抵甲公司後，乙公司就其價款有權向管理人申報破產債權"}, {"key": "C", "text": "如果甲公司清償的丙公司貨款已經到期，則管理人不得主張撤銷"}, {"key": "D", "text": "如果丙公司對甲公司的貨款由甲公司的一棟價值800萬的辦公樓作為抵押，則管理人不得主張撤銷"}], "answer": ["B", "D"], "explanation_full": "【羿文解析】根據《企業破產法》第39條的規定：“人民法院受理破產申請時，出賣人已將買賣標的物向作為買受人的債務人發運，債務人尚未收到且未付清全部價款的，出賣人可以取回在運途中的標的物。但是 ，管理人可以支付全部價款，請求出賣人交付標的物。”甲公司購買的乙公司的貨物尚在運輸途中且甲公司未付貨款時，甲公司被受理破產，此時該貨物的所有權被保留給賣方乙公司，乙公司可以行使取回權，故管理人無權在未付款時要求乙公司交付貨物，A項錯誤。如果乙公司未在規定的條件下行使取回權，貨物運抵甲公司後，所有權轉移至甲公司成為甲公司的債務人財產，乙公司的貨款得以申報破產債權，B項正確。 《企業破產法》第32條：“人民法院受理破產申請前六個月內，債務人有本法第二條第一款規定的情形，仍對個別債權人進行清償的，管理人有權請求人民法院予以撤銷。但是，個別清償使債務人財產受益的除外。 ”如果丙的貨款已經到期，但甲公司對其清償當時甲公司已經具備了破產原因，且清償時間在破產受理前6個月內也是可以撤銷的，C項完全未考慮此情形，錯誤。 《破產法司法解釋二》第14條：“債務人對以自有財產設定擔保物權的債權進行的個別清償，管理人依據企業破產法第三十二條的規定請求撤銷的，人民法院不予支持。但是，債務清償時擔保財產的價值低於債權額的除外。”甲公司用自有的辦公樓為丙公司的貨款設定了抵押，丙公司的債權有擔保，且擔保物的價值高於債權額，丙公司是全額的優先受償權人，所以在擔保債權範圍內的財產，不會成為供其他債權人受償的財產 ，債務人的清償行為也不侵害其他債權人的利益。D項符合此條規定的撤銷權行使的例外情形，管理人不得主張撤銷，D項正確。 39"}, {"id": "卷二-97", "subject": "卷二", "type": "多選題", "question": "A公司股東決定解散公司，組成清算組進行清算，在規定的債權申報期限內，債權人汪某因為人在國外沒能及時了解情況並申報債權，就汪某的債權，下列表述正確的是：", "options": [{"key": "A", "text": "汪某不能再申報債權"}, {"key": "B", "text": "汪某可以在公司財產分配完畢之前申報債權"}, {"key": "C", "text": "公司未分配財產不能償還汪某所有債權的，汪某可以要求其他股東以其在剩餘財產分配中已經取得的財產清償"}, {"key": "D", "text": "如果公司未分配財產和股東在剩餘財產分配中已經取得的財產，不能全額清償汪某的債權，汪某可以申請"}, {"key": "A", "text": "公司破產"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】《公司法司法解釋二》第14條：“債權人補充申報的債權，可以在公司尚未分配財產中依法清償。公司尚未分配財產不能全額清償，債權人主張股東以其在剩餘財產分配中已經取得的財產予以清償的 ，人民法院應予支持：但債權人因重大過錯未在規定期限內申報債權的除外。債權人或者清算組，以公司尚未分配財產和股東在剩餘財產分配中已經取得的財產，不能全額清償補充申報的債權為由，向人民法院提出破產清算申請的，人民法院不予受理。” 在公司清算的過程中，債權人可以在財產最終分配完畢之前補充申報，並可以就尚未分配的財產及其他股東在剩餘財產分配中已經取得的財產要求清償，這也是《公司法》對債權的保護力度高於股權的體現之一。但是如果尚未分配的財產及其他股東在剩餘財產中已經取得的財產仍不能滿足債權額的.不能損害其他債權人的利益，補充申報的債權人不能因此申請公司破產，所以只有B、C項正確。"}, {"id": "卷二-98", "subject": "卷二", "type": "多選題", "question": "我國西部地區一M縣為招商引資，將沿海地區淘汰的高污染化工企業引入本縣.化工企業排出的污水中重金屬超標造成所在地土地污染，當地村民食用從該土地產出的茶葉和農產品後出現集體中毒事件，造成嚴重後果。在發生該重大環境污染事件後，M縣政府及生態環境主管部門所應承擔的責任正確的是？（　）", "options": [{"key": "A", "text": "M縣政府應當及時向縣人大常委會報告該事件"}, {"key": "B", "text": "M縣政府應當及時向縣政協報告該事件"}, {"key": "C", "text": "如果M縣生態環境主管部門違法批准化工廠排污，應當追究直接責任人員的責任"}, {"key": "D", "text": "M縣生態環境主管部門依法應當作出責令停業、關閉的決定而未作出的，M縣生態環境主管部門相關負責人應當引咎辭職"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】根據《環境保護法》第27條規定，縣級以上人民政府應當每年向本級人民代表大會或者人民代表大會常務委員會報告環境狀況和環境保護目標完成情況，對發生的重大環境事件應當及時向本級人民代表大會常務委員會報告，依法接受監督。因此，重大環境事件應當向本級人大常委會而非政協報告，故A選項正確，B選項錯誤。 根據《環境保護法》第68條規定，地方各級人民政府、縣級以上人民政府環境保護主管部門和其他負有環境保護監督管理職責的部門有違法行為的。對直接負責的主管人員和其他直接責任人員給予記過、記大過或者降級處分；造成嚴重後果的，給予撤職或者開除處分，其主要負責人應當引咎辭職。因此，在政府和環保部門有環境違法行為的情況下，主要負責人才應當引咎辭職，故CD選項正確。 本題答案為ACD。"}, {"id": "卷二-99", "subject": "卷二", "type": "多選題", "question": "甲、乙2人在某廠同一車間工作，某日上班時因甲不規範操作致乙右臂受傷致殘。該廠已參加工傷保險 ，且乙受傷被認定為工傷。關於該事件的處理，下列哪些選項是正確的？（　）", "options": [{"key": "A", "text": "乙住院治療期間的夥食補助費由工傷保險基金支付"}, {"key": "B", "text": "若乙拒不接受勞動能力鑒定，則停止享受工傷保險待遇"}, {"key": "C", "text": "乙的醫療費用在甲賠償之後，還可得到工傷保險基金的支付"}, {"key": "D", "text": "如乙不能從事原工作，也不能從事該廠另行安排的工作，該廠仍不能解除與乙的勞動合同 40"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】《社會保險法》第38條規定：“因工傷發生的下列費用，按照國家規定從工傷保險基金中支付 ……(二)住院夥食補助費……”A選項正確，當選。 《社會保險法》第43條規定：“工傷職工有下列情形之一的，停止享受工傷保險待遇……(二)拒不接受勞動能力鑒定的……”B選項正確，當選。 《社會保險法》第42條規定：“由於第三人的原因造成工傷，第三人不支付工傷醫療費用或者無法確定第三人的，由工傷保險基金先行支付。工傷保險基金先行支付後，有權向第三人追償。”由此可知，醫療費用不能在人身損害賠償和工傷保險待遇中兼得。C選項錯誤，不當選。 《勞動合同法》第40條規定：“有下列情形之一的，用人單位提前30日以書面形式通知勞動者本人或者額外支付勞動者一個月工資後，可以解除勞動合同：(一)勞動者患病或者非因工負傷，在規定的醫療期滿後不能從事原工作，也不能從事由用人單位另行安排的工作的……”單獨從本條規定，用人單位可解除勞動合同 ，但是，《勞動合同法》第42條規定：“勞動者有下列情形之一的，用人單位不得依照本法第四十條、第四十一條的規定解除勞動合同……(二)在本單位患職業病或者因工負傷並被確認喪失或者部分喪失勞動能力的 ……”題乾中已告知乙受傷致殘，肯定屬於喪失或部分喪失勞動能力，所以用人單位不得以第40條規定的解除事由來解除勞動合同。D選項正確，當選。"}, {"id": "卷二-100", "subject": "卷二", "type": "多選題", "question": "關於以死亡為給付保險金條件的合同，下列說法正確的是？（　）", "options": [{"key": "A", "text": "被保險人同意並認可保險金額只能採取書面形式"}, {"key": "B", "text": "被保險人同意並認可保險金額可以在合同訂立時作出，也可以在合同訂立後追認"}, {"key": "C", "text": "被保險人明知他人代其簽名同意而未表示異議的，應認定為被保險人同意投保人為其訂立保險合同並認可保險金額"}, {"key": "D", "text": "被保險人同意投保人指定的受益人的，應認定為被保險人同意投保人為其訂立保險合同並認可保險金額"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】《保險法解釋(三)》第1條規定：“當事人訂立以死亡為給付保險金條件的合同，根據保險法第三十四條的規定，‘被保險人同意並認可保險金額’可以採取書面形式、口頭形式或者其他形式；可以在合同訂立時作出，也可以在合同訂立後追認。有下列情形之一的，應認定為被保險人同意投保人為其訂立保險合同並認可保險金額：(一)被保險人明知他人代其簽名同意而未表示異議的；(二)被保險人同意投保人指定的受益人的；(三)有證據足以認定被保險人同意投保人為其投保的其他情形。”A選項錯誤，B、C、D選項正確。 41"}];
let current=-1,totalAnswered=0,correctCount=0;
function updateStats(){
 const withAns=questions.filter(q=>Array.isArray(q.answer)&&q.answer.length>0).length;
 document.getElementById("stats").textContent=`題庫總數：${questions.length}｜有答案：${withAns}｜已答：${totalAnswered}｜正確：${correctCount}`;
}
function nextQuestion(){
 current=Math.floor(Math.random()*questions.length);
 const q=questions[current];
 let html="<div><b>("+q.type+")</b> "+q.question+"</div>";
 html+="<div class='options'>";
 for(const opt of q.options){
  html+=`<label class='option'><input type='checkbox' name='opt' value='${opt.key}'> <b>${opt.key}.</b> ${opt.text}</label>`;
 }
 html+="</div><div id='result'></div><div id='expl' class='expl'><b>解析：</b>"+(q.explanation_full||"")+"</div>";
 document.getElementById("quiz").innerHTML=html;updateStats();
}
document.getElementById("submit").onclick=()=>{
 if(current<0)return;
 const ans=questions[current].answer||[];
 const picked=Array.from(document.querySelectorAll("input[name=opt]:checked")).map(x=>x.value);
 let res="";
 if(picked.length===0)res="⚠️ 請先選擇答案";
 else if(JSON.stringify(picked.sort())===JSON.stringify(ans.sort())){res="✅ 正確";correctCount++;}
 else res="❌ 錯誤，正確答案："+ans.join(",");
 totalAnswered++;document.getElementById("result").innerHTML=res;
 document.getElementById("expl").style.display="block";updateStats();
};
document.getElementById("next").onclick=()=>nextQuestion();
nextQuestion();
</script></body></html>
