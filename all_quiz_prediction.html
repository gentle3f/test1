"question": "甲在某市A縣實施盜竊被立案偵查，A縣公安機關決定拘留甲.但甲此時已逃至B縣親戚家躲藏起來，A縣公安機關遂赴B縣實施拘留，下列關於拘留的表述，正確的有：（　）", "options": [{"key": "A", "text": "A縣公安機關抓獲甲後，必須立即將甲送A縣看守所羈押"}, {"key": "B", "text": "A縣公安機關拘留甲後。經過審查認為需要逮捕的，應當在拘留後的3日以內，提請A縣人民檢察院審查批准 。在特殊情況下，經A縣公安機關負責人批准.提請審查批准逮捕的時間可以延長至拘留後7日"}, {"key": "C", "text": "在B中，由於A縣公安機關跨縣追捕甲，甲應當屬於流竄作案的重大嫌疑分子，經A縣公安機關負責人批准 34"}, {"key": "D", "text": "在B中，如果A縣公安機關發現甲盜竊時還有乙進行協助，經A縣公安機關負責人批准，提請審查批准逮捕甲的時間可以延長至30日"}], "answer": ["B", "D"], "explanation_full": "【羿文解析】一般來說，拘留後，應當立即將被拘留人送看守所羈押，至遲不得超過24小時。但如果是在異地執行拘留的，有可能無法及時將犯罪嫌疑人押解回管轄地，此時應當在宣布拘留後立即將其送抓獲地看守所羈押，至遲不得超過24小時。待到達管轄地後，應當立即將犯罪嫌疑人送看守所羈押。A項中，甲在A縣盜竊後逃至B縣，A縣公安赴B縣拘留屬於異地執行拘留，若無法及時回到A縣，A縣公安應當在24小時內將甲送 B縣看守所。A項說必須立即將甲送A縣看守所羈押是錯誤的。 對於公安機關偵查的案件，拘留一般為3日，特殊情況下，提請審查批准逮捕的時間可以延長至7日。如果犯罪嫌疑人實施的犯罪行為涉嫌流竄作案、多次作案、結夥作案，提請審查批准逮捕的時間可以延長至30日。 這裡所說的“流竄作案”，是指跨市、縣管轄範圍連續作案，或者在居住地作案後逃跑到外市、縣繼續作案 ；“多次作案”，是指3次以上作案；“結夥作案”，是指2人以上共同作案。可見，B項說拘留可以由3天延長至7天，正確。 對於流竄作案的，拘留時間確實可以達到30日。但流竄作案不僅需要跨市、縣，還要連續作案才行，本案甲只是赴B縣親戚家躲藏，並沒有連續作案，不屬於流竄作案，拘留時間自然不可以延長至30日，C錯誤。 發現乙協助甲盜竊，意味著本案屬於有2人以上的結夥作案，拘留時間可以延長至30日，D正確。"}, {"id": "卷一-79", "subject": "卷一", "type": "多選題", "question": "甲乙因共同搶劫被某市中級法院分別判處無期徒刑和10年有期徒刑，甲乙服判，某市檢察院認為對甲的量刑畸輕提出抗訴，甲委託了辯護律師丙。下列表述正確的有：（　）", "options": [{"key": "A", "text": "對於某市檢察院的抗訴，某省高級法院應當製作二審決定書"}, {"key": "B", "text": "某省高級法院二審，適用第一審程序進行審理"}, {"key": "C", "text": "某省高級法院二審，某省檢察院應當派員出庭"}, {"key": "D", "text": "某省高級法院二審，檢察院向法庭提交新證據的，某省高級法院應當及時通知丙查閱、摘抄或者複製"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】在審判監督程序中，法院決定啟動再審需要製作再審決定書。但在二審程序中，沒有法院製作二審決定書的相關規定，A項錯誤。 與第一審程序相比，第二審程序也需要經過開庭、法庭調查、法庭辯論、被告人最後陳述、評議宣判。但程序並非完全相同，譬如，出席第二審法院的檢察官不是公訴人身份，而是檢察員身份；又如，在第二審法庭調查階段，首先不是由公訴人宣讀起訴書，而是由審判人員宣讀第一審判決書、裁定書。B項說某省高級法院適用第一審程序進行審理過於絕對和片面，錯誤。 某市檢察院提出抗訴，某省高級法院進行二審應當開庭審理，某省檢察院應當派員出席法庭，C項正確。 第二審期間，檢察院提交新證據的，第二審法院應當及時通知辯護人進行閱卷，D項正確。"}, {"id": "卷一-80", "subject": "卷一", "type": "多選題", "question": "下列關於缺席審判程序的表述，正確的是：（　）", "options": [{"key": "A", "text": "被告人羅某患有嚴重疾病無法出庭，海淀區人民法院中止審理超過6個月，羅某同意恢複審理的，本案應當改變管轄，由中級人民法院組成合議庭進行審理"}, {"key": "B", "text": "再審程序中被告人劉某吐血身亡的，人民法院可以缺席審理，依法作出相應判決"}, {"key": "C", "text": "對嚴重危害國家安全犯罪報請核准期間，犯罪嫌疑人鄢某自動投案的，報請核准的人民檢察院應當及時撤回報請，重新審查起訴"}, {"key": "D", "text": "在審理過程中，被告人自動投案或者被抓獲的，人民法院應當重新審判"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】根據《刑事訴訟法》第291條第2款的規定，前款案件，由犯罪地、被告人離境前居住地或者最高人民法院指定的中級人民法院組成合議庭進行審理。注意，該管轄條款，僅適用於潛逃境外的缺席判決案件。本案並不適用該管轄的規定，應當由之前審理的海淀區法院繼續行使管轄權。選項A錯誤。 根據《刑事訴訟法》第297條的規定，被告人死亡的，人民法院應當裁定終止審理，但有證據證明被告人無罪 35 人死亡的，人民法院可以缺席審理，依法作出判決。選項B正確。 根據《高檢規則》第509條第2款的規定，對嚴重危害國家安全犯罪、恐怖活動犯罪案件報請核准期間，犯罪嫌疑人自動投案或者被抓獲的，報請核准的人民檢察院應當及時撤回報請，重新審查案件。選項C正確。 根據《刑事訴訟法》第295條第1款的規定，在審理過程中，被告人自動投案或者被抓獲的，人民法院應當重新審理。選項D正確。"}, {"id": "卷一-81", "subject": "卷一", "type": "多選題", "question": "行政法規簽署公布後，應當及時在哪些載體上刊載？（　）", "options": [{"key": "A", "text": "國務院公報"}, {"key": "B", "text": "中國政府法制信息網"}, {"key": "C", "text": "全國範圍內發行的報紙"}, {"key": "D", "text": "全國人大公報"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】《行政法規制定程序條例》第28條第1款規定：“行政法規簽署公布後，及時在國務院公報和中國政府法制信息網以及在全國範圍內發行的報紙上刊載。國務院法制機構應當及時匯編出版行政法規的國家正式版本。”可見，A、B、C選項正確，全國人大的公報是刊載全國人大重要文件資料的，不用於刊載關於國務院的重要文件資料，D選項錯誤。"}, {"id": "卷一-82", "subject": "卷一", "type": "多選題", "question": "關於具體行政行為，下列哪些說法是正確的？", "options": [{"key": "A", "text": "申請行政復議和提起行政訴訟會導致具體行政行為執行力的停止"}, {"key": "B", "text": "確定力是指具體行政行為不再爭議、不得更改的效力，具體行政行為因此取得不可撤銷性"}, {"key": "C", "text": "對於可撤銷的具體行政行為，當事人無權自行否定其法律效力"}, {"key": "D", "text": "因具體行政行為廢止致使當事人的合法權益受到損失的，應給予賠償"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】申請復議或提起訴訟只是救濟程序的一個啟動，救濟的結果還未確定，所以僅僅申請復議或者提起訴訟原則上不會導致執行力的停止。故A選項錯誤。 確定力是指具體行政行為經過一定期限和程序被最終地、實質性地確定下來，不可再爭議、不得再更改的效力，在形式上具有了不可撤銷性。故B選項正確。 對於可撤銷的具體行政行為，必須經過行政復議、行政訴訟或者行政監督程序由國家有權機關作■撤銷決定 ，否定其法律效力，且該行為在被撤銷前，當事人依然應當履行其內容。故C選項正確。 具體行政行為的廢止，是指因情勢、法律、政策的變化，原合法、適當的行政行為已不符合現行法律、政策 ，或者具體行政行為已完成其原定目標、任務，則由行政主體終止其法律效力，若此種廢止給當事人的合法權益造成了損害，行政主體應對其損失予以適當補償。簡而言之，合法的行政行為依法可以被廢止，造成合法權益損失的進行補償；違法的行政行為依法可以被撤銷，造成合法權益損失的進行賠償，故D選項錯誤。"}, {"id": "卷一-83", "subject": "卷一", "type": "多選題", "question": "下列哪些情形不屬於行政訴訟受案範圍？", "options": [{"key": "A", "text": "甲乙兩村因土地承包經營發生糾紛，協商不成而請求鎮政府調解，甲村對調解結果不服，向法院起訴"}, {"key": "B", "text": "王大錘、王二錘向區生態環境局申請許可，該局經過市局批准後，向王二錘作出許可決定，王大錘對該許可決定不服，向法院起訴"}, {"key": "C", "text": "某市場監督管理局因陳某擅自設立互聯網上網服務營業場所，扣押其從事違法經營活動的電腦15台，陳某對扣押不服，提起行政訴訟"}, {"key": "D", "text": "市政府對區政府的房屋征收與補償工作開展監督，王三錘對該監督行為不服，向法院起訴，法院應當受理"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】行政調解不具有強制性，是事實行為，不屬於行政訴訟受案範圍。 行政許可是具體行政行為，王大錘是“競爭權人型”行政相關人，可以提起行政訴訟。故B選項屬於受案範圍 。 36 質性影響的具體行政行為。當事人對行為不服的，有權申請復議或提起訴訟。依據《行政強制法》第2條第 2款規定：“行政強制措施，是指行政機關在行政管理過程中，為制止違法行為、防止證據損毀、避免危害發生、控制危險擴大等情形，依法對公民的人身自由實施暫時性限制，或者對公民、法人或者其他組織的財物實施暫時性控制的行為。”可見，扣押雖然是臨時性的行政強制行為，但是其對當事人的財物實施了物理性的控制，剝奪了當事人對財物的占有和使用，屬於對當事人財產權利的實質性損害，是典型的具體行政行為 ，依法屬於行政訴訟的受案範圍。 市政府對區政府工作的監督屬於內部層級監督行為，不可訴，故D選項不屬於受案範圍。"}, {"id": "卷一-84", "subject": "卷一", "type": "多選題", "question": "A市B區政府發布《房屋征收決定公告》，朱某房屋被列入征收範圍。因朱某與征收部門未能達成《征收補償協議》，B區政府作出《房屋征收補償決定書》：決定貨幣補償60萬元，朱某在接到決定之日起7日內搬遷完畢。朱某向A市政府申請復議，市政府以復議申請不符合受理條件為由駁回其申請。朱某遂以B區政府和A市政府為被告，向法院提起行政訴訟。對此，下列哪些說法是不正確的？（　）", "options": [{"key": "A", "text": "如朱某與B區政府達成《房屋征收補償協議》而不履行，後者可申請法院強制執行"}, {"key": "B", "text": "法院應當通知朱某更換被告"}, {"key": "C", "text": "A市政府有義務證明《房屋征收補償決定書》的合法性"}, {"key": "D", "text": "如A市政府負責人不能出庭，可委託區政府的工作人員出庭"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】《關於審理行政協議案件若干問題的規定》第24條規定：“公民、法人或者其他組織未按照行政協議約定履行義務，經催告後不履行，行政機關可以作出要求其履行協議的書面決定。公民、法人或者其他組織收到書面決定後在法定期限內未申請行政復議或者提起行政訴訟，且仍不履行，協議內容具有可執行性的，行政機關可以向人民法院申請強制執行。法律、行政法規規定行政機關對行政協議享有監督協議履行的職權，公民、法人或者其他組織未按照約定履行義務，經催告後不履行，行政機關可以依法作出處理決定 。公民、法人或者其他組織在收到該處理決定後在法定期限內未申請行政復議或者提起行政訴訟，且仍不履行，協議內容具有可執行性的，行政機關可以向人民法院申請強制執行。”根據上述規定可知，當行政協議的相對人一方不履行協議義務時，行政機關先要依法作出履行決定或者處理決定，然後才能以上述決定為根據，向法院申請強制執行，而不能直接以協議為根據，申請法院強制執行。據此，A選項錯誤。 《行訴法解釋》第133條規定：“行政訴訟法第二十六條第二款規定的’復議機關決定維持原行政行為，包括復議機關駁回覆議申請或者復議請求的情形，但以復議申請不符合受理條件為由駁回的除外。”根據該條規定，如果復議機關是以復議申請不符合受理條件為由駁回覆議申請的，屬於該機關獨立作出的行政行為。如果申請人不服該決定，應當以復議機關單獨作為被告。本題屬於此種情況，被告應當為市政府，受訴法院應當通知朱某更換被告，B選項正確。 鑒於本案的審理對象是市政府作出的不予受理決定的合法性，A市政府的舉證責任限於其不予受理決定的合法性，因此C選項的錯誤。 《關於行政機關負責人出庭應訴若干問題的規定》第10條第1、2款規定：“行政訴訟法第三條第三款規定的相應的工作人員，是指被訴行政機關中具體行使行政職權的工作人員。行政機關委託行使行政職權的組織或者下級行政機關的工作人員，可以視為行政機關相應的工作人員。”據此，D選項正確。"}, {"id": "卷一-85", "subject": "卷一", "type": "多選題", "question": "陳某系個體工商戶嘉華加工廠（營業執照上登記的經營者）的業主。區環保局對嘉華加工廠的廠房進行執法檢查時，發現該廠涉嫌私自設置暗管偷排污水。區環保局經立案調查後，作出行政處理決定，認定陳某的行為違反《水污染防治法》第22條的規定，遂根據《水污染防治法》第75條第2款的規定，作出責令立即拆除暗管，並處罰款10萬元的處理決定。陳某認為，區環境監測站出具的《檢測報告》顯示：嘉華加工廠排放的廢水符合排放污水的相關標準。陳某向法院提起行政訴訟，請求撤銷行政處理決定並賠償損失。下列說法不正確的是：（　）", "options": [{"key": "A", "text": "陳某為本案原告"}, {"key": "B", "text": "嘉華加工廠排放的廢水是否符合排放污水的相關標準不屬於法院審理對象"}, {"key": "C", "text": "陳某關於以排放的廢水符合排放污水的相關標準不應當被處罰的主張不能成立專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 37"}, {"key": "D", "text": "針對陳某的訴訟請求，法院應當分別立案、合併審理"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】根據《行訴解釋》第15條第2款的規定，個體工商戶向人民法院提起訴訟的，以營業執照上登記的經營者為原告。有字號的，以營業執照上登記的字號為原告，並應當註明該字號經營者的基本信息。本案應當以個體工商戶營業執照上登記的經營者——嘉華加工廠為原告。故A選項錯誤。 根據《行政訴訟法》第6條的規定，人民法院審理行政案件，對行政行為是否合法進行審查。本案中，陳某向法院提起行政訴訟，請求撤銷行政處理決定並賠償損失。法院的審理對象是行政處理決定和損害賠償，嘉華加工廠排放的廢水是否符合排放污水的相關標準，不屬於法院審理對象。故B選項正確。 陳某通過私設暗管等逃避監管的方式排放水污染物的，依法應當予以行政處罰。陳某以其排放的水污染物達標、沒有對環境造成損害為由，不應受到行政處罰的主張不能成立。故C選項正確。 根據《最高人民法院關於審理行政賠償案件若干問題的規定》第28條的規定，當事人在提起行政訴訟的同時一併提出行政賠償請求，或者因具體行政行為和與行使行政職權有關的其他行為侵權造成損害一併提出行政賠償請求的，人民法院應當分別立案，根據具體情況可以合併審理，也可以單獨審理。因此，陳某向法院提起行政訴訟時一併提出賠償請求，法院應當分別立案，根據具體情況可以合併審理，也可以單獨審理。故D選項錯誤。 不定項選擇題"}, {"id": "卷一-86", "subject": "卷一", "type": "單選題", "question": "下列對全面依法治國工作重要環節的說法中，下列選項錯誤的是？（　）", "options": [{"key": "A", "text": "健全法律法規規章起草徵求人大代表意見制度，增加代表列席常委會會議人數"}, {"key": "B", "text": "政府建立所有決策終身責任追究制度及責任倒查機制"}, {"key": "C", "text": "減少多頭執法，減少市縣兩級政府執法隊伍種類"}, {"key": "D", "text": "加強和規範司法解釋和案例指導，統一法律適用標準"}], "answer": ["B"], "explanation_full": "【羿文解析】科學立法、嚴格執法、公正司法和全民守法是全面依法治國工作的重要環節，也是建設法治國家和法治體系的必然要求。健全法律法規規章起草徵求人大代表意見制度，增加代表列席常委會會議人數 ，體現了人大主導立法和民主立法的要求，符合科學立法的基本理念，A選項正確。 法治政府的建設要求貫徹行政責任原則，實現行政活動的權責統一，但這並不意味著政府的所有決策都要適用終身責任追究制度及責任倒查機制，這樣反而會導致責任審查能力的過於分散和喪失重點，終身責任追究制度及責任倒查機制只針對重大行政決策。B選項錯誤。 減少多頭執法，減少市縣兩級政府執法隊伍種類，符合有條件推進綜合執法，實現政府精兵簡政的改革方向 ，體現了法治政府的建設要求。C選項正確。 通過案例指導和司法解釋制度，能夠有效地避免司法適用過程中的不統一現象，符合公正司法的基本理念。 D選項正確。"}, {"id": "卷一-87", "subject": "卷一", "type": "單選題", "question": "關於法的移植與法的繼承，下列說法正確的是？（　）", "options": [{"key": "A", "text": "法的移植的對象是外國的法律，國際法律和慣例不屬於移植對象"}, {"key": "B", "text": "與法律繼承不同，法律移植的主要原因在於社會發展和法的發展的不平衡性"}, {"key": "C", "text": "當前我國對美國訴訟法的吸收不屬於法律移植"}, {"key": "D", "text": "法律繼承的對象，必須侷限於本民族的古代的法律"}], "answer": ["B"], "explanation_full": "【羿文解析】法律移植體現了本國對於國外先進制度的學習，因此移植的對象既包括外國的法律，也包括對國際條約和國際慣例的吸收和轉化，故A選項錯誤。 法律繼承主要體現為傳統的延續，法律移植的主要動力則在於社會和法律發展的不平衡性，落後國家為了擺脫落後的局面，往往就需要學習國外的先進制度。B選項正確。 當前我國對於美國訴訟法的吸收屬於典型的法律移植。C選項錯誤。 38 ，繼承的對象並不侷限於本民族的古代法律，典型如羅馬法復興。D選項錯誤。"}, {"id": "卷一-88", "subject": "卷一", "type": "單選題", "question": "法諺雲“習慣在於自覺遵守，而法律在於強制服從”，關於法律和習慣的說法，下列選項正確的是：（ ）", "options": [{"key": "A", "text": "法律不被施行則不具有實效性"}, {"key": "B", "text": "法律不被遵守則不具有強制力"}, {"key": "C", "text": "習慣不具有強制力"}, {"key": "D", "text": "習慣具有成文性"}], "answer": ["A"], "explanation_full": "【羿文解析】法律的施行等同於法律的實施。法律的實施包括遵行（守法）、執行（執法）或適用（司法 ）。而法律的實效，就是指人們實際上按照法律規定的行為模式去行為，法律被人們實際遵行、執行或適用 。因此沒有被施行的法律自然不具有實效性。A項正確。 任何社會規範都具有強制性，作為一種以國家強制力為後盾，通過法律程序保證實現的社會規範，法律自生效那一刻起就具有強制力。而是否被遵守，都不影響法的強制性。恰恰由於法律的強制性，如果不遵守法律 ，可能會因此承受一定的法律後果。因此B選項錯誤。 任何社會規範都具有強制力，強制力並非法律的獨特屬性，法律的強制力和其他社會規範不同的地方在於 ，法律是以國家強制力為後盾，通過法律程序保證實現的社會規範。因此法律擁有不同於其他社會規範的最強的強制力。習慣作為一種社會規範，和法律一樣都具有強制力。C項錯誤。 成文性是成文法的特徵之一。一個社會規範具有成文性，那麼這個規範就應以規範性條文的形式表述並於生效前公布。習慣是獨立於國家制定法之外，通常都是在一定社會時期和地區，長期而普遍地為人所慣習，從而逐漸形成的具有一定強制性的行為規範，如古羅馬法學家赫爾莫傑尼安所說：“那些由長期習慣確認了的並且被長年遵守的東西，同寫成文字的法一樣，被作為公民間的默認協議。”因此不能說習慣具有成文性。 因此D項錯誤。"}, {"id": "卷一-89", "subject": "卷一", "type": "多選題", "question": "下列關於我國法律職業的說法，哪些選項是正確的？（　）", "options": [{"key": "A", "text": "法學教育研究工作者不屬於我國法律職業的從業人員"}, {"key": "B", "text": "我國法律職業的核心人員是法官、檢察官、律師和法學家"}, {"key": "C", "text": "初次擔任法律顧問應當通過國家統一法律職業資格考試"}, {"key": "D", "text": "法官、檢察官可以不遵守《公務員法》"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】在我國，法律職業主要是指擔任法官、檢察官、律師、公證員、法律顧問、仲裁員(法律類)及政府部門中從事行政處罰決定審核、行政復議、行政裁決的人員，還包括從事法律法規起草的立法工作者、 其他行政執法人員、法學教育研究工作者等。因此，A項錯誤。 法律職業人員是具有共同的政治素養、業務能力、職業倫理和從業資格要求，專門從事立法、執法、司法、 法律服務和法律教育研究等工作的職業群體，其核心人員是法官、檢察官、律師和法學家。因此，B項正確。 初任法官、初任檢察官、申請律師執業和擔任公證員，初次擔任法律顧問和仲裁員(法律類)，以及行政機關中初次從事行政處罰決定審核、行政復議、行政裁決的公務員，應當通過國家統一法律職業資格考試，取得法律職業資格。因此，C項正確。 在法律職業人員中。法官、檢察官和行政機關中初次從事行政處罰決定審核、行政復議、行政裁決和擔任法律顧問的公務員，都要遵守《公務員法》。因此，D項錯誤。"}, {"id": "卷一-90", "subject": "卷一", "type": "單選題", "question": "關於憲法規範的特性，下列選項表述不成立是？", "options": [{"key": "A", "text": "根本性"}, {"key": "B", "text": "原則性"}, {"key": "C", "text": "無制裁性"}, {"key": "D", "text": "相對穩定性專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 39"}], "answer": ["C"], "explanation_full": "【羿文解析】憲法規範是憲法最基本的要素和最基本的構成單位，是由國家制定或認可的、憲法主體參與國家和社會生活最基本社會關係的行為規範。憲法規範與其他法律規範相比，則具有以下五個特點：①根本性 ，即憲法只規定國家生活和社會生活中的根本性問題；②最高性，即憲法規範的地位和效力高於其他法律規範，具有最高法律效力；在整個國家的法律體系中，憲法是母法、基礎法，其他法律都必須以憲法為制定的依據；其他法律規範不能與憲法規範相牴觸，否則無效；③原則性，即憲法規範只規定有關問題的基本原則 ，其文字表述簡明概括;④綱領性，即憲法規範明確表明對未來目標的追求，為未來的發展指明方向；不僅確認統治階級的治國思想和建國方案，而且確認國家的發展目標和宏觀發展思路；⑤穩定性，即憲法規範雖然要隨著社會歷史條件的不斷變化而發展變化，但不能輕易修改，應當保持相對的穩定。因此，A、B、D三項正確。 既然一切機關、組織和公民個人都必須以憲法為根本的活動準則，那麼一切違反憲法的行為，就都必須予以追究。對違憲行為進行追究的方式包括直接制裁和間接制裁兩個方面。直接制裁是指直接根據憲法來追究違憲行為的法律責任，主要適用於國家機關以及國家機關負責人的違憲行為。在我國，直接制裁主要表現為對國家機關違反憲法的法律以及規範性文件、決議、決定和命令等宣布無效，並加以撤銷；對違法失職的國家機關負責人根據憲法規定予以罷免。間接制裁則指憲法對違憲行為不直接規定制裁措施，而是通過具體法律來追究法律責任。也就是說，它是直接根據具體法律，對違反憲法原則同時又違反具體法律的行為作出的制裁。這類制裁相對於具體法律是直接的，而相對於憲法來說則是間接的。因此，C項不成立。"}, {"id": "卷一-91", "subject": "卷一", "type": "單選題", "question": "根據《憲法》和《監察法》，下列說法正確的有（　）", "options": [{"key": "A", "text": "監察委員會依照法律規定獨立行使監察權，不受立法機關、行政機關、社會團體和個人的干涉"}, {"key": "B", "text": "監察機關辦理職務違法和職務犯罪案件，不受審判機關、檢察機關、執法部門制約"}, {"key": "C", "text": "監察機關在工作中需要協助的，有關機關和單位應當根據監察機關的要求依法予以協助"}, {"key": "D", "text": "國家監察委員會副主任、委員，由國家監察委員會主任提名，全國人民代表大會決定"}], "answer": ["C"], "explanation_full": "【羿文解析】監察委員會依照法律規定獨立行使監察權，不受行政機關、社會團體和個人的干涉，但需要受立法機關監督。A項錯誤。 監察機關辦理職務違法和職務犯罪案件，應當與審判機關、檢察機關、執法部門互相配合，互相制約。B項錯誤。 監察機關在工作中需要協助的，有關機關和單位應當根據監察機關的要求依法予以協助。C項正確。 國家監察委員會由主任、副主任若干人、委員若干人組成，主任由全國人民代表大會選舉，副主任、委員由國家監察委員會主任提請全國人民代表大會常務委員會任免。D項錯誤。"}, {"id": "卷一-92", "subject": "卷一", "type": "多選題", "question": "下列說法正確的是：", "options": [{"key": "A", "text": "甲多次盜竊公私財物，數額巨大，被抓獲。甲家族中有精神病史，但其本人精神一直正常。在等待判決期間，甲精神分裂，失去辨認和控制能力。甲犯罪時精神正常，犯罪後失去辨認和控制能力，應當負刑事責任"}, {"key": "B", "text": "乙系間歇性精神病患者，在精神病發作期間，用刀將一陌生人扎成重傷，清醒後精神恢復正常，急送病人到醫院搶救，因搶救無效，被害人死亡。乙應當負刑事責任"}, {"key": "C", "text": "丙某日喝完一瓶高度白酒後，仍駕車行駛，不慎路途中撞死一行人，撞傷二行人。庭審過程中，丙認為自己醉酒後誤事，應當從輕判處刑罰。丙的想法是錯誤的"}, {"key": "D", "text": "丁因受外傷而致啞，但是有正常聽力。29歲時因詐騙罪被逮捕，因為丁是殘疾人，可以對其從輕處罰"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】甲是在精神正常期間實施犯罪行為，完全具有辨認與控制能力，應當負刑事責任。至於其在等待判決期間失去辨認或者控制能力，按照《刑法》規定仍然應當負刑事責任。選項A正確。 乙在實施犯罪行為時，處於精神病發作期，不具有辨認或者控制能力，不應當負刑事責任，B項錯誤。 丙某行為構成交通肇事罪且無法定或酌定的從輕判處情節。故丙某想法錯誤。C項正確。 丁不是《刑法》第19條規定中的“又聾又啞的人”，D項錯誤。 40"}, {"id": "卷一-93", "subject": "卷一", "type": "單選題", "question": "張某是某派出所所長，某日派出所抓獲慣偷嫌疑人阮某，並在其身上搜到手鐲10隻、手錶3隻等財物。阮某親屬找到張某說情並送其8萬元。張某明知阮某系慣犯與累犯，仍為阮某違法辦理取保候審強制措施。後阮某去向不明，致使該案一直未得到處理。關於張某的行為，下列說法錯誤的是", "options": [{"key": "A", "text": "成立受賄罪"}, {"key": "B", "text": "成立徇私枉法罪"}, {"key": "C", "text": "應以受賄罪與徇私枉法罪數罪並罰"}, {"key": "D", "text": "成立受賄罪與徇私枉法罪，從一重罪定罪處罰"}], "answer": ["C"], "explanation_full": "【羿文解析】張某收受阮某親屬8萬元，為他人謀取非法利益，當然成立受賄罪。A選項正確。 徇私枉法罪是指司法工作人員徇私枉法、徇情枉法，對明知是無罪的人而使他受追訴、對明知是有罪的人而故意包庇不使他受追訴，或者在刑事審判活動中故意違背事實和法律作枉法裁判的行為。需要注意的是，明知是有罪的人而故意包庇使其不受追訴，包括了故意違法變更強制措施，或者雖採取強制措施但實際上放任不管，致使犯罪嫌疑人、被告人實際脫離司法機關控制、逃避刑事追究。據此，張某成立徇私枉法罪。B選項正確。 受賄以後徇私枉法的，理論上屬於數行為觸犯數罪名，且數罪名的保護法益不同，應數罪並罰。但《刑法》 第399條明文規定，司法工作人員收受賄賂後犯徇私枉法罪、民事、行政枉法裁判罪和執行判決、裁定失職罪及執行判決、裁定濫用職權罪，依照處罰較重的規定定罪處罰。據此，C選項錯誤，D選項正確。"}, {"id": "卷一-94", "subject": "卷一", "type": "多選題", "question": "甲向乙借款37萬元，出具一份37萬元的借據。不久甲償付了借款37萬元現金，但未向乙要回借據。後乙向法院起訴請求判令甲償還借款37萬元及利息，法院判決乙勝訴。關於乙的行為，下列說法正確的是（　）。", "options": [{"key": "A", "text": "構成虛假訴訟罪"}, {"key": "B", "text": "不構成詐騙罪"}, {"key": "C", "text": "構成詐騙罪與虛假訴訟罪，應從一重定罪處罰"}, {"key": "D", "text": "應以詐騙罪和虛假訴訟罪數罪並罰"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】虛假訴訟罪是指自然人或者單位以捏造的事實提起民事訴訟，妨害司法秩序或者嚴重侵害他人合法權益的行為。乙明知甲已經償還其借款37萬元，仍然將37萬元借據作為證據提起民事訴訟，屬於以捏造的事實提起民事訴訟，妨害了司法秩序並且嚴重侵害了甲的財產權利，成立虛假訴訟罪。A選項正確。 通常發生的詐騙是兩者間的詐騙，及受騙者和受害者是同一人，但是，在例外的場合，受騙者和受害者並非同一人，受騙者有處分受害者財產的權限，行為人通過虛構事實或者隱瞞真相的方式使得受騙者基於認識錯誤處分受害者的財產，進而造成受害者的財產損失，這便是“三角詐騙”。而訴訟詐騙又是典型的“三角詐騙”形式：法官作為民事訴訟的受騙者有處分受害者財產的權限。乙明知甲已經償還37萬元借款，仍然捏造借款37萬元的事實向法院提起民事訴訟，導致法院判決其勝訴，成立詐騙罪。B選項錯誤。 由於虛假訴訟罪規定在“妨害社會管理秩序罪”一章，而詐騙罪規定在“侵犯公民財產權利”一章，因此 ，兩罪之間是想象競合的關係。此外，我國《刑法》第307條之一第3款明確規定，有虛假訴訟行為的同時 ，非法占有他人財產或者逃避合法債務，又構成其他犯罪的依照處罰的規定定罪從重處罰。C選項正確。 由於乙只有一個提起虛假訴訟的行為，同時處罰了虛假訴訟罪和詐騙罪，因而不應數罪並罰。D選項錯誤。"}, {"id": "卷一-95", "subject": "卷一", "type": "多選題", "question": "呂某從香港經羅湖口岸入境，被海關抽查發現其隨身攜帶的行李中有100枚未申報入境的紀念銀幣。經鑒定，呂某應繳納的稅款為10萬元，其當場補繳10萬元稅款並接受相應處罰。關於呂某行為的性質，下列說法錯誤的是", "options": [{"key": "A", "text": "成立走私貴重金屬罪"}, {"key": "B", "text": "成立走私普通貨物、物品罪"}, {"key": "C", "text": "成立逃稅罪"}, {"key": "D", "text": "不成立犯罪專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 41"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】走私貴重金屬罪是指違反海關法規，走私國家禁止出口的黃金、白銀或者其他貴重金屬的行為 。成立走私貴重金屬罪，僅限於將貴重金屬從境內走私到境外的行為。而呂某屬於將貴重金屬從境外走私至境內，因此，不成立本罪。A選項錯誤。 走私普通貨物、物品罪是指違反海關法規、逃避海關監管，非法運輸、攜帶或者郵寄國家禁止進出口的武器 、彈藥、核材料、偽造的貨幣、文物、珍貴動物及其製品、貴重金屬、國家禁止進出口的其他貨物、物品以及淫穢物品以外的貨物、物品進出境，偷逃應繳稅額數額較大或者1年內曾因走私被給予2次行政處罰後又走私的行為。呂某將白銀製品攜帶入境且未經納稅申報，同時達到了偷逃應繳稅額數額較大的標準，成立走私普通貨物、物品罪。B選項正確。 納稅人採取欺騙、隱瞞手段進行虛假納稅申報或者不申報，逃避繳納稅款數額較大並且占應納稅額10％以上 ，成立逃稅罪。但是，根據《刑法》第201條第4款的規定：經稅務機關依法下達追繳通知後，補繳應納稅款 ，繳納滯納金，已受行政處罰的，不予追究刑事責任。因此，接受稅務機關的行政處理和處罰便成為逃稅罪的法定處罰阻卻事由。題乾明確提示呂某在海關當場補繳了應納稅款並且接受稅務機關的處罰，因而不成立逃稅罪。C選項錯誤。 不成立逃稅罪，並不妨礙呂某成立走私普通貨物、物品罪。因此，D選項錯誤。"}, {"id": "卷一-96", "subject": "卷一", "type": "多選題", "question": "某日，甲趁乙的丈夫不在家之際，在乙的住所內將其強姦。乙羞愧之極，便服毒自殺。因其丈夫回家發現後及時搶救，才脫離生命危險。至痊愈之日，共花去醫療費、交通費用、沒上班工資損失等約5萬元。之後 ，公安機關將甲捉拿歸案。人民檢察院向人民法院提起公訴。乙提起附帶民事訴訟，對於本案，下列說法正確的是：", "options": [{"key": "A", "text": "人民檢察院不能就此案提起附帶民事訴訟"}, {"key": "B", "text": "乙可以在公安機關偵查本案的時候提出賠償要求"}, {"key": "C", "text": "如果甲、乙在審查起訴階段就賠償達成協議並給付，乙向人民法院提起附帶民事訴訟，法院不予受理"}, {"key": "D", "text": "人民法院審理本案時可以適用《民法典》《民事訴訟法》等相關法律"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】根據《刑事訴訟法》第101條及《刑訴解釋》第175、185條的相關規定可知，被害人因人身權利受到犯罪侵犯或者財物被犯罪分子毀壞而遭受物質損失的，有權在刑事訴訟過程中提起附帶民事訴訟；被害人死亡或者喪失行為能力的，其法定代理人、近親屬有權提起附帶民事訴訟。國家財產、集體財產遭受損失的，人民檢察院在提起公訴的時候，可以提起附帶民事訴訟。A項正確。 偵查、審查起訴期間，有權提起附帶民事訴訟的人提出賠償要求，經公安機關、人民檢察院調解，當事人雙方已經達成協議並全部履行，被害人或者其法定代理人、近親屬又提起附帶民事訴訟的，人民法院不予受理 ，但有證據證明調解違反自願、合法原則的除外。BC項正確。 人民法院審判附帶民事訴訟案件，除適用刑法、刑事訴訟法外，還應當適用民法典、民事訴訟法有關規定。 可知，D項正確。"}, {"id": "卷一-97", "subject": "卷一", "type": "多選題", "question": "Z省Q市檢察院對犯罪嫌疑人秦某以搶劫罪和故意殺人罪提起公訴，Q市中級人民法院一審對兩罪分別判處無期徒刑和死刑立即執行。秦某未上訴，檢察院未抗訴。最高人民法院復核後裁定不予核准，撤銷原判，發回重審。關於Z省高級人民法院對本案的處理，下列說法正確的是（　）。", "options": [{"key": "A", "text": "可依照二審程序審理本案"}, {"key": "B", "text": "可由審判員5人組成合議庭審理此案"}, {"key": "C", "text": "可不開庭審理此案"}, {"key": "D", "text": "可將兩罪分別改判為死刑立即執行和死緩"}], "answer": ["A", "B", "C"], "explanation_full": "42 。A選項正確。 根據《刑事訴訟法》第183條第4款的規定，人民法院審判上訴和抗訴案件，由審判員3人或者5人組成合議庭進行。B選項正確。 本案中並未說明最高人民法院不予核准的原因，因此，高級人民法院用二審程序審理此案時，如果不是必須通過開庭審理查明事實或者糾正程序違法的，也可以直接改判，無須開庭審理。C選項正確。 高級人民法院按照二審程序來審理，且人民檢察院未提起抗訴的情況下，將無期徒刑直接改判為死刑有違 “上訴不加刑”的原則。同時，依據《刑事訴訟解釋》第428條2款的規定，高級人民法院復核死刑緩期執行案件，不得加重被告人的刑罰。高級人民法院直接加重一罪刑罰的做法也不符合這一精神。D選項錯誤。"}, {"id": "卷一-98", "subject": "卷一", "type": "單選題", "question": "章某因故意殺人罪被H省S市中級人民法院判處死刑立即執行，被告人沒有上訴，S市人民檢察院沒有抗訴 ，下列對該案處理的說法，正確的是？（　）", "options": [{"key": "A", "text": "S市中級人民法院應在上訴、抗訴期滿後3日內報請H省高級人民法院復核"}, {"key": "B", "text": "高級人民法院不同意判處死刑的，可以提審"}, {"key": "C", "text": "最■人民法院復核該案時，應當組成合議庭開庭審理，最高人民檢察院應當派員出庭提出糾正意見"}, {"key": "D", "text": "最高人民法院復核該案時，應當進行全面審查，應當在最高人民法院辦公場所當面聽取辯護律師意見，"}], "answer": ["B"], "explanation_full": "【羿文解析】《刑事訴訟法》第247條規定：“中級人民法院判處死刑的第一審案件，被告人不上訴的，應當由高級人民法院復核後，報請最高人民法院核准。高級人民法院不同意判處死刑的，可以提審或者發回重新審判。高級人民法院判處死刑的第一審案件被告人不上訴的，和判處死刑的第二審案件，都應當報請最高人民法院核准。”《刑事訴訟法解釋》第423條第1項也規定：“中級人民法院判處死刑的第一審案件，被告人未上訴、人民檢察院未抗訴的，在上訴、抗訴期滿後10日內報請高級人民法院復核。高級人民法院同意判處死刑的，應當在作出裁定後10日內報請最高人民法院核准；認為原判認定的某一具體事實或者引用的法律條款等存在瑕疵，但判處被告人死刑並無不當的，可以在糾正後作出核准的判決、裁定；不同意的，應當依照第二審程序提審或者發回重新審判。”據此，本案中S市中院判處死刑立即執行後，被告人沒有上訴，檢察院也沒有抗訴，因此，應當在上訴、抗訴期滿後10日內報請高級人民法院復核，而並非3日內，A選項錯誤。此外，高級人民法院復核後，可以同意判處死刑，同意的應當繼續報最高人民法院核准，也可以不同意判處死刑，不同意的，要麼提審要麼發回重審，據此，B選項正確。 《刑事訴訟法》第249條規定：“最高人民法院復核死刑案件，高級人民法院復核死刑緩期執行的案件，應當由審判員3人組成合議庭進行。”《刑事訴訟法》第251條規定：“最高人民法院復核死刑案件，應當訊問被告人，辯護律師提出要求的，應當聽取辯護律師的意見。在復核死刑案件過程中，最高人民檢察院可以向最高人民法院提出意見。最高人民法院應當將死刑復核結果通報最高人民檢察院。”據此，最高人民法院復核該案時，應當組成合議庭，但非必須開庭審理，而只是要求必須訊問被告人。而且，最高人民檢察院可以提出意見，但也不是必須派員出庭提出糾正意見，故C選項錯誤。 《刑事訴訟法解釋》第427條規定：“復核死刑、死刑緩期執行案件，應當全面審查以下內容：（1）被告人的年齡，被告人有無刑事責任能力、是否系懷孕的婦女；（2）原判認定的事實是否清楚，證據是否確實、充分；（3）犯罪情節、後果及危害程度；（4）原判適用法律是否正確，是否必須判處死刑，是否必須立即執行；（5）有無法定、酌定從重、從輕或者減輕處罰情節；（6）訴訟程序是否合法；（7）應當審查的其他情況。”《刑事訴訟法解釋》第434條規定：“死刑復核期間，辯護律師要求當面反映意見的，最高人民法院有關合議庭應當在辦公場所聽取其意見，並製作筆錄；辯護律師提出書面意見的，應當附卷。”據此，最高人民法院復核死刑案件，應當遵循全面審查原則，但是，最高人民法院只有在辯護律師要求當面反映意見時才應當在辦公場所聽取其意見，亦即辯護律師沒有提出要求的，則無須聽取其意見。故D選項錯誤。"}, {"id": "卷一-99", "subject": "卷一", "type": "單選題", "question": "代履行是行政機關強制執行的方式之一。有關代履行，下列說法正確的是？（　）", "options": [{"key": "A", "text": "行政機關只能委託沒有利害關係的第三人代履行"}, {"key": "B", "text": "代履行的費用按照成本合理計算，由當事人承擔，但法律、法規另有規定的除外"}, {"key": "C", "text": "代履行不得採用暴力、脅迫以及其他非法方式實施專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 43"}, {"key": "D", "text": "實施代履行前，行政機關均應當催告當事人履行義務"}], "answer": ["C"], "explanation_full": "【羿文解析】代履行既可以由行政機關實施，也可以由行政機關委託沒有利害關係的第三方實施，因此A選項錯誤。 代履行的費用按照成本合理計算，由當事人承擔，但法律另有規定的除外，因此B選項錯誤。 代履行不得釆用暴力、脅迫以及其他非法方式，因此C選項正確。 催告是行政強制執行實施前的程序，但立即代履行無需催告，因此D選項錯誤。"}, {"id": "卷一-100", "subject": "卷一", "type": "多選題", "question": "某區中醫院新建綜合樓時，未建設符合環保要求的污水處理設施即投入使用。市檢察院發現該線索後 ，進行了調查，發現區中醫院通過滲井、滲坑排放醫療污水，其排放的醫療污水超過國家標準。市檢察院還發現區衛生和計劃生育局在醫院未提交環評合格報告的情況下，對區中醫院《醫療機構執業許可證》校驗為合格，且對區中醫院違法排放醫療污水的行為未及時制止，存在不依法履行職責行為。市檢察院在履行了提起公益訴訟的前置程序後，訴至法院，請求：①確認區衛生和計劃生育局為醫院校驗《醫療機構執業許可證 》的行為違法；②判令區衛生和計劃生育局履行法定監管職責，責令區衛生和計劃生育侷限期對醫院的醫療污水淨化處理設施進行整改；③判令醫院立即停止違法排放醫療污水。法院受理案件。下列說法正確的是 ：（　）", "options": [{"key": "A", "text": "區衛生和計劃生育局為行政公益訴訟被告"}, {"key": "B", "text": "區中醫院為民事公益訴訟被告"}, {"key": "C", "text": "法院可以採取一併立案、一併審理、一併判決的方式處理"}, {"key": "D", "text": "法院可以採取分別立案、一併審理、分別判決的方式處理"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】根據《行政訴訟法》第25條第4款的規定，人民檢察院在履行職責中發現生態環境和資源保護、 食品藥品安全、國有財產保護、國有土地使用權出讓等領域負有監督管理職責的行政機關違法行使職權或者不作為，致使國家利益或者社會公共利益受到侵害的，應當向行政機關提出檢察建議，督促其依法履行職責 。行政機關不依法履行職責的，人民檢察院依法向人民法院提起訴訟。題目中，區衛生和計劃生育局在區中醫院未提交環評合格報告的情況下，對其《醫療機構執業許可證》校驗為合格，且對其違法排放醫療污水的行為未及時制止，存在不依法履行職責行為，市檢察院提起行政公益訴訟，請求法院：①確認區衛生和計劃生育局為醫院校驗《醫療機構執業許可證》的行為違法；②判令區衛生和計劃生育局履行法定監管職責，責令區衛生和計劃生育侷限期對醫院的醫療污水淨化處理設施進行整改。因此，區衛生和計劃生育局是行政公益訴訟的被告。故A選項正確。 檢察院提起環境行政公益訴訟案件時，可以就同一污染環境行為提起環境民事公益訴訟。題目中，市檢察院發現區中醫院通過滲井、滲坑排放醫療污水，其排放的醫療污水超過國家標準，在行政公益訴訟中附帶提起民事公益訴訟，請求法院判令醫院立即停止違法排放醫療污水。因此，區中醫院為民事公益訴訟被告。故B選項正確。 根據《行政訴訟法》第61條第1款的規定，在涉及行政許可、登記、征收、徵用和行政機關對民事爭議所作的裁決的行政訴訟中，當事人申請一併解決相關民事爭議的，人民法院可以一併審理。根據《行訴解釋》第 140條第1款的規定，人民法院在行政訴訟中一併審理相關民事爭議的，民事爭議應當單獨立案，由同一審判組織審理。《行訴解釋》第142條第1款規定，對行政爭議和民事爭議應當分別裁判。題目中，法院在審理檢察院提起的環境行政公益訴訟案件時，對檢察院就同一污染環境行為提起的環境民事公益訴訟，可以參照行政訴訟法及其司法解釋規定，釆取分別立案、一併審理、分別判決的方式處理。故C選項錯誤，D選項正確。 44"}, {"id": "卷一-1", "subject": "卷一", "type": "單選題", "question": "下列關於證券登記結算機構的說法中，哪一項是不正確的？（　）", "options": [{"key": "A", "text": "屬於企業法人"}, {"key": "B", "text": "為證券交易提供集中的登記、存管與結算服務，不以營利為目的"}, {"key": "C", "text": "其設立必須由國務院證券監督管理部門審查批准"}, {"key": "D", "text": "設立證券登記結算機構的條件之一是，自有資金不少於人民幣2億元"}], "answer": ["A"], "explanation_full": "【羿文解析】《證券法》第145條規定：“證券登記結算機構為證券交易提供集中登記、存管與結算服務，不以營利為目的，依法登記，取得法人資格。設立證券登記結算機構必須經國務院證券監督管理機構批准。 ”由此可知，證券登記結算機構是非營利法人，屬於社會團體法人，所以A項錯誤，當選；B、C兩項正確，不當選。《證券法》第146條規定：“設立證券登記結算機構，應當具備下列條件：（一）自有資金不少於人民幣二億元；（二）具有證券登記、存管和結算服務所必須的場所和設施；（三）國務院證券監督管理機構規定的其他條件。證券登記結算機構的名稱中應當標明證券登記結算字樣。”由此可知，D項正確，不當選。"}, {"id": "卷一-2", "subject": "卷一", "type": "單選題", "question": "甲乙丙三人合夥開辦電腦修理店，店名為“一通電腦行”，依法登記。甲負責對外執行合夥事務。顧客丁進店送修電腦時，被該店修理人員戊的工具碰傷。丁擬向法院起訴。關於本案被告的確定，下列哪一選項是正確的？（　　）", "options": [{"key": "A", "text": "“一通電腦行”為被告"}, {"key": "B", "text": "甲為被告"}, {"key": "C", "text": "甲乙丙三人為共同被告，並註明“一通電腦行”字號"}, {"key": "D", "text": "甲乙丙戊四人為共同被告"}], "answer": ["C"], "explanation_full": "【羿文解析】《民訴解釋》第60條規定，在訴訟中，未依法登記領取營業執照的個人合夥的全體合夥人為共同訴訟人。個人合夥有依法核准登記的字號的，應在法律文書中註明登記的字號。全體合夥人可以推選代表人；被推選的代表人，應由全體合夥人出具推選書。《民法典》第1191條規定，用人單位的工作人員因執行工作任務造成他人損害的，由用人單位承擔侵權責任。用人單位承擔侵權責任後，可以向有故意或者重大過失的工作人員追償。勞務派遣期間，被派遣的工作人員因執行工作任務造成他人損害的，由接受勞務派遣的用工單位承擔侵權責任；勞務派遣單位有過錯的，承擔相應的責任。本題中，應將甲乙丙三人列為共同被告 ，並在法律文書中註明所登記的字號“一通電腦行”。戊作為合夥組織的雇員，其在進行雇傭合同所規定的生產經營活動中致他人損害，應將其雇主列為當事人，而不應將其作為當事人，故戊不能作為共同被告。本題正確答案為C選項，A、B、D三項皆不正確。"}, {"id": "卷一-3", "subject": "卷一", "type": "單選題", "question": "北京市東城區的張冉和上海市南匯區的李牧買賣合同一案，由合同履行地北京市海淀區法院作出生效判決，要求李牧在6個月內給付合同款項200萬元。法律文書生效的1個月後，張冉發現李牧轉移在北京市西城區的財產，欲釆取措施維護自己的合法權益，下列說法正確的是：（）", "options": [{"key": "A", "text": "張冉應向北京市海淀區法院申請採取保全"}, {"key": "B", "text": "張冉應向北京市西城區法院申請釆取保全"}, {"key": "C", "text": "法院釆取保全措施後，張冉在5日內未申請執行，則法院解除保全措施"}, {"key": "D", "text": "法律文書生效後，張冉在5日內未申請執行，則法院解除保全措施"}], "answer": ["B"], "explanation_full": "【羿文解析】該案屬於執行前的保全，應向執行法院申請，而不是生效法律文書的作出法院，A項錯誤，B項正確。 法院採取保全措施後，申請人應在法律文書指定的履行期限屆滿之日後的5日內向法院申請強制執行，而不是採取保全措施後或法律文書生效後的5日內申請強制執行，C、D項錯誤。 1"}, {"id": "卷一-4", "subject": "卷一", "type": "單選題", "question": "中央環保督察組進行實地檢■，發現某市污染嚴重，環境質量嚴重退化，根據《環境保護法》，下列哪一主體應對該市環境質量負責？（　　）", "options": [{"key": "A", "text": "該市市長"}, {"key": "B", "text": "該市環境保護局"}, {"key": "C", "text": "該市環境保護局局長"}, {"key": "D", "text": "該市人民政府"}], "answer": ["D"], "explanation_full": "【羿文解析】《環境保護法》第6條第2款規定，地方各級人民政府應當對本行政區域的環境質量負責。因此 D項正確。"}, {"id": "卷一-5", "subject": "卷一", "type": "單選題", "question": "根據《民事訴訟法》及相關司法解釋的規定，法院對於下列起訴的處理方式中，哪一選項是正確的？（ ）", "options": [{"key": "A", "text": "張某起訴李某要求返還借款，李某在答辯狀中稱張某請求已過訴訟時效，法院應裁定不予受理"}, {"key": "B", "text": "田律師作為雲南藏羚羊的訴訟代理人，起訴某制藥廠賠償損失，法院應裁定不予受理或駁回起訴"}, {"key": "C", "text": "王某起訴趙某離婚，訴訟過程中撤訴，3個月後趙某起訴離婚，沒有新情況、新理由．法院應裁定不予受理"}, {"key": "D", "text": "家住A區的夏某在B市旅遊時發生事故，向A區法院起訴B市旅遊公司賠償損害，法院受理後發現其無管轄權 ，應裁定駁回起訴"}], "answer": ["B"], "explanation_full": "【羿文解析】A選項中，根據《民訴法解釋》第219條的規定，對於超過訴訟時效的案件，法院仍應受理，對方當事人提出訴訟時效抗辯，人民法院經審理確屬超過訴訟時效的，判決駁回訴訟請求，故A選項表述錯誤 ，不當選。 B選項中，根據《民事訴訟法》第119條的規定，起訴的原告須為公民、法人或其他組織，動物不能作原告 ，故法院應裁定不予受理或駁回起訴，B選項表述正確，當選。 C選項中，根據《民訴法解釋》第214條及《民事訴訟法》第124條的規定，離婚案件一般適用一事不再理之原則，但有三例外，即有新情況或新理由、6個月後、原審被告起訴，本案中趙某為原審被告，法院不得裁定不予受理，故C選項表述錯誤，不當選。 D選項中，根據《民訴法解釋》第211條的規定，立案後發現本院沒有管轄權的，法院應將案件移送有管轄權的法院，不能裁定不予受理，故D選項表述錯誤，不當選。"}, {"id": "卷一-6", "subject": "卷一", "type": "單選題", "question": "根據《環境保護法》規定，關於污染物排放標準，下列哪一說法是錯誤的？（）", "options": [{"key": "A", "text": "省級地方政府對國家污染物排放標準中已作規定和未作規定的項目，都可以制定地方污染物排放標準"}, {"key": "B", "text": "對國家污染物排放標準中已作規定的項目，在制定地方污染物排放標準時，可以因地制宜，嚴於或寬於國家污染物排放標準"}, {"key": "C", "text": "地方污染物排放標準須報國務院環境保護行政主管部門備案"}, {"key": "D", "text": "對國家污染物排放標準中已作規定的項目，可以制定嚴於國家污染物排放標準的地方污染物排放標準"}], "answer": ["B"], "explanation_full": "【羿文解析】B項說法錯誤，ACD項說法正確。根據《環境保護法》第16條的規定，國務院環境保護主管部門根據國家環境質量標準和國家經濟、技術條件，制定國家污染物排放標準。省、自治區、直轄市人民政府對國家污染物排放標準中未作規定的項目，可以制定地方污染物排放標準；對國家污染物排放標準中已作規定的項目，可以制定嚴於國家污染物排放標準的地方污染物排放標準。地方污染物排放標準應當報國務院環境保護主管部門備案。故本題答案為B。"}, {"id": "卷一-7", "subject": "卷一", "type": "單選題", "question": "甲省為一沿海省份，經濟較為發達，但是由於鄉鎮企業和小型私營企業數量較多，污染比較嚴重，甲省人民政府希望加大環境污染治理的力度，其下列哪一做法是錯誤的？（　）", "options": [{"key": "A", "text": "對國家環境質量標準中未作規定的項目，制定甲省環境質量標準，並報國務院環境保護行政主管部門備案"}, {"key": "B", "text": "對國家污染物排放標準中已作規定的項目，制定嚴於國家污染物排放標準的甲省污染物排放標準專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 2"}, {"key": "C", "text": "規定凡是向已有甲省污染物排放標準的區域排放污染物的，執行甲省污染物排放標準"}, {"key": "D", "text": "命令甲省人民政府環境保護主管部門對管轄範圍內的排污單位進行現場檢查"}], "answer": ["C"], "explanation_full": "【羿文解析】《環境保護法》第15條第2款規定：“省、自治區、直轄市人民政府對國家環境質量標準中未作規定的項目，可以制定地方環境質量標準；對國家環境質量標準中已作規定的項目，可以制定嚴於國家環境質量標準的地方環境質量標準。地方環境質量標準應當報國務院環境保護主管部門備案。”可見，A選項中的做法符合法律規定，故A項正確，不當選。《環境保護法》第16條第2款規定：“省、自治區、直轄市人民政府對國家污染物排放標準中未作規定的項目，可以制定地方污染物排放標準；對國家污染物排放標準中已作規定的項目，可以制定嚴於國家污染物排放標準的地方污染物排放標準。地方污染物排放標準應當報國務院環境保護主管部門備案。”B選項做法符合法律規定，不當選。《環境保護法》第24條規定：“縣級以上人民政府環境保護主管部門及其委託的環境監察機構和其他負有環境保護監督管理職責的部門，有權對排放污染物的企業事業單位和其他生產經營者進行現場檢查。被檢查者應當如實反映情況，提供必要的資料。實施現場檢查的部門、機構及其工作人員應當為被檢查者保守商業秘密。”故D選項做法符合法律規定，不當選。"}, {"id": "卷一-8", "subject": "卷一", "type": "單選題", "question": "關於企業所得稅的說法，下列哪一選項是錯誤的？（）", "options": [{"key": "A", "text": "在我國境內，企業和其他取得收入的組織為企業所得稅的納稅人"}, {"key": "B", "text": "個人獨資企業、合夥企業不是企業所得稅的納稅人"}, {"key": "C", "text": "企業所得稅的納稅人分為居民企業和非居民企業，二者的適用稅率完全不同"}, {"key": "D", "text": "企業所得稅的稅收優惠，居民企業和非居民企業都有權享受"}], "answer": ["C"], "explanation_full": "【羿文解析】A、B項符合《企業所得稅法》第1條的規定，在中華人民共和國境內，企業和其他取得收入的組織（以下統稱企業）為企業所得稅的納稅人，依照本法的規定繳納企業所得稅。故說法正確。根據《企業所得稅法》第3、4條的規定，企業所得稅的稅率為25％。但非居民企業在中國境內未設立機構、場所的，或者雖設立機構、場所但取得的所得與其所設機構、場所沒有實際聯繫的，應當就其來源於中國境內的所得繳納企業所得稅，該稅率為20％，故C項說法不確切。D項說法正確，《企業所得稅法》有關稅收優惠的規定並沒有刻意區分居民企業和非居民企業。 【陷阱】考生可能會對居民企業與非居民企業享受的稅收優惠是否相同存在疑問，如果記憶不清很可能會被迷惑。但是只要知道《企業所得稅法》的制定背景，這個問題就不難了。《企業所得稅法》的制定就是要取消內外資企業在所得稅方面的不同待遇，使得兩者在同一起跑線上競爭，稅收優惠的享有不再特意區分內外資企業，所以D項是正確的。C項錯在兩者的基本稅率都是25％，非居民企業由於收入來源不同，在特定情況下可以適用20％的稅率，所以不是“完全不同”。"}, {"id": "卷一-9", "subject": "卷一", "type": "單選題", "question": "對於人民陪審員的迴避，下列做法哪一個是正確的？（）", "options": [{"key": "A", "text": "只能向院長申請"}, {"key": "B", "text": "由審判長決定"}, {"key": "C", "text": "由院長決定"}, {"key": "D", "text": "由審判委員會決定"}], "answer": ["C"], "explanation_full": "【羿文解析】《關於完善人民陪審員制度的決定》第12條規定:“人民陪審員的迴避，參照有關法官迴避的法律規定執行”，人民陪審員屬於法院的審判人員，審判人員的迴避應由院長決定。故C項正確，A、B、D錯誤 。本題正確答案為C。"}, {"id": "卷一-10", "subject": "卷一", "type": "單選題", "question": "某化工廠排放的污水會影響魚類生長，但其串通某環境影響評價機構獲得虛假環評文件從而得以建設。該廠後來又串通某污水處理設施維護機構，使其污水處理設施虛假顯示從而逃避監管。該廠長期排污致使周邊水域的養殖魚類大量死亡。面對養殖戶的投訴，當地環境保護主管部門一直未採取任何■處措施。對於養殖戶的賠償請求，下列哪一單位不需承擔連帶責任？（） 3", "options": [{"key": "A", "text": "化工廠"}, {"key": "B", "text": "環境影響評價機構"}, {"key": "C", "text": "污水處理設施維護機構"}, {"key": "D", "text": "當地環境保護主管部門"}], "answer": ["D"], "explanation_full": "【羿文解析】根據《環境保護法》第65條的規定：“環境影響評價機構、環境監測機構以及從事環境監測設備和防治污染設施維護、運營的機構，在有關環境服務活動中弄虛作假，對造成的環境污染和生態破壞負有責任的，除依照有關法律法規規定予以處罰外，還應當與造成環境污染和生態破壞的其他責任者承擔連帶責任。”故本題的正確答案為D。"}, {"id": "卷一-11", "subject": "卷一", "type": "單選題", "question": "某美容店向王某推薦一種“雅蘭牌”護膚產品。王某對該品牌產品如此便宜表示疑惑，店家解釋為店慶優惠。王某買回使用後，面部■現紅腫、瘙癢，苦不堪言。質檢部門認定系假冒劣質產品。王某遂向美容店索賠。對此，下列哪一選項是正確的？（　　）", "options": [{"key": "A", "text": "美容店不知道該產品為假名牌，不應承擔責任"}, {"key": "B", "text": "美容店不是假名牌的生產者，不應承擔責任"}, {"key": "C", "text": "王某對該產品有懷疑仍接受了服務，應承擔部分責任"}, {"key": "D", "text": "美容店違反了保證商品和服務安全的義務，應當承擔全部責任"}], "answer": ["D"], "explanation_full": "【羿文解析】根據《消費者權益保護法》第7條的規定，消費者在購買、使用商品和接受服務時享有人身、財產安全不受損害的權利。消費者有權要求經營者提供的商品和服務，符合保障人身、財產安全的要求。美容店應當對其提供的商品和服務負有保證其安全的義務，因而不論該美容店是否知道該產品為假名牌，都應當承擔全部責任。故本題的正確答案應當是D。"}, {"id": "卷一-12", "subject": "卷一", "type": "單選題", "question": "崔某為了躲避債務，離家出走，一直未與家人聯繫。8年後因思鄉情切回到家中，得知三年前其妻吳某已向法院申請宣告其死亡，並改嫁張某，崔某與吳某的10歲女兒崔小某已由孟某收養，閒置的住房被村辦工廠占用。下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "崔某在被宣告死亡期間所為的法律行為有效"}, {"key": "B", "text": "如果張某在崔某歸來後意外身亡，崔某與吳某的婚姻關係自動恢復"}, {"key": "C", "text": "即使吳某未再婚，吳某也可以不同意恢復與崔某的婚姻關係"}, {"key": "D", "text": "崔某可以以未經自己同意為由主張吳某之女與孟某之間的收養關係無效"}], "answer": ["C"], "explanation_full": "【羿文解析】《民法典》第49條規定：“自然人被宣告死亡但是並未死亡的，不影響該自然人在被宣告死亡期間實施的民事法律行為的效力。”據此，死亡宣告本身不影響被宣告死亡人所為法律行為的效力，但該行為不一定有效，可能存在無效、可撤銷或者效力待定等效力瑕疵，故A項錯誤。 《民法典》第51條規定：“被宣告死亡的人的婚姻關係，自死亡宣告之日起消除。死亡宣告被撤銷的，婚姻關係自撤銷死亡宣告之日起自行恢復。但是，其配偶再婚或者向婚姻登記機關書面聲明不願意恢復的除外。 ”據此，如果配偶吳某再婚，則崔某與吳某之前的婚姻關係不能恢復，故B項錯誤。即便吳某沒有再婚，吳某也可以不同意恢復自己與崔某之間的婚姻關係，故C項正確。 《民法典》第52條規定：“被宣告死亡的人在被宣告死亡期間，其子女被他人依法收養的，在死亡宣告被撤銷後，不得以未經本人同意為由主張收養行為無效。”據此，D項錯誤。"}, {"id": "卷一-13", "subject": "卷一", "type": "單選題", "question": "英國人施密特因合同糾紛在中國法院涉訴。關於該民事訴訟，下列哪一選項是正確的？（）", "options": [{"key": "A", "text": "施密特可以向人民法院提交英文書面材料，無需提供中文翻譯件"}, {"key": "B", "text": "施密特可以委託任意一位英國出庭律師以公民代理的形式代理訴訟"}, {"key": "C", "text": "如施密特不在中國境內，英國駐華大使館可以授權本館官員為施密特聘請中國律師代理訴訟"}, {"key": "D", "text": "如經調解雙方當事人達成協議，人民法院已制發調解書，但施密特要求發給判決書，應予拒絕專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 4"}], "answer": ["C"], "explanation_full": "【羿文解析】《民訴解釋》第527條規定：“當事人向人民法院提交的書面材料是外文的，應當同時向人民法院提交中文翻譯件。當事人對中文翻譯件有異議的，應當共同委託翻譯機構提供翻譯文本；當事人對翻譯機構的選擇不能達成一致的，由人民法院確定。”因此A項說法錯誤。《民訴解釋》第528條規定：“涉外民事訴訟中的外籍當事人，可以委託本國人為訴訟代理人，也可以委託本國律師以非律師身份擔任訴訟代理人 ；外國駐華使領館官員，受本國公民的委託，可以以個人名義擔任訴訟代理人，但在訴訟中不享有外交或者領事特權和豁免。”英國出庭律師可以通過事務律師為委託人提供法律咨詢和辯護。當事人不能直接委託出庭律師，而必須通過事務律師作為中介人。當事人的所有請求和意見均要通過事務律師向出庭律師轉交。出庭律師既不會見委託人，也不直接調取證據，他所依據的是事務律師為其提供的訴訟文書和有關材料。因此 B項說法錯誤。《民訴解釋》第529條規定：“涉外民事訴訟中，外國駐華使領館授權其本館官員，在作為當事人的本國國民不在中華人民共和國領域內的情況下，可以以外交代表身份為其本國國民在中華人民共和國聘請中華人民共和國律師或者中華人民共和國公民代理民事訴訟。”因此C項說法正確。《民訴解釋》第 530條規定：“涉外民事訴訟中，經調解雙方達成協議，應當制發調解書。當事人要求發給判決書的，可以依協議的內容製作判決書送達當事人。”因此D項說法錯誤。"}, {"id": "卷一-14", "subject": "卷一", "type": "單選題", "question": "中國偉業公司與甲國利德公司簽訂了釆取鐵路運輸方式由中國出口一批貨物的合同。後甲國法律發生變化 ，利德公司在收貨後又自行將該批貨物轉賣到乙國，現乙國一公司聲稱該批貨物侵犯了其知識產權。中國和甲國均為《國際貨物銷售合同公約》和《國際鐵路貨物聯運協定》締約國。依相關規則，下列哪一選項是正確的？（　　）", "options": [{"key": "A", "text": "偉業公司不承擔該批貨物在乙國的知識產權擔保義務"}, {"key": "B", "text": "該批貨物的風險應於訂立合同時由偉業公司轉移給利德公司"}, {"key": "C", "text": "鐵路運輸承運人的責任期間是從貨物裝上火車時起至卸下時止"}, {"key": "D", "text": "不同鐵路運輸區段的承運人應分別對在該區段發生的貨損承擔責任"}], "answer": ["A"], "explanation_full": "【羿文解析】《聯合國國際貨物銷售合同公約》第42條第1款：“賣方所交付的貨物，必須是第三方不能根據工業產權或其他知識產權主張任何權利或要求的貨物，但以賣方在訂立合同時已知道或不可能不知道的權利或要求為限，而且這種權利或要求根據以下國家的法律規定是以工業產權或其他知識產權為基礎的：（A）如果雙方當事人在訂立合同時預期貨物將在某一國境內轉售或做其他使用，則根據貨物將在其境內轉售或做其他使用的國家的法律；或者（B）在任何其他情況下，根據買方營業地所在國家的法律。”本題中，中國偉業公司與甲國利德公司訂立合同時，偉業公司不知道利德公司會將該批貨物轉賣至乙國，不承擔該批貨物在乙國的知識產權擔保義務。故A正確。《聯合國國際貨物銷售合同公約》第67條第1款：“如果銷售合同涉及貨物的運輸，但賣方沒有義務在某一特定地點交付貨物，自貨物按照銷售合同交付給第一承運人以轉交給買方時起，風險就移轉到買方承擔。”《聯合國國際貨物銷售合同公約》第68條：“對於在運輸途中銷售的貨物 ，從訂立合同時起，風險就移轉到買方承擔。”本題中，沒有涉及偉業公司與利德公司關於交付貨物地點的信息，該批貨物的風險應於貨交第一承運人時由偉業公司轉移給利德公司。故B錯誤。需要注意的是，風險於訂立合同時轉移的情況較為特殊，即銷售運輸途中的貨物，訂立合同時風險轉移。依據《國際鐵路貨物聯運協定》的規定，承運人的責任期間是承運貨物時起，至交付貨物時為止，而不以貨物裝上或卸下為責任期間的節點。故C錯誤。不同運輸區段的承運人之間的責任清算規則是：如損失是由於一個承運人的過失造成，則該承運人負完全責任；如損失是由於參加運送的數個承運人的過失造成，則每一承運人各自對其造成的損失負責；如不能證明損失是因一個或數個承運人過失所造成，則承運人應商定責任分擔辦法，如承運人不能商定責任分擔辦法，則承運人間的責任按該批貨物在各承運人進行運送時實際行經的運價公里比例分擔，但能夠證明損失不是由其過失所造成的承運人除外。故D錯誤。"}, {"id": "卷一-15", "subject": "卷一", "type": "單選題", "question": "甲國為WT0成員國，其現行外資法中哪類措施沒有違反《與貿易有關的投資措施協議》？（　）", "options": [{"key": "A", "text": "合資企業所需原材料應優先從國內購買"}, {"key": "B", "text": "合資企業進口,貨值不得超過當年度出口貨值專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 5"}, {"key": "C", "text": "在合資企業中，本地股權應占51％以上"}, {"key": "D", "text": "將企業獲得外匯與其外匯流入聯繫起來進行限制"}], "answer": ["C"], "explanation_full": "【羿文解析】根據《與貿易有關的投資措施協議》，成員國不得實施與GAT／第3條國民待遇和第11條取消數量限制義務不符的投資措施。（1）與國民待遇義務不符的投資措施，包括：①“當地成分要求”，要求企業在生產中必須購買或使用一定數量或比例的當地產品；②“貿易平衡要求”，要求企業購買或使用進口產品的數量或價值應與其出口當地產品的數量或價值相當。（2）與取消數量限制義務不符的投資措施，包括 ：①“通過貿易平衡限制進口”，限制企業用於當地生產或與當地生產相關的產品的進口，或將進口限制在與其出口的當地產品的數量或價值相關的水平；②“外匯平衡要求”，將企業可使用的外匯限制在與該企業外匯流入相關的水平；③“限制出口”（“國內銷售要求”），限制企業產品出口的數量，或要求企業將產品以低於國際市場價格的方式在國內銷售。本題中，A項屬於當地成分要求，B項屬於貿易平衡要求，D項屬於外匯平衡要求，均為協議所禁止。C項屬於本地股權比例要求，並不違反協議。"}, {"id": "卷一-16", "subject": "卷一", "type": "單選題", "question": "甲國人柯裡在甲國出版的小說流傳到乙國後出現了利用其作品的情形，柯裡認為侵犯了其版權，並訴諸乙國法院。儘管甲乙兩國均為《伯爾尼公約》的締約國，但依甲國法，此種利用作品不構成侵權，另外，甲國法要求作品要履行一定的手續才能獲得保護。根據相關規則，下列哪一選項是正確的？（　　）", "options": [{"key": "A", "text": "柯裡須履行甲國法要求的手續才能在乙國得到版權保護"}, {"key": "B", "text": "乙國法院可不受理該案，因作品來源國的法律不認為該行為是侵權"}, {"key": "C", "text": "如該小說在甲國因宗教原因被封殺，乙國仍可予以保護"}, {"key": "D", "text": "依國民待遇原則，乙國只能給予該作品與甲國相同水平的版權保護"}], "answer": ["C"], "explanation_full": "【羿文解析】根據《保護文學藝術作品伯爾尼公約》第5條規定，（1）根據本公約得到保護作品的作者，在除作品起源國外的本聯盟各成員國，就其作品享受各該國法律現今給予或今後將給予其國民的權利，以及本公約特別授予的權利。（2）享受和行使這類權利不需履行任何手續，也不管作品起源國是否存在有關保護的規定。因此，除本公約條款外，只有向之提出保護要求的國家的法律方得規定保護範圍及向作者提供的保護其權利的補救方法。（3）起源國的保護由該國本國法律作出規定。即使作者並非作品起源國的國民，但他就其作品根據本公約受到保護，他在該國仍享有同該國公民作者相同的權利。所以，A、B選項錯誤。第10條之二規定，（1）對在報紙或期刊上已發表的經濟、政治和宗教問題的時事性文章，或無線電已轉播的同樣性質的作品，本聯盟成員國法律有權准許在報刊上轉載，或向公眾作無線或有線廣播，如果對這種轉載、廣播或轉播的權利未作直接保留的話。但任何時候均應明確指出出處；不履行該項義務的後果由向之提出保護要求的國家以法律規定。（2）本聯盟成員國法律也有權規定，在何種條件下，對在時事事件過程中出現或公開的文學和藝術作品，在為報導目的正當需要範圍內，可予以複製，或者以攝影或電影手段或通過無線電或有線廣播向公眾作時事新聞報道。所以，C選項正確。第19條規定，本公約的規定不妨礙要求本聯盟某一成員國法律可能提供的更廣泛的保護。第20條規定，本聯盟各成員國政府有權在它們之間簽訂特別協議，以給予作者比本公約所規定的更多的權利，或者包括不違反本公約的其他條款。凡符合上述條件的現有協議的條款仍然適用。所以，D選項錯誤。"}, {"id": "卷一-17", "subject": "卷一", "type": "單選題", "question": "根據《民事訴訟法》和相關司法解釋，關於中級法院，下列哪一表述是正確的？（　　）", "options": [{"key": "A", "text": "既可受理一審涉外案件，也可受理一審非涉外案件"}, {"key": "B", "text": "審理案件組成合議庭時，均不可邀請陪審員參加"}, {"key": "C", "text": "審理案件均須以開庭審理的方式進行"}, {"key": "D", "text": "對案件所作出的判決均為生效判決"}], "answer": ["A"], "explanation_full": "【羿文解析】《民事訴訟法》第18條規定，中級人民法院管轄下列第一審民事案件：（1）重大涉外案件 6 審人民法院對上訴案件，應當組成合議庭，開庭審理。經過閱卷、調查和詢問當事人，對沒有提出新的事實 、證據或者理由，合議庭認為不需要開庭審理的，可以不開庭審理。因此，中級法院在審理上訴案件的時候 ，若合議庭認為不需要開庭審理的，也可以不開庭審理。故C選項說法錯誤。中級法院作為一審法院時，其所作出的判決當事人有提起上訴的權利，因此，不能絕對地認為中級法院的判決為生效判決，故D選項說法也是錯誤的。本題正確答案為A。"}, {"id": "卷一-18", "subject": "卷一", "type": "單選題", "question": "下列關於涉外民事訴訟的表述，哪一選項是錯誤的？（　）", "options": [{"key": "A", "text": "我國法院審理涉外民事案件時不受民事訴訟法關於一審審限的限制"}, {"key": "B", "text": "對在中國領域內沒有住所的當事人送達文書，可以採取郵寄送達"}, {"key": "C", "text": "在我國領域內沒有住所的中國人對法院作出的一審裁判的上訴期均為15天，且可以申請延長"}, {"key": "D", "text": "外籍當事人在我國法院進行涉外民事訴訟，可以委託本國律師以公民身份代理訴訟活動"}], "answer": ["C"], "explanation_full": "【羿文解析】A選項，《民事訴訟法》第270條規定，人民法院審理涉外民事案件的期間，不受本法第149條、 第176條規定（即一審、二審的期限）的限制。故A選項正確，不當選。 B選項，根據法律規定，涉外民事訴訟制度特別規定的送達方式如下：外交途徑送達、我國駐外使、領館代為送達、向受送達人委託的人或設在我國的代表機構或有權接受送達的分支機構、業務代辦人送達、郵寄送達 、依條約規定的方式送達、電子送達、公告送達。故B選項正確，不當選。 C選項，《民事訴訟法》第269條規定，在中華人民共和國領域內沒有住所的當事人，不服第一審人民法院判決、裁定的，有權在判決書、裁定書送達之日起30日內提起上訴。被上訴人在收到上訴狀副本後，應當在 30日內提出答辯狀。當事人不能在法定期間提起上訴或者提出答辯狀，申請延期的，是否准許，由人民法院決定。故C選項錯誤，當選。 D選項，依《民訴法解釋》第528條之規定，涉外民事訴訟中的外籍當事人，可以委託本國人為訴訟代理人 ，也可以委託本國律師以非律師身份擔任訴訟代理人。故D選項正確，不當選。"}, {"id": "卷一-19", "subject": "卷一", "type": "單選題", "question": "甲打算購買一輛價格在10萬元以內的汽車，遂甲授權就讀於某高級汽車裝配與維修學校的乙（17歲）代其購買汽車。乙到某汽車銷售商丙處，由業務員丁接待並提供服務，並告知其為甲購車，最終乙選擇一輛價格 8萬元的汽車，並將車交給甲。3日後，甲與駕駛經驗豐富的老友戊一起駕車出行，戊發現此車存在問題，經檢查，該車果然具有重大瑕疵，是由某海濱城市化學物品爆炸造成損壞的車輛翻新而成的車輛。丁明知此事 ，故意不告知。對此，下列哪一選項是錯誤的？（）", "options": [{"key": "A", "text": "因為乙是限制行為能力人，其行為需要法定代理人同意或者追認，因此合同效力待定"}, {"key": "B", "text": "甲可以主張丙承擔違約責任"}, {"key": "C", "text": "甲可以主張解除合同"}, {"key": "D", "text": "甲可以請求撤銷合同，並主張賠償損失"}], "answer": ["A"], "explanation_full": "【羿文解析】儘管乙是限制行為能力人，但是其代理權的獲得不受影響，因為代理權的授予是單方法律行為 ，不需要乙具有完全行為能力，因一切法律後果由被代理人甲承擔，乙以甲的名義購車是有效的要約．不會因乙是限制行為能力人而導致合同效力待定，故A選項錯誤。《民法典》第577條規定：“當事人一方不履行合同義務或者履行合同義務不符合約定的，應當承擔繼續履行、採取補救措施或者賠償損失等違約責任。 ”本題中，甲可以提出任意一種讓其承擔違約責任的方式，故B選項正確。《民法典》第563條規定：“有下列情形之一的，當事人可以解除合同：（一）因不可抗力致使不能實現合同目的；（二）在履行期限屆滿之前，當事人一方明確表示或者以自己的行為表明不履行主要債務；（三）當事人一方遲延履行主要債務，經催告後在合理期限內仍未履行；（四）當事人一方遲延履行債務或者有其他違約行為致使不能實現合同目的 ；（五）法律規定的其他情形。”本題中，由於汽車質量存在嚴重瑕疵，構成根本違約，甲的合同目的不能實現，因此可以解除合同，並請求丙承擔損失，故C選項正確。《民法典》第148條規定：“一方以欺詐手段 ，使對方在違背真實意思的情況下實施的民事法律行為，受欺詐方有權請求人民法院或者仲裁機構予以撤銷 7 予以返還；不能返還或者沒有必要返還的，應當折價補償。有過錯的一方應當賠償對方由此所受到的損失 ；各方都有過錯的，應當各自承擔相應的責任。法律另有規定的，依照其規定。”本題中，賣方丙的代理人丁明知車的質量有瑕疵，故意隱瞞，構成欺詐，代理人行為的法律後果由被代理人丙承擔。被欺詐人甲可以請求撤銷合同，並要求丙賠償損失，故D選項正確。綜上所述，本題的正確答案為A。"}, {"id": "卷一-20", "subject": "卷一", "type": "單選題", "question": "銀行業監督管理機構依法對銀行業金融機構進行檢查時，未經設區的市一級以上銀行業監督管理機構負責人批准，不可以對與涉嫌違法事項有關的單位和個人釆取下列哪一措施？（　　）", "options": [{"key": "A", "text": "詢問有關單位或者個人，要求其對有關情況作出說明"}, {"key": "B", "text": "查閱、複製有關財務會計、財產權登記等文件與資料"}, {"key": "C", "text": "對涉嫌轉移或者隱匿違法資金的賬戶予以凍結"}, {"key": "D", "text": "對可能被轉移、隱匿、毀損或者偽造的文件與資料予以先行登記保存"}], "answer": ["C"], "explanation_full": "【羿文解析】根據《銀行業監督管理法》第42條的規定，銀行業監督管理機構依法對銀行業金融機構進行檢查時，經設區的市一級以上銀行業監督管理機構負責人批准，可以對與涉嫌違法事項有關的單位和個人採取下列措施：（1）詢問有關單位或者個人，要求其對有關情況作出說明；（2）查閱、複製有關財務會計、財產權登記等文件、資料；（3）對可能被轉移、隱匿、毀損或者偽造的文件、資料，予以先行登記保存。故本題正確答案為C。"}, {"id": "卷一-21", "subject": "卷一", "type": "單選題", "question": "甲將房屋出租給乙，租期5年。半年後，甲通知乙欲出售該房屋，20天內乙未表態，甲遂將該房屋賣給丙 ，並辦理了過戶登記。乙有權：（）", "options": [{"key": "A", "text": "主張甲、丙之間的買賣合同無效"}, {"key": "B", "text": "要求甲承擔違約責任"}, {"key": "C", "text": "主張租賃合同對丙繼續有效"}, {"key": "D", "text": "主張優先購買權"}], "answer": ["C"], "explanation_full": "【羿文解析】《民法典》第725條規定：租賃物在承租人按照租賃合同占有期間發生所有權變動的，不影響租賃合同的效力。基於前述規定的“買賣不破租賃”的規則，即使租賃物所有權由甲變為丙，但不影響租賃合同的效力，故C項正確。 《民法典》第726條第1款規定：“出租人出賣租賃房屋的，應當在出賣之前的合理期限內通知承租人，承租人享有以同等條件優先購買的權利；但是，房屋按份共有人行使優先購買權或者出租人將房屋出賣給近親屬的除外。”同時，出租人履行通知義務後，承租人在15日內未明確表示購買的，承租人主張優先購買房屋的 ，人民法院不予支持。本題中，承租人在接到通知以後20日內沒有表示要優先購買的，視為主動放棄優先購買權，且不能請求出租人甲承擔責任。故A、B、D項錯誤。《民法典》第728條規定：“出租人未通知承租人或者有其他妨害承租人行使優先購買權情形的，承租人可以請求出租人承擔賠償責任。但是，出租人與第三人訂立的房屋買賣合同的效力不受影響。”由此可見，即使出租人未通知承租人即出賣租賃物的，承租人也不能主張出租人和第三人的買賣合同無效。"}, {"id": "卷一-22", "subject": "卷一", "type": "單選題", "question": "部分中國企業向商務部提出反傾銷調■申請，要求對原產於某國的某化工原材料進口產品進行相關調■。 經查，商務部終局裁定確定傾銷成立，決定征收反傾銷稅。根據我國相關法律規定，下列哪一說法是正確的 ？（）", "options": [{"key": "A", "text": "構成傾銷的前提是進口產品對我國化工原材料產業造成了實質損害，或者產生實質損害威脅"}, {"key": "B", "text": "對不同出口經營者應該征收同一標準的反傾銷稅稅額"}, {"key": "C", "text": "征收反傾銷稅，由國務院關稅稅則委員會做出決定，商務部予以執行"}, {"key": "D", "text": "與反傾銷調查有關的對外磋商、通知和爭端事宜由外交部負責"}], "answer": ["A"], "explanation_full": "8 的國內產業造成實質損害或者產生實質損害威脅，或者對建立國內產業造成實質阻礙的，依照本條例的規定進行調查，採取反傾銷措施，選項A正確。根據該條例第41條規定，反傾銷稅應當根據不同出口經營者的傾銷幅度，分別確定，選項B錯誤。根據該條例第38條規定，征收反傾銷稅，由商務部提出建議，國務院關稅稅則委員會根據商務部的建議作出決定，由商務部予以公告。海關自公告規定實施之日起執行，並非商務部執行 ，故選項C錯誤。根據該條例第57條規定，商務部負責與反傾銷有關的對外磋商、通知和爭端解決事宜，選項 D錯誤。"}, {"id": "卷一-23", "subject": "卷一", "type": "單選題", "question": "關於破產案件受理後、破產宣告前的程序轉換，下列哪一表述是正確的？（）", "options": [{"key": "A", "text": "如為債務人申請破產清算的案件，債權人可以申請和解"}, {"key": "B", "text": "如為債權人申請債務人破產清算的案件，債務人可以申請重整"}, {"key": "C", "text": "如為債權人申請債務人重整的案件，債務人可以申請破產清算"}, {"key": "D", "text": "如為債權人申請債務人破產清算的案件，債務人的出資人可以申請和解"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《企業破產法》第95條第1款的規定，債務人可以依照本法規定，直接向人民法院申請和解 ；也可以在人民法院受理破產申請後、宣告債務人破產前，向人民法院申請和解。因此，和解的申請權在債務人，無論誰申請破產清算，債權人、債務人的出資人都無權申請和解，A項、D項均錯誤。但重整與此不同 ，根據《企業破產法》第70條的規定，債務人或者債權人可以依照本法規定，直接向人民法院申請對債務人進行重整。債權人申請對債務人進行破產清算的，在人民法院受理破產申請後、宣告債務人破產前，債務人或者出資額占債務人註冊資本1／10以上的出資人可以向人民法院申請重整。故選項B正確。至於破產清算的申請權，根據《企業破產法》第7條的規定，債權人和債務人均有權提出，並不受重整申請權主體的限制。綜上，本題正確選項為B項。 【陷阱】本題的陷阱在於和解、重整、清算等破產程序中的申請權主體差異，包括債務人、債權人和出資額占債務人註冊資本1／10以上的出資人。其一般規則是：破產清算的申請主體是債權人和債務人，且二者的申請資格並不是交錯對應的；破產和解的申請權專屬於債務人；破產重整可以由債務人或者債權人脫離破產申請直接適用，也可以在破產申請受理後、宣告債務人破產前由債務人或者出資額占債務人註冊資本1／10以上的出資人提出。"}, {"id": "卷一-24", "subject": "卷一", "type": "單選題", "question": "撤訴是當事人行使處分權的表現，下列關於撤訴表述不正確的是：（）", "options": [{"key": "A", "text": "一審中原告申請撤回起訴後，再次向法院起訴的，法院應予受理"}, {"key": "B", "text": "二審、再審中一審原告申請撤回起訴後，再次向法院起訴的，法院應予受理"}, {"key": "C", "text": "一審法庭辯論結束後，原告申請撤回起訴，需經被告同意"}, {"key": "D", "text": "二審、再審中一審原告申請撤回起訴的，需經對方當事人同意"}], "answer": ["B"], "explanation_full": "【羿文解析】一審原告撤回起訴的，不影響訴權的再次行使。A選項正確。二審、再審中一審原告撤回起訴後 ，訴權喪失，法院應當裁定不予受理。B選項錯誤。一審法庭辯論結束後，二審、再審中一審原告申請撤回起訴，均需經對方當事人同意。C選項、D選項正確。"}, {"id": "卷一-25", "subject": "卷一", "type": "單選題", "question": "對於下列民事案件的管轄法院，哪一選項是正確的？（　）", "options": [{"key": "A", "text": "北京市朝陽區法院審理一專利案件"}, {"key": "B", "text": "上海市浦東新區法院審理一重大涉外案件"}, {"key": "C", "text": "廣東省高級法院審理其認為應當由自己審理的案件"}, {"key": "D", "text": "最高人民法院審理在全國範圍內有重大影響的案件"}], "answer": ["D"], "explanation_full": "9 在本轄區內有重大影響的案件，故C選項表述錯誤，不當選。D選項中，最高人民法院管轄在全國範圍內有重大影響的案件和其認為應當由本院審理的案件，故D選項表述正確，當選。"}, {"id": "卷一-26", "subject": "卷一", "type": "單選題", "question": "趙某對孫某享有200萬元的債權。該債權所剩的時效期間只有1個月時，趙某將對孫某享有的債權轉讓給程某，且通知了孫某。1年後，因孫某無力還款引起糾紛，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "趙某與程某之間的債權轉讓協議自通知到達孫某時生效"}, {"key": "B", "text": "趙某與程某之間的債權轉讓協議須徵得孫某同意後方能生效"}, {"key": "C", "text": "程某可對孫某行使債權請求權"}, {"key": "D", "text": "孫某可對程某的債權請求權行使時效已過的抗辯權"}], "answer": ["C"], "explanation_full": "【羿文解析】根據《民法典》第546條規定：“債權人轉讓債權,未通知債務人的,該轉讓對債務人不發生效力 。”因此債權轉讓不需經得債務人的同意，當事人之間意思表示一致，債權轉讓協議即成立生效，通知即對債務人發生效力。趙某與程某之間的債權轉讓協議自雙方意思表示一致時即可成立生效，自通知到達孫某時 ，債權轉讓對債務人孫某發生效力。因此，A、B選項錯誤，不當選。《訴訟時效規定》第17條第1款規定 ：“債權轉讓的，應當認定訴訟時效從債權轉讓通知到達債務人之日起中斷。”趙某於200萬元債權還剩1個月的訴訟時效時將該債權轉讓並通知了債務人孫某，此時200萬元債權訴訟時效中斷，之前已經過的訴訟時效期間失去效力，須重新開始計算3年的訴訟時效，因此，自通知到達孫某起1年後，訴訟時效期間尚未經過 ，新債權人程某可對孫某行使債權請求權。C選項正確，當選；D選項錯誤，不當選。"}, {"id": "卷一-27", "subject": "卷一", "type": "單選題", "question": "甲公司分別向乙丙丁銀行借款，並用自己的一輛汽車依次與三個銀行簽訂抵押合同。其中乙和丙銀行的抵押合同沒有辦理登記，而與丁辦理了抵押登記。後甲又將同一輛汽車質押給戊，並簽訂質押合同，並將自己汽車交付給戊。關於本案，下列哪一選項是正確的？", "options": [{"key": "A", "text": "乙對甲的汽車沒有抵押權"}, {"key": "B", "text": "甲與丙之間的抵押合同無效"}, {"key": "C", "text": "如果甲到期不能清償債務，則丁對該汽車優先於乙和丙的債權清償"}, {"key": "D", "text": "如果甲到期不能清償債務，則戊可以對於汽車優於丁得到清償"}], "answer": ["C"], "explanation_full": "【羿文解析】本題考查的是抵押權、質押權的設立和生效問題。 首先，抵押合同是一個債權，只要簽訂抵押合同，登記與否不影響抵押合同的生效；其次，由於汽車是動產 ，即使不登記，也有抵押權，故A項和B項錯誤；由於乙和丙的抵押權沒有登記，所以不能對抗善意第三人 ，此時第三人包括登記的抵押權人和質押權人，故C項是正確的；由於登記的抵押權在先，而質押權成立在後 ，那麼抵押權優先質押權，故D項是錯誤的。"}, {"id": "卷一-28", "subject": "卷一", "type": "單選題", "question": "甲、乙、丙、丁共有1套房屋，各占1/4,對共有房屋的管理沒有進行約定。甲、乙、丙未經丁同意，以全體共有人的名義將該房屋■租給戊。關於甲、乙、丙上述行為對丁的效力的依據，下列哪一表述是正確的 ？（）", "options": [{"key": "A", "text": "有效，出租屬於對共有物的管理，各共有人都有管理的權利"}, {"key": "B", "text": "有效，對共有物的處分應當經占共有份額2/3以上的共有人的同意，出租行為較處分為輕，當然可以為之"}, {"key": "C", "text": "無效，對共有物的出租屬於處分，應當經全體共有人的同意"}, {"key": "D", "text": "有效，出租是以利用的方法增加物的收益，可以視為改良行為，經占共有份額2/3以上的共有人的同意即可"}], "answer": ["B"], "explanation_full": "【羿文解析】管理，是指對共有物自身進行日常的照看、維護；處分，是指導致物權效果的行為，包括改變共有物權屬的出賣及設立物權負擔的行為，如設立抵押等；改良，是指通過對標的物進行物質性的實質改造以使其增值的行為。甲、乙、丙，以全體共有人的名義將該房屋出租給戊，顯然不屬於改良行為；由於甲、 10 理共有的不動產或者動產；沒有約定或者約定不明確的，各共有人都有管理的權利和義務。《民法典》第 301條規定，處分共有的不動產或者動產以及對共有的不動產或者動產作重大修繕、變更性質或者用途的，應當經占份額2／3以上的按份共有人或者全體共同共有人同意，但是共有人之間另有約定的除外。按照舉重以明輕規則，對共有物的處分應當經占共有份額2／3以上的按份共有人的同意，出租行為較處分為輕，現經占共有份額3／4以上的按份共有人的同意，當然可以出租，所以，B選項正確。綜上，本題正確答案為B。"}, {"id": "卷一-29", "subject": "卷一", "type": "單選題", "question": "甲、乙、丙擬共同出資50萬元設立一有限公司。公司成立後，在其設置的股東名冊中記載了甲乙丙3人的姓名與出資額等事項，但在辦理公司登記時遺漏了丙，使得公司登記的文件中股東只有甲乙2人。下列哪一說法是正確的？（　　）", "options": [{"key": "A", "text": "丙不能取得股東資格"}, {"key": "B", "text": "丙取得股東資格，但不能參與當年的分紅"}, {"key": "C", "text": "丙取得股東資格，但不能對抗第三人"}, {"key": "D", "text": "丙不能取得股東資格，但可以參與當年的分紅"}], "answer": ["C"], "explanation_full": "【羿文解析】《公司法》第32條第2款和第3款規定：記載於股東名冊的股東，可以依股東名冊主張行使股東權利。公司應當將股東的姓名或者名稱向公司登記機關登記；登記事項發生變更的，應當辦理變更登記。未經登記或者變更登記的，不得對抗第三人。股東名冊具有證明股東資格的推定效力，本題中，公司設置的股東名冊中記載了甲乙丙3人的姓名與出資額等事項，故應確認丙的股東資格。但不能以此對抗第三人，因為公司登記具有對抗第三人的效力，而該公司登記文件中遺漏了丙，因此，丙作為公司股東的事實只在公司內部有效，不能對抗第三人。選項C正確。"}, {"id": "卷一-30", "subject": "卷一", "type": "單選題", "question": "2017年12月8日，張三、李四、王五共同出資成立英華裝飾有限公司。2018年6月8日，李四不幸因病去世 ，李四之妻華曉文欲繼承李四名下的股權，張三、王五主張優先購買該股權。關於繼承問題，該公司章程沒有規定，下列哪一選項是錯誤的？（）", "options": [{"key": "A", "text": "李四之妻華曉文能夠依法繼承李四的股東資格"}, {"key": "B", "text": "李四之妻華曉文繼承李四的股東資格需要張三、王五一致同意"}, {"key": "C", "text": "張三、王五不能主張優先購買權"}, {"key": "D", "text": "如公司章程規定繼承時有優先購買權，則張三、王五能主張優先購買權"}], "answer": ["B"], "explanation_full": "【羿文解析】《公司法》第75條規定：“自然人股東死亡後，其合法繼承人可以繼承股東資格；但是，公司章程另有規定的除外。”A選項正確，B選項錯誤。 《公司法解釋（四）》第16條規定：“有限責任公司的自然人股東因繼承發生變化時，其他股東主張依據公司法第七十一條第三款規定行使優先購買權的，人民法院不予支持，但公司章程另有規定或者全體股東另有約定的除外。”C、D選項正確。"}, {"id": "卷一-31", "subject": "卷一", "type": "單選題", "question": "李某委託趙某去A市購買一級菜籽油20斤，但趙某到達目的地後的第二天就因為生病住院。此時，恰逢李某的手機被偷，趙某無法及時與李某取得聯繫。為避免錯過購買時機，趙某委託外行人張某購買菜籽油20斤 。後李某得知此事，明確表示反對趙某擅自轉委託。張某在購買時，被商家欺詐，誤買了20斤劣質菜籽油。 下列表述哪一選項是正確的？（　）", "options": [{"key": "A", "text": "張某應和趙某共同承擔責任"}, {"key": "B", "text": "張某可以撤銷其簽訂的合同"}, {"key": "C", "text": "李某可以撤銷其簽訂的合同"}, {"key": "D", "text": "張某對損失應承擔責任"}], "answer": ["C"], "explanation_full": "11 就第三人的選任以及對第三人的指示承擔責任。轉委託代理未經被代理人同意或者追認的，代理人應當對轉委託的第三人的行為承擔責任；但是，在緊急情況下代理人為了維護被代理人的利益需要轉委託第三人代理的除外。”“緊急情況”主要是指委託代理人生病、通訊聯絡中斷等情況。本題中，趙某因自己生病，為了李某的利益而將李某委託事項轉託於張某，符合轉代理的規定，轉代理關係成立。在該轉代理關係中，趙某不存在選任和指示上的過錯，注意，雖然趙某選任了外行人張某，但張某是因商家的欺騙才誤買了劣質菜籽油的。同時，張某對損失的造成也不存在過錯，所以該損失應由被代理人李某承擔。故A、D錯誤。B、C選項 ，代理人訂立合同時，遭受欺詐的，代理人不享有撤銷權，撤銷權歸被代理人享有，故B選項錯誤，C選項正確，當選。"}, {"id": "卷一-32", "subject": "卷一", "type": "單選題", "question": "甲從乙處購得一台機器，使用不久即損壞，甲認為機器的某部件有問題。遂起訴要求乙賠償損失。乙則稱 ，該部件的工藝沒有問題，如果該部件有質量問題，也是由於丙提供的鋼材質量存在問題。則下列關於丙在本案中訴訟地位的說法中正確的是：（）", "options": [{"key": "A", "text": "應當追加為必要共同訴訟被告"}, {"key": "B", "text": "應列為無獨立請求權的第三人"}, {"key": "C", "text": "應列為有獨立請求權的第三人"}, {"key": "D", "text": "應列為普通共同訴訟被告"}], "answer": ["B"], "explanation_full": "【羿文解析】考查無獨立請求權第三人。根據《民事訴訟法》第56條第2款的規定，對當事人雙方的訴訟標的 ，第三人雖沒有獨立請求權，但案件處理結果同他有法律上的利害關係的，可以申請參加訴訟，或者由人民法院通知他參加訴訟。本案中，丙與甲、乙的訴訟標的無關。但與案件的處理結果有法律上的利害關係，一旦乙敗訴就可能向丙索賠，故丙為無獨立請求權的第三人。"}, {"id": "卷一-33", "subject": "卷一", "type": "單選題", "question": "根據《民事訴訟法》及相關司法解釋的規定，下列有關延期審理、訴訟中止、訴訟終結的表述中，哪一選項是正確的？（　）", "options": [{"key": "A", "text": "追索贍養費的案件一方當事人死亡，應裁定訴訟中止"}, {"key": "B", "text": "合同糾紛中作為一方當事人的公司在案件審理過程中與其他公司合併，應裁定訴訟中止"}, {"key": "C", "text": "侵權案件的審理必須以一未審結的刑事案件的審理結果為依據，應裁定訴訟終結"}, {"key": "D", "text": "離婚案件中必須到庭的當事人有正當理由沒有到庭的，應裁定延期審理"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《民事訴訟法》第151條的規定，追索贍養費的案件一方當事人死亡的，適用訴訟終結，適用文書為裁定書。故A選項表述錯誤，不當選。根據《民事訴訟法》第150條的規定，作為一方當事人的法人或其他組織終止，尚未確定權利義務承受人的，以及本案必須以另一案審理結果為依據而另一案尚未審結的 ，均適用中止訴訟，適用文書為裁定書。故B選項表述正確，當選，C選項表述錯誤，不當選。根據《民事訴訟法》第146條的規定，必須到庭的當事人有正當理由沒有到庭的，可適用延期審理，但延期審理適用決定書 ，而不是裁定書。故D選項表述錯誤，不當選。"}, {"id": "卷一-34", "subject": "卷一", "type": "單選題", "question": "甲公司和乙公司簽訂了買賣合同，約定由甲公司向乙公司提供一批醫療設備。雙方約定採用CIP2020術語規範雙方之間的合同。甲公司和乙公司分別位於《聯合國國際銷售合同公約》的兩個締約國。甲公司在發貨前發現乙公司瀕臨破產，遂決定不再發貨。下列說法正確的是：（）", "options": [{"key": "A", "text": "甲公司有義務為該批貨物購買保險"}, {"key": "B", "text": "如無特別約定，甲公司應該購買平安險"}, {"key": "C", "text": "即使乙公司提供了充分的擔保，甲公司仍舊可以拒絕繼續履約"}, {"key": "D", "text": "應當根據公約解決該合同的效力問題"}], "answer": ["A"], "explanation_full": "【羿文解析】選項A正確。A項考察的是購買保險的義務。根據口訣“帶I的有義務（賣方）”，也就是說帶有 I的術語CIP和CIF下，賣方有購買保險的義務。甲公司是本題中的賣方，具有購買保險的義務。 12 選項B錯誤。根據2020版術語的規定。如無特別約定，CIP術語下賣方應當購買的險種是“一切險”。CIF術語下賣方應當購買的險種是平安險。這是新版術語的重大改動，大家一定注意。 選項C錯誤。本題中的描述屬於該公約中的預期違約制度，在這一制度下。如果買方提供了合適的擔保，賣方應當繼續履行合同，所以C項錯誤。 選項D錯誤。該公約本身並不解決三個問題：（1）合同的效力；（2）所有權；（3）賣方對於貨物對任何人所造成的死亡或傷害的責任。所以合同效力是無法依據該公約進行解決的。"}, {"id": "卷一-35", "subject": "卷一", "type": "單選題", "question": "為開拓市場需要，個人獨資企業主曾水決定在某市設立一個分支機構，委託朋友霍火為分支機構負責人。 關於霍火的權利和義務，下列哪一表述是正確的？（）", "options": [{"key": "A", "text": "應承擔該分支機構的民事責任"}, {"key": "B", "text": "可以從事與企業總部相競爭的業務"}, {"key": "C", "text": "可以將自己的貨物直接出賣給分支機構"}, {"key": "D", "text": "經曾水同意可以分支機構財產為其弟提供抵押擔保"}], "answer": ["D"], "explanation_full": "【羿文解析】根據《個人獨資企業法》第14條第3款的規定，分支機構的民事責任由設立該分支機構的個人獨資企業承擔。選項A錯誤。根據《個人獨資企業法》第20條的規定，投資人委託或者聘用的管理個人獨資企業事務的人員不得有下列行為：……（5）擅自以企業財產提供擔保；（6）未經投資人同意，從事與本企業相競爭的業務；（7）未經投資人同意，同本企業訂立合同或者進行交易。因此，霍火從事與企業總部相競爭的業務以及將自己的貨物直接出賣給分支機構時，必須經投資人曾水同意，選項B和C錯誤。霍火不得擅自以企業財產為他人提供擔保，但經投資人曾水同意除外，故選項D正確。綜上，本題應選D。"}, {"id": "卷一-36", "subject": "卷一", "type": "單選題", "question": "小松今年10歲，屬於遊戲小天才，多次參加比賽，共得獎金50萬元。小松的母親任某用小松的獎金以小松名義購買黃金若干。不久後，黃金貶值，市價大幅下跌。關於黃金買賣合同的效力以及對小松財產損失的賠償責任，以下哪一說法是正確的", "options": [{"key": "A", "text": "小松有權就自己的財產損失請求任某賠償"}, {"key": "B", "text": "小松請求趙某賠償不受三年訴訟時效的限制"}, {"key": "C", "text": "任某以小松名義訂立的黃金買賣合同有效"}, {"key": "D", "text": "任某以小松名義訂立的黃金買賣合同無效"}], "answer": ["C"], "explanation_full": "【羿文解析】A項錯誤,監護人任某將被監護松的50萬元獎金用於為小松購買黃金，屬於監護人為被監護人小松的利益善盡監護職責的行為，任某不承擔責任。B項錯誤,被監護人對監護人因此享有的是損害賠償請求權應當適用《民法典》第188條第一款規定的三年訴訟時效期間。C項正確、D項錯誤，任某用小松所獲獎金以小松的名義訂立房屋買賣合同，屬於法定代理行為；又系為了維護被監護人小松的利益，屬於有權代理，故該有權代理訂立的黃金買賣合同有效。"}, {"id": "卷一-37", "subject": "卷一", "type": "單選題", "question": "甲在市場賣菜，突聞老婆要分娩，急忙離去，其鄰攤位的菜販乙見狀遂自作主張幫甲賣菜，並以甲標好的價格出售，獲得收入1000元。對此，下列說法不正確的是？（）", "options": [{"key": "A", "text": "乙的行為構成侵權"}, {"key": "B", "text": "乙的行為構成無因管理"}, {"key": "C", "text": "乙應當向甲轉交該1000元"}, {"key": "D", "text": "若甲歸來後，對乙的行為進行追認，則甲乙之間成立委託關係"}], "answer": ["A"], "explanation_full": "【羿文解析】依據《民法典》第979條，乙的行為構成無因管理。選項B正確，A錯誤。《民法典》第983條規定，管理人管理事務取得的財產，應當及時轉交給受益人。選項C正確。《民法典》第984條規定，管理入管理事務經受益人事後追認的，從管理事務開始時起，適用委託合同的有關規定，但是管理人另有意思表示的除外。選項D正確。故本題答案為A。 13"}, {"id": "卷一-38", "subject": "卷一", "type": "單選題", "question": "甲系小龍蝦養殖戶，其將現有的以及將有的生產設備、原材料、半成品、產品一併抵押給乙銀行，未辦理抵押登記。抵押期間，甲將養殖成熟的成品小龍蝦以合理價格出售給丙（丙知道乙銀行的抵押權），丙支付合理對價且完成交付。同時，甲將其一台運輸小龍蝦的貨車出售給丁（丁不知道乙銀行的抵押權），丁支付合理對價且完成交付。後甲不能向乙完成交付。對此，下列哪一說法是正確的", "options": [{"key": "A", "text": "因未辦理抵押登記該抵押權不成立"}, {"key": "B", "text": "乙銀行可對出售給丙的小龍蝦主張抵押權"}, {"key": "C", "text": "乙銀行不可對出售給丁的貨車主張抵押權"}, {"key": "D", "text": "丙不能取得小龍蝦的抵押權"}], "answer": ["C"], "explanation_full": "【羿文解析】A項錯誤，動產抵押權不以登記為生效要件。B項錯誤，以動產抵押的，不得對抗正常經營活動中已經支付合理價款並取得抵押財產的買受人（無論買受人是否善意）。C項正確，動產抵押權未經登記不得對抗善意第三人。D項錯誤，抵押期間，抵押人可以自由轉讓抵押物。"}, {"id": "卷一-39", "subject": "卷一", "type": "單選題", "question": "彭某年老牙齒掉落較多，遂安裝一口假牙（假牙均嵌入牙齦）。一日，王某與彭某發生爭執，王某一拳打落彭某的假牙多顆，造成彭某說話漏風，並被他人取笑，彭某對此十分痛苦。對此下列哪一說法是正確的", "options": [{"key": "A", "text": "彭某的生命健康權受到了侵害"}, {"key": "B", "text": "彭某的所有權遭受了侵害"}, {"key": "C", "text": "彭某的身體權遭受了侵害"}, {"key": "D", "text": "彭某不得可就假牙毀損向王某主張精神損害賠償"}], "answer": ["C"], "explanation_full": "【羿文解析】A項錯誤，王某的加害行為並未造成彭某生理死亡的後果，不成立對彭某生命權的侵害。B項錯誤，不能自由拆卸的假肢、假牙、義眼、心臟支架等屬於身體的組成部分，為身體權的客體，不再屬於物 （不再屬於所有權的客體）。C項正確，假牙不可自由拆卸，故構成彭某身體的組成部分，王某的加害行為破壞了彭某身體的完整，構成對彭某身體權的侵害。D項錯誤，王某侵害彭某身體權，並造成嚴重精神損害後果 ，彭某有權請求王某承擔精神損害賠償責任。"}, {"id": "卷一-40", "subject": "卷一", "type": "單選題", "question": "劉某與郭某婚後，劉某經常對郭某實施家庭暴力，郭某心理十分脆弱，同村的胡某時常上門安慰郭某，郭某對胡某逐漸產生依賴感。現郭某起訴要求離婚。對此，下列那一說法是正確？", "options": [{"key": "A", "text": "針對劉某的家庭暴力，郭某可主張損害賠償"}, {"key": "B", "text": "郭某可不離婚而要求劉某進行損害賠償"}, {"key": "C", "text": "如郭某與胡某同居，則郭某仍可要求劉某賠償"}, {"key": "D", "text": "如郭某與胡某同居，則劉某可要求郭某賠償"}], "answer": ["A"], "explanation_full": "【羿文解析】A項正確，劉某婚內對郭某實施家庭暴力，郭某在離婚時對劉某享有離婚損害賠償請求權可以要求其賠償損害。B項錯誤，離婚損害賠償請求權的前提為離婚，若郭某不主張離婚，則其不享有離婚損害賠償請求權。C、D錯誤，離婚損害賠償請求權的主體為無過錯的配偶，若郭某在婚內與胡某同居，則郭某亦存在過錯，此時無論劉某亦或郭某均不享有離婚損害賠償請求權。"}, {"id": "卷一-41", "subject": "卷一", "type": "單選題", "question": "李某有兩個孩子李承一與李承乾。李某生前立下自書遺囑，其死後全部現金由李承一繼承。李承一與金閃閃結婚，育有一子李二黑。李承一先於李某病死，金閃閃一直對李某盡到贍養義務。李承乾未婚。李某死後留下現金200萬元及房屋一套。對此，下列哪一說法是正確的", "options": [{"key": "A", "text": "金閃閃作為第一順序繼承人，李二黑則不得代位繼承"}, {"key": "B", "text": "李二黑按照遺囑代位繼承全部現金"}, {"key": "C", "text": "李二黑無權繼承房屋"}, {"key": "D", "text": "李承乾與金閃閃均為第一順序繼承人專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 14"}], "answer": ["D"], "explanation_full": "【羿文解析】A項錯誤，根據《民法典繼承編解釋（一）》第18條：喪偶兒媳對公婆、喪偶女婿對岳父母，無論其是否再婚，依照民法典第一千一百二十九條規定作為第一順序繼承人時，不影響其子女代位繼承。B項錯誤，代位繼承僅適用於法定繼承，不適用於遺囑繼承。C項錯誤，李二黑為代位繼承人有權繼承房屋。D項正確，李承乾作為李某的子女屬於第一順位繼承人，金閃閃作為盡到贍養義務的喪偶兒媳也是第一順位繼承人 。"}, {"id": "卷一-42", "subject": "卷一", "type": "單選題", "question": "黃河公司將李某派遣到長江銀行當保安，李某脾氣暴躁經常愛與老年人發生爭吵，長江銀行多次要求黃河公司對李某進行教育，黃河公司均不予理會，某日，顧客楊某不慎弄倒李某最愛吃的小熊餅乾，李某遂將楊某推倒在地，楊某小腿骨折。對此，下列哪一說法是正確的？", "options": [{"key": "A", "text": "黃河公司與長江公司承擔連帶責任"}, {"key": "B", "text": "長江公司承擔賠償責任，黃河公司承擔補充責任"}, {"key": "C", "text": "長江公司承擔賠償責任，黃河公司承擔與其過錯相應的責任"}, {"key": "D", "text": "長江公司與李某承擔連帶責任"}], "answer": ["C"], "explanation_full": "【羿文解析】C項正確，被派遣的工作人員李某因執行工作任務致楊某損害，用工單位長江銀行應當對楊某承擔無過錯的替代責任；派遣單位黃河公司有過錯，應承擔與其過錯相應的責任；有過錯的李某不對外承擔連帶責任。"}, {"id": "卷一-43", "subject": "卷一", "type": "單選題", "question": "甲公司與乙公司簽訂貨物買賣合同，約定乙公司向甲公司出售一批水果，由丙公司進行運輸，乙公司支付運費。甲、乙公司買賣合同的合同履行地是？（）", "options": [{"key": "A", "text": "甲公司所在地"}, {"key": "B", "text": "乙公司所在地"}, {"key": "C", "text": "乙公司向丙公司交付貨物之地"}, {"key": "D", "text": "丙公司向甲公司交付貨物之地"}], "answer": ["C"], "explanation_full": "【羿文解析】本題涉及債的履行地點問題。由乙公司支付運費，並不意味著乙公司交付貨物的債務為赴償之債，因此合同對合同履行地並無約定。甲、乙簽訂的是買賣合同，《民法典》第603條應優先《民法典》第 510條適用。根據《民法典》第603條第2款第1項，當事人沒有約定交付地點或者約定不明確，依據《民法典 》第510條的規定仍不能確定的。適用下列規定．標的物需要運輸的．出賣人應當將標的物交付給第一承運人以運交給買受人。因此貨交第一承運人時的地點為貨物的交付地點，即合同履行地點。故本題答案為C。"}, {"id": "卷一-44", "subject": "卷一", "type": "單選題", "question": "關於法人、法定代表人及設立人責任問題．下列說法正確的是？（）", "options": [{"key": "A", "text": "一聯公司公司章程規定，法定代表人不得對外簽署超過4000萬元的合同，某日，法定代表人簽訂了總標的 5億元的合同，對此，需要法人追認，否則法人不承擔責任"}, {"key": "B", "text": "乙公司的法定代表人在簽訂某技術合同中由於個人原因構成了對於丙公司的發明專利權的侵犯，對此，責任應當由乙公司承擔，法定代表人不需要承擔個人責任"}, {"key": "C", "text": "甲、乙、丙三人共同出資成立了戊公司。公司章程規定，如果轉讓價值超過120萬元的資產或者對外提供擔保，需要全體出資人一致同意。後來，甲、乙決定轉讓一台價值200萬元的設備，丙不同意，但是。甲、乙依然向受讓人轉讓了該設備，轉讓合同有效，丙可以請求法院撤銷轉讓資產的決議，並對於因此給自己造成的損失主張賠償"}, {"key": "D", "text": "甲、乙共同出資設立丁公司．在設立公司過程中發生的債務，由成立後的丁公司承擔，如果設立失敗，則對於因設立丁公司而產生的債務由甲、乙承擔連帶責任。在設立過程中，甲、乙以自己的名義為設立丁公司所負債務，在公司設立成功的情形下．債權人只能向丁公司主張"}], "answer": ["C"], "explanation_full": "15 由法人承受。法人章程或者法人權力機構對法定代表人代表權的限制，不得對抗善意相對人。”據此，A項中一聯公司的法定代表人雖然超越了公司章程限制．但是，如果第三人不知道內部限制的，直接就有效力，不需要法人追認，故A錯誤。《民法典》第62條規定：“法定代表人因執行職務造成他人損害的，由法人承擔民事責任。法人承擔民事責任後，依照法律或者法人章程的規定，可以向有過錯的法定代表人追償。”據此 ，一般情況下．法定代表人的行為均由法人承擔責任，但是，如果法定代表人有過錯的，法人承擔責任後 ，可以向法定代表人追償，故B錯誤。《民法典》第85條規定：“營利法人的權力機構、執行機構作出決議的會議召集程序、表決方式違反法律、行政法規、法人章程，或者決議內容違反法人章程的，營利法人的出資人可以請求人民法院撤銷該決議。但是，營利法人依據該決議與善意相對人形成的民事法律關係不受影響。 ”據此，C項正確，丙可請求法院撤銷甲、乙的決議，造成損失的，可請求賠償．但不影響戊公司依據該決議對外與善意相對人訂立合同的效力。《民法典》第75條規定：“設立人為設立法人從事的民事活動，其法律後果由法人承受：法人未成立的，其法律後果由設立人承受，設立人為二人以上的，享有連帶債權，承擔連帶債務。設立人為設立法人以自己的名義從事民事活動產生的民事責任．第三人有權選擇請求法人或者設立人承擔。”據此，D項中認為，甲、乙以自己的名義為設立丁公司所負債務．在公司設立成功的情形下，債權人只能向丁公司主張．故D錯誤。"}, {"id": "卷一-45", "subject": "卷一", "type": "單選題", "question": "小丁作為投保人，以自己父親老丁為被保險人，買了一份意外死亡保險。針對該保險，以下哪一說法是正確的？", "options": [{"key": "A", "text": "小丁指定和變更受益人未經父親同意，法院應認定指定行為有效"}, {"key": "B", "text": "如果受益人僅約定為老丁的配偶，則根據保險合同成立時老丁的配偶確定受益人"}, {"key": "C", "text": "如果受益人約定為老丁的配偶，姓名為老馬，保險事故發生時老已與老丁離婚，那麼以事故發生時老丁的配偶來確定受益人"}, {"key": "D", "text": "若受益人指定為小丁、小丁的哥哥和老丁的妻子老馬，只約定比例受益比例為3:3:4，後小丁故意傷害老丁致其死亡，小丁的份額應由其繼承人繼承"}], "answer": ["B"], "explanation_full": "【羿文解析】A項錯誤，受益人由被保險人或投保人指定或變更；但是，如果由投保人指定、變更受益人，則需得到被保險人的同意，否則無效。B項正確，投保人與被保險人為不同主體的，根據保險合同成立時與被保險人的身份關係確定受益人。C項錯誤，受益人的約定包括姓名和身份關係，保險事故發生時身份關係發生變化的，認定為未指定受益人。D項錯誤，投保人致使被保險人死傷疾的，保險人不承擔保險責任。"}, {"id": "卷一-46", "subject": "卷一", "type": "單選題", "question": "根據《企業所得稅法》的規定，下列哪一說法是正確的？", "options": [{"key": "A", "text": "對一人公司徵個人所得稅"}, {"key": "B", "text": "非居民企業在中國境內未設立機構、場所，不徵企業所得稅"}, {"key": "C", "text": "企業納稅年度發生的虧損，准予向以後年度結轉，用以後年度的所得彌補，但結轉年限最長不得超過5年"}, {"key": "D", "text": "企業的職工社保可以在計算應納稅所得額時按比例加計扣除"}], "answer": ["C"], "explanation_full": "【羿文解析】A項錯誤，一人公司屬於企業法人，須繳納企業所得稅。B項錯誤，非居民企業在中國境內未設立機構、場所的，或者雖設立機構、場所但取得的所得與其所設機構、場所沒有實際聯繫的，應當就其來源於中國境內的所得繳納企業所得稅。C項正確，企業納稅年度發生的虧損，准予向以後年度結轉，用以後年度的所得彌補，但結轉年限最長不得超過五年。D項錯誤，企業的下列支出，可以在計算應納稅所得額時加計扣除：（一）開發新技術、新產品、新工藝發生的研究開發費用；（二）安置殘疾人員及國家鼓勵安置的其他就業人員所支付的工資。"}, {"id": "卷一-47", "subject": "卷一", "type": "單選題", "question": "下列情形中，不動產登記機關需對權利人承擔賠償責任的是？（）", "options": [{"key": "A", "text": "甲購買商品房後到不動產登記機關辦理所有權移轉登記。登記機關在審查其提交的各種材料時發現一些數據有出入。遂要求甲到指定機構進行不動產評估"}, {"key": "B", "text": "甲辦理房屋產權移轉登記，按不動產登記機關的要求提交相關材料後，登記機關以相關事實存疑需要當事專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 16 人接受詢問為由，於工作日將其召喚至辦事處致使其誤工半天"}, {"key": "C", "text": "甲、乙系兄弟，共同繼承亡父房屋一棟，但甲偽造文件將該房屋登記至自己名下．登記機關在登記過程中已盡到審查義務"}, {"key": "D", "text": "甲、乙系夫妻，正在進行離婚訴訟，婚姻存續期間兩人同住的房屋登記在了甲名下，甲欲出售該房屋，乙得知情況後，要求甲變更權利人為甲、乙，甲拒絕，登記機關遂應乙之請求給房屋作了異議登記致使正在協商的交易取消"}], "answer": ["C"], "explanation_full": "【羿文解析】本題涉及不動產登記機關的賠償責任。根據《民法典》第222條的規定，不動產登記機關在登記錯誤，給權利人造成損失時，與造成登記錯誤的人承擔不真正連帶責任。A項中登記機關要求申請人進行資產評估屬於行政違法，應承擔行政責任。B、D項中屬合法行政行為。故選C。"}, {"id": "卷一-48", "subject": "卷一", "type": "單選題", "question": "關於物業服務合同，下列說法不正確的是？（）", "options": [{"key": "A", "text": "物業服務合同應當採用書面形式"}, {"key": "B", "text": "建設單位依法與物業服務人訂立的前期物業服務合同，以及業主委員會與業主大會依法選聘的物業服務人訂立的物業服務合同，需業主簽署後方對其產生法律約束力"}, {"key": "C", "text": "物業服務人不得將其應當提供的全部物業服務轉委託給第三人，或者將全部物業服務支解後分別轉委託給第三人"}, {"key": "D", "text": "物業服務期限屆滿後，業主沒有依法作出續聘或者另聘物業服務人的決定，物業服務人繼續提供物業服務的，原物業服務合同繼續有效，但是服務期限為不定期"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《民法典》第938條第三款，物業服務合同應當採用書面形式。A項正確。根據《民法典》 第939條的規定，建設單位依法與物業服務人訂立的前期物業服務合同，以及業主委員會與業主大會依法選聘的物業服務人訂立的物業服務合同，對業主具有法律約束力。B項錯誤。根據《民法典》第941條第二款：物業服務人不得將其應當提供的全部物業服務轉委託給第三人，或者將全部物業服務支解後分別轉委託給第三人。C項正確。根據《民法典》第948第948條第一款：物業服務期限屆滿後，業主沒有依法作出續聘或者另聘物業服務人的決定，物業服務人繼續提供物業服務的，原物業服務合同繼續有效，但是服務期限為不定期。 D項正確。"}, {"id": "卷一-49", "subject": "卷一", "type": "單選題", "question": "甲明星的私人信息，包括機票行程、家庭住址、車牌號等，被黑客乙非法收集後置於丙公司的電商平台售賣。甲發現後多次採取發送郵件、撥打客服電話等方式通知丙公司，要求丙採取封鎖乙的賣家賬號，平台下架相關產品等必要措施。下列說法正確的是？（）", "options": [{"key": "A", "text": "丙有權要求甲提供相關證據，但無權要求甲提供真實身份信息"}, {"key": "B", "text": "丙接到甲的通知後。可以徑直採取必要措施"}, {"key": "C", "text": "丙後台檢測到乙的侵權行為，無需採取任何措施．也無需承擔侵權責任"}, {"key": "D", "text": "丙接到甲的通知後，無義務將通知轉送給乙"}], "answer": ["B"], "explanation_full": "【羿文解析】本題涉及網絡用戶、網絡服務提供者的侵權責任問題。根據《民法典》第1195條的規定，“網絡用戶利用網絡服務實施侵權行為的，權利人有權通知網絡服務提供者採取刪除、屏蔽、斷開鏈接等必要措施。通知應當包括構成侵權的初步證據及權利人的真實身份信息。網絡服務提供者接到通知後，應當及時將該通知轉送相關網絡用戶。並根據構成侵權的初步證據和服務類型採取必要措施；未及時採取必要措施的 ，對損害的擴大部分與該網絡用戶承擔連帶責任。權利人因錯誤通知造成網絡用戶或者網絡服務提供者損害的，應當承擔侵權責任。法律另有規定的，依照其規定”。網絡服務提供者丙有權要求甲提供真實身份信息 ，A項錯誤。丙收到甲的通知，有權採取必要措施，B項正確。丙接到甲的通知後，應當及時將該通知轉送乙 ，D項錯誤。根據《民法典》第1197條的規定，“網絡服務提供者知道或者應當知道網絡用戶利用其網絡服務侵害他人民事權益。未採取必要措施的，與該網絡用戶承擔連帶責任”。丙明知甲之侵權行為，未採取必要措施，要與乙承擔連帶責任。C項錯誤。 17"}, {"id": "卷一-50", "subject": "卷一", "type": "單選題", "question": "甲是乙公司的技術人員，負責芯片研發工作。以下說法不正確的是：（）", "options": [{"key": "A", "text": "如果甲在業餘時間利用乙公司的實驗室，研發了一種新型高壓鍋，並向乙公司支付實驗室使用費，專利申請權屬於甲"}, {"key": "B", "text": "如果甲在業餘時間研發了一種新型高壓鍋，利用乙公司的實驗室，對高壓鍋的性能進行測試，專利申請權屬於甲"}, {"key": "C", "text": "如果甲從乙公司辭職後，跳槽到丙公司。1年內，甲利用丙公司的實驗室，研發了一種新型芯片，專利申請權屬於乙公司"}, {"key": "D", "text": "如果甲從乙公司辭職後，跳槽到丙公司。1年內，甲利用丙公司的實驗室，研發了一種新型芯片，專利申請權為乙、丙公司分享"}], "answer": ["C"], "explanation_full": "【羿文解析】根據《技術合同解釋》第4條的規定，以下情形不屬於“主要利用法人或者其他組織的物質技術條件”：①對利用法人或者其他組織提供的物質技術條件，約定返還資金或者交納使用費的；②在技術成果完成後利用法人或者其他組織的物質技術條件對技術方案進行驗證、測試的。據此，A、B選。《技術合同解釋》第5條規定：“個人完成的技術成果，屬於執行原所在法人或者非法人組織的工作任務，又主要利用了現所在法人或者非法人組織的物質技術條件的，應當按照該自然人原所在和現所在法人或者非法人組織達成的協議確認權益。不能達成協議的，根據對完成該項技術成果的貢獻大小由雙方合理分享。”據此，C不選 ，D選。 多項選擇題"}, {"id": "卷一-51", "subject": "卷一", "type": "多選題", "question": "林某（男）自幼患有間歇性精神病，現年28周歲，未婚。徐某（女），現年19周歲，通過某社交軟件結識林某。兩人一見鍾情並打算結婚。林某在辦理結婚登記手續時精神正常，且答應婚後贈與徐某一套房屋，徐某欣然答應。但婚後林某精神病病發，一直沒有辦理房屋過戶登記。下列哪些選項是錯誤的？（　）", "options": [{"key": "A", "text": "由於結婚乃男女雙方所締結的身份契約，林某和徐某均已年滿18周歲，是完全民事行為能力人，結婚有效"}, {"key": "B", "text": "林某雖可以與徐某結婚，但林某答應贈與房子給徐某的行為無效"}, {"key": "C", "text": "林某不能與徐某結婚，因為林某患有間歇性精神痛"}, {"key": "D", "text": "林某不能與徐某結婚，且徐某尚未取得房屋所有權"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】A選項，根據《民法典》第1047條的規定，結婚年齡，男不得早於22周歲，女不得早於20周歲。 晚婚晚育應予鼓勵。本案中，徐某尚未達到法定年齡，故婚姻無效。故A選項錯誤，當選。 B選項，贈與合同屬於諾成合同，即雙方當事人意思表達一致時，贈與合同成立並生效。本案中，林某贈與徐某房屋時精神正常，贈與行為是其真實意思表示，贈與的行為有效。故B選項錯誤，當選。 C選項，根據《民法典》第1048條規定，直系血親或者三代以內的旁系血親禁止結婚。林某與徐某不能結婚的原因在於徐某未達法定年齡，而非因為林某患有間歇性精神病。故C選項錯誤，當選。 D選項，根據《民法典》第659條的規定，贈與的財產依法需要辦理登記等手續的，應當約定辦理有關手續的內容。本案中贈與合同雖然有效，但因為房屋尚未辦理過戶登記，徐某未能取得房屋所有權。故D選項正確 ，不當選。"}, {"id": "卷一-52", "subject": "卷一", "type": "多選題", "question": "依據我國《民事訴訟法》及相關司法解釋的規定。關於再審程序的說法，下列哪些選項是錯誤的？", "options": [{"key": "A", "text": "在再審中，當事人提出新的訴訟請求的，原則上法院應根據自願原則進行調解，調解不成的告知另行起訴"}, {"key": "B", "text": "在再審中，當事人增加訴訟請求的，原則上法院應根據自願原則進行調解，調解不成的裁定發回重審"}, {"key": "C", "text": "按照第一審程序再審案件時，經法院許可原審原告可撤回起訴，且撤回起訴後，不影響再次起訴"}, {"key": "D", "text": "在一定條件下，案外人可申請再審"}], "answer": ["A", "B", "C"], "explanation_full": "18 及原審其他當事人在庭審辯論結束前提出的再審請求，符合《民事訴訟法》第205條規定的，人民法院應當一併審理。人民法院經再審，發現已經發生法律效力的判決、裁定損害國家利益、社會公共利益、他人合法權益的，應當一併審理。因此，A、B項錯誤。 根據《民事訴訟法解釋》第410條的規定，一審原告在再審審理程序中申請撤回起訴，經其他當事人同意，且不損害國家利益、社會公共利益、他人合法權益的，人民法院可以准許。裁定准許撤訴的，應當一併撤銷原判決。一審原告在再審審理程序中撤回起訴後重複起訴的，人民法院不予受理。因此，C項錯誤。 根據《民事訴訟法解釋》第422條的規定，必須共同進行訴訟的當事人因不能歸責於本人或者其訴訟代理人的事由未參加訴訟的，可以根據《民事訴訟法》第200條第8項規定，自知道或者應當知道之日起6個月內申請再審，但符合《民事訴訟法解釋》第423條規定情形的除外。人民法院因前款規定的當事人申請而裁定再審，按照第一審程序再審的，應當追加其為當事人，作出新的判決、裁定；按照第二審程序再審，經調解不能達成協議的，應當撤銷原判決、裁定，發回重審，重審時應追加其為當事人。 又根據《民事訴訟法解釋》第423條規定，根據《民事訴訟法》第227條規定，案外人對駁回其執行異議的裁定不服，認為原判決、裁定、調解書內容錯誤損害其民事權益的，可以自執行異議裁定送達之日起6個月內 ，向作出原判決、裁定、調解書的人民法院申請再審。因此，D項說法正確。本題答案為ABC。"}, {"id": "卷一-53", "subject": "卷一", "type": "多選題", "question": "人民法院受理了一涉及澳門公司的爭議，需要向該澳門公司送達文書，依2009年《最高人民法院關於涉港澳民商事案件司法文書送達問題若干規定》，下列哪些選項是正確的？（　）", "options": [{"key": "A", "text": "該澳門公司在內地有代表機構的，人民法院可以直接向代表機構送達"}, {"key": "B", "text": "該澳門公司在內地有業務代辦人的，人民法院可以直接向業務代辦人送達"}, {"key": "C", "text": "法院可通過郵寄方式向澳門公司送迭，如收到澳門公司簽收的郵件回執可以視為已經送達"}, {"key": "D", "text": "法院可同時採取公告送達和傳真送達"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】根據《最高人民法院關於涉港澳民商事案件司法文書送達問題若干規定》第3條，“作為受送達人的自然人或者企業、其他組織的法定代表人、主要負責人在內地的，人民法院可以直接向該自然人或者法定代表人、主要負責人送達。”A項正確。根據第5條第2款，“受送達人在內地設立有分支機構或者業務代辦人並授權其接受送達的，人民法院可以直接向該分支機構或者業務代辦人送達。”可見，向業務代辦人送達須由受送達人授權，B項錯誤。根據第7條第2款，“郵寄送達時應附有送達回證。受送達人未在送達回證上簽收但在郵件回執上簽收的，視為送達，簽收日期為送達日期。”C項正確。根據第10條第1款，“除公告送達方式外，人民法院可以同時採取多種法定方式向受送達人送達。”可見，公告送達不能與其他方式同時採取 ，D項錯誤。"}, {"id": "卷一-54", "subject": "卷一", "type": "多選題", "question": "某省L市旅遊協會為防止零團費等惡性競爭，召集當地旅行社商定對遊客統一報價，並根據各旅行社所占市場份額，統一分配景點返佣、古城維護費返佣等收入。此計劃實施前，甲旅行社主動向反壟斷執法機構報告了這一情況並提供了相關證據。關於本案，下列哪些判斷是錯誤的？（　　）", "options": [{"key": "A", "text": "旅遊協會的行為屬於正當的行業自律行為"}, {"key": "B", "text": "由於尚未實施，旅遊協會的行為不構成壟斷行為"}, {"key": "C", "text": "如構成壟斷行為，L市發改委可對其處以50萬元以下的罰款"}, {"key": "D", "text": "如構成壟斷行為，對甲旅行社可酌情減輕或免除處罰"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】根據《反壟斷法》第13條第1款的規定：“禁止具有競爭關係的經營者達成下列壟斷協議：（一 ）固定或者變更商品價格；……（三）分割銷售市場或者原材料采購市場；……”又根據該法第16條的規定 ，行業協會不得組織本行業的經營者從事本章禁止的壟斷行為。旅遊協會對遊客統一報價，固定價格，屬於上述法律規定禁止的壟斷行為，故A、B兩項錯誤。根據《反壟斷法》第46條的規定，經營者違反本法規定 19 罰。行業協會違反本法規定，組織本行業的經營者達成壟斷協議的，反壟斷執法機構可以處50萬元以下的罰款；情節嚴重的，社會團體登記管理機關可以依法撤銷登記。據此，達成壟斷協議的，由反壟斷執法機構對行業協會處以罰款，而不是發改委，故C項說法錯誤。由於甲旅行社主動向反壟斷執法機構報告達成壟斷協議的有關情況並提供重要證據，故D項說法正確。"}, {"id": "卷一-55", "subject": "卷一", "type": "多選題", "question": "我國對建設項目的環境影響評價實行分類管理制度。根據《環境影響評價法》的規定，下列哪些說法是正確的？（　　）", "options": [{"key": "A", "text": "可能造成重大環境影響的建設項目，應當編製環境影響報告書，對產生的環境影響進行全面評價"}, {"key": "B", "text": "可能造成輕度環境影響的建設項目，應當編製環境影響報告表，對產生的環境影響進行分析或者專項評價"}, {"key": "C", "text": "環境影響很小的建設項目，不需要進行環境影響評價，無需填報環境影響評價文件"}, {"key": "D", "text": "建設單位具備環境影響評價技術能力的，可以自行對其建設項目開展環境影響評價"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】根據《環境影響評價法》第16條的規定，國家根據建設項目對環境的影響程度，對建設項目的環境影響評價實行分類管理。建設單位應當按照下列規定組織編製環境影響報告書、環境影響報告表或者填報環境影響登記表：（1）可能造成重大環境影響的，應當編製環境影響報告書，對產生的環境影響進行全面評價；（2）可能造成輕度環境影響的，應當編製環境影響報告表，對產生的環境影響進行分析或者專項評價 ；（3）對環境影響很小、不需要進行環境影響評價的，應當填報環境影響登記表。故AB說法正確，C說法錯誤。D項說法正確，根據《環境影響評價法》第19條第1款的規定，建設單位具備環境影響評價技術能力的 ，可以自行對其建設項目開展環境影響評價，編製建設項目環境影響報告書、環境影響報告表。故本題正確答案為ABD。"}, {"id": "卷一-56", "subject": "卷一", "type": "多選題", "question": "女青年牛某因在一檔電視相親節目中言詞犀利而受到觀眾關注，一時應者如雲。有網民對其發動“人肉搜索”，在相關網站首次披露牛某的曾用名、兒時相片、家庭背景、戀愛史等信息，並有人在網站上捏造牛某曾與某明星有染的情節。關於網民的行為，下列哪些說法是正確的？（）", "options": [{"key": "A", "text": "侵害牛某的姓名權"}, {"key": "B", "text": "侵害牛某的肖像權"}, {"key": "C", "text": "侵害牛某的隱私權"}, {"key": "D", "text": "侵害牛某的名譽權"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】《民法典》第1012條規定：“自然人享有姓名權，有權依法決定、使用、變更或者許可他人使用自己的姓名，但是不得違背公序良俗。”《民法典》第1014條規定：“任何組織或者個人不得以干涉、盜用、假冒等方式侵害他人的姓名權或者名稱權。”本題中，並沒有侵犯牛某的姓名權，選項A錯誤。《民法典 》第1019條規定：“任何組織或者個人不得以醜化、污損，或者利用信息技術手段偽造等方式侵害他人的肖像權。未經肖像權人同意，不得製作、使用、公開肖像權人的肖像，但是法律另有規定的除外。未經肖像權人同意，肖像作品權利人不得以發表、複製、發行、出租、展覽等方式使用或者公開肖像權人的肖像。”本題中，網站未經牛某的同意，擅自公開其肖像，侵犯了牛某的肖像權。選項B正確。《民法典》第1025條規定 ：“行為人為公共利益實施新聞報道、輿論監督等行為，影響他人名譽的，不承擔民事責任，但是有下列情形之一的除外：（一）捏造、歪曲事實；（二）對他人提供的嚴重失實內容未盡到合理核實義務；（三）使用侮辱性言辭等貶損他人名譽。”本題中，捏造牛某曾與某明星有染的情節屬於侵犯名譽權的行為，選項D正確。《民法典》第1032條規定：“自然人享有隱私權。任何組織或者個人不得以刺探、侵擾、泄露、公開等方式侵害他人的隱私權。隱私是自然人的私人生活安寧和不願為他人知曉的私密空間、私密活動、私密信息 。”本題中，網站首次披露牛某的曾用名、兒時相片、家庭背景、戀愛史等個人信息，應屬於侵犯隱私權的行為，選項C正確。因此本題正確答案為BCD。"}, {"id": "卷一-57", "subject": "卷一", "type": "多選題", "question": "孫某從某超市買回的跑步機在使用中出現故障並致其受傷。經■詢得知，該型號跑步機數年前已被認定為不合格產品，超市從總經銷商煌煌商貿公司依正規渠道進貨。下列哪些選項是正確的？（　　） 20", "options": [{"key": "A", "text": "孫某有權向該跑步機生產商索賠"}, {"key": "B", "text": "孫某有權向煌煌商貿公司、超市索賠"}, {"key": "C", "text": "超市向孫某賠償後，有權向該跑步機生產商索賠"}, {"key": "D", "text": "超市向孫某賠償後，有權向煌煌商貿公司索賠"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】根據《產品質量法》第46條的規定，本法所稱缺陷，是指產品存在危及人身、他人財產安全的不合理的危險；產品有保障人體健康和人身、財產安全的國家標準、行業標準的，是指不符合該標準。題中的不合格產品一般是指不符合國家標準或行業標準，因而屬於產品缺陷。根據《產品質量法》第42、43條的規定，由於銷售者的過錯使產品存在缺陷，造成人身、他人財產損害的，銷售者應當承擔賠償責任。銷售者不能指明缺陷產品的生產者也不能指明缺陷產品的供貨者的，銷售者應當承擔賠償責任。因產品存在缺陷造成人身、他人財產損害的，受害人可以向產品的生產者要求賠償，也可以向產品的銷售者要求賠償。屬於產品的生產者的責任，產品的銷售者賠償的，產品的銷售者有權向產品的生產者追償。屬於產品的銷售者的責任，產品的生產者賠償的，產品的生產者有權向產品的銷售者追償。本題屬於產品缺陷責任，故孫某既可以向生產者也可以向銷售者要求賠償，故A、B項正確。由於缺陷不是超市造成的，故超市賠償後可以向其供貨者或直接向生產者索賠，C、D項正確。"}, {"id": "卷一-58", "subject": "卷一", "type": "多選題", "question": "甲乙丙三人合夥開辦“麗都酒樓”，依法登記，鄧某帶孩子鄧某某（9歲）到該酒樓吃飯，酒樓清潔工張某給地板打蠟，導致地板濕滑，鄧某某不慎摔傷，欲通過訴訟解決損害賠償問題。關於本案當事人。下列說法正確的是（　）", "options": [{"key": "A", "text": "本案應以鄧某某為原告"}, {"key": "B", "text": "本案中應以鄧某作為原告"}, {"key": "C", "text": "本案應以麗都酒樓為被告"}, {"key": "D", "text": "本案應以甲乙丙三人為共同被告"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】首先，關於原告，本案受害人是孩子鄧某某，同時由於自然人訴訟權利能力始於出生，終於死亡，所以鄧某某雖未成年，但仍然具有訴訟權利能力，應當以其本人作為原告。只是因為鄧某某尚未成年 ，不具有訴訟行為能力，不能親自參與訴訟，需要鄧某作為其法定代理人代為參加訴訟，但鄧某的訴訟地位為原告的法定代理人，並不是原告，所以A選項正確，B選項錯誤。其次，關於被告，張某作為雇員侵權，只能以其雇主為被告。“麗都酒樓”作為其他組織，需要“依法登記，並領取營業執照”之後才具有訴訟權利能力，而本案中，其尚未領取營業執照，不具有訴訟權利能力，應當視為個人合夥，以全體合夥人（即甲、 乙、丙三人）為共同被告，所以C選項錯誤，D選項正確。綜上，本題答案為AD。"}, {"id": "卷一-59", "subject": "卷一", "type": "多選題", "question": "工程師王某在甲公司的職責是研發電腦鼠標。下列哪些說法是錯誤的？（）", "options": [{"key": "A", "text": "王某利用業餘時間研發的新鼠標的專利申請權屬於甲公司"}, {"key": "B", "text": "如王某沒有利用甲公司物質技術條件研發出新鼠標，其專利申請權屬於王某"}, {"key": "C", "text": "王某主要利用了單位物質技術條件研發出新型手機，其專利申請權屬於王某"}, {"key": "D", "text": "如王某辭職後到乙公司研發出新鼠標，其專利申請權均屬於乙公司"}], "answer": ["B", "C", "D"], "explanation_full": "21 承擔的本職工作或者原單位分配的任務有關的發明創造。專利法第六條所稱本單位，包括臨時工作單位；專利法第六條所稱本單位的物質技術條件，是指本單位的資金、設備、零部件、原材料或者不對外公開的技術資料等。”在A選項中，王某雖利用業餘時間研發新鼠標，但王某在公司的職責就是研發鼠標，屬於在本職工作中作出的發明創造，應為職務發明創造，專利申請權屬於甲公司。所以，A選項正確，不選。B選項的道理同A，雖然王某沒有利用甲公司物質技術條件研發出新鼠標，但研發鼠標仍是其職責，是執行甲公司的任務 ，在本職工作中完成研發，因此專利申請權仍屬於甲公司。所以B選項錯誤。在C選項中，只要主要是利用本單位的物質技術條件所完成的發明創造，均為職務發明創造，該新型手機的專利申請權也屬於甲公司。所以 ，C選項錯誤。在D選項中，若王某在辭職後的1年內研發出新鼠標，其專利申請權仍屬於甲公司，選項中並未交代時間界限，所以，D選項錯誤。綜上，本題答案為BCD。 【陷阱】本題區分是否是職務發明的兩個關鍵：一是是否屬於職責範圍內，二是是否利用了單位的物質技術條件。雖然A項是業餘時間，但仍屬於其職責範圍內，C項雖然是職責範圍外，但是主要利用了單位的物質技術條件。所以二者都屬於職務發明。"}, {"id": "卷一-60", "subject": "卷一", "type": "多選題", "question": "某企業因不能清償到期債務而申請破產重整，重整過程中，企業決定採取裁員措施。下列說法中，符合《 勞動合同法》規定的有哪些？（　）", "options": [{"key": "A", "text": "員工李某認為企業應當提前30日向工會或者全體職工說明情況並聽取他們的意見"}, {"key": "B", "text": "員工王某認為自己自入職之日起滿1年，單位未與其簽訂書面勞動合同，單位在裁員時，應當優先留用自己"}, {"key": "C", "text": "員工趙某認為單位需要召集職工代表大會，對裁員方案進行表決，在裁員方案公布後，應當允許被裁員人員提出異議"}, {"key": "D", "text": "員工楊某認為，如果對公司的裁員決定不服提起訴訟的，工會應當依法提供幫助和支持"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】《勞動合同法》第41條第1款規定：“有下列情形之一，需要裁減人員二十人以上或者裁減不足二十人但占企業職工總數百分之十以上的，用人單位提前三十日向工會或者全體職工說明情況，聽取工會或者職工的意見後，裁減人員方案經向勞動行政部門報告，可以裁減人員：（一）依照企業破產法規定進行重整的；……”據此，A項正確。裁員方案由用人單位單方決定，並不需要由公司職工代表大會表決，法律也未規定勞動者的異議權，故C項錯誤。《勞動合同法》第41條第2款規定：“裁減人員時，應當優先留用下列人員：（一）與本單位訂立較長期限的固定期限勞動合同的；（二）與本單位訂立無固定期限勞動合同的 ；（三）家庭無其他就業人員，有需要扶養的老人或者未成年人的。”《勞動合同法》第14條第3款規定 ：“用人單位自用工之日起滿一年不與勞動者訂立書面勞動合同的，視為用人單位與勞動者已訂立無固定期限勞動合同。”據此，可以認為B項中的王某已經與企業簽訂了無固定期限勞動合同，在裁員時應當被優先留用，B項正確。《勞動法》第30條規定：“用人單位解除勞動合同，工會認為不適當的，有權提出意見。如果用人單位違反法律、法規或者勞動合同，工會有權要求重新處理；勞動者申請仲裁或者提起訴訟的，工會應當依法給予支持和幫助。”據此，D項正確。"}, {"id": "卷一-61", "subject": "卷一", "type": "多選題", "question": "關於國際域外取證，下列哪些說法是錯誤的？", "options": [{"key": "A", "text": "請求調取的證據不僅限於司法程序的證據"}, {"key": "B", "text": "美國駐華使領館可以直接向中國公民送達司法文書"}, {"key": "C", "text": "我國原則上不允許特派員取證，特殊情況下可特許"}, {"key": "D", "text": "未經主管機關准許，外國當事人或訴訟代理人不得在我國自行取證"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】委託方向另一締約方請求調取的證據僅限於用於司法程序的證據，故A項錯誤。 外交人員或領事取證，即一國司法機關通過該國派駐他國的領事或外交官員在其駐在國直接調查證據。我國法律規定，外國駐華使領館可以向我國領域內該國公民調查取證，但不得違反我國法律，並不得採取強制措施。美國駐華使領館可以直接向本國公民送達司法文書而非中國公民。故B項錯誤。 特派員取證，受理訴訟的法院委派官員直接在外國領土上調取證據。我國原則上不允許此種方式，但在特殊情況下可特許外國特派員來華取證。故C項正確。 22 當事人或訴訟代理人自行取證的方式主要存在於一些普通法國家，大多數國家對之持否定態度。我國法律規定。未經我國主管機關准許，任何外國機關或者個人不得在我國領域內調查取證。故D項正確。"}, {"id": "卷一-62", "subject": "卷一", "type": "多選題", "question": "縣級以上人民政府城鄉規劃主管部門對城鄉規劃的實施情況進行監督檢查時，有權採取以下哪些措施 ？（　）", "options": [{"key": "A", "text": "要求有關單位提供與監督事項有關的文件，並進行複製"}, {"key": "B", "text": "根據需要進入現場進行勘測"}, {"key": "C", "text": "發現城鄉規劃未按法律規定進行時，有權通知銀行凍結相關單位的資金"}, {"key": "D", "text": "要求有關單位就監督事項涉及的問題作出解釋"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】《城鄉規劃法》第53條規定：“縣級以上人民政府城鄉規劃主管部門對城鄉規劃的實施情況進行監督檢查，有權採取以下措施：（一）要求有關單位和人員提供與監督事項有關的文件、資料，並進行複製；（二）要求有關單位和人員就監督事項涉及的問題作出解釋和說明，並根據需要進入現場進行勘測 ；（三）責令有關單位和人員停止違反有關城鄉規劃的法律、法規的行為。城鄉規劃主管部門的工作人員履行前款規定的監督檢查職責，應當出示執法證件。被監督檢查的單位和人員應當予以配合，不得妨礙和阻撓依法進行的監督檢查活動。”可見，A、B、D選項均符合法律規定，當選。C選項不屬於法律規定可採取的措施，不當選。"}, {"id": "卷一-63", "subject": "卷一", "type": "多選題", "question": "若法國、英國均為《解決國家和他國公民間投資爭端公約》締約國。法國長萬公司擬將與英國的爭端提交根據該公約成立的解決國際投資爭端中心。對此，下列哪些選項是錯誤的？（　）", "options": [{"key": "A", "text": "該中心對該爭端行使管轄權，須以長萬公司和英國的書面同意為條件"}, {"key": "B", "text": "如英國沒有特別規定，該中心對爭端享有管轄權以用盡當地救濟為條件"}, {"key": "C", "text": "該中心可根據長萬公司的單方申請對該爭端行使管轄權"}, {"key": "D", "text": "該中心對該爭端行使管轄權後，可依爭端雙方同意的法律規則作出裁決"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】A、C、D選項，提交解決投資爭端的國際中心仲裁的條件：（1）主體：受理的爭端限於一締約國政府（東道國）與另一締約國國民（外國投資者）的爭端；但是在爭端雙方均同意的情況下，也受理東道國和受外國投資者控制的東道國法人之間的爭端；（2）性質：一締約國和另一締約國國民之間直接因投資而產生的任何法律爭端；（3）主觀：爭端雙方書面同意且同意後不得單方面撤銷；批准或加入公約本身並不等於締約國承擔了將某一特定爭端提交中心調解或仲裁的義務；（4）適用法律：①有約定適用從約定；②無約定，應適用作為爭端一方的締約國的國內法以及可適用的國際法規則；③仲裁庭在爭端雙方同意時仍可根據公平和善意原則對爭端作出裁決；④不得藉口沒有明確的法律規定或者法律規定含義不清而暫不作出裁決。 綜上可知，該中心對該爭端行使管轄權，須以長萬公司和英國的書面同意為條件；該中心不可根據長萬公司的單方申請對該爭端行使管轄權；該中心對該爭端行使管轄權後，可依爭端雙方同意的法律規則作出裁決。 故A、D選項正確，不當選。C選項錯誤，當選。 B選項，解決投資爭端的國際中心的管轄權具有排他的效力，一旦當事人同意在中心仲裁，有關爭端便屬於中心專屬管轄，而不再屬於作為爭端一方的締約國國內法管轄的範圍，也排除了投資者本國的外國保護。關於用盡當地救濟：締約國可以要求將用盡當地救濟作為該國同意依公約交付仲裁的條件。如果締約國無此要求 ，則不必以用盡當地救濟為前提，雙方即可在書面同意的基礎上將爭端提交仲裁。綜上可知，如英國沒有特別規定，該中心對爭端享有管轄權不以用盡當地救濟為條件。故B選項錯誤，當選。"}, {"id": "卷一-64", "subject": "卷一", "type": "多選題", "question": "關於《解決國家和他國國民間投資爭端公約》和依其設立的解決國際投資爭端中心，下列哪些說法是正確的？（　　）", "options": [{"key": "A", "text": "中心管轄直接因投資引起的法律爭端"}, {"key": "B", "text": "中心管轄的爭端必須是關於法律權利或義務的存在或其範圍，或是關於因違反法律義務而實行賠償的性質或限度的專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 23"}, {"key": "C", "text": "批准或加入公約本身並不等於締約國承擔了將某一特定投資爭端提交中心調解或仲裁的義務"}, {"key": "D", "text": "中心的裁決對爭端各方均具有約束力"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】根據《解決國家和他國國民間投資爭端公約》第25條規定，中心的管轄適用於締約國（或締約國指派到中心的該國的任何組成部分或機構）和另一締約國國民之間直接因投資而產生的任何法律爭端，而該項爭端經雙方書面同意提交給中心。當雙方表示同意後，不得單方面撤銷其同意。所以A、B選項正確。第 25條規定，任何締約國可以在批准、接受或認可本公約時，或在此後任何時候，把它將考慮或不考慮提交給中心管轄的一類或幾類爭端通知中心，秘書長應立即將此項通知轉送給所有締約國。此項通知不構成第一款所要求的同意。公約的前言部分明確指出，任何締約國不因僅僅批准、接受、核准公約就被視為接受特定案件的管轄。所以C選項正確。第53條規定，裁決對雙方具有約束力。不得進行任何上訴或採取除本公約規定外的任何其他補救辦法。除依照本公約有關規定予以停止執行的情況外，每一方應遵守和履行裁決的規定。所以D選項正確。"}, {"id": "卷一-65", "subject": "卷一", "type": "多選題", "question": "下列關於電子數據說法正確的是：（）", "options": [{"key": "A", "text": "證人秦麗麗因身體原因不能出庭作證，用手機錄了一段錄像，陳述了自己目睹的案件情況，這段錄像屬於電子數據"}, {"key": "B", "text": "張三提交微信聊天記錄，證明李四向自己借了2萬元，該聊天記錄屬於書證"}, {"key": "C", "text": "王五訴趙六侵權，提供了光盤刻錄的電子監控錄像的內容，該證據屬於電子數據"}, {"key": "D", "text": "王五訴趙六侵權，交警提供了執法記錄儀裡的處理交通事故現場的情形，該電子數據可認定為是真實的"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】《民事訴訟法》第73條規定，經人民法院通知，證人應當出庭作證。有下列情形之一的，經人民法院許可，可以通過書面證言、視聽傳輸技術或者視聽資料等方式作證：（1）因健康原因不能出庭的 ；（2）因路途遙遠，交通不便不能出庭的；（3）因自然災害等不可抗力不能出庭的；（4）其他有正當理由不能出庭的。證人因身體原因不能出庭作證，屬於因正當理由不能出庭作證，用手機錄了一段錄像，陳述了自己目睹的案件情況，屬於證人作證的一種方式，這段錄像屬於證人證言，不是電子數據。A項錯誤。 《證據規定》第14條規定，電子數據包括下列信息、電子文件：（1）網頁、博客、微博客等網絡平台發布的信息；（2）手機短信、電子郵件、即時通信、通訊群組等網絡應用服務的通信信息；（3）用戶註冊信息、 身份認證信息、電子交易記錄、通信記錄、登錄日誌等信息；（4）文檔、圖片、音頻、視頻、數字證書、計算機程序等電子文件；（5）其他以數字化形式存儲、處理、傳輸的能夠證明案件事實的信息。微信聊天記錄是典型的電子數據。B項錯誤。 光盤和電子監控錄像是典型的以數字化形式存儲的信息，屬於電子數據。C項正確。 《證據規定》第94條規定，電子數據存在下列情形的，人民法院可以確認其真實性，但有足以反駁的相反證據的除外：（1）由當事人提交或者保管的於己不利的電子數據；（2）由記錄和保存電子數據的中立第三方平台提供或者確認的；（3）在正常業務活動中形成的；（4）以檔案管理方式保管的；（5）以當事人約定的方式保存、傳輸、提取的。電子數據的內容經公證機關公證的，人民法院應當確認其真實性，但有相反證據足以推翻的除外。交警提供了執法記錄儀裡的處理交通事故現場的情形，屬於電子數據，是在日常業務活動中形成的，可以確認其真實性。D項正確。"}, {"id": "卷一-66", "subject": "卷一", "type": "多選題", "question": "關於民事訴訟中的法院調解與訴訟和解的區別，下列哪些選項是正確的？（　　）", "options": [{"key": "A", "text": "法院調解是法院行使審判權的一種方式，訴訟和解是當事人對自己的實體權利和訴訟權利進行處分的一種方式"}, {"key": "B", "text": "法院調解的主體包括雙方當事人和審理該案件的審判人員，訴訟和解的主體只有雙方當事人"}, {"key": "C", "text": "法院調解以《民事訴訟法》為依據，具有程序上的要求，訴訟和解沒有嚴格的程序要求"}, {"key": "D", "text": "經過法院調解達成的調解協議生效後如有給付內容則具有強制執行力，經過訴訟和解達成的和解協議即使有給付內容也不具有強制執行力 24"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】法院調解是指在法院的主持下，對當事人之間的糾紛進行裁決的活動。法院調解的特徵包括 ：（1）發生在訴訟過程中；（2）在法院主持下進行；（3）當事人達成協議並簽收了送達的調解書的，訴訟結束；（4）調解書具有執行力。訴訟和解的特徵有：（1）只有雙方當事人自己參加，是當事人在訴訟中對自己訴訟權利和實體權利的處分；（2）當事人在訴訟中和解的，應由原告申請撤訴，經法院裁定撤訴後結束訴訟。（3）和解協議不具有執行力。據此，A、B、D三項說法正確，應選。法院調解發生在訴訟過程中，應當依照《民事訴訟法》的相關規定進行，具有程序上的要求；而當事人的和解則並沒有嚴格的程序要求。故 C項說法正確，應選。本題正確答案為ABCD。"}, {"id": "卷一-67", "subject": "卷一", "type": "多選題", "question": "根據《民事訴訟法》及相關司法解釋的規定，下列有關反訴的說法中，哪些選項是錯誤的？（　）", "options": [{"key": "A", "text": "當事人與律師簽訂“全權代理”的委託合同後，在訴訟過程中律師可根據案件實際情況提出反訴"}, {"key": "B", "text": "一審法院作出判決後，一方當事人上訴，二審審理過程中對方當事人提出反訴，二審法院應合併審理"}, {"key": "C", "text": "被告提出反訴後原告撤訴，法院應據此裁定訴訟終結"}, {"key": "D", "text": "反訴應在案件受理後，法庭辯論終結前提出"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】A選項中，根據《民訴法解釋》第89條的規定，授權委託書僅寫“全權代理”而無具體授權的 ，訴訟代理人無權代為承認、放棄、變更訴訟請求，進行和解，提起反訴或上訴。因此律師不可根據僅寫 “全權代理”的委託合同提出反訴，故A選項表述錯誤，當選。 B選項中，根據《民訴法解釋》第328條的規定，二審程序中原審被告提出反訴，二審法院可根據當事人自願原則就反訴進行調解，調解不成的，告知當事人另行起訴，不能合併審理，故B選項表述錯誤，當選。 C選項中，根據《民訴法解釋》第239條的規定，法院准許本訴原告撤訴的，應當對反訴繼續審理。反訴是獨立的訴，本訴因原告撤訴終結不影響反訴的進行，故C選項表述錯誤，當選。 D選項中，根據《民訴法解釋》第232條的規定，反訴應在法庭辯論終結前提出，故D選項表述正確，不當選。"}, {"id": "卷一-68", "subject": "卷一", "type": "多選題", "question": "甲公司與乙公司簽訂商品房包銷合同，約定甲公司將其開發的10套房屋交由乙公司包銷。甲公司將其中 1套房屋賣給丙，丙向甲公司支付了首付款20萬元。後因國家出台房地產調控政策，丙不具備購房資格，甲公司與丙之間的房屋買賣合同不能繼續履行。下列哪些表述是正確的？（　　）", "options": [{"key": "A", "text": "甲公司將房屋出賣給丙的行為屬於無權處分"}, {"key": "B", "text": "乙公司有權請求甲公司承擔違約責任"}, {"key": "C", "text": "丙有權請求解除合同"}, {"key": "D", "text": "甲公司只需將20萬元本金返還給丙"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】甲公司與乙公司簽訂商品房包銷合同，並不影響房屋的歸屬，甲公司仍然享有房屋所有權，其將1套房屋出賣給丙的行為不屬於無權處分，所以，A選項錯誤。但是，根據《民法典》第577條規定，當事人一方不履行合同義務或者履行合同義務不符合約定的，應當承擔繼續履行、採取補救措施或者賠償損失等違約責任。甲將1套房屋出賣給丙，與丙簽訂買賣合同，違反其與乙包銷合同的約定，乙公司有權請求甲公司承擔違約責任，所以，B選項正確。《民法典》第533條規定，合同成立後，合同的基礎條件發生了當事人在訂立合同時無法預見的、不屬於商業風險的重大變化，繼續履行合同對於當事人一方明顯不公平的，受不利影響的當事人可以與對方重新協商；在合理期限內協商不成的，當事人可以請求人民法院或者仲裁機構變更或者解除合同。人民法院或者仲裁機構應當結合案件的實際情況，根據公平原則變更或者解除合同。因國家出台房地產調控政策，導致丙不具備購房資格，丙有權請求解除合同，所以C項正確。非因違約行為導致解除合同時，雙方只需返還已交付的標的及孳息，所以甲公司需將20萬元本金及利息返還給丙，所以，D選項錯誤。"}, {"id": "卷一-69", "subject": "卷一", "type": "多選題", "question": "甲委託乙釆購一批電腦，乙受丙誘騙高價釆購了一批劣質手機。丙一直以銷售劣質手機為業，甲對此知情 。關於手機買賣合同，下列哪些表述是正確的？（）", "options": [{"key": "A", "text": "甲有權追認"}, {"key": "B", "text": "甲有權撤銷專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 25"}, {"key": "C", "text": "乙有權以甲的名義撤銷"}, {"key": "D", "text": "丙有權撤銷"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】《民法典》第171條第1款規定，行為人沒有代理權、超越代理權或者代理權終止後，仍然實施代理行為，未經被代理人追認的，對被代理人不發生效力。甲委託乙采購電腦，乙卻購買手機，其構成無權代理，甲有權追認，所以，A選項正確。《民法典》第148條規定，一方以欺詐手段，使對方在違背真實意思的情況下實施的民事法律行為，受欺詐方有權請求人民法院或者仲裁機構予以撤銷。乙受丙誘騙高價采購了一批劣質手機，雖然甲對丙銷售劣質手機知情，但是不妨礙丙對乙構成欺詐，對於該買賣合同的受損害方甲有權撤銷手機買賣合同，代理人乙也可以被代理人甲的名義撤銷該手機買賣合同，所以，B、C選項正確。在欺詐而訂立的合同中，只有受損害方有權請求人民法院或者仲裁機構撤銷，所以，欺詐方丙無權撤銷。同時 ，《民法典》第171條第2款規定，相對人可以催告被代理人在30日內予以追認。被代理人未作表示的，視為拒絕追認。行為人實施的行為被追認之前，善意相對人有撤銷的權利。撤銷應當以通知的方式作出。依該款規定，無權代理的相對人，僅在善意時，可在被代理人追認前撤銷，所以，惡意的丙亦無撤銷權。所以，D選項錯誤。綜上，本題答案為ABC。 【陷阱】在本題中，雖然被代理人甲知曉丙實施欺詐行為，但實質與丙為意思表示磋商、訂立買賣合同的代理人乙並不知情，丙仍然構成欺詐。"}, {"id": "卷一-70", "subject": "卷一", "type": "多選題", "question": "下列哪些屬於《服務貿易總協定》規定的服務貿易的類型？（　）", "options": [{"key": "A", "text": "甲國某咨詢公司通過網絡向位於乙國的當事人提供技術咨詢"}, {"key": "B", "text": "甲國消費者到乙國旅遊、就醫、留學"}, {"key": "C", "text": "甲國某保險公司在乙國設立分支機構為乙國客戶提供保險服務"}, {"key": "D", "text": "甲國自然人服務提供者到乙國為乙國國民提供服務"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】根據《服務貿易總協定》，服務貿易的類型包括：（1）跨境服務，從一國境內向另一國境內提供服務，如通過電信、網絡等跨境提供咨詢服務；（2）境外消費，在一國境內向來自另一國的服務消費者提供服務，如一國居民到另一國境內旅遊、求學等；（3）商業存在，一國的服務提供者通過在另一國境內設立的機構提供服務，如一國的機構到另一國開設銀行、保險公司、律師事務所等；（4）自然人流動，一國的服務提供者以自然人的身份進入另一國境內提供服務，如一國的醫生、律師到另一國境內直接提供醫療或法律咨詢服務。故ABCD都屬於。"}, {"id": "卷一-71", "subject": "卷一", "type": "多選題", "question": "2008年年底，甲電影公司推出名為“非誠勿擾”的電影，非常賣座。2009年初，乙以“非誠勿擾”文字申請註冊“交友服務、婚姻介紹所”類別的服務商標，其所使用的文字組合及美術形式與電影“非誠勿擾”完全相同。2010年9月7日，乙的商標申請註冊成功。2016年2月2日，甲電影公司請求商標評審委員會宣告乙的註冊商標無效。下列哪些說法是錯誤的？（　）", "options": [{"key": "A", "text": "如果“非誠勿擾”四字組合為甲公司原創，則其對“非誠勿擾”詞組享有文字作品著作權"}, {"key": "B", "text": "在乙的商標註冊公告期間，甲有權自公告之日起6個月內向商標局提出異議"}, {"key": "C", "text": "甲公司有權請求商標評審委員會宣告乙的註冊商標無效"}, {"key": "D", "text": "甲公司有權申請商標局撤銷乙的註冊商標"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】“非誠勿擾”四字組合儘管屬於甲電影公司的獨創，但該詞組過於簡短，缺乏文字作品應有的深度與長度，不足以被認定為文字作品，故甲公司對“非誠勿擾’’四字組合不享有著作權，A項錯誤。不過 ，“非誠勿擾”四字組合的書寫方式可以作為美術作品受法律保護，乙以與甲公司完全相同的“非誠勿擾 ”美術形式申請註冊商標，侵害了甲公司的美術作品著作權。 《商標法》第32條規定：“申請商標註冊不得損害他人現有的在先權利，也不得以不正當手段搶先註冊他人已經使用並有一定影響的商標。”根據《商標法》第33條規定，對初步審定公告的商標，自公告之日起3個月內，在先權利人、利害關係人可以向商標局提出異議。據此，商標異議期問為3個月而非6個月，B項錯誤。《 26 商標法》第44條第1款規定：“已經註冊的商標，違反本法第四條、第十條、第十一條、第十二條、第十九條第四款規定的，或者是以欺騙手段或者其他不正當手段取得註冊的，由商標局宣告該註冊商標無效；其他單位或者個人可以請求商標評審委員會宣告該註冊商標無效。”《商標法》第45條第1款規定：“已經註冊的商標，違反本法第十三條第二款和第三款、第十五條、第十六條第一款、第三十條、第三十一條、第三十二條規定的，自商標註冊之日起五年內，在先權利人或者利害關係人可以請求商標評審委員會宣告該註冊商標無效。對惡意註冊的，馳名商標所有人不受五年的時間限制。”據此，宣告商標無效的事由分為兩類情形：一類是商標存在拒絕註冊的絕對事由，申請商標無效不受時間限制；另外一類是商標存在拒絕註冊的相對事由 ，申請商標無效的時間通常是自商標註冊之日起5年。本題中，乙的商標於2010年9月7日獲得商標註冊，截至 2016年2月2日，已經超過5年時間，故甲公司不得申請宣告乙的註冊商標無效，C項錯誤。 《商標法》第49條第2款規定：“註冊商標成為其核定使用的商品的通用名稱或者沒有正當理由連續三年不使用的，任何單位或者個人可以向商標局申請撤銷該註冊商標。商標局應當自收到申請之日起九個月內做出決定。有特殊情況需要延長的，經國務院工商行政管理部門批准，可以延長三個月。”本條規定了申請撤銷商標的事由為連續3年無正當理由而不使用註冊商標或者商標成為通用名稱，本題中不存在相關情形，故甲公司不能申請撤銷乙的註冊商標，D項錯誤。"}, {"id": "卷一-72", "subject": "卷一", "type": "多選題", "question": "夕陽房地產公司與購房人李某簽訂購房合同時，向李某展示的小區沙盤圖中標明小區專門規劃一個跳廣場舞的廣場。李某系廣場舞愛好者，遂簽訂了買賣合同，購買房屋一套。李某收房時發現小區根本沒有廣場。 經查，該小區設計中並無該廣場。對此，下列哪些表述是正確的？", "options": [{"key": "A", "text": "李某有權退房"}, {"key": "B", "text": "李某有權要求夕陽房地產公司雙倍返還購房款"}, {"key": "C", "text": "李某有權要求夕陽房地產公司承擔締約過失責任"}, {"key": "D", "text": "合同中未表明廣場，故夕陽房地產公司不構成違約"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】A項正確，夕陽公司的行為成立“欺詐”，李某有權撤銷該買賣合同。B項錯誤，目前在商品房買賣合同中已經不再存在懲罰性賠償的問題。C項正確，李某選擇撤銷該買賣合同的，有權要求夕陽公司承擔締約過失責任。D項錯誤，夕陽公司在沙盤圖中，對房屋的附屬設施（廣場）有具體而確定的說明和允諾，且該說明和允諾對李某決定訂立該房屋買賣合同具有重大影響，因此，該說明和允諾應當定性為“要約”，且視為商品房買賣合同的內容之一。夕陽房地產公司構成違約。"}, {"id": "卷一-73", "subject": "卷一", "type": "多選題", "question": "鴻發房地產公司自大河沙場采購河沙200噸，約定交貨期限為2020年9月2日，付款日期為2020年10月12日 。大河沙場交付了河沙後，鴻發公司在使用過程中發現該河沙質地過粗無法滿足建築需要。對此，鴻發房地產公司可以提出下列哪些主張？", "options": [{"key": "A", "text": "通知大河沙場解除合同"}, {"key": "B", "text": "要求大河沙場承擔違約責任"}, {"key": "C", "text": "主張先履行抗辯權"}, {"key": "D", "text": "主張不安抗辯權"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】A項正確，出賣人大河沙場交付的河沙質量嚴重不合格，致使鴻發公司訂立買賣合同的目的不能實現（河沙不能用於建築），出賣人的違約行為構成根本違約，買受人鴻發公司享有法定解除權。B項正確 ，出賣人大河沙場交付的河沙不符合約定的品質（具有瑕疵），屬於瑕疵履行，成立違約，買受人鴻發公司可主張違約責任。C項正確，應當先履行的大河沙場交付的河沙具有嚴重瑕疵，根據《民法典》第526條的規定，應當後履行對待給付義務的鴻發公司可行使先履行抗辯權。D項錯誤，雙務合同中，只有“應當先履行的一方”（履行對待給付義務順序在前的一方）才可能享有不安抗辯權，而鴻發公司屬於“應當後履行對待給付義務的一方”，不能主張不安抗辯權。"}, {"id": "卷一-74", "subject": "卷一", "type": "多選題", "question": "李松對楊超享有到期債權50萬元，楊超無力償還。楊超對戴眉享有到期債權20萬元，楊超時常電話要求戴專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 27 眉償還債務。楊超對新城公司享有到期的勞動報酬債權10萬元。後楊超去世，將上述債權均遺贈給自己的女友張妙，此外別無其他財產。對此，下列哪些說法是正確的？", "options": [{"key": "A", "text": "李松可向法院請求撤銷楊超的遺贈"}, {"key": "B", "text": "在楊超去世前，李松不得直接向法院請求戴眉向自己清償"}, {"key": "C", "text": "在楊超去世前，李松不得直接向法院請求新城公司向自己清償"}, {"key": "D", "text": "李松撤銷楊超遺贈的費用均由楊超承擔"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】A項正確，楊超在負債的情況下無償處分財產，導致無力償還債務，李松享有債權人撤銷權。 B項錯誤，楊超怠於主張對戴眉的權利，導致無力償還債務，李松享有代位權。C項正確，楊超對新城公司的權利為勞動報酬債權，該債權具有專屬性，不得代位行使。D項正確，債權人行使撤銷權勝訴的，其訴訟費用及必要費用均由債務人承擔。"}, {"id": "卷一-75", "subject": "卷一", "type": "多選題", "question": "大德公司以某宗建設用地使用權做抵押向海商銀行貸款5000萬元，並辦理抵押登記。此後，大德公司在該土地上修建住宅樓，由天威公司承建。大德公司取得預售許可證後將其中一套房屋出售給金瀾，金瀾已支付全部價款，但由於登記機關的原因尚未辦理登記。經查，金瀾購買該房屋系為了投資。現房屋建設完成，大德公司未能清償對海商銀行的借款，並欠付天威公司工程款3000萬元，法院拍賣了該住宅樓。對此，下列哪些選項是正確的？", "options": [{"key": "A", "text": "海商銀行對建設用地使用權的價款具有優先受償權"}, {"key": "B", "text": "海商銀行可申請對住宅樓進行拍賣，並享有優先受償權"}, {"key": "C", "text": "天威公司有權優先於海商銀行而受償"}, {"key": "D", "text": "天威公司的優先受償權不得對抗金瀾"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】A項正確，海商銀行對建設用地使用權享有抵押權，有權主張優先受償。B項錯誤，建設用地使用權抵押後，該土地上新增的建築物不屬於抵押財產。C項正確，建設工程優先受償權優先於抵押權。D項錯誤，建設工程優先受償權優先於一般買受人的物權期待權（構成要件：①法院查封前已簽訂有效的書面買賣合同；②法院查封前已合法占有房屋；③已支付全部價款或願意支付全部價款；④非因買受人自身原因未辦理過戶登記）"}, {"id": "卷一-76", "subject": "卷一", "type": "多選題", "question": "甲（出賣人）與乙（買受人）簽訂買賣合同，合同約定合同總價款200萬元，乙支付定金50萬元，任何一方違約應向對方支付合同總價款30％的違約金。後甲只如期供應給乙一半數量的貨物，剩餘部分無力供應 ，雙方發生糾紛。對此，下列表述中正確的是？（）", "options": [{"key": "A", "text": "乙有權請求甲雙倍返還定金100萬元並支付違約金60萬元"}, {"key": "B", "text": "乙有權請求甲雙倍返還定金80萬元並支付違約金60萬元"}, {"key": "C", "text": "乙有權請求甲雙倍返還定金40萬元或者支付違約金60萬元"}, {"key": "D", "text": "乙所交定金50萬元可充抵70萬元貨款"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】本題涉及違約責任的形式問題。《民法典》第588條第1款規定，當事人既約定違約金，又約定定金的，一方違約時．對方可以選擇適用違約金或者定金條款。故選項A、B錯誤。依照《民法典》第586條第 2款規定，定金的數額由當事人約定，但是不得超過主合同標的額的20％，超過部分不產生定金的效力。超過部分按預付款處理。在當事人部分不履行的情況下，定金按比例適用。本題中，合同總金額為2013萬元。定金數額最多為40萬元，多餘的10萬元為預付款。現甲履行了合同的一半，定金按50％適用，也就是20萬元為定金。另外20萬元發生預付款的效力，定金髮生雙倍返還的效力，預付款則不發生該效力，故選項C正確。已支付的定金50萬元可充抵70萬元的貨款，選項D正確。因此。本題正確選項為CD。"}, {"id": "卷一-77", "subject": "卷一", "type": "多選題", "question": "下列關於土地承包經營權的表述正確的是？（）", "options": [{"key": "A", "text": "甲從某村村民委員會處承包該村農業用地的，該承包合同成立時，甲即取得土地承包經營權專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 28"}, {"key": "B", "text": "村民委員會可以根據國土資源管理部門發布的指示隨時調整承包地"}, {"key": "C", "text": "耕地的土地承包經營權期限為30年．土地承包經營權人不得連續承包"}, {"key": "D", "text": "某村村民乙和丙互換承包地的，應當辦理登記，未經登記的不得對抗善意第三人"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】本題考查的是土地承包經營權。根據《民法典》第333條第1款的規定，土地承包經營權自合同生效時設立。登記僅具有對抗作用。因此選項A正確。根據《民法典》第332條的規定，耕地的承包期為30年 ，期限屆滿的可以繼續承包，故C項說法錯誤。又根據《民法典》第336條的規定，發包人不得調整承包地 ，故B項說法錯誤。根據《民法典》第335條，土地承包經營權互換、轉讓，自合同生效時發生完成，自登記時具有對抗效力。選項D正確。故本題答案為AD。"}, {"id": "卷一-78", "subject": "卷一", "type": "多選題", "question": "某村甲、乙兄弟二人繼承了其父母去世後留下的房產，但是房產一直沒有進行變更登記。甲長期在外地 ，由乙實際居住。一日因房屋地基不牢倒塌。對鄰房造成一定損害。對此，下列表述正確的是？（）", "options": [{"key": "A", "text": "應由乙承擔賠償責任"}, {"key": "B", "text": "應由甲、乙承擔連帶責任"}, {"key": "C", "text": "應由甲、乙分擔責任，並由乙適當多負擔"}, {"key": "D", "text": "甲、乙二人共同共有該房屋"}], "answer": ["B", "D"], "explanation_full": "【羿文解析】本題涉及共有財產致人損害的責任承擔問題。依據《民法典繼承編》相關規定，在未辦理變更登記之前，遺產為繼承人共同共有，因此甲、乙共同共有該房屋。依《民法典》第307條的規定，共有財產致人損害的，應由共有人承擔連帶責任。故本題答案為BD。"}, {"id": "卷一-79", "subject": "卷一", "type": "多選題", "question": "甲借給乙10萬元，約定借期為30個月，借期內年利率5％。但是雙方未約定支付利息的期限，事後也未能達成補充協議。依照《民法典》的
