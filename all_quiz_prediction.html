lanation_full": "【羿文解析】①《最高人民法院關於執行和解若干問題的規定》第9條：被執行人一方不履行執行和解協議的 ，申請執行人可以申請恢復執行原生效法律文書，也可以就履行執行和解協議向執行法院提起訴訟。因此選項A的說法正確。 ②據前所述，大地公司可向法院申請執行原生效法律文書，即原仲裁裁決，選項B的說法正確。 ③《民訴解釋》第466條：申請執行人與被執行人達成和解協議後請求中止執行或者撤回執行申請的，人民法院可以裁定中止執行或者終結執行。本題中，申請人大地公司撤回執行申請，法院裁定終結執行，選項C的說法錯誤。 ④一方當事人不履行或者不完全履行在執行中雙方自願達成的和解協議，對方當事人可以申請執行原生效法律文書，但是不可以申請執行和解協議，和解協議不具有強制執行力，本身不能成為法院的執行依據，選項 D的說法錯誤。 綜上，本題的正確答案為AB選項。 不定項選擇題"}, {"id": "卷二-86", "subject": "卷二", "type": "單選題", "question": "重慶市峰峻勞務派遣公司將小丁派遣至成都市時代公司工作。對此下列說法正確", "options": [{"key": "A", "text": "小丁須和時代公司簽訂兩年以上的固定期限勞動合同"}, {"key": "B", "text": "峰峻公司不得以非全日制用工形式招用小丁"}, {"key": "C", "text": "時代公司可將小丁派遣至自己的子公司工作"}, {"key": "D", "text": "小丁的勞動報酬和勞動條件應由峰峻公司所在地的標準執行"}], "answer": ["B"], "explanation_full": "32 性工作崗位是指存續時間不超過六個月的崗位……”，因此，峰峻公司應與小丁二年以上的固定期限勞動合同,不得以非全日制用工形式招用小丁；時代公司作為用工單位，提供的崗位屬於臨時性工作崗位，存續時間不超過六個月。 ②C選項錯誤，《勞動合同法》第62條第2款：“用工單位不得將被派遣勞動者再派遣到其他用人單位。”時代公司的子公司是獨立的法人，屬於獨立的用人單位，不得再派遣。 ③D選項錯誤，《勞動合同法》第61條第2款：“勞務派遣單位跨地區派遣勞動者的,被派遣勞動者享有的勞動報酬和勞動條件，按照用工單位所在地的標準執行。”因此，小丁的勞動報酬和勞動條件，應按照用工單位時代公司所在地的標準執行。 綜上，本題正確答案為B選項。"}, {"id": "卷二-87", "subject": "卷二", "type": "單選題", "question": "關於破產重整，下列說法正確的是？", "options": [{"key": "A", "text": "只有債務人或債權人能夠提請重整"}, {"key": "B", "text": "在重整期間，對債務人的特定財產享有的擔保權暫停行使。但是，擔保物有損壞或者價值明顯減少的可能 ，足以危害擔保權人權利的，擔保權人可以向人民法院請求恢復行使擔保權"}, {"key": "C", "text": "在重整期間，債務人的股東不得向第三人轉讓其持有的債務人的股權"}, {"key": "D", "text": "由債權人申請啟動的重整程序，宣告破產前，經債務人申請，法院批准，可轉為和解程序"}], "answer": ["B"], "explanation_full": "【羿文解析】①A選項錯誤，債權人申請對債務人進行破產清算的，在人民法院受理破產申請後、宣告債務人破產前，債務人或者出資額占債務人註冊資本十分之一以上的出資人，可以向人民法院申請重整。 ②B選項正確，C選項錯誤，在重整期間，債務人的董事、監事、高級管理人員不得向第三人轉讓其持有的債務人的股權。但是，經人民法院同意的除外。因此，重整期間只有債務人的董事、監事、高級管理人員不得對外轉讓股權，普通股東可以對外轉讓。 ③D選項錯誤，重整、和解程序不可轉換。 綜上，本題正確答案為B選項。"}, {"id": "卷二-88", "subject": "卷二", "type": "單選題", "question": "A公司和B公司合同糾紛一案，經C市甲縣法院審理，判決A公司勝訴，因B公司不履行生效裁判，A公司申請強制執行，執行過程中雙方達成和解協議，B公司也按照和解協議的約定履行完所有義務，法院裁定終結執行 。後B公司發現新證據向C市中級人民法院申請再審，在法院審查再審申請時，發現該案已因和解協議執行完畢。下列選項中，C市中級人民法院對本案正確的處理方式是？", "options": [{"key": "A", "text": "應裁定駁回B公司的再審申請"}, {"key": "B", "text": "應當裁定執行回轉"}, {"key": "C", "text": "可裁定終結對再審的審查"}, {"key": "D", "text": "可對執行和解協議的合法性進行審查"}], "answer": ["C"], "explanation_full": "【羿文解析】《民訴解釋》第402條第3款的規定，再審申請審查期間當事人達成和解協議且已履行完畢的 ，裁定終結審查，但當事人在和解協議中聲明不放棄申請再審權利的除外。本題中，法院對當事人的再審申請進行審查的過程中，就發現和解協議已經履行完畢，此時案件已不具備再審的必要性和正當性，法院也就沒有必要對再審申請繼續審■，應當“及時止損”，裁定終結審■，故C項正確，ABD錯誤。"}, {"id": "卷二-89", "subject": "卷二", "type": "單選題", "question": "颱風有限公司共有七名股東：馬風、丁年、劉婉、宋盆、張源、嚴西、賀霖。2020年1月1日，股東馬風將其持有的公司40%股權轉讓給李飛，轉讓價格為50萬元，並完成股權變更的登記事項，但未就股權轉讓事項通知其他股東。對此，下列說法正確的是？", "options": [{"key": "A", "text": "若2020年2月1日其他股東得知了雙方股權轉讓的真實條件，可隨時主張優先購買權"}, {"key": "B", "text": "若2021年2月1日其他股東得知了雙方股權轉讓的真實條件，應當在三十天內主張優先購買權"}, {"key": "C", "text": "若其他股東對馬風轉讓股權一事有異議，可請求法院確認馬風與李飛轉讓股權無效,而無須主張購買該部分股權專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 33"}, {"key": "D", "text": "若其他股東對馬風所轉讓股權主張優先購買權，且得到法院支持，李飛有權要求馬風賠償其損失"}], "answer": ["D"], "explanation_full": "【羿文解析】①A、B選項錯誤，《公司法司法解釋（四）》第21條第1款：“有限責任公司的股東向股東以外的人轉讓股權，未就其股權轉讓事項徵求其他股東意見，或者以欺詐、惡意串通等手段，損害其他股東優先購買權，其他股東主張按照同等條件購買該轉讓股權的，人民法院應當予以支持，但其他股東自知道或者應當知道行使優先購買權的同等條件之日起三十日內沒有主張，或者自股權變更登記之日起超過一年的除外。 ”因此，A選項其他股東應當在知道或者應當知道股權轉讓事實之日起30日內主張優先購買權，而非隨時主張 ；B選項股權變更登記已經超過一年，此時已經不可以主張優先購買權。 ②C選項錯誤，《公司法司法解釋（四）》第21條第2款：“前款規定的其他股東僅提出確認股權轉讓合同及股權變動效力等請求，未同時主張按照同等條件購買轉讓股權的，人民法院不予支持，但其他股東非因自身原因導致無法行使優先購買權，請求損害賠償的除外。”因此，股東僅提出確認股權轉讓合同及股權變動效力等請求，未同時主張按照同等條件購買轉讓股權的，人民法院不予支持。 ③D選項正確，《公司法司法解釋（四）》第21條第3款：“股東以外的股權受讓人，因股東行使優先購買權而不能實現合同目的的，可以依法請求轉讓股東承擔相應民事責任。”因此，若其他股東主張優先購買權並被法院支持的，李飛有權要求馬風賠償其損失。 綜上，本題正確答案為D選項。"}, {"id": "卷二-90", "subject": "卷二", "type": "多選題", "question": "花花到熊大家做客時，看中了家中擺設的一幅名家字畫（實際所有人為熊二所有，借給熊大觀賞幾天 ），欲以40萬元的價格購買。兩人一拍即合，並約定花花先交付貨款，熊大在收到貨款後的15日內交付該字畫。花花依約履行後，熊大以種種理由拒絕交付。花花即訴至甲縣法院，要求熊大交付約定的名家字畫，並且得到法院判決支持。熊大未上訴，判決生效後，進入執行階段時，熊二知曉了上述情況，請問，熊二此時可以採取的救濟措施中，下列說法正確的是？", "options": [{"key": "A", "text": "向甲縣法院提出執行異議"}, {"key": "B", "text": "向甲縣法院提出第三人撤銷之訴"}, {"key": "C", "text": "以案外人身份向甲縣法院直接申請再審"}, {"key": "D", "text": "向甲縣法院申訴，要求甲縣法院依職權對案件啟動再審"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】該案中爭議的執行標的為名家字畫，該幅名家字畫的所有人為熊二，熊二與熊大之間為借用關係；之後熊大將該幅名家字畫轉賣給花花，因熊大未依約交付，花花將熊大訴至法院，後熊大敗訴。在法院執行過程中，該字畫的真正所有人熊二得知相關情況，作為案外人，熊二可以選擇的救濟途徑包括：（1）在執行過程中，案外人對被執行財產的全部或部分主張權利的，可以提出執行標的異議，請求法院停止或變更執行，因此熊二可以甲縣法院提出執行異議；（2）根據《民訴解釋》第292條的規定，第三人對已經發生法律效力的判決、裁定、調解書提起撤銷之訴的，應當自知道或者應當知道其民事權益受到損害之日起六個月內，向作出生效判決、裁定、調解書的人民法院提出，因此熊二有權提起第三人撤銷之訴。選項A、B正確。 熊二不是該買賣合同訴訟的當事人，因此無權直接申請再審，熊二作為案外人若想申請再審，必須先提出執行標的異議，如果法院裁定駁回了熊二的執行標的異議，才可以案外人的身份申請再審，因此選項C錯誤。 熊二可以向法院申訴，為法院提供線索，從而促使法院依職權啟動再審，選項D正確。 綜上，本題正確答案為ABD選項。"}, {"id": "卷二-91", "subject": "卷二", "type": "多選題", "question": "2019年劉文、宋軒、馬丁三人設立碗盆文化傳播有限公司，當年盈利頗豐。2020年2月，該公司召開股東會會議，通過決議如下：按照三方股東實繳出資比例分配2019年度利潤，決議通過之日起3個月內劃轉至股東預留賬戶。而公司章程規定：公司利潤應當於分紅決議作出之日起2個月內分配完畢。對此，下列說法錯誤的是？", "options": [{"key": "A", "text": "股東會決議關於利潤分配時間與章程規定不一致，應當以決議中載明的時間為準"}, {"key": "B", "text": "股東會決議關於利潤分配時間與章程規定不一致，應當以章程中載明的時間為準"}, {"key": "C", "text": "股東會決議關於利潤分配時間與章程規定不一致，故該決議不成立專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 34"}, {"key": "D", "text": "若股東對決議所載明利潤分配時間有異議，可向法院起訴，要求撤銷該決議"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】①A選項正確，B選項錯誤《公司法司法解釋（五）》第4條：“分配利潤的股東會或者股東大會決議作出後，公司應當在決議載明的時間內完成利潤分配。決議沒有載明時間的，以公司章程規定的為準。 決議、章程中均未規定時間或者時間超過一年的，公司應當自決議作出之日起一年內完成利潤分配。決議中載明的利潤分配完成時間超過公司章程規定時間的，股東可以依據民法典第八十五條、公司法第二十二條第二款規定請求人民法院撤銷決議中關於該時間的規定。”因此，股東會決議關於利潤分配時間與章程規定不一致，應當以決議中載明的時間為準。 ②C、D選項錯誤《公司法》第22條第2款：“股東會或者股東大會、董事會的會議召集程序、表決方式違反法律、行政法規或者公司章程，或者決議內容違反公司章程的，股東可以自決議作出之日起六十日內，請求人民法院撤銷。”因此，決議內容違反公司章程，屬於決議可撤銷，且結合《公司法司法解釋（五）》第4條 ，如決議中僅關於利潤的分配時間違反公司決議的，股東可要求撤銷關於時間的部分決議，並非直接撤銷整個決議。 綜上，本題正確答案為BCD選項。"}, {"id": "卷二-92", "subject": "卷二", "type": "單選題", "question": "關於勞動合同的解除，下列說法正確的是？", "options": [{"key": "A", "text": "小劉是某公司的舞蹈表演人員，因打球手部受傷，不能從事原崗位工作，用人單位可直接解除勞動合同"}, {"key": "B", "text": "女職工在孕期、產期、哺乳期，單位不能解除勞動合同"}, {"key": "C", "text": "小丁先與峰峻公司簽訂勞動合同，合同期間，又與芒果公司簽訂了勞動合同，峰峻公司不可以小丁與其他用人單位存在勞動關係而解除合同"}, {"key": "D", "text": "小賀與某公司簽訂了無固定期限勞動合同，該公司因經營管理嚴重困難進行經濟性裁員，不得對小賀進行裁減"}], "answer": ["C"], "explanation_full": "【羿文解析】①A選項錯誤，勞動者患病或者非因工負傷，在規定的醫療期滿後不能從事原工作，也不能從事由用人單位另行安排的工作的，用人單位提前30日以書面形式通知勞動者本人或者額外支付勞動者1個月工資後，可以解除勞動合同。 ②B選項錯誤，勞動者有下列情形之一的，用人單位可以解除勞動合同：（一）在試用期間被證明不符合錄用條件的；（二）嚴重違反用人單位的規章制度的；（三）嚴重失職,營私舞弊，給用人單位造成重大損害的 ；（四）勞動者同時與其他用人單位建立勞動關係,對完成本單位的工作任務造成嚴重影響，或者經用人單位提出，拒不改正的；（五）因本法第26條第1款第（一）項規定的情形致使勞動合同無效的；（六）被依法追究刑事責任的。女職工即使在“三期”內，如果有以上幾類情形的，用人單位依然可以解除勞動合同。 ③C選項正確，勞動者同時與其他用人單位建立勞動關係，對完成本單位的工作任務造成嚴重影響，或者經用人單位提出，拒不改正的，用人單位可以解除勞動合同。勞動者同時與其他用人單位建立勞動關係，對原用人單位的工作沒有影響的，原用人單位不可解除勞動合同。 ④D選項錯誤，裁減人員時，應當優先留用下列人員：（一）與本單位訂立較長期限的固定期限勞動合同的 ；（二）與本單位訂立無固定期限勞動合同的；（三）家庭無其他就業人員，有需要扶養的老人或者未成年人的。應優先留用並非不得裁減。 綜上，本題正確答案為C選項。"}, {"id": "卷二-93", "subject": "卷二", "type": "多選題", "question": "小張是峰峻勞務派遣公司的員工，被派遣至芒果娛樂公司，工作期間小張在執行工作任務時致第三人損害 ，下列說法錯誤的是？", "options": [{"key": "A", "text": "芒果娛樂沒有為小張提供必要的工作條件和保護的，致使小張也受傷，應由用工單位承擔賠償責任"}, {"key": "B", "text": "小張應對第三人承擔賠償責任"}, {"key": "C", "text": "芒果娛樂應對第三人承擔侵權責任"}, {"key": "D", "text": "芒果娛樂公司與峰峻勞務派遣公司應對第三人承擔連帶責任 35"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】①A選項錯誤，用工單位給被派遣勞動者造成損害的，勞務派遣單位與用工單位承擔連帶賠償責任。 ②B、C、D選項錯誤，《民法典》第1191條：“用人單位的工作人員因執行工作任務造成他人損害的，由用人單位承擔侵權責任。用人單位承擔侵權責任後，可以向有故意或者重大過失的工作人員追償。勞務派遣期間 ，被派遣的工作人員因執行工作任務造成他人損害的，由接受勞務派遣的用工單位承擔侵權責任；勞務派遣單位有過錯的，承擔相應的責任。”因此，應由用工單位芒果娛樂對第三人承擔侵權責任，峰峻勞務派遣公司有過錯的，在過錯範圍內承擔補充性連帶責任。 綜上，本題正確答案為ABCD選項。"}, {"id": "卷二-94", "subject": "卷二", "type": "多選題", "question": "甲因買賣合同糾紛將乙訴至法院，請求乙支付違約金100萬元。勝訴後進入執行程序，乙表示自己沒有其餘財產，只有一隻祖傳古董花瓶可供抵債。法院經過調解，說服甲接受該古董花瓶拿來抵債，雙方達成和解協議並當場交付了該古董花瓶。後甲發現此花瓶為■品，價值不足萬元，隨申請法院恢復執行。關於本案中執行和解，下列說法正確的是？", "options": [{"key": "A", "text": "由於和解協議已經即時履行，法院無須再將和解協議記入筆錄"}, {"key": "B", "text": "由於和解協議已經即時履行，法院可裁定執行中止"}, {"key": "C", "text": "法院不應在執行中勸說甲接受該古董花瓶用來抵債"}, {"key": "D", "text": "法院應恢復執行"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】①《民事訴訟法》第230條第1款：在執行中，雙方當事人自行和解達成協議的，執行員應當將協議內容記入筆錄，由雙方當事人簽名或者蓋章。因此選項A錯誤。 ②執行和解協議已經履行完畢的，法院應當作結案處理，即裁定終結執行，選項B錯誤。 ③執行和解是當事人處分自己民事權利和訴訟權利的行為。執行程序適用和解，但是不適用調解，因此選項 C正確。 ④《民事訴訟法》第230條第2款：申請執行人因受欺詐、脅迫與被執行人達成和解協議，或者當事人不履行和解協議的，人民法院可以根據當事人的申請，恢復對原生效法律文書的執行。本案中的古董花瓶為■品 ，屬於申請執行人受到欺詐而達成和解協議的情形，甲可以申請法院恢復對原執行依據的執行，選項D正確。 綜上，本題的正確答案為CD選項。"}, {"id": "卷二-95", "subject": "卷二", "type": "多選題", "question": "熊大因創業資金不足，向熊二借款10萬元，約定3年後還本付息。熊大到期未還，熊二多次和熊大交涉未果，於是將熊大訴至法院。在訴訟過程中，熊二將自己對熊大的債權轉讓給花花，依據相關規定，下列哪些選項是正確的？", "options": [{"key": "A", "text": "若熊二撤訴，法院可以准許其撤訴"}, {"key": "B", "text": "如花花申請以無獨立請求權第三人的身份參加訴訟，法院可予准許"}, {"key": "C", "text": "若花花申請替代熊二訴訟地位的，法院可以根據案件的具體情況決定是否准許"}, {"key": "D", "text": "若法院不予准許花花替代熊二訴訟地位的，可以追加花花為無獨立請求權第三人"}], "answer": ["A", "B", "C", "D"], "explanation_full": "36 受讓人花花替代熊二訴訟地位的，則可以追加花花為無獨立請求權的第三人，選項D的說法正確。綜上，本題正確答案為ABCD選項。"}, {"id": "卷二-96", "subject": "卷二", "type": "多選題", "question": "軒源公司經營不善，所欠大量債務到期無法清償，向法院申請破產，法院受理並指定祺翔律師事務所為軒源公司的破產管理人，下列說法錯誤的是？", "options": [{"key": "A", "text": "祺翔律師事務所的馬律師，為追回軒源公司財產所花費的差旅費，應屬破產費用"}, {"key": "B", "text": "軒源公司財產不足以清償所有破產費用和共益債務的，應按比例進行清償"}, {"key": "C", "text": "祺翔律師事務所賀律師在開車去參加債權人會議途中造成橫穿馬路的行人受傷，所支付的賠償金應由賀律所本人承擔"}, {"key": "D", "text": "祺翔律師事務所在處理軒源公司財產無因管理所產生的費用，應屬破產費用"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】①A選項正確，《破產法》第41條第（三）項：“人民法院受理破產申請後發生的下列費用，為破產費用：（三）管理人執行職務的費用、報酬和聘用工作人員的費用。”因此，為追回軒源公司財產所花費的差旅費，應屬於破產費用。 ②B選項錯誤，《破產法》第43條第2款：“債務人財產不足以清償所有破產費用和共益債務的，先行清償破產費用。”因此，應當先清償破產費用，而非按比例。 ③C選項錯誤，《破產法》第42條第（五）項：“人民法院受理破產申請後發生的下列債務，為共益債務 ：（五）管理人或者相關人員執行職務致人損害所產生的債務。”因此,該損害賠償金為共益債務，應由債務人財產承擔。 ④D選項錯誤，《破產法》第42條第（二）項：“人民法院受理破產申請後發生的下列債務，為共益債務 ：（二）債務人財產受無因管理所產生的債務。”根據第（二）項的規定,應為共益債務，而非破產費用。 綜上，本題正確答案為BCD選項。"}, {"id": "卷二-97", "subject": "卷二", "type": "單選題", "question": "熊大申請強制執行熊二的財產，法院將熊二名下的一處房產列為執行標的。執行中，A銀行向法院主張 ，熊二己將該房產抵押貸款，並以自己享有抵押權為由提出異議。熊二否認將該房產抵押給A銀行。經審查 ，法院駁回A銀行的異議，A銀行擬向法院起訴。關於本案被告的確定，下列選項正確的是？", "options": [{"key": "A", "text": "A銀行應當以熊大和熊二為共同被告起訴"}, {"key": "B", "text": "A銀行只能以熊大為被告起訴"}, {"key": "C", "text": "A銀行只能以熊二為被告起訴"}, {"key": "D", "text": "A銀行可選擇以熊大或熊二為被告起訴"}], "answer": ["A"], "explanation_full": "【羿文解析】《民訴解釋》第307條規定，案外人提起執行異議之訴的，以申請執行人為被告。被執行人反對案外人異議的，被執行人為共同被告；被執行人不反對案外人異議的，可以列被執行人為第三人。本題中 ，被執行人熊二否認A銀行的實體權利，即被執行人反對案外人異議，應當以熊大與熊二為共同被告，選項 A正確，BCD錯誤。"}, {"id": "卷二-98", "subject": "卷二", "type": "多選題", "question": "孟某計劃在北京參加2018年首屆法考，2018年8月10日向吉祥快捷酒店電話預訂豪華大床房1間，於9月 21日下午5點前辦理入住。臨近考試，孟某自覺備考十分充分，首屆法考必過，為獎勵自己而將賓館更換為香格裡拉大酒店。9月21日下午3點吉祥快捷酒店電話聯繫孟某，孟某表示不再入住。雙方產生糾紛，下列說法錯誤的有？（　）", "options": [{"key": "A", "text": "孟某8月10日電話預訂房間的行為不產生法律效果"}, {"key": "B", "text": "吉祥快捷酒店有權追究孟某的違約責任"}, {"key": "C", "text": "吉祥快捷酒店有權請求孟某繼續履行"}, {"key": "D", "text": "吉祥快捷酒店有權追究香格裡拉大酒店的違約責任"}], "answer": ["A", "C", "D"], "explanation_full": "37 構成違約，可以追究違約責任。故B項說法正確，不當選。C項。違約預約可以追究違約責任，但不得強制履行本約，因為本約的簽訂為債的標的不適於強制履行。故C項說法錯誤，當選。D項。基於合同相對性原理 ，吉祥快捷酒店與香格裡拉大酒店之間不存在合同關係，不得追究違約責任。故D項說法錯誤，當選。綜上所述，本題的正確答案為ACD。"}, {"id": "卷二-99", "subject": "卷二", "type": "多選題", "question": "2018年5月1日，王建軍駕車違章發生交通事故死亡，其妻周琳懷孕三個月。5月10日，王建軍的父親王海與周琳簽訂書面協議：“如把孩子順利生下來，就送10萬元給周琳。”經查，2018年3月20日，王建軍曾立下自書遺囑：“待我死後，自己所有的遺產歸父親王海所有。”2018年12月1日，孩子順利出生。王海拒絕支付 10萬元並主張繼承王建軍的全部遺產，各方產生爭議。關於本案，下列說法正確的有？（　）", "options": [{"key": "A", "text": "5月10日，王海與周琳簽訂的協議成立但未生效"}, {"key": "B", "text": "王建軍的遺囑合法有效"}, {"key": "C", "text": "王海可以行使任意撤銷權而拒絕支付10萬元"}, {"key": "D", "text": "王建軍的遺產應由王海、周琳和孩子平均分配"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】本題綜合考查附義務的贈與、胎兒利益保護和法定繼承。A項。王海和周琳訂立的贈與合同系附生效條件的贈與合同，5月10日簽訂時，該合同成立但未生效。故A項正確，當選。B項。2018年3月20日，王建軍在訂立書面遺囑時．妻子周琳已經懷孕，其必須給胎兒留有遺產，而王建軍的遺囑內容卻是將自己所有的遺產歸父親王海。因此，該書面遺囑部分有效部分無效。故B項錯誤，不當選。C項。王海（公公）與周琳 （兒媳婦）之間不屬於道德義務性質的贈與（注意：合同中受贈人系周琳而非胎兒）。因此，王海在轉移財產之前當然可以行使任意撤銷權。故C項正確，當選。D項。既然王建軍的遺囑部分有效部分無效，則王建軍的遺產應由父親王海和孩子繼承，周琳（妻子）無論如何不得參與遺產分配。故D項錯誤．不當選。綜上所述 ，本題的正確答案為AC。"}, {"id": "卷二-100", "subject": "卷二", "type": "多選題", "question": "甲公司將一項從丙公司竊取的技術秘密轉讓給乙公司。經查，對於該竊取行為乙公司亦參與其中。後丙公司發現上述事實，向法院提起訴訟。丙公司的下列主張能夠得到法院支持的有？（　）", "options": [{"key": "A", "text": "技術轉讓合同有效，但甲公司和乙公司應對丙公司承擔連帶責任"}, {"key": "B", "text": "技術轉讓合同無效．甲公司和乙公司應對丙公司承擔連帶責任"}, {"key": "C", "text": "技術轉讓合同無效．但乙公司應當承擔保密義務"}, {"key": "D", "text": "乙公司可在其取得時的範圍內繼續使用該技術秘密．但應向丙公司支付合理的使用費"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】A項。非法壟斷技術、妨礙技術進步或侵害他人技術成果的技術合同無效。故A項錯誤，不當選 。B、C、D項。當事人雙方惡意串通或一方知道或應當知道另一方侵權仍與其訂立或履行合同的，屬於共同侵權，法院應當判令侵權人承擔連帶賠償責任和保密義務。因此，取得技術秘密的當事人不得繼續使用該技術秘密。故B、C項正確，當選；D項錯誤，不當選。綜上所述，本題的正確答案為BC。 38"}, {"id": "卷二-1", "subject": "卷二", "type": "單選題", "question": "黃某負債後離家出走，為法院宣告死亡，其妻子郭某、孩子小黃繼承了黃某的遺產。後小黃死亡，郭某繼承了小黃的全部遺產。郭某此時與劉某再婚，但劉某此後因病去世。黃某還清負債後，再度出現，下列哪一說法是正確的？", "options": [{"key": "A", "text": "郭某只需將其從黃某處繼承的財產返還黃某"}, {"key": "B", "text": "郭某需將自小黃處繼承的全部財產返還黃某"}, {"key": "C", "text": "黃某與郭某的婚姻關係不能自行恢復"}, {"key": "D", "text": "因被宣告死亡，黃某還債之行為無效"}], "answer": ["C"], "explanation_full": "【羿文解析】《民法典》第53條第1款規定：“被撤銷死亡宣告的人有權請求依照本法第六編取得其財產的民事主體返還財產；無法返還的，應當給予適當補償。”本題中，郭某不僅應返還自己從黃某處繼承的遺產 ，小黃的遺產中包含了從黃某處繼承的財產，因此郭某還需返還其繼承的小黃的遺產中屬於黃某的財產。故 A選項錯誤；B選項錯誤。 《民法典》第51條：“被宣告死亡的人的婚姻關係，自死亡宣告之日起消除。死亡宣告被撤銷的，婚姻關係自撤銷死亡宣告之日起自行恢復。但是，其配偶再婚或者向婚姻登記機關書面聲明不願意恢復的除外。”本題中，由於郭某已經再婚，故其與黃某之間的婚姻關係不能自行恢復。故C選項正確。 《民法典》第49條規定：“自然人被宣告死亡但是並未死亡的，不影響該自然人在被宣告死亡期間實施的民事法律行為的效力。”本題中，雖然黃某被宣告死亡，但由於黃某並未死亡，因此宣告死亡的判決不影響黃某償債行為的效力。故D選項錯誤。 綜上，本題正確答案為C選項。"}, {"id": "卷二-2", "subject": "卷二", "type": "單選題", "question": "甲乙訂立贈與合同，約定如果乙考上研究生，甲將一輛車贈與給乙。合同訂立後，辦理了公證手續。以下說法何者正確？（　）", "options": [{"key": "A", "text": "該合同為附義務的贈與"}, {"key": "B", "text": "如果乙考上了研究生，而甲在交付車輛之前反悔，有權不履行贈與義務"}, {"key": "C", "text": "如果乙考上了研究生，而甲經濟狀況惡化，有權不履行贈與義務"}, {"key": "D", "text": "如果甲將車輛贈與給乙後，乙將甲的兒子打成重傷，甲的兒子有權自知道此事之日起6個月內，請求乙返還汽車"}], "answer": ["C"], "explanation_full": "【羿文解析】附義務的贈與，是指受贈人先接受贈與，然後履行約定的義務；附條件的贈與，是指條件成就後，贈與人實施贈與。本題屬於附條件的贈與，A不選。 《民法典》第658條規定：“贈與人在贈與財產的權利轉移之前可以撤銷贈與。經過公證的贈與合同或者依法不得撤銷的具有救災、扶貧等社會公益、道德義務性質的贈與合同，不適用前款規定。”本題中，甲乙的贈與合同辦理了公證手續，甲不得任意撤銷，B不選。 《民法典》第666條規定：“贈與人的經濟狀況顯著惡化，嚴重影響其生產經營或者家庭生活的，可以不再履行贈與義務。”據此，C選。 《民法典》第663條的規定，受贈人嚴重侵害贈與人或者贈與人的近親屬的，贈與人可以撤銷贈與。贈與人的撤銷權，自知道或者應當知道撤銷原因之日起1年內行使。D不選。"}, {"id": "卷二-3", "subject": "卷二", "type": "單選題", "question": "甲欲將動產A出質給乙，與乙訂立動產質押合同，約定即日起，乙即取得物A的質權，但是物A由甲代乙保管 。關於甲乙間的質押合同，以下說法何者正確？（　）", "options": [{"key": "A", "text": "質押合同違背法律的強制性規定，無效"}, {"key": "B", "text": "質押合同因未交付質物不生效"}, {"key": "C", "text": "質押合同有效，但是質權不成立"}, {"key": "D", "text": "質押合同有效，質權成立，但是該質權不得對抗善意第三人專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 1"}], "answer": ["C"], "explanation_full": "【羿文解析】甲乙質押合同中“乙取得質權，但由甲保管質物”的約定，意味著甲乙通過占有改定的方式 ，設立動產質押。禁止以占有改定方式設立動產質押，是法律對動產質押設立中的“交付”環節的要求，而非是針對動產質押合同的強制性規定，故質押合同並無違法之處，系屬有效，A不選。 如前所述，不存在民事行為“未生效”的五種情形，民事行為一經成立即生效，B不選。 動產質權的設立，為公示設立類型。質押合同具有債權效力，質物交付引起物權變動。本題中甲乙以占有改定方式“交付”質物，違反法律的強制性規定，“交付”無效，故物權不變動，但是並不影響質押合同的債權效力，質押合同仍屬有效，C選。 如前所述，物權的對抗是“物權間的對抗”。乙並未取得質權，沒有對抗可言，D不選。"}, {"id": "卷二-4", "subject": "卷二", "type": "單選題", "question": "甲電腦專賣店與乙訂立A型電腦分期付款買賣合同，總價款8000元。甲專賣店提供的合同文本以印刷體規定了兩項條款：①買受人一旦遲延付款，遲延期內每天應向出賣人支付相當於總價款的滯納金；②買受人一旦遲延付款，出賣人保修期內的保修責任即告免除。以下說法何者正確？（　）", "options": [{"key": "A", "text": "“滯納金條款”與“保修責任免除條款”均無效"}, {"key": "B", "text": "如果甲電腦專賣店不能證明自己對“滯納金條款”盡到提示注意與說明義務，乙有權主張該條款不成為合同內容"}, {"key": "C", "text": "如果甲電腦專賣店不能證明自己對“保修責任免除條款”盡到提示注意與說明義務，乙有權主張該條款不成為合同內容"}, {"key": "D", "text": "如果甲電腦專賣店證明自己對“滯納金條款”與“保修責任免除條款”盡到提示注意與說明義務，上述條款有效"}], "answer": ["C"], "explanation_full": "【羿文解析】本題中的“滯納金條款”與“保修責任免責條款”均屬於格式條款，且均免除提供格式條款一方責任、限制相對人的權利，即屬於免責條款。 根據《民法典》第497條第2項的規定，提供格式條款一方不合理地免除或者減輕其責任、加重對方責任、限制對方主要權利的格式條款無效。據此，本題中，“滯納金條款”所規定的權利、義務嚴重失衡，嚴重違背公平原則，為不當免責條款。依法無效。 《民法典》第496條第二款規定：“提供格式條款的一方未履行提示或者說明義務，致使對方沒有注意或者理解與其有重大利害關係的條款的，對方可以主張該條款不成為合同的內容。” 據此，本題中，“保修責任免除條款”並未逾越民法公平原則的範圍，屬於正當免責條款，提供格式條款一方應承擔提示注意與說明義務，否則相對人有權主張該條款不成為合同內容。在此基礎上，因正當免責條款並非當然無效，故A不選。 只有正當免責條款才要求提供方盡到提示注意與說明義務，不當免責條款直接無效，不涉及提示注意與說明義務的問題，故B、D不選，C選。"}, {"id": "卷二-5", "subject": "卷二", "type": "單選題", "question": "甲公司將一張定期存單出質給乙公司，用以擔保乙公司對甲公司的貨款債權。該存單現已到期，而甲公司債務的履行期尚未屆滿。以下說法何者正確？（　）", "options": [{"key": "A", "text": "乙公司憑存單質權取款後，與甲協商提前清償債務或提存"}, {"key": "B", "text": "未經甲公司的同意，乙公司不得憑存單質權取款"}, {"key": "C", "text": "乙公司應待甲公司的債務到期後，方可憑存單質權取款"}, {"key": "D", "text": "因尚未發生債務到期不履行的事實，故乙公司不得憑存單質權取款"}], "answer": ["A"], "explanation_full": "【羿文解析】《民法典》第442條規定：“匯票、支票、本票、債券、存款單、倉單、提單的兌現日期或者提貨日期先於主債權到期的，質權人可以兌現或者提貨，並與出質人協議將兌現的價款或者提取的貨物提前清償債務或者提存。”有價證券的兌現日期或者提貨日期先於主債權到期的，質權人可以兌現或者提貨，並與出質人協議將兌現的價款或者提取的貨物提前清償債務或者提存，故A選，B、C、D不選。 2"}, {"id": "卷二-6", "subject": "卷二", "type": "單選題", "question": "甲公司向乙銀行借款500萬元，以其閒置的一處辦公用房做擔保。乙銀行正好缺乏辦公場所，於是與甲公司商定，由甲公司以此辦公用房為乙銀行設立擔保物權。隨後，甲公司向乙銀行交付了辦公用房。借款到期後 ，甲公司未能償還，乙銀行主張對辦公用房行使優先受償的權利。下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "乙銀行有權這樣做，因其對標的物享有抵押權"}, {"key": "B", "text": "乙銀行有權這樣做，因其對標的物享有質權"}, {"key": "C", "text": "乙銀行有權這樣做，因其對標的物享有同時履行抗辯權"}, {"key": "D", "text": "乙銀行無權這樣做，因其與甲公司之間的約定不能設定擔保物權"}], "answer": ["D"], "explanation_full": "【羿文解析】《民法典》第388條規定：設立擔保物權，應當依照本法和其他法律的規定訂立擔保合同。該法第400條規定：設立抵押權，當事人應當採取書面形式訂立抵押合同。依據第395條第1款第1項的規定，債務人或者第三人有權處分的建築物和其他土地附著物可以抵押。該法第402條規定：以本法第395條第1款第一項至第三項規定的財產或者第五項規定的正在建造的建築物抵押的，應當辦理抵押登記，抵押權自登記時設立 。 依據以上法律規定，設立擔保物權要符合法定的形式，在不動產上設立擔保物權只能為抵押權，本題中並沒有信息表明甲、乙之間簽訂了關於辦公用房的抵押合同並辦理了抵押登記，所以抵押權並沒有設立，乙銀行對辦公用房並不享有抵押權。故A選項錯誤。 甲公司向乙銀行交付辦公樓並不是設立質權的行為，因為質權是一種動產質權。對不動產不能設立質權，故 B選項錯誤。 同時，履行抗辯權是在未約定先後履行順序的雙務合同中，當事人應當同時履行，一方在對方未為對待給付之前，有權拒絕其履行要求。本題中，甲乙之間的主合同是商業借貸性質的借款合同，需要貸款人先轉讓貨幣所有權，借款人後於一定期限內返還同種類數額的貨幣，是有先後履行順序的，並且借款合同的標的物是金錢，而甲公司的辦公用房為擔保協議的標的物。乙銀行不能基於主合同中甲公司未如期償還借款而主張對該辦公用房的同時履行抗辯權，故C選項錯誤。 乙銀行與甲公司之間的約定不符合法律規定，擔保物權並不成立。乙銀行不能主張對辦公用房優先受償的權利，故D選項正確。"}, {"id": "卷二-7", "subject": "卷二", "type": "單選題", "question": "甲將一塊手錶交給乙修理，後乙急需用錢，對丙謊稱手錶是自己的，將手錶交付給丙質押以獲得對方的借款。對此下列說法錯誤的是？（　）", "options": [{"key": "A", "text": "甲可以請求乙賠償損失"}, {"key": "B", "text": "甲可以請求丙返還手錶"}, {"key": "C", "text": "如乙不能按時還款，丙可以拍賣或變賣手錶以獲得優先清償"}, {"key": "D", "text": "如丙拍賣或變賣手錶將導致甲喪失手錶的所有權"}], "answer": ["B"], "explanation_full": "【羿文解析】依據《民法典》第311條的規定，質押權可以適用善意取得，因此，本案中丙可以取得質押權 ，那麼甲就不能對丙主張返還請求權，因為丙是有權占有人。但由於乙的無權處分導致甲無法取回手錶，因此，甲可以要求乙賠償損失，故A選項正確，B選項錯誤。 如果債務人不能按時清償債務的話，質押權人丙可以拍賣和變賣手錶，故C選項正確。 一旦丙拍賣手錶，甲將喪失所有權，故D選項正確。"}, {"id": "卷二-8", "subject": "卷二", "type": "單選題", "question": "關於民事權利，下列哪一選項是不正確的？（　）", "options": [{"key": "A", "text": "甲被乙家的狗咬傷，甲要求乙賠償的權利具有排他性"}, {"key": "B", "text": "丙為了通行方便，與戊達成從其後花園經過的協議，丙享有的此項權利具有支配性"}, {"key": "C", "text": "李某與徐某簽訂買賣合同，沒有約定履行的順序，現李某要求交貨，徐某以李某沒有支付貨款為由拒不履行，徐某行使的權利是抗辯權"}, {"key": "D", "text": "齊某與田某簽訂房屋租賃合同，約定若一方違約，另一方可在一個月內行使解除權。之後，齊某未經田某同意擅自將房屋轉租他人，田某可行使的解除權受除斥期間而非訴訟時效期間的限制專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 3"}], "answer": ["A"], "explanation_full": "【羿文解析】物權具有排他性，同一物上不能存在兩個所有權以及內容相互排斥的兩個他物權，而債權不具有排他性，同一標的上可以同時存在數個債權，這是物權與債權的主要區別。A選項是侵權之債，是債權的一種，不具有排他性，故A選項不正確。 根據《民法典》第372條第1款規定：“地役權人有權按照合同的約定，利用他人的不動產，以提高自己的不動產的效益。”B選項丙是為增加自己土地(需役地)的利用價值，而在他人土地(供役地)上設置的通行的權利 ，是地役權，地役權是物權的一種，具有支配性，故B選項正確。 民法上的抗辯權很多，有同時履行抗辯權、順序履行抗辯權、不安抗辯權、先訴抗辯權和時效消滅抗辯權。 C選項李某與徐某簽訂買賣合同，沒有約定履行的順序，雙方負有同時履行義務。現李某要求交貨，徐某以李某沒有支付貨款為由拒不履行，徐某行使的權利是同時履行抗辯權，故C選項正確。 訴訟時效抗辯是針對請求權是否過了訴訟時效而主張的，訴訟時效僅適用於請求權。而除斥期間一般適用於形成權，期間已過而權利人未行使形成權的，則該權利消滅。D選項齊某與田某約定的一個月期間為行使解除權的期間，由於解除權為形成權，因此，對田某行使解除權進行限制的一個月期間為除此期間而非訴訟時效期間。齊某未經田某同意擅自將房屋轉租他人，田某可行使的解除權受除斥期間而非訴訟時效期間的限制 ，故D選項正確。"}, {"id": "卷二-9", "subject": "卷二", "type": "單選題", "question": "汪某於2017年1月12日去世，留下一對玉扳指，其女兒小汪作為汪某唯一親人在13日清理其遺物時才發現這一對玉扳指。小汪於14日將玉扳指賣給侯某，但暫時借用三天，侯某表示同意。15日，小汪又以合理價格將玉扳指賣給不知情的陳某，並交付給陳某。16日，小汪又與丁某簽訂買賣合同，但謊稱玉扳指暫借於陳某 ，願將對陳某的返還請求權讓與丁某，作為交付，轉移所有權，丁某欣然允之。關於本案，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "小汪自13日方取得玉扳指的所有權"}, {"key": "B", "text": "14日玉扳指的所有權歸侯某"}, {"key": "C", "text": "16日玉扳指的所有權歸丁某"}, {"key": "D", "text": "丁某可以對陳某主張返還請求權"}], "answer": ["B"], "explanation_full": "【羿文解析】被繼承人去世，法定繼承人自繼承開始時取得所有權，故小汪應該是12日取得玉扳指的所有權 ，而不是13日清理遺物的時候，故A選項錯誤。 小汪將玉扳指賣給侯某，但暫借用三天，屬於占有改定，即小汪由所有權人變為借用人，侯某成為所有權人 ，故B選項正確。 小汪將玉扳指賣給不知情的陳某，小汪屬於有權占有人的無權處分，因此，陳某可以善意取得而獲得所有權 ，而小汪又賣給丁某，但是由於陳某是因為善意取得而成為所有權人而不是借用人，因此，即使丁某是善意的，也不能構成善意取得，無法取得所有權，故C選項錯誤，而丁某只能對小汪主張違約責任，而不能對陳某主張返還請求權，故D選項錯誤。"}, {"id": "卷二-10", "subject": "卷二", "type": "單選題", "question": "於慧承包了一片櫻桃園，在櫻桃收穫季節外出談生意不幸遭遇車禍變成植物人。好友向真因聯繫不上於慧家人，便主動為於慧辦理住院事宜和照看櫻桃園，並將櫻桃賣出，獲益10萬元。其中，為於慧交醫藥費花費 3萬元、摘賣櫻桃雇工費以及其他必要費用共5000元。向真認為自己應得勞務費5000元。關於向真的行為，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "10萬元屬於不當得利"}, {"key": "B", "text": "應向於慧家人給付6萬元"}, {"key": "C", "text": "應向於慧家人給付7萬元"}, {"key": "D", "text": "應向於慧家人給付6.5萬元"}], "answer": ["D"], "explanation_full": "4 定或約定的義務；②主觀上具有管理他人事務的意思：③客觀上具有管理他人事務的行為。本題中，向真在沒有法定和約定義務的情況下，為了避免於慧的利益受損，主動為於慧辦理住院事宜並對其櫻桃園進行管理的行為構成無因管理，而非不當得利。故A選項錯誤。 向真的行為構成無因管理，有權要求受益人即於慧的家人償付其因管理行為而支付的必要費用。該必要費用包括：向真為於慧交醫療費花費3萬元、摘賣櫻桃雇工費以及其他必要費用5000元，共3.5萬元，不包括向真要求的勞務費。因此，向真應從獲益的10萬元中扣除3.5萬元的必要費用。向於慧家人給付6.5萬元。故B、 C選項錯誤。D選項正確。"}, {"id": "卷二-11", "subject": "卷二", "type": "單選題", "question": "汪大夫婦系小汪的生父母。2010年6月，小汪被汪二夫婦(汪二系汪大的同胞哥哥)收養。後汪二經常虐待小汪，在多方勸阻後，汪二仍不知收斂。2014年4月。馬某通過其新浪微博發文(配8張臉部經“馬賽克”處理的女童受傷照片)：某夫婦收養一六歲女童，虐待行為在去年被發現，現女童傷情日漸嚴重，懇請媒體和大家的協助。該博文被廣泛轉發後，汪大夫婦認為馬某侵犯了小汪的肖像權和隱私權。關於本案，下列說法正確的是？（　）", "options": [{"key": "A", "text": "若汪大夫婦有撫養小汪的能力，則其不能將小汪送養給汪二夫婦"}, {"key": "B", "text": "若汪大夫婦因汪二虐待小汪而要求解除收養關係，則汪二夫婦可要求適當補償其已支出的撫養費"}, {"key": "C", "text": "馬某並未侵犯小汪的肖像權"}, {"key": "D", "text": "馬某侵犯了小汪的隱私權"}], "answer": ["C"], "explanation_full": "【羿文解析】(1)根據《民法典》第1099條第1款規定，收養三代以內同輩旁系血親的子女，可以不受“生父母有特殊困難無力撫養子女”這一條件的限制。本案中，汪大與汪二系同胞兄弟，兩人之間屬於三代以內同輩旁系血親，故即使汪大夫婦有撫養小汪的能力，汪大夫婦可以送養、汪二夫婦也可以收養小汪。因此，A選項不正確。 (2)根據《民法典》第1118條第2款規定，生父母要求解除收養關係的，養父母可以要求生父母適當補償收養期間支出的撫養費，但是，因養父母虐待、遺棄養子女而解除收養關係的除外。本案中，若汪大夫婦因汪二虐待小汪而要求解除收養關係，則汪二夫婦無權要求汪大夫婦適當補償其已支出的撫養費。因此，B選項不正確。 (3)根據《民法典》第110條規定，自然人享有肖像權。在民法理論中.肖像權是指自然人通過各種形式在客觀上再現自己形象而享有的專有權。對自然人肖像權的侵犯需具備兩個構成要件：其一，使用自然人肖像未經其同意；其二，以營利為目的進行使用。本案中，馬某將經過“馬賽克”處理的小汪照片在微博上公布雖然未徵得小汪的同意，但是其沒有以營利為目的進行使用，故未侵犯小汪的肖像權。因此，C選項正確。 (4)根據《民法典》第110條規定，自然人享有隱私權。在民法理論中。隱私權是指自然人享有的對與公共利益無關的個人信息、私人活動和私有領域進行支配的一種人格權。是否構成侵犯隱私權，應根據受害人有隱私被侵害的損害後果、行為人存在侵權行為、侵權行為與損害後果之間存在因果關係、行為人主觀上有過錯來認定。本案中，馬某對相關信息的披露是節制的，雖然博文中有“收養”二字，但是博文與照片結合後.他人並不能明顯識別出受害女童就是小汪，故馬某並不存在侵權行為；並且，馬某主觀上也不存在侵犯小汪隱私權的故意；故馬某未侵犯小汪的隱私權。因此，D選項不正確。 綜上所述，本題選C。"}, {"id": "卷二-12", "subject": "卷二", "type": "單選題", "question": "甲為某公司員工，在工作中獲取了乙犯罪的證據，便找到乙說：“你的車不錯，低價賣給我，否則舉報你犯罪”。乙照做，於2018年5月簽訂車輛買賣合同，6月辦理變更登記手續，手續完成後甲將證據交給乙。關於所涉民事法律行為的效力，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "乙不得向甲主張撤銷其出賣行為"}, {"key": "B", "text": "乙的撤銷通知自到達甲時，買賣合同失效"}, {"key": "C", "text": "甲不得向乙主張撤銷其購買行為"}, {"key": "D", "text": "乙的撤銷權自知道或者應當知道撤銷事由之日起1年內不行使則消滅 5"}], "answer": ["C"], "explanation_full": "【羿文解析】《民法典》第150條規定：“一方或者第三人以脅迫手段，使對方在違背真實意思的情況下實施的民事法律行為，受脅迫方有權請求人民法院或者仲裁機構予以撤銷。”本題中，甲是脅迫方沒有撤銷權 ，乙是受脅迫方有撤銷權。故A選項錯誤，C選項正確。 可撤銷行為必須通過訴訟或者仲裁予以撤銷，不能通知撤銷，故B選項錯誤。 《民法典》第152條規定：“有下列情形之一的，撤銷權消滅：(一)當事人自知道或者應當知道撤銷事由之日起一年內、重大誤解的當事人自知道或者應當知道撤銷事由之日起90日內沒有行使撤銷權；(二)當事人受脅迫，自脅迫行為終止之日起一年內沒有行使撤銷權；(三)當事人知道撤銷事由後明確表示或者以自己的行為表明放棄撤銷權。當事人自民事法律行為發生之日起五年內沒有行使撤銷權的，撤銷權消滅。”本題屬於脅迫，自脅迫行為終止之日起1年內沒有行使撤銷權的，撤銷權消滅。故D選項錯誤。 綜上所述，本題的正確答案為C。"}, {"id": "卷二-13", "subject": "卷二", "type": "單選題", "question": "2018年3月3日，甲向乙借款10萬元，約定還款日期為2019年3月3日。借款當日，甲將自己飼養的市值8萬元的名貴寵物狗質押交付給乙，作為債務到期不履行的擔保。第三人丙提供連帶責任保證。關於乙的質權 ，下列哪一說法是錯誤的？（　）", "options": [{"key": "A", "text": "2018年6月6日，寵物狗產狗崽市值2萬元，應交由甲處置"}, {"key": "B", "text": "因乙照管不善，2018年10月1日寵物狗死亡，乙需承擔賠償責任"}, {"key": "C", "text": "2019年6月6日，甲未償還借款，乙未實現質權，則甲可請求乙及時行使質權"}, {"key": "D", "text": "乙可放棄該質權，丙可在乙放棄質權的範圍內免除相應的保證責任"}], "answer": ["A"], "explanation_full": "【羿文解析】《民法典》第429條規定：“質權自出質人交付質押財產時設立。”第430條規定：“質權人有權收取質押財產的孳息，但合同另有約定的除外。前款規定的孳息應當先充抵收取孳息的費用。”本題中 ，甲將自己飼養的寵物狗質押交付給乙時，乙取得動產質權，並有權收取質物的天然孳息即狗崽，而無須交由甲處置，故A選項錯誤。 《民法典》第432條第1款規定：“質權人負有妥善保管質押財產的義務；因保管不善致使質押財產毀損、滅失的。應當承擔賠償責任。”本題中，因乙照管不善導致寵物狗死亡的，乙需承擔賠償責任，故B選項正確。 《民法典》第437條規定：“出質人可以請求質權人在債務履行期屆滿後及時行使質權；質權人不行使的，出質人可以請求人民法院拍賣、變賣質押財產。出質人請求質權人及時行使質權，因質權人怠於行使權利造成損害的，由質權人承擔賠償責任。”本題中，若質權人乙未及時實現質權，甲有權請求其及時行使，故C選項正確。 《民法典》第435條規定：“質權人可以放棄質權。債務人以自己的財產出質，質權人放棄該質權的，其他擔保人在質權人喪失優先受償權益的範圍內免除擔保責任，但其他擔保人承諾仍然提供擔保的除外。”本題中 ，乙可放棄債務人甲提供的質權的，其他擔保人丙可在乙喪失質權的範圍內免除相應的保證責任，故D選項正確。 綜上所述，本題的正確答案為A。"}, {"id": "卷二-14", "subject": "卷二", "type": "單選題", "question": "胡某將一批紅松木交給春蘭公司，要求春蘭公司將該批紅松木加工成一個書櫥和兩張雙人床。為此，雙方簽訂了加工承攬合同。關於本案，下列哪一說法是正確的？", "options": [{"key": "A", "text": "若春蘭公司將給書櫥安裝門把手的工作交給第三人，則該第三人應當就其完成的工作成果向胡某負責"}, {"key": "B", "text": "若春蘭公司擅自將雙人床的加工工作交給第三人，則胡某有權解除加工承攬合同"}, {"key": "C", "text": "胡某有權隨時變更工作要求，且無需賠償因此給春蘭公司造成的損失"}, {"key": "D", "text": "胡某有權隨時解除該加工承攬合同，且無需賠償因此給春蘭公司造成的損失"}], "answer": ["B"], "explanation_full": "【羿文解析】《民法典》第773條：“承攬人可以將其承攬的輔助工作交由第三人完成。承攬人將其承攬的輔助工作交由第三人完成的，應當就該第三人完成的工作成果向定作人負責。”本案中，當春蘭公司將給書櫥安裝門把手的工作交給第三人完成時，春蘭公司應當就該第三人完成的工作成果向胡某負責，而不是由第三人向胡某負責。因此，A項錯誤，不當選。 6 《民法典》第772條第二款：“承攬人將其承攬的主要工作交由第三人完成的，應當就該第三人完成的工作成果向定作人負責；未經定作人同意的，定作人也可以解除合同。”據此可知，承攬人未經定作人同意，將主要工作交給第三人完成時，定作人有權解除合同。本案中，加工雙人床的工作系主要工作，若春蘭公司將該工作交給第三人，則胡某有權解除該加工承攬合同。因此，B項正確，當選。 《民法典》第777條：“定作人中途變更承攬工作的要求，造成承攬人損失的，應當賠償損失。”本案中，胡某的確有權隨時變更工作要求，但其應賠償因此給春蘭公司造成的損失。”因此，C項錯誤，不當選。 《民法典》第787條：“定作人在承攬人完成工作前可以隨時解除承攬合同，造成承攬人損失的，應當賠償損失。”本案中，胡某只能在春蘭公司完成工作前的任意時間內解除該合同。且其應賠償因此給春蘭公司造成的損失。因此，D項錯誤，不當選。 綜上所述，本題選B。"}, {"id": "卷二-15", "subject": "卷二", "type": "單選題", "question": "苗某（68歲）聽說金泰商場最近在搞促銷活動，於是一大早就在商場門口排隊等候。上午9點，商場準時開門，苗某率先衝進去，因地面濕滑，苗某一下子摔倒在地。見當時沒有什麼不良反應，苗某繼續搶購。在買衣服時，苗某和另一名婦女為了搶購一件衣服發生爭執，並扭打起來，正在一旁值班的保安未上前制止。 關於本案，下列哪一說法是正確的？", "options": [{"key": "A", "text": "若後來苗某發現因滑倒而造成膝蓋腫脹，則因此造成的損失應由自己來承擔"}, {"key": "B", "text": "若苗某被該婦女打傷，則苗某只能要求該婦女承擔賠償責任"}, {"key": "C", "text": "若苗某被該婦女打傷，則苗某可以直接找商場，要求其承擔賠償責任"}, {"key": "D", "text": "若苗某被該婦女打傷，則苗某必須先找該婦女承擔賠償責任，只有在該婦女無法找到或無力賠償時，才可以要求商場承擔相應的賠償責任"}], "answer": ["D"], "explanation_full": "【羿文解析】《民法典》第1198條第一款：“賓館、商場、銀行、車站、娛樂場所等公共場所的管理人或者群眾性活動的組織者，未盡到安全保障義務，造成他人損害的，應當承擔侵權責任。” 《民法典》第1198條第二款：“因第三人的行為造成他人損害的，由第三人承擔侵權責任：管理人或者組織者未盡到安全保障義務的，承擔相應的補充責任。”需要注意的是，補充責任的特殊之處在於責任的承擔有嚴格的順序先後。 本案中，若苗某發現是因滑倒而造成的膝蓋腫脹。則商場應承擔因自身的行為而給他人造成損害的侵權責任 。因此，A項不正確，不當選。 若苗某被該婦女打傷，則屬於第三人侵權，此時因商場未盡到其應盡的安全保障義務，故商場應承擔相應的補充責任。在具體操作上，苗某應先找該婦女主張侵權責任，當該婦女無法找到或無力賠償時，苗某才可以要求商場承擔相應的賠償責任。因此，B項不正確，不當選；C項不正確，不當選；D項正確，當選。 綜上所述，本題選D。"}, {"id": "卷二-16", "subject": "卷二", "type": "單選題", "question": "2014年10月25日，甲向乙借款10萬元。當日，甲將自己的一輛汽車抵押乙，但沒有辦理抵押登記。同年 11月3日，甲又分別向丙、丁借款10萬元，甲同樣以該汽車抵押，並分別於11月7日、8日先後與丙、丁辦理了抵押登記。同年11月15日，甲再向戊借款10萬元，也用該汽車抵押，但沒有辦理登記。次年4月1日，甲的各項借款均已到期，但甲無力償還。乙、丙、丁、戊均欲對該汽車主張抵押權，關於該汽車上各抵押權實現的先後順序，下列哪一選項是正確的？", "options": [{"key": "A", "text": "①乙、②丙、③丁、④戊"}, {"key": "B", "text": "①丙、②丁、③戊、④乙"}, {"key": "C", "text": "①丁、②戊、③丙、④乙"}, {"key": "D", "text": "①丙、②丁、③乙和戊"}], "answer": ["D"], "explanation_full": "【羿文解析】根據《民法典》第403條：“以動產抵押的，抵押權自抵押合同生效時設立；未經登記，不得對抗善意第三人。”本案中，甲以同一輛汽車作為標的物進行了4次抵押，雖然有的進行了登記，有的沒有進行登記，但是登記與否都不影響抵押權本身的成立。 7 《民法典》第414條規定：“同一財產向兩個以上債權人抵押的，拍賣、變賣抵押財產所得的價款依照下列規定清償：（一）抵押權已經登記的，按照登記的時間先後確定清償順序；（二）抵押權已經登記的先於未登記的受償；（三）抵押權未登記的，按照債權比例清償。其他可以登記的擔保物權，清償順序參照適用前款規定。” 本案中，乙的抵押權和戊的抵押權都沒有辦理登記，而丙的抵押權和丁的抵押權辦理了登記，因此丙的抵押權和丁的抵押權優於乙的抵押權和戊的抵押權；又因為丙的抵押權優先於丁的抵押權登記，所以丙的抵押權最先實現，其次是丁的抵押權，至於乙的抵押權和戊的抵押權，因為都沒有辦理登記，所以按照債權比例處於同一順序清償。因此，A項、B項、C項均錯誤，不當選，D項正確，當選。 綜上所述，本題選D。"}, {"id": "卷二-17", "subject": "卷二", "type": "單選題", "question": "甲向乙借款20萬元，後未能按期還本付息，乙訴甲償還借款本金及利息。在訴訟中，雙方達成調解協議 ，由甲償還所欠全部本息並支付乙因起訴所花費的律師費、誤工費等必要費用，並由丙為該調解協議的履行提供擔保。但在法院送達調解書時，丙拒不簽收。關於本案，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "該調解協議超出訴訟請求，但不影響該調解協議的效力"}, {"key": "B", "text": "丙拒不簽收調解書，調解無效"}, {"key": "C", "text": "甲拒不還款，乙可以起訴擔保人丙，要求丙承擔連帶責任"}, {"key": "D", "text": "因本案涉及調解解決糾紛，所以，原則上法院不得開庭審理"}], "answer": ["A"], "explanation_full": "【羿文解析】A選項正確。在調解中不受處分原則的限制，調解協議超出訴訟請求範圍依然有效。但是調解協議不得違反法律的禁止性規定。 B選項不正確。擔保人不簽收調解書不影響調解書的效力，只要當事人簽收調解書，調解書就可以生效。 C選項不正確。債務人拒不履行債務，債權人可以直接執行擔保財產或者擔保人財產，而不需要另行起訴擔保人。 D選項不正確。調解過程是保密的，即調解原則上不得公開進行，而非調解案件不開庭"}, {"id": "卷二-18", "subject": "卷二", "type": "單選題", "question": "甲公司因遺失匯票，向A市B區法院申請公示催告。在公告期屆滿的第三天，乙公司向B區法院申報權利。 關於本案，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "對於乙公司逾期申報的行為，法院可根據甲公司的申請，作出判決，宣告票據無效。"}, {"key": "B", "text": "乙公司申報權利時，法院應當通知申請人前來查驗票據，但不會組織雙方當事人進行法庭調查與辯論"}, {"key": "C", "text": "乙公司申報權利時，法院應當組成合議庭審理"}, {"key": "D", "text": "若乙公司申報權利被駁回，甲公司應當自收到駁回裁定之日起1個月內申請法院作出判決"}], "answer": ["B"], "explanation_full": "【羿文解析】A選項不正確。申報權利可以從公告期開始之日一直申報到除權判決作出之前，所以在公告期屆滿的第三天，乙公司申報權利並不算是逾期申報，人民法院收到乙公司的申報後，應當裁定終結公示催告程序，並通知甲公司和支付人。 B選項正確。公示催告程序是非訟程序，因此不允許進行法庭調查及法庭辯論。 C選項不正確。公示催告程序中，分為公示催告階段和除權判決階段，申報權利的階段屬於公示催告階段，可以獨任也可以合議，並非應當組成合議庭。 D選項不正確。《民訴解釋》第450條：“在申報權利的期間無人申報權利，或者申報被駁回的，申請人應當自公示催告期間屆滿之日起一個月內申請作出判決。逾期不申請判決的，終結公示催告程序。”"}, {"id": "卷二-19", "subject": "卷二", "type": "單選題", "question": "關於訴的分類，下列哪一說法是錯誤的？", "options": [{"key": "A", "text": "甲起訴乙，要求確認甲乙之間收養關係有效，此案屬於確認之訴"}, {"key": "B", "text": "丙起訴丁，要求丁刪除在網上發布的辱罵丙的言論並停止繼續在網上發帖的行為，此案屬於給付之訴"}, {"key": "C", "text": "張某起訴李某，以受欺詐為由要求撤銷雙方訂立的買賣合同，此案屬於變更之訴"}, {"key": "D", "text": "趙某起訴王某，要求王某賠償違約損失5萬元，而王某辯稱該合同根本就不成立，這是確認之訴專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 8"}], "answer": ["D"], "explanation_full": "【羿文解析】確認之訴指原告請求法院確認其與被告之間是否存在某種民事法律關係的訴。故A項屬於確認之訴，正確。 變更之訴是指原告請求人民法院以判決改變或消滅某種既存的民事法律關係的訴。C項是為了消滅既存的法律關係，是變更之訴。 給付之訴是指原告請求法院判令被告履行一定民事義務的訴。B項屬於消極的給付之訴，正確。D項屬於積極的給付之訴，故錯誤。 綜上所述，本題選D。"}, {"id": "卷二-20", "subject": "卷二", "type": "單選題", "question": "下列案件事實中，需要由原告承擔證明責任的是哪一項？（　）", "options": [{"key": "A", "text": "胡某訴吳某飼養的狼狗咬傷自己，就胡某有故意的事實"}, {"key": "B", "text": "霹靂公司訴雷霆公司侵犯其產品製造方法發明專利，對於雷霆公司產品的製造方法不同於霹靂公司的專利方法的事實"}, {"key": "C", "text": "李某訴供電局安裝的高壓線過低而電死其牛，就李某無視危險標誌而牽牛經過高壓線的事實"}, {"key": "D", "text": "曾某訴某公司產品存在嚴重缺陷致使自己人身傷害，就產品存在嚴重缺陷的事實"}], "answer": ["D"], "explanation_full": "【羿文解析】對於一般民事侵權案件，原告需要證明①侵權行為；②損害結果；③因果關係；④過錯。被告需要證明免責事由。 A選項中，飼養動物侵權採取無過錯歸責原則，過錯不屬於本案的證明對象，無需任何一方舉證。胡某屬於被害人，被害人故意屬於免責事由，應由被告承擔證明責任。 B選項中，製造方法專利侵權適用舉證責任倒置，由被告證明其產品製造方法不同於專利方法。 C選項中，因高度危險作業致人損害的侵權訴訟，由加害人就受害人故意造成損害的事實承擔舉證責任。 D選項中，產品責任中，遵循“誰主張，誰舉證”的舉證規則，產品質量受損害方仍應承擔相應的舉證責任。 綜上所述，D選項當選。"}, {"id": "卷二-21", "subject": "卷二", "type": "單選題", "question": "苗某與汪某將共有商鋪出租給馬某。汪某瞞著苗某，與馬某簽訂房屋買賣合同，將商鋪轉讓給馬某，後因該合同履行發生糾紛，汪某將馬某訴至法院。苗某得知後，堅決不同意汪某將商鋪轉讓於馬某。關於本案相關人的訴訟地位，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "法院應依職權追加苗某為共同原告"}, {"key": "B", "text": "苗某應以汪某侵權起訴，馬某為無獨立請求權第三人"}, {"key": "C", "text": "苗某應作為無獨立請求權第三人"}, {"key": "D", "text": "苗某應作為有獨立請求權第三人"}], "answer": ["D"], "explanation_full": "【羿文解析】本案中，房屋買賣合同雙方當事人是汪某和馬某，基於合同相對性，苗某不能作為共同原告參加訴訟。故A選項錯誤。本案中，苗某對於馬某和汪某之間爭執的標的物主張所有權，故其應作為有獨立請求權第三人蔘與到訴訟中。D選項正確，C選項錯誤。"}, {"id": "卷二-22", "subject": "卷二", "type": "單選題", "question": "傅某與黃某因一台電腦的權屬發生糾紛，傅某向人民法院提起訴訟。在訴訟過程中，靳某提出電腦歸他所有，並參加訴訟。在法庭辯論終結後、判決宣告前，傅某申請撤訴。下列哪一說法是錯誤的？（　）", "options": [{"key": "A", "text": "如果傅某有違反法律的行為需要依法處理的，人民法院可以不準撤訴或不按撤訴處理"}, {"key": "B", "text": "如果黃某不同意傅某撤訴，則法院可以不准許傅某撤訴"}, {"key": "C", "text": "如果人民法院准許傅某撤訴，則靳某作為另案原告，傅某、黃某作為另案被告，訴訟另行進行"}, {"key": "D", "text": "如果人民法院准許傅某撤訴，則訴訟程序終結"}], "answer": ["D"], "explanation_full": "9 。據此，C選項正確，D選項錯誤。 《民事訴訟法解釋》第238條規定，當事人申請撤訴或者依法可以按撤訴處理的案件，如果當事人有違反法律的行為需要依法處理的，人民法院可以不准許撤訴或者不按撤訴處理。法庭辯論終結後原告申請撤訴，被告不同意的，人民法院可以不予准許。因此A選項、B選項正確。 故本題應選D選項。"}, {"id": "卷二-23", "subject": "卷二", "type": "單選題", "question": "甲訴乙合同糾紛案，涉及標的額600元。北山市北山縣法院受理該案件後，按照小額訴訟進行了審理。經終審法院作出駁回甲訴訟請求的判決後，甲因收集到新的證據而申請再審。下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "甲只能向北山縣法院申請再審"}, {"key": "B", "text": "甲可以向北山市法院申請再審"}, {"key": "C", "text": "北山縣法院再審時，不能吸收陪審員"}, {"key": "D", "text": "甲對北山縣法院的再審判決不服，可以上訴"}], "answer": ["B"], "explanation_full": "【羿文解析】A錯誤，B正確。當事人對已經發生法律效力的判決、裁定，認為有錯誤的，可以向上一級人民法院申請再審；當事人一方人數眾多或者當事人雙方為公民的案件，也可以向原審人民法院申請再審。本案甲乙均為公民，故可選擇向原審法院或向上一級法院申請。 C選項錯誤。北山縣法院審理時，不得適用簡易程序再審，應按照一審普通程序審理，可以吸收陪審員。 D選項錯誤。對小額訴訟程序再審得到的判決，只有因為錯誤適用小額訴訟程序才可以上訴，而本案再審的事由是有新證據，故得到的再審判決不可以上訴。"}, {"id": "卷二-24", "subject": "卷二", "type": "單選題", "question": "關于先予執行，下列法院做法正確的是：（　）", "options": [{"key": "A", "text": "贍養費訴訟中，主審法官發現原告王大爺生活困難，主動作出先予執行的裁定"}, {"key": "B", "text": "甲公司盜版乙公司的軟件，每天都大量銷售。乙公司起訴前申請先予執行。禁止甲公司繼續銷售"}, {"key": "C", "text": "追討撫恤金案件中，法院責令申請人龐某提供擔保，龐某不提供擔保，法院駁回了其先予執行的申請"}, {"key": "D", "text": "被告認為先予執行醫療費的裁定錯誤，向法院申請再審，法院裁定再審後，沒有同時中止執行"}], "answer": ["C"], "explanation_full": "【羿文解析】A選項錯誤。先予執行只能依申請啟動，不可以主動作出。 B選項錯誤。先予執行只能在訴訟中申請，不可以在訴前申請。 C選項正確。在先予執行中，法院可以讓當事人提供擔保；若當事人不提供擔保，則駁回當事人的申請。 D選項錯誤。D選項比較特殊，法院裁定再審時，應同時裁定中止執行，但四費一金勞動報酬的案件可以不中止執行，但是先予執行的裁定是不能再審的，所以，法院裁定再審的行為是違法的。"}, {"id": "卷二-25", "subject": "卷二", "type": "單選題", "question": "甲乙丙三人合夥開辦電腦修理店，店名為“一通電腦行”，依法登記。甲負責對外執行合夥事務。顧客丁進店送修電腦時，被該店修理人員戊的工具碰傷。丁擬向法院起訴。關於本案被告的確定，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "“一通電腦行”為被告"}, {"key": "B", "text": "甲為被告"}, {"key": "C", "text": "甲乙丙三人為共同被告，並註明“一通電腦行”字號"}, {"key": "D", "text": "甲乙丙戊四人為共同被告"}], "answer": ["C"], "explanation_full": "【羿文解析】《民訴解釋》第60條規定，在訴訟中，未依法登記領取營業執照的個人合夥的全體合夥人為共同訴訟人。個人合夥有依法核准登記的字號的，應在法律文書中註明登記的字號。全體合夥人可以推選代表人；被推選的代表人，應由全體合夥人出具推選書。 《民法典》第1191條規定，用人單位的工作人員因執行工作任務造成他人損害的，由用人單位承擔侵權責任 10 擔相應的責任。本題中，應將甲乙丙三人列為共同被告，並在法律文書中註明所登記的字號“一通電腦行 ”。戊作為合夥組織的雇員，其在進行雇傭合同所規定的生產經營活動中致他人損害，應將其雇主列為當事人，而不應將其作為當事人，故戊不能作為共同被告。本題正確答案為C選項，A、B、D三項皆不正確。"}, {"id": "卷二-26", "subject": "卷二", "type": "單選題", "question": "關於仲裁的程序，下列說法正確的是（　）", "options": [{"key": "A", "text": "組成仲裁庭的3名仲裁員可能均由仲裁委員會主任指定"}, {"key": "B", "text": "組成仲裁庭的3名仲裁員可能均由當事人共同選定"}, {"key": "C", "text": "仲裁員迴避後，應當由仲裁委員會主任另行指定仲裁員，當事人可以申請已經進行的仲裁程序重新進行"}, {"key": "D", "text": "仲裁員迴避後，已經進行的仲裁程序是否重新進行應當由仲裁委員會決定"}, {"key": "C", "text": "D選項是關於仲裁員迴避的後果的規定，應當由當事人按照仲裁員的產生方式重新選定仲裁員或者委託主任指定仲裁員，而不能由仲裁委員會主任直接另行指定，C表述錯誤。關於仲裁員迴避後，已經進行的仲裁程序是否重新進行應當由仲裁庭決定，當然當事人也可以向仲裁庭提出申請，而D選項中決定主體是仲裁庭而不是仲裁委員會，表述錯誤。注意與民事訴訟的區別，民事訴訟中，審判人員迴避後，已經進行的訴訟程序不需要重新進行。"}], "answer": ["A"], "explanation_full": "【羿文解析】關於仲裁庭的組成方式，首先由當事人各自選擇或者各自委託仲裁委員會主任指定1名仲裁員 ，然後由當事人共同選定或者共同委託主任指定1名仲裁員作為首席仲裁員。可知仲裁中3名仲裁員可能均由仲裁委員會主任指定，即前兩名由當事人各自委託主任指定，首席仲裁員由當事人共同委託主任指定，A選項正確。 B選項中雖然3名仲裁員均可能由當事人選定，但前兩名是各自選定，首席仲裁員才是共同選定，表述說均由當事人共同選定是錯誤的。"}, {"id": "卷二-27", "subject": "卷二", "type": "單選題", "question": "2013年2月，顧某向唐某借款2萬元，約定1年後還本付息。債務到期後顧某並未歸還，唐某礙於情面也未催其還款。2017年9月，唐某突然因病過世，2018年5月，唐某的獨生子小唐向法院起訴，要求顧某歸還借款 。關於本案，下列哪一項說法是錯誤的？（　）", "options": [{"key": "A", "text": "法院應當依法受理該案"}, {"key": "B", "text": "顧某可以原告訴請超過訴訟時效為由提起反訴"}, {"key": "C", "text": "小唐應為本案的適格原告"}, {"key": "D", "text": "原告應承擔顧某借款事實的證明責任"}], "answer": ["B"], "explanation_full": "【羿文解析】《民事訴訟法解釋》第219條規定，當事人超過訴訟時效期間起訴的，人民法院應予受理。據此 ，本案雖已過訴訟時效，小唐起訴法院應當受理。A選項說法正確，不當選。 反駁是指被告針對原告提出的訴訟請求和理由，從實體上和程序上、從事實上和法律上予以否定或部分否定 。反駁與反訴最大的區別在於反駁並非向原告提出獨立的訴訟請求。提出訴請超過訴訟時效屬於時效抗辯 ，這屬於反駁而非反訴。B選項說法錯誤，當選。 適格當事人是指對於具體的訴訟，有作為本案當事人起訴或應訴的資格。適格當事人必須具有訴訟權利能力 ，唐某因病死亡，死者因欠缺訴訟權利能力自然不能成為適格當事人。基於法定繼承權小唐有權繼承唐某的遺產，其當然屬於適格當事人。C選項說法正確，不當選。 《民事訴訟法解釋》第91條第(一)項規定，主張法律關係存在的當事人，應當對產生該法律關係的基本事實承擔舉證證明責任。本案中原告小唐主張顧某向其父親借款，應對借款事實承擔證明責任。D選項說法正確 ，不當選。"}, {"id": "卷二-28", "subject": "卷二", "type": "單選題", "question": "優泰股份有限公司股本總額為1500萬元，張某為公司董事，未經股東會和監事會同意.擅自以公司財產為他人提供擔保，給公司造成了重大經濟損失。該公司設有監事會。下列主體中可對張某提起訴訟的是？（ ）", "options": [{"key": "A", "text": "甲公司為該公司股東，3個月前購入該公司價值150萬元的股份專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 11"}, {"key": "B", "text": "錢某、趙某、武某三個自然人已連續200天合計持有該公司價值150萬元的股份，三人聯合提起訴訟"}, {"key": "C", "text": "該公司監事會"}, {"key": "D", "text": "該公司監事會成員譚某"}], "answer": ["C"], "explanation_full": "【羿文解析】對於給公司造成損害的董事、監事的訴訟方式，《公司法》賦予了股東在一定的條件下可以提起訴訟的權利。該法第151條對此作了詳細的規定。需要注意的是：有限責任公司的股東、股份有限公司連續 180日以上單獨或者合計持有公司1％以上股份的股東並不能直接提起訴訟，而必須書面請求監事會或者不設監事會的有限責任公司的監事向人民法院提起訴訟；只有在監事會、不設監事會的有限責任公司的監事，收到書面請求後拒絕提起訴訟，或者自收到請求之日起30日內未提起訴訟，或者情況緊急、不立即提起訴訟將會使公司利益受到難以彌補的損害的，才能以自己的名義直接向人民法院提起訴訟。所以，A、B、D三項均錯誤，C選項正確。本題答案為C。"}, {"id": "卷二-29", "subject": "卷二", "type": "單選題", "question": "甲公司因為業務發展需要，公司股東大會決定將公司進行分立，同時甲公司對乙公司尚有300萬元的債務還未清償，分立前甲公司也沒有和債權人就債務清償達成任何書面協議，對此下列說法不正確的是？（　）", "options": [{"key": "A", "text": "甲公司的分立，不論是派生分立還是新設分立，都需要依法簽訂分立協議，但不需要經過公司清算程序"}, {"key": "B", "text": "如果採取派生分立，即甲公司以其部分資產另設丙公司，同時原甲公司繼續存在，則甲公司對於乙公司的債務仍由甲公司承擔，與新分立的丙公司沒有關係"}, {"key": "C", "text": "甲公司分立後，登記事項發生變更的，應當依法向公司登記機關辦理變更登記"}, {"key": "D", "text": "如果採取新設分立，即將甲公司全部資產分別劃歸給新設公司丙公司和丁公司，則甲公司對於乙公司原有的債務，由分立後的丙、丁兩家公司承擔連帶清償責任"}], "answer": ["B"], "explanation_full": "【羿文解析】公司分立是指一個公司通過依法簽訂分立協議，不經過清算程序，分為兩個或兩個以上公司的法律行為。公司分立不像公司解散和破產，無需經過清算程序，故選項A正確。 公司分立有派生分立和新設分立兩種形式。但不管是派生分立還是新設分立，根據《公司法》和《民法典》 的規定，公司分立後，除債權人和債務人另有約定的以外，由分立後的法人享有連帶債權，承擔連帶債務。 因此，如果甲公司派生分立出丙公司，則甲公司應和丙公司連帶承擔對於乙公司300萬元債務的清償責任，故選項B錯誤，選項D正確。 依據《公司法》第179條的規定，公司合併或者分立，登記事項發生變更的，應當依法向公司登記機關辦理變更登記，故選項C正確。 本題答案為B。"}, {"id": "卷二-30", "subject": "卷二", "type": "單選題", "question": "龍騰有限公司由甲、乙、丙、丁四名股東共同設立，關於各股東出資情況，下列哪一表述是正確的？（ ）", "options": [{"key": "A", "text": "甲可以用設定抵押權的機器設備作為出資"}, {"key": "B", "text": "龍騰公司在乙的出資期限到來前就破產清算，則乙的出資義務免除"}, {"key": "C", "text": "丙以勞務出資"}, {"key": "D", "text": "丁即使出資不實也不影響其獲得股東資格"}], "answer": ["D"], "explanation_full": "【羿文解析】根據《公司法》第27條規定：“股東可以用貨幣出資，也可以用實物、知識產權、土地使用權等可以用貨幣估價並可以依法轉讓的非貨幣財產作價出資；但是，法律、行政法規規定不得作為出資的財產除外。對作為出資的非貨幣財產應當評估作價，核實財產，不得高估或者低估作價。法律、行政法規對評估作價有規定的，從其規定。”《登記管理條例》第14條規定：“股東的出資方式應當符合《公司法》第27條的規定，但股東不得以勞務、信用、自然人姓名、商譽、特許經營權或者設定擔保的財產等作價出資。”甲用設定抵押權的機器設備作為出資，存在權利負擔，不得作為出資，故A選項不當選，C選項不當選。 12 繳納期限的出資。”公司解散時，股東尚未繳納的出資.包括到期應繳未繳的出資，及分期繳納尚未屆滿繳納期限的出資，均視為到期，故B選項不當選。 出資不實是指出資的非貨幣財產的實際價額顯著低於公司章程所定價額，股東承擔補足差價的責任。並不會導致股東資格的喪失，故D選項當選。 本題答案為D。"}, {"id": "卷二-31", "subject": "卷二", "type": "單選題", "question": "2017年9月，甲、乙、丙共同出資設立英姿服飾有限公司。甲用一套房屋作價1000萬元出資，用作公司廠房。經評估，公司發現其價值實際應為700萬元。乙把租賃的油罐車用於出資，公司對此不知情。丙用600萬元現金作為出資，後經查明發現該筆資金系丙貪污所得。2018年3月，鄭某新加入英姿服飾有限公司。對此。 下列哪一說法是錯誤的？", "options": [{"key": "A", "text": "甲需要補足300萬元差價"}, {"key": "B", "text": "油罐車所有人無權追回該車輛"}, {"key": "C", "text": "丙出資無效"}, {"key": "D", "text": "鄭某不對甲欠繳出資承擔連帶責任"}], "answer": ["C"], "explanation_full": "【羿文解析】根據《公司法》第30條的規定，有限責任公司成立後，發現作為設立公司出資的非貨幣財產的實際價額顯著低於公司章程所定價額的，應當由交付該出資的股東補足其差額：公司設立時的其他股東承擔連帶責任。故A項正確。出資的非貨幣財產的實際價額顯著低於公司章程所定價額的，屬於出資不實，公司設立時的其他股東承擔連帶責任，鄭某屬於後加入股東，不應當承擔連帶責任，故D項正確。 根據《公司法解釋(三)》第7條的規定，出資人以不享有處分權的財產出資，當事人之間對於出資行為效力產生爭議的，人民法院可以參照民法典第三百一十一條的規定予以認定。以貪污、受賄、侵占、挪用等違法犯罪所得的貨幣出資後取得股權的，對違法犯罪行為予以追究、處罰時，應當採取拍賣或者變賣的方式處置其股權。因公司為善意不知情，車輛所有人無權追回該出資，只能要求乙賠償損失，故B項正確。以違法犯罪資金出資，在追繳時需要通過處置股權的方式予以追究和處罰，說明出資已經有效形成股權，故C項錯誤。 綜上所述，本題選C。"}, {"id": "卷二-32", "subject": "卷二", "type": "單選題", "question": "甲、乙、丙、丁4人合夥設立一個合夥企業，甲出資10萬元，乙、丙、丁分別出資20萬元、8萬元、15萬元 。合夥企業經營過程中，甲在未通知其他合夥人的情況下將其在合夥企業中的份額8萬元轉讓給了丁，乙未經其他合夥人同意將其在合夥企業中的財產出質給其債權人戊，丙將其在合夥企業中的份額轉讓給了合夥企業之外的己。後合夥企業由於出現解散事由而進入清算階段，在開始清算前丁將10萬元的合夥財產轉讓給了庚 ，清算過程中合夥企業的債權人辛(對合夥企業享有50萬元債權)對此提出異議。下列表述中哪一項是符合法律規定的？", "options": [{"key": "A", "text": "甲轉讓其在合夥企業中的份額給丁，不需要其他合夥人的同意，也不需通知其他合夥人"}, {"key": "B", "text": "乙的行為違法，因為其將其在合夥企業中的份額出質需要通知其他合夥人"}, {"key": "C", "text": "合夥企業不得以丁的行為對抗善意第三人辛，仍應償還對債權人辛的全部債務"}, {"key": "D", "text": "丙依法轉讓其財產份額，在同等條件下，合夥人乙、丁有優先受讓權，而甲則沒有"}], "answer": ["C"], "explanation_full": "【羿文解析】依據《合夥企業法》第22條第2款的規定，合夥人之間轉讓在合夥企業中的全部或者部分財產份額時，應當通知其他合夥人。甲轉讓其出資份額給丁應當通知其他合夥人，故A項錯誤。 B項原因描述錯誤，依據該法第25條的規定，合夥人以其在合夥企業中的財產份額出質的，須經其他合夥人一致同意：未經其他合夥人一致同意，其行為無效，由此給善意第三人造成損失的，由行為人依法承擔賠償責任。故B項也不能選。 C項符合《合夥企業法》第21條第2款的規定，合夥人在合夥企業清算前私自轉移或者處分合夥企業財產的 ，合夥企業不得以此對抗不知情的善意第三人。 D項不符合《合夥企業法》第23條的規定，合夥人向合夥人以外的人依法轉讓其財產份額的，在同等條件下 13 行為而退出合夥企業，仍然有優先受讓權。 綜上所述，本題選C。"}, {"id": "卷二-33", "subject": "卷二", "type": "單選題", "question": "張三、李四、王五、趙六經協商一致決定設立名為“三里屯”有限合夥企業，四人委託某律師事務所律師為其擬定一份合夥協議，關於該合夥協議的約定，下列說法正確的是：（　）", "options": [{"key": "A", "text": "經合夥協議約定，有限合夥人可以貨幣、實物、勞務、知識產權或其他財產作價■資"}, {"key": "B", "text": "經合夥協議約定，有限合夥人可以執行部分合夥事務"}, {"key": "C", "text": "合夥人可以約定丙按固定數額分配紅利而不承擔虧損"}, {"key": "D", "text": "可以約定不經全體合夥人一致同意而吸收新的合夥人"}], "answer": ["D"], "explanation_full": "【羿文解析】A選項不當選。有限合夥人不得以勞務出資，其他出資方式和普通合夥人一致。 B選項不當選。參見《合夥企業法》第68條第1款：“有限合夥人不執行合夥事務，不得對外代表有限合夥企業。” C選項不當選。前半句“丙按固定數額分配紅利”正確，但後半句“而不承擔虧損”錯誤。 D選項當選。有限合夥人一節沒有特別規定的，適用普通合夥人的規則。就入夥問題，比照《合夥企業法》第 43條第1款的規則：“新合夥人入夥，除合夥協議另有約定外，應當經全體合夥人一致同意，並依法訂立書面入夥協議。”所以允許“合夥協議另有約定”。"}, {"id": "卷二-34", "subject": "卷二", "type": "單選題", "question": "甲從乙處購買了一批桌椅，向乙簽發了一張金額為10萬元的匯票，並註明“不得轉讓”。乙將該匯票轉讓給15歲的丙，並記載“不得轉讓”字樣。對此，下列哪一說法是錯誤的？（　）", "options": [{"key": "A", "text": "乙向丙轉讓匯票的行為不合法"}, {"key": "B", "text": "若丙再次背書轉讓匯票，乙對丙的被背書人不承擔保證責任"}, {"key": "C", "text": "若丙不慎丟失匯票，可及時通知票據付款人掛失止付"}, {"key": "D", "text": "若丙背書轉讓該匯票，匯票將失去支付作用"}], "answer": ["D"], "explanation_full": "【羿文解析】A選項考查的是票據權利的取得。《票據法》第27條第1款、第2款規定：“持票人可以將匯票權利轉讓給他人或者將一定的匯票權利授予他人行使。出票人在匯票上記載‘不得轉讓’字樣的，匯票不得轉讓。”因此，匯票權利可以轉讓或授予他人行使，但出票人標注“不得轉讓”的，匯票不得轉讓。A選項說法正確，不當選。 B選項考查的是背書人禁止轉讓的效力。《票據法》第34條規定：“背書人在匯票上記載‘不得轉讓’字樣 ，其後手再背書轉讓的，原背書人對後手的被背書人不承擔保證責任。”甲作為背書人已載明“不得轉讓 ”，乙再次背書轉讓的，乙不承擔保證責任。另補充《票據法》關於“附條件”的規定：根據第22條關於匯票的必須記載事項的規定，匯票必須記載無條件支付的委託。未記載或附條件的，匯票無效；根據第33條的規定，背書不得附有條件。背書時附有條件的，所附條件不具有匯票上的效力。B選項說法正確，不當選。 C選項考查的是票據喪失時的補救。《票據法》第15條規定：“票據喪失，失票人可以及時通知票據的付款人掛失止付，但是，未記載付款人或者無法確定付款人及其代理付款人的票據除外。收到掛失止付通知的付款人，應當暫停支付。失票人應當在通知掛失止付後三13內，也可以在票據喪失後，依法向人民法院申請公示催告，或者向人民法院提起訴訟。”因此，在票據喪失後，失票人可選擇的救濟途徑有三種：一是及時通知票據的付款人掛失支付；二是向人民法院申請公示催告；三是向人民法院提起訴訟。C選項說法正確，不當選 。 D選項考查的是不完全民事行為能力人簽章的效力。《票據法》第6條規定：“無民事行為能力人或者限制民事行為能力人在票據上簽章的，其簽章無效，但是不影響其他簽章的效力。”根據題乾，丙年僅15歲，因而屬於限制民事行為能力人，故初步判斷丙的簽章無效；根據第6條的後半句，可知丙之簽章不影響其他簽章的效力。若其他簽章不存在無效事由，被背書人仍可行使票據權利。D選項說法錯誤，當選。"}, {"id": "卷二-35", "subject": "卷二", "type": "單選題", "question": "天元有限責任公司從事智能音響生產業務，袁聲、袁音、袁樂三人是公司的發起人股東，2018年3月，免專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 14 除袁聲欠繳的出資款200萬元，決議公司生產轉向智能聲控技術開發，袁樂以股東會召集程序違法為由要求撤銷該決議。針對免除袁聲200萬元出資義務的決議，投反對票的袁音請求確認該股東會決議無效。對此，下列表述正確的是？（　）", "options": [{"key": "A", "text": "該決議無效，袁聲的出資義務不能免除"}, {"key": "B", "text": "該決議有效，袁聲的出資義務已經免除"}, {"key": "C", "text": "如果全體股東一致同意，可以免除袁聲的出資義務"}, {"key": "D", "text": "除向公司足額繳納外，袁聲還應向其他股東承擔違約責任"}], "answer": ["A"], "explanation_full": "【羿文解析】根據《公司法》第28條規定：“股東應當按期足額繳納公司章程中規定的各自所認繳的出資額 。股東以貨幣出資的，應當將貨幣出資足額存人有限責任公司在銀行開設的賬戶；以非貨幣財產出資的，應當依法辦理其財產權的轉移手續。股東不按照前款規定繳納出資的，除應當向公司足額繳納外.還應當向已按期足額繳納出資的股東承擔違約責任。”再根據《公司法》第22條第1款規定：“公司股東會或者股東大會、 董事會的決議內容違反法律、行政法規的無效。”因此，股東按期足額出資屬於股東的法定義務.股東會對袁聲的出資義務免除決議屬於無效決議，該出資義務不能被免除。A選項正確，B、C選項錯誤。 袁聲作為發起人股東未足額繳納出資屬於設立階段的股東出資不足，其應當對其他已經按期足額繳納出資的發起人股東承擔違約責任，而不是對所有股東承擔違約責任。一定注意，是對已經按期足額繳納出資的發起人股東承擔違約責任。所以D選項說法不嚴謹，錯誤。 本題答案為A。"}, {"id": "卷二-36", "subject": "卷二", "type": "單選題", "question": "甲以一台機器作價800萬元出資，成為某合夥企業普通合夥人。一年後，甲因經營管理理念與其他合夥人發生分歧，要求退出該合夥企業。經查，該合夥企業合夥人有甲、乙、丙三人，成立後合夥企業盈利共30萬元；甲曾因重大過失造成合夥企業一筆20萬元損失。對此，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "甲無權要求分割30萬元企業利潤"}, {"key": "B", "text": "甲所造成的20萬元損失應當在合夥企業解散時追償"}, {"key": "C", "text": "合夥企業無需進行財產清算"}, {"key": "D", "text": "甲有權取回所出資的機器"}], "answer": ["C"], "explanation_full": "【羿文解析】根據《合夥企業法》第51條規定：“合夥人退夥，其他合夥人應當與該退夥人按照退夥時的合夥企業財產狀況進行結算，退還退夥人的財產份額。退夥人對給合夥企業造成的損失負有賠償責任的，相應扣減其應當賠償的數額。”因此，甲退夥時合夥企業應當按照當時財產狀況盈利30萬元與甲進行結算；同時 ，甲因重大過失對企業造成損失應負有賠償責任，合夥企業應該在甲退夥時而非合夥企業解散時追償，故A、 B選項錯誤。 合夥企業解散時需要進行財產清算，個別合夥人退夥時辦理結算即可，故C選項正確。 根據《合夥企業法》第52條規定：“退夥人在合夥企業中財產份額的退還辦法，由合夥協議約定或者由全體合夥人決定，可以退還貨幣，也可以退還實物。”合夥人退夥時退還貨幣還是實物，是由合夥協議約定或者由全體合夥人決定的；在沒有明確約定的情況下，甲無權要求退還原物，故D選項錯誤。 本題答案為C。"}, {"id": "卷二-37", "subject": "卷二", "type": "單選題", "question": "崔某給兒子買了一份人壽保險，自己是受益人。數年後其子因為醫療事故不幸身亡。關於本案，下列哪一表述是正確的？", "options": [{"key": "A", "text": "崔某可以在向保險公司索賠的同時向醫院索賠"}, {"key": "B", "text": "崔某應先向醫院索賠，醫院無力賠償時再向保險公司索賠"}, {"key": "C", "text": "保險公司對崔某賠償後可以向醫院進行追償"}, {"key": "D", "text": "如果保險公司拒絕對崔某給付保險金，則崔某不能用訴訟方式要求保險公司支付"}], "answer": ["A"], "explanation_full": "15 D項錯誤。 根據該法第46條，被保險人因第三者的行為而發生死亡、傷殘或者疾病等保險事故的，保險人向被保險人或者受益人給付保險金後，不享有向第三者追償的權利，但被保險人或者受益人仍有權向第三者請求賠償，因此A項正確，BC項錯誤。"}, {"id": "卷二-38", "subject": "卷二", "type": "單選題", "question": "隆高有限公司對其註冊的商標“隆高”享有商標專用權，該專用權應在2017年6月1日屆滿，則對該商標專用權續展的敘述中正確的是？（　）", "options": [{"key": "A", "text": "隆高有限公司在2017年11月1日仍可提出續展申請"}, {"key": "B", "text": "隆高有限公司在上述日期提出申請的，下一屆有效期自11月1日起開始計算"}, {"key": "C", "text": "隆高有限公司只要在法定期間提出續展，行政主管機關就應批准"}, {"key": "D", "text": "隆高有限公司因未在該法定期間提出續展申請，則該商標專用權被註銷後1年內，隆高有限公司不得再就該商標提出註冊申請"}], "answer": ["A"], "explanation_full": "【羿文解析】根據《商標法》第40條規定，註冊商標有效期滿，需要繼續使用的，商標註冊人應當在期滿前 12個月內按照規定辦理續展手續；在此期間未能辦理的，可以給予6個月的寬展期。每次續展註冊的有效期為 10年，自該商標上一屆有效期滿次日起計算。期滿未辦理續展手續的，註銷其註冊商標。依《商標法》第 50條規定，註冊商標被撤銷、被宣告無效或者期滿不再續展的，自撤銷、宣告無效或者註銷之日起1年內，商標局對與該商標相同或近似的商標註冊申請，不予核准。但並非不準申請。可知，A選項正確。 本題答案為A。"}, {"id": "卷二-39", "subject": "卷二", "type": "單選題", "question": "苗某創作了一首歌曲並且已經發表，王某在某商業場合對其進行了演唱，甲公司將苗某的演唱製成唱片 ，乙酒店把該唱片買回後在酒店大廳作為背景音樂播放.某廣播電台播放了該歌曲，下列說法正確的是？（ ）", "options": [{"key": "A", "text": "王某演唱該歌曲需要經過苗某的同意並付費"}, {"key": "B", "text": "甲公司把苗某的演唱製成唱片，不需要經過苗某的同意並付費"}, {"key": "C", "text": "乙酒店在酒店大廳將該歌曲作為背景音樂播放，不需要經過苗某的同意並付費"}, {"key": "D", "text": "廣播電台的播放行為需要經過苗某的同意並付費"}], "answer": ["A"], "explanation_full": "【羿文解析】《著作權法》第38條規定，使用他人作品演出，表演者(演員、演出單位)應當取得著作權人許可，並支付報酬。演出組織者組織演出，由該組織者取得著作權人許可，並支付報酬。因此，A選項說法正確 。 該法第42條規定，錄音錄像製作者使用他人作品製作錄音錄像製品，應當取得著作權人許可，並支付報酬。 所以，B選項說法錯誤。 C選項作為背景音樂，屬於商業目的，需要經過苗某的同意並支付報酬，C選項說法錯誤。 該法第46條第二款規定，廣播電台、電視台播放他人已發表的作品，可以不經著作權人許可，但應當按照規定支付報酬。D選項，廣播電台不需經過同意，而只需要付費即可。D選項說法錯誤。"}, {"id": "卷二-40", "subject": "卷二", "type": "單選題", "question": "根據《反壟斷法》的規定，下列哪一說法不能夠作為認定甲企業具有市場支配地位的依據？", "options": [{"key": "A", "text": "甲企業控制銷售市場或者原材料采購市場的能力"}, {"key": "B", "text": "其他經營者對甲在交易上的依賴程度"}, {"key": "C", "text": "甲企業的經營模式為本地同行其他企業所公認和仿傚"}, {"key": "D", "text": "其他經營者進入相關市場的難易程度"}], "answer": ["C"], "explanation_full": "16 經營者進入相關市場的難易程度；（六）與認定該經營者市場支配地位有關的其他因素。可知，本題當選C。"}, {"id": "卷二-41", "subject": "卷二", "type": "單選題", "question": "甲公司與乙醫院簽訂《產科VIP病房陪護合作協議》，約定：“甲公司是為乙醫院提供產科VIP病房的唯一合作夥伴；該病房收費項目交易額的15％作為乙醫院的項目管理費。”此後，乙醫院收取費用10萬元，扣除", "options": [], "answer": null, "explanation_full": null}, {"id": "卷二-1", "subject": "卷二", "type": "單選題", "question": "5萬元後向甲公司轉賬8.5萬元，並將1.5萬元計入賬冊“其他業務收入”科目，未向甲公司開具收取項目管理費的票據。甲公司向乙醫院開具了8.5元的陪護費、服務費發票，並計入“主營業務收入”科目，未將給乙醫院的1.5萬元項目管理費計入賬目。對此，下列哪些說法是正確的？（　）", "options": [{"key": "A", "text": "該協議構成縱向壟斷協議行為"}, {"key": "B", "text": "甲公司向乙醫院支付項目管理費構成商業賄賂行為"}, {"key": "C", "text": "乙醫院將收取的費用明示入賬，屬於正當的佣金行為"}, {"key": "D", "text": "甲公司向乙醫院支付項目管理費，並按餘下金額入賬處理，屬於正當的折扣行為"}], "answer": ["B"], "explanation_full": "【羿文解析】《反壟斷法》第14條規定：“禁止經營者與交易相對人達成下列壟斷協議：(一)固定向第三人轉售商品的價格；(二)限定向第三人轉售商品的最低價格；(三)國務院反壟斷執法機構認定的其他壟斷協議 。”本題中甲公司與乙醫院之間既不是經營者與交易相對人之間的關係，又不具有《反壟斷法》第14條所列行為，明顯不屬於縱向壟斷協議行為。A選項說法錯誤，不當選。 《反不正當競爭法》第7條第1款規定：“經營者不得採用財物或者其他手段賄賂下列單位或者個人，以謀取交易機會或者競爭優勢：(一)交易相對方的工作人員；(二)受交易相對方委託辦理相關事務的單位或者個人 ；(三)利用職權或者影響力影響交易的單位或者個人。”就甲公司與病人之間的收費服務，乙醫院是對交易有影響力的單位。甲公司通過向乙醫院給付項目管理費的方式取得交易機會，且甲未將該筆管理費入賬，而乙未如實入賬。此行為構成商業賄賂行為。B選項說法正確，當選。 《反不正當競爭法》第7條第2款規定：經營者在交易活動中，可以以明示方式向交易相對方支付折扣，或者向中間人支付佣金。經營者向交易相對方支付折扣、向中間人支付佣金的，應當如實入賬。接受折扣、佣金的經營者也應當如實入賬。乙醫院將1.5萬元計入賬冊“其他業務收入”科目，未給甲公司開具收取項目管理費的票據，不滿足如實入賬的要求，不構成正當佣金。C選項說法錯誤，不當選。 甲公司沒有將給乙醫院的1.5萬元項目管理費計入賬目，也不滿足如實入賬的要求，不構成正當的折扣。D選項說法錯誤，不當選。"}, {"id": "卷二-42", "subject": "卷二", "type": "單選題", "question": "甲公司包工包料承攬了乙企業的建設工程。後甲公司采購的丙公司生產的高壓配電設備出現故障，造成乙企業生產線毀損。乙企業以質量問題為由，要求甲公司及時予以解決。甲公司要求丙公司前往解決，但丙公司認為並非自己的產品存在缺陷，必須有相關部門出具權威意見，否則拒絕更換或修理。乙公司只好自己出資進行維修。關於本案的法律責任，以下哪一選項是正確的？（　）", "options": [{"key": "A", "text": "建設工程不是《產品質量法》上的產品，故本案不適用《產品質量法》"}, {"key": "B", "text": "甲公司不能證明產品存在缺陷，故丙公司有權拒絕修理或更換"}, {"key": "C", "text": "乙企業有權要求丙公司賠償損失"}, {"key": "D", "text": "甲公司應當對乙企業的損失承擔賠償責任"}], "answer": ["D"], "explanation_full": "【羿文解析】《產品質量法》第2條規定：“建設工程不適用本法規定；但是，建設工程使用的建築材料、建築構配件和設備，屬於前款規定的產品範圍的，適用本法規定。”因此，配電設備應屬於產品範圍，本案關於配電設備故障的責任糾紛可適用產品質量法。A選項錯誤，不當選。 《產品質量法》第40條規定“售出的產品有下列情形之一的，銷售者應當負責修理、更換、退貨；給購買產品的消費者造成損失的，銷售者應當賠償損失：(一)不具備產品應當具備的使用性能而事先未作說明的 ……”故本案中設備出現故障並導致乙受損，設備供應商丙公司應承擔修理更換的責任。B選項錯誤，不當選 。 本案不屬於缺陷產品引起的產品責任，故乙企業的損失不能要求設備供應商承擔。C選項錯誤，不當選。 甲使用的設備故障導致乙受損，甲應當承擔賠償責任，甲承擔責任後可向丙追償。D選項正確，當選。 17"}, {"id": "卷二-43", "subject": "卷二", "type": "單選題", "question": "某縣環保局現場檢查發現，某公司擅自拆除污染防治設施並通過滲井排放污水，本應依法予以行政處罰 ，但念其初犯，未作出行政處罰決定。經群眾舉報，其上級機關某市環保局核實後認為其違法行為成立，應作出行政處罰決定。對此，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "群眾發現該公司有污染環境行為，應向縣環保局舉報，不得越級舉報"}, {"key": "B", "text": "群眾發現縣環保局不依法履行職責，有權向其上級機關或者監察機關舉報"}, {"key": "C", "text": "根據“一事不再罰”的規定，某市環保局不應再處罰該公司"}, {"key": "D", "text": "某市環保局不能直接作出行政處罰決定，應責成縣環保局進行行政處罰"}], "answer": ["B"], "explanation_full": "【羿文解析】《環境保護法》第57條第1款規定：“公民、法人和其他組織發現任何單位和個人有污染環境和破壞生態行為的，有權向環境保護主管部門或者其他負有環境保護監督管理職責的部門舉報。”對受理舉報的政府機關並無任何級別上的限制。A選項錯誤。 第57條第2款規定：“公民、法人和其他組織發現地方各級人民政府、縣級以上人民政府環境保護主管部門和其他負有環境保護監督管理職責的部門不依法履行職責的，有權向其上級機關或者監察機關舉報。”B選項正確。 “一事不再罰”，是指對違法行為人的同一個違法行為，不得以同一事實和同一依據給予兩次及以上的處罰 ，是為了避免重複處罰違反過罰相當原則。本題所涉及的情形是根本未進行處罰。C選項錯誤。 第67條第2款規定：“依法應當給予行政處罰，而有關環境保護主管部門不給予行政處罰的，上級人民政府環境保護主管部門可以直接作出行政處罰的決定。”D選項錯誤。"}, {"id": "卷二-44", "subject": "卷二", "type": "單選題", "question": "2015年1月，蔣某與甲公司簽訂了為期3年的勞動合同。2017年2月，甲公司提供專項培訓費用外派蔣某出國專業技術培訓1年，出國前雙方簽訂了一份補充協議，約定蔣某回國後須在甲公司服務5年。2018年3月，蔣某回國後並未到甲公司上班。事後，甲公司幾經查詢，得知蔣某受聘於本市乙企業。甲公司經與蔣某、乙企業多次交涉無果後，申請勞動仲裁。關於本案，下列哪些選項是正確的？（　）", "options": [{"key": "A", "text": "因非法限制了蔣某的勞動權，該補充協議無效"}, {"key": "B", "text": "因超過了勞動合同的期限，該補充協議逾期的部分無效"}, {"key": "C", "text": "甲公司有權解除與蔣某的勞動合同"}, {"key": "D", "text": "乙企業不承擔賠償責任"}], "answer": ["C"], "explanation_full": "【羿文解析】《勞動合同法》第22條規定：“用人單位為勞動者提供專項培訓費用，對其進行專業技術培訓的，可以與該勞動者訂立協議，約定服務期。”因此，雖該補充協議確實限制勞動權，但有其合法基礎。A選項錯誤。 《勞動合同法實施條例》第17條規定：勞動合同期滿，但是用人單位與勞動者依照《勞動合同法》第22條的規定約定的服務期尚未到期的，勞動合同應當續延至服務期滿；雙方另有約定的，從其約定。因此，勞動合同應續延至補充協議約定的服務期滿，不存在逾期無效問題。B選項錯誤。 《勞動合同法》第39條規定：“勞動者有下列情形之一的，用人單位可以解除勞動合同……(四)勞動者同時與其他用人單位建立勞動關係，對完成本單位的工作任務造成嚴重影響，或者經用人單位提出，拒不改正的 ……”C選項正確。 《勞動合同法》第91條規定：“用人單位招用與其他用人單位尚未解除或者終止勞動合同的勞動者，給其他用人單位造成損失的，應當承擔連帶賠償責任。”D選項錯誤。"}, {"id": "卷二-45", "subject": "卷二", "type": "單選題", "question": "菲特公司(甲國)與絲絮公司(中國)因某服裝買賣合同產生爭議，雙方約定將爭議提交給甲國某法院解決。 該法院作出了菲特公司勝訴的判決。現菲特公司向中國人民法院申請承認和執行該判決，已知甲國與中國相互之間沒有關於相互承認和執行法院判決和裁定的條約。據此，下列哪一說法是錯誤的？（　）", "options": [{"key": "A", "text": "承認與執行該判決的請求只能由菲特公司向中國法院提出"}, {"key": "B", "text": "若甲國法院曾經承認與執行中國法院作出的民事判決，那麼中國法院可以對符合條件的甲國法院的民事判專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 18 決予以承認與執行"}, {"key": "C", "text": "如該判決違反中國的公共利益，中國法院不予承認和執行"}, {"key": "D", "text": "如果中國法院裁定駁回承認與執行申請的，當事人可以向人民法院起訴"}], "answer": ["A"], "explanation_full": "【羿文解析】外國法院作出的判決、裁定，要在我國得到承認與執行.可以由當事人直接向有管轄權的法院提出，也可以由外國法院按照條約的規定或者互惠原則請求我國法院承認與執行。故A選項說法錯誤。 在承認與執行外國法院判決的過程中，需要兩國存在條約或互惠關係，本題中甲國與中國沒有存在相關的條約，但是甲國曾經承認與執行過中國法院的民事判決，相互之間具有互惠關係，那麼中國法院可以對符合條件的甲國法院的民事判決予以承認與執行。B選項說法正確。 對於向中國法院申請承認與執行的外國判決或裁定，無論是由當事人直接申請還是由外國法院請求，中國法院都必須依照中國與該國締結或參加的國際條約的規定，或者互惠原則進行審查。經審查，如果外國判決、 裁定不違反中國法律的基本原則，或者不危害中國國家主權、安全和社會公共利益，裁定承認其效力，需要執行的，發出執行令。故C選項說法正確。 對於向中國法院申請承認與執行的外國判決或裁定，經審查不符合條件的，裁定駁回申請，當事人可以向人民法院起訴，故D選項說法正確。"}, {"id": "卷二-46", "subject": "卷二", "type": "單選題", "question": "一架英國維多利亞航空公司的客機，在我國附近的公海上發生貨艙門滑落致使行李墜落，落下的行李砸到土耳其一艘漁船，致漁船發生一定程度的損失，船東向我國法院起訴維多利亞航空公司，要求航空公司賠償損失。本案應適用哪國法律解決糾紛？（　）", "options": [{"key": "A", "text": "英國法"}, {"key": "B", "text": "士耳其法"}, {"key": "C", "text": "中國法"}, {"key": "D", "text": "重疊適用中國法和土耳其法"}], "answer": ["C"], "explanation_full": "【羿文解析】根據《民用航空法》第189條的規定，民用航空器對地面第三人的損害賠償，適用侵權行為地法 ；民用航空器在公海上空對水面第三人的損害賠償，適用受理案件的法院所在地法。據此，本題C當選。"}, {"id": "卷二-47", "subject": "卷二", "type": "單選題", "question": "宇宙公司在甲國登記，其主營業地在乙國，依我國相關法律的規定，下列選項正確的是：（　）", "options": [{"key": "A", "text": "宇宙公司的組織機構應當適用乙國法"}, {"key": "B", "text": "宇宙公司的民事行為能力應當適用乙國法"}, {"key": "C", "text": "宇宙公司的民事權利能力可以適用乙國法"}, {"key": "D", "text": "宇宙公司在章程中規定的住所地為其主營業地"}], "answer": ["C"], "explanation_full": "【羿文解析】《涉外民事關係法律適用法》第14條規定：“法人及其分支機構的民事權利能力、民事行為能力、組織機構、股東權利義務等事項。適用登記地法律。法人的主營業地與登記地不一致的，可以適用主營業地法律。法人的經常居所地，為其主營業地。”本題中宇宙公司的登記地為甲國，適用甲國法，主營業地在乙國，也可以適用乙國法。AB中“應當”應為“可以”，因此AB錯誤，C正確。依據該條，D也錯誤。 所以本題C當選。"}, {"id": "卷二-48", "subject": "卷二", "type": "單選題", "question": "中國茶香公司將一批白茶以CIF德國漢堡價格銷售給甲國A公司，貨物由中國B公司的遠洋號貨輪從廈門運往德國漢堡港，提單載明適用《海牙規則》，貨物向C公司投保了平安險。運輸途中由於船舶駕駛人員過失導致船舶觸礁擱淺，100箱貨物受損，船舶尚未脫險又遭遇暴雨，50箱貨物濕毀，在即將抵達漢堡港時由於電路老化引發火災，90箱貨物不幸燒毀。由於無人向海關申報。剩餘80箱貨物被海關提取並依法變賣。下列哪一選項是錯誤的？（　）", "options": [{"key": "A", "text": "雖然船舶駕駛人員有過失，但承運人對於100箱貨物的損失免責"}, {"key": "B", "text": "由於投保了平安險，對觸礁導致的100箱貨物損失應賠償，但50箱濕毀的貨物損失屬於自然災害導致，故不專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 19 予賠償"}, {"key": "C", "text": "被海關收取並拍賣的80箱貨物，承運人免責"}, {"key": "D", "text": "燒毀的90箱貨物損失，B公司和C公司均有義務賠償"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《海牙規則》，承運人對航行過失免責，即船長、船員、引水員或承運人的雇傭人在駕駛或管理船舶中的行為、疏忽或不履行職責造成的貨物損失承運人可以免責，因此，對於駕駛過失觸礁導致的貨損，承運人免責，故A選項正確。 平安險的承保範圍是：①自然災害造成全部損失；②運輸工具意外事故造成貨物的全部或部分損失；③在運輸工具已經發生擱淺、觸礁、沉沒、焚毀等意外事故的情況下，貨物在此前後又在海上遭受惡劣氣候、雷電 、海嘯等自然災害所造成的部分損失；④在裝卸或轉運時由於一件或數件整件貨物落海造成的全部或部分損失；⑤共同海損的犧牲、分攤和救助費用。船舶觸礁擱淺屬於意外事故，根據平安險C公司應賠償100箱貨物損失，船舶遭遇觸礁意外事故，尚未脫險又遭遇暴雨，該50箱貨物損失屬於意外事故前後又遭遇自然災害造成的單獨海損，也屬於平安險的承保範圍，保險公司應賠償，故B選項錯誤。 由於無人向海關申報，剩餘80箱貨物被海關提取並依法變賣，屬於承運人不承擔責任的情況，故C選項正確。 由於電路老化引發火災導致90箱貨物的損毀，根據《海牙規則》的規定，屬於承運人存在實際過失，不能免責，B公司應賠償；火災屬於意外事故，是平安險的承保範圍，C公司也應賠償，故D選項正確。"}, {"id": "卷二-49", "subject": "卷二", "type": "單選題", "question": "中國飛速公司向甲國(發展中國家)投資某產業，中國和甲國都是《解決國家和他國國民間投資爭端公約》 的締約國。後雙方發生投資爭端，飛速公司向解決國際投資爭端中心(ICSID)提起仲裁，依相關規定，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "中心受理與投資有關的任何爭端"}, {"key": "B", "text": "中心受理案件需要飛速公司和甲國政府的書面同意"}, {"key": "C", "text": "各成員國不得對中心裁決進行形式審查和實質審查，但可審查是否違反公共秩序"}, {"key": "D", "text": "裁決作出後，甲國政府發現仲裁員受賄，甲國可以撤銷該裁決"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《解決國家與他國國民之間投資爭議公約》第25條規定，可知，中心的管轄適用於締約國 (或締約國向中心指定的該國的任何組成部分或機構)和另一締約國國民之間直接因投資而產生並經雙方書面同意提交給中心的任何法律爭端.即爭端必須是直接因投資而產生的法律爭端，所以A選項錯誤；明確規定需 “經雙方書面同意”.故B選項正確。 根據《解決國家與他國國民之間投資爭議公約》第54條規定，每一締約國應承認依照本公約作出的裁決具有約束力，並在其領土內履行該裁決所加的財政義務，正如該裁決是該國法院的最後判決一樣。表明公約要求締約國不得對裁決進行實質審查和形式審查.也不得以公共秩序保留為由拒絕承認與執行，故C選項錯誤。 根據《解決國家與他國國民之間投資爭議公約》第52條規定，仲裁員受賄是撤銷裁決的理由之一，但撤銷的主體只能是中心，甲國政府無權撤銷。故D選項錯誤。"}, {"id": "卷二-50", "subject": "卷二", "type": "單選題", "question": "中國甲公司委託成都國際鐵路運輸港運送一批貨物途經多個“一帶一路”沿線國家最終到達波蘭並交付給波蘭乙公司。根據《國際鐵路貨物運輸協定》，下列說法正確的是：", "options": [{"key": "A", "text": "該運輸合同從始發站簽發運單時起成立"}, {"key": "B", "text": "該運輸合同的責任期間從始發站承運貨物時起成立"}, {"key": "C", "text": "波蘭乙公司有權任意變更到站或收貨人"}, {"key": "D", "text": "成都國際鐵路運輸港對運輸途中的損失承擔連帶責任"}], "answer": ["D"], "explanation_full": "【羿文解析】選項A錯誤。根據《國際鐵路貨物運輸協定》，從始發站承運貨物時起，運輸合同即成立。也就是說始發站只要答應承運，合同就成立了。運單的簽發發生在合同成立之後。 選項B錯誤。根據《國際鐵路貨物運輸協定》，承運人的責任期間為從簽發運單時起至終點交付貨物時止。 20 內變更到站和收貨人。本題中波蘭公司是收貨人，所以不能“任意”變更。 選項D正確。根據《國際鐵路貨物運輸協定》，按運單承運貨物的鐵路部門應對貨物負連帶責任。 多項選擇題"}, {"id": "卷二-51", "subject": "卷二", "type": "多選題", "question": "甲對乙享有債權。乙將房屋A向甲提供抵押，丙向甲提供保證，丁以房屋B向甲提供抵押。當事人沒有約定各自承擔擔保責任的份額與順序。以下說法正確的是：（　）", "options": [{"key": "A", "text": "如果乙債務到期不履行，甲可任意對乙丙丁主張擔保權"}, {"key": "B", "text": "如果乙債務到期不履行，甲應對乙的房屋A實行抵押權"}, {"key": "C", "text": "如果甲將債權轉讓給他人，未徵得乙丙丁的同意，乙丙丁的擔保責任消滅"}, {"key": "D", "text": "如果經甲同意，乙將債務轉讓給他人，未徵得丙丁的同意，丙丁的擔保責任消滅"}], "answer": ["B", "D"], "explanation_full": "【羿文解析】根據《民法典》第392條的規定，在混合擔保中，擔保人與債權人沒有約定的情況下，債權人應先就債務人的物保實現債權，A不選，B選。 根據《民法典擔保制度解釋》第39條的規定，主債權讓與，除法律另有規定或者當事人另有約定外，擔保人應繼續承擔擔保責任，C不選。 主債務轉移，第三人擔保的，未經擔保人同意，擔保責任消滅（轉移部分的債務）；債務人擔保的，擔保責任繼續，D選。"}, {"id": "卷二-52", "subject": "卷二", "type": "多選題", "question": "甲有繼承人乙丙。甲訂立遺囑，將部分財產處置給乙，部分財產處置給丙。以下說法正確的是：（　）", "options": [{"key": "A", "text": "如果乙放棄繼承，由乙遺囑繼承的部分適用法定繼承"}, {"key": "B", "text": "如果丙為爭奪遺產而殺害乙，由丙遺囑繼承的部分適用法定繼承"}, {"key": "C", "text": "如果乙對甲有遺棄行為，由乙遺囑繼承的部分適用法定繼承"}, {"key": "D", "text": "如果丙先於甲死亡，由丙遺囑繼承的部分適用法定繼承"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】根據《民法典》第1154條第1項的規定，遺囑繼承人放棄繼承的，相應的遺產適用法定繼承 ，A選。 根據《民法典繼承編解釋（一）》第8條的規定，繼承人有民法典第一千一百二十五條第一款第一項或者第二項所列之行為，而被繼承人以遺囑將遺產指定由該繼承人繼承的，可以確認遺囑無效，並確認該繼承人喪失繼承權。《民法典》第1125條：“繼承人有下列行為之一的，喪失繼承權：（一）故意殺害被繼承人；（二 ）為爭奪遺產而殺害其他繼承人；（三）遺棄被繼承人，或者虐待被繼承人情節嚴重；（四）偽造、篡改、 隱匿或者銷毀遺囑，情節嚴重；（五）以欺詐、脅迫手段迫使或者妨礙被繼承人設立、變更或者撤回遺囑 ，情節嚴重。繼承人有前款第三項至第五項行為，確有悔改表現，被繼承人表示寬恕或者事後在遺囑中將其列為繼承人的，該繼承人不喪失繼承權。受遺贈人有本條第一款規定行為的，喪失受遺贈權。”B選。 根據《民法典》第1125條規定，“遺棄被繼承人，或者虐待被繼承人情節嚴重”、“偽造、篡改或者銷毀遺囑，情節嚴重”而喪失繼承權的繼承人，被繼承人以遺囑將遺產指定由該繼承人繼承的，其遺囑有效，因而不適用法定繼承，C不選。 根據《民法典》第1154條第3項的規定，遺囑繼承人先於被繼承人死亡的，相應的遺產適用法定繼承，D選。"}, {"id": "卷二-53", "subject": "卷二", "type": "多選題", "question": "甲與乙訂立買賣合同，約定甲將一批貨物出賣給乙，乙支付價金60萬元。同時乙以房屋A向甲抵押，擔保甲的價金債權。現乙到期未能付款，甲乙達成協議，將抵押房屋作價60萬元由甲受償。經查，此時房屋A的市場價格為100萬元，且乙還欠丙50萬元債務到期未能償還。以下說法正確的是：（　）", "options": [{"key": "A", "text": "在房屋A的價值上，甲能夠優先於丙受償"}, {"key": "B", "text": "甲、乙達成的協商實行抵押權的協議，與丙沒有利害關係"}, {"key": "C", "text": "甲、乙達成的協商實行抵押權的協議，損害了丙的利益，丙可以訴請撤銷"}, {"key": "D", "text": "甲、乙達成的協商實行抵押權的協議，未損害丙的利益，丙不得訴請撤銷 21"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】抵押權的優先受償效力，是指在抵押物的價值上抵押權人優先於抵押人的其他債權人受償的效力。據此，A選。 由於抵押人的其他債權人對抵押物享有在抵押權受償之後的受償期待。所以協商實行抵押權的協議所確定的抵押物價值的大小對抵押人的其他債權人有利害關係。據此，B不選。 本題中甲乙協商將價值100萬元的房屋A作價60萬元用於甲的受償。其損害了乙的債權人丙的利益。根據《民法典》第410條第1款的規定，債務人不履行到期債務或者發生當事人約定的實現抵押權的情形，抵押權人可以與抵押人協議以抵押財產折價或者以拍賣、變賣該抵押財產所得的價款優先受償。協議損害其他債權人利益的，其他債權人可以請求人民法院撤銷該協議。據此，C選，D不選。"}, {"id": "卷二-54", "subject": "卷二", "type": "多選題", "question": "下列訴訟請求中，不能得到法院支持的有？（　）", "options": [{"key": "A", "text": "數驢友經常相互發起、組織探險活動，費用自理。一次在攀登某個熟悉的山路過程中，驢友甲不幸墜崖。 甲的近親屬放棄對其他驢友的索賠，但向此次活動的發起人驢友乙索賠"}, {"key": "B", "text": "素昧平生的乙與甲偶遇於某高鐵列車上.相談甚歡，乙的目的地先到，甲答應在其到站時叫醒，但二人均睡過頭，致乙誤站，乙請求甲賠償由此多支出的旅費"}, {"key": "C", "text": "乙搭乘同事的便車趕航班.由於途中在加油站加油排長隊.致使乙誤機.請求同事賠償機票款數百元損失"}, {"key": "D", "text": "乙曾宴請好友甲飲高級洋酒，花費數千元，後二人交惡，乙請求甲支付一半的酒資"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】A項。驢友探險系自擔風險行為，甲不幸墜崖死亡系意外事件。發起人(安保義務人)沒有過錯 ，無需承擔賠償責任。故A項正確，當選。 B項。火車過站叫醒屬於好意施惠關係。乙自行承擔誤站的損失。故B項正確，當選。 C項。搭便車屬於好意施惠關係。乙誤機的損失自行承擔。故C項正確，當選。 D項。請客吃飯屬於好意施惠關係。乙事後不得請求甲支付一半的酒資。故D項正確，當選。 綜上所述，本題的正確答案為ABCD。"}, {"id": "卷二-55", "subject": "卷二", "type": "多選題", "question": "A公司以一套價值100萬元的設備作為抵押，向甲借款10萬元，未辦理抵押登記手續。A公司又向乙借款 80萬元，以該套設備作為抵押，並辦理了抵押登記手續。A公司欠丙貨款20萬元，將該套設備出質給丙。丙不小心損壞了該套設備送丁修理，因欠丁5萬元修理費，該套設備被丁留置。關於甲、乙、丙、丁對該套設備享有的擔保物權的清償順序.下列哪些排列是錯誤的？（　）", "options": [{"key": "A", "text": "甲、乙、丙、丁"}, {"key": "B", "text": "乙、丙、丁、甲"}, {"key": "C", "text": "丙、丁、甲、乙"}, {"key": "D", "text": "丁、乙、丙、甲"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】依《民法典》第402條規定，以本法第395條第1款第1項至第3項規定的財產或者第五項規定的正在建造的建築物抵押的，應當辦理抵押登記。抵押權自登記時設立。(本題中的設備抵押即屬該條規定的登記對抗的抵押權)。 另依據《民法典》第456條規定，同一動產上已設立抵押權或者質權，該動產又被留置的，留置權人優先受償 。因此，本題中留置權人丁優先受償，其次是經過抵押登記的抵押權人乙，再次是質權人丙，最後是未經抵押登記的抵押權人甲。故D選項正確，不當選。ABC選項錯誤，當選。綜上所述，本題的正確答案為ABC。"}, {"id": "卷二-56", "subject": "卷二", "type": "多選題", "question": "江山從銀行貸款10萬元買了一輛轎車，並以該車設定了抵押。在借款期間。該車被雷擊毀。江山儘管生活艱難，仍想方設法還清了銀行貸款。對此，周圍多有議論。根據社會主義法治理念和民法有關規定，下列錯誤的是？（　）", "options": [{"key": "A", "text": "甲認為，轎車被雷擊毀屬於不可抗力，江山無須履行還款義務。堅持還貸是多此一舉"}, {"key": "B", "text": "乙認為，江山已不具備還貸能力，無須履行還款義務，堅持還貸是為難自己"}, {"key": "C", "text": "丙認為，江山對轎車的毀損沒有過錯，且此情況不止一家，銀行應將貸款作壞賬處理。堅持還貸是一廂情專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 22 願"}, {"key": "D", "text": "丁認為，江山與銀行的貸款合同並未因轎車被擊毀而消滅。堅持還貸是嚴守合約、誠實信用"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】根據《民法典》第394條第1款的規定，為擔保債務的履行，債務人或第三人不轉移財產的占有 ，將該財產抵押給債權人的，債務人不履行到期債務或發生當事人約定的實現抵押權的情形，債權人有權就該財產優先受償。據此可知，在債務的抵押關係中，被擔保的債權是主權利，抵押權是從權利。抵押物消滅的，抵押物上所設立的抵押權當然消滅；但是，抵押物因不可抗力滅失並不影響主債務、主債權的存續及其效力。所以，銀行雖然不能就該抵押轎車行使抵押權，但借款之債的債權仍然存續，江山依然需要履行還款義務。故A選項錯誤。 債務人是否具有歸還貸款的能力並不影響主債務的效力，即使沒有還貸能力。在法律上其還款義務依然存在 。故B選項錯誤，當選。 儘管江山對於轎車的毀損沒有過錯，此情況也不止一家，但銀行不存在應當將該債務作壞賬處理的必然性。 因為江山作為債務人，其可以用於還貸的財產並不限於抵押物本身，如還有其他財產，當然就可以以此還債 。故C選項錯誤，當選。 抵押物雖因不可抗力而滅失，但主債務依然有效，江山堅持還貸在法律上就是嚴守合同、誠實信用的表現。 故D選項正確，不當選。 綜上所述，本題的正確答案為ABC。"}, {"id": "卷二-57", "subject": "卷二", "type": "多選題", "question": "甲因左腿受傷住院，醫生乙手術時誤將右腿截肢。甲向法院起訴，要求醫院賠償治療費用和精神損害撫慰金。法院審理期間，甲術後感染醫治無效死亡。關於此案，下列哪些說法是正確的？（　）", "options": [{"key": "A", "text": "醫院侵犯了甲的健康權和生命權"}, {"key": "B", "text": "甲繼承人有權繼承其醫療費賠償請求權"}, {"key": "C", "text": "甲子女的生活費應計入死亡賠償金"}, {"key": "D", "text": "甲死後其配偶、父母和子女有權另行起訴，請求醫院賠償自己的精神損害"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】A選項，醫生乙因過錯誤將甲的右腿截肢，侵害了甲的健康權和身體權(保持身體完整的權利 )；術後感染導致甲死亡，侵害了甲的生命權。故A選項正確。 B選項，根據《民法典》第1179條規定：“侵害他人造成人身損害的，應當賠償醫療費、護理費、交通費等為治療和康復支出的合理費用，以及因誤工減少的收入。造成殘疾的.還應當賠償殘疾生活輔助具費和殘疾賠償金。造成死亡的，還應當賠償喪葬費和死亡賠償金。”可知，甲對醫療機構享有賠償醫療費的損害賠償請求權，同時該賠償請求權屬於財產權，不具有人身專屬性，甲死亡後，其繼承人有權繼承。故B選項正確。 C選項，《人身損害賠償解釋》第16條：“被扶養人生活費計入殘疾賠償金或者死亡賠償金。故C選項正確。 D選項，根據根據《人身損害賠償解釋》第1條：“因生命、身體、健康遭受侵害，賠償權利人起訴請求賠償義務人賠償物質損害和精神損害的，人民法院應予受理。本條所稱\"賠償權利人\"，是指因侵權行為或者其他致害原因直接遭受人身損害的受害人以及死亡受害人的近親屬。”因此，侵害自然人導致其死亡或嚴重殘疾的，不僅侵害了其生命權或健康權，還同時構成了對其近親屬的身份權的侵害。其近親屬亦可以自己的身份權遭受損害並造成嚴重後果為由對加害人主張精神損害賠償。故D選項正確。"}, {"id": "卷二-58", "subject": "卷二", "type": "多選題", "question": "甲家裡養了一條鬥牛犬性情暴躁。經常給甲“惹事”，故甲想把該鬥牛犬送出去。甲的好友乙退休在家 ，想養條狗來陪伴自己。2015年4月1日，甲欲將該鬥牛犬送給乙，並向乙承諾：此狗性情溫和，你放心養就可以了。乙欣然接受。2015年4月14日，甲將該鬥牛犬牽到乙家。當天該鬥牛犬就展露了自己的本性，把乙家的高檔沙發、衣櫃等咬壞。關於本案，下列哪些說法是正確的？", "options": [{"key": "A", "text": "甲與乙達成贈與鬥牛犬的合意時，該贈與合同即成立"}, {"key": "B", "text": "甲將鬥牛犬交給乙時，該贈與合同才成立"}, {"key": "C", "text": "因該贈與合同是無償的，故對於鬥牛犬給乙造成的損失應由乙自己承擔"}, {"key": "D", "text": "對於鬥牛犬給乙造成的損失，乙有權要求甲承擔損害賠償責任專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 23"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】《民法典》第657條規定：“贈與合同是贈與人將自己的財產無償給予受贈人，受贈人表示接受贈與的合同。”據此可知，贈與合同是諾成合同；所謂諾成合同，是指雙方當事人意思表示達成一致該合同即成立的合同。本案中，甲與乙達成贈與鬥牛犬的合意時，該贈與合同即成立。因此，A項正確，當選；B項不正確，不當選。 《民法典》第662條規定：“贈與的財產有瑕疵的，贈與人不承擔責任。附義務的贈與，贈與的財產有瑕疵的 ，贈與人在附義務的限度內承擔與出賣人相同的責任。贈與人故意不告知瑕疵或者保證無瑕疵，造成受贈人損失的，應當承擔損害賠償責任。”據此可知，贈與人原則上對於贈與物的瑕疵不承擔責任，但在兩種情形下，贈與人承擔瑕疵擔保責任：第一，贈與附義務的，贈與人在附義務的限度內承擔與出賣人相同的責任 ；第二，贈與人故意不告知贈與物有瑕疵或保證贈與物無瑕疵的，應當承擔損害賠償責任。本案中，甲明知自己的鬥牛犬性情暴躁，卻仍然向乙承諾該狗性情溫和，故對於該狗給乙造成的損失，乙有權要求甲承擔損害賠償責任。因此，C項不正確，不當選；D項正確，當選。 綜上所述，本題選AD。"}, {"id": "卷二-59", "subject": "卷二", "type": "多選題", "question": "2020年2月7日，A公司與丁某簽訂汽車買賣合同。次日，丁某前來付款提車，此時A公司提出：因該型號的汽車僅剩一輛，故需借用該車在展廳展覽一周，本公司可以贈送一套坐墊以抵償一周的使用費。丁某表示同意。2月10日，趙某看中該車，A公司的一位新業務員將該車以市價賣給不知情的趙某。趙某付款提車後，隨即贈與自己的女友小苗。後小苗開車上路時因剎車失靈而撞向護欄，身受重傷。關於本案，下列哪些表述是錯誤的？", "options": [{"key": "A", "text": "丁某尚未取得該車的所有權"}, {"key": "B", "text": "A公司與趙某簽訂的買賣合同效力待定"}, {"key": "C", "text": "小苗已經取得該車的所有權"}, {"key": "D", "text": "小苗無權要求A公司承擔侵權責任"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】《民法典》第228條規定：“動產物權轉讓時，雙方又約定由出讓人繼續占有該動產的，物權自該約定生效時發生效力。”本案中，A公司和丁某既達成了買賣該車的合意，又達成了由A公司繼續占有使用該車的約定，故當A公司和丁某關於由A公司繼續使用該車的約定生效時，丁某即取得該車的所有權。因此 ，A項錯誤，當選。 買賣合同的效力不會受到無權處分的影響。本案中，因丁某已經取得該車的所有權，故A公司的處分即為無權處分，但是這不會影響買賣合同的效力。因此，B項錯誤，當選。 《民法典》第224條規定：“動產物權的設立和轉讓，自交付時發生效力，但法律另有規定的除外。”據此可知，動產所有權的轉移采交付生效主義。本案中，趙某已經通過善意取得的方式取得該車的所有權，其有權將該車贈與小苗，小苗也能夠通過繼受取得的方式取得該車的所有權。因此，C項正確，不當選。 《民法典》第1203條規定：“因產品存在缺陷造成損害的，被侵權人可以向產品的生產者請求賠償，也可以向產品的銷售者請求賠償。”本案中，剎車失靈屬於產品缺陷，小苗有權要求A公司承擔侵權責任。因此 ，D項錯誤，當選。 綜上所述，本題選ABD。"}, {"id": "卷二-60", "subject": "卷二", "type": "多選題", "question": "甲駕駛車在某收費的高速公路行駛，不慎將一包貨物失落在高速公路上。兩個小時後，乙開車發現前方障礙，遂緊急轉向，撞向路樁車輛毀損，並且與前方的丙車追尾。下列關於本案說法不正確的是？（　）", "options": [{"key": "A", "text": "乙對丙的損失應當承擔無過錯責任"}, {"key": "B", "text": "乙、丙可以要求甲承擔賠償責任"}, {"key": "C", "text": "乙、丙可以要求高速公路管理公司承擔賠償責任"}, {"key": "D", "text": "高速公路管理公司承擔賠償責任後可以向甲追償"}], "answer": ["A", "D"], "explanation_full": "24 原因引起的，緊急避險人不承擔責任，可以給予適當補償。緊急避險採取措施不當或者超過必要的限度，造成不應有的損害的，緊急避險人應當承擔適當的責任。乙為緊急避險，因此不承擔責任，故A選項錯誤。 《民法典》第1256條的規定：在公共道路上堆放、傾倒、遺撒妨礙通行的物品造成他人損害的，由行為人承擔侵權責任，公共道路管理人不能證明已經盡到清理、防護、示警義務的，應當承擔相應責任。因此行為人甲應承擔侵權責任，貨物傾撒在道路上已有兩個小時，高速公路管理公司並未盡到清理義務，應承擔相應的責任，且該責任是其自己的過錯所致，不能向甲追償。故BC正確，D項錯誤。"}, {"id": "卷二-61", "subject": "卷二", "type": "多選題", "question": "甲將建設工程承包給乙，乙經過甲的同意，將主體結構的施工分包給丙。後整個建設工程驗收合格.甲向乙支付了部分工程款，乙未向丙支付工程款。下列哪些表述是錯誤的？", "options": [{"key": "A", "text": "乙、丙之間分包合同有效"}, {"key": "B", "text": "甲可以撤銷與乙之間的建設工程施工合同"}, {"key": "C", "text": "丙可以乙為被告訴請支付工程款"}, {"key": "D", "text": "丙可以甲為被告訴請支付工程款，但法院應當追加乙為第三人"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】乙將承包的主體工程分包，根據《民法典》第791條的規定，分包合同無效，A選項錯誤。 根據《民法典》第806條的規定，承包人轉包、違法分包的，發包人有權“解除”其與承包人之間的建設工程施工合同，而非“撤銷”，因此B選項錯誤。 根據《建設工程施工合同解釋》第43條第l款的規定，實際施工人以轉包人、違法分包人為被告起訴的，人民法院應當依法受理。故C選項正確。 根據《建設工程施工合同解釋》第43條第2款的規定，實際施工人以發包人為被告主張權利的，人民法院應當追加轉包人或者違法分包人為本案第三人。D選項正確。"}, {"id": "卷二-62", "subject": "卷二", "type": "多選題", "question": "根據民事訴訟法有關管轄的規定，下列哪些民事訴訟由原告住所地人民法院管轄？", "options": [{"key": "A", "text": "天津市市民張某對旅居美國的李某提起離婚之訴"}, {"key": "B", "text": "北京市市民汪某對被宣告失蹤人王某提起離婚之訴"}, {"key": "C", "text": "吉林市市民孫某對被採取強制性教育措施的陳某提起侵權之訴"}, {"key": "D", "text": "長春市市民武某對被監禁的楊某提起的侵權之訴"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】根據《民事訴訟法》第23條的規定，對不在中華人民共和國領域內居住的入提起的有關身份關係的訴訟；對下落不明或者宣告失蹤的人提起的有關身份關係的訴訟；對被採取強制性教育措施的人提起的訴訟；對被監禁的人提起的訴訟，都由原告住所地人民法院管轄。據此，ABCD四項均由原告住所地法院管轄 。"}, {"id": "卷二-63", "subject": "卷二", "type": "多選題", "question": "甲和乙在某市合夥經營一名為“豪好恰”的飯店，未領有營業執照。後在經營過程中，由於甲在購買食品材料上的疏忽，致使丙顧客食物中毒，顧客丙決定向法院起訴要求賠償損失。此案中當事人的訴訟地位應如何確定？", "options": [{"key": "A", "text": "顧客是原告，豪好恰飯店是被告"}, {"key": "B", "text": "顧客是原告，甲是被告，乙與本案無關"}, {"key": "C", "text": "顧客是原告。甲與乙是共同被告"}, {"key": "D", "text": "該訴訟屬於必要共同訴訟"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】甲購買食品材料的行為應當看作該個人合夥的經營行為，不應由甲單獨負責。B選項錯誤。 根據《民訴解釋》第60條的相關規定，未依法登記領取營業執照的個人合夥的全體合夥人為共同訴訟人。個人合夥有依法核准登記的字號的，應在法律文書中註明登記的字號。 故A選項錯誤，CD選項正確。 25"}, {"id": "卷二-64", "subject": "卷二", "type": "多選題", "question": "嬰兒由於食用了某品牌奶粉後出現了不適癥狀，嬰兒父母準備提起民事訴訟，因受害的嬰兒人數較多。並且分散在全國各地，關於本案，下列哪些說法是正確的？", "options": [{"key": "A", "text": "本案可以由任何一個受害嬰兒父母提出公益訴訟"}, {"key": "B", "text": "民事公益訴訟的原告只能是與案件有直接利害關係的當事人"}, {"key": "C", "text": "本案可以由法律規定的機關和有關組織向人民法院提起公益訴訟"}, {"key": "D", "text": "因為原告人數一時無法確定，可以由向人民法院登記權利的原告推選訴訟代表人"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】《民事訴訟法》第58條規定：“對污染環境、侵害眾多消費者合法權益等損害社會公共利益的行為，法律規定的機關和有關組織可以向人民法院提起訴訟。”公益訴訟的起訴主體具有法定性，法律規定的機關和有關組織可以提起公益訴訟，個人不能成為公益訴訟的原告。因此C選項正確。A選項錯誤。 同時公益訴訟的起訴主體具有廣泛性，公益訴訟的原告不要求一定與糾紛有法律上的直接利害關係，因此B選項錯誤。 《民訴解釋》第77條規定：“根據民事訴訟法第五十七條規定，當事人一方人數眾多在起訴時不確定的，由當事人推選代表人。當事人推選不出的，可以由人民法院提出人選與當事人協商；協商不成的，也可以由人民法院在起訴的當事人中指定代表人。”因此D選項是正確的。"}, {"id": "卷二-65", "subject": "卷二", "type": "多選題", "question": "李某將房屋租賃給同鄉劉某，因彼此信任，雙方並未簽合同。後因租金支付發生糾紛，李某起訴劉某。庭審時，劉某承認租賃李某房屋，但主張房租已經支付，並向法院提交了微信轉賬記錄和手機通話錄音。微信轉賬記錄並未標注用途，通話錄音顯示劉某向李某言明要通過微信轉賬支付房租。關於本案，下列哪些說法是正確的？（　）", "options": [{"key": "A", "text": "就雙方存在租賃合同關係的事實李某無須舉證"}, {"key": "B", "text": "劉某應就房租已支付的事實承擔證明責任"}, {"key": "C", "text": "微信轉賬記錄是房租已支付事實的直接證據"}, {"key": "D", "text": "手機通話錄音是房租已支付事實的本證"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】《民事訴訟法解釋》第92條規定，一方當事人在法庭審理中，或者在起訴狀、答辯狀、代理詞等書面材料中，對於己不利的事實明確表示承認的，另一方當事人無須舉證證明。據此，本案本應由李某承擔雙方之間存在租賃合同關係的證明責任，劉某承認租賃李某房屋，這是劉某承認於其不利的事實，其行為構成自認，產生對方當事人就該事實免證的法律效力。A選項說法正確。 根據《民事訴訟法解釋》第91條第一款規定，主張法律關係存在的當事人，應當對產生該法律關係的基本事實承擔舉證證明責任。據此，就該事實應由劉某承擔證明責任。B選項說法正確。 直接證據是指能夠單獨地、直接地證明待證事實的證據。選項表述微信轉賬記錄的待證事實是房租已支付的事實，因微信轉賬記錄並未標注用途，該證據只能證明劉某向李某轉款，但並不能直接證明是房租，要和其他證據結合方可認定。因此，微信轉賬記錄就房租已支付事實而言，屬於間接證據。C選項說法錯誤。 本證是負擔證明責任一方提供的用於證明其主張的事實為真實的證據；反證是不負證明責任的一方提出的用於證明對方主張的事實不真實的證據。對於房租已支付事實，應由被告劉某負擔證明責任。通話錄音顯示劉某向李某言明要通過微信轉賬支付房租，這有利於證明其主張已通過微信轉賬支付房租的事實，因此該證據屬於本證。D選項說法正確。"}, {"id": "卷二-66", "subject": "卷二", "type": "多選題", "question": "張三起訴李四，要求解除婚姻關係，法院一審判決駁回張三訴訟請求，不准予離婚。張三不服，提起上訴 ，二審法院經審理認為，應當判決離婚，並對財產分割和子女撫養問題一併作出判決，該二審法院的做法違反了民事訴訟哪些原則或者制度（　）", "options": [{"key": "A", "text": "處分原則"}, {"key": "B", "text": "辯論原則"}, {"key": "C", "text": "不告不理原則"}, {"key": "D", "text": "兩審終審制度專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 26"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】根據《民訴解釋》的規定，一審判決不準離婚.二審法院認為應當判決離婚的，就財產分割和子女撫養問題，二審法院可以調解，調解不成，撤銷原判，發回重審。此時如果當事人同意由二審法院一併審理的，二審法院可以一併審理。首先，二審法院不能直接判決，只能調解，調解不成發回重審。原因在於一審法院判決不準離婚而對財產分割和子女撫養問題未做處理，如果二審法院直接改判，所作判決即為終審判決，那麼對於財產分割和子女撫養問題即一審終審，剝奪了當事人對財產分割和子女撫養問題的上訴權，違反了兩審終審制度，所以D選項正確。 其次，原告的訴訟請求是解除婚姻關係，法院不僅判決解除婚姻關係，還對財產、子女問題作出判決，該判決超出了原告的訴訟請求，違反處分原則，A選項正確。 最後，是否解除婚姻關係與財產分割以及子女撫養問題所依據的事實是不一樣的(解除婚姻關係依據的是有關夫妻感情的事實，而財產分割和子女撫養所依據的是財產狀況和子女的成長、生活狀況等事實)。既然當事人僅要求解除婚姻關係，顯然就僅僅主張了有關夫妻感情的事實。而未主張有關財產和子女的事實，而法院對子女撫養和財產分割問題進行判決，顯然以當事人未主張的財產和子女有關事實作為了裁判依據，裁判超出了當事人主張的事實，違反約束性辯論原則，所以B選項正確。 不告不理並不是民事訴訟的基本原則，只是處分原則的一種通俗說法而已，所以C選項不應入選。"}, {"id": "卷二-67", "subject": "卷二", "type": "多選題", "question": "甲縣居民劉某與乙縣大江房地產公司在丙縣售房處簽訂了房屋買賣合同，購買大江公司在丁縣所建住房 1套。雙方約定發生合同糾紛後，交由A市仲裁委員會仲裁裁決。後因合同履行問題發生爭議，劉某欲向法院起訴。下列關於管轄權的哪些說法是正確的？", "options": [{"key": "A", "text": "劉某可以向丁縣人民法院起訴，因為本案屬於專屬管轄，由不動產所在地法院管轄"}, {"key": "B", "text": "劉某可以向乙縣或者丁縣法院起訴，因為乙縣是被告住所地，丁縣是合同履行地，符合合同中地域管轄的規定"}, {"key": "C", "text": "劉某應當通過仲裁解決與大江房地產公司的糾紛"}, {"key": "D", "text": "劉某應當向A市仲裁委員會提出仲裁申請"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】合同糾紛由合同履行地、被告住所地人民法院管轄；本題中雖然涉及房屋買賣，但只是因合同履行而引起的糾紛，不屬於不動產糾紛。故A項錯誤。 在仲裁協議有效的前提下，仲裁優先。故B項錯誤。 專屬管轄的規定並不排除仲裁管轄權，如果當事人雙方之間存在有效的仲裁協議，則案件通過仲裁程序解決 。"}, {"id": "卷二-68", "subject": "卷二", "type": "多選題", "question": "甲和乙因為某汽車所有權發生爭議。訴至法院，法院判決汽車歸甲所有，乙拒不履行法院判決，甲申請對汽車強制執行。在執行中，案外人丙主張對該汽車的權利，向作出生效裁判的法院提起第三人撤銷之訴，在第三人撤銷之訴中丙希望本案能中止執行，下列說法正確的是（　）", "options": [{"key": "A", "text": "丙可以向執行法院提供擔保，法院裁定中止對原判決的執行"}, {"key": "B", "text": "丙可以向執行法院提出案外人對執行標的的異議。法院審查認為異議成立的應當裁定中止執行，法院審查異議不成立的。裁定駁回"}, {"key": "C", "text": "第三人撤銷之訴中，丙提出案外人對執行標的的異議，法院裁定駁回後，可以申請對原生效裁判的再審"}, {"key": "D", "text": "第三人撤銷之訴中，丙提出案外人對執行標的的異議，法院裁定駁回後，不能申請對原生效裁判的再審"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】判決生效後，執行中，案外人主張權利，其選擇有二： 一是基於判決已經生效，有證據證明生效裁判侵犯自身合法權益.可以向作出生效裁判的法院提起第三人撤銷之訴的方式撤銷原判； 二是直接向執行法院提出案外人對執行標的的異議，法院審查後，認為異議成立的，裁定中止執行，認為異議不成立的裁定駁回，此時屬於原判決確有錯誤的情形.應當通過審判監督程序撤銷原判。 27 判的執行，途徑有二：一是向執行法院提供擔保，法院裁定中止執行；二是以案外人身份向執行法院主張對執行標的的權利，即提出案外人對執行標的的異議，法院審查.異議成立，裁定中止執行，異議不成立，裁定駁回。故本題AB選項正確。 案外人丙提出第三人撤銷之訴後，可以通過提供擔保或者案外人對執行標的的異議兩種方式實現中止執行的目的。如果丙提出案外人對執行標的的異議，法院審查認為異議成立的，裁定中止執行，異議不成立的裁定駁回。此時，案外人對裁定不服不能通過對原生效裁判文書申請再審的方式實現撤銷或者改變原判的目的 ，應當繼續通過第三人撤銷之訴的方式實現撤銷或者改變原生效法律文書。故本題D選項正確，C選項錯誤。"}, {"id": "卷二-69", "subject": "卷二", "type": "多選題", "question": "豪多麻辣燙是一家普通合夥企業，合夥人甲、乙、丙共同約定，由甲執行日常事務，簽訂合同單筆金額不超過20萬元，且甲可自行決定從其投資設立的蔬菜經銷公司進貨，以及自行決定以企業名義為他人擔保，合夥企業如有虧損由甲一人承擔。對此，下列哪些選項是錯誤的？（　）", "options": [{"key": "A", "text": "乙對外以合夥企業的名義簽訂15萬元的合同可能無效"}, {"key": "B", "text": "甲可自行決定從蔬菜經銷公司處進貨的約定無效"}, {"key": "C", "text": "甲可自行決定以企業名義為他人擔保的約定無效"}, {"key": "D", "text": "虧損由甲一人承擔的約定無效"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】A選項考查普通合夥企業與第三人的關係。《合夥企業法》第37條規定：“合夥企業對合夥人執行合夥事務以及對外代表合夥企業權利的限制，不得對抗善意第三人。”本案中，合夥人僅約定甲執行合夥事務，未授予乙事務執行權，但這並不意味著乙對外以合夥企業名義簽訂的合同必然無效，當然也非必然有效，而是要取決於第三人的主觀情況以及合同本身的內容。A選項正確，不當選。 B選項考查普通合夥人的自我交易問題。《合夥企業法》第32條規定：“合夥人不得自營或者同他人合作經營與本合夥企業相競爭的業務。除合夥協議另有約定或者經全體合夥人一致同意外，合夥人不得同本合夥企業進行交易。”可見，普通合夥人的自我交易可能因全體合夥人的一致同意而被允許。B選項錯誤，當選。 C選項考查普通合夥企業對外擔保的規則。《合夥企業法》第32條規定：“除合夥協議另有約定外，合夥企業的下列事項應當經全體合夥人一致同意……(五)以合夥企業名義為他人提供擔保。”因此，為他人提供擔保在合夥協議另有約定的情況下，可以不需要經全體合夥人一致同意。C選項錯誤，當選。 D選項考查普通合夥企業的虧損分擔問題。《合夥企業法》第33條規定：“合夥企業的利潤分配、虧損分擔 ，按照合夥協議的約定辦理；合夥協議未約定或者約定不明確的，由合夥人協商決定；協商不成的，由合夥人按照實繳出資比例分配、分擔；無法確定出資比例的，由合夥人平均分配、分擔。合夥協議不得約定將全部利潤分配給部分合夥人或者由部分合夥人承擔全部虧損。”D選項正確，不當選。"}, {"id": "卷二-70", "subject": "卷二", "type": "多選題", "question": "甲為A公司的股東，持股15％。公司於2019年成立，至2020年期間一直未發放過紅利，且對外拖欠大量債務。甲對公司經營狀況一無所知，故以書面形式向公司申請查閱相關資料。對此，下列哪些選項是錯誤的 ？（　）", "options": [{"key": "A", "text": "如果公司章程規定股東不享有查閱權，那麼甲無權申請查閱"}, {"key": "B", "text": "甲如果在起訴時已經轉讓股權，其查閱請求不能得到支持"}, {"key": "C", "text": "公司可通過證明甲為他人經營同類業務，說明其查閱有不正當目的"}, {"key": "D", "text": "甲的請求若獲法院支持，可委託律師單獨前往公司查閱"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】A選項考查公司章程實質性剝奪股權查閱權的問題。《公司法解釋(四)》第9條規定：“公司章程、股東之間的協議等實質性剝奪股東依據公司法第三十三條、第九十七條規定查閱或者複製公司文件材料的權利，公司以此為由拒絕股東查閱或者複製的，人民法院不予支持。”這說明公司章程不能實質性剝奪股東的查閱權。A選項錯誤，當選。 28 ，仍可以通過證明在持股期間合法權益受損而申請查閱持股期間的公司特定文件材料。B選項錯誤，當選。 C選項考查不正當目的的解讀。《公司法解釋(四)》第8條第1項規定，有限責任公司有證據證明股東自營或者為他人經營與公司主營業務有實質性競爭關係業務的，除非公司章程另有規定或者全體股東另有約定，否則人民法院應當認定股東有公司法規定的“不正當目的”。C選項正確，不當選。 D選項考查股東查閱方式。《公司法解釋(四)》第10條第2款規定：“股東依據人民法院生效判決查閱公司文件材料的，在該股東在場的情況下，可以由會計師、律師等依法或者依據執業行為規範負有保密義務的中介機構執業人員輔助進行。”甲可以委託律師協助查閱，但自己應當在場。D選項錯誤，當選。"}, {"id": "卷二-71", "subject": "卷二", "type": "多選題", "question": "A保險公司承保了甲名下家用小轎車。在保險期間，甲讓乙代駕，後發生交通事故，經交警部門認定甲一方負全部責任。下列說法正確的是（　）。", "options": [{"key": "A", "text": "若A保險公司第一時間就該交通事故進行定損並向甲全額賠付保險金，則有權請求乙在賠付保險金的範圍內賠償"}, {"key": "B", "text": "若乙不知A保險公司已全額賠付保險金，又向甲全額賠付保險金，則佳合公司可以請求甲返還乙賠付的保險金"}, {"key": "C", "text": "若A保險公司通知乙已全額賠付保險金的消息後，乙又向甲全額賠付保險金，則由於乙已經向甲全額賠償 ，A保險公司不得向乙請求賠償"}, {"key": "D", "text": "若在A保險公司賠付之前，甲與乙達成和解協議，約定乙僅賠付80％的損失即可，則甲有權就剩餘損失請求"}, {"key": "A", "text": "保險公司賠償"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】《保險法》第60條規定：“因第三者對保險標的的損害而造成保險事故的，保險人自向被保險人賠償保險金之日起，在賠償金額範圍內代位行使被保險人對第三者請求賠償的權利。”交通事故由甲一方負全責，乙作為第三人為甲代駕，造成了車輛損害，故A保險公司在向甲賠償保險金之日起，在賠付金額範圍內代位行使甲對乙請求賠償的權利。A選項說法正確，當選。 《保險法解釋(四)》第10條第1款規定：“因第三者對保險標的的損害而造成保險事故，保險人獲得代位請求賠償的權利的情況未通知第三者或者通知到達第三者前，第三者在被保險人已經從保險人處獲賠的範圍內又向被保險人作出賠償，保險人主張代位行使被保險人對第三者請求賠償的權利的，人民法院不予支持。保險人就相應保險金主張被保險人返還的，人民法院應予支持。”B選項說法正確，當選。 《保險法解釋(四)》第10條第2款規定：“保險人獲得代位請求賠償的權利的情況已經通知到第三者，第三者又向被保險人作出賠償，保險人主張代位行使請求賠償的權利，第三者以其已經向被保險人賠償為由抗辯的 ，人民法院不予支持。”C選項說法錯誤，不當選。 《保險法》第61條第1款規定：“保險事故發生後，保險人未賠償保險金之前，被保險人放棄對第三者請求賠償的權利的，保險人不承擔賠償保險金的責任。”D選項說法錯誤，不當選。"}, {"id": "卷二-72", "subject": "卷二", "type": "多選題", "question": "甲在銀行門口揀到一張8萬元的銀行本票，其後該本票背書轉讓給鄰居乙，清償其所欠借款，甲對乙隱瞞了揀到本票的事實。以下關於本票權利的取得下列表述錯誤的是？（　）", "options": [{"key": "A", "text": "甲能夠取得票據權利，乙也能取得票據權利"}, {"key": "B", "text": "甲能夠取得票據權利，乙不能取得票據權利"}, {"key": "C", "text": "甲不能取得票據權利，乙能取得票據權利"}, {"key": "D", "text": "甲不能取得票據權利，乙也不能取得票據權利"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】《票據法》第10條規定：票據的簽發、取得和轉讓，應當遵循誠實信用的原則，具有真實的交易關係和債權債務關係。票據的取得，必須給付對價，即應當給付票據雙方當事人認可的相對應的代價。 《票據法》第12條規定：以欺詐、偷盜或者脅迫等手段取得票據的，或者明知有前列情形，出於惡意取得票據的，不得享有票據權利。持票人因重大過失取得不符合本法規定的票據的，也不得享有票據權利。 根據上述法條可知。甲屬於惡意取得票據，而乙為善意，可以取得票據權利，故C選項正確，A、B、D選項錯誤。 29 本題答案為ABD。"}, {"id": "卷二-73", "subject": "卷二", "type": "多選題", "question": "劉某、華某兩人共同出資組成一普通合夥企業，企業成立半年後，周某想加入，劉某、華某兩人便口頭表示同意，並與周某約定由周某負責銷售業務，並且如果企業效益較好，可給周某一定利潤提成。此後，周某便積極地以合夥企業的名義到處活動進行交易。但企業仍然效益一般，並負有對外債務若干。後來，該合夥企業因違法經營問題嚴重.被工商部門依法吊銷營業執照，該合夥企業解散。合夥企業的債權人在得知這一消息後，紛紛要求劉某、華某、周某三人償還所欠債務。依《合夥企業法》的規定，下列表述正確的有？（ ）", "options": [{"key": "A", "text": "周某不應對合夥企業的債務以個人財產承擔連帶責任"}, {"key": "B", "text": "周某應對合夥企業的債務以個人財產承擔連帶責任"}, {"key": "C", "text": "周某在合夥企業存續期間的行為有效"}, {"key": "D", "text": "周某在合夥企業存續期間的行為無效"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】根據《合夥企業法》第43條第1款規定，新合夥人入夥，除合夥協議另有約定外，應當經全體合夥人一致同意，並依法訂立書面入夥協議。A選項中，新合夥人入夥時，應當經全體合夥人同意，並依法訂立書面入夥協議。本例中，周某在入夥時，劉某、華某僅口頭同意，並未簽訂書面協議，因而周某的入夥不具備法定要件，並且周某也未能與其他合夥人共享收益、共擔風險，因而對周某的入夥應認定為無效。故A選項正確，B選項錯誤。 根據《合夥企業法》第35條規定：“被聘任的合夥企業的經營管理人員應當在合夥企業授權範圍內履行職務 。被聘任的合夥企業的經營管理人員，超越合夥企業授權範圍履行職務，或者在履行職務過程中因故意或者重大過失給合夥企業造成損失的，依法承擔賠償責任。”周某雖非合夥人，但其以合夥企業的名義進行對外活動是經過劉某、華某同意的，其行為可視為一種委託代理行為，因而周某所為的行為應認定有效。故C選項正確，D選項錯誤。 故本題正確答案為AC。"}, {"id": "卷二-74", "subject": "卷二", "type": "多選題", "question": "A公司由於決策失誤陷入經營困境，諸多合同無法履行，對外欠下大量債務，公司資產無法全部清償，遂向法院提出破產清算申請。對此，下列哪些選項是正確的？（　）", "options": [{"key": "A", "text": "法院裁定受理破產申請後，A公司應自行指定管理人"}, {"key": "B", "text": "法院受理破產申請前1年內，A公司對未到期的債務提前清償的，管理人有權請求法院予以撤銷"}, {"key": "C", "text": "法院受理破產申請前6個月內，A公司對個別債務人進行清償的，管理人原則上有權請求法院予以撤銷"}, {"key": "D", "text": "本案的訴訟費用可由A公司財產隨時清償"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】A選項考查的是破產清算案件中管理人的任命。《企業破產法》第13條規定：“人民法院裁定受理破產申請的，應當同時指定管理人。”此項規定應與《公司法》中對於清算組組成的規定相區分，《公司法》第183條規定：“公司因本法第一百八十條第(一)項、第(二)項、第(四)項、第(五)項規定而解散的，應當在解散事由出現之日起十五日內成立清算組，開始清算。有限責任公司的清算組由股東組成，股份有限公司的清算組由董事或者股東大會確定的人員組成。逾期不成立清算組進行清算的，債權人可以申請人民法院指定有關人員組成清算組進行清算。人民法院應當受理該申請，並及時組織清算組進行清算。”公司解散的 ，除分立合併導致清算的情況，應自行組成清算組進行清算；逾期不成立的，債權人可以申請人民法院指定成立清算組。A選項錯誤，不當選。 B選項考查的是破產中的可撤銷行為。《企業破產法》第31條規定：“人民法院受理破產申請前一年內，涉及債務人財產的下列行為，管理人有權請求人民法院予以撤銷：(一)無償轉讓財產的；(二)以明顯不合理的價格進行交易的；(三)對沒有財產擔保的債務提供財產擔保的；(四)對未到期的債務提前清償的；(五)放棄債權的。”B選項正確，當選。 30 是，個別清償使債務人財產受益的除外。”個別清償一般情況下可撤銷，其例外情況為個別清償使債務人財產受益。C選項正確，當選。 D選項考查的是破產費用的界定與承擔。《企業破產法》第41條對破產費用作出了界定：“人民法院受理破產申請後發生的下列費用，為破產費用：(一)破產案件的訴訟費用；(二)管理、變價和分配債務人財產的費用 ；(三)管理人執行職務的費用、報酬和聘用工作人員的費用。”因此，首先應對訴訟費用定性——破產費用 。同時，《企業破產法》第43條第1款規定：“破產費用和共益債務由債務人財產隨時清償。”D選項正確 ，當選。"}, {"id": "卷二-75", "subject": "卷二", "type": "多選題", "question": "汪某與苗某簽訂一份傢具買賣合同，向苗某簽發了一張金額為20萬元的匯票用以支付貨款，委託匯豐銀行付款。苗某拿到匯票後，將其背書轉讓給馬某，同時由牛某承擔保證責任。牛某在匯票上記載承擔保證責任的要求是苗某替他購買一幅古畫，但忘了寫保證日期。對此，下列選項正確的是？（　）", "options": [{"key": "A", "text": "汪某簽發匯票的日期即為保證日期"}, {"key": "B", "text": "牛某要求替他購買一幅古畫的記載不影響其承擔保證責任"}, {"key": "C", "text": "馬某為匯票的基本當事人"}, {"key": "D", "text": "牛某為匯票的基本當事人"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】A選項考查匯票的保證日期。《票據法》第47條第2款規定：“保證人在匯票或者粘單上未記載前條第(四)項的，出票日期為保證日期。”本案中，牛某忘了寫保證日期即為未記載保證日期，出票人汪某簽發匯票的日期即為保證日期。所以，A選項正確，當選。 B選項考查附條件的保證問題。《票據法》第48條規定：“保證不得附有條件；附有條件的，不影響對匯票的保證責任。”可見，保證人即使對承擔保證責任附加了條件，也不影響對匯票的保證責任。所以，B選項正確 ，當選。 C選項和D選項考查票據的基本當事人。票據基本當事人是指在票據作成和交付時就已存在的當事人，是構成票據法律關係的必要主體，包括出票人、付款人和收款人。本案中，馬某為被背書人，牛某為保證人，均非匯票的基本當事人，而是非基本當事人。所以，C選項和D選項均表述錯誤，不當選。"}, {"id": "卷二-76", "subject": "卷二", "type": "多選題", "question": "陳某創作劇本《最美打工人》，發表在《影視週刊》刊物上，徐某獲得該劇本的攝製權後擔任製片人製作完成同名電影，上映後廣受好評。後張某結合電影將劇本改寫成同名小說，由黃河出版社出版。下列哪些說法是錯誤的？（　）", "options": [{"key": "A", "text": "張某將劇本改寫成小說只需經過陳某同意"}, {"key": "B", "text": "張某將劇本改寫成小說應同時取得陳某、徐某同意"}, {"key": "C", "text": "若張某出版小說未獲得授權，還侵犯了陳某、徐某的發表權"}, {"key": "D", "text": "若張某改寫並出版小說未獲得授權，黃河出版社未盡合理注意義務，應當承擔賠償責任"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】A、B選項可以結合起來理解。《著作權法》第10條第(十四)項規定，改編權，即改變作品，創作出具有獨創性的新作品的權利。從劇本到小說，屬於文字作品的不同體裁，根據劇本創作小說屬於改編行為。本題中，劇本被拍攝成了電影，徐某系電影作品的製片人。根據《著作權法》第17條的規定：視聽作品中的電影作品、電視劇作品的著作權由製作者享有，但編劇、導演、攝影、作詞、作曲等作者享有署名權 ，並有權按照與製作者簽訂的合同獲得報酬。從法條看，似乎電影作品著作權人享有電影相關的一切權利 ，其他人只是署名權。但再結合《著作權法》第17條第2款，視聽作品中的劇本、音樂等可以單獨使用的作品的作者有權單獨行使其著作權。可知，電影作品權利人對劇本等的權利，實際上是指體現和融合入連續畫面中的部分，在沒有相關授權的情形下，並無權單獨行使。另外，本題還可結合題乾中給出的條件理解，徐某只是獲得了該劇本的攝製權，並不享有劇本的改編權，因此，陳某可獨立進行改編權許可授權。A選項說法正確，不當選；B選項說法錯誤，當選。 31 中，陳某創作的劇本曾發表過，不再存在發表權被侵害的情形。C選項說法錯誤，當選。 D選項涉及出版者責任，根據《最高人民法院關於審理著作權民事糾紛案件適用法律若干問題的解釋》第20條 “出版物侵害他人著作權的，出版者應當根據其過錯、侵權程度及損害後果等程度賠償損失的責任。出版者對其出版行為的授權、稿件來源和署名、所編輯出版物的內容等未盡到合理注意義務的，依據著作權法第五十四條的規定，承擔賠償損失的責任。D選項說法正確，不當選。"}, {"id": "卷二-77", "subject": "卷二", "type": "多選題", "question": "甲公司發明了一種生產“膨脹劑”的方法並獲得專利權，該“膨脹劑”可用於高效合成建築用灌漿材料。 該發明創造未在境外A國獲得專利，乙公司未經甲公司許可在A國使用該專利方法生產“膨脹劑”並銷售。後丙公司未經許可在國內使用該方法生產膨脹劑，並合成灌漿材料在國內市場上銷售；丁公司則從A國乙公司進口該膨脹劑，用於合成灌漿材料在國內市場上銷售。對此，甲公司的下列哪些行為是正確的？（　）", "options": [{"key": "A", "text": "有權要求乙公司停止使用專利方法"}, {"key": "B", "text": "有權要求丙公司停止使用膨脹劑製造灌漿材料"}, {"key": "C", "text": "無權要求丁公司停止使用該膨脹劑製造灌漿材料"}, {"key": "D", "text": "有權要求丁公司停止使用該膨脹劑製造灌漿材料"}], "answer": ["B", "D"], "explanation_full": "【羿文解析】專利依申請而取得，具有地域性。本題中，因該發明創造在A國並無專利，A國乙公司在該國使用該發明創造方法的行為，並不屬於侵權行為，甲公司無權要求停止。A選項錯誤。 《專利法》第11條規定，發明和實用新型專利權被授予後，除本法另有規定的以外，任何單位或者個人未經專利權人許可，都不得實施其專利，即不得為生產經營目的製造、使用、許諾銷售、銷售、進口其專利產品 ，或者使用其專利方法以及使用、許諾銷售、銷售、進口依照該專利方法直接獲得的產品。膨脹劑系丙公司使用方法專利直接獲得，甲公司有權要求丙公司停止製造、使用、許諾銷售、銷售、進口該膨脹劑。因此 ，甲公司有權要求丙公司停止使用膨脹劑製造灌漿材料。B選項正確。 《專利法》第75條第（一）項規定，專利產品或者依照專利方法直接獲得的產品，由專利權人或者經其許可的單位、個人售出後，使用、許諾銷售、銷售、進口該產品的；，不視為侵犯專利權。因此，儘管我國認可平行進口，但前提是必須由專利權人或者經其許可的單位、個人售出。本題中，儘管乙公司不構成侵權，但因乙公司使用方法專利的行為並未獲得過甲公司許可，丁公司進口該產品，以及使用該產品，均屬於侵權行為，甲公司有權禁止。故C錯誤，D選項正確。"}, {"id": "卷二-78", "subject": "卷二", "type": "多選題", "question": "下列哪些行為不屬於《反壟斷法》禁止的壟斷行為？（　）", "options": [{"key": "A", "text": "甲海鮮城因為冷藏設備問題造成部分海鮮不能繼續儲藏，以低於成本的價格進行銷售活動"}, {"key": "B", "text": "乙醫療設備廠對其獲得專利的醫療技術產品實施獨占壟斷行為"}, {"key": "C", "text": "丙村農民在玉米銷售過程中實施聯合固定價格行為"}, {"key": "D", "text": "為保障同歐盟經濟合作中我國經營者的正當利益，10家企業統一了鋼材出口價格"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】《反壟斷法》第17條規定：“禁止具有市場支配地位的經營者從事下列濫用市場支配地位的行為……(二)沒有正當理由，以低於成本的價格銷售商品……”甲海鮮城不是具有市場支配地位的經營者，而且其虧本銷售的原因是為了避免鮮活產品腐爛，以減少損失，屬於正常經營的需要，具有正當理由，故A選項為本題正確選項。 《反壟斷法》第55條規定：“經營者依照有關知識產權的法律、行政法規規定行使知識產權的行為，不適用本法；但是，經營者濫用知識產權，排除、限制競爭的行為，適用本法。”乙廠獨占壟斷行為正是專利權的體現，且未濫用，故B選項為本題正確選項。 《反壟斷法》第56條規定：“農業生產者及農村經濟組織在農產品生產、加工、銷售、運輸、儲存等經營活動中實施的聯合或者協同行為，不適用本法。”故C選項為本題正確選項。 《反壟斷法》第15條規定：“經營者能夠證明所達成的協議屬於下列情形之一的，不適用本法第13條、第 14條的規定……(六)為保障對外貿易和對外經濟合作中的正當利益的……”故D選項為本題正確選項。 32"}, {"id": "卷二-79", "subject": "卷二", "type": "多選題", "question": "甲花重金在無錫市某小區購置豪宅一套，精心裝修後於2017年5月份人住新居。沒有想到的是樓下的超市過於吵鬧。影響到甲及家人休息，甲遂通過各種小區論壇、業主論壇、微信圈、微博等大肆散播該超市出售偽劣商品的消息，導致該超市營業額嚴重下降。下列有關甲行為定性的說法中錯誤的是？（　）", "options": [{"key": "A", "text": "甲的行為屬於不正當競爭行為"}, {"key": "B", "text": "甲的行為屬於詆毀商譽行為"}, {"key": "C", "text": "甲的行為屬於合法的自助行為"}, {"key": "D", "text": "甲的行為屬於侵權行為"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】根據《反不正當競爭法》第11條：“經營者不得編造、傳播虛假信息或者誤導性信息，損害競爭對手的商業信譽、商品聲譽。”所以從事詆毀商譽的主體要求與被詆毀對象存在同業競爭關係，本案中甲並不具備經營者身份。所以甲的行為定性不屬於詆毀商譽，也不屬於不正當競爭行為，A、B項錯誤，當選。 本案中甲散布虛假的信息，損害超市的社會評價度，構成對其商譽的侵害，不能認定為合法自助，C項錯誤 ，當選。D項正確不當選。"}, {"id": "卷二-80", "subject": "卷二", "type": "多選題", "question": "苗某的哥哥是甲城市銀行的信貸業務人員，2017年3月，苗某出資設立乙有限責任公司(以下簡稱乙公司 )，開業之初，乙公司為參加某項目的投標做準備急需啟動資金，遂向甲城市銀行提出貸款需求，甲城市銀行的下列做法錯誤的是？（　）", "options": [{"key": "A", "text": "正常審查乙公司的貸款需求。酌情批覆擔保貸款或信用貸款"}, {"key": "B", "text": "不審查乙公司的貸款需求.直接拒貸"}, {"key": "C", "text": "不審查乙公司的貸款需求.直接拒貸"}, {"key": "D", "text": "不得對乙公司提供信用貸款"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】《商業銀行法》第40條：“商業銀行不得向關係人發放信用貸款；向關係人發放擔保貸款的條件不得優於其他借款人同類貸款的條件。前款所稱關係人是指：(一)商業銀行的董事、監事、管理人員、信貸業務人員及其近親屬；(二)前項所列人員投資或者擔任高級管理職務的公司、企業和其他經濟組織。”所以根據案情，乙公司屬於甲城市銀行的關係人，甲城市銀行不應該直接拒貸，也不應該審核發放信用貸款 ，而是只可以發放一般條件下的擔保貸款，D項正確，不當選。A、B、C項錯誤，當選。"}, {"id": "卷二-81", "subject": "卷二", "type": "多選題", "question": "依據《消費者權益保護法》，下列哪些說法是正確的？（　）", "options": [{"key": "A", "text": "經營者提供的機動車，消費者自接受之日起六個月內發現瑕疵，由經營者承擔有關瑕疵的舉證責任"}, {"key": "B", "text": "經營者採用網絡銷售商品，消費者原則上有權自收到商品之日起七日內退貨"}, {"key": "C", "text": "經營者採用網絡方式銷售的商品，應當自收到退回商品之日起十日內返還消費者支付的商品價款"}, {"key": "D", "text": "經營者採用網絡方式銷售的商品，退回商品的運費由消費者承擔；經營者和消費者另有約定的，按照約定"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】《消費者權益保護法》23條規定：“......經營者提供的機動車、計算機、電視機、電冰箱、 空調器、洗衣機等耐用商品或者裝飾裝修等服務，消費者自接受商品或者服務之日起六個月內發現瑕疵，發生爭議的，由經營者承擔有關瑕疵的舉證責任。”A正確，當選。 《消費者權益保護法》25條規定：“經營者採用網絡、電視、電話、郵購等方式銷售商品，消費者有權自收到商品之日起七日內退貨，且無需說明理由，但下列商品除外：（一）消費者定作的；（二）鮮活易腐的 ；（三）在線下載或者消費者拆封的音像製品、計算機軟件等數字化商品；（四）交付的報紙、期刊。除前款所列商品外，其他根據商品性質並經消費者在購買時確認不宜退貨的商品，不適用無理由退貨。消費者退貨的商品應當完好。經營者應當自收到退回商品之日起七日內返還消費者支付的商品價款。退回商品的運費由消費者承擔；經營者和消費者另有約定的，按照約定。”B、D正確，當選。C錯誤，不當選。"}, {"id": "卷二-82", "subject": "卷二", "type": "多選題", "question": "某化工企業排出的污水重金屬超標，對周圍耕地造成嚴重污染，縣生態環境主管部門擬對其進行行政處罰 。關於該化工企業的相關責任，下列說法正確的是？（　） 33", "options": [{"key": "A", "text": "如果該企業受到罰款處罰，被責令改正，拒不改正的，依法作出處罰決定的行政機關可以自責令改正之日起，按照原處罰數額按日連續處罰"}, {"key": "B", "text": "如果該企業超過污染物排放標準，可以責令其限制生產、停產整治"}, {"key": "C", "text": "如果該企業未依法提交建設項目環境影響評價文件或者環境影響評價文件未經批准，擅自開工建設的，由負有環境保護監督管理職責的部門責令停止建設，處以罰款，並可以責令恢復原狀"}, {"key": "D", "text": "縣生態環境主管部門如果存在篡改、偽造或者指使篡改、偽造監測數據的行為，其主要負責人應當引咎辭職"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】A選項，根據《環境保護法》第59條的規定，企業事業單位和其他生產經營者違法排放污染物 ，受到罰款處罰，被責令改正，拒不改正的，依法作出處罰決定的行政機關可以自責令改正之日的次日起 ，按照原處罰數額按日連續處罰。因此A選項錯誤。 B選項，根據《環境保護法》第60條的規定，縣級以上人民政府環境保護主管部門可以責令其採取限制生產、 停產整治等措施，因此B選項正確。 C選項，根據《環境保護法》第61條的規定，建設單位未依法提交建設項目環境影響評價文件或者環境影響評價文件未經批准，擅自開工建設的，由負有環境保護監督管理職責的部門責令停止建設，處以罰款，並可以責令恢復原狀。因此C選項正確。 D選項，根據《環境保護法》第68條的規定，只有在造成嚴重後果的情況下，負責人應引咎辭職，此處未強調造成嚴重後果，因此，D選項錯誤。 綜上所述，本題答案為BC。"}, {"id": "卷二-83", "subject": "卷二", "type": "多選題", "question": "根據我國法律和司法解釋，關於涉外民事關係適用的外國法律，下列哪些選項是正確的？（　）", "options": [{"key": "A", "text": "如案件涉及食品安全問題，該問題應適用中國法"}, {"key": "B", "text": "法院在確定應當直接適用的中國法律時，無需再通過衝突規範的指引"}, {"key": "C", "text": "當事人協議選擇未對我國生效的條約，我國法院應該不予以認可"}, {"key": "D", "text": "當事人協議選擇的法律必須與爭議具有實際聯繫"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】直接適用的法，指在國際民商事交往中，為了維護國家和社會的重大利益，無須藉助衝突規範的指引而直接適用於國際民商事關係的法律規範。《法律適用法》第4條規定，中華人民共和國法律對涉外民事關係有強制性規定的，直接適用該強制性規定。《涉外民事關係法律適用法解釋(一)》第8條規定，有下列情形之一，涉及中華人民共和國社會公共利益、當事人不能通過約定排除適用、無須通過衝突規範指引而直接適用於涉外民事關係的法律、行政法規的規定，人民法院應當認定為法律適用法第四條規定的強制性規定 ：(一)涉及勞動者權益保護的；(二)涉及食品或公共衛生安全的；(三)涉及環境安全的；(四)涉及外匯管制等金融安全的；(五)涉及反壟斷、反傾銷的；(六)應當認定為強制性規定的其他情形。故A、B選項正確。 當事人意思自治強調尊重當事人的自由意志。《涉外民事關係法律適用法解釋(一)》第7條規定，當事人在合同中援引尚未對中華人民共和國生效的國際條約的，人民法院可以根據該國際條約的內容確定當事人之間的權利義務，但違反中華人民共和國社會公共利益或中華人民共和國法律、行政法規強制性規定的除外。故C選項錯誤。 《涉外民事關係法律適用法解釋(一)》第5條規定，一方當事人以雙方協議選擇的法律與係爭的涉外民事關係沒有實際聯繫為由主張選擇無效的，人民法院不予支持。故D選項錯誤。"}, {"id": "卷二-84", "subject": "卷二", "type": "多選題", "question": "甲國A公司與中國B公司簽訂液晶電視的買
