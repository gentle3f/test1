要堅持改革決策和立法決策相統一、相銜接，立法主動適應改革需要 ，這就表現為立法的前瞻性.也就是為未來的改革預留空間。故B選項正確。 重大改革應於法有據，但這並不意味著現行法上無依據時就束手無策，對實踐條件還不成熟、需要先行先試的改革措施，完全可以按照法定程序作出授權，在若干地區開展改革試點，這同樣是於法有據。故C選項正確 。但是，如果不經授權就隨意“突破法律紅線”，就顯然屬於上述第一種錯誤觀點，即搞違法的“改革”。 故D選項錯誤。"}, {"id": "卷一-88", "subject": "卷一", "type": "多選題", "question": "王某明知某超市銷售假冒紅酒，故意購買該紅酒後向法院起訴超市。審理中，關於王某是否屬於《消費者權益保護法》第2條所稱的“消費者”產生了爭論。法官認為，僅從字面理解該條文，會掩蓋“消費者”概念的完整含義，不符合《消費者權益保護法》打擊制假售假的立法宗旨。法官還通過分析《消費者權益保護法 》第62條的潛在含義進行印證，“消費者”的認定標準不在於購買者的主觀目的，而在於商品的客觀上具有生活資料的屬性。最終，法官認定王某屬於消費者，判決王某勝訴。關於本案，下列說法正確的有？", "options": [{"key": "A", "text": "法官對“消費者”的具體含義的解釋屬於外部證成"}, {"key": "B", "text": "《消費者權益保護法》對“消費者”的界定存在隱藏漏洞"}, {"key": "C", "text": "法官運用了體系解釋方法"}, {"key": "D", "text": "法院進行了主觀目的解釋"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】外部證成是對法律決定所依賴的前提的補強和論證，法官對“消費者”的具體含義的證成屬於面向作為大前提之法律規範的解釋，因此屬於外部證成，A選項正確。 隱藏漏洞是指關於某個法律問題，法律雖已有規定，但依其規範目的或立法計劃，應對該規定設定例外卻未設定例外。簡言之，法律的隱藏漏洞在於“應排除而未排除”，因此，填補某個法律概念所涉及的隱藏漏洞 ，便需要將這個概念本身所包含的某些情形，作為例外排除出該概念所處的法律規範的調整範圍。題乾所反映是，法官認為，“消費者”概念的字面含義過於狹窄，遂運用法律解釋方法，擴大了這一概念的外延，使其將王某的情形也包含進來。可見，這一過程恰恰與填補隱藏漏洞的情形相反，因此，“消費者”概念存在隱藏漏洞的說法不能成立，故B選項錯誤。 體系解釋，是指將被解釋的條文放在整部法律乃至整個法律體系中，聯繫法條間關係進行解釋。法官通過揭示《消費者權益保護法》第62條的潛在含義解釋該法第2條中“消費者”的概念，符合體系解釋的特徵。主觀目的解釋是指，根據立法者的目的解釋法律文本的含義，本案中法官根據《消費者權益保護法》的立法宗旨進行解釋屬於主觀理目的解釋。因此，C、D選項正確。"}, {"id": "卷一-89", "subject": "卷一", "type": "多選題", "question": "關於法與社會的關係，下列說法正確的有？（　）", "options": [{"key": "A", "text": "制定法律的國家以社會為基礎，而國家權力以社會力量為基礎"}, {"key": "B", "text": "法對社會具有積極的反作用，要麼促進社會的發展，要麼阻礙社會的發展"}, {"key": "C", "text": "法和社會關係密切，二者相互依存，互為前提和基礎"}, {"key": "D", "text": "法的相對獨立性不只是針對經濟基礎而言的，也表現在與上層建築諸多因素的關係中"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】對於法和社會的關係，主要應當把握住：第一，社會決定法律，法律反映社會，法律以社會為基礎，制定法律的國家以社會為基礎；第二，法律對社會具有能動的反作用，表現在可以促進或者阻礙社會的發展，注意，法律絕不能創造或者改變社會的發展；第三，儘管社會決定法律，但是法律對社會具有相對獨立性，具有自身的特殊規律。故AB選項正確。 社會決定法律，法律只是社會的組成部分。因此，社會是法律的前提和基礎，而法律不能成為社會的前提和基礎。故C選項錯誤。 37 法對經濟、政治等均具有相對獨立性。故D選項正確。"}, {"id": "卷一-90", "subject": "卷一", "type": "多選題", "question": "縣檢察院認為法官莫某未經請示分管副院長，自行決定採用獨任審判，未向分管院長要求報告案件進展情況直接作出判決，導致當事人遭受重大經濟損失，其行為涉嫌玩忽職守，向法院提起公訴。關於對莫某行為的判斷，下列選項正確的有？", "options": [{"key": "A", "text": "莫某不宜釆用法官獨任審判方式"}, {"key": "B", "text": "莫某不應作出與分管副院長意見相左的判決"}, {"key": "C", "text": "莫某對於重大敏感案件應當主動向分管院長匯報"}, {"key": "D", "text": "莫某的行為不構成不正確履行職責"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】《人民法院組織法》《民事訴訟法》以及相關解釋規定，合議庭或獨任法官有權根據案件事實依照法律作出判決，對重大疑難案件可提請院長提交審判委員會討論決定。《最高人民法院司法責任制實施意見（試行）》第64條規定，院長及其他院領導、庭長可以要求合議庭報告以下案件的進展情況和評議結果 ，並要求逐級審批：（1）涉及群體性糾紛，可能影響社會穩定的案件；（2）疑難、複雜且有重大社會影響的案件；（3）與本院類案判決可能發生衝突的案件；（4）反映法官有違法審判行為的案件；（5）死刑復核案件，刑事大要案請示案件，涉外、涉僑、涉港澳台刑事請示案件，法定刑以下判處刑罰核准案件。院長及其他院領導、庭長可以決定或建議將上述案件提交專業法官會議、賠償委員會、審判委員會討論。 在實際工作中，合議庭或者獨任法官對於一些重大敏感案件主動向院長、庭長匯報，聽取領導意見或者就案件中發現的問題提出建議的做法是客觀存在的，但這屬於人民法院內部匯報、請示及溝通的一種方式。對於某一案件是否需要報告院長、庭長，由合議庭或獨任法官決定。只有經過法定程序由審判委員會討論決定 ，才能作出不同於合議庭或獨任法官的處理意見，院長、庭長個人不能改變合議庭或者獨任法官的意見。因此，合議庭或者獨任法官審理非重大疑難案件後直接作■判決的行為，屬於正確履行職責的行為。檢察機關以被告人莫某沒有聽取領導意見徑行下判，作為指控被告人莫某不正確履行職責的一個理由缺乏法律依據。 根據以上分析AB選項錯誤，CD選項正確。"}, {"id": "卷一-91", "subject": "卷一", "type": "單選題", "question": "某自治州人民代表大會法制委員會召開全體會議，就《某州旅遊條例（草案）》進行集中審議；之後，該條例按法定程序獲得通過。根據《憲法》和法律的規定，下列選項正確的是？", "options": [{"key": "A", "text": "該法制委員會是該州人大的工作機構"}, {"key": "B", "text": "該法制委員會在該州人大閉會期間，受該州人大常委會領導"}, {"key": "C", "text": "《某州旅遊條例（草案）》應報國務院和全國人大常委會備案"}, {"key": "D", "text": "《某州旅遊條例（草案）》必須由該州人大以全體代表的過半數通過"}], "answer": ["B"], "explanation_full": "【羿文解析】《地方各級人民代表大會和地方各級人民政府組織法》第30條第1款規定：“省、自治區、直轄市、自治州、設區的市的人民代表大會根據需要，可以設法制委員會、財政經濟委員會、教育科學文化衛生委員會等專門委員會……各專門委員會受本級人民代表大會領導；在大會閉會期間，受本級人民代表大會常務委員會領導。”據此可知，題乾中的某州人大法制委員會，在性質上屬於該州人大的專門委員會，而不是工作機構，A項錯誤；B項正確。 備案只發生在該地方性法規獲得正式通過之後，而“草案”是無需報備的。可見C項錯誤。 D項沒有法律依據，錯誤。"}, {"id": "卷一-92", "subject": "卷一", "type": "多選題", "question": "根據《香港特別行政區基本法》和《澳門特別行政區基本法》的規定，下列選項正確的是？（　）", "options": [{"key": "A", "text": "港、澳基本法的修改提案權屬於全國人大常委會、國務院和港、澳特別行政區"}, {"key": "B", "text": "港、澳特區的行政長官必須由年滿40周歲，在特區通常居住連續滿20年並在外國無居留權的特區永久性居民中的中國公民擔任"}, {"key": "C", "text": "特區基本法的解釋權屬於全國人大常委會"}, {"key": "D", "text": "特區公職人員就職宣誓時應當宣誓效忠中華人民共和國專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 38"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】根據《香港特別行政區基本法》第159條的規定，本法的修改權屬於全國人民代表大會，本法的修改提案權屬於全國人民代表大會常務委員會、國務院和香港特別行政區。根據《澳門特別行政區基本法》 第144條的規定，本法的修改權屬於全國人民代表大會。本法的修改提案權屬於全國人民代表大會常務委員會 、國務院和澳門特別行政區。A選項正確。 澳門特別行政區行政長官沒有“國外無居留權”的限制。B選項錯誤。 根據《香港特別行政區基本法》第158條的規定，本法的解釋權屬於全國人民代表大會常務委員會。根據《澳門特別行政區基本法》第143條的規定，本法的解釋權屬於全國人民代表大會常務委員會。C選項正確。 《香港特別行政區基本法》第104條規定，香港特別行政區行政長官、主要官員、行政會議成員、立法會議員 、各級法院法官和其他司法人員在就職時必須依法宣誓擁護中華人民共和國香港特別行政區基本法，效忠中華人民共和國香港特別行政區。《澳門特別行政區基本法》第101條規定，澳門特別行政區行政長官、主要官員、行政會委員、立法會議員、法官和檢察官，必須擁護中華人民共和國澳門特別行政區基本法，盡忠職守 ，廉潔奉公，效忠中華人民共和國澳門特別行政區，並依法宣誓。《澳門特別行政區基本法》第102條規定 ：澳門特別行政區行政長官、主要官、員、立法會主席、終審法院院長、檢察長在就職時，除按本法第一百零一條的規定宣誓外，還必須宣誓效忠中華人民共和國。D選項錯誤。"}, {"id": "卷一-93", "subject": "卷一", "type": "單選題", "question": "甲公司租用乙公司（私營）的船隻和船員用於貨運，並負責支付燃油費，乙公司船員顧某負責加注燃油。 顧某收取了供油商的好處費，應其請求在甲公司付款後將應加滿的燃油只加一半，致使甲公司因燃油不足延誤航行，損失慘重。關於顧某的行為，下列選項正確的是（不考慮數額）？", "options": [{"key": "A", "text": "顧某以不作為的方式竊取了屬於甲公司的燃油，構成盜竊罪"}, {"key": "B", "text": "顧某隱瞞真相，賺取的好處費實系甲公司的損失，構成詐騙罪"}, {"key": "C", "text": "顧某利用職務便利將雇主的財物據為己有，構成職務侵占罪"}, {"key": "D", "text": "顧某的行為不屬於秘密竊取，應以非國家工作人員受賄罪定罪"}], "answer": ["D"], "explanation_full": "【羿文解析】甲公司付款後，燃油仍為燃油供油商占有，故顧某並未從甲公司轉移對燃油的占有，不成立盜竊罪，A項錯誤。 從題乾設置來看，甲公司處分財物（付燃油款）在前，顧某收取“好處費”在後，不符合詐騙罪“行為人虛構事實、隱瞞真相（在先），被害人基於認識錯誤而處分財產（在後）”的公式，故顧某不成立詐騙罪，B項錯誤。 顧某雖然利用了職務之便，但顧某屬於乙公司的工作人員，而非甲公司的工作人員，且顧某未將本單位的財物據為己有，不成立職務侵占罪，C項錯誤。 燃油在被注入甲公司租用的船隻之前處於供油商的占有之下，顧某應供油商的請求少加燃油的行為不屬於對甲公司財物的秘密竊取。顧某收取了供油商提供的財物，利用職務便利為供油商謀取利益，符合非國家工作人員受賄罪的構成要件，D項正確。"}, {"id": "卷一-94", "subject": "卷一", "type": "單選題", "question": "警察甲在偵辦持槍殺人案的過程中，見乙容貌與殺人案犯相似，便攔下要求其出示身份證。急於趕路的乙面帶怒色伸手去摸口袋時，甲以為乙要掏槍，便開槍將其射殺。事實上，乙只是去拿口袋內的證件。關於本案，下列選項正確的是？", "options": [{"key": "A", "text": "甲射殺乙時存在法律認識錯誤，該行為屬於防衛過當"}, {"key": "B", "text": "假想防衛可以排除殺人的故意，甲只成立過失致人死亡罪"}, {"key": "C", "text": "甲雖觸犯故意殺人罪，但可以依正當業務行為排除犯罪性"}, {"key": "D", "text": "甲雖觸犯故意殺人罪，但僅負過失致人死亡罪的刑事責任"}], "answer": ["B"], "explanation_full": "【羿文解析】甲存在假想防衛，而假想防衛屬於行為人對其行為的性質存在認識錯誤，屬於法事實的認識錯誤，不是法律的認識錯誤，選項A錯誤。 39 體而言，在行為人有正確認識相關事實的可能性，卻因疏忽大意而沒有預見的場合成立過失犯，在沒有可能預練見的場合才能定性為意外事件。甲在排除可疑人員時，應當預見到被其排查人員中有合法公民，伸手去摸口袋的舉動可能是為了拿取香煙、手機或者證件等。甲未予謹慎判斷便輕率地將對方射殺，應以過失致人死亡罪定罪，B項正確。 正當業務行為作為超法規的犯罪排除事由，只有在業務本身是正當的且未超出業務範圍時，才能排除犯罪性 ，要求行為人必須遵守相關業務規則。而甲在對可疑人員進行排查的過程中，對對方的行為未予謹慎判斷而開槍，構成對業務規範的違反，不能認為該行為具有正當性，因此C項錯誤。 定罪量刑應以《刑法》的明文規定為依據，在對被告人判處故意殺人罪的場合，只能讓其承擔故意殺人罪的刑事責任而不是其他罪名的刑事責任，故D項錯誤。"}, {"id": "卷一-95", "subject": "卷一", "type": "多選題", "question": "王某與楊某（女）通過相親認識，戀愛1年後，二人於2014年開始同居，在同居期間育有一子王甲。王某與楊某雖然沒有辦理結婚登記，但以夫妻名義自居，周圍鄰居也認為二人是夫妻。此外，同居期間王某多次對楊某施加暴力，對王某的行為，下列選項正確的有？", "options": [{"key": "A", "text": "王某對楊某多次施加暴力的行為，構成虐待罪"}, {"key": "B", "text": "王某傷害王甲（致王甲輕傷）時，楊某不阻止的，楊某構成不作為的故意傷害罪"}, {"key": "C", "text": "王某如與李某（女）領取結婚證後，不再與楊某同居，也不撫養王甲的，可能構成遺棄罪"}, {"key": "D", "text": "王某如與李某領取結婚證後，不再與楊某同居，某日釆用暴力強行與楊某性交的，構成強姦罪"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】虐待家庭成員，情節惡劣的，構成虐待罪。此處家庭成員包括以夫妻名義同居的情形。王某長期對楊某施加暴力，成立虐待罪。實際上，共同生活的家庭成員都能成為虐待罪的對象，包括共同生活的保姆。本案中，楊某當然可以成為虐待罪的對象。A選項正確。 根據《民法典•婚姻家庭編》第1071條的規定，非婚生子女享有與婚生子女同等的權利，任何組織或者個人不得加以危害和歧視。不直接撫養非婚生子女的生父或者生母，應當負擔未成年子女或者不能獨立生活的成年子女的撫養費。雖然王某與楊某沒有辦理結婚登記，但楊某仍然是王甲的母親，故在王某傷害王甲時，楊某具有阻止義務，其不作為構成不作為的故意傷害罪。B選項正確。 王某對非婚生子女王甲具有撫養義務而不撫養，可能構成遺棄罪。雖然王某與楊某二人的事實婚姻本身不受法律保護，但王某與楊某均對王甲有撫養的義務。要注意，王甲是無辜的，王某與楊某二人都對王甲負有撫養的義務。C選項正確。 強姦罪保護的法益是婦女性的自己決定權，釆用暴力強行發生性關係的行為成立強姦罪。本案中，王某與楊某本身就不是法律上的夫妻關係，王某強姦楊某的，當然構成強姦罪。嚴格意義上來說，王某是強姦前女友楊某，當然成立強姦罪。D選項正確。"}, {"id": "卷一-96", "subject": "卷一", "type": "多選題", "question": "某日，甲指使乙將甲基苯丙胺5290.42克從A鎮運輸至B鎮進行販賣。次日下午，乙在販賣甲基苯丙胺時被公安機關抓獲，甲聞訊潛逃。關於本案的處理，下列選項正確的有？", "options": [{"key": "A", "text": "偵查人員訊問乙時，因客觀條件所限未錄音錄像"}, {"key": "B", "text": "公安機關針對甲發布通緝令，並經批准對其家屬適用監聽措施"}, {"key": "C", "text": "儘管甲下落不明，檢察院仍舊對其提起公訴"}, {"key": "D", "text": "公安機關就乙的抓獲經過製作了書面材料並附卷"}], "answer": ["B", "D"], "explanation_full": "【羿文解析】根據《刑事訴訟法》第123條規定，偵查人員在訊問犯罪嫌疑人的時候，可以對訊問過程進行錄音或者錄像；對於可能判處無期徒刑、死刑的案件或者其他重大犯罪案件，應當對訊問過程進行錄音或者錄像。錄音或者錄像應當全程進行，保持完整性。本案中乙的販毒數量較大，可能判處無期徒刑、死刑。故訊問乙必須訴諸完整的全程錄音錄像，不論客觀條件出現哪些困難。A選項錯誤。 根據《公安部規定》第263條規定，公安機關追捕被通緝或者批准、決定逮捕的在逃的犯罪嫌疑人、被告人 ，可以釆取追捕所必需的技術偵■措施。但此一條款並未限縮在被追訴人身上，從偵查目的的實現出發，結合現實中被追訴人往往會同家人聯繫的常識推斷，對其家屬的監聽並不存在禁止性理由。故B選項正確。 40 根據《人民檢察院規則》第505條規定，對於監察機關移送起訴的貪污賄賂犯罪案件，犯罪嫌疑人、被告人在境外，人民檢察院認為犯罪事實已經查清，證據確實、充分，依法應當追究刑事責任的，可以向人民法院提起公訴。對於公安機關移送起訴的需要及時進行審判的嚴重危害國家安全犯罪、恐怖活動犯罪案件，犯罪嫌疑人、被告人在境外，人民檢察院認為犯罪事實已經查清，證據確實、充分，依法應當追究刑事責任的，經最高人民檢察院核准，可以向人民法院提起公訴。本案並不符合上述任何一種情形，故C選項錯誤。根據《刑訴解釋》第142條規定，對監察機關、偵查機關出具的被告人到案經過、抓獲經過等材料，應當審查是否有出具該說明材料的辦案人員、辦案機關的簽名、蓋章。由此倒推，公安機關就乙的抓獲經過不僅可以製作書面材料，還應當附卷收錄，D選項正確。"}, {"id": "卷一-97", "subject": "卷一", "type": "多選題", "question": "張某因故意傷害罪被判處有期徒刑十年，在服刑期間表現良好，符合減刑條件，關於減刑的審理程序，下列說法正確的是：", "options": [{"key": "A", "text": "本案可由張某服刑地的基層人民法院審理"}, {"key": "B", "text": "法院可書面審理本案"}, {"key": "C", "text": "本案可由獨任法官審理"}, {"key": "D", "text": "法院可通知證人出庭證明張某有減刑事實"}], "answer": ["B", "D"], "explanation_full": "【羿文解析】根據《刑訴解釋》第534條規定，對被判處有期徒刑和被減為有期徒刑的罪犯的減刑、假釋，由罪犯服刑地的中級人民法院在收到執行機關提出的減刑、假釋建議書後1個月以內作■裁定，案情複雜或者情況特殊的，可以延長1個月。基層人民法院不能審理減刑案件。故A選項錯誤。 根據《刑訴解釋》第538條規定，審理減刑、假釋案件，應當組成合議庭，可以採用書面審理的方式。本案亦不存在必須開庭審理的情形，故B選項正確。 根據最高人民法院《關於減刑、假釋案件審理程序的規定》第4條規定，人民法院審理減刑、假釋案件，應當依法由審判員或者由審判員和人民陪審員組成合議庭進行。因此不存在獨任審判的情形。C選項錯誤。 根據最高人民法院《關於減刑、假釋案件審理程序的規定》第7條規定，人民法院根據需要，可以通知證明罪犯確有悔改表現或者立功、重大立功表現的證人，公示期間提出不同意見的人，以及鑒定人、翻譯人員等其他人員參加庭審，D選項正確。"}, {"id": "卷一-98", "subject": "卷一", "type": "多選題", "question": "徐某因涉嫌貪污被某縣監察委員會立案調查，某縣監察委員會對徐某採取留置措施。調查終結後移送某縣檢察院審查起訴，下列表述不正確的有？（　）", "options": [{"key": "A", "text": "對徐某留置需要由某縣監察委員會主任決定"}, {"key": "B", "text": "某縣檢察院應當對徐某先行拘留"}, {"key": "C", "text": "某縣檢察院經過審查若認為有證據證明徐某實施了貪污行為且可能被判處十年以上有期徒刑.有權徑行決定逮捕徐某"}, {"key": "D", "text": "在C中，某縣檢察院有權對徐某執行逮捕"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】監察法中剝奪被調查對象人身自由的方式與刑事訴訟法不同，沒有拘留、逮捕制度，而是適用留置。留置，意味著可能會較長時間地關押被調查對象，為了防止權力濫用、侵犯人權，採取留置措施需要監察機關領導人員集體研究決定。此外，市級以下監察機關需要採取留置措施的，應當報上一級監察機關批准。是故，本案中，某縣監察委員會主任無權決定留置，需要某縣監察委員會領導人員集體研究決定並報上一級監察委員會批准。A項錯誤。 若監察機關對被調查對象採取留置措施，根據監察法的規定，證明案件重大、複雜或者被調查人可能自殺、 逃跑，因此案件調查終結移送檢察院審查起訴後，檢察院應當採取對應的羈押措施，即將犯罪嫌疑人先行拘留，再決定後續如何處理。是故，B項正確。 41 期徒刑，有權徑行決定逮捕徐某，同時將徐某交某縣公安機關執行逮捕。是故，C項正確，D項錯誤。"}, {"id": "卷一-99", "subject": "卷一", "type": "單選題", "question": "某樓盤建築工地升降梯折斷造成11人死亡，住房和城鄉建設部依據《建設工程安全生產管理條例》（國務院令第393號）（以下簡稱《條例》）第57條決定將監理單位的資質由甲級降為乙級。監理單位不服，提起行政訴訟。關於本案，下列說法不正確的有？", "options": [{"key": "A", "text": "行政機關頒發資質證書的行為屬於行政許可"}, {"key": "B", "text": "在資質降級前，告知有聽證的權利"}, {"key": "C", "text": "本案的管轄法院為中級人民法院"}, {"key": "D", "text": "法院應當參照《條例》進行審理"}], "answer": ["D"], "explanation_full": "【羿文解析】根據《行政許可法》第12條規定，提供公眾服務並且直接關係公共利益的職業、行業，需要確定具備特殊信譽、特殊條件或者特殊技能等資格、資質的事項可以設定行政許可，本案中行政機關頒發資質證書的行為屬於行政許可，故選項A正確。 根據《行政處罰法》第63條第1款規定，行政機關擬作出“降低資質等級、吊銷許可證件”的行政處罰決定時 ，應當告知當事人有要求聽證的權利，當事人要求聽證的，行政機關應當組織聽證，故選項B正確。 根據《行政訴訟法》第15條規定，中級人民法院管轄的第一審行政案件包括“對國務院部門或者縣級以上地方人民政府所作的行政行為提起訴訟的案件”，本案的被告為住房和城鄉建設部，一審管轄法院為中院，故選項C正確。 本案中《建設工程安全生產管理條例》屬於行政法規，根據《行政訴訟法》第63條規定：“人民法院審理行政案件，以法律和行政法規、地方性法規為依據。地方性法規適用於本行政區域內發生的行政案件。人民法院審理民族自治地方的行政案件，並以該民族自治地方的自治條例和單行條例為依據。人民法院審理行政案件，參照規章。”法院在審理該案時應當依據而非參照《條例》，故選項D錯誤。"}, {"id": "卷一-100", "subject": "卷一", "type": "多選題", "question": "某區城管局發現李某未經批准在農貿市場的公共通道中擅自擺攤經營.經多次勸說無效後，遂對其商品進行了扣押，並對扣押過程全程錄像，關於扣押的實施，下列說法正確的有？", "options": [{"key": "A", "text": "應製作並當場交付扣押決定書和扣押清單"}, {"key": "B", "text": "應製作現場筆錄"}, {"key": "C", "text": "城管局不得在法定節假日實施扣押"}, {"key": "D", "text": "扣押時應當全程錄像是《行政強制法》的要求"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】行政機關扣押時應製作並當場交付扣押決定書和扣押清單並應製作筆錄，所以，AB選項正確。 根據《行政強制法》第43條第1款的規定：“行政機關不得在夜間或者法定節假日實施行政強制執行。但是 ，情況緊急的除外。”該條款針對的是行政強制執行行為，而強制措施的目的是“控制與預防”，這就決定了往往是在緊急突發情況下才會作出強制措施，此時，是不可能禁止夜間或節假日執法的，C選項錯誤。 D項於法無據，錯誤。 42"}, {"id": "卷一-1", "subject": "卷一", "type": "單選題", "question": "作為創新社會管理的方式之一，社區網格化管理是根據各社區實際居住戶數、區域面積大小、管理難度等情況，將社區劃分數個網格區域，把黨建、維穩、綜治、民政、勞動和社會保障、計劃生育、信訪等社會管理工作落實到網格，形成了“網中有格、格中定人、人負其責、專群結合、各方聯動、無縫覆蓋”的工作格局，以此建立社情民意收集反饋機制和社會矛盾多元調解機制。關於充分運用法律手段創新社會管理，下列哪一說法是不準確的？（　）", "options": [{"key": "A", "text": "社會管理創新主要針對社會管理領域的重點人群、重點區域和重點行業"}, {"key": "B", "text": "大調解格局是一種社會矛盾多元調解機制"}, {"key": "C", "text": "社會管理創新要求建立以法律手段為主體，多種手段協調配合的管理和控制體系"}, {"key": "D", "text": "社區網格與村民委員會、居民委員會的法律地位一樣，屬於基層群眾性自治組織"}], "answer": ["D"], "explanation_full": "【羿文解析】依法治國理念的基本要求有以下幾點：（1）充分發揮依法治國方略在全面推進中國特色社會主義事業中的重大作用。（2）實現法律手段與其他社會治理手段和方式的有機結合，其中的第一個要求包括 ：①充分運用法律手段，保障我國經濟的全面協調可持續發展。按照經濟建設的總體布局，②充分運用法律手段，推動我國社會建設事業的進一步完善，③充分運用法律手段，不斷創新社會管理。A.B.C均為創新社會管理的內容和要求。 基層群眾性自治組織指村民委員會和居民委員會，不包括社區網絡。D項錯誤。"}, {"id": "卷一-2", "subject": "卷一", "type": "單選題", "question": "建設法治政府是建設法治國家的關鍵環節，中共十八屆四中全會提出深入推進依法行政、加快建設法治政府的要求，下面說法正確的是：（　）", "options": [{"key": "A", "text": "健全依法決策機制"}, {"key": "B", "text": "把公眾參與、專家論證、風險評估、集體討論決定確定為重大行政決策法定程序"}, {"key": "C", "text": "積極推行政府法律顧問制度和公職律師制度，建立律師為主的法律顧問隊伍"}, {"key": "D", "text": "建立所有決策終身責任追究制度及責任倒查機制"}], "answer": ["A"], "explanation_full": "【羿文解析】十八屆四中全會提出深入推進依法行政、加快建設法治政府的要求，強調各級政府必須堅持在黨的領導下、在法治軌道上開展工作，加快建設職能科學、權責法定、執法嚴明、公開公正、廉潔高效、守法誠信的法治政府，因此A項正確。 建設法治政府的基本要求表現為：(1)依法全面履行政府職能：(2)健全依法決策機制。決策是行政權力運行的起點。一是把公眾參與、專家論證、風險評估、合法性審查、集體討論決定確定為重大行政決策法定程序 ，確保決策制度科學、程序正當、過程公開、責任明確。二是積極推行政府法律顧問制度和公職律師制度 ，建立政府法制機構人員為主體、吸收專家和律師參加的法律顧問隊伍。三是建立重大決策終身責任追究制度及責任倒查機制。強化和落實各類決策主體的行政和法律責任。因此BCD項錯誤。"}, {"id": "卷一-3", "subject": "卷一", "type": "單選題", "question": "關於黨的領導和依法治國的關係，下列哪一說法是錯誤的？", "options": [{"key": "A", "text": "黨的領導和社會主義法治是一致的，社會主義法治必須堅持黨的領導，黨的領導必須依靠社會主義法治"}, {"key": "B", "text": "黨的領導是中國特色社會主義最本質的特徵，是社會主義法治最根本的保證"}, {"key": "C", "text": "黨的領導主要體現在立法領域而非在執法和司法領域"}, {"key": "D", "text": "黨的主張通過法定程序成為國家意志，是黨的領導的主要內容之一"}], "answer": ["C"], "explanation_full": "【羿文解析】《中共中央關於全面推進依法治國若干重大問題的決定》明確要求，“黨的領導和社會主義法治是一致的，社會主義法治必須堅持黨的領導，黨的領導必須依靠社會主義法治……必須堅持黨領導立法、 1 ……”故ABD選項正確，C選項錯誤。"}, {"id": "卷一-4", "subject": "卷一", "type": "單選題", "question": "有關我國唐宋時期法制，下列哪一表述是錯誤的？（　）", "options": [{"key": "A", "text": "《永徽律疏》不僅是中華法系的代表性法典，也是中國封建法制的最高成就"}, {"key": "B", "text": "《宋刑統》不僅是一部具有統括性和綜合性的法典，也是中國歷史上第一部刊印頒行的法典"}, {"key": "C", "text": "貞觀律增設了加役流、五刑、十惡、八議、類推等制度，基本確立了唐律的內容和風格，對永徽律疏具有重要影響"}, {"key": "D", "text": "編敕是將敕上升為一般法律的過程。敕的效力往往高於律，編赦始自神宗朝"}], "answer": ["D"], "explanation_full": "【羿文解析】《永徽律疏》是迄今保留最完整的最早的一部法典，標誌著中國古代立法達到了最高水平，全面體現了中國古代法律制度的水平、風格和基本特徵，影響已經超越了中國，日本、越南、朝鮮的法律制度大都照抄《永徽律疏》，是中華法系的代表性法典。A選項正確。 《宋刑統》不僅是一部具有統括性和綜合性的法典，也是中國歷史上第一部刊印頒行的法典。B選項正確。 唐朝有三部代表性法典，高祖的《武德律》，太宗的《貞觀律》，高宗的《永徽律疏》。唐律的特色制度五刑、十惡、八議、類推等首先出現在《貞觀律》中，但最高成就卻是《唐律疏議》。C選項正確。 編敕是將敕上升為一般法律的過程。敕的效力往往高於律。編赦始自太祖《建隆編赦》，仁宗前敕律並行 ，神宗時敕足以破律。D選項錯誤。"}, {"id": "卷一-5", "subject": "卷一", "type": "單選題", "question": "清末“預備立憲”時期，清廷設立的地方各省咨詢機關稱為：（　）", "options": [{"key": "A", "text": "資政院"}, {"key": "B", "text": "資政局"}, {"key": "C", "text": "諮議局"}, {"key": "D", "text": "參政院"}], "answer": ["C"], "explanation_full": "【羿文解析】資政院是清末“預備立憲”時期清政府設立的中央咨詢機構，籌建始於1907年。1908年以後陸續完成《資政院院章》，1910年正式設立。其性質是承旨辦事的御用機構，與近現代社會的國家議會有根本性的不同：可以“議決”國家年度預決算、稅法與公債以及其餘奉“特旨”交議事項等，但一切決議均須報請皇帝定奪。皇帝還有權諭令資政院停會或解散及指定欽選議員。諮議局是清末“預備立憲”時期清政府設立的地方咨詢機關，籌建於1907年。1908年7月頒布《諮議局章程》及《諮議局議員選舉章程》，1909年開始在各省設立。其實質是各省督撫嚴格控制下的附屬機構，宗旨是“指陳通省利病、籌計地方治安”，權限包括討論本省興革事宜、決算預算、選舉資政院議員、申覆資政院或本省督撫的咨詢等。因此，本題的正確選項為C項。"}, {"id": "卷一-6", "subject": "卷一", "type": "單選題", "question": "甲的父親死後，其母將甲家住宅獨自占用。甲對此深為不滿，拒絕向母親提供生活費。其母將甲告上法庭 。法官審理後判決甲每月向其母提供生活費300元。對此事件，下列哪一理解是正確的？（　）", "options": [{"key": "A", "text": "該事件表明，子女對父母只承擔法律義務，不享有法律權利"}, {"key": "B", "text": "法官作出判決本身是一個法律事實"}, {"key": "C", "text": "法官的判決在原被告之間不形成法律權利與法律義務關係"}, {"key": "D", "text": "子女贍養父母主要是道德問題，法官判決缺乏依據"}], "answer": ["B"], "explanation_full": "【羿文解析】該事件並不表明子女對父母只承擔法律義務，不享有法律權利。首先，根據《民法典》，父母子女關係是雙向的，子女對父母承擔義務，但同時也享有權利。其次，甲母獨自占用甲家住宅，可能侵犯了甲的繼承權，應當對甲承擔相應的法律責任，但這不影響甲對甲母贍養義務的履行。故A選項錯誤。 法官的判決將原被告間的贍養關係在法律上確認下來，在原被告之間形成法律權利與法律義務關係，屬於法律事實。故B選項正確，C選項錯誤。 2 誤。"}, {"id": "卷一-7", "subject": "卷一", "type": "單選題", "question": "關於法的特徵，下列哪一說法是錯誤的？（　）", "options": [{"key": "A", "text": "法律面前人人平等原則並不禁止在立法上作出合理區別的規定"}, {"key": "B", "text": "根據法律規定，人對不能預見的事項，不承擔過錯責任"}, {"key": "C", "text": "非規範性法律文件任何人都不可以違反，因此其具有一定的普遍約束力"}, {"key": "D", "text": "法律具有國家強制力，但不是所有具有國家強制力的都是法律"}], "answer": ["C"], "explanation_full": "【羿文解析】法具有6個特徵：規範性、國家意志性、普遍性、權利義務性、國家強制性和程序性、可訴性。 在馬克思主義法學看來，法律必須同時具備這6個特徵。 法的普遍性有三層含義，其一，主權範圍內普遍有效；其二，法律面前人人平等；其三，法律不能強人所難 ，規定人們做不到的事情。法律面前人人平等，主要是機會的平等，在法律適用上的平等，而不是絕對平均 。為了保證機會上的平等，我們在立法時應當作出合理區別，如對弱者應當重點保護。故，A選項正確。 意外事件是人們憑藉心智難以預見的事情，如果法律規定人們對意外事件負擔過錯責任，實際上就是強人所難。故，B選項正確。注意，對於意外事件，人們不是不承擔責任，而是不承擔過錯責任。 法的規範性的核心含義是針對不特定主體反覆適用，這種針對不特定主體反覆適用的效力又叫作普遍約束力 。法律具有能夠針對不特定主體反覆適用的普遍約束力。因此，法理學上一般將廣義的法律稱為規範性法律文件。而非規範性法律文件則是法律適用的結果，如判決書、逮捕決定書、合同書等，其具有針對特定主體的約束力，但是不具有普遍約束力。故C選項錯誤。 法律具有國家強制力，但這並不意味著所有具有國家強制力的都是法律，如鄉政府頒發的紅頭文件，具有國家強制力，但並不是法律。故D選項正確。"}, {"id": "卷一-8", "subject": "卷一", "type": "單選題", "question": "出租車司機甲送孕婦乙去醫院，途中乙臨產，情形危急。為爭取時間，甲將車開至非機動車道掉頭，被交警攔截並被告知罰款。經甲解釋，交警對甲未予處罰且為其開警車引道，將乙及時送至醫院。對此事件，下列哪一表述是錯誤的？", "options": [{"key": "A", "text": "在本案中，出租車司機甲認為，人的生命自由高於秩序價值"}, {"key": "B", "text": "法律適用中一定會有適用者的價值判斷"}, {"key": "C", "text": "本案中“甲將車開至非機動車道掉頭”屬於價值判斷"}, {"key": "D", "text": "不同的解釋者對於同一問題可能會作出不同的解釋結果"}], "answer": ["C"], "explanation_full": "【羿文解析】甲為了輓救孕婦與胎兒的生命闖紅燈的行為，正是其經過人的生命自由高於交通秩序的判斷之後做出的。故A選項正確。 立法、司法、守法、執法，一定帶有個人的主觀價值判斷。故B選項正確。注意，價值判斷必不可少。 事實判斷的關鍵是“是和不是”的問題，價值判斷的關鍵點是“好與不好”的問題。交警發現了甲將車開至非機動車道掉頭，屬於事實判斷。故C選項錯誤。本案也涉及交警的價值判斷，交警對甲未予處罰且為其開警車引道，是經過價值判斷之後，認為人的生命高於交通秩序，然後做出的行為，此處即為價值判斷。 相同的法律條文，一個持自然法學派立場的法官和一個持分析實證法學派立場的法官，會從各自學派的立場進行解釋，帶有解釋者的價值判斷，可能會得出不同的結論。故D選項正確。"}, {"id": "卷一-9", "subject": "卷一", "type": "單選題", "question": "《刑事訴訟法》第五十七條規定：“人民檢察院接到報案、控告、舉報或者發現偵查人員以非法方法收集證據的，應當進行調查核實。對於確有以非法方法收集證據情形的，應當提出糾正意見；構成犯罪的，依法追究刑事責任。'‘關於該條文，下列哪一表述是正確的？", "options": [{"key": "A", "text": "該條文為禁止性規則"}, {"key": "B", "text": "該條文完整表達了假定條件、行為模式和法律後果"}, {"key": "C", "text": "該條文能直接作為法律決定的大前提"}, {"key": "D", "text": "該條文能彌補法律規則的僵硬性缺陷專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 3"}], "answer": ["C"], "explanation_full": "【羿文解析】該條文不涉及術語界定、公布機關等技術性規定的表達，並且明確具體，因而屬於法律規則。 法律規則明確具體能保證確定性和可預測性。法律原則抽象模糊能彌補規則的僵硬性缺陷，故D選項錯誤。 按照規則所表達的內容規定不同，法律規則可以分為授權性規則與義務性規則。授權性規則包括職權性規則與權利性規則。職權性主要是授予國家機關相應職權，而權利性規則主要是授予普通公民相應的權利。義務性規則包括命令性規則與禁止性規則。命令性規則帶有“應當”“必須”等關鍵字，而禁止性規則帶有“禁止”“不得”等關鍵字。本條文屬於命令性規則，故A選項錯誤。 法律規則的三要素包括假定條件、行為模式、法律後果。法律規則依靠條文表達，但一個條文不一定恰好表達法律規則的三個要素。如本條表達了假定條件和行為模式，未表達法律後果。故B選項錯誤。 《刑事訴訟法》屬於我國正式的法的淵源，可以作為法律決定的大前提。故C選項正確。"}, {"id": "卷一-10", "subject": "卷一", "type": "單選題", "question": "關於司法、司法制度的特徵和內容，下列哪一表述可以成立？", "options": [{"key": "A", "text": "中國特色社會主義司法制度包括司法規範體系、司法組織體系、司法制度體系、司法人員管理體系"}, {"key": "B", "text": "法院已成為現代社會最主要的糾紛解決主體，表明司法的被動性特點已逐漸被普遍性特點所替代"}, {"key": "C", "text": "從總體上看，司法具有解決糾紛、調整社會關係的直接功能和解釋和補充法律、形成公共政策、秩序維持 、文化支持等間接功能"}, {"key": "D", "text": "司法組織體系主要包括審判組織體系、律師組織體系、公證組織體系"}], "answer": ["A"], "explanation_full": "【羿文解析】中國特色社會主義司法制度包括司法規範體系、司法組織體系、司法制度體系、司法人員管理體系。故A選項正確。 現代社會法院是最主要的糾紛解決主體。但是，法院的被動性並未發生改變，因為這與司法權的性質相悖。 法律適用活動的慣常機制是“不告不理”，司法程序的啟動離不開權利人或特定機構的提請或訴求，但司法者從來都不能主動發動一個訴訟。故B選項錯誤。 從總體上看，司法具有解決糾紛的直接功能和調整社會關係、解釋和補充法律、形成公共政策、秩序維持、 文化支持等間接功能。司法的直接功能有且只有解決糾紛，調整社會關係屬於間接功能。故C選項錯誤。 司法組織體系主要指審判組織體系和檢察組織體系。注意，在我國，組織主要指國家機關的組織，而律師和公證員都屬於法律服務人員。故D選項錯誤。"}, {"id": "卷一-11", "subject": "卷一", "type": "單選題", "question": "《中華人民共和國公證法》是為規範公證活動，保障公證機構和公證員依法履行職責，預防糾紛，保障自然人、法人或者其他組織的合法權益而制定的法律，下列哪一說法是錯誤的？（　）", "options": [{"key": "A", "text": "當事人申請公證的事項不真實，不合法，公證機關不予辦理公證"}, {"key": "B", "text": "不予辦理公證的決定應當書面通知當事人或其代理人"}, {"key": "C", "text": "公證事項在6個月內不能辦結的，應當終止公證"}, {"key": "D", "text": "不予辦理公證的，公證機構應當根據其原因及責任，酌情部分或者全部退還公證費"}], "answer": ["C"], "explanation_full": "【羿文解析】根據《公證法》第31條的規定：“有下列情形之一的，公證機構不予辦理公證：……(七)申請公證的事項不真實、不合法的；……”故A選項正確。 根據《公證程序規則》第49條規定：“不予辦理公證的，由承辦公證員寫出書面報告，報公證機構負責人審批。不予辦理公證的決定應當書面通知當事人或其代理人。不予辦理公證的，公證機構應當根據不予辦理的原因及責任，酌情退還部分或者全部收取的公證費。”故B、D選項正確。 根據《公證程序規則》第50條的規定：“公證事項有下列情形之一的，公證機構應當終止公證：(一)因當事人的原因致使該公證事項在六個月內不能辦結的；……”終止公證必須是由於當事人的原因在6個月不能辦結 ，故C選項錯誤。"}, {"id": "卷一-12", "subject": "卷一", "type": "單選題", "question": "甲、乙等30名律師各出資100萬元合夥設立了普通合夥律師事務所。該所的非合夥人律師丙將委託人的 500萬賠償款卷走，下落不明。下列哪一說法是錯誤的？（　） 4", "options": [{"key": "A", "text": "該委託人可以請求律師事務所賠償其損失"}, {"key": "B", "text": "律師事務所向委託人賠償損失後，可以向丙追償"}, {"key": "C", "text": "甲僅以其在律師事務所中的財產份額為限承擔責任"}, {"key": "D", "text": "甲承擔無限連帶責任"}], "answer": ["C"], "explanation_full": "【羿文解析】《律師事務所管理辦法》第53條第1款規定：“律師違法執業或者因過錯給當事人造成損失的 ，由其所在的律師事務所承擔賠償責任。律師事務所賠償後，可以向有故意或者重大過失行為的律師追償。 ”丙卷走委託人款項，顯然是違法執業，故A、B項正確。 《律師事務所管理辦法》第53條第2款規定：“普通合夥律師事務所的合夥人對律師事務所的債務承擔無限連帶責任。……”丙為律師事務所的非合夥人律師，其故意行為造成的損失，應由全體合夥人承擔無限連帶責任，因此，C項錯誤，D項正確。"}, {"id": "卷一-13", "subject": "卷一", "type": "單選題", "question": "關於人民法院審判委員會的表述，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "審判委員會是人民法院的最高審判組織，在總結審判經驗，審理疑難、複雜、重大案件中具有重要的作用"}, {"key": "B", "text": "審判委員會有權討論涉及國家外交、安全和社會穩定的重大複雜案件，以及重大、疑難、複雜案件的事實認定和法律適用問題"}, {"key": "C", "text": "合議庭沒有建議提請審判委員會討論的案件，庭長不得提請審判委員會討論"}, {"key": "D", "text": "審判委員會委員討論案件時應當充分發表意見，按照法官等級由高到低確定表決順序，主持人最後表決"}], "answer": ["A"], "explanation_full": "【羿文解析】《最高人民法院關於改革和完善人民法院審判委員會制度的實施意見》第3條規定：“審判委員會是人民法院的最高審判組織，在總結審判經驗，審理疑難、複雜、重大案件中具有重要的作用。”故A項正確。 《最高人民法院關於完善人民法院司法責任制的若干意見》第9條規定：“明確審判委員會統一本院裁判標準的職能，依法合理確定審判委員會討論案件的範圍。審判委員會只討論涉及國家外交、安全和社會穩定的重大複雜案件，以及重大、疑難、複雜案件的法律適用問題。強化審判委員會總結審判經驗、討論決定審判工作重大事項的宏觀指導職能。”據此，審判委員會只討論相關案件的法律適用問題，不涉及事實認定問題 ，故B項錯誤。 《最高人民法院關於改革和完善人民法院審判委員會制度的實施意見》第11條第2款規定：“合議庭沒有建議提請審判委員會討論的案件，院長、主管副院長或者庭長認為有必要的，得提請審判委員會討論。”據此 ，C項“不得”二字錯誤。 《最高人民法院關於完善人民法院司法責任制的若干意見》第11條第2款第1句規定：“審判委員會委員討論案件時應當充分發表意見，按照法官等級由低到高確定表決順序，主持人最後表決。”據此，D項“由高到低 ”的表述錯誤。"}, {"id": "卷一-14", "subject": "卷一", "type": "單選題", "question": "關於我國的國家結構形式，下列哪一說法是錯誤的？（　）", "options": [{"key": "A", "text": "國家結構形式是指特定國家的統治階級根據一定原則採取的調整國家整體與部分、中央與地方相互關係的形式，是從縱向角度表現國家政權體系"}, {"key": "B", "text": "對於國家結構形式的選擇，統治階級的政治需要是最主要並起決定作用的要素"}, {"key": "C", "text": "縣、市、市轄區部分行政區域界線的變更，由省、自治區、直轄市人民政府審批"}, {"key": "D", "text": "鄉、民族鄉、鎮的設立、撤銷、更名或者變更行政區域的界線，由省、自治區、直轄市人民政府審批"}], "answer": ["C"], "explanation_full": "【羿文解析】國家結構形式是指特定國家的統治階級根據一定原則採取的調整國家整體與部分、中央與地方相互關係的形式。如果說政權組織形式是從橫向角度表現國家政權體系，那麼國家結構形式則是從縱向角度表現國家政權體系。因此A項正確。 5 此B項正確。 《憲法》第89條：“國務院行使下列職權：……(十五)批准省、自治區、直轄市的區域劃分，批准自治州、 縣、自治縣、市的建置和區域劃分。”《國務院關於行政區劃管理的規定》第5條：“縣、市、市轄區的部分行政區域界線的變更，國務院授權省、自治區、直轄市人民政府審批；批准變更時，同時報送民政部備案。 鄉、民族鄉、鎮的設立、撤銷、更名和行政區域界線的變更，鄉、民族鄉、鎮人民政府駐地的遷移，由省、 自治區、直轄市人民政府審批。”因此C項錯誤。 《憲法》第107條第3款：“省、直轄市的人民政府決定鄉、民族鄉、鎮的建置和區域劃分。”因此D項正確。"}, {"id": "卷一-15", "subject": "卷一", "type": "單選題", "question": "關於國家主席，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "國家主席根據國務院的決定，宣布省、自治區、直轄市的部分地區進入緊急狀態"}, {"key": "B", "text": "國家主席可以根據全國人大常委會的決定，有發布特赦令、動員令、宣布進入緊急狀態等的職權"}, {"key": "C", "text": "國家主席提名副主席人選"}, {"key": "D", "text": "下屆全國人民代表大會選出主席、副主席時中華人民共和國主席、副主席行使職權終止"}], "answer": ["B"], "explanation_full": "【羿文解析】國務院的緊急狀態由國家總理宣布。故A項錯誤。 國家主席代表國家，進行國事活動，接受外國使節，接受外國使節的儀式也稱遞交國書儀式。國家主席根據全國人民代表大會的決定和全國人大常委會的決定，發布動員令及特赦令，宣布進入緊急狀態等職責。故B項正確。 國家主席和副主席均為全國人大選舉產生。故C項錯誤。 依據《憲法》第83條的規定：“中華人民共和國主席、副主席行使職權到下屆全國人民代表大會選出的主席 、副主席就職為止。”故D項錯誤。"}, {"id": "卷一-16", "subject": "卷一", "type": "單選題", "question": "關於公民基本權利，下列哪一選項是錯誤的：", "options": [{"key": "A", "text": "人權是基本權利的來源，基本權利是人權憲法化的具體表現"}, {"key": "B", "text": "我國憲法規定的權利和義務是從我國的政治、經濟、文化發展的實際情況出發"}, {"key": "C", "text": "我國公民在行使自由和權利的時候，不得損害國家的、社會的、集體的利益和其他公民的合法的自由和利益"}, {"key": "D", "text": "憲法法律的限制屬於內在限制"}], "answer": ["D"], "explanation_full": "【羿文解析】人權，是指人作為人應當享有的權利，屬於應然權利。它經過資產階級啟蒙思想家的“天賦人權”的思想而得到廣泛傳播，並最終在資本主義憲法中得到了體現。當人權進入憲法和法律的保障範圍後 ，人權就由一種應然權利轉變為一種法定權利，而公民基本權利，指經由一國憲法確認公民享有的必不可少的權利。因此，人權是基本權利的來源，基本權利是人權憲法化的具體表現。故A選項正確。 我國公民的基本權利和義務具有廣泛性、平等性、現實性和一致性的特點。其中，現實性要求：我國憲法規定的權利和義務是從我國的政治、經濟、文化發展的實際狀況出發；憲法對公民基本權利和義務的規定，既有物質保障，又有法律保障。故B選項正確。 據我國《憲法》第51條：中華人民共和國公民在行使自由和權利的時候，不得損害國家的、社會的、集體的利益和其他公民的合法的自由和權利。故C選項正確。 限制基本權利的基本形式包括基本權利的內在限制，以及憲法和法律的限制。其中，憲法和法律的限制屬於外部限制。故D選項錯誤。"}, {"id": "卷一-17", "subject": "卷一", "type": "單選題", "question": "關於香港特別行政區，下列哪一說法是正確的？", "options": [{"key": "A", "text": "香港特別行政區維護國家安全法不適用於不具有香港特別行政區永久性居民身份的人在香港特別行政區以外針對香港特別行政區實施香港特別行政區維護國家安全法規定的犯罪"}, {"key": "B", "text": "危害國家安全犯罪案件的審判必須組成陪審團審理"}, {"key": "C", "text": "香港特別行政區維護國家安全委員會下設秘書處，秘書長由行政長官任命專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 6"}, {"key": "D", "text": "駐香港特別行政區維護國家安全及其人員依法執行職務的行為，不受香港特別行政區管轄"}], "answer": ["D"], "explanation_full": "【羿文解析】香港特別行政區維護國家安全法的效力範圍包括：任何人在香港特別行政區內實施本法規定的犯罪；香港特別行政區永久性居民或者在香港特別行政區成立的公司、團體等法人或者非法人組織在香港特別行政區以外實施本法規定的犯罪；不具有香港特別行政區永久性居民身份的人在香港特別行政區以外針對香港特別行政區實施本法規定的犯罪。故A選項錯誤。 危害國家安全犯罪案件的審判由行政長官指定法官審理。經律政司長髮出證書，審判可以不需要陪審團。故 B選項錯誤。 香港特別行政區設立維護國家安全委員會，下設秘書處，由秘書長領導。秘書長由行政長官提名，報中央人民政府任命。故C選項錯誤。 駐香港特別行政區維護國家安全公署人員除遵守全國性法律外，還應當遵守香港特別行政區法律。駐香港特別行政區維護國家安全及其人員依法執行職務的行為，不受香港特別行政區管轄。故D選項正確。"}, {"id": "卷一-18", "subject": "卷一", "type": "單選題", "question": "文化制度是憲法的重要內容之一。對此，下列哪一選項的說法是不正確的？（　）", "options": [{"key": "A", "text": "1919年《魏瑪憲法》第一次比較全面系統地規定文化制度"}, {"key": "B", "text": "“推廣普通話”是我國憲法規定的基本文化制度的內容"}, {"key": "C", "text": "《專利法》是我國憲法規定的基本文化制度的內容的延伸"}, {"key": "D", "text": "我國憲法明確規定了公民■版文學藝術作品的自由屬於基本文化制度的範疇"}], "answer": ["D"], "explanation_full": "【羿文解析】世界範圍內憲法對文化制度的規定，肇始於1919年《魏瑪憲法》，它不僅詳盡地規定了公民的文化權利，而且還明確規定了國家的基本文化政策，它第一次比較全面系統地規定文化制度。因此，A項正確 。 推廣普通話是我國現行憲法的明確規定之一。《憲法》第19條規定：“國家發展社會主義的教育事業，提高全國人民的科學文化水平。國家舉辦各種學校，普及初等義務教育，發展中等教育、職業教育和高等教育 ，並且發展學前教育。國家發展各種教育設施，掃除文盲，對工人、農民、國家工作人員和其他勞動者進行政治、文化、科學、技術、業務的教育，鼓勵自學成才。國家鼓勵集體經濟組織、國家企業事業組織和其他社會力量依照法律規定舉辦各種教育事業。國家推廣全國通用的普通話。”B項正確。 發展科學是我國文化建設的重要組成部分，《憲法》第20條規定：“國家發展自然科學和社會科學事業，普及科學和技術知識，獎勵科學研究成果和技術發明創造。”據此，國家頒布了《專利法》《著作權法》等一系列單行法律法規以具體實施這一基本制度。C項正確。 公民出版文學藝術作品的自由即出版自由，它屬於公民政治權利和政治自由的內容，不屬於國家文化制度的範疇。D項錯誤。"}, {"id": "卷一-19", "subject": "卷一", "type": "單選題", "question": "根據我國《憲法》和有關法律的規定，下列哪一選項是不正確的？（　）", "options": [{"key": "A", "text": "某縣人大根據需要設立法制委員會、財政經濟委員會等專門委員會"}, {"key": "B", "text": "某縣人大常委會任免人大專門委員會的主任委員、副主任委員和部分委員"}, {"key": "C", "text": "某自治區人大常委會在該自治區下轄的地區設立工作機構"}, {"key": "D", "text": "某不設區的市的人大常委會在其所轄的街道設立工作機構"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《地方各級人民代表大會和地方各級人民政府組織法》（以下簡稱《地方組織法》）第 30條第1款的規定，省、自治區、直轄市、自治州、設區的市的人民代表大會根據需要，可以設法制委員會、 財政經濟委員會、教育科學文化衛生委員會等專門委員會；縣、自治縣、不設區的市、市轄區的人民代表大會根據需要，可以設法制委員會、財政經濟委員會等專門委員會。各專門委員會受本級人民代表大會領導 ；在大會閉會期間，受本級人民代表大會常務委員會領導。A項正確。 7 ，由主任會議提名，常務委員會會議通過。B項錯誤。 根據《地方組織法》第53條第2款的規定，省、自治區的人民代表大會常務委員會可以在地區設立工作機構。 C項正確。 根據《地方組織法》第53條第3款的規定，市轄區、不設區的市的人民代表大會常務委員會可以在街道設立工作機構。工作機構負責聯繫街道轄區內的人民代表大會代表，組織代表開展活動，反映代表和群眾的建議、 批評和意見，辦理常務委員會交辦的監督、選舉以及其他工作，並向常務委員會報告工作。D項正確。"}, {"id": "卷一-20", "subject": "卷一", "type": "單選題", "question": "李某是甲國駐乙國的外交官，其下列哪種行為不享有外交豁免權？（　）", "options": [{"key": "A", "text": "李某為使館購買樓房一棟，因價款問題被房地產商告上乙國法院"}, {"key": "B", "text": "李某與外交官同事之間有債務糾紛，被訴至乙國法院"}, {"key": "C", "text": "李某叔父將自己位於乙國首都的別墅遺贈給李某，被叔父之子訴上乙國法院"}, {"key": "D", "text": "李某目擊乙國首都街頭一起凶殺案，乙國警方欲讓李某出庭作證"}], "answer": ["C"], "explanation_full": "【羿文解析】根據《外交關係公約》，外交人員原則上享有民事和行政管轄豁免，但有下列例外：(1)外交人員在接受國的私有不動產訴訟，但代表派遣國為使館購置不動產除外；(2)以私人身份作為遺囑執行人、遺產管理人、繼承人或受贈人的繼承事項訴訟；(3)外交代表在接受國內在公務範圍以外所從事的專業或商業活動的訴訟；(4)外交人員主動起訴而引起的與該訴訟直接有關的反訴。同時，根據《外交關係公約》，外交人員免除作證義務。C項屬於以私人身份參與的繼承訴訟，該情形下，外交人員不享有豁免，接受國法院可以管轄 ，故C項正確。"}, {"id": "卷一-21", "subject": "卷一", "type": "單選題", "question": "中國公民李某與中國公民王某2016年喜結連理，婚後赴美國誕下一子小李.後一家三口返回北京定居。根據美國法律，小李出生時即可獲得美國國籍。2017年，李某赴西班牙定居並取得了西班牙國籍。李某的弟弟得知李某獲得西班牙國籍後拜託李某代為申請西班牙國籍並獲得成功。下列說法哪一選項是正確的？（　）", "options": [{"key": "A", "text": "根據我國法律，小李出生時沒有中國國籍"}, {"key": "B", "text": "李某獲得西班牙國籍後應該向我國相關部門申請放棄中國國籍"}, {"key": "C", "text": "如果李某的弟弟為國家工作人員，其仍舊可以退出中國國籍"}, {"key": "D", "text": "如果李某的弟弟為現役軍人，則其不得退出中國國籍"}], "answer": ["D"], "explanation_full": "【羿文解析】根據我國《國籍法》的規定，父母雙方或一方為中國公民，父母定居國外且本人出生在國外 ，出生時即具有外國國籍的，不具有中國國籍。大家一定注意，父母雙方或者一方為中國公民，孩子出生時不具有中國國籍需要同時具備三個條件：父母定居國外+本人出生在國外+出生時具有外國國籍。題乾中少了定居這一要素。所以小李出生時仍舊具有中國國籍。這並不違反禁止雙重國籍的規定，現實中的做法是等小李成為完全民事行為能力人後自行選擇保留一個國籍。A選項錯誤。 根據我國《國籍法》的規定，定居國外且獲得外國國籍的人自動喪失中國國籍。題乾中李某符合自動喪失中國國籍的條件，所以不需要辦理退出手續。B選項錯誤。 根據我國《國籍法》的規定，國家工作人員不得退出我國國籍。C選項錯誤。 根據我國《國籍法》的規定，現役軍人不得退出我國國籍。注意是“現役”軍人，而非軍人。D選項正確。"}, {"id": "卷一-22", "subject": "卷一", "type": "單選題", "question": "關於國際法院對國家間的爭端行使管轄權.下列哪一表述是錯誤的？（　）", "options": [{"key": "A", "text": "爭端當事國任一方可將爭端提交國際法院，而無須取得對方的同意"}, {"key": "B", "text": "爭端當事國雙方均為《國際法院規約》的當事國，且聲明接受國際法院根據《國際法院規約》第36條規定的管轄權"}, {"key": "C", "text": "爭端當事國雙方達成協議.同意將問題提交國際法院解決"}, {"key": "D", "text": "在爭端當事國雙方同為當事國的國際條約中規定爭端應由國際法院解決"}], "answer": ["A"], "explanation_full": "8 何爭端.當事國都可以在爭端發生後達成協議將爭端提交國際法院；二是協定管轄，指在現行條約或協定中規定各方同意將有關的爭端提交國際法院解決；三是任擇強制管轄，《國際法院規約》的當事國可以通過發表聲明就具有某些性質的爭端對於接受同樣義務的任何其他當事國接受法院的管轄為當然具有強制性，而不需要再有特別的約定。這些爭端一般包括對於條約的解釋、違反國際義務的任何事實、違反國際義務而產生的賠償的性質和範圍等。故本題只有A項錯誤。"}, {"id": "卷一-23", "subject": "卷一", "type": "單選題", "question": "故意犯罪形態是指故意的犯罪在其發展過程中的不同階段，由於主客觀原因而停止下來的各種犯罪形態 ，關於故意犯罪形態，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "甲為強姦婦女乙，將其打成重傷，但甲在實施姦淫行為之前被人抓獲的，甲成立強姦罪，適用“致使被害人重傷”的法定刑，同時適用未遂的處罰規定"}, {"key": "B", "text": "甲綁架婦女乙意圖出賣，隨後見色起意，開始著手準備強姦乙，但在甲實施姦淫行為之前被人制止的，甲成立拐賣婦女罪與強姦罪未遂數罪並罰"}, {"key": "C", "text": "甲在公共場所當眾強姦婦女乙，無論甲是否實施了姦淫行為，都應當適用強姦罪加重情節的法定刑，以既遂論處"}, {"key": "D", "text": "甲、乙意圖輪姦婦女丙，甲實施姦淫行為後，乙還沒來得及實施姦淫行為就被抓獲的，甲、乙成立強姦罪既遂的共犯，但不適用“二人以上輪姦”的規定"}], "answer": ["A"], "explanation_full": "【羿文解析】結果加重犯存在未遂的結果加重犯的情形，即加重結果出現，但基本犯罪未遂的，適用結果加重犯的法定刑，同時適用總則關於未遂犯的規定。如果同時構成其他犯罪，成立想象競合犯，從一重罪處罰 。甲強姦致使被害婦女乙重傷，成立強姦罪，適用強姦“致使被害人重傷”的法定刑；甲因意志以外的原因未能實施姦淫行為，故對甲應同時適用未遂的處罰規定。A選項正確。 故意犯罪的結合犯，存在適用結合犯的法定刑同時適用未遂犯規定的情形。甲綁架婦女乙意圖出賣，成立拐賣婦女罪（加重情節）；甲對乙女實施強姦行為，屬於拐賣婦女“姦淫被拐賣的婦女”的情形，屬於結合犯 ，應當適用結合犯的法定刑；但甲因意志以外的原因未能實施姦淫行為，屬於結合犯未遂的情形，應當適用未遂的處罰規定。故甲成立拐賣婦女罪，適用“姦淫被拐賣的婦女”的法定刑，同時適用未遂的處罰規定 ，B選項錯誤。 刑法分則條文因為行為、對象等構成要件要素的特殊性使行為類型發生變化，進而導致違法性增加，並加重法定刑時，屬於加重的犯罪構成（或構成要件）。加重構成要件存在適用加重的法定刑同時適用未遂犯規定的情形。甲在公共場所當眾強姦婦女乙的，成立強姦罪的加重情節，應當適用加重情節的法定刑；如果甲實施姦淫行為，則按照既遂論處；如果甲因意志以外的原因未得逞的，則適用總則關於未遂的處罰規定；如果甲自動放棄姦淫行為的，則適用中止的處罰規定，因未能造成損害，應當免除處罰。C選項錯誤。 “二人以上輪姦的”，屬於強姦罪的加重情節，即二男以上在同一段時間內，共同對同一婦女（或幼女）連續地輪流或同時強姦（或姦淫）的行為。輪姦屬於加重構成要件，不屬於量刑規則，故存在輪姦未遂。甲、 乙以輪姦故意對丙女實施強姦行為，但甲、乙因意志以外的原因未能均實施姦淫行為，甲、乙成立強姦罪 ，屬於輪姦未遂的情形，即適用輪姦的法定刑，同時適用未遂的處罰規定；由於甲實施了姦淫行為，成立強姦罪基本犯既遂，乙與甲成立強姦罪基本犯既遂的共犯。為保證罪刑相適應，對甲、乙二人應以輪姦未遂與普通強姦既遂的想象競合犯論處。D選項錯誤。"}, {"id": "卷一-24", "subject": "卷一", "type": "單選題", "question": "關於刑法解釋，下列說法哪一選項是正確的？（　）", "options": [{"key": "A", "text": "將婦女、兒童賣到中國境內，不屬於“將婦女、兒童賣往境外”，不應以拐賣婦女兒童的加重犯罪構成處罰"}, {"key": "B", "text": "甲在網上招募模特，多次安排一名模特和一名攝影者，要求模特擺出各種暴露性器官的淫穢姿勢供攝影者拍攝。由於這種“一對一”“裸拍”極度私密，不可能破壞社會管理秩序，按照目的解釋，不構成組織淫穢表演罪"}, {"key": "C", "text": "乙將兩名成年男子賣給外國漁船老闆做奴隸，由於拐賣男子不能解釋為拐賣婦女、兒童，因此乙不構成犯罪專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 9"}, {"key": "D", "text": "丙開設代孕公司，組織20多名模特向客戶提供有償代孕服務。由於丙的行為不能解釋為組織他人“出賣 ”器官，因此，不構成組織出賣人體器官罪"}], "answer": ["D"], "explanation_full": "【羿文解析】作為拐賣婦女、兒童罪加重處罰情形，不僅包括將婦女、兒童從中國境內賣往境外的行為，還應包括將婦女、兒童從中國境外賣往境內的行為。因為與“將婦女、兒童從境內賣往境外”的行為相比，將婦女、兒童從境外賣往境內的行為，也具有同樣的甚至更為嚴重的法益侵害性，根據平等保護的刑法理念 ，既然前者屬於本罪的加重處罰情節，那麼後者也應作為本罪的加重處罰情節處理。因此無論將婦女、兒童賣往中國境外(“出口”)，還是將婦女、兒童賣到中國境內(“進口”)，都屬於“將婦女、兒童賣往境外 ”。A項錯誤。 應將“表演”解釋為向他人展示自己的過程，本案就屬於組織淫穢表演，應對甲定罪。組織淫穢表演罪的立法目的是制裁有傷風化、妨害社會管理秩序的行為，儘管這種淫穢表演的受眾只有一人，但受眾是甲從網上公開招募而來，具有不特定性，且多人多次，表演活動會危害社會性風尚。B項錯誤。 將拐賣男性解釋為拐賣婦女，就超出了婦女本來的含義，屬於類推解釋，但兩名男子被買到漁船做奴隸，乙的行為構成強迫勞動罪。《刑法》第244條第2款規定，明知他人強迫勞動，為其招募、運送人員或者有其他協助強迫他人勞動行為的，依照強迫勞動罪處罰。C項錯誤。 丙組織多名模特向客戶提供有償代孕服務，由於丙的行為屬於組織他人“出租”器官——子宮，不能解釋為組織他人“出賣”器官，不構成組織出賣人體器官罪。D項正確。"}, {"id": "卷一-25", "subject": "卷一", "type": "單選題", "question": "丙在公交車上竊取甲的手機，被發現後立即下車逃跑，乘客乙一路追趕，在追趕40米後乙將丙撲倒，奪回甲被盜的手機，乙輕微擦傷。甲取回手機後，為了解氣，對丙實施了一頓毆打，經鑒定丙受輕傷。下列哪一選項的說法是正確的？（　）", "options": [{"key": "A", "text": "乙沒有遭受不法侵害，不成立正當防衛"}, {"key": "B", "text": "丙的盜竊行為已經結束，乙屬於事後防衛"}, {"key": "C", "text": "甲對丙成立正當防衛"}, {"key": "D", "text": "乙對丙成立正當防衛"}], "answer": ["D"], "explanation_full": "【羿文解析】正當防衛是為了使國家、公共利益、本人或他人的人身、財產等免受正在進行的不法侵害而採取的制止不法侵害的行為，也即成立正當防衛，不限於自己遭受不法侵害。針對財產犯罪，即便行為人取得財物，但是在現場被發現，被害人還來得及輓回損失的情況下，視為不法侵害尚未結束，依然可以進行正當防衛，故乙的行為屬於正當防衛，A、B選項錯誤，D選項正確。 甲的財物被追回，不存在現實的不法侵害，甲的行為屬於事後防衛，構成故意犯罪，C選項錯誤。"}, {"id": "卷一-26", "subject": "卷一", "type": "單選題", "question": "關於因果關係，下列哪一選項是錯誤的？", "options": [{"key": "A", "text": "護士在注射抗生素時沒有為患者做皮試，患者因注射抗生素而死亡，但是事後查明，即使做皮試也不能■出患者的特殊反應，不能將死亡結果歸屬於護士的行為。"}, {"key": "B", "text": "甲將水性不好的乙推入水庫後離開，但是乙立即就能抓住身邊的可以保住性命的木板，此時與甲沒有任何意思聯絡的丙迅速拿走木板，導致乙溺水身亡，死亡結果應該歸屬於丙的行為"}, {"key": "C", "text": "甲酒後在封閉的高速公路上駕駛機動車，撞死了突然違章橫穿高速公路的乙，死亡結果可以歸屬於甲的酒後駕車行為"}, {"key": "D", "text": "機動車駕駛者甲撞傷乙後，警察立即將具有救助可能性的乙送往醫院，但途中發生事故導致乙死亡，此時死亡結果不能歸屬於甲"}], "answer": ["C"], "explanation_full": "【羿文解析】只有當行為和結果之間具有條件關係，而且行為的危險已經現實化為侵害結果時，才能將該侵害結果歸屬於行為，沒有結果迴避可能性時，不能將結果歸屬於行為，即使做皮試也不能■出患者的特殊反應，屬於不具有結果迴避可能性的行為，不能將死亡結果歸屬於護士的行為。A選項正確。 10 行為，甲的行為結束後，介入了丙的行為，丙的行為導致了乙的死亡結果，甲的行為沒有現實化為侵害結果 ，故乙的死亡結果應當歸屬於丙的行為。B選項正確。 行為沒有引起注意規範的保護目的所指向的結果時，不能將結果歸屬於行為，甲醉酒駕駛的行為雖然違反了注意規範，但是禁止酒後駕駛的規範，是為了防止因喪失或者減輕控制車輛的能力而造成死亡結果，本案中乙的死亡結果不能歸屬於甲。C選項錯誤。 在防止結果的發生屬於他人負責的領域時，結果的發生不能歸屬於行為人的行為。在警察介入之後，防止死亡結果的救助義務已經屬於警察負責的領域，故不能將乙的死亡結果歸屬於於甲。D選項正確。"}, {"id": "卷一-27", "subject": "卷一", "type": "單選題", "question": "事實認識錯誤是指行為人認識的事實與實際發生的事實不一致的情況，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "甲本欲電話詐騙乙，但拔錯了號碼，對接聽電話的丙實施了詐騙，騙取丙大量財物，甲的行為屬於對象錯誤，成立詐騙既遂"}, {"key": "B", "text": "甲意圖銷售劣藥，但卻銷售了偽劣的獸藥，如果不考慮數額，甲的行為成立銷售劣藥罪"}, {"key": "C", "text": "事前的故意屬於抽象的事實認識錯誤，按照法定符合說，應按犯罪既遂處理"}, {"key": "D", "text": "甲想倒賣車票，但事實上倒賣的是船票，此時船票可以擴大解釋為車票，甲的行為構成倒賣車票罪"}], "answer": ["A"], "explanation_full": "【羿文解析】一般認為，對象錯誤與打擊錯誤的區分之處在於，對象錯誤屬於主觀認識錯誤；而打擊錯誤屬於客觀結果錯誤，行為人對行為所指向的對象不存在主觀認識錯誤，錯誤的結果是由行為方法等客觀因素造成的。 甲本欲電話詐騙乙，但撥錯了號碼，撥打電話的行為本身並不是犯罪行為，接通電話後的詐騙行為才是犯罪行為，在甲實施詐騙行為時，沒有出現任何行為的誤差，甲僅是主觀出現了錯誤，以為在詐騙乙，實際上詐騙了丙，這屬於對象錯誤，不是打擊錯誤。對於同一構成要件範圍內的對象認識錯誤，無論按照法定符合說還是具體符合說，都存在詐騙故意，成立詐騙罪既遂。故A選項正確。 普通法和特別法在普通法中重合，人藥和獸藥只有在偽劣產品的範圍內重合，所以成立銷售偽劣產品罪。B項錯誤。 事前的故意，是指行為人誤認為第一個行為已經造成結果，出於其他目的實施第二個行為，實際上是第二個行為才導致預期的結果出現的情況。例如，實施殺人行為後，誤以為對方已經死亡，拋屍人海導致對方溺死的。此種情況屬於具體事實認識錯誤中的因果關係錯誤，並不是抽象事實認識錯誤。故C選項錯誤。 行為人主觀上想拐賣婦女，客觀上拐賣了兒童，由於拐賣婦女、兒童罪是選擇性罪名，所以可以做如下推導 ：行為人主觀上想拐賣婦女或兒童，而客觀上拐賣了兒童，自然在兒童的範圍內重合，直接認定為拐賣兒童罪的既遂即可。甲想倒賣車票，但事實上倒賣的是船票，甲的行為構成倒賣船票罪。D選項錯誤。"}, {"id": "卷一-28", "subject": "卷一", "type": "單選題", "question": "下列關於中立的幫助行為的說法，哪一項是錯誤的？（　）", "options": [{"key": "A", "text": "甲坐上乙駕駛的出租車後，發現前方丙女手上提著包，就讓乙靠近丙行駛，乙知道甲的用意，依然靠近丙行駛。甲奪過丙的提包後。讓乙加速開車逃跑，乙立即提速並將甲送往目的地。乙應以搶奪罪論處"}, {"key": "B", "text": "甲公司在網絡上提供了某種播放器，網民可以通過該播放器下栽、上傳淫穢影片，播放器同時對淫穢影片予以緩存，使得其他的網民能夠迅速觀看淫穢影片。對甲公司應以傳播淫穢物品罪的正犯論處"}, {"key": "C", "text": "甲公司在網絡上免費提供下載工具，正犯乙利用該工具下載淫穢視頻出售的.甲不成立正犯的幫助犯"}, {"key": "D", "text": "農民甲前往農資公司購買劇毒農藥，並沒有告訴經理乙是用來殺人，農資公司經理乙便將劇毒農藥賣給了甲。後甲利用該劇毒殺死了與自己素有矛盾的丙。乙構成故意殺人罪"}], "answer": ["D"], "explanation_full": "【羿文解析】中立的幫助行為是否構成犯罪，應該通過綜合考慮正犯行為的的緊迫性，行為人(幫助人)對法益的保護義務，行為對法益侵害所起的作用大小及行為人對正犯行為與結果的確定性的認識等要素，才能得出妥當結論。本項中，在甲要求乙駕駛出租車靠近丙時，乙明知甲的用意。還依然靠近丙行駛，使甲順利搶到丙的包，而且在甲奪取丙的包之後，乙又將甲送往目的地，這表明乙主觀上有幫助搶奪的故意。在客觀行為上，如果沒有乙駕駛出租車靠近丙的行為，從現實情況看，甲要想搶奪丙的包幾乎不可能。因此乙的行為對法益侵害所起的作用很大。這顯然不是中立的幫助行為，應該以搶奪罪的幫助犯論處。A項正確。 11 相對於上傳淫穢影片的行為人來說，甲公司的行為可謂一種“中立的幫助”；但緩存淫穢影片的行為相當於 “陳列”淫穢影片.陳列行為本身就屬於傳播淫穢物品的正犯行為。故對甲公司以傳播淫穢物品罪的正犯論處 。B項正確。 此項的情形為針對不特定的正犯實施幫助行為，所謂針對不特定的正犯實施幫助行為是就事前幫助行為而言 。當正犯著手實行犯罪時，行為人就是針對特定的人實施幫助行為。只不過行為人不一定知道正犯的姓名及正犯的人數多少。對於非特定的幫助行為，如果行為人所提供的設備、方法等只能或通常用於犯罪的情形 ，只要事後查明幫助行為促進了正犯結果，並且對該結果具有故意，就應認定為幫助犯。如行為人出售用於竊電的設備，該設備沒有其他用途，出售者構成盜竊罪的幫助犯。甲公司提供免費下載工具具有正常用途 ，故正犯利用其犯罪的，甲公司不成立幫助犯。C項正確。 乙作為農資公司經理，出賣劇毒農藥屬於公司經營業務。在甲向乙購買劇毒農藥時，並沒有告知乙是用來實施犯罪行為，乙對甲實施犯罪缺乏明確認識，因而不構成故意殺人罪的幫助犯。D項錯誤。"}, {"id": "卷一-29", "subject": "卷一", "type": "單選題", "question": "下列關於減刑說法錯誤的是？（　）", "options": [{"key": "A", "text": "甲因實施綁架罪，犯罪情節極其嚴重，社會影響惡劣，法院對其判處死緩，並決定對其限制減刑。七年後 ，因甲在監獄內完成重大技術革新，法院裁定將甲的刑期減為有期徒刑25年"}, {"key": "B", "text": "甲因對15歲女孩實施姦淫行為，並將其殺害，被判處死緩。死刑緩期兩年期滿後，甲被減為無期徒刑並同時被限制減刑"}, {"key": "C", "text": "甲因貪污罪被判處有期徒刑十年，並處沒收全部財產。甲在被判沒收財產前，提前轉移部分財產，其中有贓款贓物。後甲在服刑期間，表現良好，具有立功表現，可以對其適用減刑"}, {"key": "D", "text": "《刑法》第七十八條第二款規定：“減刑以後實際執行的刑期，判處管制、拘役、有期徒刑的，不能少於原判刑期的二分之一；判處無期徒刑的，不能少於十三年。”其中“實際執行的刑期”應是判決發生法律效力並交付執行後，罪犯實際服刑改造的刑期，不包括先前羈押期限折抵的刑期"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《最高人民法院關於辦理減刑、假釋案件具體應用法律的規定》第13條規定，被限制減刑的死刑緩期執行罪犯，減為無期徒刑後，符合減刑條件的，執行五年以上方可減刑。減刑間隔時間和減刑幅度依照本規定第十一條的規定執行。據此，限制減刑不等於不能減刑。若滿足減刑的實質條件仍有可能減刑 ，只是有所限制。本項中，甲雖然被限制減刑，但其在服刑期間完成重大技術革新，符合減刑條件，仍可以對其適用減刑。A項正確。 根據《最高法關於死刑緩期執行限制減刑案件審理程序若干問題的規定》第1條，對被判處死刑緩期執行的累犯以及因故意殺人、強姦、搶劫、綁架、放火、爆炸、投放危險物質或者有組織暴力性犯罪被判處死刑緩期執行的犯罪分子，人民法院根據犯罪情節等情況可以同時決定對其限制減刑。這裡的“限制減刑”是在判處死緩時，同時決定的，而不能在死緩考驗期結束後被減為無期徒刑時決定。所以甲在被減為無期徒刑時，才被同時限制減刑是錯誤的。B項錯誤。 根據《最高人民法院關於辦理減刑、假釋案件具體應用法律的規定》第3條第2款，對職務犯罪、破壞金融管理秩序和金融詐騙犯罪、組織(領導、參加、包庇、縱容)黑社會性質組織犯罪等罪犯，不積極退贓、協助追繳贓款贓物、賠償損失，或者服刑期間利用個人影響力和社會關係等不正當手段意圖獲得減刑、假釋的，不得假釋，原則上也不得適用減刑，除非有立功表現。所以，儘管甲之前有不積極退贓行為，但其在服刑期間具有立功表現，仍有可以對其使用減刑。C項正確。 先前羈押期限折抵的刑期根本不是實際執行的刑罰，且無期徒刑沒有折抵刑期的問題。再者減刑的根據是受刑人在刑罰執行期間的悔改表現及立功表現.將先前羈押期限折抵的刑期包括在實際執行的刑期中，並不合適 。《刑法》在表述第七十八條第二款中的“減刑以後實際執行的刑期二時，特定使用“實際”二字，也為了排除先前羈押期限折抵的刑期。因此“實際執行的刑期”不包括先前羈押期限折抵的刑期。D項正確。"}, {"id": "卷一-30", "subject": "卷一", "type": "單選題", "question": "下列說法正確的是：（　）", "options": [{"key": "A", "text": "甲獵捕熊貓，遇到森林警察，便將警察打成輕微傷，其行為構成危害珍貴、瀕危野生動物罪和襲警罪，應當從一重罪論處專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 12"}, {"key": "B", "text": "乙向公安機關或相關人員聲稱：“如果不解決我的問題，我就在超市安放炸彈。”這種行為構成編造虛假的恐怖信息罪"}, {"key": "C", "text": "丙冒充省長騙取數額巨大財物，其構成招搖撞騙罪和詐騙罪，應當從一重罪處罰"}, {"key": "D", "text": "受國家機關委託代表國家機關行使疫情防控職權的組織中從事公務的人員，由於沒有正式編製，因此行為人暴力抗拒強制隔離、隔離治療等措施的行為，不構成妨害公務罪"}], "answer": ["C"], "explanation_full": "【羿文解析】《刑法修正案（十一）》增加了襲警罪：“暴力襲擊正在依法執行職務的人民警察的，處3年以下有期徒刑、拘役或者管制；使用槍支、管制刀具，或者以駕駛機動車撞擊等手段，嚴重危及其人身安全的 ，處3年以上7年以下有期徒刑。”A項錯誤，應當數罪並罰，而非從一重罪。 乙的行為沒有威脅任何法益，不構成犯罪。B項錯誤。 冒充國家機關工作人員的身份騙取數額較大財物時，擇一重罪處罰。C項正確。 兩高兩部《關於依法懲治妨害新型冠狀病毒感染肺炎疫情防控違法犯罪的意見》規定，以暴力、威脅方法阻礙國家機關工作人員（含在依照法律、法規規定行使國家有關疫情防控行政管理職權的組織中從事公務的人員，在受國家機關委託代表國家機關行使疫情防控職權的組織中從事公務的人員，雖未列入國家機關人員編製但在國家機關中從事疫情防控公務的人員）依法履行為防控疫情而採取的防疫、檢疫、強制隔離、隔離治療等措施的，依照《刑法》第277條第1款、第3款的規定，以妨害公務罪定罪處罰。暴力襲擊正在依法執行職務的人民警察的，以妨害公務罪定罪，從重處罰。D項錯誤。"}, {"id": "卷一-31", "subject": "卷一", "type": "單選題", "question": "關於破壞交通工具罪、破壞交通設施罪，下列說法正確的有（　）", "options": [{"key": "A", "text": "甲破壞王某的電動自行車（電瓶車）、人力三輪車，均構成破壞交通工具罪"}, {"key": "B", "text": "乙在地下停車庫破壞王某的小轎車的剎車系統，在王某駕駛之前，乙後悔，又修好。乙構成破壞交通工具罪的既遂"}, {"key": "C", "text": "某高速公路中間隔離帶是3米寬的花草，花草中間豎著柵欄。丙盜竊該柵欄，變賣所得5000元。丙構成破壞交通設施罪"}, {"key": "D", "text": "丁欲用導彈轟炸某軍用機場，由於一時疏忽，認錯地圖，實際轟炸了民用機場。丁觸犯破壞軍用設施罪的未遂和破壞交通設施罪的既遂，想象競合，擇一重罪論處"}], "answer": ["D"], "explanation_full": "【羿文解析】破壞交通工具罪，是指故意破壞火車、汽車、電車、船隻、航空器，足以使其發生傾覆、毀壞危險的行為。也即，成立破壞交通工具罪，要求對道路公共安全產生具體危險。考試考過的“大型拖拉機 ”應包含在“汽車”中，摩托車應包含在“汽車”中，“纜車”應包含在“電車”中，電動自行車(電瓶車 )應包含在“電車”中。這些都是擴大解釋。破壞這些交通工具，構成破壞交通工具罪。人力三輪車、馬車、 自行車不屬於電車或汽車。破壞它們也不足以危害公共安全。因此，破壞這些交通工具不構成破壞交通工具罪。A項錯誤。 破壞交通工具罪是危害公共安全的犯罪。造成公共安全的具體危險，是犯罪的成立條件。造成損害結果也即發生傾覆、毀壞，是犯罪的既遂條件。在實害結果發生前主動消除危險，防止結果發生，可成立犯罪中止。 B項錯誤。 盜竊這種財物，首先構成盜竊罪，其次不足以危害道路的公共安全，因此不構成破壞交通設施罪。C項錯誤。 這屬於抽象的事實認識錯誤中的對象錯誤，可以進行兩次三段論推理，然後想象競合處理。丁觸犯破壞軍用設施罪的未遂和破壞交通設施罪的既遂，想象競合，擇一重罪論處。之所以定破壞軍用設施罪未遂，而非犯罪預備，主要是因為發射導彈進行轟炸，因一時搞錯對象，但對預定目標仍具有現實緊迫危險。這與埋伏在半路上殺人、預定目標不在現場的案件有所不同。D項正確。"}, {"id": "卷一-32", "subject": "卷一", "type": "單選題", "question": "甲告訴國有公司出納會計乙，讓乙借給甲300萬元用於炒股，事後可以盈利200萬元，甲乙二人一人100萬元，並告訴乙兩個月後歸還。於是乙從公司賬戶中挪用300萬元給甲，甲將其中100萬元用於炒股，200萬元用於購買自住房，兩個月後歸還300萬元，甲乙各自挪用公款多少？", "options": [{"key": "A", "text": "甲乙均300萬專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 13"}, {"key": "B", "text": "甲100萬，乙300萬"}, {"key": "C", "text": "甲300萬，乙100萬"}, {"key": "D", "text": "甲乙均100萬"}], "answer": ["D"], "explanation_full": "【羿文解析】挪用公款罪的用途方式有三種：一是挪用公款進行非法活動（3萬元以上）；二是挪用公款數額較大（5萬元以上）、進行營利活動；三是挪用公款進行其他活動，數額較大（5萬元以上），挪用時間超過了3個月未還。 挪用公款罪的法益侵害性表現在使公款脫離單位控制，處於流失（不能歸還）的危險之中。挪用公款的不同用途表明危險程度的不同。本案中，雖然乙以為是挪用300萬元公款用於營利活動，但是實際上只有100萬元進行了營利活動，甲乙二人均應當對進行100萬元的營利活動承擔責任，但是挪用其中200萬元進行其他活動 ，三個月內歸還的行為不符合挪用公款罪的犯罪構成，故甲乙二人不對用於其他活動的200萬元承擔刑事責任 ，故甲乙挪用公款罪的數額為100萬元。故本題正確答案為D選項。"}, {"id": "卷一-33", "subject": "卷一", "type": "單選題", "question": "下列說法正確的是哪一項？（　）", "options": [{"key": "A", "text": "甲男在火車站台上看到一剛下車帶著三個小孩的旅客乙女，旁邊放著行李，便上去詢問是否需要雇人扛行李。兩人商定後，由甲男扛行李，乙女支付費用。甲男扛著行李出站時，乙女被攔下查票。甲男在出站口時 ，明知乙女正在關注著自己，仍將行李扛走。甲男構成侵占罪"}, {"key": "B", "text": "張某從窗戶潛入劉某家中企圖竊取財物。劉某聽見房內有響聲，於是便打開房門，見張某正在翻箱行竊 ，劉某考慮自己年邁體弱，未採取其他措施.只是央求張某別拿走東西。張某初感驚慌，當意識到劉某家無鄰居，劉某年老體弱，不會把他怎樣後，對劉某的央求毫不理睬，旁若無人繼續翻箱倒櫃，最後拿走人民幣 2000余元。若支持公開盜竊說，張某則成立盜竊罪"}, {"key": "C", "text": "甲在餐廳用餐時，將提包放在座位上，付款時忘記拿提包，乙趁甲去付款時將甲的提包拿走。乙的行為構成侵占罪"}, {"key": "D", "text": "個體戶甲雇請乙為其經營、看管摩托車廠，平時的經營一般由乙負責，甲負責每日晚上收取當日的營業收益。某日摩托車廠收益特別好，乙於下午攜本日的收益5萬元潛逃。乙構成侵占罪"}], "answer": ["B"], "explanation_full": "【羿文解析】乙並沒有將行李處分給甲占有的行為與意識；甲身扛行李時，只是乙的占有輔助者。換言之 ，即使甲身扛行李，該行李的占有者仍然是乙。所以.甲的行為不可能成立侵占罪。A項錯誤。 我國刑法學通說的持有者一般都認為，盜竊罪是指秘密竊取公私財物的行為，搶奪罪是指公然奪取公私財物的行為。盜竊罪具有秘密性是其區別於其他財產犯罪的基本特徵。有觀點認為，盜竊可以採用公開的方式進行，即公開盜竊說。該說認為，盜竊罪的本質特徵在於行為人以平和的方式取走被害人的財物。根據這種觀點，張某的行為成立盜竊罪。B項正確。 對於明顯屬於他人支配、管理的財物，即使他人短暫遺忘或短暫離開，但只要財物處於他人支配力範圍內 ，只要他人可以沒有阻礙地取回財物，也應該認定他人占有財物。該選項中，仍應該認為甲占有自己的提包 ，乙應該成立盜竊罪。C項錯誤。 在具有類似於店主和店員這種上下主從關係的場合，通常僅承認上位者的占有，下位者取得財物應該構成盜竊罪。乙的占有僅僅屬於輔助性占有，並未獨立占有店內的財物，故乙成立盜竊罪。D項錯誤。"}, {"id": "卷一-34", "subject": "卷一", "type": "單選題", "question": "下列說法正確的是哪一項？（　）", "options": [{"key": "A", "text": "國家工作人員乙要為某國有事業單位購買50台電腦，與商店店主甲商談。甲既不想降低價格，但又希望乙能購買本商店的電腦，於是便向乙支付了回扣。甲是為了謀取正當利益才給付回扣。不構成行賄罪"}, {"key": "B", "text": "請託人乙在國家工作人員甲不知情的情況下，將價值10萬元的購物卡放置在其家中的沙發墊下，6個月後 ，甲在清理沙發時發現購物卡.並立即上交。甲不成立受賄罪"}, {"key": "C", "text": "某市園林管理處系國有事業單位，方某系園林管理處副主任.分管綠化建設、養護等工程的方案、招投標、 14 方某12萬元報酬。此後，方某並未實際參與該園林有限公司的任何工作。該公司給付方某的12萬元屬於勞動報酬，故方某不構成受賄罪"}, {"key": "D", "text": "國家工作人員甲之前幫助過乙辦過事情。某日，甲以索取賄賂的意思向乙借錢.借款金額為100萬元。乙以為甲確實缺錢，在向自己借錢，便同意將錢借給甲，還要求甲打了欠條。借款到期後，甲沒有歸還欠款的意思，乙態度曖昧且明知借款已到期卻仍未對借款進行催討。甲不構成受賄罪"}], "answer": ["B"], "explanation_full": "【羿文解析】在乙不購買甲店內的電腦，仍可以以更低的價格在其他店買到電腦的情況下，甲使乙以較高的價格購買電腦，實質上就是一種不正當利益，應認定為行賄罪。A項錯誤。 請託人在國家工作人員不知情的情況下，暗地裡將財物置於國家工作人員支配的場所，國家工作人員將財物退還和上交的，不構成受賄罪。B項正確。 方某身為園林管理處分管綠化建設、養護工程的副主任，具有綠地建設工程驗收、考核參與權、後續綠化養護工程的組織管理權。行賄人正是看重其上述職權才以所謂勞務報酬名義給予其財物的。具有行賄受賄的動機。方某收取的遠遠超出正常標準的所謂報酬數額本身也充分反映出其性質不是勞務報酬。方某與行賄人之間是借勞務聘用名義，行賄賂之實，方某的行為構成受賄罪。C項錯誤。 由於曾受到國家工作人員甲的照顧，出借方乙對是否催討借款態度暖昧，是否歸還錢款取決於國家工作人員 。該筆借款應被視為權錢交易的產物，甲不歸還欠款的行為應視為受賄罪。質言之，甲主觀上認為100萬元就是其權力行為的對價，這是權錢交易，應認定為受賄罪。D項錯誤。"}, {"id": "卷一-35", "subject": "卷一", "type": "單選題", "question": "下列說法正確的是哪一項？（　）", "options": [{"key": "A", "text": "某小學董事長王某以該校資金緊張為由，向張某提出想從張某所在的村委會貸款200萬元，月息為"}], "answer": null, "explanation_full": null}, {"id": "卷一-0", "subject": "卷一", "type": "單選題", "question": "8％，張某在與村委會其他成員商議後一致同意的情況下，安排村委會出納柴某將村裡的徵地補償款共 210萬元借給該小學使用，約定月利息為0.8％。案發時仍有111.5萬元尚未歸還。張某不構成挪用公款罪", "options": [{"key": "B", "text": "乙向國有公司會計甲謊稱借用公司100萬元用於購房首付，3個月後歸還。實際乙並沒有歸還的意思，得到 100萬後乙立馬逃之夭天。乙構成詐騙罪，甲因受騙不構成挪用公款罪"}, {"key": "C", "text": "甲挪用公款10萬元用於其他活動，發覺犯罪事實將要暴露，為了逃避法律追究而潛逃，甲構成挪用公款罪"}, {"key": "D", "text": "白某身為國有企業負責人，利用職務之便以打白條的形式從單位借款39萬元.其最初在主觀上準備以後歸還 。後為應付上級檢查，白某虛開發票8張，並作了一套假賬，掩蓋了借款事實，將所借公款予以衝減，並將該賬簿一直沿用至今長達三年，至案發白某仍未歸還所借的39萬元。白某構成挪用公款罪"}], "answer": ["A"], "explanation_full": "【羿文解析】根據《刑法》第384條的規定，成立挪用公款罪的客觀行為有三種，即國家工作人員利用職務上的便利，挪用公款歸個人使用，進行非法活動的：或者挪用公款數額較大、進行營利活動的；或者挪用公款數額較大、超過三個月未還的。張某將公款借給學校，既不是“以個人名義將公款挪給他人使用”，也不是 “個人決定以單位名義將公款供其他單位使用，謀取個人利益”，所以張某借出公款給該小學使用的行為不符合立法解釋規定的挪用公款“歸個人使用”，因此不構成挪用公款罪。A項正確。 挪用公款給他人使用，使用人具有詐騙的故意時，不影響國家工作人員成立挪用公款罪。甲仍應成立挪用公款罪。B項錯誤。 《最高人民法院關於審理挪用公款案件具體應用法律若干問題的解釋》第6條規定，攜帶挪用的公款潛逃的依照《刑法》第382條，第383條的規定定罪處罰。也就是按照貪污罪定罪處罰。C項錯誤。 白某挪用公款後採用虛假發票平賬，其所挪用的公款已難以在單位財務賬目上反映出來，且該款項至今未還 ，由此可認定白某已具有非法占有公款的目的，應以貪污罪定罪處罰。D項錯誤。"}, {"id": "卷一-36", "subject": "卷一", "type": "單選題", "question": "下列關於刑事訴訟程序的表述，正確的是？（　）", "options": [{"key": "A", "text": "只有法院可以適用裁定"}, {"key": "B", "text": "對任何裁定，都可以通過上訴或者抗訴的方式進行救濟"}, {"key": "C", "text": "對法院作出的犯罪嫌疑人逃匿案件違法所得的沒收裁定，不能通過上訴或者抗訴的方式救濟"}, {"key": "D", "text": "精神病強制醫療程序的審限，參照公訴案件第一審普通程序和第二審普通程序的審限執行專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 15"}], "answer": ["A"], "explanation_full": "【羿文解析】判決和裁定都專屬於法院適用，A項正確。 對執行階段的裁定不能通過上訴、抗訴的方式進行救濟，譬如對減刑、假釋裁定，不能上訴、抗訴，B項錯誤 。 《刑訴法》第300條規定：“人民法院經審理，對經查證屬於違法所得及其他涉案財產，除依法返還被害人的以外，應當裁定予以沒收；對不屬於應當追繳的財產的，應當裁定駁回申請，解除查封、扣押、凍結措施。 對於人民法院依照前款規定作出的裁定，犯罪嫌疑人、被告人的近親屬和其他利害關係人或者人民檢察院可以提出上訴、抗訴。”C項錯誤。 《刑訴法》第305條規定：“人民法院經審理，對於被申請人或者被告人符合強制醫療條件的，應當在一個月以內作出強制醫療的決定。被決定強制醫療的人、被害人及其法定代理人、近親屬對強制醫療決定不服的 ，可以向上一級人民法院申請復議。”D項錯誤。"}, {"id": "卷一-37", "subject": "卷一", "type": "單選題", "question": "孫某某因不滿醫生楊某對其母親的治療，懷恨在心、意圖報復。12月24日6時許，孫某某在急診搶救室內 ，持事先準備的尖刀反覆切割、扎刺值班醫生楊某頸部，致楊某死亡。孫某某作案後報警投案，被公安機關抓獲。關於本案中孫某某的救濟性權利，下列表述正確的是：（　）", "options": [{"key": "A", "text": "對偵■人員侵犯訴訟權利和人身侮辱的行為，有權提出控告"}, {"key": "B", "text": "對一審未生效的判決有權請求人民檢察院向上一級人民法院抗訴"}, {"key": "C", "text": "對檢察院作■的存疑不起訴決定，有權向該人民檢察院申訴"}, {"key": "D", "text": "在法庭審理階段有權作最後陳述"}], "answer": ["A"], "explanation_full": "【羿文解析】刑事訴訟中犯罪嫌疑人、被告人享有廣泛的訴訟權利。這些訴訟權利按其性質和作用的不同 ，可分為防禦性權利和救濟性權利。 救濟性權利主要包括：①申請復議權。對駁回申請迴避的決定，有權申請復議。②控告權。對審判人員、檢察人員和偵查人員侵犯公民訴訟權利和人身侮辱的行為，有權提出控告。③申請變更強制措施權。④申訴權 。一是對檢察院作出的酌定不起訴決定，有權向人民檢察院申訴；二是對已經發生法律效力的判決、裁定 ，有權向人民法院、人民檢察院提出申訴。⑤上訴權。對一審未生效的裁判有權向上一級人民法院上訴。 防禦性權利主要有：①有權使用本民族語言文字進行訴訟。②有權自行或在辯護人協助下獲得辯護；有權在法定條件下獲得法院為其指定的辯護人的法律幫助；有權拒絕辯護人繼續為其辯護，也有權另行委託辯護人辯護。③有權拒絕回答偵查人員提出的與本案無關的問題。④在偵查機關第一次訊問或者採取強制措施之日起，有權聘請律師提供法律咨詢、代理申訴和控告，代為申請取保候審等。⑤有權在開庭前10日收到起訴書副本。⑥有權參加法庭調查，就指控事實發表陳述，對證人、鑒定人發問，辨認、鑒別物證，聽取未到庭的證人的證言筆錄、鑒定人的鑒定結論、勘驗檢查筆錄和其他證據文書，並就上述書面證據發表意見；有權申請通知新的證人到庭，調取新的物證，申請重新鑒定或者勘驗。⑦有權參加法庭辯論，對證據和案件情況發表意見並且可以互相辯論。⑧有權向法庭作最後陳述。⑨自訴案件的被告人有權對自訴人提出反訴，等等。 根據《刑事訴訟法》第14條的規定，人民法院、人民檢察院和公安機關應當保障犯罪嫌疑人、被告人和其他訴訟參與人依法享有的辯護權和其他訴訟權利。訴訟參與人對於審判人員、檢察人員和偵查人員侵犯公民訴訟權利和人身侮辱的行為，有權提出控告。選項A正確。 根據《刑事訴訟法》第227條的規定，被告人、自訴人和他們的法定代理人，不服地方各級人民法院第一審的判決、裁定，有權用書狀或者口頭向上一級人民法院上訴。被告人的辯護人和近親屬，經被告人同意，可以提出上訴。附帶民事訴訟的當事人和他們的法定代理人，可以對地方各級人民法院第一審的判決、裁定中的附帶民事訴訟部分，提出上訴。對被告人的上訴權，不得以任何藉口加以剝奪。可知，被告人對一審未生效的判決不服，可以提出上訴，而不是請求檢察院抗訴。選項B錯誤。 根據《刑事訴訟法》第181條的規定，對於人民檢察院依照《刑事訴訟法》第177條第2款規定作出的不起訴決定，被不起訴人如果不服，可以自收到決定書後7日以內向人民檢察院申訴。人民檢察院應當作出複查決定 ，通知被不起訴的人，同時抄送公安機關。可知，被不起訴人只能對酌定不起訴向原檢察院申訴。選項C說的並不是酌定不起訴而是存疑不起訴。選項C錯誤。 16 最後陳述權的確是被告人享有的一項訴訟權利，但是此項權利並不屬於救濟性權利，而是屬於防禦性權利。 選項D錯誤。"}, {"id": "卷一-38", "subject": "卷一", "type": "單選題", "question": "下列關於值班律師的表述，正確的是：（　）", "options": [{"key": "A", "text": "偵查階段，值班律師可以為犯罪嫌疑人申請取保候審"}, {"key": "B", "text": "審■起訴階段，值班律師對犯罪嫌疑人認罪認罰自願性有異議的，則無需在具結書上簽名"}, {"key": "C", "text": "在不同訴訟階段，不能均由值班律師提供法律幫助"}, {"key": "D", "text": "前一訴訟程序犯罪嫌疑人、被告人明確拒絕值班律師法律幫助的，後一訴訟程序的辦案機關無需再告知其有權獲得值班律師法律幫助的權利"}], "answer": ["A"], "explanation_full": "【羿文解析】根據《法律援助值班律師工作辦法》第6條的規定，值班律師依法提供以下法律幫助：①提供法律咨詢；②提供程序選擇建議；③幫助犯罪嫌疑人、被告人申請變更強制措施；④對案件處理提出意見 ；⑤幫助犯罪嫌疑人、被告人及其近親屬申請法律援助；⑥法律法規規定的其他事項。值班律師在認罪認罰案件中，還應當提供以下法律幫助：①向犯罪嫌疑人、被告人釋明認罪認罰的性質和法律規定；②對人民檢察院指控罪名、量刑建議、訴訟程序適用等事項提出意見；③犯罪嫌疑人簽署認罪認罰具結書時在場。值班律師辦理案件時，可以應犯罪嫌疑人、被告人的約見進行會見，也可以經辦案機關允許主動會見；自人民檢察院對案件審查起訴之日起可以查閱案卷材料、了解案情。根據該條文第1款第3項的規定，選項A正確。 根據《法律援助值班律師工作辦法》第10條的規定，犯罪嫌疑人簽署認罪認罰具結書時，值班律師對犯罪嫌疑人認罪認罰自願性、人民檢察院量刑建議、程序適用等均無異議的，應當在具結書上簽名，同時留存一份複印件歸檔。值班律師對人民檢察院量刑建議、程序適用有異議的，在確認犯罪嫌疑人系自願認罪認罰後 ，應當在具結書上簽字，同時可以向人民檢察院提出法律意見。犯罪嫌疑人拒絕值班律師幫助的，值班律師無需在具結書上簽字，應當將犯罪嫌疑人簽字拒絕法律幫助的書面材料留存一份歸檔。可知，值班律師對人民檢察院量刑建議、程序適用有異議的，在確認犯罪嫌疑人系自願認罪認罰後，應當在具結書上簽字，同時可以向人民檢察院提出法律意見。選項B錯誤。 根據《法律援助值班律師工作辦法》第11條的規定，對於被羈押的犯罪嫌疑人、被告人，在不同訴訟階段 ，可以由派駐看守所的同一值班律師提供法律幫助。對於未被羈押的犯罪嫌疑人、被告人，前一訴訟階段的值班律師可以在後續訴訟階段繼續為犯罪嫌疑人、被告人提供法律幫助。選項C錯誤。 根據《法律援助值班律師工作辦法》第15條的規定，依法應當通知值班律師提供法律幫助而犯罪嫌疑人、被告人明確拒絕的，公安機關、人民檢察院、人民法院應當記錄在案。前一訴訟程序犯罪嫌疑人、被告人明確拒絕值班律師法律幫助的，後一訴訟程序的辦案機關仍需告知其有權獲得值班律師法律幫助的權利，有關情況應當記錄在案。選項D錯誤。"}, {"id": "卷一-39", "subject": "卷一", "type": "單選題", "question": "甲因盜竊罪被某縣法院判處有期徒刑1年，緩期1年執行。甲未上訴，檢察院也沒有抗訴，判決生效後，甲由某縣某鎮司法所執行社區矯正。下列表述正確的有：（　）", "options": [{"key": "A", "text": "若甲無正當理由.未經批准赴外地旅遊.某縣法院可以決定對甲使用電子定位裝置"}, {"key": "B", "text": "若對甲使用電子定位裝置，使用期限不得超過6個月"}, {"key": "C", "text": "若甲在社區矯正期間表現良好.符合減刑條件，社區矯正機構應當向某縣法院提出減刑建議"}, {"key": "D", "text": "社區矯正期間，非依法律規定，不得限制甲的人身自由"}], "answer": ["D"], "explanation_full": "【羿文解析】社區矯正對象無正當理由，未經批准離開所居住的市、縣的，經縣級司法行政部門負責人批准 ，可以使用電子定位裝置。可見，使用電子定位裝置的決定機關是縣級司法行政部門，A項錯誤。 使用電子定位裝置的期限不得超過3個月。對於仍有必要繼續使用的，經過批准，期限可以延長，每次不得超過3個月。B項錯誤。 社區矯正對象符合減刑條件的，社區矯正機構應當向社區矯正執行地的中級以上人民法院提出減刑建議。C項錯誤。 17 ，人身自由不被限制或者剝奪。D項正確。"}, {"id": "卷一-40", "subject": "卷一", "type": "單選題", "question": "根據我國刑事證據排除規則，下列哪一選項中所表述的證據不應當直接被排除？", "options": [{"key": "A", "text": "未經個別詢問而獲得的證人證言"}, {"key": "B", "text": "根據犯罪嫌疑人被毆打後所作的供述找到的凶器"}, {"key": "C", "text": "沒有經過被害人核對確認的被害人陳述"}, {"key": "D", "text": "依據明顯違反規定的鑒定程序而作出的鑒定意見"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《刑訴解釋》第89條的規定，“證人證言具有下列情形之一的，不得作為定案的根據：(一 )詢問證人沒有個別進行的；(二)書面證言沒有經證人核對確認的……”A項中的證人證言應當直接被排除。 《刑訴解釋》第92條規定，對被害人陳述的審查與認定，參照證人證言的有關規定。因此，對於沒有經過被害人核對確認的被害人陳述應當直接被排除。 根據《刑訴解釋》第98條的規定，“鑒定意見具有下列情形之一的，不得作為定案的根據：……(五)鑒定程序違反規定的……”因此，對於D項中的“依據明顯違反規定的鑒定程序而做出的鑒定意見”應當直接被排除 。 因為根據《刑訴解釋》第86條第3款的規定，物證、書證的來源、收集程序有疑問，不能作出合理解釋的，不得作為定案的根據。因此，對於B項中的物證(“凶器”)可以經過補正程序後作為定案依據，故不應當直接被排除。"}, {"id": "卷一-41", "subject": "卷一", "type": "單選題", "question": "劉某涉嫌故意傷害罪，訴訟中，劉某認罪認罰，下列說法正確的是：（　）", "options": [{"key": "A", "text": "如果被害人不同意適用速裁程序，法院依然可以決定適用該程序"}, {"key": "B", "text": "劉某未與被害人就附帶民事訴訟賠償達成調解或和解協議，不影響法院適用速裁程序"}, {"key": "C", "text": "法院如果適用速裁程序，應當在受理後20日以內審結"}, {"key": "D", "text": "人民法院在審理過程中，被告人否認指控的犯罪事實的，應當按照簡易程序重新審理"}], "answer": ["A"], "explanation_full": "【羿文解析】根據《刑事訴訟法》第222條第1款的規定，基層人民法院管轄的可能判處3年有期徒刑以下刑罰的案件，案件事實清楚，證據確實、充分，被告人認罪認罰並同意適用速裁程序的，可以適用速裁程序，由審判員1人獨任審判。可知，速裁程序的適用需要被告人同意而非被害人同意。選項A正確。 根據《刑事訴訟法》第223條的規定，有下列情形之一的，不適用速裁程序：①被告人是盲、聾、啞人，或者是尚未完全喪失辨認或者控制自己行為能力的精神病人的；②被告人是未成年人的：③案件有重大社會影響的；④共同犯罪案件中部分被告人對指控的犯罪事實、罪名、量刑建議或者適用速裁程序有異議的；⑤被告人與被害人或者其法定代理人沒有就附帶民事訴訟賠償等事項達成調解或者和解協議的；⑥其他不宜適用速裁程序審理的。本案由於劉某未與被害人就附帶民事訴訟賠償達成調解或者和解協議，所以不能適用速裁程序。選項B錯誤。 根據《刑事訴訟法》第225條的規定，適用速裁程序審理案件，人民法院應當在受理後10日以內審結；對可能判處的有期徒刑超過1年的，可以延長至15日。選項C錯誤。 根據《刑事訴訟法》第226條的規定，人民法院在審理過程中，發現有被告人的行為不構成犯罪或者不應當追究其刑事責任、被告人違背意願認罪認罰、被告人否認指控的犯罪事實或者其他不宜適用速裁程序審理的情形的，應當按照本章第一節或者第三節的規定重新審理。又根據《刑訴解釋》第368條的規定，適用簡易程序審理案件，在法庭審理過程中，有下列情形之一的，應當轉為普通程序審理：①被告人的行為可能不構成犯罪的；②被告人可能不負刑事責任的；③被告人當庭對起訴指控的犯罪事實予以否認的；④案件事實不清、 證據不足的；⑤不應當或者不宜適用簡易程序的其他情形。決定轉為普通程序審理的案件，審理期限應當從作出決定之日起計算。可知，本案也不能適用簡易程序審理，應當轉為普通程序。選項D錯誤。"}, {"id": "卷一-42", "subject": "卷一", "type": "單選題", "question": "下列關於刑事速裁程序和簡易程序說法正確的是：", "options": [{"key": "A", "text": "刑事速裁程序是簡易程序的一種特殊規定，都適用於案件事實清楚、證據充分的案件專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 18"}, {"key": "B", "text": "都不適用於被告人是盲、聾、啞人，或者是尚未完全喪失辨認或者控制自己行為能力的精神病人的案例"}, {"key": "C", "text": "都只能是由審判員一人獨任審判"}, {"key": "D", "text": "都是人民法院應當在受理後10日以內審結"}], "answer": ["B"], "explanation_full": "【羿文解析】簡易程序與速裁程序的共同點有：(1)簡易程序與速裁程序審判適用條件部分相同：①案件事實清楚、證據充分的；②被告人承認自己所犯罪行，對指控的犯罪事實沒有異議的。(2)簡易程序與速裁程序審判不適用條件部分相同：①被告人是盲、聾、啞人，或者是尚未完全喪失辨認或者控制自己行為能力的精神病人的；②有重大社會影響的；③共同犯罪案件中部分被告人不認罪的。(3)適用簡易程序與速裁程序審理案件，對可能判處3年有期徒刑以下刑罰的，可以由審判員一人獨任審判。故A項錯誤，刑事速裁程序不是簡易程序。B項正確。 適用簡易程序審理案件，對可能判處3年有期徒刑以下刑罰的，可以組成合議庭進行審判，也可以由審判員一人獨任審判；對可能判處的有期徒刑超過3年的，應當組成合議庭進行審判。而速裁程序，只能由審判員一人獨任審判。故C項錯誤。 適用簡易程序審理案件，人民法院應當在受理後20日以內審結；對可能判處的有期徒刑超過3年的，可以延長至1個半月。適用速裁程序審理案件，人民法院應當在受理後10曰以內審結：對可能判處的有期徒刑超過1年的，可以延長至15日。故D項錯誤。"}, {"id": "卷一-43", "subject": "卷一", "type": "單選題", "question": "甲因故意傷害乙在某縣法院受審，乙對甲提起附帶民事訴訟並申請法院查封甲一套房產，下列關於附帶民事訴訟財產保全的表述，正確的有：（　）", "options": [{"key": "A", "text": "某縣法院應當要求乙提供擔保，否則不予保全"}, {"key": "B", "text": "對乙的申請，某縣法院應當在48小時內作出是否保全的裁定"}, {"key": "C", "text": "某縣法院裁定保全的，應當立即對甲房產進行查封"}, {"key": "D", "text": "某縣法院裁定保全的，應當在48小時內對甲房產進行查封"}], "answer": ["C"], "explanation_full": "【羿文解析】乙提起附帶民事訴訟後申請法院查封房產，屬於訴中財產保全。某縣法院可以視情況要求乙提供擔保，不是“應當”要求，A項錯誤。 對於訴中財產保全，某縣法院認為情況緊急的，應當在48小時內作出是否保全的裁定，但若情況不算緊急 ，無需在48小時內作出是否保全的裁定，B項錯誤。 不論訴中財產保全還是訴前財產保全，法院裁定保全的，應當立即開始執行，C項正確，D項錯誤。"}, {"id": "卷一-44", "subject": "卷一", "type": "單選題", "question": "甲涉嫌受賄與濫用職權被某市監察機關立案調查，調查終結後移送某市檢察院審查起訴。檢察院對甲適用取保候審措施，甲趁機逃匿境外，不知去向。下列選項正確的是？（　）", "options": [{"key": "A", "text": "若某市檢察院認為案件事實清楚，向某市中級法院提起公訴，某市中級法院可以對甲的受賄罪與濫用職權罪缺席審判"}, {"key": "B", "text": "某市檢察院必須等甲被抓獲歸案後才能向某市中級法院提起公訴"}, {"key": "C", "text": "若甲在外逃期間死亡，需要追繳其違法所得，可以對甲適用犯罪嫌疑人、被告人逃匿、死亡案件違法所得沒收程序"}, {"key": "D", "text": "若甲逃往境外後，超過半年沒有到案，某市檢察院可以啟動違法所得沒收程序"}], "answer": ["C"], "explanation_full": "【羿文解析】對於貪污賄賂犯罪以及嚴重危害國家安全犯罪、恐怖活動犯罪案件，在符合法定條件時，檢察院可以向法院提起公訴，法院可以缺席審判。本案中，甲涉嫌受賄與濫用職權兩個犯罪。其中，受賄罪可以適用缺席審判程序，而濫用職權罪不適用缺席審判程序。故而A項錯誤。 甲涉嫌受賄罪與濫用職權罪。對於濫用職權罪而言，由於甲已經出逃，存在查不清犯罪事實的可能。對於受賄罪而言，若檢察院認為犯罪事實已經查清，證據確實、充分，依法應當追究刑事責任的，可以向法院提起公訴。因此，某市檢察院可以就受賄罪向某市中級法院提起公訴，由法院依法審判：待甲被抓捕歸案，濫用職權罪查清後，再對甲補充或者追加起訴。是故，B項錯誤。 19 若確認甲已經死亡。依照刑法規定應當追繳其違法所得及其他涉案財產的，某市檢察院可以向某市中級法院提出沒收違法所得的申請，啟動違法所得沒收程序，C項正確。 對於貪污賄賂犯罪、恐怖活動犯罪等重大犯罪案件，犯罪嫌疑人、被告人逃匿，在通緝1年後不能到案，依照刑法規定應當追繳其違法所得及其他涉案財產的，可以適用違法所得沒收程序。本案中，甲逃往境外不足1年 ，且不知道對甲是否已經通緝，此時檢察院還不能向法院申請沒收違法所得的申請，D項錯誤。"}, {"id": "卷一-45", "subject": "卷一", "type": "單選題", "question": "關於審判監督程序，下列哪一選項是錯誤的？", "options": [{"key": "A", "text": "原審法院依照審判監督程序重新審判的案件，應當另行組成合議庭"}, {"key": "B", "text": "對於依照審判監督程序重新審判後可能改判無罪的案件，可中止原判決、裁定的執行"}, {"key": "C", "text": "上級法院指令下級法院再審的，一般應當指令原審法院以外的下級法院審理"}, {"key": "D", "text": "只有當事人及其法定代理人、近親屬才能對已經發生法律效力的裁判提出申訴"}], "answer": ["D"], "explanation_full": "【羿文解析】《高法解釋》第466條規定，原審人民法院審理依照審判監督程序重新審判的案件，應當另行組成合議庭，故A項正確。 《高法解釋》第464條規定：“對決定依照審判監督程序重新審判的案件，人民法院應當製作再審決定書。再審期間不停止原判決、裁定的執行，但被告人可能經再審改判無罪，或者可能經再審減輕原判刑罰而致刑期屆滿的，可以決定中止原判決、裁定的執行，必要時，可以對被告人採取取保候審、監視居住措施。”故B項正確。 《高法解釋》第461條第2款規定：“上級人民法院指令下級人民法院再審的，一般應當指令原審人民法院以外的下級人民法院審理；由原審人民法院審理更有利於查明案件事實、糾正裁判錯誤的，可以指令原審人民法院審理。”故C項正確。 《高法解釋》第451條規定：“當事人及其法定代理人、近親屬對已經發生法律效力的判決、裁定提出申訴的 ，人民法院應當審查處理。案外人認為已經發生法律效力的判決、裁定侵害其合法權益，提出申訴的，人民法院應當審查處理。申訴可以委託律師代為進行。”故D項的表述過於絕對。"}, {"id": "卷一-46", "subject": "卷一", "type": "單選題", "question": "合法行政是行政法的重要原則。下列哪一做法違反了合法行政要求？", "options": [{"key": "A", "text": "行政機關將行政許可權委託給另一行政機關行使"}, {"key": "B", "text": "因大蒜價格上漲銷路看好，某鎮政府鼓勵村民多種大蒜"}, {"key": "C", "text": "某公安局要求申請人承擔行政處罰聽證會的組織費用"}, {"key": "D", "text": "某派出所依據《治安管理處罰法》規定，以自己名義對違法行為人王某作出罰款300元的決定"}], "answer": ["C"], "explanation_full": "【羿文解析】根據《行政許可法》第24條規定“行政機關在其法定職權範圍內，依照法律、法規、規章的規定，可以委託其他行政機關實施行政許可。……”可見行政機關是可以將自己的行政許可權委託給另一行政機關行使的，所以A選項正確。 鎮政府的“鼓勵”行為是一種柔性的行政指導，不具有強制性，也不違反合法行政要求，故B選項正確。 行政法中的聽證程序是法考中常考常新的知識點，主要涉及的是立法聽證、許可聽證、處罰聽證和復議聽證 ，其中許可聽證和處罰聽證考得最為頻繁。在所有這些聽證會中，當事人是無須承擔費用的，該費用應當由組織聽證會的行政機關承擔。因為行政機關在法律授權下主動實施行政管理，享受行政優益權，所以，只要是行政機關的執法活動，如調■取證、聽證程序等，都是由國家公共財政支撐的公務行為，不會收取當事人的費用。如行政機關的查封、扣押、凍結、三檢（檢測、檢驗、檢疫）、鑒定、保管等都是免費的。相反 ，如果行政機關通過調查取證，進而依法作出行政決定，確定當事人應當履行某種義務，而當事人不履行義務，行政機關強制執行的，則原則上收取費用。如強制執行、代履行、非訴執行都是收費的。故C選項錯誤。 根據《治安管理處罰法》第91條規定“治安管理處罰由縣級以上人民政府公安機關決定；其中警告、五百元以下的罰款可以由公安派出所決定。”可見，派■所雖然是公安局的派出機構，一般不具有獨立作出處罰決定的權力，但是基於《治安管理處罰法》的明確授權，派出所可以獨立作出警告、500元以下罰款的處罰決定 20 ，故D選項正確。"}, {"id": "卷一-47", "subject": "卷一", "type": "單選題", "question": "甲在廣場上散布謠言謊報險情，負責巡邏的民警左某現場發現了甲的違法行為，經出示工作證件後，對其口頭傳喚。經過調查，公安局對其作出罰款500元的處罰決定。下列哪個選項是正確的？（　）", "options": [{"key": "A", "text": "口頭傳喚行為違法"}, {"key": "B", "text": "對甲傳喚時間不得超過8小時"}, {"key": "C", "text": "本案應當告知當事人有申請聽證的權利"}, {"key": "D", "text": "本案公安局無權當場作出罰款500元的決定"}], "answer": ["D"], "explanation_full": "【羿文解析】原則上，需要傳喚違反治安管理行為人接受調查的，應當經公安機關辦案部門負責人批准，使用傳喚證傳喚。但是，對現場發現的違反治安管理行為人。警察經出示工作證件，可以口頭傳喚，但應當在詢問筆錄中註明。因為此時如果不口頭傳喚，事後很難找尋到違法嫌疑人。本題交待“現場發現”，對甲可以口頭傳喚，不構成違法。A選項錯誤。 傳喚後詢問查證時間原則上8小時，可能適用拘留的詢問查證的時間不得超過24小時。《治安管理處罰法》第 25條規定：“有下列行為之一的，處五日以上十日以下拘留，可以並處五百元以下罰款；情節較輕的，處五日以下拘留或者五百元以下罰款：（一）散布謠言，謊報險情、疫情、警情或者以其他方法故意擾亂公共秩序的；（二）投放虛假的爆炸性、毒害性、放射性、腐蝕性物質或者傳染病病原體等危險物質擾亂公共秩序的；（三）揚言實施放火、爆炸、投放危險物質擾亂公共秩序的。”因此甲在廣場上散布謠言謊報險情的行為有可能被行政拘留，因此B選項錯誤。 在一般處罰法中，責令停產停業、吊銷許可證或者執照和較大數額罰款等處罰應當聽證。在《治安管理處罰法》中，公安機關作出吊銷許可證以及2000元以上罰款的處罰決定前，應當告知違法行為人有權申請聽證 ，經行為人申請的應及時舉行聽證。本案屬於治安管理處罰，不符合治安管理處罰中應當告知聽證的條件。 所以，C選項錯誤。 當場處罰就是適用簡易程序進行處罰的另外一種表達，適用簡易程序的行政處罰，其調查檢查階段與決定階段在時間上是連續的，在主體上也是統一的。執法人員在當場查明事實之後，無須報送行政機關的負責人 ，而是自己當場作出處罰決定。《治安管理處罰法》第100條：“違反治安管理行為事實清楚，證據確鑿，處警告或者二百元以下罰款的，可以當場作出治安管理處罰決定。”就本題而言，公安機關對甲罰款500元，超過了簡易程序中個人罰款處罰的上限，不可以當場決定。D選項正確。"}, {"id": "卷一-48", "subject": "卷一", "type": "單選題", "question": "某市場監督管理局以涉嫌非法銷售汽車為由扣押甲公司5輛汽車。下列哪一說法是正確的？", "options": [{"key": "A", "text": "市場監督管理局可以委託城管執法局實施扣押"}, {"key": "B", "text": "市場監督管理局扣押汽車的最長期限為60日"}, {"key": "C", "text": "對扣押車輛，市場監督管理局可以委託第三人保管，因保管產生的合理費用由甲公司承擔"}, {"key": "D", "text": "對扣押車輛進行檢測的費用，由甲公司承擔"}], "answer": ["B"], "explanation_full": "【羿文解析】行政強制不得委託實施。根據《行政強制法》第17條第1款規定：“行政強制措施由法律、法規規定的行政機關在法定職權範圍內實施。行政強制措施權不得委託。”市場監督管理局只能自己實施扣押 ，不得委託其他機關實施，故A選項錯誤。 根據《行政強制法》第25條第1款、第2款規定：“查封、扣押的期限不得超過三十日；情況複雜的，經行政機關負責人批准，可以延長，但是延長期限不得超過三十日。法律、行政法規另有規定的除外。延長查封、 扣押的決定應當及時書面告知當事人，並說明理由。”可見，扣押期限最長是30日+30日，即60日。故B選項正確。 21 管，由此產生的保管費用由行政機關承擔。故C選項錯誤。 原則上，行政執法和案件調查過程中所有費用都應當由行政機關承擔，國家公共財政支付。如果行政機關在完成調查取證的基礎上作出生效的行政行為確定了當事人的履行義務，而當事人不予履行義務，行政機關代履行或直接強制執行的，由當事人承擔費用。對扣押車輛進行檢測，屬於案件調查過程中產生的費用，應當由行政機關承擔，故D選項錯誤。"}, {"id": "卷一-49", "subject": "卷一", "type": "單選題", "question": "2018年12月29日，第十三屆全國人大常委會第七次會議表決通過了《中華人民共和國公務員法(修訂草案 )》，習近平主席簽發第20號主席令予以公布。公務員法首次修訂，標誌著我國公務員管理法治化、規範化、 科學化進人新階段，對於建設一支信念堅定、為民服務、勤政務實、敢於擔當、清正廉潔的高素質專業化公務員隊伍意義重大。關於《公務員法》的規定，下列說法哪一選項是正確的？（　）", "options": [{"key": "A", "text": "對公務員的義務、權利和管理的規定，都必須適用本法"}, {"key": "B", "text": "模範遵守社會公德、家庭美德不屬於公務員的基本義務"}, {"key": "C", "text": "公務員擔任的領導職務和職級不可以互相兼任"}, {"key": "D", "text": "被依法列為失信聯合懲戒對象的不得被錄用為公務員"}], "answer": ["D"], "explanation_full": "【羿文解析】《公務員法》第3條規定：“公務員的義務、權利和管理，適用本法。法律對公務員中領導成員的產生、任免、監督以及監察官、法官、檢察官等的義務、權利和管理另有規定的，從其規定。”可見，除了《公務員法》以外，其他的法律也可以規定一部分公務員的權利義務和管理規定。A選項錯誤。 《公務員法》第14條第6項規定：“公務員應履行下列義務：……(六)帶頭踐行社會主義核心價值觀，堅守法治，遵守紀律，恪守職業道德，模範遵守社會公德、家庭美德……”因而B選項內容屬於公務員的基本義務 ，B選項錯誤。 《公務員法》第21條第2款規定：“根據工作需要和領導職務與職級的對應關係，公務員擔任的領導職務和職級可以互相轉任、兼任；符合規定資格條件的，可以晉升領導職務或者職級。”C選項錯誤。 《公務員法》第26條規定：“下列入員不得錄用為公務員：(一)因犯罪受過刑事處罰的；(二)被開除中國共產黨黨籍的；(三)被開除公職的；(四)被依法列為失信聯合懲戒對象的；(五)有法律規定不得錄用為公務員的其他情形的。”此次修法新增了“被開除中共共產黨黨籍”和“被依法列為失信聯合懲戒對象”兩種情形 。D選項正確。"}, {"id": "卷一-50", "subject": "卷一", "type": "單選題", "question": "某市甲區某企業經位於乙區的市建委批准在甲區建設一棟3層的廠房。但在施工過程中，擅自加至5層，市建委以其違法建房為由要求將整棟樓全部拆除，該企業不服向位於丙區的市政府申請復議，市政府經復議後決定責令該企業將超層部分拆除。對此，下列哪一說法正確？（　）", "options": [{"key": "A", "text": "若該企業不服起訴的，應當向該市中級人民法院起訴"}, {"key": "B", "text": "若該企業不服起訴的，可以向該市乙區人民法院起訴"}, {"key": "C", "text": "若該企業不起訴，又不拆除超層部分的，該市建委可以申請甲區人民法院強制執行"}, {"key": "D", "text": "若該企業不起訴，又不拆除超層部分的，該市人民政府可以申請丙區人民法院強制執行"}], "answer": ["A"], "explanation_full": "【羿文解析】市政府作為復議機關改變了原行為，故應當以市政府作為被告起訴。市政府充當被告的情形下 ，受理該訴訟的法院必須是中級人民法院，故選項B錯誤。 本題中的行政行為是拆除房屋，針對的是不動產，故應當由不動產所在地(即甲區)的法院管轄。綜合而言 ，若起訴，本案應由“甲區的中級法院”即市中級人民法院管轄(甲區本身不存在中級法院，負責甲區的中級法院應當是市中級人民法院)。故選項A說法正確。 在復議機關變更原行政行為的情形，若需要申請法院強制執行，必須由復議機關申請，故選項C錯誤。 行政機關申請法院強制執行行政行為的，應當由基層人民法院管轄(這是級別管轄規則)，執行對象是不動產的，由不動產所在地法院管轄(這是地域管轄規則)。因此，本題若申請法院強制執行，應當由市政府向甲區人民法院申請。故選項D錯誤。 22 多項選擇題"}, {"id": "卷一-51", "subject": "卷一", "type": "多選題", "question": "習近平總書記在黨的十九大報告中指出：“科學立法、嚴格執法、公正司法、全民守法深入推進，法治國家、法治政府、法治社會建設相互促進，中國特色社會主義法治體系日益完善。全社會法治觀念明顯增強。 ”依法治國是中國共產黨領導全國各族人民治理國家的基本方略。關於依法治國，下列哪些選項是正確的 ？（　）", "options": [{"key": "A", "text": "依法治國是堅持和發展中國特色社會主義的本質要求和重要保障"}, {"key": "B", "text": "依法治國是實現國家治理體系和治理能力現代化的必然要求"}, {"key": "C", "text": "依法治國的根本目的是約束公民濫用權利，維護社會秩序"}, {"key": "D", "text": "全面推進依法治國的總目標是建設中國特色社會主義法治體系、建設社會主義法治國家"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】根據《決定》，依法治國，是堅持和發展中國特色社會主義的本質要求和重要保障，是實現國家治理體系和治理能力現代化的必然要求，事關我們黨執政興國，事關人民幸福安康，事關黨和國家長治久安。故A、B項正確。 依法治國提出的根本目的是適應經濟社會發展新形式的國家治理，即治國理政方式逐漸轉變為法治。C項錯誤 。 推進全面依法治國，總目標是建設中國特色社會主義法治體系，建設社會主義法治國家。這就是，在中國共產黨領導下，堅持中國特色社會主義制度，貫徹中國特色社會主義法治理論，形成完備的法律規範體系、高效的法治實施體系、嚴密的法治監督體系、有力的法治保障體系，形成完善的黨內法規體系，堅持依法治國 、依法執政、依法行政共同推進.堅持法治國家、法治政府、法治社會一體建設，實現科學立法、嚴格執法、 公正司法、全民守法，促進國家治理體系和治理能力現代化。故D項正確。"}, {"id": "卷一-52", "subject": "卷一", "type": "多選題", "question": "根據《法治社會建設實施綱要（2020—2025）》，關於加強人權司法保障，下列說法正確的是？（　）", "options": [{"key": "A", "text": "通過具體案件辦理，保障人民群眾合法權益"}, {"key": "B", "text": "探索建立消費者權益保護集體訴訟制度"}, {"key": "C", "text": "加強對非法取證行為的源頭預防，嚴格執行非法證據排除規則"}, {"key": "D", "text": "大力推廣運用遠程網絡等法律服務模式"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】根據《法治社會建設實施綱要（2020—2025）》的要求，加強人權司法保障的內容包括：加強對公民合法權益的司法保護。加大涉及民生案件查辦力度，通過具體案件辦理，保障人民群眾合法權益。探索建立消費者權益保護集體訴訟制度。完善律師制度。強化訴訟參與人訴訟權利制度保障，加強對非法取證行為的源頭預防，嚴格執行非法證據排除規則，建立健全案件糾錯機制，有效防範和糾正冤假錯案。健全執行工作長效機制，依法保障勝訴當事人及時實現合法權益。加強檢察機關對民事、行政、刑事訴訟活動的法律監督，維護司法公正。在司法調解、司法聽證等司法活動中保障人民群眾參與。落實人民陪審員制度，完善人民監督員制度。推動大數據、人工智能等科技創新成果同司法工作深度融合，完善“互聯網+訴訟”模式 ，加強訴訟服務設施建設，全面建設集約高效、多元解紛、便民利民、智慧精準、開放互動、交融共享的現代化訴訟服務體系。故ABC項正確。 大力推廣運用遠程網絡等法律服務模式，屬於為群眾提供便捷高效的公共法律服務的內容，不符合題意，故 D選項錯誤。"}, {"id": "卷一-53", "subject": "卷一", "type": "多選題", "question": "習近平法治思想的實踐要求之一是發揮法治在經濟社會發展中的作用，這要求以法治保障生態良好。對此 ，下列哪些選項是正確的？（　）", "options": [{"key": "A", "text": "黨的十八屆四中全會提出必須建立系統完整的生態文明制度體系"}, {"key": "B", "text": "只有實行最嚴格的制度，最嚴密的法治，才能為生態文明建設提供可靠保障"}, {"key": "C", "text": "依法對破壞生態環境的行為予以最嚴厲的制裁，才能遏制住生態環境的持續惡化"}, {"key": "D", "text": "要加大生態環境保護立法執法司法守法力度，提高破壞環境違法犯罪的成本 23"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】黨的十八大描繪了生態文明建設的宏偉藍圖，勾勒出“美麗中國”的美好願景。黨的十八屆三中全會提出要建設生態文明，必須建立系統完整的生態文明制度體系（A項錯誤）。黨的十八屆四中全會要求 ，用嚴格的法律制度保護生態環境，強化綠色發展的法律和政策保障。習近平總書記在主持第十九屆中央政治局第六次集體學習時指出：“只有實行最嚴格的制度、最嚴密的法治，才能為生態文明建設提供可靠保障 。”（B項正確）“保護生態環境必須依靠制度、依靠法治。我國生態環境保護中存在的突出問題大多同體制不健全、制度不嚴格、法治不嚴密、執行不到位、懲處不得力有關。要加快制度創新，增加制度供給，完善制度配套，強化制度執行，讓制度成為剛性的約束和不可觸碰的高壓線。”生態文明建設必須要納入法治的軌道，以最嚴格的制度、最嚴密的法治，對生態環境予以最嚴格的保護，對破壞生態環境的行為予以最嚴厲的制裁，才能遏制住生態環境持續惡化的趨勢（C項正確），保障生態文明建設的持續健康發展。要加大生態環境保護執法司法力度（D項錯誤），大幅度提高破壞環境違法犯罪的成本，強化各類環境保護責任主體的法律責任，強化綠色發展法律和政策保障，用嚴格的法律制度保護生態環境。要建立健全自然資源產權法律制度，完善國土空間開發保護法律制度，完善生態環境保護管理法律制度，加快構建有效約束開發行為和促進綠色發展、循環發展、低碳發展的生態文明法治體系。"}, {"id": "卷一-54", "subject": "卷一", "type": "多選題", "question": "董仲舒在《春秋繁露》中對“春秋決獄”解釋說：“春秋之聽獄也，必本其事而原其志；志邪者不待成 ，首惡者罪特重，本直者其論輕。”根據這一解釋，下列哪些選項是正確的？（　）", "options": [{"key": "A", "text": "以《春秋》等經義決獄是法律儒家化在司法領域的反映"}, {"key": "B", "text": "《春秋》決獄的核心是實行“論心定罪”原則"}, {"key": "C", "text": "以《春秋》經義決獄為司法原則，對傳統的司法審判既是一種積極的補充，也為司法擅斷提供了依據"}, {"key": "D", "text": "父親和別人發生鬥毆，對方用刀刺父親，兒子拿棍子相救，卻誤傷父親。依漢律，兒子毆打父親應當處死 。董仲舒根據《春秋》決獄原則，認為雖應判處兒子死刑，但應當在秋天霜降以後、冬至以前執行，即“秋冬行刑”"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】漢代的《春秋》決獄是法律儒家化在司法領域的反映，其特點是依據儒家經典《春秋》等著作中提倡的精神原則審判案件，而不僅僅依據漢律審案。A項正確。 題乾所引董仲舒在《春秋繁露》中對“春秋決獄”的解說，是強調審判時應當重視行為人的主觀動機；在著重考■動機的同時，還要依據事實，區分首犯、從犯和已遂、未遂。這表明《春秋》決獄實行“論心定罪 ”的原則，如果犯罪人主觀動機符合儒家“忠”“孝”精神，即使其行為具有社會危害，也可以減免刑事處罰。相反，如果犯罪人主觀動機嚴重違背儒家倡導的精神，即使沒有造成嚴重的危害後果，也認定犯罪給予嚴懲。B項正確。 以《春秋》經義決獄為司法原則，對傳統的司法審判是一種積極的補充。當然，其消極作用也相當明顯。因為專以“心志”的“善惡”判斷有罪、無罪或者罪行輕重，往往會成為司法官吏主觀臆斷和出入人罪的口實 ，在一定程度上為司法擅斷提供了依據。C項正確。 根據“論心定罪”原則，兒子的動機不是打父親，所以應免罪（《春秋決事比》），而非判處死刑。再者 ，“秋冬行刑”制度是漢代統治者根據董仲舒提出的“天人感應”理論，規定春、夏不得執行死刑。“秋冬行刑”制度非直接源於《春秋》決獄原則。D項錯誤。"}, {"id": "卷一-55", "subject": "卷一", "type": "多選題", "question": "下列關於明清時期法律思想與制度的說法，哪些選項是不正確的？（　）", "options": [{"key": "A", "text": "朱元璋以“十惡”中侵犯皇權的犯罪為具體內容創設“奸黨”罪，用以懲辦官吏"}, {"key": "B", "text": "明清時期借鑒了前代中央司法機關體系，其大理寺、刑部職能分工沿用唐宋模式，唯獨將其御史台改為都察院"}, {"key": "C", "text": "明朝各州縣的“申明亭”屬於官方調解機構，由當地德高望重的耆老調處解決糾紛"}, {"key": "D", "text": "明朝在交叉管轄案件上實行被告就原告的原則，以減少司法官員相互推諉"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】朱元璋創設“奸黨”罪，用以懲辦官吏侵犯皇權的犯罪，但是，奸黨罪並無具體、確定的內容 24 順手工具。因此，A項錯誤。 明清三法司與唐宋三法司的職能分工大相徑庭。唐宋時大理寺為最高審判機關，刑部為最高復核機關，御史台為最高監察機關，而明清時刑部為最高審判機關，大理寺為最高復核機關，都察院為最高監察機關。因此 ，B項錯誤。 “申明亭”系明朝設立在各州、縣、鄉的官方基層調解機構，由民間德高望重的耆老受理當地民間糾紛，加以調處解決，同時負責張貼榜文，申明教化。因此，C項正確。 明朝的交叉管轄實行被告原則，即原告就被告。明律規定，“若詞訟原告、被論在兩處州縣者，聽原告就被論官司告理歸結”，這反映出明朝實行被告原則，以減少推諉。因此，D項錯誤。"}, {"id": "卷一-56", "subject": "卷一", "type": "多選題", "question": "《最高人民法院關於審理盜竊案件具體應用法律若干問題的解釋》規定：各地高級法院可根據本地區經濟發展狀況，並考慮社會治安狀況，在本解釋規定的數額幅度內，分別確定本地區執行“數額較大”、“數額巨大”、“數額特別巨大”的標準。依據法理學的有關原理，下列不正確的表述是：", "options": [{"key": "A", "text": "該規定沒有體現法的普遍性特徵"}, {"key": "B", "text": "該規定違反了“法律面前人人平等”的原則"}, {"key": "C", "text": "該規定說明：法律內容的決定因素是社會經濟狀況"}, {"key": "D", "text": "該規定說明：政治對法律沒有影響"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】法是具有普遍性的社會規範，這是法的特徵之一。雖然不同地區執行不同的“數額較大”、 “數額巨大”、“數額特別巨大”的標準，但不論具體標準如何設定，其在公權力所及範圍內，具有普遍的約束力，因而體現了法的普遍性。A選項錯誤。 “法律面前人人平等”禁止的是基於不合理根據的差別對待，而題乾中的規定乃是基於各地不同的經濟發展狀況所做的區別處理，並不違背平等原則。B項錯誤。 法與政治是有密切關係的，基於“一般的原理不因個別反例的存在而無效”的原理，該規定並不能否認政治和法律之間的相互影響關係，D項錯誤。 C項符合一般原理，正確。"}, {"id": "卷一-57", "subject": "卷一", "type": "多選題", "question": "甲京劇團與乙劇院簽訂合同演■某傳統劇目一場，合同約定京劇團主要演員曾某、廖某、潘某出演劇中主要角色，劇院支付人民幣1萬元。演出當日，曾某在異地演出未能及時趕回，潘某生病在家，沒有參加當天的演出，致使大部分觀眾退票，劇院實際損失1.5萬元。後劇院向法院起訴京劇團，要求賠償損失。針對此案 ，下列選項不正確的是？", "options": [{"key": "A", "text": "在這一事例中，法律關係主體僅為甲京劇團與乙劇院"}, {"key": "B", "text": "京劇團與劇院的法律關係為保護性法律關係"}, {"key": "C", "text": "京劇團與劇院的法律權利和法律義務都不是絕對的"}, {"key": "D", "text": "在這一事例中，法律權利和法律義務針對的主體是不特定的"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】法律關係主體是法律關係的參加者，是一定權利的享有者和一定義務的承擔者。本題中，法律關係的主體不限於甲劇團和乙劇院，演員曾某、潘某、廖某也與合同具有法律上的利害關係，因而也是法律關係主體。故A錯誤。 按照法律關係產生的依據、執行的職能和實現規範的內容不同，法律關係可以分為調整性法律關係和保護性法律關係。調整性法律關係是基於人們的合法行為而產生的、執行法的調整職能的法律關係。它所實現的是法律規範（規則）的行為規則（指示）的內容。調整性法律關係不需要適用法律制裁，法律主體之間即能夠依法行使權利，履行義務，如各種依法建立的民事法律關係、行政合同關係等等。保護性法律關係是由於違法行為而產生的、旨在恢復被破壞的權利和秩序的法律關係。它執行著法的保護職能，所實現的是法律規範 （規則）的保護規則（否定性法律後果）的內容，是法的實現的非正常形式。它的典型特徵是一方主體（國家）適用法律制裁，另一方主體（通常是違法者）必須接受這種制裁，如刑事法律關係。本案中的合同關係乃是基於合法的行為產生的，因此屬於調整性法律關係，B項錯誤。 25 京劇團與劇院的法律權利和法律義務都是針對特定的主體的，所以屬於相對權利義務，因此C項正確，D項錯誤。"}, {"id": "卷一-58", "subject": "卷一", "type": "多選題", "question": "律師除特殊情況外，應當保守在執業活動中知悉的國家秘密和當事人的商業秘密，不得泄露當事人的隱私 。下列情況中，律師的哪些做法是正確的？", "options": [{"key": "A", "text": "在庭審中出具了委託人提供的包含有商業秘密的董事會會議記錄作為證據"}, {"key": "B", "text": "將十年來辦結的案例匯編出版，其中包含了客戶的商業秘密資料"}, {"key": "C", "text": "發現委託人正在進行的行為將會發生致人傷亡的嚴重犯罪，立即將此情況向有關單位反映"}, {"key": "D", "text": "代理海關關稅事務時發現委託人的行為屬於走私犯罪，確信自己將被無辜地牽涉其中，遂將情況向有關單位反映"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】律師應當保守在執業活動中知悉的國家秘密和當事人的商業秘密，不得泄露當事人的隱私。律師事務所、律師及其輔助人員不得泄露委託人的商業秘密、隱私，以及通過辦理委託人的法律事務所了解的委託人的其他信息。但是律師認為保密可能會導致無法及時阻止發生人身傷亡等嚴重犯罪及可能導致國家利益受到嚴重損害的除外。C項正確。 律師可以公開委託人授權同意披露的信息。A項正確。 律師在代理過程中可能無辜地被牽涉到委託人的犯罪行為時，律師可以為保護自己的合法權益而公開委託人的相關信息。D項正確。 律師代理工作結束後，仍有保密義務。B項錯誤。"}, {"id": "卷一-59", "subject": "卷一", "type": "多選題", "question": "法官應當自覺避免受到媒體的不當影響。下列哪些行為不利於實現這一目標？", "options": [{"key": "A", "text": "仔細分析媒體上對案件事實問題發表的評論，並作筆記，而且在形成判決過程中作為參考"}, {"key": "B", "text": "媒體上關於自己負責的案件的相關報導、評論一概不讀"}, {"key": "C", "text": "將媒體上關於案件法律問題的研究與評論加以認真研究"}, {"key": "D", "text": "發現媒體的報導有明顯失實之處，便在媒體上公開發表言論予以評論"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】法律職業道德的基本原則之一是以事實為根據，以法律為準繩，案件的事實恰恰是法官通過庭審來認定的，而不能以媒體上的評論作為形成判決的參考。故A項錯誤。 法官在審理案件的過程中，應當避免受到新聞媒體和公眾輿論的不當影響。法官不論在何種情況下，都應當有獨立意識，運用自己的法律智慧對案件作出判斷，排除各種不當影響，並有勇氣堅持自己認為正確的觀點 。故B項正確。 業務素質的高低直接影響著法官履行審判職責的質量與水平，法官必須具備與職業需要相適應的業務素質 ，包括：紮實的法學理論基礎、良好的法律意識和豐富的法律知識，這些則是需要法官自身的不斷學習研究來提高的，故C項正確。 法官發表文章或者接受媒體採訪時，應當保持謹慎的態度，不得針對具體案件和當事人進行不適當的評論 ，避免因言語不當使公眾對司法公正產生合理的懷疑。故D項錯誤。"}, {"id": "卷一-60", "subject": "卷一", "type": "多選題", "question": "憲法具有最高法律效力。憲法的最高法律效力主要包括以下哪些方面的含義？", "options": [{"key": "A", "text": "憲法是制定普通法律的依據，任何普通法律、法規都不得與憲法相牴觸"}, {"key": "B", "text": "憲法是一切國家機關、社會團體和全體公民的最高行為準則"}, {"key": "C", "text": "在制定和修改程序上，憲法比其他法律的要求更加嚴格"}, {"key": "D", "text": "在內容上，憲法規定國家最根本、最重要的問題"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】憲法作為國家的根本法體現為三個方面：其一，憲法在內容上規定國家最根本、最核心的問題 26 ；三是憲法是一切國家機關、社會團體和全體公民的最高行為準則。選項C、D分別屬於憲法的制定和修改程序複雜和憲法內容特殊的體現，不符合題意，應予以排除。"}, {"id": "卷一-61", "subject": "卷一", "type": "多選題", "question": "根據《香港特別行政區基本法》，關於行政長官，下列說法不正確的有（　）", "options": [{"key": "A", "text": "擔任行政長官，應當年滿45周歲，在香港連續居住滿20年"}, {"key": "B", "text": "行政長官有權解釋基本法"}, {"key": "C", "text": "行政長官是由一個有廣泛代表性的提名委員會按民主程序提名後普選產生的"}, {"key": "D", "text": "在行政長官彈劾程序中，如果調■委員會認為有足夠證據構成指控，可提出彈劾案，報請立法會決定免去行政長官職務"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】《香港特別行政區基本法》第44條規定：“香港特別行政區行政長官由年滿四十周歲，在香港通常居住連續滿二十年並在外國無居留權的香港特別行政區永久性居民中的中國公民擔任。”A項錯誤。 同法第158條規定：“本法的解釋權屬於全國人民代表大會常務委員會。全國人民代表大會常務委員會授權香港特別行政區法院在審理案件時對本法關於香港特別行政區自治範圍內的條款自行解釋。香港特別行政區法院在審理案件時對本法的其他條款也可解釋。但如香港特別行政區法院在審理案件時需要對本法關於中央人民政府管理的事務或中央和香港特別行政區關係的條款進行解釋，而該條款的解釋又影響到案件的判決，在對該案件作出不可上訴的終局判決前，應由香港特別行政區終審法院請全國人民代表大會常務委員會對有關條款作出解釋。如全國人民代表大會常務委員會作出解釋，香港特別行政區法院在引用該條款時，應以全國人民代表大會常務委員會的解釋為準。但在此以前作出的判決不受影響。全國人民代表大會常務委員會在對本法進行解釋前，徵詢其所屬的香港特別行政區基本法委員會的意見。”B項錯誤，行政長官無權解釋基本法 。 同法第45條規定：“香港特別行政區行政長官在當地通過選舉或協商產生，由中央人民政府任命。行政長官的產生辦法根據香港特別行政區的實際情況和循序漸進的原則而規定，最終達至由一個有廣泛代表性的提名委員會按民主程序提名後普選產生的目標。行政長官產生的具體辦法由附件一《香港特別行政區行政長官的產生辦法》規定。”可見，普選產生只是目標，目前仍然沿用由行政長官選舉委員會選舉產生、由中央人民政府任命的辦法。根據香港基本法和目前有關法律的規定，任何香港永久性居民中的中國公民、沒有外國居留權、年滿40歲，並在香港通常居住連續不少於20年，均符合資格獲提名為候選人。候選人提名表格須由不少於150名選舉委員會委員簽署提名，每名選舉委員只可以提名一名候選人。競選人在提名期內向選舉事務處提交超過150名選舉委員會委員簽署的提名表格並獲得確認有效後，由近1200名選舉委員組成的選舉委員會 ，以無記名投票方式選舉產生香港特區行政長官人選，並報請中央人民政府任命。第五屆行政長官便是通過這一程序產生的。C項錯誤。 同法第73條規定：“如立法會全體議員的四分之一聯合動議，指控行政長官有嚴重違法或瀆職行為而不辭職 ，經立法會通過進行調查，立法會可委託終審法院首席法官負責組成獨立的調查委員會，並擔任主席。調查委員會負責進行調查，並向立法會提出報告。如該調查委員會認為有足夠證據構成上述指控，立法會以全體議員三分之二多數通過，可提出彈劾案，報請中央人民政府決定。”D項錯誤。"}, {"id": "卷一-62", "subject": "卷一", "type": "多選題", "question": "關於立法法的有關規定的理解，下列哪些選項是正確的？（　）", "options": [{"key": "A", "text": "全國人大常委會的法律解釋與法律具有同等效力"}, {"key": "B", "text": "國務院、中央軍委、最高法院、最高檢察院、省級人大常委會，以及其他國家機關、社會團體和公民，可向全國人大常委會書面提出審查法律的要求"}, {"key": "C", "text": "列入全國人大常委會會議議程的法律案，一般應當經三次常委會會議審議後再交付表決"}, {"key": "D", "text": "最高人民法院的司法解釋，應當自公布之日起30日內報全國人大常委會備案"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】根據《立法法》第50條的規定，全國人民代表大會常務委員會的法律解釋同法律具有同等效力 。因此，A項正確。 27 治區、直轄市的人民代表大會常務委員會認為行政法規、地方性法規、自治條例和單行條例同憲法或者法律相牴觸的，可以向全國人民代表大會常務委員會書面提出進行審查的要求，由常務委員會工作機構分送有關的專門委員會進行審查、提出意見。注意，此處審查的對象只包括行政法規、地方性法規、自治條例和單行條例，並沒有法律。因此，B項錯誤。 根據《立法法》第29條的規定，列入常務委員會會議議程的法律案，一般應當經三次常務委員會會議審議後再交付表決。常務委員會會議第一次審議法律案，在全體會議上聽取提案人的說明，由分組會議進行初步審議。常務委員會會議第二次審議法律案，在全體會議上聽取法律委員會關於法律草案修改情況和主要問題的匯報，由分組會議進一步審議。常務委員會會議第三次審議法律案，在全體會議上聽取法律委員會關於法律草案審議結果的報告，由分組會議對法律草案修改稿進行審議。常務委員會審議法律案時，根據需要，可以召開聯組會議或者全體會議，對法律草案中的主要問題進行討論。因此，C項正確。 根據《立法法》第104條第2款的規定，最高人民法院、最高人民檢察院作出的屬於審判、檢察工作中具體應用法律的解釋，應當自公布之日起30日內報全國人民代表大會常務委員會備案。因此，D項正確。"}, {"id": "卷一-63", "subject": "卷一", "type": "多選題", "question": "關於憲法宣誓制度，下列哪些說法是正確的？", "options": [{"key": "A", "text": "國家監察委員會副主任、委員進行宣誓的儀式由國家監察委員會組織"}, {"key": "B", "text": "我國鄉人大和縣級以上人大及其常委會選舉或者決定產生的國家工作人員，一府一委兩院任命的國家工作人員應當每年公開進行憲法宣誓"}, {"key": "C", "text": "全國人大主席團組織全國人大選舉或者決定產生的人員的宣誓儀式"}, {"key": "D", "text": "駐外全權代表的宣誓儀式由外交部組織"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】關於宣誓儀式的主持組織，第一，全國人大主席團組織全國人大選舉或決定產生的人員的宣誓儀式。第二，委員長會議組織由全國人大常委會產生的人員的宣誓儀式。第三，國家監察委、最高法、最高檢副職及以下的宣誓儀式分別由國家監察委、最高法、最高檢組織。第四，駐外全權代表的宣誓儀式由外交部組織。第五，地方工作人員宣誓的具體組織辦法由省級常委會參照本決定制定，報全國人民代表大會常務委員會備案。故ACD選項正確。 我國的各級人大及縣級以上各級人大常委會選舉或者決定產生的國家工作人員，以及一府一委兩院任命的國家工作人員在就職時應當公開進行憲法宣誓。故B選項錯誤，注意就職時宣誓即可。"}, {"id": "卷一-64", "subject": "卷一", "type": "多選題", "question": "乘坐甲國航空公司航班的乙國公民在飛機進人丙國領空後劫持並殺害丙國公民.被機組人員制服後交丙國警方羈押。甲、乙、丙三國均為1963年《關於在航空器內犯罪和其他某些行為的公約》(以下簡稱《東京公約 》)、1970年《制止非法劫持航空器公約》(以下簡稱《海牙公約》)及1971年《制止危害民用航空安全的非法行為的公約》(以下簡稱《蒙特利爾公約》)締約國。據此，下列哪些選項是正確的？（　）", "options": [{"key": "A", "text": "犯罪發生在丙國領空。丙國有管轄權"}, {"key": "B", "text": "犯罪嫌疑人為乙國公民，乙國有管轄權"}, {"key": "C", "text": "劫機發生在甲國航空器上，僅甲國有管轄權"}, {"key": "D", "text": "甲國、乙國、丙國對本案均有管轄權"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】根據1963年《東京公約》、1970年《海牙公約》及1971年《蒙特利爾公約》的規定，下列國家均擁有對於危害民航安全罪行的管轄權：(1)航空器的登記國；(2)航空器降落時，被指稱的嫌疑犯在該航空器內，該航空器的降落地國有管轄權；(3)在租來時不帶機組的航空器內發生犯罪或針對航空器的犯罪，承租人的主要營業地國或其永久居所地國有管轄權；(4)罪行發生地國有管轄權；(5)嫌疑犯發現地國；(6)依各國國內法規定的其他管轄權如犯罪嫌疑人國籍國等。本題中。甲國為航空器登記國，有管轄權；乙國為犯罪嫌疑人國籍國，有管轄權；丙國為犯罪行為發生地國，有管轄權。因此，ABD正確，C錯誤。"}, {"id": "卷一-65", "subject": "卷一", "type": "多選題", "question": "下列說法錯誤的有（　）", "options": [{"key": "A", "text": "只要國家法益或社會法益正在受到侵害，任何人都可以進行正當防衛專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 28"}, {"key": "B", "text": "重婚罪屬於不法侵害，因此可以對其進行正當防衛"}, {"key": "C", "text": "對正當防衛不能進行正當防衛，但對緊急避險可以進行正當防衛"}, {"key": "D", "text": "單位犯罪時.對單位可以進行正當防衛"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】國家法益、社會法益受到侵害，一般由國家機關救濟。公民個人的救濟會受到限制。A項錯誤。 成立正當防衛要求不法侵害應正在進行(具有緊迫性)，防衛也應具有適時性。B項中重婚罪雖然屬於不法侵害 ，但其並非正在進行(具有緊迫性)。因此，不可以對其進行正當防衛。B項錯誤。 成立正當防衛要求不法侵害的存在。由於緊急避險是法定的(客觀)違法阻卻事由，阻卻了行為的不法性。因此，緊急避險不屬於不法侵害，對其也不可以進行正當防衛。C項錯誤。 正當防衛的對象條件要求防衛行為必須針對不法侵害人本人(自然人)。D項中單位犯罪的主體是單位，不是自然人。單位的危害行為不屬於自然人的不法侵害。因此，單位犯罪時，對單位不可以進行正當防衛。D項錯誤 。"}, {"id": "卷一-66", "subject": "卷一", "type": "多選題", "question": "下列說法正確的是？（　）", "options": [{"key": "A", "text": "在寒冷的冬天，甲為了取樂將100元扔入湖中，乙為了得到100元而跳入湖中因而死亡的，不能將乙的死亡結果歸於甲的行為"}, {"key": "B", "text": "某日凌晨，甲、乙二人竄至某居民小區，發現某單元五樓一個窗戶未關，甲負責望風，乙順著下水管爬到五樓推開窗戶進入臥室，乙在盜竊手機時被戶主丙發現.乙迅速從原路逃跑，丙在追趕乙時墜樓身亡。不能將丙死亡的結果歸責於乙的逃跑行為。即乙的行為與丙的死亡結果沒有刑法上的因果關係"}, {"key": "C", "text": "甲拿刀砍向仇人乙，乙躲閃後僅僅受輕傷，但是由於乙迷信鬼神，不去醫院治療傷口，而是以香灰塗抹傷口，導致毒菌侵入體內死亡的，不能將乙的死亡結果歸屬於甲的行為"}, {"key": "D", "text": "A和B合租一套房，各自向房東交房租。A收到詐騙短信，短信聲稱以後的房租匯到某個銀行卡里。A信以為真。把3000元打到詐騙犯的卡上。然後A和合租的B說：“我們房東的卡換了。錢要打到另外一個卡上。”B說 ：“是嘛，你把短信轉發給我吧。”A把短信轉發給B，B就把3000元打到詐騙犯的賬號裡面了。詐騙犯的詐騙行為與B的被騙(財產損失)仍然具有刑法上的因果關係"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】乙為了得到100元而跳人湖中的行為，是乙自我冒險而導致的結果，不能將乙的死亡結果歸責於甲的行為。A項正確。 誰支配風險，誰對結果承擔責任。丙作為追趕者，是否追、怎麼追，其決定權取決於丙，丙的追趕行為導致了自己的死亡結果，應由丙對該死亡結果負責，而非由乙對丙的死亡結果負責。B項正確。 甲的傷害行為後，介入了被害人的行為，且介入的被害人的行為是對結果起決定性作用的異常行為，不應將結果歸屬於行為人的行為。乙的死亡是由於其在傷口塗抹香灰，病菌侵入體內而導致的，故乙的死亡不能歸責於甲的傷害行為。C項正確。 雖然介入了A的轉達行為，但是由於A的轉達行為是通常的介入行為，誤以為房東換卡並告訴自己合租的室友 ，在日常生活中是通常甚至必然出現的，並不能阻斷詐騙犯的詐騙行為與B被騙(財產損失)之間的因果關係。 故詐騙犯的詐騙行為與8的被騙(財產損失)仍然具有刑法上的因果關係。D項正確。"}, {"id": "卷一-67", "subject": "卷一", "type": "多選題", "question": "關於自首和立功的認定，以下說法不正確的有", "options": [{"key": "A", "text": "甲交通肇事後逃逸，其父乙協助公安機關抓獲甲，則可以認定為代甲自首，故甲的行為成立自首"}, {"key": "B", "text": "甲、乙共同盜竊，甲被抓獲，在訊問中提供了司法機關尚未掌握的共犯乙的相關身份信息，公安機關據此抓住了乙，則甲成立立功"}, {"key": "C", "text": "請託人甲為了謀取不正當利益，向國家工作人員乙行賄100萬，後因乙不辦事，甲向監察委員會告發了乙受賄的事實，經查證屬實，則甲成立立功"}, {"key": "D", "text": "甲搶劫，乙提供汽車。後甲被公安通緝，迫於強大壓力，在前往派出所投案的途中被抓獲。到案後，甲如實供述了搶劫過程，但隱瞞了乙提供幫助的情況，直至一審期間才交代。則甲可成立自首 29"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】《最高人民法院關於處理自首和立功若干具體問題的意見》第1條第4款：犯罪嫌疑人被親友採用捆綁等手段送到司法機關，或者在親友帶領偵查人員前來抓捕時無拒捕行為，並如實供認犯罪事實的，雖然不能認定為自動投案，但可以參照法律對自首的有關規定酌情從輕處罰。第4條第3款：犯罪分子親友為使犯罪分子“立功”，向司法機關提供他人犯罪線索、協助抓捕犯罪嫌疑人的，不能認定為犯罪分子有立功表現。故此情況既不屬自首，也不屬立功；但可酌情從寬。A項錯誤。 《最高人民法院關於處理自首和立功具體應用法律若干問題的解釋》第1條第2項：共同犯罪案件中的犯罪嫌疑人，除如實供述自己的罪行，還應當供述所知的同案犯，主犯則應當供述所知其他同案犯的共同犯罪事實 ，才能認定為自首。第5條：協助司法機關抓捕其他犯罪嫌疑人（包括同案犯），應當認定為有立功表現。《 最高人民法院關於處理自首和立功若干具體問題的意見》第5條最後一款：犯罪分子提供同案犯姓名、住址、 體貌特徵等基本情況，或者提供犯罪前、犯罪中掌握、使用的同案犯聯絡方式、藏匿地址，司法機關據此抓捕同案犯的，不能認定為協助司法機關抓捕同案犯。這也就是說：交代同案犯基本信息，屬自首或坦白；交代基本信息以外的信息，才屬立功。本選項屬坦白。B項錯誤。 行賄罪、受賄罪系共同犯罪，甲、乙是同案犯，揭發同案犯罪行，依照前述《最高人民法院關於處理自首和立功具體應用法律若干問題的解釋》第1條第2項的規定，屬自首，而不屬立功。並且，行賄人在被追訴前主動交待行賄行為的，應當按照《刑法》第390條第2款處理。C項錯誤。 《最高人民法院關於處理自首和立功具體應用法律若干問題的解釋》第1條第1項第2段：經查實確已準備去投案，或者正在投案途中，被公安機關捕獲的，應當視為自動投案。第1條第2項第4段：但在一審判決前又能如實供述的，應當認定為自首。D項正確。"}, {"id": "卷一-68", "subject": "卷一", "type": "多選題", "question": "下列幫助、教唆行為中，能獨立構成犯罪，不按共犯處理的有哪些？", "options": [{"key": "A", "text": "協助他人實施組織賣淫犯罪"}, {"key": "B", "text": "煽動他人顛覆國家政權"}, {"key": "C", "text": "有■禁犯罪活動職責的國家機關工作人員，向犯罪分子通風報信、提供便利，幫助犯罪分子逃避處罰"}, {"key": "D", "text": "幫助當事人毀滅、偽造證據，情節嚴重"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】題乾中的“共犯”是指狹義共犯，即幫助犯、教唆犯。 《刑法》第358條第4款的規定，協助組織他人賣淫的，構成協助組織賣淫罪（正犯）。不是組織賣淫罪的共犯。 《刑法》第105條第2款的規定，以造謠、誹謗或者其他方式煽動顛覆國家政權、推翻社會主義制度的，構成煽動顛覆國家政權罪（正犯）。不是顛覆國家政權罪的共犯。 《刑法》第417條的規定，有查禁犯罪活動職責的國家機關工作人員，向犯罪分子通風報信、提供便利，幫助犯罪分子逃避處罰的，構成幫助犯罪分子逃避處罰罪（正犯）。由於是事後犯，不能觸犯上游犯罪的共犯。 《刑法》第307條第2款規定，幫助當事人毀滅、偽造證據，情節嚴重的，構成幫助毀滅、偽造證據罪（正犯 ）。不是共犯。"}, {"id": "卷一-69", "subject": "卷一", "type": "多選題", "question": "下列說法正確的是？（　）", "options": [{"key": "A", "text": "甲進入乙家盜竊，發現乙在家中，當著乙的面，直接拿走了乙家中的5000元錢。如果認為盜竊是可以公開進行的，甲的行為成立盜竊罪"}, {"key": "B", "text": "如果認為盜竊僅限於秘密竊取，A選項中甲的行為成立搶奪罪"}, {"key": "C", "text": "在火車車廂.甲使用暴力、當面奪取了乙手中的500元錢後逃離現場，甲的行為成立搶奪。搶奪罪要求數額較大才能成立，由於甲的行為沒有達到數額標準，甲的行為不能認定為是搶奪罪"}, {"key": "D", "text": "在火車車廂。甲趁乙睡覺的時候，乙並不知情，甲取走了乙口袋中的500元錢，甲的行為是扒竊。扒竊入罪沒有數額的要求，甲的行為成立盜竊罪"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】如果認為盜竊可以是公開進行的，甲的行為成立盜竊罪，甲是以公開和平的方式取走了被害人的財產。A項正確。 30 如果認為盜竊僅限於秘密竊取，那麼甲的行為屬於公然奪取，應認定為搶奪罪。B項正確。 以公開對物使用暴力的方式取走被害人的財物，無論按哪一種觀點。都認為是搶奪。但由於搶奪必須達到數額較大才構成犯罪，故甲的行為不構成搶奪罪。C項正確。 甲的行為屬於盜竊，系扒竊。根據《刑法》規定，扒竊行為認定為盜竊罪，無數額要求，故甲的行為成立盜竊罪。D項正確。"}, {"id": "卷一-70", "subject": "卷一", "type": "多選題", "question": "下列說法正確的是？（　）", "options": [{"key": "A", "text": "甲、乙兩個婦女合謀去騙別人的錢。到另外一個地方後，甲找到一個過去從事過拐賣人口行為的丙。說 “能否幫忙把我表妹乙賣出去，給你5萬元”。人販子丙後來真的就把乙賣掉了。拿到錢的甲跑了。參與詐騙的乙後來也跑了。甲、乙都是詐騙罪共犯，丙不構成拐賣婦女罪"}, {"key": "B", "text": "甲乙未辦理婚姻登記即以夫妻名義共同生活。乙在醫院分娩一女孩，女孩出生後臉青紫、不哭，二人皆認為小孩有病，今後無錢醫治，遂通過醫院醫生介紹，將該女孩送給徐某喂養。徐某隨後給二人6000元。隨後 ，二人認為生孩子送人“撫養”可以賺錢，經過商議，決定生孩子出賣以償還債務、維持家庭生活和做生意 。在兩年內，二人通過他人介紹將二人所生育的三個孩子賣給他人“撫養”，共獲贓款68000元。二人成立拐賣兒童罪"}, {"key": "C", "text": "甲假裝將自己的1歲的兒子丙賣給乙，得到乙的金錢後，暗中尾隨抱著丙的乙，然後乘乙不備打傷乙，將丙搶回。甲的行為成立拐賣兒童罪"}, {"key": "D", "text": "甲錯誤地認為王某是婦女而將其拐賣，並已將被害人王某賣給他人為妻，收了買主的錢，但是由於王某是 “兩性人”而被買主退回，故甲的行為構成拐賣婦女罪(未遂)"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】在這個案件裡，並沒有真正的“被拐賣的婦女”，刑法要保護的那個婦女從來就不存在。而拐賣婦女罪是侵犯人身權利罪，沒有被害人時，談不上誰的人身自由被侵害，從客觀上看在本案中需要動用刑法來保護的婦女權益不存在。因此，宜應對甲、乙定詐騙罪；對人販子丙不定罪；收買婦女乙的人是詐騙罪的被害人，對其也不宜定收買被拐賣的婦女罪。A項正確。 區分借送養之名出賣親生子女與民間送養行為的界限的關鍵在於行為人是否具有非法獲利的目的。本項中 ，行為人第一次將女孩“送”給徐某喂養，主要是考慮到女孩可能有病將來無錢治療，遂通過中間人介紹將女孩送給他人喂養，並從收養人處收取了6000元，因此並沒有明顯獲利的目的。但在之後三次“送”孩子給他人“撫養”的行為中，非法獲利的目的已非常明顯，所以以拐賣兒童罪定罪處罰是準確的。B項正確。 甲的行為成立詐騙罪與故意傷害罪，不成立拐賣兒童罪。拐賣兒童罪的出賣目的不限於永久性的出賣，即使行為人打算出賣一段時間後再買回或者通過其他途徑使被害人回原住所的，也不影響本罪的成立。但是，假借出賣騙取他人財物的，不能認定為具有出賣目的。C項錯誤。 拐賣以男性為主的兩性人構成拐賣婦女罪(未遂)。D項正確。"}, {"id": "卷一-71", "subject": "卷一", "type": "多選題", "question": "關於使用假幣罪，下列說法正確的有：（　）", "options": [{"key": "A", "text": "甲用1萬元假幣交給房東，頂替2000元房租，房東表示同意，甲構成使用假幣罪"}, {"key": "B", "text": "乙將1萬元假幣存入銀行，乙構成使用假幣罪"}, {"key": "C", "text": "甲拿出假美元，乙信以為真，以略低於銀行匯率的價格向甲購買了5萬美元，甲的行為構成使用假幣罪"}, {"key": "D", "text": "丁用1萬元假幣換取李某1000元真幣，丁構成使用假幣罪"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】大多數時使用假幣是一種特殊的詐騙行為，因此一般以被害人陷入認識錯誤，不知道是假幣為要件，而出售、購買假幣罪的行為人必須明知是假幣。 屬於出售假幣罪，支付財物對價即為出售、購買。A項錯誤， 使用假幣必須讓假幣有可能進入流通領域，侵害貨幣的公共信用，該行為屬於使用。B項正確。 乙不知情，甲不成立出售、購買假幣罪，構成使用假幣罪。C項正確。 屬於出售和購買行為。D項錯誤。 31"}, {"id": "卷一-72", "subject": "卷一", "type": "多選題", "question": "關於組織出賣人體器官罪，下列說法錯誤的是？", "options": [{"key": "A", "text": "初中生甲（15周歲）為買蘋果手機在同學面前攀比，通過QQ群找乙去出賣自己的腎臟。最後乙花3萬元將甲一顆腎臟摘取並賣出，乙未收取任何中介費，將全部所得款交給甲，甲用該錢款買得最新款手機。乙的行為僅構成組織出賣人體器官罪"}, {"key": "B", "text": "某女大學生甲看到廁所中的收購卵子的小廣告，為迅速得到錢財，聯繫廣告上的乙出售了自己一顆卵子 ，得到4000元。乙收購卵子的行為構成組織出賣人體器官罪"}, {"key": "C", "text": "某醫院太平間看管人員甲，秘密建立了一個器官買賣交易所，專門從太平間挑選合適的屍體，摘取器官賣給迫切需要器官移植的病患及其家屬，進而從中獲取利益。甲的行為成立組織出賣人體器官罪"}, {"key": "D", "text": "醫生甲欺騙乙說將其肝臟捐獻給乙的好友丙，實際上捐獻給乙的仇人丁。甲的行為成立故意傷害罪"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】乙的行為同時觸犯了組織出賣人體器官罪與故意傷害罪。摘取不滿18周歲的人的器官，即使經過未成年人同意，也成立故意傷害罪、故意殺人罪。甲並未出現死亡結果，故乙的行為同時觸犯了組織出賣人體器官罪與故意傷害罪，從一重罪處罰。A項錯誤乙的行為不屬於組織出賣人體器官罪。組織出賣人體器官罪的犯罪對象是人體器官，但卵子不屬於人體器官 。《人體器官移植條例》釆用狹義的器官定義，僅將器官限定在心臟肺髒、肝臟、腎臟或者胰腺等器官的全部或者部分的範圍內。張明楷教授認為，本罪所指器官可以進而理解為一旦喪失會嚴重侵害被害人的身體健康的人體組織集合體。包括角膜、皮膚、肢體、骨頭等，而血液、骨髓、脂肪、細胞等則不屬於器官範圍。 單個卵子是一種生殖細胞，無法形成集合體。無論釆用狹義說還是廣義說都難以將其定義為人體器官。勉強將其解釋為器官已超越人體器官的語義邊界，屬於違反罪刑法定原則的類推解釋，組織出賣卵子的行為不宜適用組織出賣人體器官罪。B項錯誤。 甲的行為成立盜竊、侮辱、故意毀壞屍體罪。組織出賣人體器官罪的對象是活人的器官，而本題中，醫院太平間看管人員甲只是利用屍體的器官進行交易，不屬於組織出賣人體器官罪的犯罪對象。甲的行為應當以盜竊、侮辱、故意毀壞屍體、屍骨、骨灰罪定罪處罰。C項錯誤。 甲的行為構成故意傷害罪。乙雖然承諾了，但屬於被騙的承諾，其方向錯誤，甲的行為構成故意傷害罪。D項正確。"}, {"id": "卷一-73", "subject": "卷一", "type": "多選題", "question": "關於強姦罪，下列說法正確的是？", "options": [{"key": "A", "text": "某日中午放學，幼兒園看門人員譚某見女童張某（5周歲）一個人在門口等待許久，不見張某家長來接，譚某遂產生姦淫想法，利用棒棒糖誘惑張某進入房間內，對張某實施姦淫行為。譚某的行為成立強姦罪的加重犯"}, {"key": "B", "text": "王某專門以年齡幼小的在校女學生為侵害對象，本人或教唆雷甲、陳乙、崔丙、宋丁等未成年在校學生 ，以介紹男女朋友為幌子，或者採取暴力、脅迫、酒精麻醉、金錢引誘等手段，將15名未成年在校女學生 （其中8名幼女）帶至酒店、KTV、王某駕駛的轎車上或野外荒地等處實施強姦。王某的行為成立強姦罪，應當從重處罰"}, {"key": "C", "text": "甲、乙、丙以輪姦的犯意對丁女實施暴力，甲、乙均姦淫了丁，丙“中止”了自己的行為。甲、乙、丙的行為屬於輪姦"}, {"key": "D", "text": "賈某（29周歲）與錢某（13周歲）在某婚戀網站上相識半年多，賈某主動提出見面，兩人在火車站碰頭後 ，賈某覺得錢某可能系未成年人但也不是特別確定，後賈某將錢某帶回家併發生性關係，造成了錢某受到傷害的結果。錢某回家後，在家人的鼓勵下報警。對賈某以強姦罪論，加重處罰"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】《刑法修正案（十一）》增設，姦淫不滿10周歲的幼女為加重情節。“姦淫幼女”只是從重情節，不是加重情節，而姦淫不滿10周歲的幼女才屬於加重情節。故本案中，女童張某僅5周歲，譚某對其實施姦淫行為不僅成立強姦罪，還應認定為本罪的加重犯。A項正確。 王某成立強姦罪的加重犯，應當加重處罰。王某教唆、利用其他未成年人協助對未成年在校女學生實施強姦 ，強姦人數、次數特別多，屬於強姦婦女、姦淫幼女情節惡劣的和強姦婦女、姦淫幼女多人的加重情節，而非從重情節。B項錯誤。 32 對於甲、乙無疑適用輪姦的法定刑。丙雖然沒有實施姦淫行為，但由於成立共同正犯，丙應當對甲、乙的行為與結果承擔責任，由於甲、乙屬於輪姦，故對於丙也宜適用輪姦的法定刑。C項正確。 《刑法修正案（十一）》增設，姦淫不滿10周歲的幼女或者造成幼女傷害的為加重情節。本題中，錢某系幼女，且與賈某發生性行為後受到傷害，符合“造成幼女傷害”的加重情節，賈某的行為構成強姦罪的結果加重犯。D項正確。"}, {"id": "卷一-74", "subject": "卷一", "type": "多選題", "question": "毒販甲得知公安機關近來要開展“嚴打”鬥爭，遂將尚未賣掉的50多克海洛因和販毒所得贓款8萬多元拿到家住偏遠農村的親戚乙處隱藏。公安機關得到消息後找乙調查此事，乙矢口否認。乙當晚將上述毒品、贓款帶到後山山洞隱藏時被跟蹤而至的公安人員當場抓獲。關於乙的行為認定，不正確的是？", "options": [{"key": "A", "text": "非法持有毒品罪"}, {"key": "B", "text": "掩飾、隱瞞犯罪所得、犯罪所得收益罪"}, {"key": "C", "text": "窩藏、轉移、隱瞞毒品、毒贓罪"}, {"key": "D", "text": "包庇毒品犯罪分子罪"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】乙明知對象物是毒販甲販賣毒品罪的毒品、毒贓，而為他人窩藏的，窩藏、轉移、隱瞞毒品、 毒贓罪。窩藏、轉移、隱瞞毒品、毒贓罪與掩飾、隱瞞犯罪所得、犯罪所得收益罪之間，是特別法與一般法的法條競合關係，應當適用特別法即窩藏、轉移、隱瞞毒品、毒贓罪法條。 在法條依據方面，《最高人民法院關於審理洗錢等刑事案件具體應用法律若干問題的解釋》第3條規定“明知是犯罪所得及其產生的收益而予以掩飾、隱瞞，構成刑法第三百一十二條（掩飾、隱瞞犯罪所得、犯罪所得收益罪）規定的犯罪，同時又構成刑法第一百九十一條（洗錢罪）或者第三百四十九條（窩藏、轉移、隱瞞毒品、毒贓罪）規定的犯罪的，依照處罰較重的規定定罪處罰”。將掩飾、隱瞞犯罪所得罪與窩藏、轉移、 隱瞞毒品、毒贓罪法條競合的規則設定為擇重處罰。兩罪一樣重時，適用特別法。窩藏、轉移、隱瞞毒品、 毒贓罪與非法持有毒品罪是整體法與部分法的法條競合關係（或吸收犯），應以整體法窩藏、轉移、隱瞞毒品、 毒贓罪定罪，不再單獨認定構成非法持有毒品罪。 包庇毒品犯罪分子罪要求對“人”即毒品犯罪分子進行包庇，即作假證明予以包庇；本案只有對“物”即毒品、毒贓的窩藏、轉移、隱瞞行為，沒有對人的包庇行為，故不構成包庇毒品犯罪分子罪。 綜上，行為人只構成窩藏、轉移、隱瞞毒品、毒贓罪一罪。故C項正確、ABD項錯誤。"}, {"id": "卷一-75", "subject": "卷一", "type": "多選題", "question": "甲是A市中院副院長，因涉嫌職務犯罪被起訴至B區法院，甲也曾經擔任過A市B區法院院長，以下說法不正確的是：", "options": [{"key": "A", "text": "甲可以申請A市B區法院全體人員迴避"}, {"key": "B", "text": "B區法院可以直接請求省高院指定其他法院管轄"}, {"key": "C", "text": "B區法院可以報請上一法院指定管轄"}, {"key": "D", "text": "B區法院可以直接移送至A市以外的法院管轄"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】該選項中所描述的情況甲可以申請具體審理該案的審判人員迴避，但是，我國刑訴法並未規定法院整體迴避的問題，不能申請B區法院全體人員迴避。選項A錯誤。 根據《刑訴解釋》第18條的規定，有管轄權的人民法院因案件涉及本院院長需要迴避或者其他原因，不宜行使管轄權的，可以請求移送上一級人民法院管轄。上一級人民法院可以管轄，也可以指定與提出請求的人民法院同級的其他人民法院管轄。本案中犯罪嫌疑人甲曾任A市B區法院院長，現任A市中院副院長，因此A市中院和A市境內所有基層法院都會受影響。而本案B區法院的正確做法是可以請求移送上一級人民法院指定管轄 。另外，由於A市境內所有法院都不宜成為本案的一審法院，因此，A市中院接到B區法院報請後，應當再報請省高院指定A市以外的其他法院行使管轄權。所以，選項B、D錯誤，選項C正確。"}, {"id": "卷一-76", "subject": "卷一", "type": "多選題", "question": "關於值班律師，下列說法正確的為？ 33", "options": [{"key": "A", "text": "辦案機關訊問犯罪嫌疑人時值班律師可以在場"}, {"key": "B", "text": "值班律師可以為犯罪嫌疑人代為申請取保候審"}, {"key": "C", "text": "值班律師與辯護律師的權利和義務是相同的"}, {"key": "D", "text": "認罪認罰案件，審查起訴階段值班律師申請查閱案卷，檢察院應當准許"}], "answer": ["B", "D"], "explanation_full": "【羿文解析】辦案機關訊問犯罪嫌疑人時，無論是辯護律師還是值班律師都無權在場。A項錯誤。 值班律師可以為犯罪嫌疑人、被告人代為申請變更強制措施。B項正確。 值班律師只提供有限的法律幫助，與辯護律師的權利和義務並不相同。例如，辯護律師需要出庭辯護，而值班律師則不提供出庭服務。C項錯誤。 根據《關於適用認罪認罰從寬制度的指導意見》第12條規定可知：自人民檢察院對案件審查起訴之日起，值班律師可以查閱案卷材料、了解案情。D項正確。"}, {"id": "卷一-77", "subject": "卷一", "type": "多選題", "question": "出租車司機甲被乘客舉報販賣毒品，A區公安機關接到線索後立即對其進行初查，發現其確有重大嫌疑 ，便正式對該案進行立案偵■。關於本案的偵■行為，下列哪些選項是不正確的？", "options": [{"key": "A", "text": "A區公安機關在初■過程中可對甲實施監聽，但要經上一級公安局局長批准"}, {"key": "B", "text": "在公安機關查明甲確有毒品準備出售時，偵查人員可以隱匿身份，向甲表示希望購買毒品，以便更好地獲取犯罪證據"}, {"key": "C", "text": "在毒品交易現場對甲進行拘留時，偵查人員在無搜■證的情況下對甲當時駕駛的汽車進行搜■符合法律規定"}, {"key": "D", "text": "出租車公司的電子數據記錄了甲的行駛軌跡，偵■人員為掌握這一證據可憑立案決定書進行調取"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】初查（調查核實）過程中不得釆取強制性措施，即《公安部規定》第174條：“……調查核實過程中，公安機關可以依照有關法律和規定採取詢問、查詢、勘驗、鑒定和調取證據材料等不限制被調查對象人身、財產權利的措施。但是，不得對被調查對象採取強制措施，不得查封、扣押、凍結被調查對象的財產 ，不得採取技術偵查措施。”因此A區公安機關在初查（調查核實）過程中只能採取非強制性措施，而監聽對人身權利造成了侵犯屬於強制性措施，因此在初查過程中不得對甲實施監聽，故A項錯誤。 對於法律規定的案件為了查清案件事實可以採取技術偵查措施，但是根據《公安部規定》第271條的規定在隱匿身份實施偵查時，不得使用促使他人產生犯罪意圖的方法誘使他人犯罪，不得採用可能危害公共安全或者發生重大人身危險的方法。因此本項中使得甲產生犯意所得的證據不能作為定罪依據，故B項錯誤。 搜查原則上應當有搜查證，但是特殊情況下即《公安部規定》第224條所規定的：在執行拘留、逮捕的時候 ，遇有下列緊急情況之一的，不用搜查證也可以進行搜查：（一）可能隨身攜帶凶器的；（二）可能隱藏爆炸、劇毒等危險物品的；（三）可能隱匿、毀棄、轉移犯罪證據的；（四）可能隱匿其他犯罪嫌疑人的 ；（五）其他突然發生的緊急情況。因此偵查人員在交易現場屬於上述緊急情況，可以不用搜查證對甲進行搜查，故C項正確。 《公安部規定》第62條：“公安機關向有關單位和個人調取證據，應當經辦案部門負責人批准，開具調取證據通知書，明確調取的證據和提供時限。被調取單位及其經辦人、持有證據的個人應當在通知書上蓋章或者簽名，拒絕蓋章或者簽名的，公安機關應當註明。必要時，應當採用錄音錄像方式固定證據內容及取證過程 。”D項錯誤。"}, {"id": "卷一-78", "subject": "卷一", "type": "多選題",
