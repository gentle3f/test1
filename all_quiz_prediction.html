規定，下列說法正確的是？（）", "options": [{"key": "A", "text": "借款合同自甲向乙提供借款時生效"}, {"key": "B", "text": "乙應當在返還借款時一併支付利息"}, {"key": "C", "text": "乙應當分別在滿12個月、24個月和30個月時支付利息"}, {"key": "D", "text": "如果乙未按照約定的借款用途使用借款，甲有權解除借款合同"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】本題涉及借款合同的性質以及利息支付問題。依據《民法典》第679條，自然人之間的借款合同為實踐合同，故選項A正確。依據《民法典》第674條，借款人應當按照約定的期限支付利息。對支付利息的期限沒有約定或者約定不明確，依照本法第510條的規定仍不能確定，借款期間不滿1年的，應當在返還借款時一併支付；借款期間1年以上的。應當在每屆滿1年時支付，剩餘期間不滿1年的，應當在返還借款時一併支付。故選項B錯誤，選項C正確。依據《民法典》第673條，借款人未按照約定的借款用途使用借款，貸款人有權解除借款合同。故選項D正確。綜上，本題答案為ACD。"}, {"id": "卷一-80", "subject": "卷一", "type": "多選題", "question": "程心有限公司由丁某、馬某、宋某、劉某、嚴某五名股東創立，各股東分期交付出資。關於股東出資與股東權利，以下哪些表述是不正確的？", "options": [{"key": "A", "text": "丁某以質押的汽車出資，公司在不知情的情況下可以善意取得"}, {"key": "B", "text": "馬某出資期限屆至前公司破產，則馬某無須再履行剩餘出資義務"}, {"key": "C", "text": "宋某在出資履行完畢前將股權轉讓給賀某，賀某應承擔剩餘出資義務"}, {"key": "D", "text": "宋某轉讓股權後，賀某的姓名只登記於股東名冊，而未向公司登記機構進行變更登記，則賀某不能主張行使股東權利"}], "answer": ["B", "C", "D"], "explanation_full": "29 ，股權轉讓時出資義務一併轉讓，則剩餘出資義務應由賀某承擔；若宋某出資期限已屆至而未履行或未完全履行出資義務即轉讓股權的，賀某明知或應知情的，則應承擔出資義務，賀某履行出資義務後可向宋某追償 ，若賀某不知情的，則只能向原股東進行追償。D項錯誤，記載於股東名冊的股東，可以依股東名冊主張行使股東權利；未經登記或者變更登記的，只是不得對抗第三人。"}, {"id": "卷一-81", "subject": "卷一", "type": "多選題", "question": "小馬、小丁、小宋三人2015年1月創辦了少年時代有限公司，小馬以房屋出資，評估作價150萬元，小丁、 小宋各以貨幣出資100萬，公司成立時全部實繳到位。2020年，少年時代公司不能對債權人李霏清償債務而申請破產。以下哪些說法是不正確的？", "options": [{"key": "A", "text": "小丁的出資實為其公務員父親貪污受賄所得，因該出資來源違法，小丁出資無效"}, {"key": "B", "text": "小馬與資產評估公司串通，將實際價值80萬的房屋評估為150萬，李霏可主張小丁與小宋承擔連帶責任"}, {"key": "C", "text": "後因市場變化等原因，小馬用以出資的房屋貶值為50萬，李霏可主張小馬補足100萬"}, {"key": "D", "text": "小宋在出資義務履行完畢前將股權轉讓給了小劉，李霏可主張小劉對小馬出資評估不實承擔連帶責任"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】A項錯誤，以貪污、受賄、侵占、挪用等違法犯罪所得的貨幣出資後取得股權的，對違法犯罪行為予以追究、處罰時，應當採取拍賣或者變賣的方式處置其股權。因此，應依法處置而非無效。B項正確、 D項錯誤，小馬出資評估不實應付補繳義務，公司設立時的股東承擔連帶責任，即小丁、小宋應承擔連帶責任 ；但是小劉並非設立股東，不對此承擔連帶責任。C項錯誤，對於市場原因貶值的，出資人不承擔補足責任 ，李霏只可請求小馬補足70萬，對於貶值的30萬，李霏無權主張。"}, {"id": "卷一-82", "subject": "卷一", "type": "多選題", "question": "少年時代有限公司有三名股東小馬、小丁、小宋，分別持股20%、5%、75%。欲選舉職工小張擔任監事，聘任小劉擔任經理。對於該公司作出的以下決定，下列哪些表述是錯誤的？", "options": [{"key": "A", "text": "公司股東會選舉職工小張擔任監事"}, {"key": "B", "text": "公司股東會聘任小劉擔任經理並兼任監事"}, {"key": "C", "text": "股東小丁有權請求召開臨時股東會"}, {"key": "D", "text": "如果公司董事會和監事會拒絕召集股東會，小宋可自行召集和主持"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】A項錯誤，職工擔任監事應由公司職工通過職工代表大會、職工大會或者其他形式民主選舉產生 。B項錯誤，董事會對股東會負責，決定聘任或者解聘公司經理及其報酬事項。C項錯誤，代表十分之一以上表決權的股東，三分之一以上的董事，監事會或者不設監事會的公司的監事提議召開臨時會議的，應當召開臨時會議；小丁持股比例為5%，不足十分之一以上的表決權，無權提議召開臨時股東會。D項正確，董事會或者執行董事不能履行或者不履行召集股東會會議職責的，監事會或者監事不召集和主持的，代表十分之一以上表決權的股東可以自行召集和主持。"}, {"id": "卷一-83", "subject": "卷一", "type": "多選題", "question": "嘉中有鑫文化娛樂中心是一家普通合夥企業，2017年成立，合夥協議約定經營期限5年，合夥人有馬風、 丁欣、宋婉和劉紈4人。下列哪些說法是不正確的？", "options": [{"key": "A", "text": "丁欣可在不給合夥企業事務執行造成不利影響的情況下退夥，但應當提前三十日通知其他合夥人"}, {"key": "B", "text": "若宋婉要轉為有限合夥人，應當經全體合夥人一致同意，一旦轉化對其作為普通合夥人期間企業債務承擔有限責任"}, {"key": "C", "text": "馬風擔任合夥事務執行人期間，收受回扣損害合夥企業利益被其他合夥人發現，其他合夥人可撤銷其合夥事務執行人的身份"}, {"key": "D", "text": "劉紈因意外身亡，其子劉小丸只有6歲，因此不可繼承劉紈的合夥人身份"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】A項錯誤，合夥協議未約定合夥期限的，合夥人在不給合夥企業事務執行造成不利影響的情況下 30 行事務的，其他合夥人可以決定撤銷該委託。D項錯誤，普通合夥人的繼承人為無民事行為能力人或者限制民事行為能力人的，經全體合夥人一致同意，可以依法成為有限合夥人，普通合夥企業依法轉為有限合夥企業 。全體合夥人未能一致同意的，合夥企業應當將被繼承合夥人的財產份額退還該繼承人。"}, {"id": "卷一-84", "subject": "卷一", "type": "多選題", "question": "甲公司為履行與乙公司的圖書買賣合同，簽發一張以乙公司為收款人、某銀行為付款人的匯票，銀行也予以了承兌。後乙公司將該匯票背書贈與給丙。此時，甲公司發現乙公司的圖書為盜版。關於本案，下列選項正確的是？", "options": [{"key": "A", "text": "該票據無效"}, {"key": "B", "text": "甲公司不能拒絕乙公司的票據權利請求"}, {"key": "C", "text": "丙有票據權利，但不能追索甲公司"}, {"key": "D", "text": "銀行應承擔票據責任"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】A項錯誤，甲公司為支付貨款向乙公司簽發票據，該票據並無法律規定的票據無效之情形，故該票據有效。B項錯誤，乙公司向甲公司交付的圖書為盜版，故甲、乙公司之間存在直接債權債務關係且乙公司未履行約定義務，甲公司可以向乙公司進行抗辯，拒絕支付票面金額。C項正確，因稅收、繼承、贈與可以依法無償取得票據的，不受給付對價的限制。但是，所享有的票據權利不得優於其前手的權利；丙有票據權利 ，但不能追索甲公司。D項正確，銀行承兌後成為票據債務人，應承擔票據責任。"}, {"id": "卷一-85", "subject": "卷一", "type": "多選題", "question": "甲、乙二人共有50輛汽車，甲將其中的一輛汽車租給丙使用。現甲、乙二人要將該50輛汽車整體轉讓，下列表述正確的有？（）", "options": [{"key": "A", "text": "甲、乙對該50輛汽車為按份共有"}, {"key": "B", "text": "丙對該50輛汽車享有優先購買權"}, {"key": "C", "text": "丙對承租的1輛汽車享有優先購買權"}, {"key": "D", "text": "丙對50輛汽車不享有優先購買權"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】承租人的優先購買權是指同等條件下的優先購買權，整體出售視為條件之一，故丙對承租的汽車不享有優先購買權。對50輛汽車不存在合同基礎，不享有優先購買權。同時，承租人的優先購買權只限於在房屋租賃中。對於共有，未約定共有類型的，除家庭關係等外．應視為按份共有。本題正確選項為AD。 不定項選擇題"}, {"id": "卷一-86", "subject": "卷一", "type": "多選題", "question": "專利權人春花自願以書面方式向國務院專利行政部門聲明願意許可任何單位或者個人實施其專利，關於開放許可，根據2021年6月1日起施行的《專利法》，下列選項正確的是：（）", "options": [{"key": "A", "text": "由國務院專利行政部門予以公告"}, {"key": "B", "text": "春花就發明專利提出開放許可聲明的，應當提供專利權評價報告"}, {"key": "C", "text": "春花撤回開放許可聲明的，應當以口頭或者書面方式提出"}, {"key": "D", "text": "開放許可聲明被公告撤回的，不影響在先給予的開放許可的效力"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】《專利法》第50條第1款規定：“專利權人自願以書面方式向國務院專利行政部門聲明願意許可任何單位或者個人實施其專利，並明確許可使用費支付方式、標準的，由國務院專利行政部門予以公告，實行開放許可。就實用新型、外觀設計專利提出開放許可聲明的，應當提供專利權評價報告。”A選項正確 ，B選項錯誤。 《專利法》第50條第2款規定：“專利權人撤回開放許可聲明的，應當以書面方式提出，並由國務院專利行政部門予以公告。開放許可聲明被公告撤回的，不影響在先給予的開放許可的效力。”C選項錯誤，D選項正確 。"}, {"id": "卷一-87", "subject": "卷一", "type": "單選題", "question": "2018年7月，某網絡科技公司發布信息，稱其擁有在中國網絡獨家傳播電影《一隻小狗》的權利，並已經專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 31 取得信息網絡傳播權專有許可。另外，為保障付費用戶點播和下載該電影的權利，公司採取了專門的技術措施。根據2021年6月1日起施行的《著作權法》規定，下列行為沒有侵犯網絡科技公司權利的是：（）", "options": [{"key": "A", "text": "未經網絡公司許可，王某付費下載該電影後，上傳至其他視頻網站供他人免費點播"}, {"key": "B", "text": "為提升該電影關注度，未經網絡公司許可，某電視台在採訪中將該電影中20秒的畫面作為背景，並將釆訪內容置於其網站供用戶點播"}, {"key": "C", "text": "某電視台下載該電影後，為提高收視率，未經網絡公司許可將其剪輯成20分鐘的宣傳片，並在“影視展覽 ”欄目中使用"}, {"key": "D", "text": "未經網絡公司許可，張某破解了技術措施，並通過社交平台公開傳播該電影的網絡地址，致使多人在未付費的情形下通過點擊該地址免費點播或下載該電影"}], "answer": ["B"], "explanation_full": "【羿文解析】《著作權法》第24條規定：“在下列情況下使用作品，可以不經著作權人許可，不向其支付報酬，但應當指明作者姓名或者名稱、作品名稱，並且不得影響該作品的正常使用，也不得不合理地損害著作權人的合法權益：……（二）為介紹、評論某一作品或者說明某一問題，在作品中適當引用他人已經發表的作品……”B選項正確。"}, {"id": "卷一-88", "subject": "卷一", "type": "多選題", "question": "某商業銀行違反審慎經營規則，造成資本和資產狀況惡化，嚴重危及穩健運行，損害存款人和其他客戶合法權益。對此，銀行業監督管理機構對該銀行依法可釆取的措施是：（　　）", "options": [{"key": "A", "text": "限制分配紅利和其他收入"}, {"key": "B", "text": "限製工資總額"}, {"key": "C", "text": "責令調整高級管理人員"}, {"key": "D", "text": "責令減員增效"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】根據《銀行業監督管理法》第37條的規定，銀行業金融機構違反審慎經營規則的，國務院銀行業監督管理機構或者其省一級派出機構應當責令限期改正；逾期未改正的，或者其行為嚴重危及該銀行業金融機構的穩健運行、損害存款人和其他客戶合法權益的，經國務院銀行業監督管理機構或者其省一級派出機構負責人批准，可以區別情形，採取下列措施：（1）責令暫停部分業務、停止批准開辦新業務；（2）限制分配紅利和其他收入；（3）限制資產轉讓；（4）責令控股股東轉讓股權或者限制有關股東的權利；（5）責令調整董事、高級管理人員或者限制其權利；（6）停止批准增設分支機構。故AC為正確答案。"}, {"id": "卷一-89", "subject": "卷一", "type": "多選題", "question": "假如白雲區法院採取了保全措施後，張三向長寧區法院起訴了李四，長寧區法院經過審理髮現保全措施錯誤，李四欲起訴張三賠償，李四可以向哪些法院起訴？（）", "options": [{"key": "A", "text": "白雲區法院"}, {"key": "B", "text": "長寧區法院"}, {"key": "C", "text": "海淀區法院"}, {"key": "D", "text": "以上三個法院都可以"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】《民訴解釋》第27條規定，當事人申請訴前保全後沒有在法定期間起訴或者申請仲裁，給被申請人、利害關係人造成損失引起的訴訟，由採取保全措施的人民法院管轄。當事人申請訴前保全後在法定期間內起訴或者申請仲裁，被申請人、利害關係人因保全受到損失提起的訴訟，由受理起訴的人民法院或者採取保全措施的人民法院管轄。本題屬於訴前採取保全措施後起訴，然後保全錯誤侵權的，則採取保全措施的白雲區法院和受理起訴的長寧區法院對保全侵權都有管轄權。被告住所地的海淀區法院對此案沒有管轄權。 AB兩項正確。CD兩項錯誤。"}, {"id": "卷一-90", "subject": "卷一", "type": "多選題", "question": "甲國人特里長期居於乙國，丙國人王某長期居於中國，兩人在北京經營相互競爭的同種產品。特裡不時在互聯網上發布不利於王某的消息，王某在中國法院起訴特裡侵犯其名譽權、肖像權和姓名權。關於該案的法律適用，根據我國相關法律規定，下列選項錯誤的是：（） 32", "options": [{"key": "A", "text": "名譽權的內容應適用中國法律，因為權利人的經常居住地在中國"}, {"key": "B", "text": "肖像權的侵害適用甲國法律，因為侵權人是甲國人"}, {"key": "C", "text": "姓名權的侵害適用乙國法律，因為侵權人的經常居所地在乙國"}, {"key": "D", "text": "網絡侵權應當適用丙國法律，因為被侵權人是丙國人"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】人格權具體包括：生命權、身體權、健康權、人身自由權、隱私權、名譽權、名稱權、姓名權 、肖像權等等。《涉外民事關係法律適用法》第15條規定，人格權的內容，適用權利人經常居所地法律。所以A選項正確。第46條規定，通過網絡或者採用其他方式侵害姓名權、肖像權、名譽權、隱私權等人格權的 ，適用被侵權人經常居所地法律。所以BCD錯誤。"}, {"id": "卷一-91", "subject": "卷一", "type": "單選題", "question": "甲市的A水利建設項目準備在該市規劃範圍內通過劃撥方式取得國有建設用地使用權，其根據相關法律規定應當向有關部門報經核准。負責該項目的建設單位欲辦理以下手續：①向當地自然資源部門申請用地，經當地政府批准後，由自然資源部門劃撥土地；②向當地規劃部門提建設用地規劃許可申請，規劃部門受理後依法發放建設用地規劃許可證；③向當地規劃部門申請核發選址意見書；④水利建設項目依規定報有關部門核准。關於手續辦理的先後順序，下列符合《城鄉規劃法》規定的是：（）", "options": [{"key": "A", "text": "④③①②"}, {"key": "B", "text": "②①"}, {"key": "C", "text": "④齡①"}, {"key": "D", "text": "③④①②"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《城鄉規劃法》第36條規定：“按照國家規定需要有關部門批准或者核准的建設項目，以劃撥方式提供國有土地使用權的，建設單位在報送有關部門批准或者核准前，應當向城鄉規劃主管部門申請核發選址意見書。前款規定以外的建設項目不需要申請選址意見書。”第37條：“在城市、鎮規劃區內以劃撥方式提供國有土地使用權的建設項目，經有關部門批准、核准、備案後，建設單位應當向城市、縣人民政府城鄉規劃主管部門提出建設用地規劃許可申請，由城市、縣人民政府城鄉規劃主管部門依據控制性詳細規劃核定建設用地的位置、面積、允許建設的範圍，核發建設用地規劃許可證。建設單位在取得建設用地規劃許可證後，方可向縣級以上地方人民政府土地主管部門申請用地，經縣級以上人民政府審批後，由土地主管部門劃撥土地。”B選項正確。"}, {"id": "卷一-92", "subject": "卷一", "type": "單選題", "question": "2017年12月，甲公司職工劉某因工負傷，因甲公司未繳納工傷保險費，劉某住院後，由甲公司先行墊付醫藥費，並支付了相應的誤工護理費。2018年2月12日，甲公司被受理破產申請，但甲公司尚未向劉某支付傷殘賠償金和住院期間的工資待遇。關於管理人的撤銷權和劉某的債權，下列說法正確的是:（）", "options": [{"key": "A", "text": "管理人可撤銷墊付醫藥費"}, {"key": "B", "text": "管理人可撒銷賠償誤工費"}, {"key": "C", "text": "勞動者有權在債權人會議行使表決權"}, {"key": "D", "text": "如劉某未申報債權，則不能參加破產清償"}], "answer": ["C"], "explanation_full": "【羿文解析】《企業破產法》第32條規定，人民法院受理破產申請前6個月內，債務人有本法第2條第1款規定的情形，仍對個別債權人進行清償的，管理人有權請求人民法院予以撤銷。但是，個別清償使債務人財產受益的除外。《破產法解釋（二）》第16條規定，債務人對債權人進行的以下個別清償，管理人依據企業破產法第32條的規定請求撤銷的，人民法院不予支持：債務人支付勞動報酬、人身損害賠償金的……甲公司支付給劉某的醫藥費、誤工費等都屬於人身損害賠償金，不能撤銷，A、B項錯誤。《企業破產法》第82條規定 33 補助、撫恤費用，所欠的應當劃入職工個人賬戶的基本養老保險、基本醫療保險費用，以及法律、行政法規規定應當支付給職工的補償金，不必申報，由管理人調查後列出清單並予以公示。職工對清單記載有異議的 ，可以要求管理人更正；管理人不予更正的，職工可以向人民法院提起訴訟。因此，劉某所享有的工資債權是無需申報的，D項錯誤。需要注意的是，無須申報的職工債權不包括因工傷而產生的傷殘賠償金等。因此 ，就傷殘賠償金等債權，劉某應該進行申報。"}, {"id": "卷一-93", "subject": "卷一", "type": "多選題", "question": "關於股東行使利潤分配請求權，下列說法正確的是：（　）", "options": [{"key": "A", "text": "股東請求公司分配利潤案件，應當列公司為被告"}, {"key": "B", "text": "一審法庭辯論終結前，其他股東基於同一分配方案請求分配利潤並申請參加訴訟的，應當列為共同原告"}, {"key": "C", "text": "股東提起利潤分配請求權之訴，應提交栽明具體分配方案的股東會或者股東大會決議"}, {"key": "D", "text": "股東未提交載明具體分配方案的股東會或者股東大會決議，人民法院只能駁回其訴訟請求"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】《公司法解釋（四）》第13條規定：“股東請求公司分配利潤案件，應當列公司為被告。一審法庭辯論終結前，其他股東基於同一分配方案請求分配利潤並申請參加訴訟的，應當列為共同原告。”故A、 B選項正確。《公司法解釋（四）》第15條規定：“股東未提交載明具體分配方案的股東會或者股東大會決議 ，請求公司分配利潤的，人民法院應當駁回其訴訟請求，但違反法律規定濫用股東權利導致公司不分配利潤 ，給其他股東造成損失的除外。”故C選項正確，D選項錯誤。"}, {"id": "卷一-94", "subject": "卷一", "type": "單選題", "question": "共同居住在上海的中國男子王某和新加坡男子傑克欲在中國登記結婚，遭到拒絕後到英國倫敦辦理的婚姻登記。後兩人因感情不和到中國法院訴訟離婚，並要求分割財產，關於該離婚案件，以下說法正確的是 ：（　　）", "options": [{"key": "A", "text": "關於雙方能否結婚應適用婚姻登記地英國的法律"}, {"key": "B", "text": "判斷婚姻的效力應適用雙方共同居所地中國的法律"}, {"key": "C", "text": "雙方財產的分割應適用法院地中國的法律"}, {"key": "D", "text": "王某和傑克的行為構成國際私法上的法律規避行為"}], "answer": ["B"], "explanation_full": "【羿文解析】A．B項，婚姻效力適用婚姻當事人共同居所地法，然後是共同國籍國法，只有都沒有才是婚姻登記地法，A錯誤，B正確。C項，財產分割當事人可以選擇，沒有選擇的適用共同經常居所地法，C錯誤。D項 ，兩人的行為雖然規避了我國婚姻法上的強制性規定，但是這個強制性規定並不是效力性強制性規定，因此不是國際私法上的法律規避行為，D錯誤。"}, {"id": "卷一-95", "subject": "卷一", "type": "單選題", "question": "甲有一塊價值一萬元的玉石。甲與乙訂立了買賣該玉石的合同，約定價金11，000元。由於乙沒有帶錢 ，甲未將該玉石交付與乙，約定三日後乙到甲的住處付錢取玉石。隨後甲又向乙提出，再借用玉石把玩幾天 ，乙表示同意。隔天，知情的丙找到甲，提出願以12，000元購買該玉石，甲同意並當場將玉石交給丙。丙在回家路上遇到債主丁，向丙催要9，000元欠款甚急，丙無奈，將玉石交付與丁抵償債務。後丁將玉石丟失被戊拾得，戊將其轉賣給己。關於丙、丁對該玉石所有權的取得問題，下列說法正確的是：（　　）", "options": [{"key": "A", "text": "甲將玉石交付給丙時，丙取得該玉石的所有權"}, {"key": "B", "text": "甲、丙的買賣合同成立時，丙取得該玉石的所有權"}, {"key": "C", "text": "丙將玉石交給丁時，丁取得該玉石的所有權"}, {"key": "D", "text": "丁不能取得該玉石的所有權"}], "answer": ["C"], "explanation_full": "【羿文解析】《民法典》第311條規定：“無處分權人將不動產或者動產轉讓給受讓人的，所有權人有權追回 34 意取得的構成要件，故丙無權取得該玉石的所有權。故選項AB錯誤。本題中，丙為抵債將玉石交付與丁，丁對丙並無玉石所有權的事實不知情，為善意第三人，丁取得玉石所有權，故選項C正確，D錯誤。因此本題正確答案為C。"}, {"id": "卷一-96", "subject": "卷一", "type": "多選題", "question": "2016年9月1日，某法院受理了湘西服裝公司的破產申請並指定了管理人，管理人開始受理債權申報。下列屬於可以申報的債權的是：（　）", "options": [{"key": "A", "text": "甲公司的設備餘款給付請求權，但根據約定該餘款的支付時間為2016年10月30日"}, {"key": "B", "text": "乙公司請求湘西公司加工一批服裝的合同履行請求權"}, {"key": "C", "text": "丙銀行的借款償還請求權，但該借款已經設定財產抵押擔保"}, {"key": "D", "text": "當地稅務機關對湘西公司作出的8萬元行政處罰決定"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】《企業破產法》第46條第1款規定：“未到期的債權，在破產申請受理時視為到期。”甲公司的設備餘款給付請求權，屬於破產債權，雖然該債權未到期，但是在破產申請時視為到期，甲公司可以就此向管理人申報債權。故A項正確。 《企業破產法》第18條規定：“人民法院受理破產申請後，管理人對破產申請受理前成立而債務人和對方當事人均未履行完畢的合同有權決定解除或者繼續履行，並通知對方當事人。管理人自破產申請受理之日起二個月內未通知對方當事人，或者自收到對方當事人催告之日起三十日內未答覆的，視為解除合同。管理人決定繼續履行合同的，對方當事人應當履行；但是，對方當事人有權要求管理人提供擔保。管理人不提供擔保的，視為解除合同。”據此可知，法院在受理湘西服裝公司的破產申請後，管理人對破產申請受理前與乙公司成立但目前還未履行完畢的服裝加工合同，有權決定解除或繼續履行。乙公司無權單方請求湘西公司繼續履行，因而該請求也不屬於破產債權。故B項錯誤。 《企業破產法》第59條第3款規定：“對債務人的特定財產享有擔保權的債權人，未放棄優先受償權利的，對於本法第六十一條第一款第七項、第十項規定的事項不享有表決權。”據此可知，對債務人的特定財產享有擔保的債權，依然屬於破產債權，可以向管理人進行申報。故C項正確。對債務人的罰款等財產性行政處罰 ，不得申報。在企業破產清算的情況下，債務人財產最終將歸屬於債權人，此時若執行對債務人的財產性行政處罰，事實上處罰的是債權人，這樣既不能達到行政處罰的目的，也損害了債權人的合法權益。但是，在破產程序終結後，如果債務人因重整或和解繼續存續，處罰機關可以根據情況，決定是否執行原來的處罰決定。故D項錯誤。"}, {"id": "卷一-97", "subject": "卷一", "type": "單選題", "question": "少年時代公司因不能清償到期債務，被債權人申請破產，法院受理後指定甲為管理人。以下關於取回權的哪一說法是正確的？", "options": [{"key": "A", "text": "權利人作為託運人行使取回權時，甲可以以權利人未支付相關託運費為由拒絕其取回財產"}, {"key": "B", "text": "權利人依據仲裁機關的生效法律文書向甲主張取回所涉爭議財產時，甲可以以該文書錯誤為由拒絕其取回財產"}, {"key": "C", "text": "該公司尚未收到出賣人發送出來的買賣標的物，即便甲決定支付全部價款，出賣人也可以取回該在運途中的標的物"}, {"key": "D", "text": "公司占有的他人財產毀損、滅失，因此獲得的賠償金、代償物，權利人可以主張取回"}], "answer": ["A"], "explanation_full": "【羿文解析】A項正確，權利人行使取回權時未依法向管理人支付相關的加工費、保管費、託運費、委託費、 35 然後判斷，不能一概而論。"}, {"id": "卷一-98", "subject": "卷一", "type": "多選題", "question": "甲訴乙侵權糾紛案，甲市A縣法院進行了審理並作出駁回甲訴訟請求的判決，甲未提出上訴。判決生效後 ，甲因收集到新證據而申請再審。下列哪些選項是正確的？", "options": [{"key": "A", "text": "甲可以向甲市A縣法院申請再審"}, {"key": "B", "text": "甲可以向甲市中級人民法院申請再審"}, {"key": "C", "text": "若甲市A縣法院決定再審，法院應當適用一審程序再審"}, {"key": "D", "text": "若甲市中級人民法院決定再審，法院應當適用二審程序再審"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】申請再審：1.管轄法院：原則上一級法院，當事人一方人數眾多或者當事人雙方為公民的案件 ，也可以向原審人民法院申請再審。2.用何種程序進行再審，取決於由哪個法院負責再審若再審法院是原審法院：①原生效裁判是一審法院作出的，適用第一審程序進行再審（原一還一），再審後作出的判決、裁定可以上訴②原生效裁判是二審法院作出的，適用第二審程序進行再審（原二還二），再審後作出的判決、裁定為終審裁判，不可以上訴。若再審法院為上級法院，適用第二審程序進行審理，所作裁判為終審裁判，不得上訴。ABCD均正確。"}, {"id": "卷一-99", "subject": "卷一", "type": "單選題", "question": "楊某生有子女三個。長子甲與楊某一起共同生活，多次與楊某交涉希望其將名下的房屋過戶給自己，並承諾將贍養楊某直至楊某去世。楊某念及長子甲一向對自己不錯。遂於2014年8月1日將房產過戶給甲。從此以後，甲對楊某不理不睬，甚至時常對楊某拳腳相加。楊某傷心欲絕，欲要回房屋，向張律師咨詢。關於張律師的答覆，下列說法正確的有？（）", "options": [{"key": "A", "text": "楊某雖然已將房屋過戶給甲，但仍可以行使任意撤銷權要回房屋"}, {"key": "B", "text": "楊某雖然已將房屋過戶給甲，但仍可以行使法定解除權要回房屋"}, {"key": "C", "text": "楊某可以自知道或應當知道撤銷原因之日起6個月內撤銷贈與要回房屋"}, {"key": "D", "text": "楊某可以基於甲不履行對自己的扶養義務而撤銷贈與要回房屋"}], "answer": ["D"], "explanation_full": "【羿文解析】本題綜合考查贈與合同的任意撤銷權和法定撤銷權，難度較大，錯誤率較高。受贈人不履行對贈與人的扶養義務的，贈與人可行使法定撤銷權。且該撤銷權的行使期限為自知道或應當知道撤銷原因之日起1年內行使。據此可知，C項錯誤，不當選。D項正確，當選。同時，本題中，楊某已將房屋過戶給甲，不得再行使任意撤銷權，故A項錯誤，不當選。此時，楊某也不符合行使法定解除權的情形，故B項亦錯誤，不當選。綜上所述．本題的正確答案為D。"}, {"id": "卷一-100", "subject": "卷一", "type": "多選題", "question": "甲14歲，甲的父親因車禍身亡，母親乙領取了包含甲的生活費在內的賠償款後，未再與甲共同生活，甲與其祖父母共同生活，教育、醫療等費用也由其祖父母支付。甲的祖父母要求乙返還甲的生活費被乙告知已挪作他用。就此，關於監護問題下列說法正確的是？（）", "options": [{"key": "A", "text": "乙是甲的監護人"}, {"key": "B", "text": "甲的祖父母是甲的監護人．有權要求乙歸還甲的生活費"}, {"key": "C", "text": "甲的祖父母可以向法院申請撤銷乙的監護人資格"}, {"key": "D", "text": "監護人發生變更的．監護人只能是甲的近親屬或關係密切的其他親屬、朋友"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】父母是子女的第一順位的監護人，故選項A正確，選項B錯誤。乙作為甲的監護人，應履行監護職責，保護被監護人人身、財產及其他合法權益。《民法典》第36條規定了撤銷監護人資格的情形，監護人有規定的情形的．法院有權根據有關個人或者組織的申請，撤銷其監護人資格。故選項C正確。選項D涉及未成年人監護的規定。其監護人並不限於近親屬或關係密切的其他親屬、朋友，還可以由單位或者居民委員會 、村民委員會或者民政部門擔任監護人。本題答案為AC。 36"}, {"id": "卷二-1", "subject": "卷二", "type": "單選題", "question": "長江公司向甲銀行借款300萬元，以自有汽車設立抵押權，未辦理抵押登記。向乙銀行借款200萬元，同樣以該汽車設立抵押權，並辦理抵押登記。再向丙銀行借款500萬元，以該汽車設立抵押權，辦理登記。後甲銀行與乙銀行協議變更抵押順位，並辦理變更登記，丙銀行對此不知情。因長江公司無力償債，法院拍賣房屋 ，得款600萬元。關於三家銀行對該價款的分配，下列哪一選項是正確的？", "options": [{"key": "A", "text": "甲銀行300萬元，乙銀行200萬，丙銀行100萬"}, {"key": "B", "text": "甲銀行200萬，丙銀行400萬，乙銀行得不到受償"}, {"key": "C", "text": "甲銀行得不到受償，乙銀行200萬，丙銀行400萬"}, {"key": "D", "text": "甲銀行得不到受償，乙銀行100萬，丙銀行500萬"}], "answer": ["B"], "explanation_full": "【羿文解析】①確立抵押權順位的依據。《民法典》第414條第1款規定：“同一財產向兩個以上債權人抵押的，拍賣、變賣抵押財產所得的價款依照下列規定清償：（一）抵押權已登記的，按照登記的時間先後確定清償順序；（二）抵押權已登記的先於未登記的受償；（三）抵押權未登記的，按照債權比例清償。”據此 ，甲、乙、丙對汽車抵押權的順位是：乙第一順位；丙第二順位；甲第三順位。 ②抵押權順位的變更規則。《民法典》第409條第2款規定：“抵押權人可以放棄抵押權或者抵押權的順位。 抵押權人與抵押人可以協議變更抵押權順位以及被擔保的債權數額等內容，但是抵押權的變更，未經其他抵押權人書面同意，不得對其他抵押權人產生不利影響。”本題中，甲和乙協議交換（變更）他們的抵押權順位，根據通說觀點，該變更只需兩個要件：（a）甲、乙達成合意；（b）辦理抵押權順位的變更登記。可見 ，甲、乙協議交換（變更）抵押權的順位無須經過丙的同意。經過這一變更，抵押權順位變成了甲第一順位 ;丙第二順位；乙第三順位。 ③順位變更後，變更的效力如何呢？根據《民法典》第409條第1款：（a）如果變更經過了丙的書面同意，因變更對丙產生的不利影響對丙發生效力。也就是房屋變賣所得的價款依序按照甲第一順位、丙第二順位、乙第三順位分配。（b）如果變更沒有經過丙的書面同意，因甲、乙順位變更對丙產生的不利影響對丙不發生效力。 ④本題中，甲、乙變更順位對丙產生了不利影響。本來乙第一順位，丙的500萬元的債權可以受償400萬；現在將甲變更為第一順位，若甲作為第一順位清償300萬元，則丙只能分得300萬元。 ⑤因甲、乙變更順位未經丙的書面同意，故因變更產生的不利影響不能對丙發生效力。房屋拍賣所得的600萬元應這樣分配：甲作為第一順位分配200萬元（甲剩餘的100萬元債權成為無擔保的普通債權）；丙作為第二順位分配400萬元；乙作為第三順位不能分得。故本題唯一正確答案為B選項。 綜上，本題正確答案為B選項。"}, {"id": "卷二-2", "subject": "卷二", "type": "單選題", "question": "甲工廠排放了大量含有重金屬的廢水，污染了其下游A村的水源，導致A村村民乙飼養的魚大量死亡。現雙方產生糾紛，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "甲工廠應舉證證明，其排污行為與村民乙飼養的魚大量死亡的結果之間不存在因果關係"}, {"key": "B", "text": "甲工廠可以排污符合地方污染物排放標準為由主張不承擔責任"}, {"key": "C", "text": "村民乙應當自其實際受到損害之日起3年內提起訴訟"}, {"key": "D", "text": "甲工廠可以第三人的過錯污染環境造成損害為由主張不承擔責任或者減輕責任"}], "answer": ["A"], "explanation_full": "【羿文解析】因污染環境發生糾紛，實行舉證責任倒置。《民法典》第1230條規定：“因污染環境、破壞生態發生糾紛，行為人應當就法律規定的不承擔責任或者減輕責任的情形及其行為與損害之間不存在因果關係承擔舉證責任。”故A項說法正確。《最高人民法院關於審理環境侵權責任糾紛案件適用法律若干問題的解釋 》第1條規定：“因污染環境、破壞生態造成他人損害，不論侵權人有無過錯，侵權人應當承擔侵權責任。侵權人以排污符合國家或者地方污染物排放標準為由主張不承擔責任的，人民法院不予支持。”故B項說法錯誤 1 解釋》第5條第3款規定：“侵權人以第三人的過錯污染環境、破壞生態造成損害為由主張不承擔責任或者減輕責任的，人民法院不予支持。”故D項說法錯誤。"}, {"id": "卷二-3", "subject": "卷二", "type": "單選題", "question": "孫某是海洋公司的法定代表人，李某是大地公司的法定代表人。海洋公司與大地公司簽訂了一份采購合同 ，采購合同最後一條約定：“大地公司的法定代表人對大地公司支付海洋公司的貨款承擔連帶責任。”孫某和李某分別作為兩公司的法定代表人簽訂合同。2個月後，李某在大地公司的一項業務中失職，被董事會解除職務，公司法定代表人由王某擔任。海洋公司在將貨物交於大地公司之後，大地公司一直以該合同是李某與海洋公司簽訂，其已被公司解職，不能代表公司為由拒絕支付貨款，而海洋公司則因得不到貨款便請求王某承擔連帶責任。下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "大地公司拒絕支付海洋公司貨款的理由成立"}, {"key": "B", "text": "如果采購合同最後一條為格式條款，該條款無效"}, {"key": "C", "text": "李某作為法定代表人在該合同的簽字僅僅是代表公司的行為"}, {"key": "D", "text": "王某不需要承擔連帶責任"}], "answer": ["D"], "explanation_full": "【羿文解析】《民法典》第61條規定：“依照法律或者法人章程的規定，代表法人從事民事活動的負責人 ，為法人的法定代表人。法定代表人以法人名義從事的民事活動，其法律後果由法人承受。法人章程或者法人權力機構對法定代表人代表權的限制，不得對抗善意相對人。”第62條規定：“法定代表人因執行職務造成他人損害的，由法人承擔民事責任。”法定代表人的行為歸屬於法人，法定代表人的變更不影響法人行為的效力。李某在被解職之前與海洋公司簽訂的合同有效，大地公司應該承擔支付貨款的義務。所以A項錯誤。 《民法典》第497條規定，有下列情形之一的,該格式條款無效：（一）具有本法第一編第六章第三節和本法第五百零六條規定的無效情形；（二）提供格式條款一方不合理地免除或者減輕其責任、加重對方責任、限制對方主要權利；（三）提供格式條款一方排除對方主要權利。本題中，該合同條款不存在《民法典》規定的無效的情況，因此該條的約定合法有效。所以B項錯誤。 大地公司法定代表人李某的簽字既代表公司，也代表自己。故C項錯誤。 李某在合同上的簽名可以認定為是根據合同要求作為法定代表人代表大地公司簽字，同時也可以認定為系李某個人對合同內容中連帶責任的確認。但李某個人對合同中關於連帶責任的確認僅對李某有效，不能推及到所有的法定代表人。當糾紛訴至法院時大地公司的法定代表人已經變更為王某，而王某本人並未在合同上簽字，因此，王某不需要承擔連帶責任。所以D項正確。"}, {"id": "卷二-4", "subject": "卷二", "type": "單選題", "question": "甲男與乙女於2011年10月結婚。婚前甲有一套價值100萬元房屋，乙有30萬元的存款。2011年11月，甲通過遺囑繼承了其母親的一處房產，遺囑稱房屋只歸甲所有。2012年2月，乙在一次車禍中，遭受重傷，獲得10萬元賠償金。在乙受傷後，有許多親朋好友來探望，共收禮金1萬多元。甲婚前的房屋婚後增值了20萬元；將繼承的房屋出租，後來獲得租金3萬元。乙將自己婚前的30萬元投資購買了某基金，獲利8萬元。後來，甲與乙感情不和離婚，在離婚前甲出版了小說《小三兒》，離婚後第二天獲得稿酬。對此，下列哪個表述是正確的 ？（　）", "options": [{"key": "A", "text": "甲婚前的房屋與婚後繼承其母親的房屋均是甲的個人財產，婚前房屋增值20萬元與繼承的房屋出租獲得的租金也均為個人財產"}, {"key": "B", "text": "甲出版小說的稿酬屬於個人財產"}, {"key": "C", "text": "乙因車禍而獲得的賠償金是個人財產，受傷後獲得的禮金也是個人財產"}, {"key": "D", "text": "乙投資基金所得是個人財產"}], "answer": ["A"], "explanation_full": "【羿文解析】婚前財產均屬於個人，個人財產的自然增值和孳息均屬於個人財產，據此，A項正確，當選。甲出版小說的收入是屬於明確可以取得的知識產權收益，屬於共同財產，故B項錯誤。乙因車禍獲得的人身傷害賠償金是屬於個人的，但是，受傷後接受的禮金，是贈與所得，當贈與人沒有明確只給個人時，就是共同財產，本題中贈與人沒有聲明給個人，故視為共同財產，故C項錯誤。乙投資基金所得，是婚前財產在婚後產生的投資收益，不是自然增值和孳息，因此應當視為共同財產，故D項錯誤。 2"}, {"id": "卷二-5", "subject": "卷二", "type": "單選題", "question": "寧某與蘇某相戀結婚，寧某入贅蘇家，蘇某向寧某支付結婚彩禮現金20萬元。婚後不久，蘇某因寧某不遵男德要求離婚並主張返還彩禮，下列哪一說法是正確的？", "options": [{"key": "A", "text": "蘇某可以不主張離婚僅要求返還彩禮"}, {"key": "B", "text": "蘇某要求返還彩禮的主張不可能得到支持"}, {"key": "C", "text": "若二人已共同生活則不得要求返還彩禮"}, {"key": "D", "text": "若二人未共同生活則可以要求返還彩禮"}], "answer": ["D"], "explanation_full": "【羿文解析】①《民法典婚姻家庭編解釋（一）》第5條規定：“當事人請求返還按照習俗給付的彩禮的，如果■明屬於以下情形，人民法院應當予以支持（一）雙方未辦理結婚登記手續;（二）雙方辦理結婚登記手續但確未共同生活；（三）婚前給付並導致給付人生活困難。適用前款第二項、第三項的規定，應當以雙方離婚為條件。” ②因寧某與蘇某已經結婚，就給付的彩禮，須以雙方離婚為前提條件，蘇某對寧某才能享有返還請求權。故 A選項錯誤。 ③對於蘇某向寧某給付的彩禮，即使雙方已經結婚，若雙方離婚且符合法定條件，亦可主張返還所給付的彩禮。故B選項錯誤。 ④蘇某與寧某結婚且已共同生活，若雙方離婚，且蘇某因婚前支付彩禮導致其生活困難的，蘇某仍有權請求寧某返還彩禮。C選項的表述未考慮此種情形，以偏概全。故C選項錯誤。 ⑤寧某與蘇某雖已經結婚，但若雙方離婚，且未共同生活的，蘇某有權請求寧某返還給付的彩禮。故D選項正確。 綜上，本題正確答案為D選項。"}, {"id": "卷二-6", "subject": "卷二", "type": "單選題", "question": "王甲兩歲，在幼兒園入托。一天，本該在睡午覺的王甲偷溜出來玩水，將幼兒園送貨的劉某衣服弄濕，劉某便打了王甲一記耳光，造成王甲左耳失聰。王甲的父親擬代兒子向法院起訴。關於本案被告的確定，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "劉某是本案唯一的被告"}, {"key": "B", "text": "幼兒園是本案唯一的被告"}, {"key": "C", "text": "劉某和幼兒園是本案共同被告"}, {"key": "D", "text": "劉某是本案被告，幼兒園是本案無獨立請求權第三人"}], "answer": ["C"], "explanation_full": "【羿文解析】《民法典》第1201條規定，無民事行為能力人或者限制民事行為能力人在幼兒園、學校或者其他教育機構學習、生活期間，受到幼兒園、學校或者其他教育機構以外的第三人人身損害的，由第三人承擔侵權責任；幼兒園、學校或者其他教育機構未盡到管理職責的，承擔相應的補充責任。幼兒園、學校或者其他教育機構承擔補充責任後，可以向第三人追償。本案中，劉某作為校外人員，實施了致傷王甲的行為，應當為自己的行為負責，承擔侵權責任。幼兒園未盡職責範圍內的相關義務致使未成年人遭受人身損害，也應當承擔與其過錯相應的補充責任。故本案中劉某和幼兒園皆為被告，C應選。"}, {"id": "卷二-7", "subject": "卷二", "type": "單選題", "question": "楊某為躲避債務不辭而別消失6年，其妻張某向法院申請宣告楊某死亡。其後張某與李某結婚，一年後李某死亡。8年後，楊某回歸。下列哪一關於楊某與張某的夫妻關係的說法是正確的", "options": [{"key": "A", "text": "楊某下落不明之日，楊某與張某的婚姻關係消滅"}, {"key": "B", "text": "法院宣判楊某死亡之日，楊某、張某的婚姻關係消滅"}, {"key": "C", "text": "法院撤銷楊某的死亡宣告判決時，楊某、張某的婚姻關係自行恢復"}, {"key": "D", "text": "若張某未曾再婚，法院撤銷楊某的死亡宣告判決之後，楊某、張某的婚姻關係一定自行恢復"}], "answer": ["B"], "explanation_full": "3 復。D項錯誤,若張某向婚姻登記機關作出聲明，則即便張某未曾再婚，張某與楊某的婚姻關係也不會自行恢復。"}, {"id": "卷二-8", "subject": "卷二", "type": "單選題", "question": "下列不屬於不當得利返還例外的是？（　）", "options": [{"key": "A", "text": "為履行道德義務進行的給付"}, {"key": "B", "text": "債務到期之前的清償"}, {"key": "C", "text": "明知無給付義務而進行的債務清償"}, {"key": "D", "text": "不知道且不應當知道獲得的利益沒有法律根據的善意得利人進行的給付"}], "answer": ["D"], "explanation_full": "【羿文解析】依據《民法典》第985條的規定，得利人沒有法律根據取得不當利益的，受損失的人可以請求得利人返還取得的利益，但是有下列情形之一的除外：（一）為履行道德義務進行的給付；（二）債務到期之前的清償；（三）明知無給付義務而進行的債務清償。選項ABC均正確。依據《民法典》第986條的規定，善意得利人僅在獲得的利益已經不存在時，不承擔返還該利益的義務。故選項D錯誤。本題正確答案為D。"}, {"id": "卷二-9", "subject": "卷二", "type": "單選題", "question": "2019年4月15日．甲公司與乙公司簽訂1年材料采購合同．總貨款200萬元於2020年4月15日前交付。丙公司為甲公司提供保證。與乙公司訂立保證合同。保證期間為1年。禁止債權轉讓。2019年12月113，乙公司為融通資金，將其對甲公司債權中的50萬元移轉給丁公司．該轉讓取得丙公司經理的1：3頭同意。2020年4月1日 ，甲公司仍無法全部還款．經過與乙公司協商。將100萬元債務轉移給戊公司，且戊公司加入乙對甲的50萬元債權中，對價是甲公司某處廠房3個月使用權，丙公司對以上變動並不知情。對於此案，下列說法正確的是 ？（　）", "options": [{"key": "A", "text": "丙保證丁對甲的50萬元債權"}, {"key": "B", "text": "丙保證乙對戊的100萬元債權"}, {"key": "C", "text": "丙保證乙對甲的50萬元債權"}, {"key": "D", "text": "丙保證乙對戊的50萬元債權"}], "answer": ["C"], "explanation_full": "【羿文解析】本題涉及保證中的債權讓與和債務承擔規則。《民法典》第696條：“債權人轉讓全部或者部分債權，未通知保證人的。該轉讓對保證人不發生效力。保證人與債權人約定禁止債權轉讓．債權人未經保證人書面同意轉讓債權的。保證人對受讓人不再承擔保證責任。”本案中保證合同禁止債權讓與，在未取得丙公司書面同意的情形下。丙公司對丁公司的債權不再承擔保證責任，A錯誤。《民法典》第697條：“債權人未經保證人書面同意．允許債務人轉移全部或者部分債務，保證人對未經其同意轉移的債務不再承擔保證責任，但是債權人和保證人另有約定的除外。第三人加入債務的。保證人的保證責任不受影響。”乙未經丙書面同意便允許甲與戊的債務移轉，對移轉的債務，丙不再承擔保證責任，B錯誤。戊參與到乙對甲的50萬債權中，丙的保證責任不受影響，被保證人是甲而非戊，故C正確，D錯誤。"}, {"id": "卷二-10", "subject": "卷二", "type": "單選題", "question": "王某因生意上暫時困境，急需10萬元人民幣．其找到周某借錢。周某要求其將價值60萬元的房屋以12萬元賣給自己，王某被迫答應了周某的要求。隨後，周某又將房屋賣給了不知情的劉某。後來，王某在朋友的建議下向周某主張撤銷房屋買賣合同。對此，下列說法正確的是？（　）", "options": [{"key": "A", "text": "買賣合同顯失公平，可撤銷"}, {"key": "B", "text": "買賣合同已經履行，不可撤銷"}, {"key": "C", "text": "如果合同可撤銷，劉某應將房屋返還給王某"}, {"key": "D", "text": "如果合同可撤銷，周某應將房屋返還給王某"}], "answer": ["A"], "explanation_full": "【羿文解析】周某利用王某急需用錢的困境，以明顯低於市價的價格購得王某的房屋，根據《民法典》第 151條：一方利用對方處於危困狀態、缺乏判斷能力等情形，致使民事法律行為成立時顯失公平的，受損害方有權請求人民法院或者仲裁機構予以撤銷。該情形屬於顯失公平情形，王某可以主張撤銷合同。選項A正確。 4 必要返還的，應當折價補償。周某將房屋出賣給劉某是對房屋的有權處分。所以劉某享有房屋的所有權。劉某與王某之間並無法律關係，所以劉某沒有返還房屋的義務。選項C錯誤。因為周某已經將房屋出賣，無法返還原物，而應該折價補償。選項D錯誤。"}, {"id": "卷二-11", "subject": "卷二", "type": "單選題", "question": "張某在某購物網站上以3500元單價銷售某品牌XVD一100型號電視機，陳某於3月5日在購物網站提交訂單購買了一台該型號電視機，後在線付款3500元。張某收到訂單後於3月6日發貨。陳某在3月9日收到該電視機 ，經查驗電視機無質量問題，陳某在該購物網站上確認收貨。本案中，電子合同何時成立？（　）", "options": [{"key": "A", "text": "陳某下單時合同成立"}, {"key": "B", "text": "陳某付款時合同成立"}, {"key": "C", "text": "張某發貨時合同成立"}, {"key": "D", "text": "陳某確認收貨時合同成立"}], "answer": ["A"], "explanation_full": "【羿文解析】本題考查電子合同的成立時間。根據《民法典》第491條第2款規定，當事人一方通過互聯網等信息網絡發布的商品或者服務信息符合要約要件的，對方選擇該商品或者服務並提交訂單成功時合同成立 ，但是當事人另有約定的除外。本題中，張某所發布的商品信息符合要約要件，陳某於3月5日提交訂單購買電視機，此時電子合同成立。因此，本題正確選項為A。"}, {"id": "卷二-12", "subject": "卷二", "type": "單選題", "question": "下列關於倉儲合同的說法，不正確的是？（　）", "options": [{"key": "A", "text": "倉儲合同是諾成合同，自保管人和存貨人意思表示一致時成立"}, {"key": "B", "text": "倉單是提取倉儲物的憑證。存貨人或者倉單持有人在倉單上背書並經保管人簽字或者蓋章的，可以轉讓提取倉儲物的權利"}, {"key": "C", "text": "倉儲合同的保管人承擔過錯責任。需對保管不善造成的倉儲物毀損、滅失承擔賠償責任"}, {"key": "D", "text": "當事人對儲存期間沒有約定或者約定不明確的，存貨人或者倉單持有人不能隨時提取倉儲物"}], "answer": ["D"], "explanation_full": "【羿文解析】《民法典》第914條規定，當事人對儲存期限沒有約定或者約定不明確的，存貨人或者倉單持有人可以隨時提取倉儲物，保管人也可以隨時請求存貨人或者倉單持有人提取倉儲物，但是應當給予必要的準備時間。故D選項正確。"}, {"id": "卷二-13", "subject": "卷二", "type": "單選題", "question": "甲委託乙購買一套機械設備，但要求以乙的名義簽訂合同，乙同意，遂與丙簽訂了設備購買合同。後由於甲的原因，乙不能按時向丙支付設備款。在乙向丙說明了自己是受甲委託向丙購買機械設備後，關於丙的權利，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "只能要求甲支付"}, {"key": "B", "text": "只能要求乙支付"}, {"key": "C", "text": "可選擇要求甲或乙支付"}, {"key": "D", "text": "可要求甲和乙承擔連帶責任"}], "answer": ["C"], "explanation_full": "【羿文解析】《民法典》第926條規定，受託人以自己的名義與第三人訂立合同時，第三人不知道受託人與委託人之間的代理關係的，受託人因第三人的原因對委託人不履行義務，受託人應當向委託人披露第三人，委託人因此可以行使受託人對第三人的權利。但是第三人與受託人訂立合同時如果知道該委託人就不會訂立合同的除外。受託人因委託人的原因對第三人不履行義務，受託人應當向第三人披露委託人，第三人因此可以選擇受託人或者委託人作為相對人主張其權利，但是第三人不得變更選定的相對人。本題中，丙可依據法律規定選擇甲或乙支付。因此，正確答案應當是C。"}, {"id": "卷二-14", "subject": "卷二", "type": "單選題", "question": "鄭某的戶籍所在地為乙市A區，但其經常居住在甲市A區，鄭某是大昌科技有限公司的小股東，大昌科技有限公司位於甲市F區，後鄭某因為對大昌科技有限公司的利潤分配存在不滿，準備向法院提起訴訟。對該訴訟享有管轄權的法院是哪一個？ 5", "options": [{"key": "A", "text": "甲市F區法院"}, {"key": "B", "text": "甲市A區法院"}, {"key": "C", "text": "乙市A區法院"}, {"key": "D", "text": "乙市A區法院和甲市F區法院均可管轄"}], "answer": ["A"], "explanation_full": "【羿文解析】依據《民事訴訟法》第26條的規定，因公司設立、確認股東資格、分配利潤、解散等糾紛提起的訴訟，由公司住所地人民法院管轄。本題中，公司所在地為甲市F區，因此有管轄權的法院即為甲市F區法院，選項A正確，BCD錯誤。 綜上，本題正確答案為A選項。"}, {"id": "卷二-15", "subject": "卷二", "type": "單選題", "question": "關於民事訴訟法基本原則在民事訴訟中的具體體現，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "當事人有權決定是否委託代理人代為進行訴訟，是訴訟權利平等原則的體現"}, {"key": "B", "text": "當事人均有權委託代理人代為進行訴訟，是處分原則的體現"}, {"key": "C", "text": "原告與被告在訴訟中有一些不同但相對等的權利，是同等原則的體現"}, {"key": "D", "text": "當事人達成調解協議不僅要自願，內容也不得違法，是法院調解自願和合法原則的體現"}], "answer": ["D"], "explanation_full": "【羿文解析】當事人訴訟權利平等原則，指的是民事訴訟法賦予當事人雙方同等的訴訟手段，以保護他們各自的實體權益；法院依法為當事人雙方提供同等的機會，以保障他們行使自己的訴訟權利。處分原則指的是當事人有權在法律規定的範圍內處分自己的民事權利和訴訟權利。同等原則指的是在民事訴訟中，外國或無國籍當事人與中國當事人具有同等的訴訟地位和訴訟權利義務，不因當事人是外國人或無國籍人而限制或擴大其訴訟權利，或者減少或加重其訴訟義務。法院調解自願原則，指的是在民事訴訟過程中，人民法院對民事案件進行調解的前提必須是雙方當事人自願。而法院調解合法原則，指的是人民法院和雙方當事人的調解活動及其協議內容，必須符合法律的規定。A選項中，當事人有權決定是否委託代理人代為進行訴訟，是處分原則的表現，故A選項說法錯誤。B選項中，當事人均有權委託代理人代為進行訴訟，是當事人訴訟權利平等原則的體現，故B選項說法錯誤。C選項中，同等原則針對的是外國人在我國民事訴訟中的相應地位，因此C選項的說法也是錯誤的。本題正確答案應為D。"}, {"id": "卷二-16", "subject": "卷二", "type": "單選題", "question": "2016年，李麗在偶然機遇下學會通過基金理財方式投資，隨著市場發展，李麗決定借款進一步加大投資。 於是，李麗向鄰居王小借款100萬元。雙方約定1個月後返還本金及利息104萬元。不料基金市場大跌，李麗無力按期還款，王小決定向法院起訴。在訴訟中，法院經雙方當事人同意進行調解。關於調解制度，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "該案屬於公開調解案件"}, {"key": "B", "text": "在調解中李麗承認了借款事實，後調解不成，該承認應當作為判決依據"}, {"key": "C", "text": "法院可以根據雙方當事人達成協議的部分先行確認並製作調解書"}, {"key": "D", "text": "如果雙方調解達成協議由李麗返還本金及利息105萬元，法院不應批准"}], "answer": ["C"], "explanation_full": "【羿文解析】A選項：《民訴法解釋》第146條規定：“人民法院審理民事案件，調解過程不公開，但當事人同意公開的除外。”故A選項錯誤，不當選。 B選項：《民訴法解釋》第107條規定：“在訴訟中，當事人為達成調解協議或者和解協議作出妥協而認可的事實，不得在後續的訴訟中作為對其不利的根據，但法律另有規定或者當事人均同意的除外。”故B選項錯誤 ，不當選。 C選項：《民事調解規定》第14條第一款規定：“當事人就部分訴訟請求達成調解協議的，人民法院可以就此先行確認並製作調解書。”故C選項正確，當選。 D選項：調解可以超過訴訟請求。故D選項錯誤，不當選。"}, {"id": "卷二-17", "subject": "卷二", "type": "單選題", "question": "一方起訴歸還某物，勝訴後強制執行時，第三人主張對該物的所有權，提出執行異議被駁回，然後申請再專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 6 審，再審審理認為該物是第三人和原審原告共同所有。此事法院該如何處理？（　）", "options": [{"key": "A", "text": "法院應裁定駁回起訴，並告知其另行提起執行異議之訴"}, {"key": "B", "text": "法院應裁定撤銷原判、發回重審"}, {"key": "C", "text": "先調解，調解不成告知其另行起訴"}, {"key": "D", "text": "先調解，調解不成發回重審"}], "answer": ["B"], "explanation_full": "【羿文解析】本題中，第三人對執行標的的異議被法院駁回，因此只能提起再審，不能再提起第三人撤銷之訴。之後，在再審中，認為該物是第三人和原審原告共同所有，因此之前強制執行該物的判決是錯誤的，法院應裁定撤銷原判、發回重審，故B正確，A、C、D錯誤。本題正確答案為B。"}, {"id": "卷二-18", "subject": "卷二", "type": "單選題", "question": "關於證人的表述，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "王某是未成年人，因此，王某沒有證人資格，不能作為證人"}, {"key": "B", "text": "原告如果要在訴訟中申請證人出庭作證，應當在舉證期限屆滿前提出，並經法院許可"}, {"key": "C", "text": "甲公司的訴訟代理人乙律師是目擊案件情況發生的人，對方當事人丙可以向法院申請乙作為證人出庭作證 ，如法院准許，則乙不得再作為甲公司的訴訟代理人"}, {"key": "D", "text": "李某在法庭上宣讀未到庭的證人的書面證言，該書面證言能夠代替證人出庭作證"}], "answer": ["C"], "explanation_full": "【羿文解析】《民訴證據規定》第67條規定，不能正確表達意思的人，不能作為證人。待證事實與其年齡、 智力狀況或者精神健康狀況相適應的無民事行為能力人和限制民事行為能力人，可以作為證人。所以A選項錯誤。根據《民事訴訟法》第76條規定，證人作證的方式應當是出庭，只有在“確有困難”的情況下才可能允許證人以書面證言、視聽傳輸技術或者視聽資料等方式作證。即便如此，該書面證言仍應當接受質證。因此不能認為書面證言可以代替證人出庭作證，D選項錯誤。《民訴證據規定》第69條第1款規定：“當事人申請證人出庭作證，應當在舉證期限屆滿前向人民法院提交申請書。”所以B選項也是錯誤的。《律師執業行為規範（試行）》第65條規定，律師作為證人出庭作證的，不得再接受委託擔任該案的辯護人或者代理人出庭。 故C選項是正確答案。對於C選項的表述，還可以從所謂“證人優位性”的角度加以理解。"}, {"id": "卷二-19", "subject": "卷二", "type": "單選題", "question": "甲公司以乙公司為被告向法院提起訴訟，要求乙公司支付拖欠的貨款100萬元。在訴訟中，甲公司申請對乙公司一處價值90萬元的房產釆取保全措施，並提供擔保。一審法院在作出財產保全裁定之後發現，乙公司在向丙銀行貸款100萬時已將該房產和一輛小轎車抵押給丙銀行。關於本案，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "一審法院不能對該房產採取保全措施，因為該房產已抵押給丙銀行"}, {"key": "B", "text": "一審法院可以對該房產採取保全措施，但是需要徵得丙銀行的同意"}, {"key": "C", "text": "一審法院可以對該房產採取保全措施，但是丙銀行仍然享有優先受償權"}, {"key": "D", "text": "一審法院可以對該房產釆取保全措施，同時丙銀行的優先受償權喪失"}], "answer": ["C"], "explanation_full": "【羿文解析】《民訴解釋》第157條規定：“人民法院對抵押物、質押物、留置物可以採取財產保全措施，但不影響抵押權人、質權人、留置權人的優先受償權。”因此一審法院仍然可以對乙公司的該處房產採取保全措施，該保全裁定並不影響抵押權人丙銀行的優先受償權。故C選項正確。"}, {"id": "卷二-20", "subject": "卷二", "type": "單選題", "question": "南沙公司與北極公司因購銷合同發生爭議，南沙公司向仲裁委員會申請仲裁，在仲裁中雙方達成和解協議 ，南沙公司向仲裁庭申請撤回仲裁申請。之後，北極公司拒不履行和解協議。下列哪一選項是正確的？（ ）", "options": [{"key": "A", "text": "南沙公司可以根據原仲裁協議申請仲裁"}, {"key": "B", "text": "南沙公司應與北極公司重新達成仲裁協議後，才可以申請仲裁"}, {"key": "C", "text": "南沙公司可以直接向法院起訴"}, {"key": "D", "text": "仲裁庭可以裁定恢復仲裁程序 7"}], "answer": ["A"], "explanation_full": "【羿文解析】《仲裁法》第49條規定：“當事人申請仲裁後，可以自行和解。達成和解協議的，可以請求仲裁庭根據和解協議作出裁決書，也可以撤回仲裁申請。”該法第50條又規定：“當事人達成和解協議，撤回仲裁申請後反悔的，可以根據仲裁協議申請仲裁。”因此A是正確選項，南沙公司可以根據原仲裁協議申請仲裁。"}, {"id": "卷二-21", "subject": "卷二", "type": "單選題", "question": "以下哪一選項中，法院對案件的處理方式正確？", "options": [{"key": "A", "text": "花花訴熊大人身侵權一案，A區法院立案受理後發現自己對案件並無管轄權，遂作出不予受理的裁定"}, {"key": "B", "text": "楊美麗的丈夫王強已經下落不明數年，楊美麗向法院提起訴訟，請求判決二人離婚,法院應予受理"}, {"key": "C", "text": "2020年3月，已經懷有身孕的花花與丈夫爭吵併發生爭執，推操過程中，不幸導致花花流產，同年6月，花花以感情破裂為由向法院提起訴訟，請求法院判令其與丈夫張某離婚並分割共有財產，法院不應受理其起訴"}, {"key": "D", "text": "熊大與熊二因贍養費問題發生爭議並訴至法院，經法院調解後雙方達成協議，在調解書生效後，熊大以調解違反自願原則為由，再次向法院提起訴訟，法院應予受理"}], "answer": ["B"], "explanation_full": "【羿文解析】①法院在立案受理後，發現自己對案件沒有管轄權的，應當裁定移送管轄，選項A的說法錯誤。 ②《民訴解釋》第217條：夫妻一方下落不明，另一方訴至人民法院，只要求離婚，不申請宣告下落不明人失蹤或者死亡的案件，人民法院應當受理，對下落不明人公告送達訴訟文書，因此選項B的說法正確。 ③女方在懷孕期間、分娩後一年內和流產半年內，男方不得提出離婚。選項C中，雖然花花尚處流產後3個月，但女方可以提出離婚，因此法院應當受理花花的起訴，選項C的說法錯誤。 ④調解書生效後不得再次起訴，若熊大認為調解違反自願原則，可以向法院申請再審，而法院不應受理當事人的起訴，選項D的說法錯誤。 綜上，本題的正確答案為B選項。"}, {"id": "卷二-22", "subject": "卷二", "type": "單選題", "question": "下列關於證據交換和質證的表述中，哪一選項是正確的？（　）", "options": [{"key": "A", "text": "證據交換可在審判員的主持下進行，也可由書記員主持進行"}, {"key": "B", "text": "民事訴訟案件在開庭審理前，法院可以組織進行證據交換"}, {"key": "C", "text": "對於當事人逾期提交的證據，法院不得組織質證"}, {"key": "D", "text": "法院依職權調查收集的證據，應由提出異議的當事人與法院進行質證"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《民事訴訟證據規定》第57條的規定，證據交換應當在審判人員的主持下進行由此可知 ，故A選項表述錯誤，不當選；《民事訴訟證據規定》第56條規定，人民法院依照民事訴訟法第一百三十三條第四項的規定，通過組織證據交換進行審理前準備的，證據交換之日舉證期限屆滿。證據交換的時間可以由當事人協商一致並經人民法院認可，也可以由人民法院指定。B選項表述正確，當選。C選項中，根據《民事訴訟法》第65條的規定，當事人逾期提供證據的，法院應責令其說明理由，並根據不同情形可以不予採納該證據或採納該證據但予以訓誡、罰款。因此，逾期提供的證據依然有可能被採納並組織質證，故C選項表述錯誤，不當選。D選項中，根據《民訴證據規定》第62條第3款的規定，人民法院依職權調查收集的證據，由審判人員對調查收集證據的情況進行說明後，聽取當事人的意見，因此無需質證，故D選項表述錯誤，不當選。"}, {"id": "卷二-23", "subject": "卷二", "type": "單選題", "question": "A區甲起訴B區乙，C區法院判決甲勝訴，甲申請C區法院強制執行，執行中甲與乙達成和解協議，法院中止執行，但和解協議部分履行後甲與乙產生爭議，下列說法正確的是？", "options": [{"key": "A", "text": "甲可就和解協議向C區法院起訴"}, {"key": "B", "text": "甲可就和解協議向B區法院起訴"}, {"key": "C", "text": "甲可就和解協議向C區法院申請恢復強制執行"}, {"key": "D", "text": "因和解協議已部分履行，因此甲不能申請恢復強制執行"}], "answer": ["A"], "explanation_full": "8 以就履行執行和解協議向執行法院提起訴訟。因此，執行和解後被執行人不完全履行協議義務，申請執行人享有救濟方式的選擇權，其既可以申請恢復執行原生效法律文書，也可以就履行執行和解協議提起訴訟。C項錯誤在於申請恢復執行的並非和解協議，二是原生效的法律文書。和解協議本身系合同，只具有合同的相對約束力，沒有強制執行力。A、B兩項的差異在於向哪個法院就履行和解協議提起訴訟。出於訴訟效益以及查清案件事實等多重因素考量，前述規定中的法院當為“執行法院”，即C區法院。本題答案為A。"}, {"id": "卷二-24", "subject": "卷二", "type": "單選題", "question": "下列哪一種民事訴訟請求屬於給付之訴？", "options": [{"key": "A", "text": "甲起訴請求乙停止損害其名譽"}, {"key": "B", "text": "丙起訴丁請求撤銷二人之間的房屋買賣合同"}, {"key": "C", "text": "男方起訴前妻，請求將二人之子判歸前妻撫養"}, {"key": "D", "text": "王某起訴李某，請求解除收養關係"}], "answer": ["A"], "explanation_full": "【羿文解析】本題考查訴的種類。對於給付之訴，根據要求被告履行義務的內容，可將給付之訴分為財產給付之訴與行為給付之訴。根據要求被告履行的行為義務是進行某種行為還是停止某種行為，又可以將行為給付之訴分為積極的行為給付之訴與消極的行為給付之訴。據此，本題中，A項屬於消極的行為給付之訴，而 B、C、D項均屬於變更之訴。本題答案為A。"}, {"id": "卷二-25", "subject": "卷二", "type": "單選題", "question": "根據《礦產資源法》的規定，下列選項哪一說法是正確的？", "options": [{"key": "A", "text": "某地集體土地發現礦藏，該礦藏產權歸該集體所有"}, {"key": "B", "text": "礦山企業之間的礦區範圍的爭議，由當事人協商解決，協商不成的，由有關縣級以上地方人民政府根據依法核定的礦區範圍處理"}, {"key": "C", "text": "國家對礦產儲量達到一定規模、對國民經濟具有重要價值的礦區和國家規定實行保護性開釆的特定礦種 ，實行有計劃的開採"}, {"key": "D", "text": "國務院和國務院有關主管部門批准開辦的礦山企業礦區範圍內已有的集體礦山企業，應一律關閉或到指定的其他地點開採"}], "answer": ["B"], "explanation_full": "【羿文解析】①A選項錯誤，礦產資源屬於國家所有，由國務院行使國家對礦產資源的所有權。地表或者地下的礦產資源的國家所有權，不因其所依附的土地的所有權或者使用權的不同而改變。 ②B選項正確，礦山企業之間的礦區範圍的爭議，由當事人協商解決，協商不成的，由有關縣級以上地方人民政府根據依法核定的礦區範圍處理；跨省、自治區、直轄市的礦區範圍的爭議，由有關省、自治區、直轄市人民政府協商解決，協商不成的，由國務院處理。 ③C選項錯誤，國家對國家規劃礦區、對國民經濟具有重要價值的礦區和國家規定實行保護性開採的特定礦種 ，實行有計劃的開釆；未經國務院有關主管部門批准，任何單位和個人不得開釆。對“國家規劃礦區”而非 “礦產儲量達到一定規模”的礦區。實行有計劃的開釆。 ④D選項錯誤，國務院和國務院有關主管部門批准開辦的礦山企業礦區範圍內已有的集體礦山企業，應當關閉或者到指定的其他地點開採，由礦山建設單位給予合理的補償，並妥善安置群眾生活；也可以按照該礦山企業的統籌安排，實行聯合經營。 綜上，本題正確答案為B選項。"}, {"id": "卷二-26", "subject": "卷二", "type": "單選題", "question": "定居在新加坡的日本明星山口惠來中國旅遊時，發現長沙星燦影城未經其同意在其創辦的微信公眾號中擅自使用其肖像宣傳，山口惠在中國某法院起訴星燦影城，要求星燦影城停止侵權並賠禮道歉。我國法院處理本案時應如何適用法律？", "options": [{"key": "A", "text": "雙方當事人可協議選擇中國法"}, {"key": "B", "text": "適用山口惠經常居所地的新加坡法"}, {"key": "C", "text": "因山口惠是日本人，應當適用日本法"}, {"key": "D", "text": "因微信是在中國發行的軟件，應當適用中國法專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 9"}], "answer": ["B"], "explanation_full": "【羿文解析】依據《法律適用法》第46條，侵害人格權應適用被侵權人經常居所地法，本案即為新加坡法 ，B項正確。ACD項錯誤。"}, {"id": "卷二-27", "subject": "卷二", "type": "單選題", "question": "某省發現有大米被鎘污染的情況，立即部署各地成立聯合執法組，徹查市場中的大米及米製品。對此，下列哪一說法是錯誤的？（　）", "options": [{"key": "A", "text": "大米、米製品的質量安全管理須以《食品安全法》為依據"}, {"key": "B", "text": "應依照《食品安全法》有關規定公布大米、米製品安全有關信息"}, {"key": "C", "text": "縣有關部門進入某米粉加工廠檢查時，該廠不得以商業秘密為由予以拒絕"}, {"key": "D", "text": "雖已構成重大食品安全事故，但影響僅限於該省，可由省衛生行政部門公布有關食品安全信息"}], "answer": ["A"], "explanation_full": "【羿文解析】根據《食品安全法》第2條第二款的規定，供食用的源於農業的初級產品（以下稱食用農產品 ）的質量安全管理，遵守《中華人民共和國農產品質量安全法》的規定。但是，食用農產品的市場銷售、有關質量安全標準的制定、有關安全信息的公布和本法對農業投入品作出規定的，應當遵守本法的規定。大米屬於供食用的源於農業的初級產品，故A項說法錯誤，B項說法正確。根據《食品安全法》第110條的規定 ：“縣級以上人民政府食品安全監督管理部門履行食品安全監督管理職責，有權採取下列措施，對生產經營者遵守本法的情況進行監督檢查：（一）進入生產經營場所實施現場檢查；（二）對生產經營的食品、食品添加劑、食品相關產品進行抽樣檢驗；（三）查閱、複製有關合同、票據、賬簿以及其他有關資料；（四 ）查封、扣押有證據證明不符合食品安全標準或者有證據證明存在安全隱患以及用於違法生產經營的食品、 食品添加劑、食品相關產品；（五）查封違法從事生產經營活動的場所。”故C項說法正確。根據《食品安全法》第118條的規定，國家建立統一的食品安全信息平台，實行食品安全信息統一公布制度。國家食品安全總體情況、食品安全風險警示信息、重大食品安全事故及其調查處理信息和國務院確定需要統一公布的其他信息由國務院食品安全監督管理部門統一公布。食品安全風險警示信息和重大食品安全事故及其調查處理信息的影響限於特定區域的，也可以由有關省、自治區、直轄市人民政府食品安全監督管理部門公布。未經授權不得發布上述信息。縣級以上人民政府食品安全監督管理、農業行政部門依據各自職責公布食品安全日常監督管理信息。公布食品安全信息，應當做到準確、及時，並進行必要的解釋說明，避免誤導消費者和社會輿論。故D項說法正確。"}, {"id": "卷二-28", "subject": "卷二", "type": "單選題", "question": "香港甲公司與內地乙公司訂立供貨合同，約定由香港法院管轄。後雙方因是否解除該合同及賠償問題訴諸香港法院，法院判乙公司敗訴。依相關規定，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "如該合同被解除，則香港法院管轄的協議也隨之無效"}, {"key": "B", "text": "如乙公司在內地兩省均有財產，甲公司可向兩省的有關法院申請認可和執行"}, {"key": "C", "text": "如甲公司向內地法院申請認可和執行判決，免除執行費用"}, {"key": "D", "text": "如甲公司向內地法院提交的文件無中文文本，應當提交證明無誤的中文譯本"}], "answer": ["D"], "explanation_full": "【羿文解析】根據《關於內地與香港特別行政區法院相互認可和執行當事人協議管轄的民商事案件判決的安排》第3、5、6、15條的相關規定，申請人向內地法院提交的申請書應當用中文製作。所附司法文書及其相關文件未用中文製作的，應當提供證明無誤的中文譯本。故選項D正確。管轄協議具有獨立性，合同解除不影響管轄協議的效力，選項A錯誤。兩個或兩個以上中級人民法院均有管轄權的，申請人應當選擇向其中一個中級人民法院提出申請，選項B錯誤。申請人依據本安排申請認可和執行判決，應當根據執行地有關訴訟收費的法律和規定交納訴訟費用或者法院費用。故選項C錯誤。"}, {"id": "卷二-29", "subject": "卷二", "type": "單選題", "question": "根據《與貿易有關的知識產權協定》，關於商標所有人轉讓商標，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "必須將該商標與所屬業務同時轉讓"}, {"key": "B", "text": "可以將該商標與所屬業務同時轉讓"}, {"key": "C", "text": "不能將該商標與所屬業務同時轉讓專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 10"}, {"key": "D", "text": "可以通過強制許可形式轉讓"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《與貿易有關的知識產權協議》的規定，成員可以確定商標許可與轉讓的條件的同時，強調對商標的強制許可應不予准許，註冊商標所有人有權將商標連同或者不連同其所屬的營業一起進行轉讓 ，故選項B正確。"}, {"id": "卷二-30", "subject": "卷二", "type": "單選題", "question": "李某與保險公司的代理人王某簽訂人身保險合同，下列說法不正確的是哪項？（　）", "options": [{"key": "A", "text": "如果李某寫字不方便，王某可以代李某簽字"}, {"key": "B", "text": "若李某讓王某代為簽字後，同時繳納了合同約定的保險費，則保險合同生效"}, {"key": "C", "text": "如果保險公司接受了李某的保單並收取了保費後，當天即發生了保險事故，被保險人或受益人有權要求保險人按照保險合同約定的承保條件承擔賠償或者給付保險金的責任"}, {"key": "D", "text": "如果保險公司接受了李某的保單並收取了保費後，當天即發生了保險事故，保險公司主張不符合承保條件的，應承擔舉證責任"}], "answer": ["A"], "explanation_full": "【羿文解析】《保險法解釋（二）》第3條第1款規定：“投保人或者投保人的代理人訂立保險合同時沒有親自簽字或者蓋章，而由保險人或者保險人的代理人代為簽字或者蓋章的，對投保人不生效。但投保人已經交納保險費的，視為其對代簽字或者蓋章行為的追認。”據此，投保人應當親自簽字，故A項錯誤，當選。B項屬於一種補救措施，正確，不當選。《保險法解釋（二）》第4條規定：“保險人接受了投保人提交的投保單並收取了保險費，尚未作出是否承保的意思表示，發生保險事故，被保險人或者受益人請求保險人按照保險合同承擔賠償或者給付保險金責任，符合承保條件的，人民法院應予支持；不符合承保條件的，保險人不承擔保險責任，但應當退還已經收取的保險費。保險人主張不符合承保條件的，應承擔舉證責任。”據此，C、 D兩項正確，不當選。"}, {"id": "卷二-31", "subject": "卷二", "type": "單選題", "question": "甲房地產公司章程規定：董事長未經股東會授權，不得處置公司資產，也不得以公司名義簽訂非經營性合同。一日，董事長任某見潘某開一輛新款寶馬車，遂決定以自己乘坐的公司舊奔馳車與潘某調換，並辦理了車輛過戶手續。對任某的換車行為，下列哪一種說法是正確的？（　）", "options": [{"key": "A", "text": "違反公司章程處置公司資產，其行為無效"}, {"key": "B", "text": "違反公司章程從事非經營性交易，其行為無效"}, {"key": "C", "text": "並未違反公司章程，其行為有效"}, {"key": "D", "text": "無論是否違反公司章程，只要潘某並非惡意，該行為就有效"}], "answer": ["D"], "explanation_full": "【羿文解析】《公司法》第11條規定：“設立公司必須依法制定公司章程。公司章程對公司、股東、董事、 監事、高級管理人員具有約束力。”據此，公司董事長受到公司章程的約束，公司章程可以對董事長的權限進行限制，但此種限制不得對抗善意第三人。就此，《民法典》第504條規定：“法人的法定代表人或者非法人組織的負責人超越權限訂立的合同,除相對人知道或者應當知道其超越權限外,該代表行為有效,訂立的合同對法人或者非法人組織發生效力。”所以，只要潘某並非惡意，任某與潘某之間的換車行為就可以有效，故 A、B兩項錯誤，D項正確。C項說法錯誤，任某行為明顯違背公司章程，在公司內部需要承擔責任。就此，《 公司法》第147條第1款規定：“董事、監事、高級管理人員應當遵守法律、行政法規和公司章程，對公司負有忠實義務和勤勉義務。”《公司法》第149條進一步規定：“董事、監事、高級管理人員執行公司職務時違反法律、行政法規或者公司章程的規定，給公司造成損失的，應當承擔賠償責任。”當然，任某以公司的舊奔馳與潘某的新寶馬互易，是否給公司造成損失，需要根據具體案情判斷。"}, {"id": "卷二-32", "subject": "卷二", "type": "單選題", "question": "2007年1月，甲、乙、丙設立一普通合夥企業。2008年2月，甲與戊結婚。2008年7月，甲因車禍去世。甲除戊外沒有其他親人，合夥協議對合夥人資格取得或喪失未作約定。下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "合夥企業中甲的財產份額屬於夫妻共同財產"}, {"key": "B", "text": "戊依法自動取得合夥人地位專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 11"}, {"key": "C", "text": "經乙、丙一致同意，戊取得合夥人資格"}, {"key": "D", "text": "只能由合夥企業向戊退還甲在合夥企業中的財產份額"}], "answer": ["C"], "explanation_full": "【羿文解析】根據《合夥企業法》第20條的規定，合夥人的出資、以合夥企業名義取得的收益和依法取得的其他財產，均為合夥企業的財產。本合夥企業中甲的財產份額屬於合夥企業的財產，而非夫妻共同財產，故選項A錯誤。《合夥企業法》第50條第1款規定，合夥人死亡或者被依法宣告死亡的，對該合夥人在合夥企業中的財產份額享有合法繼承權的繼承人，按照合夥協議的約定或者經全體合夥人一致同意，從繼承開始之日起，取得該合夥企業的合夥人資格。本題中，合夥協議對合夥人資格取得或喪失未作約定，故合夥人甲因車禍去世後，其唯一的繼承人戊經全體合夥人一致同意後，可以取得合夥人資格，選項B、D錯誤，選項C正確。"}, {"id": "卷二-33", "subject": "卷二", "type": "單選題", "question": "甲乙兩國都是WTO的成員，兩國均在“教育服務”方面做出了承諾。甲國承諾“允許外國服務提供者與甲國合資夥伴一起設立合資高等學校，允許外資擁有多數股權”，乙國承諾“外國個人教育服務提供者受乙國學校或其他教育機構邀請或雇傭，可入境提供教育服務%2015年3月，甲國頒布一項國內法規，明確合資設立高等學校，外資不得超過總出資比例的30%02016年6月，乙國針對甲國的此項國內法規向WT。提起爭端解決。 根據WTO《服務貿易總協定》及爭端解決機制，請判斷下列哪一項說法是正確的？", "options": [{"key": "A", "text": "甲乙兩國的承諾均針對教育服務的商業存在"}, {"key": "B", "text": "甲國頒布的國內法規並不具有違反性，成員的承諾並非WTO多邊協議，不具有約束力"}, {"key": "C", "text": "乙國提起的爭端屬於違反性申訴，若申訴成功，甲國有義務補償乙國因此而受到的損失"}, {"key": "D", "text": "乙國應當先提出磋商請求，磋商請求日起60天內沒有解決爭端，乙國才可以申請設立專家組"}], "answer": ["D"], "explanation_full": "【羿文解析】①甲國的承諾針對商業存在；乙國的承諾針對自然人存在；所以甲乙並不都是針對商業存在 ，A選項錯誤。 ②這裡的違反性，既包括違反多邊協議的規定，也包括違反自己的承諾，所以成員的承諾也具有約束力，B選項錯誤。 ③違反性申訴：申訴方須證明被訴方違反協議；如果申訴成功，被訴方有義務改或廢，而不是補償，C選項錯誤。 ④磋商是申請設立專家組的前提條件，時間是60天，磋商程序是保密的，包括過程和結果都保密，D選項正確 。 綜上，本題正確答案為D選項。"}, {"id": "卷二-34", "subject": "卷二", "type": "單選題", "question": "2015年6月，張某出資100萬元設昌治有限責任公司（自然人獨資）。2017年1月，張某又投資設立“皋治印刷廠”（個人獨資企業）。2018年3月，昌治有限責任公司欠劉某貨款80萬元，但公司賬上已無現金。關於本題，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "在設立昌治有限責任公司之後，張某不得再投資設立印刷廠"}, {"key": "B", "text": "劉某可以張某為昌治公司唯一股東為由，請求張某承擔連帶責任"}, {"key": "C", "text": "昌治有限責任公司可為張某個人債務提供擔保"}, {"key": "D", "text": "昌治有限責任公司與皋治印刷廠可共同出資設立一家有限責任公司"}], "answer": ["D"], "explanation_full": "【羿文解析】《公司法》第58條規定：“一個自然人只能投資設立一個一人有限責任公司。該一人有限責任公司不能投資設立新的一人有限責任公司。”該條規定僅禁止一個自然人設立多家一人公司，並未禁止一個自然人同時設立一人公司和個人獨資企業。因此，A項錯誤。《公司法》第3條規定，公司是企業法人，有獨立的法人財產，享有法人財產權。公司以其全部財產對公司的債務承擔責任。有限責任公司的股東以其認繳的出資額為限對公司承擔責任；股份有限公司的股東以其認購的股份為限對公司承擔責任。按照這一規定 12 定，公司為公司股東或者實際控制人提供擔保的，必須經股東會或者股東大會決議。第3款規定，前款規定的股東或者受前款規定的實際控制人支配的股東，不得參加前款規定事項的表決。該項表決由出席會議的其他股東所持表決權的過半數通過。按照這一規定，對股東的擔保必須由股東會作出決議，且相關股東不能參與表決，由於一人公司只有一個股東，而該股東又不能參與表決，因此，一人公司不能為股東債務提供擔保 ，C項錯誤。《公司法》第58條規定，一個自然人只能投資設立一個一人有限責任公司。該一人有限責任公司不能投資設立新的一人有限責任公司。法律禁止自然人一人公司設立新的一人公司，並未禁止該一人公司與其他主體共同設立新的公司的行為，D項正確。"}, {"id": "卷二-35", "subject": "卷二", "type": "單選題", "question": "經常居所在天津的德國公民托馬斯家中失竊丟畫，該畫後被中國公民李偉在韓國藝術品市場購得，後托馬斯得知李偉將畫帶回中國並委託拍賣公司在天津拍賣。現托馬斯欲通過訴訟要回該畫作，以下哪一說法是正確的？（　）", "options": [{"key": "A", "text": "托馬斯的訴訟行為能力應適用德國法來判斷"}, {"key": "B", "text": "該案件的準據法應當在與案件有實際聯繫的德國法、中國法以及韓國法中進行選擇"}, {"key": "C", "text": "當雙方當事人不能就準據法的選擇達成一致時應適用韓國法的法律規定"}, {"key": "D", "text": "當雙方當事人不能就準據法的選擇達成一致時應適用法院地法中國法的規定"}], "answer": ["C"], "explanation_full": "【羿文解析】A項，行為人的行為能力適用經常居所地法，即中國法，A錯誤。B項，當事人協議選擇準據法時 ，不需要和案件有實際聯繫，B錯誤。C、D項，當事人沒有對動產物權的準據法進行選擇的，適用法律事實發生時動產所在地的法律，在本案中就是韓國法，C正確，D錯誤。"}, {"id": "卷二-36", "subject": "卷二", "type": "單選題", "question": "根據《涉外民事關係法律適用法》和司法解釋，關於外國法律的查明問題，下列哪一表述是正確的？（ ）", "options": [{"key": "A", "text": "行政機關無■明外國法律的義務"}, {"key": "B", "text": "查明過程中，法院應當聽取各方當事人對應當適用的外國法律的內容及其理解與適用的意見"}, {"key": "C", "text": "無法通過中外法律專家提供的方式獲得外國法律的，法院應認定為不能■明"}, {"key": "D", "text": "不能■明的，應視為相關當事人的訴訟請求無法律依據"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《涉外民事關係法律適用法》第10條規定：“涉外民事關係適用的外國法律，由人民法院 、仲裁機構或者行政機關查明。當事人選擇適用外國法律的，應當提供該國法律。不能查明外國法律或者該國法律沒有規定的，適用中華人民共和國法律。”所以A選項錯誤，行政機關有查明外國法的義務。D選項錯誤，不能查明的，適用中華人民共和國法律。《涉外民事關係法律適用法解釋（一）》第16條規定：“人民法院應當聽取各方當事人對應當適用的外國法律的內容及其理解與適用的意見，當事人對該外國法律的內容及其理解與適用均無異議的，人民法院可以予以確認；當事人有異議的，由人民法院審查認定。”所以B選項正確。《涉外民事關係法律適用法解釋（一）》第15條規定：“人民法院通過由當事人提供、已對中華人民共和國生效的國際條約規定的途徑、中外法律專家提供等合理途徑仍不能獲得外國法律的，可以認定為不能查明外國法律。根據涉外民事關係法律適用法第十條第一款的規定，當事人應當提供外國法律，其在人民法院指定的合理期限內無正當理由未提供該外國法律的，可以認定為不能查明外國法律。”據此，無法通過中外法律專家提供的方式獲得外國法律的，還可以通過對中華人民共和國生效的國際條約規定的其他合理途徑獲得外國法，法院不能輕易認定為不能查明。所以C選項錯誤。"}, {"id": "卷二-37", "subject": "卷二", "type": "單選題", "question": "關於食品添加劑管制，下列哪一說法符合《食品安全法》的規定？（　）", "options": [{"key": "A", "text": "向食品生產者供應新型食品添加劑的，必須持有省級衛生行政部門發放的特別許可證"}, {"key": "B", "text": "未獲得食品添加劑銷售許可的企業，不得銷售含有食品添加劑的食品"}, {"key": "C", "text": "生產含有食品添加劑的食品的，必須給產品包裝加上載有“食品添加劑”字樣的標籤"}, {"key": "D", "text": "銷售含有食品添加劑的食品的，必須在銷售場所設置載明“食品添加劑”字樣的專櫃 13"}], "answer": ["C"], "explanation_full": "【羿文解析】《食品安全法》第37條規定，利用新的食品原料生產食品，或者生產食品添加劑新品種、食品相關產品新品種，應當向國務院衛生行政部門提交相關產品的安全性評估材料。故A項說法錯誤，應當取得國務院衛生行政部門的許可。第39條第1款規定，國家對食品添加劑生產實行許可制度。從事食品添加劑生產 ，應當具有與所生產食品添加劑品種相適應的場所、生產設備或者設施、專業技術人員和管理制度，並依照本法第35條第2款規定的程序，取得食品添加劑生產許可。也就是說，食品添加劑的生產是實行許可制度的 ，食品添加劑的銷售並未要求實行許可制度，故B項說法錯誤。第70條規定，食品添加劑應當有標籤、說明書和包裝。標籤、說明書應當載明本法第67條第1款第1項至第6項、第8項、第9項規定的事項，以及食品添加劑的使用範圍、用量、使用方法，並在標籤上載明“食品添加劑”字樣。故C項說法正確。D項說法錯誤，《食品安全法》並未要求銷售含有食品添加劑的食品的，必須在銷售場所設置載明“食品添加劑”字樣的專櫃。"}, {"id": "卷二-38", "subject": "卷二", "type": "單選題", "question": "甲國公民瓊斯的經常居住地在乙國，其在中國居留期間，因合同糾紛在中國法院參與民事訴訟。關於瓊斯的民事能力的法律適用，下列哪一選項是正確的？（　）", "options": [{"key": "A", "text": "民事權利能力適用甲國法"}, {"key": "B", "text": "民事權利能力適用中國法"}, {"key": "C", "text": "民事行為能力應重疊適用甲國法和中國法"}, {"key": "D", "text": "依照乙國法瓊斯為無民事行為能力，依照中國法為有民事行為能力的，其民事行為能力適用中國法"}], "answer": ["D"], "explanation_full": "【羿文解析】根據《涉外民事關係法律適用法》第11條的規定，自然人的民事權利能力，適用經常居所地法律。乙國為瓊斯的經常居住地，故其民事權利能力應適用乙國法。選項A、B錯誤。根據該法第12條的規定 ，自然人的民事行為能力，適用經常居所地法律。自然人從事民事活動，依照經常居所地法律為無民事行為能力，依照行為地法律為有民事行為能力的，適用行為地法律，但涉及婚姻家庭、繼承的除外。故選項C錯誤 ，D正確。"}, {"id": "卷二-39", "subject": "卷二", "type": "單選題", "question": "A市著名大學某分校與某工業園區毗鄰而建，工廠擬在工業園區內興建一發電廠以滿足生產所需。開學後學校校長開會提及此事，教務處擔心電廠噪聲影響學生上課表示強烈反對，並將此事報告給工業園區管理委員會，工業園區管理委員會擬編製環境影響評價文件。依據《環境影響評價法》，下列哪一說法是正確的 ？（　）", "options": [{"key": "A", "text": "建設發電廠對環境影響的經濟損益分析應當包含在環境影響評價文件之中"}, {"key": "B", "text": "工業園區管理委員會若要獲得環境影響評價文件的審批就必須支付相關費用"}, {"key": "C", "text": "工業園區管理委員會編製的環境影響評價文件應當進行備案"}, {"key": "D", "text": "工業園區管理委員會應編製環境影響報告表"}], "answer": ["A"], "explanation_full": "【羿文解析】《環境影響評價法》第17條規定：“建設項目的環境影響報告書應當包括下列內容：（一）建設項目概況；（二）建設項目周圍環境現狀；（三）建設項目對環境可能造成影響的分析、預測和評估 ；（四）建設項目環境保護措施及其技術、經濟論證；（五）建設項目對環境影響的經濟損益分析；（六 ）對建設項目實施環境監測的建議；（七）環境影響評價的結論。環境影響報告表和環境影響登記表的內容和格式，由國務院生態環境主管部門制定。”A選項正確。"}, {"id": "卷二-40", "subject": "卷二", "type": "單選題", "question": "甲、乙公司擬合併成丙公司，其中甲公司欠丁公司貨款100萬元，乙公司欠戊公司80萬元。以下哪一選項不符合法律規定？（　）", "options": [{"key": "A", "text": "甲、乙公司合併成丙公司，應當分別由甲、乙公司的股東會作出普通決議"}, {"key": "B", "text": "甲、乙公司合併成丙公司後，甲、乙公司應作註銷登記，丙公司應作設立登記"}, {"key": "C", "text": "公司合併前，丁公司有權要求甲公司、戊公司有權要求乙公司分別清償債務或者提供相應的擔保"}, {"key": "D", "text": "公司合併後，若甲、乙公司均未清償債務，丙公司有向丁公司、戊公司還款的義務"}], "answer": ["A"], "explanation_full": "14 定。股東會會議作出修改公司章程、增加或者減少註冊資本的決議，以及公司合併、分立、解散或者變更公司形式的決議，必須經代表三分之二以上表決權的股東通過。”據此，公司合併應當由股東會作出特別決議 ，故A項錯誤，當選。《公司法》第172條第2款規定：“一個公司吸收其他公司為吸收合併，被吸收的公司解散。兩個以上公司合併設立一個新的公司為新設合併，合併各方解散。”據此，B項正確，不當選。《公司法 》第173條規定：“公司合併，應當由合併各方簽訂合併協議，並編製資產負債表及財產清單。公司應當自作出合併決議之日起十日內通知債權人，並於三十日內在報紙上公告。債權人自接到通知書之日起三十日內 ，未接到通知書的自公告之日起四十五日內，可以要求公司清償債務或者提供相應的擔保。”據此，C項正確 ，不當選。《公司法》第174條規定：“公司合併時，合併各方的債權、債務，應當由合併後存續的公司或者新設的公司承繼。”據此，D項正確，不當選。"}, {"id": "卷二-41", "subject": "卷二", "type": "單選題", "question": "我國某電子產品的國內生產者向中國商務部提起對甲國進口的該類電子產品的反傾銷調查申請。商務部發起調查後，需要確定該種產品的正常價值以判斷是否存在傾銷。根據我國相關法律規定，商務部的下列哪一做法是正確的？", "options": [{"key": "A", "text": "直接適用進口產品的同類產品在甲國國內市場的正常貿易過程中的可比價格為正常價值"}, {"key": "B", "text": "直接適用該種進口產品的同類產品在甲國的生產成本加合理費用、利潤為正常價值"}, {"key": "C", "text": "直接適用該種進口產品的同類產品出口到一個適當第三國的可比價格為正常價值"}, {"key": "D", "text": "首先適用該種產品的同類產品在甲國國內市場的正常貿易過程中的可比價格；沒有這一價格的，適用該種進口產品的同類產品出口到一個適當第三國的可比價格；這一價格也沒有的，適用該種進口產品的同類產品在甲國的生產成本加合理費用、利潤為正常價值"}], "answer": ["A"], "explanation_full": "【羿文解析】①根據我國《反傾銷條例》第4條，確定正常價值的第一順序是同類產品在出口國（地區）正常貿易中的可比價格，A項正確。 ②在沒有出口國可比價格的情況下，才能用另外兩種正常價值的確定方法，同類產品出口到一個適當第三國 （地區）的可比價格或者以該同類產品在原產國（地區）的生產成本加合理費用、利潤。但這兩種正常價值必須是沒有出口國可比價格的情況下才能適用，BC“直接適用”的說法錯誤。 ③在沒有出口國可比價格的情況下，另外兩種正常價值的確定方法是沒有順序要求的，可任擇其中之一適用 ，D項錯誤。 綜上，本題正確答案為A選項。"}, {"id": "卷二-42", "subject": "卷二", "type": "單選題", "question": "白陽有限公司分立為陽春有限公司與白雪有限公司時，在對原債權人甲的關係上，下列哪一說法是錯誤的 ？（　）", "options": [{"key": "A", "text": "白陽公司應在作出分立決議之日起10日內通知甲"}, {"key": "B", "text": "甲在接到分立通知書後30日內，可要求白陽公司清償債務或提供相應的擔保"}, {"key": "C", "text": "甲可向分立後的陽春公司與白雪公司主張連帶清償責任"}, {"key": "D", "text": "白陽公司在分立前可與甲就債務償還問題簽訂書面協議"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《公司法》第175條第2款的規定，公司分立，應當編製資產負債表及財產清單。公司應當自作出分立決議之日起10日內通知債權人，並於30日內在報紙上公告。選項A正確。根據《公司法》第173條的規定，公司合併……債權人自接到通知書之日起30日內，未接到通知書的自公告之日起45日內，可以要求公司清償債務或者提供相應的擔保。而在公司分立的情況下，並沒有此類規定，故選項B錯誤。另根據《公司法》第176條的規定，公司分立前的債務由分立後的公司承擔連帶責任。但是，公司在分立前與債權人就債務清償達成的書面協議另有約定的除外。故債權人甲可以要求分立後的陽春公司與白雪公司承擔連帶清償責任 ，或者就債務償還問題與甲簽訂書面協議，選項C、D正確。綜上，B項為本題正確選項。"}, {"id": "卷二-43", "subject": "卷二", "type": "單選題", "question": "中國星通公司與德國伯恩科技公司簽訂一批通訊設備的買賣合同，約定單價每件30歐元/FOB（漢堡）。中國星通公司為該批貨物的運輸向中國人民保險公司投保了平安險。對於航行途中發生的下列哪一項損失，保專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 15 險公司應承擔賠償責任？", "options": [{"key": "A", "text": "在運輸途中貨輪與另一艘船舶相撞造成部分貨物碎裂損失"}, {"key": "B", "text": "由於運輸延遲造成的貨物損失"}, {"key": "C", "text": "貨到目的地清點貨物時發現存在不明原因的短量"}, {"key": "D", "text": "在運輸途中遭遇強熱帶風暴造成貨物部分濕損"}], "answer": ["A"], "explanation_full": "【羿文解析】①平安險承保海上風險造成的貨物全部和部分損失，但單純由於自然災害造成的單獨海損不保 ，選項A屬於平安險承保範圍，而CD項不屬於。 ②運輸延遲屬於保險除外責任，因此B項損失不屬於保險公司的賠償範圍。 綜上，本題正確答案為A選項。"}, {"id": "卷二-44", "subject": "卷二", "type": "單選題", "question": "某詩人署名“漫動的音符”，在甲網站發表題為“天堂向左”的詩作，乙出版社的《現代詩集》收錄該詩 ，丙教材編寫單位將該詩作為範文編入《語文》教材，丁文學網站轉載了該詩。下列哪一說法是正確的 ？（　）", "options": [{"key": "A", "text": "該詩人在甲網站署名方式不合法"}, {"key": "B", "text": "“天堂向左”在《現代詩集》中被正式發表"}, {"key": "C", "text": "丙可以不經該詩人同意使用“天堂向左”，但應當按照規定支付報酬"}, {"key": "D", "text": "丁網站未經該詩人和甲網站同意而轉載，構成侵權行為"}], "answer": ["C"], "explanation_full": "【羿文解析】在A選項中，著作權人有署名權，其可以自由署名，所以該選項錯誤。在B選項中，在著作權人通過網絡發表之際，“天堂向左”已被正式發表，所以該選項錯誤。在C選項中，《著作權法》第25條第1款規定，為實施義務教育和國家教育規劃而編寫出版教科書，可以不經著作權人許可，在教科書中匯編已經發表的作品片段或者短小的文字作品、音樂作品或者單幅的美術作品、攝影作品、圖形作品，但應當按照規定向著作權人支付報酬，指明作者姓名或者名稱、作品名稱，並且不得侵犯著作權人依照本法享有的其他權利 。所以，C選項正確。在D選項中，丁網站未經著作權人詩人同意而轉載，侵害了其信息網絡傳播權，構成侵權行為。但是，僅詩人是著作權人，甲網站不享有相應權利，丁網站轉載並不需要甲網站的同意，所以D選項錯誤。"}, {"id": "卷二-45", "subject": "卷二", "type": "單選題", "question": "關於票據喪失時的法律救濟方式，下列哪一說法是錯誤的？（　）", "options": [{"key": "A", "text": "通知票據付款人掛失止付"}, {"key": "B", "text": "申請法院公示催告"}, {"key": "C", "text": "向法院提起訴訟"}, {"key": "D", "text": "不經掛失止付不能申請公示催告或者提起訴訟"}], "answer": ["D"], "explanation_full": "【羿文解析】根據《票據法》第15條的規定，票據喪失，失票人可以及時通知票據的付款人掛失止付，但是 ，未記載付款人或者無法確定付款人及其代理付款人的票據除外。收到掛失止付通知的付款人，應當暫停支付。失票人應當在通知掛失止付後3日內，也可以在票據喪失後，依法向人民法院申請公示催告，或者向人民法院提起訴訟。由此可知，選項ABC正確。至於申請公示催告或者提起訴訟的條件，除通知掛失止付外，也可以在票據喪失後立即申請，掛失止付並不是必要條件。故選項D錯誤。本題應選D。 【陷阱】票據喪失後，失票人有兩種選擇：一種是，通知票據的付款人掛失止付，然後依法向人民法院申請公示催告，或者向人民法院提起訴訟；另一種是，在票據喪失後，直接向人民法院申請公示催告，或者向人民法院提起訴訟。因此，掛失止付並不是申請公示催告或提起訴訟的前提條件。"}, {"id": "卷二-46", "subject": "卷二", "type": "單選題", "question": "關於《銀行業監督管理法》的適用範圍，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "信託投資公司適用本法"}, {"key": "B", "text": "金融租賃公司不適用本法專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 16"}, {"key": "C", "text": "金融資產管理公司不適用本法"}, {"key": "D", "text": "財務公司不適用本法"}], "answer": ["A"], "explanation_full": "【羿文解析】根據《銀行業監督管理法》第2條的規定，國務院銀行業監督管理機構負責對全國銀行業金融機構及其業務活動監督管理的工作。本法所稱銀行業金融機構，是指在中華人民共和國境內設立的商業銀行、 城市信用合作社、農村信用合作社等吸收公眾存款的金融機構以及政策性銀行。對在中華人民共和國境內設立的金融資產管理公司、信託投資公司、財務公司、金融租賃公司以及經國務院銀行業監督管理機構批准設立的其他金融機構的監督管理，適用本法對銀行業金融機構監督管理的規定。也就是說《銀行業監督管理法 》的適用對象包括商業銀行、城市信用合作社、農村信用合作社、政策性銀行（農業發展銀行、進出口銀行 ）、金融資產管理公司、信託投資公司、財務公司、金融租賃公司等。故本題正確的說法是A。"}, {"id": "卷二-47", "subject": "卷二", "type": "單選題", "question": "經常居住於英國的法國籍夫婦甲和乙，想來華共同收養某兒童。對此，下列哪一說法是正確的？（　）", "options": [{"key": "A", "text": "甲、乙必須共同來華辦理收養手續"}, {"key": "B", "text": "甲、乙應與送養人訂立書面收養協議"}, {"key": "C", "text": "收養的條件應重疊適用中國法和法國法"}, {"key": "D", "text": "若發生收養效力糾紛，應適用中國法"}], "answer": ["B"], "explanation_full": "【羿文解析】根據《外國人在中華人民共和國收養子女登記辦法》第8條規定，外國人來華收養子女，應當親自來華辦理登記手續。夫妻共同收養的，應當共同來華辦理收養手續；一方因故不能來華的，應當書面委託另一方。委託書應當經所在國公證和認證。所以，A選項錯誤。第9條規定，外國人來華收養子女，應當與送養人訂立書面收養協議。協議一式三份，收養人、送養人各執一份，辦理收養登記手續時收養登記機關收存一份。書面協議訂立後，收養關係當事人應當共同到被收養人常住戶口所在地的省、自治區、直轄市人民政府民政部門辦理收養登記。所以，B選項正確。《涉外民事關係法律適用法》第28條規定，收養的條件和手續 ，適用收養人和被收養人經常居所地法律。收養的效力，適用收養時收養人經常居所地法律。收養關係的解除，適用收養時被收養人經常居所地法律或者法院地法律。甲和乙的經常居所地在英國，被收養人的經常居所地在中國，所以收養的條件應重疊適用中國法和英國法。所以，C選項錯誤。涉外收養的效力，是指涉外收養有效成立後被收養人與送養人或收養人之間具有什麼樣的身份及權利義務關係。依據《外國人在中華人民共和國收養子女登記辦法》第3條規定，外國人在華收養子女，應當符合中國有關收養法律的規定，並應當符合收養人所在國有關收養法律的規定；因收養人所在國法律的規定與中國法律的規定不一致而產生的問題 ，由兩國政府有關部門協商處理。所以，D選項錯誤。"}, {"id": "卷二-48", "subject": "卷二", "type": "單選題", "question": "根據《消費者權益保護法》的相關規定，下列哪種說法是正確的？（　）", "options": [{"key": "A", "text": "甲縣發生侵害眾多消費者合法權益的群體性案件，當地縣消費者協會可以對此向人民法院提起訴訟"}, {"key": "B", "text": "乙購買了一台筆記本後，發現屏幕有裂痕，對於此質量問題可以主張7日內退貨，必要的運費也由經營者承擔"}, {"key": "C", "text": "丙在國慶促銷期間購買了一台洗衣機，一個月後乾洗功能不能正常運作，丙依據商家的承諾主張退貨，對於乾洗功能存在問題由丙自己進行舉證"}, {"key": "D", "text": "丁在某珠寶店購買了鑽戒一枚向女神求婚，鑽戒標明產地南非、純度100%,後經鑒定機構檢驗，純度60%,女神一氣之下拒絕了求婚，丁可依據《消費者權益保護法》獲得珠寶店賠償鑽石價格4倍的賠償，加上精神損害賠償"}], "answer": ["B"], "explanation_full": "【羿文解析】A項錯誤，對於發生侵害眾多消費者合法權益的群體性案件，中國消費者協會以及在省、自治區 、直轄市設立的消費者協會，可以向人民法院提起訴訟，\"縣消費者協會\"無權提起訴訟。B項正確，乙某購買的筆記本質量不符合要求，消費者可以自收到商品之日起7日內退貨，同時經營者應當承擔運輸等必要費用。 17 其受到的損失，增加賠償的金額為消費者購買商品的價款或者接受服務的費用的3倍，因此珠寶店應賠償鑽石 4倍的價款，但只有造成嚴重精神損害才能獲得精神損害賠償。"}, {"id": "卷二-49", "subject": "卷二", "type": "單選題", "question": "某建設項目進行地質勘查，需要臨時使用趙村的集體土地。用地單位就此向李律師咨詢。李律師的下列哪一意見是正確的？（　）", "options": [{"key": "A", "text": "該臨時用地應由鄉（鎮）級以上人民政府批准"}, {"key": "B", "text": "用地單位應當與趙村的村民委員會簽訂臨時使用土地合同，並支付臨時使用土地補償費"}, {"key": "C", "text": "用地單位可以在地質勘查中修建永久性建築物，但應當取得趙村同意並支付相應費用"}, {"key": "D", "text": "臨時使用土地的期限一般不超過5年"}], "answer": ["B"], "explanation_full": "【羿文解析】《土地管理法》第57條規定，建設項目施工和地質勘查需要臨時使用國有土地或者農民集體所有的土地的，由縣級以上人民政府土地行政主管部門批准。其中，在城市規劃區內的臨時用地，在報批前 ，應當先經有關城市規劃行政主管部門同意。土地使用者應當根據土地權屬，與有關土地行政主管部門或者農村集體經濟組織、村民委員會簽訂臨時使用土地合同，並按照合同的約定支付臨時使用土地補償費。臨時使用土地的使用者應當按照臨時使用土地合同約定的用途使用土地，並不得修建永久性建築物。臨時使用土地期限一般不超過二年。B正確。"}, {"id": "卷二-50", "subject": "卷二", "type": "單選題", "question": "根據《民事訴訟法》和司法解釋的規定，關於管轄制度的表述，下列哪一表述是正確的？", "options": [{"key": "A", "text": "對下落不明或者宣告失蹤的人提起的民事訴訟，均應由原告住所地法院管轄"}, {"key": "B", "text": "管轄權轉移制度是對級別管轄制度的變通和個別的調整"}, {"key": "C", "text": "不動產糾紛由不動產所在地法院管轄，體現了管轄恆定的原則"}, {"key": "D", "text": "因公司設立糾紛、確認股東資格糾紛，分配利潤糾紛、公司解散糾紛而引發的民事訴訟，由公司住所地或被告住所地法院管轄"}], "answer": ["B"], "explanation_full": "【羿文解析】①對下落不明或者宣告失蹤的人提起的有關身份關係的訴訟，由原告住所地法院管轄。並非所有被告下落不明或宣告失蹤的案件都“被告就原告”，而是取決於案件性質，如果是身份關係糾紛則“被告就原告”；如果是財產糾紛則仍舊“原告就被告”。選項A忽略了案件性質，因此說法錯誤。②管轄權轉移在上下級法院之間進行，包括“上向下移”和“下向上移”，管轄權轉移屬於裁定管轄，是對級別管轄的變通和微調，因此選項B的說法正確。③不動產糾紛由不動產所在地的人民法院專屬管轄，其立法基礎是便於法院調查了解案件、便於當事人蔘加訴訟，即“兩便原則”，與管轄權恆定並無關聯，因此選項C的說法錯誤。 ④因公司設立糾紛、確認股東資格糾紛，分配利潤糾紛、公司解散糾紛而引發的民事訴訟，由公司住所地法院管轄，因此選項D的說法錯誤。綜上，本題正確答案為B選項。 多項選擇題"}, {"id": "卷二-51", "subject": "卷二", "type": "多選題", "question": "當紅未婚明星李某在節目中抱著一陌生小孩拍照一張，並將照片發入自己的微博中，配文為“我與乾兒子楊某\"。後黑暗日報將該照片用於報道中，並描述圖上小孩為李某的私生子。由此造成輿論風波，大量商家取消與李某的合作，李某為此輾轉反側。對此，下列哪些說法是正確的？", "options": [{"key": "A", "text": "黑暗日報侵犯了李某的肖像權"}, {"key": "B", "text": "黑暗日報因實施新聞報道，故未侵害李某的名譽權"}, {"key": "C", "text": "黑暗日報未侵害李某的隱私權"}, {"key": "D", "text": "李某可在起訴前申請法院責令黑暗日報停止報刊發行"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】①李某對以照片為載體的個人肖像享有肖像權。未經李某允許，黑暗日報擅自以複製、發行的方式使用李某的肖像，又無違法阻卻事由，根據《民法典》第1019條第1款的規定，成立對李某肖像權的侵害 。故A選項正確。 18 ，該誹謗指向特定的李某，並已向第三人公開，將造成公眾對李某社會評價降低的損害後果，根據《民法典 》第1024條的規定，成立對張某名譽權的侵害。儘管《民法典》第1025條規定新聞媒體的正當報道不構成名譽權侵權，但本案中黑暗日報具有捏造虛假事實的故意，該行為不具有免責事由。故B選項錯誤。 ③黑暗日報實施的行為系“誹謗”。所謂“誹謗”，指散布虛假事實。誹謗，可以成立侵害名譽權；誹謗一般不成立侵害隱私權。只有以特定的方式誹謗（比如以打騷擾電話、發垃圾短信等方式誹謗他人），侵害了被誹謗者的“私生活安寧”可成立對隱私權的侵害。本題中，黑暗日報所實施的行為尚不構成對李某隱私權的侵害。故C選項正確。 ④《民法典》第997條規定：“民事主體有證據證明行為人正在實施或者即將實施侵害其人格權的違法行為 ，不及時制止將使其合法權益受到難以彌補的損害的，有權依法向人民法院申請採取責令行為人停止有關行為的措施。”本案中，若繼續容許黑暗日報發布該報刊，將對李某的名譽造成不可輓回的損害，故李某可在起訴前申請法院責令黑暗日報停止發行。故D選項正確。 綜上，本題正確答案為ACD選項。"}, {"id": "卷二-52", "subject": "卷二", "type": "多選題", "question": "甲公司因擴建需要購買大型設備一台，遂向專門從事大型設備出租的乙公司提出要求租賃丙公司生產的最新型號，乙公司依靠自己多年的經驗指出另一型號性能更好，並向甲公司提出建議，待甲公司同意後即從丙公司購買該設備並出租給甲公司使用。甲公司在該設備安裝完畢後，發現不能正常運行，下列哪些判斷是正確的？（　）", "options": [{"key": "A", "text": "根據合同的相對性，即使設備存在質量瑕疵，甲公司也不能直接向丙公司索賠"}, {"key": "B", "text": "乙公司需對甲公司承擔違約責任"}, {"key": "C", "text": "租賃期間維修設備的義務屬於甲公司"}, {"key": "D", "text": "融資租賃期間，租賃物滅失的風險由甲公司承擔"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】《民法典》第741條規定：“出租人、出賣人、承租人可以約定，出賣人不履行買賣合同義務的 ，由承租人行使索賠的權利。承租人行使索賠權利的，出租人應當協助。”可見，承租人甲公司可以直接向出賣人丙公司行使索賠的權利，A選項錯誤。 《民法典》第742條規定：“租賃物不符合約定或者不符合使用目的的，出租人不承擔責任，但承租人依賴出租人的技能確定租賃物或者出租人干預選擇租賃物的除外。”本題甲公司選定設備型號依靠的是乙公司的經驗和技能，因此乙公司需對甲公司承擔責任，B選項正確。 《民法典》第712條規定，出租人應當履行租賃物的維修義務,但是當事人另有約定的除外。本題情形下，租賃期間的維修義務屬於甲公司，C選項正確。 《民法典》第756條規定：“融資租賃合同因租賃物交付承租人後意外毀損、滅失等不可歸責於當事人的原因解除的，出租人可以請求承租人按照租賃物折舊情況給予補償。”據此，在融資租賃合同中，標的物毀損滅失的風險由承租人承擔，故D項正確。"}, {"id": "卷二-53", "subject": "卷二", "type": "多選題", "question": "甲對乙享有100萬元債權，2017年1月清償期屆滿乙拒絕還款。2017年6月，法院判決乙限期還款，乙仍未還款。2017年8月，執行法院作出乙名下A房屋的拍賣成交裁定書，買受人為丙。2017年9月，乙死亡，丁為其唯一繼承人。2017年10月，丁將A房屋登記到自己名下後，又贈給女友戊，並進行了房屋變更登記。下列哪些表述是錯誤的？（　）", "options": [{"key": "A", "text": "2017年6月，甲為房屋所有人"}, {"key": "B", "text": "2017年8月，丙為房屋所有人"}, {"key": "C", "text": "2017年9月，丁為房屋所有人"}, {"key": "D", "text": "2017年10月，戊為房屋所有人"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】6月，法院判決乙限期還款，此時，A房屋所有權並沒有轉移，依然歸乙享有，故A選項錯誤。 19 登記，但丙依然取得房屋所有權，所以丁無權繼承，故C選項錯誤。10月，丁將A房屋登記到自己名下後，又贈給女友戊，並進行了房屋變更登記。丁的贈與行為構成無權處分，而戊並未以合理的價格受讓，所以不構成善意取得，戊並未取得所有權，故D選項錯誤。綜上所述，本題的正確答案為ACD。"}, {"id": "卷二-54", "subject": "卷二", "type": "多選題", "question": "戴某將其所有的房屋出租給張某，張某未經戴某同意即將房屋轉租給楊某。戴某在知道張某轉租事宜後 ，1年內均一直未做表示。下列哪些表述是正確的？", "options": [{"key": "A", "text": "戴某不得解除與張某間的租賃合同"}, {"key": "B", "text": "若張某欠付租金，則楊某只能選擇搬離該房屋"}, {"key": "C", "text": "楊某表示代替張某支付租金的，戴某不得拒絕"}, {"key": "D", "text": "張某與楊某約定的租賃期限超出張某剩餘租賃期限的部分無效"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】①《民法典》第718條規定：“出租人知道或者應當知道承租人轉租，但是在六個月內未提出異議的，視為出租人同意轉租。”戴某已經知道非法轉租超過1年，故該非法轉租已經轉化為合法轉租，戴某不再享有解除權。故A選項當選。 ②《民法典》第719條第1款規定：“承租人拖欠租金的，次承租人可以代承租人支付其欠付的租金和違約金 ，但是轉租合同對■租人不具有法律約束力的除外。”若張某欠付租金，則楊某可以要求代替張某支付租金 ，對此■租人戴某不得拒絕。故B選項不當選，C選項當選。 ③《民法典》第717條規定：“承租人經出租人同意將租賃物轉租給第三人，轉租期限超過承租人剩餘租賃期限的，超過部分的約定對出租人不具有法律約束力，但是出租人與承租人另有約定的除外。”轉租期限超過承租人剩餘租賃期限的並非無效，只是對出租人不具有法律拘束力。故D選項不當選。 綜上，本題正確答案為AC選項。"}, {"id": "卷二-55", "subject": "卷二", "type": "多選題", "question": "韓某欠董某借款10萬元已逾期5月有餘，且韓某名下無資產可供償債。董某在主張債權時，發現韓某在半年前曾向田某出售汽車一輛，但田某未支付價款，韓某時常通知田某及時支付，田某以自有房屋設立抵押權以擔保該價款的支付。下列哪些選項是錯誤的？", "options": [{"key": "A", "text": "韓某出售汽車時，董某的債權尚未到期，故董某不得主張代位權"}, {"key": "B", "text": "因韓某積極主張債權，故董某不得主張代位權"}, {"key": "C", "text": "董某主張代位權的，應當以韓某作為共同被告"}, {"key": "D", "text": "董某不得代位主張韓某享有的抵押權"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】①代位權的成立僅要求主債權與次債權均已到期，而不要求次債權的成立時間晚於主債權。故 A選項當選。 ②代位權的成立要求債務人怠於行使其債權，凡債務人未以訴訟或仲裁方式主張債權的，均可視為怠於主張權利。本題中，韓某雖多次通知田某付款，但並未起訴或申請仲裁,故董某可以主張代位權。故B選項當選。 ③債權人行使代位權的，應當以次債務人作為被告，債務人可以作為第三人。故C選項當選。 ④《民法典》第535條第1款規定“因債務人怠於行使其債權或者與該債權有關的從權利，影響債權人的到期債權實現的，債權人可以向人民法院請求以自己的名義代位行使債務人對相對人的權利，但是該權利專屬於債務人自身的除外。”債權人行使代位權，不僅可以主張債務人的債權，亦可主張相關的從權利，抵押權即屬於此種從權利。故D選項當選。 綜上，本題正確答案為ABCD選項。"}, {"id": "卷二-56", "subject": "卷二", "type": "多選題", "question": "2021年3月，甲地塊的建設用地使用權人寶通公司與乙地塊建設用地使用權人寶慶公司約定，由寶通公司可在寶慶公司修建於乙地塊上的道路上通行，雙方未就此辦理登記。5月，寶通公司將甲地塊使用權轉讓給長江公司；7月，寶慶公司將乙地塊轉讓給不知情的黃河公司。對此，下列哪些說法是正確的？", "options": [{"key": "A", "text": "2021年3月，寶通公司取得對乙地塊的地役權"}, {"key": "B", "text": "2021年5月後，寶通公司不再享有地役權專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 20"}, {"key": "C", "text": "2021年5月後，長江公司對乙地塊享有地役權"}, {"key": "D", "text": "2021年7月後，長江公司對乙地塊享有地役權"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】①關於地役權的設立，《民法典》第374條規定：“地役權自地役權合同生效時設立。當事人要求登記的，可以向登記機構申請地役權登記；未經登記，不得對抗善意第三人。”地役權的設立釆意思主義的物權變動模式，地役權的設立不以辦理地役權設立登記為生效要件。2021年3月，寶通公司與寶慶公司約定寶通公司在寶慶公司的乙地塊設立通行地役權，自寶通公司與寶慶公司設立地役權的合同生效時，寶通公司對寶慶公司的乙地塊享有地役權（無須登記）。故A選項正確。 ②地役權具有從屬性。《民法典》第380條規定：“地役權不得單獨轉讓。土地承包經營權、建設用地使用權等轉讓的，地役權一併轉讓，但是合同另有約定的除外。”《民法典》第381條規定：“地役權不得單獨抵押 。土地經營權、建設用地使用權等抵押的，在實現抵押權時，地役權一併轉讓。”2021年5月，寶通公司將甲地塊過戶給長江公司時，長江公司在受讓甲地塊不動產權利的同時，基於地役權所具有的“移轉上的從屬性 ”，長江公司取得對寶慶公司的乙地塊的地役權。故C選項正確。2021年5月，寶通公司將甲地塊過戶給長江公司，寶通公司不再對需役地享有不動產權利，基於地役權所具有的“消滅上的從屬性”，寶通公司曾經享有的地役權因此消滅。故B選項正確。 ③根據《民法典》第374條的規定，寶通公司的地役權設立後沒有辦理設立登記，不能對抗善意受讓供役地 （即乙地塊）權利的善意第三人。2021年7月，黃河公司善意受讓了乙地塊，因此長江公司不能對善意的受讓人黃河公司主張地役權。 綜上，本題正確答案為ABC選項。"}, {"id": "卷二-57", "subject": "卷二", "type": "多選題", "question": "喜好網球和游泳的趙某從宏大公司購買某小區商品房一套，交房時發現購房時宏大公司售樓部所展示的該小區模型中的網球場和游泳池並不存在。經查，該小區設計中並無網球場和游泳池。下列哪些選項是正確的 ？（　）", "options": [{"key": "A", "text": "趙某有權要求退房"}, {"key": "B", "text": "趙某如要求退房，有權請求宏大公司承擔締約過錯責任"}, {"key": "C", "text": "趙某如要求退房，有權請求宏大公司雙倍返還購房款"}, {"key": "D", "text": "趙某如不要求退房，有權請求宏大公司承擔違約責任"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】根據《最高人民法院關於審理商品房買賣合同糾紛案件適用法律若干問題的解釋》第3條規定 ，商品房的銷售廣告和宣傳資料為要約邀請，但是出賣人就商品房開發規劃範圍內的房屋及相關設施所作的說明和允諾具體確定，並對商品房買賣合同的訂立以及房屋價格的確定有重大影響的，構成要約。該說明和允諾即使未載入商品房買賣合同，亦應當為合同內容，當事人違反的，應當承擔違約責任。購房時宏大公司售樓部所展示的該小區模型中的網球場和游泳池對於趙某而言，應構成要約。而小區設計中並無網球場和游泳池，表明宏大公司有欺詐行為，根據《民法典》第148條的規定，趙某有權申請法院撤銷該買賣合同，撤銷後有過錯的宏大公司應根據《民法典》第500條承擔締約過失責任。如果趙某不申請撤銷，則可以違約為由 ，請求宏大公司承擔違約責任。2003年《最高人民法院關於審理商品房買賣合同糾紛案件適用法律若干問題的解釋》第8條、第9條曾規定出賣人承擔雙倍購房款賠償責任的情形，2020年《最高人民法院關於審理商品房買賣合同糾紛案件適用法律若干問題的解釋》刪除了上述規定。故依據2020年《最高人民法院關於審理商品房買賣合同糾紛案件適用法律若干問題的解釋》，張某的請求於法無據，C項錯誤。因此，本題正確答案應為ABD。 【陷阱】一般情況下，商品房的銷售廣告和宣傳資料為要約邀請，但符合下列條件時，應當視為要約 ：（1）出賣人就商品房開發規劃範圍內的房屋及相關設施所作的說明和允諾具體確定；（2）對商品房買賣合同的訂立以及房屋價格的確定有重大影響。同時，即使該說明和允諾未載入商品房買賣合同，也應當視為合同內容，當事人違反的，應當承擔違約責任。"}, {"id": "卷二-58", "subject": "卷二", "type": "多選題", "question": "韓某向董某借款50萬元，約定於2020年9月2日償還，董某以自有房屋設立抵押權進行擔保，同時田某為此專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 21 提供保證擔保，但約定禁止韓某轉讓債權。後董某購買韓某價值30萬元的二手汽車一輛，約定於2020年8月 7日支付價款。2020年8月20日，韓某將債權讓與毛某，並於同月25日通知董某、田某。對此，下列哪些選項是正確的？", "options": [{"key": "A", "text": "毛某於8月20日取得對董某的債權"}, {"key": "B", "text": "毛某於8月25日取得對董某的債權"}, {"key": "C", "text": "田某應繼續承擔保證責任"}, {"key": "D", "text": "8月25H,董某可向毛某主張抵銷30萬元"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】①根據《民法典》第545條的規定，韓某將對董某的50萬元債權轉給毛某,僅需符合三個條件 ：第一，該債權具有可讓與性；第二，讓與人具有處分權；第三，韓某、毛某讓與協議有效。2020年8月20日 ，這三個條件具備，發生轉讓轉讓的效果，毛某替代韓某對董某享有50萬元債權。通知董某並非債權轉讓的生效要件，而是債權轉讓對債務人董某生效的要件。故A選項正確；B選項錯誤。 ②《民法典》第547條第1款規定：“債權人轉讓債權的，受讓人取得與債權有關的從權利，但是該從權利專屬於債權人自身的除外。”《民法典》第696條第1款規定：“債權人將全部或者部分債權轉讓給第三人，通知保證人後，保證人對受讓人承擔相應的保證責任。未經通知，該轉讓對保證人不發生效力。”《民法典》 第696條第2款規定：“保證人與債權人約定僅對特定的債權人承擔保證責任或者禁止債權轉讓，債權人未經保證人書面同意轉讓全部或者部分債權的，保證人就受讓人的債權不再承擔保證責任。”因為保證人田某與債權人韓某約定“禁止韓某轉讓債權”，因此，未田某書面同意，韓某將債權全部轉讓給毛某後，田某不再承擔保證責任。故C選項錯誤。 ③《民法典》第549條規定：“有下列情形之一的，債務人可以向受讓人主張抵銷：（一）債務人接到債權轉讓通知時，債務人對讓與人享有債權，並且債務人的債權先於轉讓的債權到期或者同時到期；（二）債務人的債權與轉讓的債權是基於同一合同產生。”據此，債權轉讓後，董某有權以其對韓某享有的30債權對毛某主張抵銷（毛某對董某50萬元債權中的30萬元），須符合兩個條件：第一，董某對韓某30萬元債權成立於 “債權轉讓通知到達董某之前”；第二，董某對韓某30萬元債權的履行期“先於”毛某對董某50萬元債權到期或者“同時”到期。本題中，兩個要件均滿足，故董某可以主張抵銷。故D選項正確。 綜上，本題正確答案為AD選項。"}, {"id": "卷二-59", "subject": "卷二", "type": "多選題", "question": "甲、乙、丙三人共有2間廠房、3130萬元現金以及1艘遊艇，現三人決定分割。在協商過程中，甲、乙二人認為自己應當各得一間廠房，剩下的現金和遊艇由丙獲得。而丙則認為自己應當得到一間廠房及50萬元現金 ．其餘由甲、乙二人平分。下列說法正確的有？（　）", "options": [{"key": "A", "text": "如果三人的出資額無法確定，應當認定各占1／3份額"}, {"key": "B", "text": "法院只能在甲、乙提出的方案和丙提出的方案之間進行選擇"}, {"key": "C", "text": "法院若認為實物難以分割．可以採取通過拍賣或變賣的方式分割"}, {"key": "D", "text": "如果採取變價的方式分割廠房。三人均有同等條件下的優先購買權"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】本題涉及共有財產的分割。首先，對集合物的共有應當認定成立於單個的物之上，因此甲、乙 、丙三人對廠房、現金、遊艇分別成立按份共有。又根據《民法典》第309條的規定，按份共有人對共有份額沒有約定或約定不明，又無法確定出資額的，應當視為等額享有，選項A正確。根據《民法典》第304條的規定．共有人可以採取協議分割方式，達不成協議時應當採取實物分割：難以分割或者因分割會減損價值的 ，應當對折價或者拍賣、變賣的價款分割。但法院在判決是否分割以及如何分割時．當事人分割方案僅為參考，故B選項錯誤，C選項正確。《民法典》第306條規定，按份共有人對共有份額的優先購買權，因甲、乙、 丙三人的共有成立在單個物之上。因此甲、乙、丙三人對房屋均有優先購買權。D選項正確。因此，本題正確選項為ACD。"}, {"id": "卷二-60", "subject": "卷二", "type": "多選題", "question": "孫大娃被招為上門女婿與宋翠花結婚，婚後生子宋二娃。宋二娃與孔菜花結婚後生子宋三娃，宋三娃2歲時父親因拐賣被判20年有期徒刑，孔菜花無力撫養幼子，宋三娃由獨身的表叔蔣公英撫養成人。三娃暗戀本專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 22 村的第一個大學生鄰家女孩木子美。宋三娃20歲時向公安機關提出變更姓名的申請。下列假設的四個申請中 ，哪些選項可以得到公安機關准許？（　）", "options": [{"key": "A", "text": "隨祖父孫大娃姓，更名為“孫立德”"}, {"key": "B", "text": "隨母親孔菜花姓，更名為“孔立功”"}, {"key": "C", "text": "隨表叔蔣公英姓，更名為“蔣中正”"}, {"key": "D", "text": "隨鄰居木子美姓，更名為“木立言”"}], "answer": ["A", "B"], "explanation_full": "【羿文解析】《民法典》第1015條規定：“自然人應當隨父姓或者母姓，但是有下列情形之一的．可以在父姓和母姓之外選取姓氏：（一）選取其他直系長輩血親的姓氏；（二）因由法定扶養人以外的人扶養而選取扶養人姓氏；（三）有不違背公序良俗的其他正當理由。少數民族自然人的姓氏可以遵從本民族的文化傳統和風俗習慣。”宋三娃變更姓名。選取直系長輩血親祖父的姓氏姓“孫”，符合要求，故A選項正確。選取母親的姓氏姓“孔”，符合要求，故B選項正確。選取法定之外的扶養人表叔的姓氏姓“蔣”，符合要求，但取名為“蔣中正”，有違公序良俗，故C選項錯誤。選取鄰居的姓氏姓“木”，並無正當理由，故D選項錯誤。 本題正確選項為AB。"}, {"id": "卷二-61", "subject": "卷二", "type": "多選題", "question": "根據民法中物的分類標準，下列哪些屬於物的重要成分？（　）", "options": [{"key": "A", "text": "情人節花束中的巧克力"}, {"key": "B", "text": "香水的香水瓶"}, {"key": "C", "text": "“一包多背”的包的肩帶"}, {"key": "D", "text": "山地自行車的變速器"}], "answer": ["B", "D"], "explanation_full": "【羿文解析】本題涉及物的重要成分。物的重要成分是指在一個物之相互結合的各個部分中．非經毀損或者變更其性質，不能分離者。情人節花束中的巧克力起的是裝飾作用，它可以輕鬆脫離花束而不致花束受損 ，兩者是相互獨立的物，結合關係鬆散。同理。“一包多背”的包的肩帶可自由拆卸、搭配，並非專屬於包 。但香水不能沒有香水瓶，變速器也是山地自行車不可或缺的重要部件。故選BD。"}, {"id": "卷二-62", "subject": "卷二", "type": "多選題", "question": "王某因風暴即將來臨，遂給房屋加固。其鄰居郭某看見後主動上前幫忙，但王某婉拒了郭某。後來，郭某不聽勸阻，執意幫助王某加固房屋，但在給屋頂加固時，不慎從屋頂上摔下。郭某要求王某賠償。對此，下列說法中，不正確的有？（　）", "options": [{"key": "A", "text": "郭某的幫助行為屬於無因管理，王某應當賠償其損失"}, {"key": "B", "text": "郭某的幫助行為屬於自願行為，王某無需賠償其損失"}, {"key": "C", "text": "因雙方都無過錯，應當按照公平原則處理"}, {"key": "D", "text": "王某可在受益範圍內給郭某適當補償"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】本題涉及無償幫工人受損失的。被幫工人的責任問題。依據《人身損害賠償解釋》第5條的規定 ，無償提供勞務的幫工人因幫工活動遭受人身損害的，根據幫工人和被幫工人各自的過錯承擔相應的責任 ；被幫工人明確拒絕幫工的，被幫工人不承擔賠償責任，但可以在受益範圍內予以適當補償。故本題正確選項為ABC。"}, {"id": "卷二-63", "subject": "卷二", "type": "多選題", "question": "甲公司與乙公司簽訂了一份微波爐供貨合同，約定甲公司供給乙公司某型號微波爐1000台，每部單價 300元，一方違約應向對方支付5萬元違約金。乙公司向甲公司支付了5萬元定金，並將該批微波爐轉售給丙公司，每台單價330元，指明由甲公司直接交付給丙公司。但甲公司未按約定時間交貨。關於甲、乙、丙公司之間違約責任的承擔，下列表述正確的是？（　）", "options": [{"key": "A", "text": "丙公司無權請求甲公司向自己承擔違約責任"}, {"key": "B", "text": "丙公司有權請求甲公司向自己承擔違約責任"}, {"key": "C", "text": "丙公司有權請求乙公司承擔延遲交貨的違約責任專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 23"}, {"key": "D", "text": "丙公司無權請求乙公司承擔遲延交貨的違約責任"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】《民法典》第523條規定：當事人約定由第三人向債權人履行債務，第三人不履行債務或者履行債務不符合約定的，債務人應當向債權人承擔違約責任。根據合同相對性原理，在乙、丙之間的買賣合同中 ，當事人約定由第三人甲向債權人丙履行債務，如果甲未向丙履行，丙只能請求乙承擔違約責任，不能請求第三人甲承擔違約責任，故選項A正確，選項B錯誤。甲在法律地位上屬於債務人乙公司的履行輔助人，甲公司對債權人丙公司的違約行為，均屬於可歸責於債務人乙公司的違約行為。因此，甲公司遲延向丙公司交貨 ．丙公司有權請求乙公司承擔遲延交貨的違約責任。故選項C正確，選項D錯誤。因此，本題答案為AC。"}, {"id": "卷二-64", "subject": "卷二", "type": "多選題", "question": "下列屬於社團法人的組織是？（　）", "options": [{"key": "A", "text": "農村信用合作社"}, {"key": "B", "text": "中國法學會"}, {"key": "C", "text": "中國文聯"}, {"key": "D", "text": "聯想集團公司"}], "answer": ["B", "C"], "explanation_full": "【羿文解析】《民法典》第87條規定，“為公益目的或者其他非營利目的成立，不向出資人、設立人或者會員分配所取得利潤的法人，為非營利法人。非營利法人包括事業單位、社會團體、基金會、社會服務機構等 ”。第90條規定，“具備法人條件，基於會員共同意願，為公益目的或者會員共同利益等非營利目的設立的社會團體，經依法登記成立，取得社會團體法人資格；依法不需要辦理法人登記的，從成立之日起，具有社會團體法人資格”。據此可知，社團法人至少需要為公益目的或者會員共同利益等非營利目的，有會員，並基於會員共同意願展開活動。本題中A選項農村信用合作社屬於經營性質企業，D選項聯想集團公司屬於營利公司，B、C選項均是非為營利目的且有會員，符合社團法入的定義。故本題應選BC。"}, {"id": "卷二-65", "subject": "卷二", "type": "多選題", "question": "萬聯商貿公司與千禧糧油公司訂立了大米買賣合同，雙方約定由萬聯商貿公司向千禧糧油公司支付貨款 6萬元，千禧糧油公司向萬聯商貿公司提供大米20噸。萬聯公司付款後，又與千禧公司訂立補充協議：20噸大米由千禧糧油公司直接交付給百瑞食品公司，以償換萬聯公司所欠的貨款。關於本案，下列哪些選項是錯誤的？（　）", "options": [{"key": "A", "text": "千禧公司沒有向百瑞公司交付大米的義務"}, {"key": "B", "text": "百瑞公司有權要求千禧公司交付大米"}, {"key": "C", "text": "千禧公司向百瑞公司因交付大米所增加的費用，由萬聯公司承擔"}, {"key": "D", "text": "若千禧公司交付的大米有質量問題，百瑞公司可以直接請求千禧公司承擔違約責任"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】《民法典》第522條規定：“當事人約定由債務人向第三人履行債務的，債務人未向第三人履行債務或者履行債務不符合約定，應當向債權人承擔違約責任。”本條規定的是向第三人履行的合同，這種合同的主體未變，第三人只是作為接受債權的人，而不是合同當事人。本題中，萬聯公司與千禧公司訂立補充協議，約定：20噸大米由千禧糧油公司直接交付給百瑞食品公司，即萬聯公司與千禧公司仍是合同相對人 ，只是該合同向第三人百瑞公司履行，因此，千禧公司需要受到該合同的約束，負有向百瑞公司交付大米的義務，作為第三人的百瑞公司也有權要求債務人千禧公司交付20噸大米，故A選項錯誤，當選；B選項正確 ，不當選。另外，向第三人履行原則上不能增加債務人的履行費用，因此在雙方沒有約定增加的費用如何負擔時，應由原收貨人萬聯公司負擔，故C選項正確，不當選。仍由上述可知，萬聯公司和千禧公司才是該補充協議的相對人，若千禧公司交付的大米有質量問題，千禧公司應向萬聯公司承擔違約責任，百瑞公司也只能向自己的債務人萬聯公司追究責任，而不能直接求千禧公司承擔違約責任，故D選項錯誤，當選。"}, {"id": "卷二-66", "subject": "卷二", "type": "多選題", "question": "關於建設項目的環境影響評價，下列哪些說法是錯誤的？", "options": [{"key": "A", "text": "可能造成重大環境影響的，應當編製環境影響報告表，對產生的環境影響進行分析或者專項評價"}, {"key": "B", "text": "環境影響報告表和環境影響登記表的內容和格式，由省級生態環境主管部門制定專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 24"}, {"key": "C", "text": "已經進行了環境影響評價的規劃包含具體建設項目的，規劃的環境影響評價結論應當作為建設項目環境影響評價的重要依據，建設項目環境影響評價的內容應當根據規劃的環境影響評價審查意見予以簡化"}, {"key": "D", "text": "審核、審批建設項目環境影響報告書、報告表以及備案環境影響登記表，應繳納相應費用"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】①A選項錯誤，《環境影響評價法》第16條第2款：“建設單位應當按照下列規定組織編製環境影響報告書、環境影響報告表或者填報環境影響登記表（以下統稱環境影響評價文件）：（一）可能造成重大環境影響的，應當編製環境影響報告書，對產生的環境影響進行全面評價……”因此，可能造成重大環境影響的，應當編製環境影響報告書，而非報告表。 ②B選項錯誤，《環境影響評價法》第17條第2款：“環境影響報告表和環境影響登記表的內容和格式，由國務院生態環境主管部門制定。”因此，應由國務院態環境主管部門制定，而非省級生態環境主管部門制定。 ③C選項正確，D選項錯誤，《環境影響評價法》第22條第五款：“審核、審批建設項目環境影響報告書、報告表以及備案環境影響登記表，不得收取任何費用。” 綜上，本題正確答案為ABD選項。"}, {"id": "卷二-67", "subject": "卷二", "type": "多選題", "question": "甲乙丙三人擬共同設立一個有限合夥企業，下列哪些表述是錯誤的？（　）", "options": [{"key": "A", "text": "該有限合夥企業至少應當有一個普通合夥人"}, {"key": "B", "text": "經合夥協議約定，有限合夥人可以貨幣、實物、勞務、知識產權或其他財產作價出資"}, {"key": "C", "text": "經合夥協議約定，有限合夥人可以執行部分合夥事務"}, {"key": "D", "text": "如有限合夥人轉為普通合夥人，則對其作為有限合夥人期間企業的債務不承擔連帶責任"}], "answer": ["B", "C", "D"], "explanation_full": "【羿文解析】有限合夥企業至少應當有一個普通合夥人，否則就應當解散，選項A正確。關於有限合夥人的出資，《合夥企業法》第64條明確規定，有限合夥人可以用貨幣、實物、知識產權、土地使用權或者其他財產權利作價出資。有限合夥人不得以勞務出資。B項將勞務包括在內，是錯誤的。《合夥企業法》第68條規定 ，有限合夥人不執行合夥事務，不得對外代表有限合夥企業。這是強制性規定，合夥協議也不得做出例外規定，故選項C錯誤。有限合夥人轉變為普通合夥人的，對其作為有限合夥人期間有限合夥企業發生的債務承擔無限連帶責任。根據《合夥企業法》第83條的規定可知，D項錯誤。 【陷阱】有限合夥企業在許多方面區別於普通合夥企業，這是司法考試的重點。有限合夥人不得以勞務，但普通合夥人有權以勞務出資；普通合夥人均有合夥事務執行權，但在《合夥企業法》明確列舉的不視為執行合夥事務的情形之外，禁止有限合夥人執行合夥事務，這是其有限責任的代價。"}, {"id": "卷二-68", "subject": "卷二", "type": "多選題", "question": "住所地在甲市A區的新興公司與住所地在甲市B區的望月公司簽訂了一份買賣合同，合同約定履行地為甲市", "options": [{"key": "D", "text": "區。另外合同中約定：若發生爭議，均提交C縣的仲裁機構仲裁。在該合同的履行過程中，望月公司沒有按期支付貨款，新興公司準備起訴追究望月公司的違約責任。關於本案的糾紛解決方式，下列哪些說法是正確的？"}, {"key": "A", "text": "新興公司可向D區法院起訴"}, {"key": "B", "text": "A區法院對該案沒有管轄權"}, {"key": "C", "text": "新興公司可向B區法院起訴"}, {"key": "D", "text": "該仲裁協議有效，新興公司可以據此申請仲裁"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】①在縣和不設區的市，沒有民商事仲裁機構，因此本案仲裁協議中約定的仲裁委員會根本不存在，仲裁協議無效。但是仲裁協議無效的，不影響當事人的起訴權，本案屬於合同糾紛，應當由合同履行地或被告住所地法院管轄，因此對本案有管轄的法院為甲市D區法院和甲市B區法院。選項A說法正確，當選。 ②據前所述，選項B說法正確，當選。 ③據前所述，選項C說法正確，當選。 ④據前所述，仲裁協議無效，新興公司無權申請仲裁，因此選項D說法錯誤，不選。綜上，本題正確答案為 ABC選項。 25"}, {"id": "卷二-69", "subject": "卷二", "type": "多選題", "question": "關於試用期的規定，下列哪些表述是錯誤的？", "options": [{"key": "A", "text": "試用期不包含在勞動合同期限內，勞動合同僅約定試用期的，該期限為勞動合同期限"}, {"key": "B", "text": "同一用人單位與同一勞動者只能約定一次試用期"}, {"key": "C", "text": "勞動者在試用期的工資不得低於用人單位平均工資的百分之八十，以及社會的平均工資"}, {"key": "D", "text": "勞動合同期限一年以上不滿三年的，試用期不得超過三個月"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】①A選項錯誤，B選項正確，《勞動合同法》第19條第2款：“同一用人單位與同一勞動者只能約定一次試用期。”第4款：“試用期包含在勞動合同期限內。勞動合同僅約定試用期的，試用期不成立，該期限為勞動合同期限。” ②C選項錯誤，《勞動合同法》第20條：“勞動者在試用期的工資不得低於本單位相同崗位最低檔工資或者勞動合同約定工資的百分之八十，並不得低於用人單位所在地的最低工資標準。”因此，應為“用人單位所在地的最低工資標準”。 ③D選項錯誤，《勞動合同法》第19條第1款：“勞動合同期限三個月以上不滿一年的，試用期不得超過一個月；勞動合同期限一年以上不滿三年的，試用期不得超過二個月；三年以上固定期限和無固定期限的勞動合同，試用期不得超過六個月。” 綜上，本題正確答案為ACD選項。"}, {"id": "卷二-70", "subject": "卷二", "type": "多選題", "question": "依據《車船稅法》，下列哪些說法是錯誤的？", "options": [{"key": "A", "text": "市級人民政府根據當地實際情況，可以對公共交通車船，農村居民擁有並主要在農村地區使用的摩托車、 三輪汽車和低速載貨汽車定期減徵或者免徵車船稅"}, {"key": "B", "text": "對節約能源、使用新能源的車船只可減徵車船稅"}, {"key": "C", "text": "機動車車船稅的扣繳義務人是從事機動車第三者責任強制保險業務的保險機構"}, {"key": "D", "text": "車船稅的納稅地點為車船的所有人或者管理人所在地"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】①A選項錯誤，應為省、自治區、直轄市人民政府，即省級政府而非市級政府。 ②B選項錯誤，對節約能源、使用新能源的車船可以減徵或者免徵車船稅；對受嚴重自然災害影響納稅困難以及有其他特殊原因確需減稅、免稅的，可以減徵或者免徵車船稅。可減徵或免徵，並非只有減徵。 ③C選項錯誤，從事機動車第三者責任強制保險業務的保險機構為機動車車船稅的扣繳義務人，應當在收取保險費時依法代收車船稅，並出具代收稅款憑證。 ④D選項錯誤，車船稅的納稅地點為車船的登記地或者車船稅扣繳義務人所在地。依法不需要辦理登記的車船 ，車船稅的納稅地點為車船的所有人或者管理人所在地。 綜上，本題正確答案為ABCD選項。"}, {"id": "卷二-71", "subject": "卷二", "type": "多選題", "question": "張源為某有限合夥企業的普通合夥人，李飛為有限合夥人。張源、李飛分別向銀行借款200萬元，在未徵得其他合夥人同意的情況下，將其合夥份額出質給銀行，則下列哪些說法是錯誤的？", "options": [{"key": "A", "text": "張源和李飛的合夥財產份額出質無效"}, {"key": "B", "text": "李飛可直接自由轉讓自己在合夥企業的份額，無須通知其他合夥人並經其他合夥人同意"}, {"key": "C", "text": "若法院強制執行李飛的合夥企業財產份額，應當通知其他普通合夥人，其他合夥人有優先購買權"}, {"key": "D", "text": "若張源無法清償銀行債務，法院強制執行其持有的合夥企業財產份額，若其他合夥人不行使優先購買權 ，也不同意份額轉讓，則視為同意轉讓"}], "answer": ["A", "B", "D"], "explanation_full": "26 李飛作為有限合夥人，在合夥協議沒有另行約定時，可以將自己的份額出質，並非直接無效。②B選項錯誤 ，《合夥企業法》第73條：“有限合夥人可以按照合夥協議的約定向合夥人以外的人轉讓其在有限合夥企業中的財產份額，但應當提前三十日通知其他合夥人。”因此，有限合夥人可以自由轉讓合夥份額，但是需提前30日通知其他合夥人。④C選項正確，D選項錯誤《合夥企業法》第42條第2款：“人民法院強制執行合夥人的財產份額時，應當通知全體合夥人，其他合夥人有優先購買權；其他合夥人未購買，又不同意將該財產份額轉讓給他人的，依照本法第五十一條的規定為該合夥人辦理退夥結算，或者辦理削減該合夥人相應財產份額的結算。”因此，法院強制執行合夥人的份額時，應通知其他合夥人，其他合夥人有優先購買權，其他合夥人不購買也不同意轉讓的，則應辦理退夥結算。綜上，本題正確答案為ABD選項。"}, {"id": "卷二-72", "subject": "卷二", "type": "多選題", "question": "2012年6月，中國甲公司與日本乙公司簽訂了進口一批馬油的合同。6月底，中國甲公司向中國銀行黑龍江分行申請開立了信用證，信用證上載明貨物為特級馬油5000箱。日本乙公司將貨物發運後，憑所獲單據向銀行要求付款。中國銀行黑龍江分行審單時發現信用證要求的裝船時間為不晚於7月15S,而提單上載明的裝船日期為7月18So根據《跟單信用證統一慣例》（UCP600）及我國相關司法解釋，下列說法中正確的為哪些？", "options": [{"key": "A", "text": "銀行的審單期最多為收單翌日起5個工作日"}, {"key": "B", "text": "中國銀行黑龍江分行可以自行決定是否聯繫中國甲公司，如果收到中國甲公司放棄不符點的通知，該銀行應當釋放單據"}, {"key": "C", "text": "中國銀行黑龍江分行可以單證不一致為由拒絕收單付款"}, {"key": "D", "text": "如果該批貨物在運輸途中遭遇風險已滅失，中國銀行黑龍江分行有權拒絕收單付款"}], "answer": ["A", "C"], "explanation_full": "【羿文解析】①UCP600規定開證行、保兌行和指定銀行在收到單據後的處理時間最多為收單翌日起第5個工作日，選項A正確。 ②UCP600明確當開證行確定單證不符時，可以自行決定聯繫申請人放棄不符點，如果收到開證申請人放棄不符點的通知，則可以釋放單據，而非應當釋放單據，選項B錯誤、C正確。 ③信用證下銀行承擔的是單證、單單相符的責任，選項D錯誤。 綜上，本題正確答案為AC選項。"}, {"id": "卷二-73", "subject": "卷二", "type": "多選題", "question": "甲公司因與乙公司合同糾紛申請仲裁，要求解除合同。某仲裁委員會經審理裁決解除雙方合同，還裁決乙公司賠償甲公司損失六萬元。關於本案的仲裁裁決，下列哪些表述是正確的？（　）", "options": [{"key": "A", "text": "因仲裁裁決超出了當事人請求範圍，乙公司可申請撤銷超出甲公司請求部分的裁決"}, {"key": "B", "text": "因仲裁裁決超出了當事人請求範圍，乙公司可向法院提起訴訟"}, {"key": "C", "text": "因仲裁裁決超出了當事人請求範圍，乙公司可向法院申請再審"}, {"key": "D", "text": "乙公司可申請不予執行超出甲公司請求部分的仲裁裁決"}], "answer": ["A", "D"], "explanation_full": "【羿文解析】《仲裁法解釋》第19條規定，當事人以仲裁裁決事項超出仲裁協議範圍為由申請撤銷仲裁裁決 ，經審查屬實的，人民法院應當撤銷仲裁裁決中的超裁部分。但超裁部分與其他裁決事項不可分的，人民法院應當撤銷仲裁裁決。本題中，仲裁委員會的仲裁裁決超出了當事人的請求範圍，乙公司可申請撤銷超出甲公司請求部分的裁決，A選項正確，應選。根據《民事訴訟法》第237條第2款規定，乙公司還可以向法院申請不予執行超出甲公司請求部分的仲裁裁決，D選項正確，應選。但在超出當事人請求範圍的裁決未被撤銷或不予執行之前，乙公司不可以就該超出事項向法院提起訴訟，故B、C選項不正確，不應選。本題正確答案為 AD。"}, {"id": "卷二-74", "subject": "卷二", "type": "多選題", "question": "關於企業所得稅的說法，哪些選項是正確的？（　）", "options": [{"key": "A", "text": "東光公司國債利息收入為免稅收入"}, {"key": "B", "text": "聯夢公司（非居民企業）從湖廣公司（居民企業）取得投資收益為免稅收入"}, {"key": "C", "text": "雛鷹公司從事養豬項目的所得可以減徵企業所得稅"}, {"key": "D", "text": "華為公司開發新技術研究開發費用，可以在計算應納稅所得額時加計扣除專業網校課程、題庫軟件、考試用書、資訊信息全方位一體化職業考試學習平台羿文教育官網 www.yiwenjy.com 版權所有 27"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】《企業所得稅法》第26條規定：“企業的下列收入為免稅收入：（一）國債利息收入；（二 ）符合條件的居民企業之間的股息、紅利等權益性投資收益；（三）在中國境內設立機構、場所的非居民企業從居民企業取得與該機構、場所有實際聯繫的股息、紅利等權益性投資收益；（四）符合條件的非營利組織的收入。”B選項錯誤，在中國境內設立機構、場所的非居民企業從居民企業取得與該機構、場所有實際聯繫的股息、紅利等權益性投資收益為免稅收入。A、C、D選項正確，符合《企業所得稅法》的規定。"}, {"id": "卷二-75", "subject": "卷二", "type": "多選題", "question": "臨海是聽濤有限公司的小股東，持股5%；同時，臨海還在靜言有限公司任董事，而聽濤公司與靜言公司均從事保險經紀業務。聽濤公司多年沒有給臨海分紅，臨海一直對其會計賬簿存有疑惑。關於本案，下列哪些選項是正確的？（　）", "options": [{"key": "A", "text": "臨海可以用口頭或書面形式提出■賬請求"}, {"key": "B", "text": "臨海可以提議召開臨時股東會表決查賬事宜"}, {"key": "C", "text": "聽濤公司無權要求臨海先向監事會提出查賬請求"}, {"key": "D", "text": "聽濤公司有權以臨海的■賬目的不具正當性為由拒絕其查賬請求"}], "answer": ["C", "D"], "explanation_full": "【羿文解析】《公司法》第33條第2款規定：“股東可以要求查閱公司會計賬簿。股東要求查閱公司會計賬簿的，應當向公司提出書面請求，說明目的。公司有合理根據認為股東查閱會計賬簿有不正當目的，可能損害公司合法利益的，可以拒絕提供查閱，並應當自股東提出書面請求之日起十五日內書面答覆股東並說明理由 。公司拒絕提供查閱的，股東可以請求人民法院要求公司提供查閱。”A、B選項錯誤。C、D選項正確。"}, {"id": "卷二-76", "subject": "卷二", "type": "多選題", "question": "上海金大廈房地產開發公司開發了一個名為“天宏大廈”的房地產項目，該項目的業主吉姆娜發現該項目的實際情況與合同中載明的內容以及行政部門批准規劃的內容差異較大，存在嚴重的合同欺詐，遂於2012年 8月向法院起訴要求賠償並獲勝訴。法院判決生效後，金大廈公司的總經理葛朗台蔑視法院判決的效力，拒不履行判決的給付內容，2013年4月吉姆娜只得向法院申請強制執行。就執行措施而言，下列哪些說法是正確的 ？", "options": [{"key": "A", "text": "法院應當向金大廈公司發出執行通知。並可以對其立即採取強制執行措施"}, {"key": "B", "text": "對於金大廈公司與他人惡意串通，通過另啟訴訟的方式逃避執行的，法院可以對金大廈公司予以罰款，構成犯罪的，依法追究刑事責任"}, {"key": "C", "text": "法院可以責令金大廈公司支付遲延履行期間的債務利息"}, {"key": "D", "text": "法院可以對經法院要求而拒不報告公司財產狀況的金大廈公司的法人代表葛朗台適用拘留的強制措施"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】根據《民事訴訟法》第240條的規定，執行員接到申請執行書或者移交執行書，應當向被執行人發出執行通知。並可以立即採取強制執行措施，故A項說法正確。 根據《民事訴訟法》第112條的規定，當事人之間惡意串通，企圖通過訴訟、調解等方式侵害他人合法權益的 ，人民法院應當駁回其請求，並根據情節輕重予以罰款、拘留；構成犯罪的，依法追究刑事責任。故B項說法正確。 根據《民事訴訟法》第253條的規定，被執行人未按判決、裁定和其他法律文書指定的期間履行給付金錢義務的，應當加倍支付遲延履行期間的債務利息。被執行人未按判決、裁定和其他法律文書指定的期間履行其他義務的，應當支付遲延履行金。故C項說法正確。 根據《民事訴訟法》第241條的規定，被執行人未按執行通知履行法律文書確定的義務。應當報告當前以及收到執行通知之日前1年的財產情況。被執行人拒絕報告或者虛假報告的。人民法院可以根據情節輕重對被執行人或者其法定代理人、有關單位的主要負責人或者直接責任人員予以罰款、拘留。故D項說法正確。"}, {"id": "卷二-77", "subject": "卷二", "type": "多選題", "question": "齊某、周某合作開發一製圖軟件，未約定著作權歸屬。因對著作權的行使發生爭執，發表前，未經齊某同意，周某將該軟件上傳到“太平洋軟件網站’’詳細介紹其功能與特點。梅某下載該軟件後複製銷售。甲製圖軟件研發公司以合理價格從正常渠道購得後，將該軟件複製到電腦中，專門用於研究其設計思想和原理。 28 乙工程設計院以合理價格從正常渠道購得後，將該軟件複製到電腦中，用於為客戶繪製工程設計圖，獲利頗豐。下列哪些選項是錯誤的？（　）", "options": [{"key": "A", "text": "周某的行為侵犯了齊某的信息網絡傳播權"}, {"key": "B", "text": "周某的行為侵犯了齊某的發表權"}, {"key": "C", "text": "齊某、周某有權請求乙賠償損失"}, {"key": "D", "text": "齊某、周某有權請求甲刪除其電腦中的該軟件複製件"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】該軟件系齊某、周某的合作作品，且不能分割使用，根據《著作權法實施條例》第9條規定，合作作品不可以分割使用的，其著作權由各合作作者共同享有，通過協商一致行使;不能協商一致，又無正當理由的，任何一方不得阻止他方行使除轉讓以外的其他權利，但是所得收益應當合理分配給所有合作作者。故周某有權不經齊某許可，行使除“轉讓權”以外的其他著作權，因此周某擅自將該軟件發表、通過信息網絡傳播的行為未侵犯齊某的發表權與信息網絡傳播權。故A、B選項表述錯誤，當選。《計算機軟件保護條例》 第30條規定：“軟件的複製品持有人不知道也沒有合理理由應當知道該軟件是侵權複製品的，不承擔賠償責任；但是，應當停止使用、銷毀該侵權複製品。如果停止使用並銷毀該侵權複製品將給複製品使用人造成重大損失的，複製品使用人可以在向軟件著作權人支付合理費用後繼續使用。”乙購買盜版軟件並複製的行為侵犯了齊某、周某對該軟件的著作權，但乙系善意的盜版軟件的複製人，僅承擔停止使用、銷毀該侵權複製件的責任，不承擔損害賠償責任。故C選項表述錯誤，當選。《計算機軟件保護條例》第17條規定：“為了學習和研究軟件內含的設計思想和原理，通過安裝、顯示、傳輸或者存儲軟件等方式使用軟件的，可以不經軟件著作權人許可，不向其支付報酬。”這是2013年新增的一種“合理使用”情形。甲擅自複製該軟件的行為屬於合理使用，不侵犯齊某、周某對軟件的著作權，故D選項表述錯誤，當選。"}, {"id": "卷二-78", "subject": "卷二", "type": "多選題", "question": "根據《反壟斷法》規定，下列哪些選項不構成壟斷協議？（　）", "options": [{"key": "A", "text": "某行業協會組織本行業的企業就防止進口原料時的惡性競爭達成保護性協議"}, {"key": "B", "text": "三家大型房地產公司的代表聚會，就商品房價格達成共識，隨後一致釆取漲價行動"}, {"key": "C", "text": "某品牌的奶粉含有毒物質的事實被公布後，數家大型零售公司聯合聲明拒絕銷售該產品"}, {"key": "D", "text": "數家大型煤炭企業就釆用一種新型礦山安全生產技術達成一致意見"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】根據《反壟斷法》第15條規定：“經營者能夠證明所達成的協議屬於下列情形之一的，不適用本法第十三條、第十四條的規定：（一）為改進技術、研究開發新產品的；（二）為提高產品質量、降低成本、增進效率，統一產品規格、標準或者實行專業化分工的；（三）為提高中小經營者經營效率，增強中小經營者競爭力的；（四）為實現節約能源、保護環境、救災救助等社會公共利益的；（五）因經濟不景氣 ，為緩解銷售量嚴重下降或者生產明顯過剩的；（六）為保障對外貿易和對外經濟合作中的正當利益的 ；（七）法律和國務院規定的其他情形。”A項符合上述第（六）項的要求，B項不符合上述規定任何一條 ，C項符合上述第（四）項的要求，D項符合上述第（二）項的要求，故本題正確答案為ACD。"}, {"id": "卷二-79", "subject": "卷二", "type": "多選題", "question": "時代公司是一家從事娛樂文化的公司，有職工150人。2020年6月，因疫情影響經營發生嚴重困難，公司決定裁員18人。對此，公司法律顧問給出如下法律意見，哪些意見是錯誤的？", "options": [{"key": "A", "text": "裁員人數不足20人，無需向勞動行政部門報告"}, {"key": "B", "text": "應召集職工代表大會，對裁員方案進行說明並集體表決"}, {"key": "C", "text": "應當優先留用家庭有需要扶養的老人或者未成年人的職工"}, {"key": "D", "text": "不得裁減在該公司連續工作滿15年的女職工"}], "answer": ["A", "B", "C", "D"], "explanation_full": "【羿文解析】①A選項錯誤，《勞動合同法》第41條第1款：“有下列情形之一，需要裁減人員二十人以上或者裁減不足二十人但占企業職工總數百分之十以上的，用人單位提前三十日向工會或者全體職工說明情況 29 法規定進行重整的；（二）生產經營發生嚴重困難的；（三）企業轉產、重大技術革新或者經營方式調整 ，經變更勞動合同後，仍需裁減人員的；（四）其他因勞動合同訂立時所依據的客觀經濟情況發生重大變化 ，致使勞動合同無法履行的。”裁員人數雖然不足20人，但裁減人員占企業職工總數的百分之十以上，因此仍需向勞動行政部門報告。 ②B選項錯誤，根據上述《勞動合同法》第41條第1款的規定，用人單位提前三十日向工會或者全體職工說明情況，聽取工會或者職工的意見後，裁減人員方案經向勞動行政部門報告，即可以裁減人員，而無須集體表決。 ③C選項錯誤，根據上述《勞動合同法》第41條第2款第（三）項：“裁減人員時，應當優先留用下列人員 ：（三）家庭無其他就業人員，有需要扶養的老人或者未成年人的。”C選項缺少“家庭無其他就業人員”這一要件。 ④D選項錯誤，《勞動合同法》第42條第（五）項：“勞動者有下列情形之一的，用人單位不得依照本法第四十條、第四十一條的規定解除勞動合同：（五）在本單位連續工作滿十五年，且距法定退休年齡不足五年的 。”因此，缺少“距法定退休年齡不足五年”這一要件。 綜上，本題正確答案為ABCD選項。"}, {"id": "卷二-80", "subject": "卷二", "type": "多選題", "question": "音樂劇作家甲和乙是好友，乙曾赴新疆采錄當地民間傳說和民謠曲調。甲以乙采錄的民謠曲調為基礎，又根據採集的民間傳說，寫成了音樂劇《樓蘭傳說》。甲在編劇過程中，曾多次借用乙采錄編輯而成的民謠錄音磁帶，後為使用方便，遂自行複製了一套。該劇完成時，正逢甲的女友丙生日，於是甲在劇本手稿封面寫上“謹以此劇獻給丙”。丙是丁劇團的歌劇演員，對該音樂劇大加讚賞，於是決定表演該劇。彩排過程中 ，丁劇團對彩排全程進行錄音錄像，以作為培訓新人的資料使用。對於上述事實，下列哪些說法是正確的 ？（　）", "options": [{"key": "A", "text": "甲複製乙采錄編輯的錄音帶的行為侵犯了乙的許可複製權"}, {"key": "B", "text": "乙對收集的民間藝術不享有著作權"}, {"key": "C", "text": "甲“謹以此劇獻給丙”的題詞意味著將著作權全部轉移給丙"}, {"key": "D", "text": "丁對丙的彩排進行錄音錄像應當經過丙的許可"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】《著作權法》第44條第1款規定，錄音錄像製作者對其製作的錄音錄像製品，享有許可他人複製 、發行、出租、通過信息網絡向公眾傳播並獲得報酬的權利；權利的保護期為50年，截止於該製品首次製作完成後第50年的12月31日。本題中，甲未經乙許可，複製乙編輯的錄音帶的行為，超出了合理使用的範圍 ，其行為侵犯了乙的許可複製權，因此A選項正確。但是乙對民間藝術本身不享有著作權，B選項正確。甲的題詞只是表明該劇是為丙而作的，但是並沒有轉移著作權的意思表示，因此C選項錯誤。第43條規定。錄音錄像製作者製作錄音錄像製品，應當同表演者訂立合同，並支付報酬。丁對丙彩排過程進行錄音錄像，應經過丙的許可，否則侵犯了丙對其表演的許可錄音錄像的權利，D選項正確。"}, {"id": "卷二-81", "subject": "卷二", "type": "多選題", "question": "根據《民事訴訟法》及相關司法解釋的規定，下列關於妨害民事訴訟的行為及對其的強制措施的表述中 ，哪些選項是錯誤的？（　）", "options": [{"key": "A", "text": "原告甲銷毀了已還款的借條後向法院起訴要求被告還款，此行為違反誠實信用原則。構成妨害民事訴訟的行為"}, {"key": "B", "text": "律師乙以網絡直播方式現場轉播審判活動，此行為未經法庭允許，構成妨害民事訴訟的行為"}, {"key": "C", "text": "鑒定人丙沒有正當理由拒不到庭，法院有權對其進行拘傳"}, {"key": "D", "text": "審判長丁決定對擾亂法庭秩序的戊罰款3000元"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】A選項中，甲銷毀借條的行為在起訴前，不構成妨害民事訴訟的行為，故A選項表述錯誤，當選 。B選項中，根據《民訴法解釋》第176條的規定，未經法庭允許以移動通信等方式現場轉播審判活動的行為屬於妨害民事訴訟的行為，故B選項表述正確，不當選。C選項中，根據《民事訴訟法》第78條的規定，鑒定人拒不到庭的，鑒定意見不得作為認定事實的根據，但法院無權對鑒定人拘傳，故C選項表述錯誤，當選。 30 D選項中，根據《民事訴訟法》第116條的規定，罰款須經院長批准，審判長無權直接決定，故D選項表述錯誤 ，當選。"}, {"id": "卷二-82", "subject": "卷二", "type": "多選題", "question": "關於破產清算、重整與和解的表述，下列哪些選項是正確的？（　）", "options": [{"key": "A", "text": "債務人一旦被宣告破產，則不可能再進入重整或者和解程序"}, {"key": "B", "text": "破產案件受理後，只有債務人才能提出和解申請"}, {"key": "C", "text": "即使債務人未出現現實的資不抵債情形，也可申請重整程序"}, {"key": "D", "text": "重整是破產案件的必經程序"}], "answer": ["A", "B", "C"], "explanation_full": "【羿文解析】破產宣告是破產和解或重整失敗之後的程序，一旦債務人被宣告破產，管理人就開始擬訂破產財產變價方案，並啟動破產清償程序。因此，選項A正確。根據《企業破產法》第7條的規定，債務人有本法第2條規定的情形，可以向人民法院提出重整、和解或者破產清算申請。債務人不能清償到期債務，債權人可以向人民法院提出對債務人進行重整或者破產清算的申請。兩款規定對比可以發現，申請和解的權利僅有債務人才享有，故選項B正確。根據《企業破產法》第2條的規定，企業法人不能清償到期債務，並且資產不足以清償全部債務或者明顯缺乏清償能力的，依照本法規定清理債務。企業法人有前款規定情形，或者有明顯喪失清償能力可能的，可以依照本法規定進行重整。因此，即使債務人未出現現實的資不抵債情形，也可申請重整程序，選項C正確。根據《企業破產法》第71條的規定，人民法院經審查認為重整申請符合本法規定的 ，應當裁定債務人重整，並予以公告。由此可見，重整的最終決定權在法院，重整並非破產案件的必經程序 ，選項D錯誤。【陷阱】關於破產清算、和解與重整申請的提出者，要注意：只有債務人有權提出上述三項申請；而債權人可以提出重整或者破產清算兩項申請。另外，破產清算與重整的適用條件是不同的，重整時增加了“有明顯喪失清償能力可能的”情形。"}, {"id": "卷二-83", "subject": "卷二", "type": "多選題", "question": "根據《民事訴訟法》及相關司法解釋的規定，下列關於迴避的說法中，哪些選項是錯誤的？（　）", "options": [{"key": "A", "text": "當事人申請人民陪審員迴避的，應由審判長決定"}, {"key": "B", "text": "審判長有權決定證人的迴避"}, {"key": "C", "text": "法院駁回當事人的迴避申請，當事人不服而申請復議，復議期間被申請迴避人不停止參與本案審理工作"}, {"key": "D", "text": "審判人員迴避後，訴訟是否需重新進行應由合議庭決定"}], "answer": ["A", "B", "D"], "explanation_full": "【羿文解析】A選項中，根據《民事訴訟法》第46條的規定，審判人員的迴避應由院長決定。人民陪審員屬於審判人員，對其的迴避決定應由院長作出，不是審判長，故A選項錯誤，當選。B選項中，迴避的適用範圍為審判人員、書記員、翻譯人員、鑒定人、勘驗人，不包括證人，故B選項錯誤，當選。C選項中，根據《民事訴訟法》第47條的規定，申請人對迴避的決定不服的，可在接到決定時申請復議一次。復議期間，被申請迴避的人員不停止參與本案工作，故C選項正確，不當選。D選項中，在民事訴訟程序中，審判人員迴避後，訴訟不需要重新進行，故D選項錯誤，當選。"}, {"id": "卷二-84", "subject": "卷二", "type": "多選題", "question": "馬、宋、劉、丁四人是峰峻文化娛樂有限公司的股東，關於該公司下列決議，屬於可撤銷的是？", "options": [{"key": "A", "text": "小宋因資金緊張，無法在章程約定的時間內履行出資，因此直接召集其他股東召開股東會通過決議修改了章程中的出資期限"}, {"key": "B", "text": "公司於2020年8月15日召開股東會會議，8月2日通知全部股東。會議當天全體股東出席，會議通過了發行公司債券的決議"}, {"key": "C", "text": "公司於2020年8月15日召開股東會會議，8月14日通知全部股東，股東小劉因居住外地無法及時趕到而未能參會，會議最終通過了修改公司章程的決議"}, {"key": "D", "text": "公司決議為小丁的借款提供擔保，經全體股東一致同意，表決權100%通過了該決議"}], "answer": ["A", "C", "D"], "explanation_full": "【羿文解析】①A選項可撤銷，《公司法》第40條：“有限責任公司設立董事會的，股東會會議由董事會召集 31 行職務的，由半數以上董事共同推舉一名董事主持。有限責任公司不設董事會的，股東會會議由執行董事召集和主持。董事會或者執行董事不能履行或者不履行召集股東會會議職責的，由監事會或者不設監事會的公司的監事召集和主持；監事會或者監事不召集和主持的，代表十分之一以上表決權的股東可以自行召集和主持。”故，股東直接召集股東會屬於決議程序違法，屬於決議可撤銷。 ②B選項不可撤銷，《公司法司法解釋（四）》第4條：“股東請求撤銷股東會或者股東大會、董事會決議 ，符合公司法第二十二條第二款規定的，人民法院應當予以支持，但會議召集程序或者表決方式僅有輕微瑕疵，且對決議未產生實質影響的，人民法院不予支持。”程序輕微瑕疵不可撤銷。 ③C選項可撤銷，《公司法》第41條：“召開股東會會議，應當於會議召開十五日前通知全體股東；但是，公司章程另有規定或者全體股東另有約定的除外。”決議程序違反法律或者公司章程屬於決議可撤銷。 ④D選項可撤銷，《公司法》第16條：\"……公司為公司股東或者實際控制人提供擔保的，必須經股東會或者股東大會決議。前款規定的股東或者受前款規定的實際控制人支配的股東，不得參加前款規定事項的表決。 該項表決由出席會議的其他股東所持表決權的過半數通過。”因此，小丁不能參與表決，決議可撤銷。 綜上，本題正確答案為ACD選項。"}, {"id": "卷二-85", "subject": "卷二", "type": "多選題", "question": "大地公司與大成公司之間買賣合同糾紛，經仲裁裁決，大成公司須償付貨款100萬元，利息10萬元，分5期償還，大成公司未如實履行該裁決。大地公司據此向法院申請執行，在執行過程中，雙方達成和解協議，約定大成公司一次性支付貨款100萬元，大地公司放棄利息10萬並撤回執行申請。和解協議生效後，大成公司反悔，未履行和解協議。關於本案，下列說法正確的是？", "options": [{"key": "A", "text": "大地公司可以大成公司違反和解協議為由提起訴訟"}, {"key": "B", "text": "大地公司可向法院申請執行原仲裁裁決，法院恢復執行"}, {"key": "C", "text": "對於大地公司撤回執行的申請，法院裁定中止執行"}, {"key": "D", "text": "大地公司可向法院申請執行和解協議"}], "answer": ["A", "B"], "exp
