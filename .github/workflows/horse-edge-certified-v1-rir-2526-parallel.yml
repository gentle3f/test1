name: Horse Edge Certified V1 RIR 2025-26 Parallel
on:
  push:
    paths:
      - '.github/workflows/horse-edge-certified-v1-rir-2526-parallel.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parallel fetch HKJC full racing incident reports
        shell: bash
        run: |
          mkdir -p /tmp/rir
          cat > /tmp/fetch.mjs <<'JS'
          import fs from 'fs'; import crypto from 'crypto';
          const dates=["2025/09/07","2025/09/10","2025/09/14","2025/09/17","2025/09/21","2025/09/28","2025/10/01","2025/10/04","2025/10/08","2025/10/12","2025/10/15","2025/10/19","2025/10/22","2025/10/26","2025/10/30","2025/11/02","2025/11/05","2025/11/09","2025/11/12","2025/11/15","2025/11/19","2025/11/23","2025/11/26","2025/11/30","2025/12/03","2025/12/07","2025/12/10","2025/12/14","2025/12/17","2025/12/20","2025/12/23","2025/12/27","2026/01/01","2026/01/04","2026/01/07","2026/01/11","2026/01/14","2026/01/18","2026/01/21","2026/01/25","2026/01/28","2026/02/01","2026/02/04","2026/02/08","2026/02/11","2026/02/14","2026/02/19","2026/02/22","2026/02/25","2026/03/01","2026/03/04","2026/03/08","2026/03/11","2026/03/15","2026/03/18","2026/03/22","2026/03/25","2026/03/29","2026/04/01","2026/04/06","2026/04/08","2026/04/12","2026/04/15","2026/04/19","2026/04/22","2026/04/26","2026/04/29","2026/05/03","2026/05/06","2026/05/09","2026/05/13","2026/05/17","2026/05/20","2026/05/24","2026/05/27","2026/05/31","2026/06/03","2026/06/07","2026/06/10","2026/06/13","2026/06/21","2026/06/24","2026/06/27","2026/07/01","2026/07/04","2026/07/08","2026/07/12","2026/07/15","2026/09/06"];
          const out='/tmp/rir'; const concurrency=4;
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          async function one(d){
            const key=d.replaceAll('/',''); const url=`https://racing.hkjc.com/en-us/local/information/racereportfull?Date=${d}`;
            let lastErr='';
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const res=await fetch(url,{headers:{'user-agent':'Mozilla/5.0'},signal:AbortSignal.timeout(20000)});
                const ab=await res.arrayBuffer(); const b=Buffer.from(ab); fs.writeFileSync(`${out}/${key}.html`,b);
                return {date:d,url,status:res.status,bytes:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex'),attempt};
              }catch(e){ lastErr=String(e); await sleep(500*attempt); }
            }
            return {date:d,url,status:0,bytes:0,sha256:'',error:lastErr};
          }
          const meta=[];
          for(let i=0;i<dates.length;i+=concurrency){
            const batch=dates.slice(i,i+concurrency);
            meta.push(...await Promise.all(batch.map(one)));
            console.log(`done ${Math.min(i+concurrency,dates.length)}/${dates.length}`);
            await sleep(250);
          }
          fs.writeFileSync(`${out}/meta.json`,JSON.stringify(meta,null,2));
          console.log(JSON.stringify({n:meta.length,ok:meta.filter(x=>x.status===200).length,failed:meta.filter(x=>x.status!==200).length},null,2));
          JS
          node /tmp/fetch.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: horse-edge-certified-v1-rir-2526-parallel
          path: /tmp/rir
          retention-days: 90
