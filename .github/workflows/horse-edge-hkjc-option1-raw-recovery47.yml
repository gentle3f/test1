name: Horse Edge HKJC Option1 Raw Recovery47

on:
  push:
    branches: [horse-edge-source-repair-20260909]
    paths: ['.github/workflows/horse-edge-hkjc-option1-raw-recovery47.yml']

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture HTTP 200 raw bytes without semantic filtering
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery47/raw_html
          python3 <<'PY'
          import concurrent.futures,csv,hashlib,json,subprocess,time
          from datetime import datetime,timezone
          from pathlib import Path
          codes=[x.strip().upper() for x in Path('horse_edge_source_repair_20260909/horse_codes_recovery_47.txt').read_text().splitlines() if x.strip()]
          out=Path('recovery47'); raw=out/'raw_html'; retrieved=datetime.now(timezone.utc).isoformat()
          def one(code):
              url=f'https://racing.hkjc.com/en-us/local/information/horse?HorseNo={code}&Option=1'
              target=raw/f'{code}.html'
              cmd=['curl','-sS','-L','--fail-with-body','--connect-timeout','10','--max-time','30','--retry','2','--retry-delay','1','-A','Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','-H','Accept-Language: en-US,en;q=0.8,zh-HK;q=0.5','-w','%{http_code}\t%{url_effective}','-o',str(target),url]
              t=time.time(); p=subprocess.run(cmd,capture_output=True,text=True)
              meta=(p.stdout or '').strip().split('\t',1); status=meta[0] if meta else ''; final=meta[1] if len(meta)>1 else ''
              b=target.read_bytes() if target.exists() else b''
              success=p.returncode==0 and status=='200' and len(b)>5000
              if not success and target.exists(): target.unlink()
              return {'horse_code':code,'success':success,'request_url':url,'final_url':final,'http_status':status,'sha256':hashlib.sha256(b).hexdigest() if success else '','bytes':len(b) if success else 0,'rtg_marker':b'Rtg.' in b,'all_records_marker':b'Horse Form Records (All)' in b,'elapsed_sec':round(time.time()-t,3),'retrieved_at_utc':retrieved,'error':(p.stderr or '')[-500:]}
          rows=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              for i,r in enumerate(ex.map(one,codes),1): rows.append(r); print(f'[{i}/{len(codes)}] {r["horse_code"]} success={r["success"]} bytes={r["bytes"]} rtg={r["rtg_marker"]}',flush=True)
          fields=list(rows[0].keys()) if rows else []
          with (out/'RAW_MANIFEST.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          s={'retrieved_at_utc':retrieved,'requested_horses':len(codes),'successful_horses':sum(bool(r['success']) for r in rows),'failed_horses':sum(not bool(r['success']) for r in rows),'raw_html_files':sum(bool(r['sha256']) for r in rows),'transport':'curl exact HTTP body; acceptance only HTTP 200 and >5KB; no form semantics filter','acquisition_status':'COMPLETE' if all(bool(r['success']) for r in rows) else 'PARTIAL'}
          (out/'SUMMARY.json').write_text(json.dumps(s,indent=2),encoding='utf-8'); print(json.dumps(s,indent=2))
          PY
      - name: Hash payload
        if: always()
        run: |
          cd recovery47
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SUMMARY.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horse-edge-hkjc-option1-raw-recovery47-20260909
          path: recovery47/
          if-no-files-found: error
          retention-days: 14
