name: Horse Edge Certified V1 RIR 2025-26
on:
  push:
    paths:
      - '.github/workflows/horse-edge-certified-v1-rir-2526.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch HKJC full racing incident reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rir
          dates=(2025/09/07 2025/09/10 2025/09/14 2025/09/17 2025/09/21 2025/09/28 2025/10/01 2025/10/04 2025/10/08 2025/10/12 2025/10/15 2025/10/19 2025/10/22 2025/10/26 2025/10/30 2025/11/02 2025/11/05 2025/11/09 2025/11/12 2025/11/15 2025/11/19 2025/11/23 2025/11/26 2025/11/30 2025/12/03 2025/12/07 2025/12/10 2025/12/14 2025/12/17 2025/12/20 2025/12/23 2025/12/27 2026/01/01 2026/01/04 2026/01/07 2026/01/11 2026/01/14 2026/01/18 2026/01/21 2026/01/25 2026/01/28 2026/02/01 2026/02/04 2026/02/08 2026/02/11 2026/02/14 2026/02/19 2026/02/22 2026/02/25 2026/03/01 2026/03/04 2026/03/08 2026/03/11 2026/03/15 2026/03/18 2026/03/22 2026/03/25 2026/03/29 2026/04/01 2026/04/06 2026/04/08 2026/04/12 2026/04/15 2026/04/19 2026/04/22 2026/04/26 2026/04/29 2026/05/03 2026/05/06 2026/05/09 2026/05/13 2026/05/17 2026/05/20 2026/05/24 2026/05/27 2026/05/31 2026/06/03 2026/06/07 2026/06/10 2026/06/13 2026/06/21 2026/06/24 2026/06/27 2026/07/01 2026/07/04 2026/07/08 2026/07/12 2026/07/15 2026/09/06)
          printf 'date\turl\tstatus\tbytes\tsha256\n' > /tmp/rir/meta.tsv
          for d in "${dates[@]}"; do
            key=$(echo "$d" | tr -d '/')
            url="https://racing.hkjc.com/en-us/local/information/racereportfull?Date=$d"
            status=$(curl -L --retry 3 --retry-delay 1 -A 'Mozilla/5.0' -sS -o "/tmp/rir/${key}.html" -w '%{http_code}' "$url")
            bytes=$(wc -c < "/tmp/rir/${key}.html")
            sha=$(sha256sum "/tmp/rir/${key}.html" | awk '{print $1}')
            printf '%s\t%s\t%s\t%s\t%s\n' "$d" "$url" "$status" "$bytes" "$sha" >> /tmp/rir/meta.tsv
            sleep 0.25
          done
          echo "fetched ${#dates[@]} meeting reports"
          tail -5 /tmp/rir/meta.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: horse-edge-certified-v1-rir-2526
          path: /tmp/rir
          retention-days: 90
