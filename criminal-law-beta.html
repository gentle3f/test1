<div class="wrap">
  <div class="top">
    <div><div class="eyebrow">刑法新教學 Beta · Skill Lesson 01</div><h1>犯罪未遂 vs 犯罪中止</h1><p class="sub">目標唔係「做啱一題」，而係學識：見到犯罪停咗，自己知道下一步應該問乜。</p></div>
    <a class="back" href="./">← 返回 Case Coach</a>
  </div>
  <div class="stagebar" id="stagebar"></div>
  <div class="stage-labels"><span>看懂</span><span>一齊做</span><span>學會寫</span><span>真題</span><span>獨立</span></div>
  <section class="card">
    <div class="lesson-head"><strong id="stageTitle"></strong><span class="progress" id="progress"></span></div>
    <div class="body" id="screen"></div>
  </section>
  <div class="footer-note">Beta 原則：Learn mode 唔會考你未教過嘅嘢。錯誤回饋優先將你注意力帶返決定答案嘅事實，而唔係即刻揭答案。進度只儲存在本機瀏覽器。</div>
</div>
<script>
const KEY='fakao_crim_beta_v1';
let saved={i:0,wrong:0,completed:false};try{saved={...saved,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
const S=[
{stage:0,title:'先接返你已經識嘅客觀題',kind:'info',html:`<p><b>你唔係重新學刑法。</b></p><p>客觀題會幫你列好 A／B／C／D；主觀題最大分別係：<b>今次冇人幫你列選項。</b></p><div class="rule soft"><b>今日只學一件事：</b><br>見到犯罪途中停咗，第一個問題唔係「定咩罪」，而係——<br><br><b style="font-size:20px">點解停？</b></div><p>我先做畀你睇。你暫時唔需要答任何法律問題。</p>`,source:'教學設計；刑法判斷框架參考楊艷霞教授材料。'},
{stage:0,title:'Watch me：先唔講「未遂」兩個字',kind:'info',html:`<div class="case">甲進入手機店準備偷手機，突然<b>警鈴大響</b>，甲怕被捉而逃走。</div><p>我第一眼唔會急住背定義。我會先捉住令事情改變嗰一句：<span class="focus">警鈴大響</span>。</p><p>然後我問自己：<b>如果冇警鈴，甲仲想唔想偷？</b></p><p>答案係：想。</p><div class="rule"><b>所以真正停止原因唔係佢改變主意，而係外面有障礙迫佢停。</b><br><br>我先叫呢種感覺：<b>被迫停</b>。</div>`,source:'楊艷霞課堂以警鈴迫走等具體對比引入未遂／中止。'},
{stage:0,title:'同一個故事，只改一個事實',kind:'choice',case:`警報冇響，店內亦冇人阻止。甲發現全部都係廉價舊手機，覺得唔值得偷，自己離開。`,q:'今次，甲係「做唔到」，定「做到但自己唔做」？',choices:['做唔到','做到，但自己唔做'],correct:1,hints:['先唔好諗法律名詞。只睇案情：有人阻止佢嗎？','警報冇響、亦冇人阻止。即係客觀上仲有條件繼續。'],ok:'啱。今次唔係外力迫停，而係佢仲有能力繼續，只係自己選擇唔做。',source:'楊艷霞課堂手機店例子。'},
{stage:0,title:'依家先畀法律名詞',kind:'info',html:`<p>你頭先其實已經識咗核心，依家先幫兩種感覺改法律名。</p><div class="map"><div class="maprow"><span class="tag">被迫停</span><div><b>欲達目的而不能</b> → 向「犯罪未遂」方向走</div></div><div class="maprow"><span class="tag">自己停</span><div><b>能達目的而不欲</b> → 向「犯罪中止」方向走</div></div></div><p class="small">我故意寫「方向」，因為正式判中止仲要再掃時間性、自動性、客觀性、有效性。</p>`,source:'徐光華觀點展示材料；路遙《案例專攻》。'},
{stage:1,title:'Do with me：只判斷停止原因',kind:'choice',case:`甲持刀追殺乙。乙跑入警署，甲見到警察後立即停止追趕。`,q:'暫時唔問罪名。甲停止，主要係因為：',choices:['外部障礙','自己主動改變選擇'],correct:0,hints:['題目入面有一個新出現嘅人／環境因素。','如果冇警察，甲本來仍然想繼續追殺。'],ok:'啱。停止原因來自外部障礙，所以先向「未遂」方向思考。',source:'教學用短案；判斷框架源自未遂／中止區分。'},
{stage:1,title:'Do with me：再做一次',kind:'choice',case:`甲持刀傷害乙後仍有能力繼續，但見乙極度痛苦而心生憐憫，自行收刀並救助乙。`,q:'今次停止原因主要係：',choices:['外部障礙','自己主動選擇停止'],correct:1,hints:['有冇警察、工具失效、被害人逃脫等外部原因？','題目直接寫咗「心生憐憫」「自行收刀」。'],ok:'啱。呢次係典型「仲做到，但自己唔做」。',source:'教學用短案；中止自動性基本框架。'},
{stage:1,title:'補上時間軸：唔係任何「後悔」都叫中止',kind:'choice',case:`甲完成盜竊並把財物帶回家。第二日良心發現，把財物送回。`,q:'第二日送返財物，係咪可以將已經既遂嘅盜竊變成「犯罪中止」？',choices:['可以','不可以'],correct:1,hints:['先睇時間：犯罪結果係咪已經完成？','中止要發生喺犯罪過程中；既遂後嘅返還係另一個量刑／事後行為問題。'],ok:'啱。既遂之後先後悔，唔會倒轉變成犯罪中止。',source:'路遙：犯罪中止的時間性。'},
{stage:1,title:'建立一張腦內檢查卡',kind:'info',html:`<p>以後見到「中止」兩個字，唔好只背一句口訣。你個腦順手掃四格：</p><div class="flow"><span>時間性</span><i>→</i><span>自動性</span><i>→</i><span>客觀性</span><i>→</i><span>有效性</span></div><div class="rule green"><b>而初學者第一個最值得捉緊嘅，係「自動性」：</b><br>究竟係外面逼佢停，定係佢自己停？</div>`,source:'路遙《案例專攻》將犯罪中止拆成時間性、自動性、客觀性、有效性。'},
{stage:1,title:'真正難題開始：點解要有「學說」？',kind:'choice',case:`行為人因自己極度迷信，真心相信眼前情況令自己無法再繼續犯罪；但一般人根本唔覺得呢個情況會阻止犯罪。`,q:'同一個事實，如果「聽行為人自己」同「聽一般人」判斷，會唔會可能得出唔同結論？',choices:['可能','唔可能，法律一定只得一個答案'],correct:0,hints:['關鍵係「能／不能」究竟由邊個角度判斷。','一個人覺得做唔到，但一般人覺得明明做到——評價標準已經唔同。'],ok:'啱。學說唔係為咗增加你背書量；係因為同一個「能／不能」可以有不同判斷鏡頭。',source:'徐光華：主觀說與客觀說的核心分歧。'},
{stage:1,title:'戴上兩副眼鏡',kind:'info',html:`<div class="map"><div class="maprow"><span class="tag">行為人眼鏡</span><div><b>主觀說：</b>問行為人本人當時覺得自己仲「能不能」繼續。</div></div><div class="maprow"><span class="tag">一般人眼鏡</span><div><b>客觀說：</b>問社會一般人處於相同情況，會覺得仲「能不能」繼續。</div></div></div><p>所以「觀點展示」唔係背兩段答案。<b>係換一副眼鏡，再評價同一個 fact。</b></p>`,source:'徐光華《26年刑法采分點（观点展示）》；楊艷霞講義列示多種自動性判斷標準。'},
{stage:2,title:'第一次學「答案係點砌出嚟」',kind:'choice',case:`甲仍有條件完成犯罪，亦知道自己可以繼續，但因心生憐憫而停止。`,q:'採「主觀說」時，下面邊條推理鏈最完整？',choices:[`甲停止了，所以成立中止。`,`主觀說以行為人本人認知判斷能否繼續；甲本人認為仍能繼續，但主動停止，屬「能達目的而不欲」，因此成立中止。`,`甲有良心，所以應該免罰。`],correct:1,hints:['主觀題唔只要結論，至少要有「規則 + 本案事實 + 結論」。','揀一條有交代判斷標準，亦有把本案事實放入規則嘅答案。'],ok:'啱。你已經第一次完成「規則 → 事實 → 涵攝 → 結論」。',source:'主觀題答題結構綜合路遙與徐光華材料。'},
{stage:2,title:'拆骨：一段得分答案有咩零件',kind:'info',html:`<div class="skeleton"><div class="slot"><strong>規則</strong>主觀說以行為人本人嘅認知判斷「能／不能」。</div><div class="slot"><strong>事實</strong>甲本人認為仍然可以繼續犯罪。</div><div class="slot"><strong>涵攝</strong>但佢自行停止，所以屬於「能達目的而不欲」。</div><div class="slot"><strong>結論</strong>成立犯罪中止。</div></div><p>初學時我會幫你保留骨架。之後每做一題，扶手會少一截。</p>`,source:'主觀題採分式寫作設計；官方案例強調觀點主旨、理由及本案結論。'},
{stage:2,title:'Imitate：我畀骨架，你補核心',kind:'choice',case:`甲已著手實施犯罪。突然見巡邏警察走近，認為再繼續必然被捕，於是停止。`,q:'最適合放入「涵攝」嗰一句係：',choices:[`甲是壞人，所以應處罰。`,`甲因外部警察出現，自己認為已無法安全繼續，停止並非出於自主選擇。`,`甲停止了犯罪。`],correct:1,hints:['涵攝唔係重複結論，而係講「本案邊個 fact 點樣符合規則」。','鎖定「警察出現」同「認為無法繼續」兩個 fact。'],ok:'啱。呢句先係主觀題真正值分嘅地方：你將本案事實放入法律標準。',source:'教學用短案。'},
{stage:3,title:'真題拆題：老師先幫你縮短故事',kind:'info',html:`<div class="case">趙某欲殺妻子，正用皮帶勒住妻子頸部。妻子呼叫後，兩名年幼子女走來。趙某認為不應當著孩子面殺死妻子，於是停止，只造成輕傷。</div><p>長案情第一步唔係寫答案。我先幫你壓成三件事：</p><div class="map"><div class="maprow"><span class="tag">① 已著手</span><div>已經用皮帶勒頸</div></div><div class="maprow"><span class="tag">② 未既遂</span><div>妻子未死亡</div></div><div class="maprow"><span class="tag">③ 停止原因</span><div>兩名孩子出現</div></div></div><div class="rule"><b>成段故事依家只剩一個真正問題：</b><br>「孩子出現」究竟令佢<b>不能繼續</b>，定只係令佢<b>不想繼續</b>？</div>`,source:'2021年法考主觀題；徐光華材料收錄。'},
{stage:3,title:'真題：先戴「行為人眼鏡」',kind:'choice',case:`趙某見到兩名孩子後，覺得「不應當著孩子面殺死妻子」，所以停止。`,q:'只按「主觀說」分析，題目最值得捉住邊一點？',choices:[`兩個孩子客觀上有冇能力制服趙某`,`趙某本人係咪仍認為自己可以繼續，但選擇唔做`,`妻子受傷有幾重`],correct:1,hints:['主觀說關心嘅係「行為人本人點判斷能／不能」。','題目寫嘅係「不應當」，唔係「無能力」。'],ok:'啱。主觀說嘅鏡頭要一直鎖住趙某本人嘅認知。',source:'徐光華對2021真題的主觀說分析。'},
{stage:3,title:'真題：再戴「一般人眼鏡」',kind:'choice',case:`同一事實：兩名年幼子女突然出現，趙某停止殺妻。`,q:'客觀說真正改變咗邊樣嘢？',choices:[`改變停止原因嘅事實`,`改變「由邊個角度判斷能／不能」`,`改變故意殺人罪嘅法條`],correct:1,hints:['案情冇變，變嘅係評價鏡頭。','同一個 fact，由行為人本人睇，或者由一般人睇。'],ok:'啱。觀點展示最重要就係：同一事實，因判斷標準唔同而可能出現不同結論。',source:'徐光華觀點展示框架。'},
{stage:3,title:'第一次完整觀點展示',kind:'choice',q:'下面邊一個寫法最接近一份合格主觀答案？',choices:[`我認為是中止，因為趙某最後停手。`,`主觀說認為應以行為人本人判斷能否繼續；若趙某本人仍認為可繼續而主動停止，可成立中止。客觀說則以一般人標準判斷；若認為孩子出現形成一般人難以克服的心理障礙，則可向未遂評價。`,`主觀說、客觀說各有道理，視乎老師喜歡。`],correct:1,hints:['完整觀點題要交代「每個觀點用咩標準」同「套入本案會點」。','唔需要長篇論文，但唔可以只報兩個結論。'],ok:'啱。你已經由「背兩個答案」升級到「識交代兩個判斷標準」。',source:'官方案例對觀點分歧的作答要求；徐光華觀點展示。'},
{stage:3,title:'第二個難點：重複侵害',kind:'choice',case:`甲欲殺乙，連開三槍均未致乙死亡。乙跪地求饒。甲仍有子彈、亦有能力再開槍，但主動收槍離開。`,q:'如果你機械地逐槍切開，最容易出現咩錯覺？',choices:[`前面每槍都係未遂，最後再另外算一個中止`,`整個過程只可以算既遂`,`只要有一槍射中就一定既遂`],correct:0,hints:['先想像：每一槍都當成一宗獨立犯罪會發生咩事？','楊老師特別提醒：犯罪係一個「過程」，唔應機械逐刀逐槍拆。'],ok:'啱。呢個正係點解要學「整體考察」。',source:'楊艷霞課堂重複侵害例子。'},
{stage:3,title:'Professor Brain：犯罪係一個過程',kind:'info',html:`<p>楊老師處理重複侵害時，用一個非常適合考場嘅抓手：</p><div class="rule green"><b style="font-size:20px">犯罪係一個過程。</b><br><br>同一殺人過程入面，前面幾次冇成功，最後喺仍可繼續時自動放棄，法考通說採<b>整體考察說</b>，唔係機械地堆「幾個未遂 + 一個中止」。</div><p>所以遇到連續砍擊、連續射擊，先問：<b>呢啲係同一犯罪過程，定真係幾個獨立犯罪？</b></p>`,source:'楊艷霞課堂及《考前50句》：重複侵害採整體考察說。'},
{stage:4,title:'Guided independent：扶手開始減少',kind:'choice',case:`甲在屋內準備殺乙，已持刀刺向乙但未致命。此時甲聽到門外有人大叫「警察到了」，甲相信是真的，立即逃走；其實門外並無警察。`,q:'第一步你應該鎖定邊個問題？',choices:[`甲最終有冇被警察拘捕`,`甲本人點解停止，以及佢當時認為自己仲能唔能夠繼續`,`乙有冇原諒甲`],correct:1,hints:['唔好畀「其實冇警察」吸走。先問停止當刻甲本人點認知。','主觀說尤其重視行為人本人當時認為「能／不能」。'],ok:'啱。就算客觀上冇警察，行為人本人如果真心認為外部障礙令自己無法繼續，分析方向仍會受佢嘅主觀認知影響。',source:'主觀說核心：行為人本人認知。'},
{stage:4,title:'Independent：第一次自己寫',kind:'text',case:`甲進入倉庫盜竊。已開始搬動財物時，外面突然傳來警車聲。甲誤以為警方已包圍倉庫，認為不可能再完成盜竊，立即逃走。`,q:'請用最少三句寫：①規則；②本案事實如何套入；③結論方向。唔使追求文筆。',placeholder:'例如：判斷……應以……。本案中……。因此……。',source:'綜合練習；此題重點在主觀說下的「能／不能」判斷。'},
{stage:4,title:'Transfer Test：換皮之後仲識唔識？',kind:'choice',case:`甲想殺乙，已下毒。乙服毒後，甲突然後悔並立即送乙入院。醫生及時救回乙。`,q:'今次同「警察出現而逃走」最根本嘅不同係：',choices:[`今次係殺人，之前係盜竊`,`今次停止／救助來自行為人自己，仲要進一步檢查有冇有效防止結果；之前係外部障礙逼停`,`今次有醫生，所以一定無罪`],correct:1,hints:['唔好俾罪名表面帶走。仍然問同一句：點解停？','而且已經落毒之後，中止仲會多一層「有冇有效防止結果」。'],ok:'啱。你開始可以將同一個底層判斷搬去完全唔同嘅故事。',source:'路遙：犯罪中止的有效性；transfer teaching design。'},
{stage:4,title:'完成：你學到嘅唔係一題答案',kind:'done',html:`<div class="donebox"><div class="big">✓</div><h2>Skill Lesson 01 完成</h2><p>如果你真係學識咗，見到新案唔應該先諗「背邊個答案」，而係自動開始：</p><div class="flow" style="justify-content:center"><span>有冇著手／既遂？</span><i>→</i><span>點解停？</span><i>→</i><span>能／不能由邊個角度判？</span><i>→</i><span>規則套事實</span></div><p>下一版先會加入更嚴格嘅 mastery 判定同第二個 transfer case。</p></div>`}
];
function stageName(n){return ['看懂：先建立直覺','一齊做：建立判斷規則','學會寫：由判斷變答案','真題：處理觀點與重複侵害','獨立：撤走扶手'][n]}
function save(){localStorage.setItem(KEY,JSON.stringify(saved))}
function render(){const i=Math.max(0,Math.min(saved.i,S.length-1)),s=S[i];document.getElementById('stageTitle').textContent=stageName(s.stage);document.getElementById('progress').textContent=`${i+1} / ${S.length}`;document.getElementById('stagebar').innerHTML=[0,1,2,3,4].map(x=>`<div class="stage ${x<s.stage?'done':x===s.stage?'on':''}"></div>`).join('');const el=document.getElementById('screen');let h=`<div class="teacher"><div class="avatar">師</div><div class="bubble">`;
if(s.kind==='info'||s.kind==='done') h+=s.html; else {if(s.case)h+=`<div class="case">${s.case}</div>`;h+=`<div class="question">${s.q}</div>`}
h+='</div></div>';
if(s.kind==='choice'){h+=`<div class="choices" id="choices">${s.choices.map((c,j)=>`<button class="choice" data-j="${j}">${c}</button>`).join('')}</div><div class="feedback" id="fb"></div>`}
if(s.kind==='text'){const prev=(saved.text&&saved.text[i])||'';h+=`<textarea class="textarea" id="txt" placeholder="${s.placeholder||''}">${escapeHtml(prev)}</textarea><div class="feedback hint show">今次 Beta 唔會假裝用關鍵詞判你啱錯。你寫完之後先解鎖繼續；正式版會用結構 checklist 檢查你有冇「規則／事實／結論」。</div>`}
h+=`<div class="actions"><button class="btn ghost" id="back" ${i===0?'disabled':''}>上一步</button><div class="small">錯答唔扣分；提示只用嚟重新指向關鍵事實。</div><button class="btn primary" id="next" ${(s.kind==='choice'||s.kind==='text')?'disabled':''}>${s.kind==='done'?'重新開始':'繼續'}</button></div>`;
if(s.source)h+=`<div class="source">來源標記：${s.source}</div>`;el.innerHTML=h;
document.getElementById('back').onclick=()=>{if(saved.i>0){saved.i--;save();render()}};const next=document.getElementById('next');next.onclick=()=>{if(s.kind==='done'){saved={i:0,wrong:0,completed:false,text:{}};save();render();return}if(saved.i<S.length-1){saved.i++;save();render()}};
if(s.kind==='info')next.disabled=false;if(s.kind==='done')next.disabled=false;
if(s.kind==='choice')bindChoice(s,next);if(s.kind==='text'){const t=document.getElementById('txt');next.disabled=!t.value.trim();t.oninput=()=>{saved.text=saved.text||{};saved.text[i]=t.value;save();next.disabled=!t.value.trim()}}
}
function bindChoice(s,next){const buttons=[...document.querySelectorAll('.choice')],fb=document.getElementById('fb');let tries=0;buttons.forEach(b=>b.onclick=()=>{const j=+b.dataset.j;if(j===s.correct){buttons.forEach(x=>x.disabled=true);b.classList.add('good');fb.className='feedback ok show';fb.innerHTML=`<b>✓</b> ${s.ok}`;next.disabled=false;saved.wrong=saved.wrong||0;save()}else{tries++;saved.wrong=(saved.wrong||0)+1;save();b.classList.add('bad');b.disabled=true;const hint=s.hints[Math.min(tries-1,s.hints.length-1)];fb.className='feedback hint show';fb.innerHTML=`<b>唔急住睇答案。</b><br>${hint}`;if(tries>=s.hints.length+1){const good=buttons[s.correct];good.classList.add('good');good.disabled=true;fb.className='feedback answer show';fb.innerHTML=`<b>老師示範：</b><br>${s.ok}`;next.disabled=false;buttons.forEach(x=>x.disabled=true)}}})}
function escapeHtml(v){return String(v).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
render();
</script>
</body></html>
