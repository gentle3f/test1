den}.casehead{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.casehead h2{margin:0;font-size:18px}.casehead .status{font-size:12px;color:var(--muted)}.body{padding:22px}.official{border:1px solid #dce1e6;border-left:4px solid #303845;background:#fbfcfd;border-radius:14px;padding:16px;line-height:1.7;margin-bottom:16px}.official .label{font-size:11px;font-weight:900;color:#4b5563;letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px}.official p{margin:0}.teacher{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:start;margin:18px 0}.avatar{width:46px;height:46px;border-radius:14px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900}.bubble{border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px;line-height:1.72}.bubble p{margin:0 0 10px}.bubble p:last-child{margin-bottom:0}.lens{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.pill{font-size:11px;font-weight:800;border-radius:999px;padding:6px 9px;background:#eef0f3}.pill.prof{background:#f8e9ec;color:#7b1d2a}.pill.official{background:#eaf1f8;color:#28506c}.pill.xu{background:#f2ebff;color:#5d3a93}.pill.lu{background:#fff3dc;color:#79520c}.pill.design{background:#eef6ef;color:#396646}.highlight{background:var(--gold);padding:2px 4px;border-radius:5px}.signalgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.signal{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fafbfc}.signal b{display:block;font-size:12px;margin-bottom:4px}.signal span{font-size:12px;color:var(--muted);line-height:1.5}.q{font-weight:900;font-size:18px;margin:20px 0 10px}.choices{display:grid;gap:9px}.choice{border:1px solid #dce1e6;background:#fff;border-radius:13px;padding:13px 14px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}.choice:hover{border-color:#aeb7c1}.choice.good{background:#eff9f2;border-color:#8fc39b}.choice.bad{background:#fff4f5;border-color:#d999a3}.feedback{display:none;margin-top:12px;border-radius:13px;padding:13px 14px;line-height:1.6;font-size:14px}.feedback.show{display:block}.feedback.hint{background:var(--gold);border:1px solid #ecd992}.feedback.ok{background:var(--green);border:1px solid #cde5d3}.feedback.answer{background:var(--soft);border:1px solid #efcbd1}.rulecard{border-radius:15px;padding:15px;margin:15px 0;line-height:1.65;border:1px solid #d8e6f4;background:var(--blue)}.rulecard.gold{background:var(--gold);border-color:#eddca0}.rulecard.purple{background:var(--purple);border-color:#dfd2f5}.rulecard.green{background:var(--green);border-color:#d4e7d8}.rulecard b{display:block;margin-bottom:5px}.flow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:14px 0}.flow span{border:1px solid #dfe3e7;background:#f4f6f8;padding:8px 10px;border-radius:10px;font-size:12px;font-weight:800}.flow i{font-style:normal;color:#9ba3ad}.skeleton{display:grid;gap:9px;margin:15px 0}.slot{border:1px dashed #cbd2d9;border-radius:12px;padding:12px;background:#fafbfc;line-height:1.55}.slot b{display:inline-block;min-width:78px;color:#6a1d28}.autopsy{display:grid;gap:8px;margin:14px 0}.autoline{border-left:4px solid #aeb6bf;background:#fafbfc;border-radius:9px;padding:10px 12px;line-height:1.55}.autoline.rule{border-left-color:#4c89bd}.autoline.fact{border-left-color:#d1a62e}.autoline.apply{border-left-color:#8b1e2d}.autoline.conclusion{border-left-color:#4c9a5e}.actions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:20px}.btn{border:0;border-radius:12px;padding:11px 15px;font:inherit;font-weight:850;cursor:pointer}.btn.primary{background:var(--red);color:#fff}.btn.primary:hover{background:var(--red2)}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn:disabled{opacity:.4;cursor:not-allowed}.stepmeta{font-size:11px;color:var(--muted)}.clinic{display:block;text-decoration:none;border:1px solid #e2c4ca;background:#fff7f8;color:#721923;border-radius:13px;padding:12px 14px;margin-top:12px;font-weight:800}.clinic small{display:block;font-weight:500;color:#8b5b62;margin-top:3px}.caseoverview{display:grid;gap:12px}.fullcase{max-height:260px;overflow:auto;padding-right:6px}.fullcase p{margin:0 0 12px;line-height:1.7}.donebox{text-align:center;padding:26px}.donebox .big{font-size:46px}.donebox h3{font-size:24px;margin:5px}.donebox p{color:var(--muted);line-height:1.65}.source-note{margin-top:18px;padding-top:13px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.55}.hidden{display:none!important}

<script>
const STORAGE='fakao_case01_professor_beta_v1';
const facts={
1:{title:'事實一｜兩次入店',short:'重複侵害 · 中止自動性',text:'某日凌晨2時50分左右，王某騎電動自行車至某手機店，用鐵錘砸破落地玻璃門，潛入店內欲盜竊手機，因觸發自動報警裝置，匆忙盜竊3個手機盒逃離。數分鐘後發現只有破舊報廢配件，遂返回。凌晨3時左右再次潛入，發現店內手機大多屬低端機型，即便轉賣也難獲利，於是決意待店主進貨新款旗艦機後再偷，轉身離開。'},
2:{title:'事實二｜誤認路人為警察',short:'介入因素 · 轉化型搶劫',text:'王某離店時遇丁某、陳某，誤以為二人是接報到場的民警。為順利逃脫，王某先向丁某投擲鐵錘並上前毆打。陳某為保護丁某，搶起鐵錘欲砸王某，卻因二人扭打而誤傷丁某頭部。王某趁機逃離，丁某構成輕傷。'},
3:{title:'事實三｜暴力與欺騙交錯',short:'共同正犯 · 詐騙 · 競合',text:'蘇某提議與王某共同劫取周某高端手機。王某先毆打周某逼其交機，周某拒絕。王某疲憊後叫蘇某接力。蘇某上前時，周某誤以為蘇某只是路人，主動把手機交給蘇某，請其代為保管以免被劫。蘇某假意答應，之後將手機交王某，並謊稱是自己毆打周某劫得。次日周某索還手機，蘇某又謊稱已被王某劫走。'},
4:{title:'事實四｜App 漏洞套券',short:'機器能否被騙 · 兩次財產侵害',text:'王某發現快餐店 App 與微信客戶端不同步：在 App 用兌換券下單但不付款，再於微信撤單，兩邊各退一張券，從而免費多出一張兌換券。其多次套取累計價值1萬元兌換券，並再以這些券向店員兌取套餐。'},
5:{title:'事實五｜竊回贓物再分贓',short:'新增法益 · 財產說',text:'蘇某催王某變賣周某手機不果，遂趁王某不備將手機從王某處竊回，自行轉賣得1萬元。其後蘇某騙王某稱只賣得4000元，只分給王某2000元。'}
};
const question='請根據《刑法》相關規定與刑法原理分析王某與蘇某的刑事責任。要求說明理由，並同時回答出不同觀點和理由。';
const lessons={
1:[
{kind:'intro',title:'先別答，先看老師第一眼',html:`<div class="official"><div class="label">官方《指導用書》 · 事實一</div><p>${facts[1].text}</p></div><div class="teacher"><div class="avatar">師</div><div class="bubble"><div class="lens"><span class="pill official">官方案例</span><span class="pill prof">楊艷霞教授 Brain</span></div><p><b>我第一眼唔係先問「中止定未遂」。</b></p><p>我先見到兩個時間點：<span class="highlight">2:50 第一次入店</span>、<span class="highlight">3:00 第二次入店</span>。兩次相隔幾分鐘、同一店、同一犯罪故意、同一類對象。</p><p>所以我腦入面第一個亮起嘅唔係答案，而係：<b>「呢兩次係咪應該當成同一個重複侵害過程？」</b></p></div></div><div class="signalgrid"><div class="signal"><b>Signal 1</b><span>兩次行為時空極近</span></div><div class="signal"><b>Signal 2</b><span>同一被害人／同一盜竊故意</span></div></div>`},
{kind:'choice',title:'第一次停手：真正決定答案嘅 fact',q:'第一次入店，王某點解停？',choices:['自己突然唔想偷','自動警報響，被迫離開','因為手機太低端'],correct:1,hints:['先唔諗法律名詞。題目有一句直接講「因觸發自動報警裝置」。','如果冇警報，佢本來仍然想偷。停止原因係外部障礙。'],ok:'啱。第一次係典型「意志以外原因」：先標做障礙未遂。呢一部分其實唔難，命題人真正想考你係第二次。'},
{kind:'choice',title:'第二次先係命題核心',q:'第二次入店時，哪一句最重要？',choices:['凌晨3時左右','警報裝置已無報警聲','店主未出現'],correct:1,hints:['命題人點解特登話你「已無報警聲」？','因為佢要排除「又係警報逼走」呢條路。'],ok:'正確。第二次冇外部警報障礙，王某其實有機會繼續。下一步先有「自動停止」爭議。'},
{kind:'rule',title:'Just-in-time：只補今題需要嘅規則',html:`<div class="rulecard"><b>暫時只記兩條</b>主觀說：只要當時仍可繼續，但自主決定停止，可以認中止；停止動機未必重要。<br>限定主觀說：更著重行為人是否真正否定犯罪、回歸法秩序；打算「等時機再犯」可能唔算中止。</div><div class="teacher"><div class="avatar">師</div><div class="bubble"><div class="lens"><span class="pill prof">楊艷霞教授 Brain</span></div><p>本題最靚嘅地方係：王某一開始只係想「偷手機」，題目冇話佢只想偷旗艦機。</p><p>所以唔好自己幫佢加一個「我只偷旗艦機」嘅犯罪計劃，再話低端機等於目的物不存在。<b>題目冇寫嘅 plan，唔好自己補。</b></p></div></div><a class="clinic" href="./criminal-law-beta.html">如果你仲分唔清未遂／中止，可暫時去補底診所<small>學完再返呢一題；主線仍然係 Case 01。</small></a>`},
{kind:'choice',title:'整案點評價兩次行為？',q:'如果採「整體考察說」，分析重點放喺邊度？',choices:['第一次警報響就決定整案','最後一次侵害行為停止時，整體睇是否自動放棄','兩次一定各自成立一罪'],correct:1,hints:['想起楊老師一句：「犯罪係一個過程。」','整體考察唔係逐次機械切開；佢睇最後時點再評整個犯罪過程。'],ok:'啱。法考通說取向係整體考察：前面雖出現未遂，最後如符合中止條件，可由最後停止時點整體評價。'},
{kind:'write',title:'把「老師腦」翻譯成得分答案',html:`<div class="skeleton"><div class="slot"><b>第一層</b>先指出：本案係短時間內對同一對象反覆實施盜竊，涉及<b>重複侵害</b>。</div><div class="slot"><b>第二層</b>交代觀點：個別行為說／整體考察說／犯行計劃說。</div><div class="slot"><b>第三層</b>第二次停止再按中止自動性：主觀說 vs 限定主觀說（必要時再提犯罪人理性說）。</div><div class="slot"><b>涵攝</b>第一次因警報係障礙；第二次警報已停，王某仍可偷現有手機，只因嫌價低而決定以後再來。</div></div><div class="rulecard green"><b>考場寫法重點</b>唔係背晒理論，而係清楚講「哪個標準 → 本案哪個 fact → 得出哪個結論」。</div>`},
{kind:'official',title:'官方答案解剖',html:`<div class="autopsy"><div class="autoline rule"><b>問題定位：</b>兩次盜竊 + 最終放棄 → 重複侵害與犯罪形態。</div><div class="autoline fact"><b>關鍵事實：</b>第一次警報迫走；第二次警報已停、仍可偷，但嫌低端。</div><div class="autoline apply"><b>觀點分流：</b>個別行為說會分開兩次；整體考察說由最後一次停止整體評價；犯行計劃說因欠缺具體犯罪計劃較難直接套。</div><div class="autoline conclusion"><b>得分方式：</b>唔要求唯一結論，要求你把觀點、理由、涵攝講清楚。</div></div><div class="source-note">來源分工：官方《指導用書》提供案件、觀點與推導；楊艷霞教授課堂提供「點解先睇停止原因、點解唔好自己補犯罪計劃、犯罪係一個過程」嘅判題抓手。</div>`}
],
2:[
{kind:'intro',title:'事實二：一段案情其實藏咗兩條線',html:`<div class="official"><div class="label">官方《指導用書》 · 事實二</div><p>${facts[2].text}</p></div><div class="teacher"><div class="avatar">師</div><div class="bubble"><div class="lens"><span class="pill official">官方案例</span><span class="pill prof">楊艷霞教授 Brain</span></div><p>唔好一見「打人」就只諗故意傷害。呢段其實同時有兩條線：</p><p><b>① 丁某輕傷到底算唔算王某造成？</b>——中間有陳某介入。<br><b>② 王某係為逃走／抗拒抓捕而打人，會唔會由盜竊轉化成搶劫？</b></p></div></div><div class="signalgrid"><div class="signal"><b>Signal A</b><span>傷係第三人陳某直接造成 → 因果關係</span></div><div class="signal"><b>Signal B</b><span>王某以為路人係抓捕者 → 轉化型搶劫</span></div></div>`},
{kind:'choice',title:'因果關係：教授先問「介入因素異唔異常」',q:'陳某見丁某被王某毆打，慌亂中用鐵錘誤傷丁某。呢個介入因素較接近：',choices:['極端異常、完全不可理解','由王某製造危險場面引發，並不極端異常','只要第三人直接打中，就必然切斷因果'],correct:1,hints:['唔好只睇「最後一擊係邊個打」。先問王某有冇創設一個會引發救助／反擊嘅風險。','有人見朋友正被毆打而上前救助，慌亂中誤傷，唔係「閃電劈死」嗰種完全異常介入。'],ok:'啱。楊老師嘅壓縮抓手：結果是否係前行為創設風險嘅實現；有介入因素就問是否異常。呢度不異常，所以因果鏈唔斷。'},
{kind:'rule',title:'Just-in-time：轉化型搶劫只補一條最值錢嘅抓手',html:`<div class="rulecard gold"><b>教授抓手</b>「我係為咗抗拒抓捕而打人」只係主觀目的。若採法考較嚴格取向，仲要問：<b>客觀上呢個暴力真係有助窩藏贓物／抗拒抓捕／毀滅罪證嗎？</b></div><div class="teacher"><div class="avatar">師</div><div class="bubble"><div class="lens"><span class="pill prof">楊艷霞教授 Brain</span><span class="pill xu">徐光華觀點展示</span></div><p>本題丁某、陳某其實只係路人，冇抓捕王某嘅意思。</p><p>所以要識分：<b>主觀上「我以為佢哋抓我」</b>，同<b>客觀上「佢哋真係抓我」</b>，未必係同一件事。</p></div></div>`},
{kind:'choice',title:'觀點展示：真正分歧係邊度？',q:'否定轉化型搶劫嘅核心理由係：',choices:['王某冇盜竊故意','丁某、陳某客觀上並冇抓捕王某，暴力與抗拒抓捕欠缺客觀關聯','王某冇造成任何傷害'],correct:1,hints:['前行為係盜竊，冇爭議。','真正爭議：主觀抗拒抓捕目的夠唔夠，定係仲要客觀上真有抓捕者。'],ok:'正確。呢個就係限制說／否定說嘅「主客觀都要接得上」。擴張說則可能認為主觀目的足夠。'},
{kind:'write',title:'答案施工：兩條線分開寫，唔好攪埋',html:`<div class="skeleton"><div class="slot"><b>故意傷害</b>王某創設毆打危險 → 陳某救助中誤傷並非極異常 → 因果鏈未斷 → 王某負丁某輕傷結果。</div><div class="slot"><b>轉化搶劫</b>先講王某主觀上有抗拒抓捕目的；再展示「只要求主觀目的」與「要求客觀關聯」兩說。</div><div class="slot"><b>本案涵攝</b>丁、陳實際無抓捕意思；因此在要求客觀關聯嘅立場下，不成立轉化型搶劫。</div></div>`},
{kind:'official',title:'官方答案解剖',html:`<div class="autopsy"><div class="autoline rule"><b>第一採分點：</b>介入因素是否異常，決定丁某輕傷能否歸責王某。</div><div class="autoline fact"><b>第二採分點：</b>王某係誤認路人為抓捕者，呢句唔係背景，而係轉化搶劫觀點題眼。</div><div class="autoline apply"><b>觀點：</b>肯定說只要求主觀目的；否定說要求強制手段與抗拒抓捕等目的存在客觀關聯。</div><div class="autoline conclusion"><b>寫法：</b>先分兩個問題，唔好一大段同時講傷害同搶劫。</div></div>`}
],
3:[
{kind:'intro',title:'事實三：先追「手機點解交到蘇某手上」',html:`<div class="official"><div class="label">官方《指導用書》 · 事實三</div><p>${facts[3].text}</p></div><div class="teacher"><div class="avatar">師</div><div class="bubble"><div class="lens"><span class="pill official">官方案例</span><span class="pill prof">楊艷霞教授 Brain</span></div><p>呢段最容易俾表面帶走：王某冇親手攞手機；蘇某冇親手打人。</p><p>我第一問反而係：<b>周某點解會把手機主動交畀蘇某？</b></p><p>如果之前冇王某毆打周某，後面「交手機俾路人保管」仲會唔會發生？</p></div></div>`},
{kind:'choice',title:'把故事變成因果鏈',q:'以下邊條鏈最貼近案情？',choices:['王某暴力 → 周某恐懼 → 為避免被劫而把手機交蘇某','蘇某突然出現 → 周某無理由送手機','王某暴力同最後取手機完全無關'],correct:0,hints:['周某交手機嘅目的係「免得手機被劫」。','因此前面暴力正正製造咗後面處分手機嘅原因。'],ok:'啱。呢條鏈令你睇到：王某雖冇親手取財，佢嘅暴力仍係取得手機整體過程嘅一部分。'},
{kind:'rule',title:'Just-in-time：搶劫嘅實行行為唔止「伸手攞錢」',html:`<div class="rulecard"><b>教授抓手</b>對搶劫，<b>排除被害人反抗嘅暴力／脅迫本身已經係實行行為</b>。所以判正犯時唔好只問「邊個親手攞手機」。</div><div class="teacher"><div class="avatar">師</div><div class="bubble"><div class="lens"><span class="pill prof">楊艷霞教授 Brain</span></div><p>王某負責壓制反抗，蘇某負責最後取得手機；如果兩人本來就共同計劃搶呢部手機，呢種分工唔會因為蘇某臨場改用欺騙方式就自動切斷共同犯罪。</p></div></div>`},
{kind:'choice',title:'蘇某個別行為又係乜？',q:'蘇某明知周某誤以為自己係路人，仍假意答應代保管而取得手機，最直接觸發：',choices:['詐騙罪的欺騙／利用錯誤問題','純粹拾遺','無罪，因周某自己交'],correct:0,hints:['「對方自己交」唔代表一定冇犯罪。要問交付係咪建基於錯誤認識。','蘇某明知錯誤仍強化、利用，並令周某作出財產處分。'],ok:'啱。蘇某個別行為符合詐騙邏輯；但同一取財行為同時又係共同搶劫整體嘅一部分，所以再處理競合。'},
{kind:'write',title:'答案施工：先共同犯罪，再個別罪名，再罪數',html:`<div class="skeleton"><div class="slot"><b>王某</b>共同搶劫故意 + 親自實施暴力 + 暴力與手機取得有因果聯繫 → 對手機取得負責。</div><div class="slot"><b>蘇某</b>共同搶劫計劃下取得手機；同時利用周某錯誤令其交付 → 個別行為亦有詐騙構造。</div><div class="slot"><b>罪數</b>同一個取手機行為同時符合搶劫／詐騙評價 → 再考慮想象競合，從一重罪。</div><div class="slot"><b>次日再欺騙</b>只為維持既得犯罪利益，未新增實質財產侵害 → 留意不可罰／共罰事後行為。</div></div>`},
{kind:'official',title:'官方答案解剖',html:`<div class="autopsy"><div class="autoline fact"><b>題眼：</b>「周某因王某暴力而把手機交給蘇某」將前後行為串成一條線。</div><div class="autoline rule"><b>共同正犯：</b>共同故意 + 分擔實行行為；唔要求每個人都親自完成全部構成要件動作。</div><div class="autoline apply"><b>詐騙：</b>蘇某利用、強化周某錯誤取得手機。</div><div class="autoline conclusion"><b>罪數：</b>同一取財同時落入兩個罪名評價，重點唔係「揀一個當另一個不存在」，而係先認清兩套構造，再處理競合。</div></div>`}
],
4:[
{kind:'intro',title:'事實四：先拆成兩次財產侵害',html:`<div class="official"><div class="label">官方《指導用書》 · 事實四</div><p>${facts[4].text}</p></div><div class="teacher"><div class="avatar">師</div><div class="bubble"><div class="lens"><span class="pill official">官方案例</span><span class="pill prof">楊艷霞教授 Brain</span></div><p>唔好一口氣問「係盜竊定詐騙」。</p><p>先拆：<b>第一次取得免費兌換券</b>；第二次<b>用非法券向店員兌套餐</b>。</p><p>兩次財產侵害嘅「處分者」唔一樣，所以法律評價可能唔一樣。</p></div></div>`},
{kind:'choice',title:'第一次：程式自動多退一張券',q:'第一步最重要嘅 diagnostic question 係：',choices:['王某有冇講大話畀朋友聽','有冇一個具有意思決定能力嘅人因受騙而處分財產','兌換券靚唔靚'],correct:1,hints:['詐騙最核心唔只係「有欺騙」，仲有被害人因錯誤而作財產處分。','如果對面只係自動運行程式，就會出現「機器能唔能夠被騙」爭議。'],ok:'啱。你已經由故事表面進入真正法律節點：機器可否成為被騙、作處分嘅主體。'},
{kind:'rule',title:'教授 default route vs 官方開放答案',html:`<div class="rulecard gold"><b>楊老師法考抓手</b>「機器不能被欺騙」——透過自動機器秘密取得財產，通常先走盜竊思路。</div><div class="rulecard purple"><b>官方《指導用書》保持開放</b>若認為機器可以被騙 → 對兌換券可走詐騙；若認為機器欠缺意思決定能力 → 對兌換券走盜竊。</div><div class="teacher"><div class="avatar">師</div><div class="bubble"><p><b>呢兩個來源唔好混。</b>教授抓手係考場 default route；官方答案提醒你呢度係觀點題，兩條路只要理由完整都要識。</p></div></div>`},
{kind:'choice',title:'第二次：向真人店員兌套餐',q:'用非法取得的券向店員兌餐，點解更容易構成詐騙？',choices:['因為店員係真人，且王某默示表示兌換券來源合法，令店員基於錯誤交付套餐','只因為套餐是食物','任何用券都係詐騙'],correct:0,hints:['諗交易習慣：你攞張券去兌換，默示咗乜？','你默示表示「呢張券係合法取得、可正常使用」，店員相信先交套餐。'],ok:'正確。第二次有真人店員嘅認識錯誤與財產處分，詐騙構造更加完整。'},
{kind:'write',title:'答案施工：先分開，再合併罪數',html:`<div class="skeleton"><div class="slot"><b>行為一</b>非法獲取兌換券：先確定兌換券係財產性利益；再展示「機器能否被騙」兩說。</div><div class="slot"><b>行為二</b>兌套餐：默示欺騙券來源合法 → 店員錯誤 → 處分套餐 → 財產損失。</div><div class="slot"><b>罪數</b>兩行為有目的上內在關聯，真正損失主要體現在套餐價值；最後按官方書路線處理整體定罪。</div></div>`},
{kind:'official',title:'官方答案解剖',html:`<div class="autopsy"><div class="autoline fact"><b>第一層：</b>兌換券本身係可兌取商品、原則上有償取得嘅財產性利益。</div><div class="autoline rule"><b>第二層：</b>第一個行為核心係「機器能否被騙」。</div><div class="autoline apply"><b>第三層：</b>第二個行為有真人店員、默示欺騙、錯誤認識、交付套餐。</div><div class="autoline conclusion"><b>最後：</b>唔可以一見 App 漏洞就只寫一個罪名；先拆兩個財產侵害，再處理罪數。</div></div>`}
],
5:[
{kind:'intro',title:'事實五：教授第一件事係數行為',html:`<div class="official"><div class="label">官方《指導用書》 · 事實五</div><p>${facts[5].text}</p></div><div class="teacher"><div class="avatar">師</div><div class="bubble"><div class="lens"><span class="pill official">官方案例</span><span class="pill prof">楊艷霞教授 Brain</span></div><p>呢段唔係一個行為。至少拆三個：</p><p><b>① 從王某處把手機偷返；② 把手機賣掉；③ 對王某虛報售價、少分3000。</b></p><p>刑法主觀題好多時唔係難在規則，而係你有冇先把「一段故事」拆成幾個可評價行為。</p></div></div>`},
{kind:'choice',title:'第一個 meta-rule：有冇新增法益損害？',q:'蘇某由王某處把共同搶來的周某手機竊回，最應先問：',choices:['周某因此有冇再多遭受一份新的財產損失','蘇某跑得快唔快','王某鍾唔鍾意蘇某'],correct:0,hints:['手機本身早已由共同搶劫奪離周某控制。','如果後續只係犯罪人之間重新控制同一贓物，先問有冇再侵害被害人一份新法益。'],ok:'啱。楊老師講本犯事後行為時成日用呢條：後行為有冇侵犯新法益？冇新增損害，就唔好機械再加一罪。'},
{kind:'rule',title:'Just-in-time：事後行為嘅 Professor Brain',html:`<div class="rulecard green"><b>教授抓手</b>犯罪完成後再處理贓物，先問「有冇新的被害人／新的法益損害」。只係維持、處分原有犯罪所得，往往屬共罰／不可罰事後行為；如果後行為再傷害新法益，就另評價。</div><div class="teacher"><div class="avatar">師</div><div class="bubble"><p>例：偷咗一件物品再普通銷贓，通常冇新增原被害人損失；但偷贗品後當真品騙另一個買家，就多咗一個新被害人、新損失。</p></div></div>`},
{kind:'choice',title:'最後3000元先係真正觀點題',q:'蘇某呃王某少分3000元，最大爭議係：',choices:['非法贓款分成所形成的「請求」算唔算刑法保護嘅財產','王某識唔識數學','1萬元是否大於4000元'],correct:0,hints:['詐騙要有「財產損失」。','如果王某對非法贓款分成根本冇受法律承認嘅財產利益，佢受騙放棄嘅係咪「財產」就有爭議。'],ok:'正確。呢度先打開法律財產說／法律—經濟財產說 vs 純粹經濟財產說。'},
{kind:'write',title:'答案施工：三個行為逐一評價',html:`<div class="skeleton"><div class="slot"><b>竊回手機</b>手機本係王、蘇共同搶得；蘇某重新控制並未令周某再受一份新財產侵害 → 不另成立盜竊。</div><div class="slot"><b>轉賣手機</b>蘇某係本犯，處分自己犯罪所得，一般唔符合掩飾、隱瞞犯罪所得罪嘅本犯之外主體要求。</div><div class="slot"><b>少分3000</b>欺騙與錯誤本身容易成立；真正爭議係王某有冇刑法上可保護的「財產」損失。</div><div class="slot"><b>觀點</b>法律／法律—經濟財產說：非法分贓請求不受法秩序承認 → 無財產損失。純粹經濟財產說：具有經濟價值及實現可能性亦可算財產 → 可成立詐騙。</div></div>`},
{kind:'official',title:'官方答案解剖',html:`<div class="autopsy"><div class="autoline rule"><b>拆行為：</b>竊回、轉賣、欺騙分贓，逐個評。</div><div class="autoline fact"><b>第一、二行為：</b>核心唔係表面「偷／賣」，而係有冇新增法益、係咪本犯處分自己犯罪所得。</div><div class="autoline apply"><b>第三行為：</b>欺騙成立唔等於詐騙必然成立；仲要有刑法意義上的財產損失。</div><div class="autoline conclusion"><b>觀點展示：</b>不同財產概念會直接改變「王某有冇損失」結論，所以呢度值得展開，而唔係為展示知識亂寫學說。</div></div><div class="source-note">到事實五，扶手已明顯少咗：你應該開始主動做「數行為 → 找 trigger → 找 decision node → 涵攝 → 觀點只在會改變結論時展開」。</div>`}
]

let state={fact:1,step:0,done:{},wrong:0};
try{const saved=JSON.parse(localStorage.getItem(STORAGE));if(saved&&saved.fact)state=Object.assign(state,saved);}catch(e){}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state));}
function totalSteps(){return Object.values(lessons).reduce((n,a)=>n+a.length,0)}
function completedSteps(){let n=0;for(let f=1;f<=5;f++){if(state.done[f])n+=lessons[f].length;else if(f===state.fact)n+=state.step;}return Math.min(n,totalSteps())}
function nav(){const box=document.getElementById('factnav');box.innerHTML='';for(let i=1;i<=5;i++){const b=document.createElement('button');b.className='factbtn'+(i===state.fact?' active':'')+(state.done[i]?' done':'');b.innerHTML=`<b>${facts[i].title}</b><span>${facts[i].short}</span>`;b.onclick=()=>{state.fact=i;state.step=0;save();render()};box.appendChild(b)}const pct=Math.round(completedSteps()/totalSteps()*100);document.getElementById('masterfill').style.width=pct+'%';document.getElementById('mastertext').textContent='整案進度 '+pct+'%';}
function sourcePills(kind){if(kind==='official')return '<span class="pill official">官方《指導用書》</span>';return ''}
function render(){nav();const f=state.fact, arr=lessons[f], idx=Math.min(state.step,arr.length);document.getElementById('facttitle').textContent=facts[f].title;document.getElementById('stepstatus').textContent=idx>=arr.length?'本段完成':`Professor Dissection · ${idx+1}/${arr.length}`;const root=document.getElementById('screen');if(idx>=arr.length){root.innerHTML=`<div class="donebox"><div class="big">✓</div><h3>${facts[f].title} 完成</h3><p>你唔係只得到一個答案，而係完成咗一次「官方案情 → trigger → diagnostic question → 規則 → 涵攝 → 官方答案」嘅思考循環。</p>${f<5?'<button class="btn primary" id="nextfact">進入事實 '+(f+1)+'</button>':'<button class="btn primary" id="finishcase">完成整案</button>'}<button class="btn ghost" id="redo" style="margin-left:8px">重做本段</button></div>`;document.getElementById('redo').onclick=()=>{state.step=0;state.done[f]=false;save();render()};if(f<5)document.getElementById('nextfact').onclick=()=>{state.done[f]=true;state.fact=f+1;state.step=0;save();render()};else document.getElementById('finishcase').onclick=finishCase;return;}const s=arr[idx];root.innerHTML=`<div class="stepmeta">${s.title}</div>${renderStep(s)}<div class="actions"><button class="btn ghost" id="prev" ${idx===0?'disabled':''}>← 上一步</button><button class="btn primary" id="next" ${s.kind==='choice'?'disabled':''}>${idx===arr.length-1?'完成本段':'下一步 →'}</button></div>`;document.getElementById('prev').onclick=()=>{if(state.step>0){state.step--;save();render()}};if(s.kind!=='choice')document.getElementById('next').onclick=advance;}
function renderStep(s){if(['intro','rule','write','official'].includes(s.kind))return s.html;if(s.kind==='choice'){return `<div class="q">${s.q}</div><div class="choices">${s.choices.map((c,i)=>`<button class="choice" data-i="${i}">${c}</button>`).join('')}</div><div class="feedback hint" id="fb"></div>`}return ''}
function advance(){const arr=lessons[state.fact];state.step++;if(state.step>=arr.length){state.done[state.fact]=true;}save();render()}
document.addEventListener('click',e=>{const c=e.target.closest('.choice');if(!c)return;const s=lessons[state.fact][state.step];const i=Number(c.dataset.i),fb=document.getElementById('fb'),choices=[...document.querySelectorAll('.choice')];if(i===s.correct){choices.forEach(x=>x.disabled=true);c.classList.add('good');fb.className='feedback ok show';fb.textContent=s.ok;document.getElementById('next').disabled=false;document.getElementById('next').onclick=advance;}else{state.wrong++;save();c.classList.add('bad');c.disabled=true;const tried=choices.filter(x=>x.classList.contains('bad')).length;fb.className='feedback hint show';fb.textContent=s.hints[Math.min(tried-1,s.hints.length-1)]||'再睇一次關鍵事實。';}});
function finishCase(){state.done[5]=true;save();const root=document.getElementById('screen');document.getElementById('facttitle').textContent='Case 01 完成';document.getElementById('stepstatus').textContent='Professor Brain Loop';root.innerHTML=`<div class="donebox"><div class="big">🏁</div><h3>你完成咗 Case 01 五段拆解</h3><p>呢個 Beta 嘅目的唔係再教一次刑法，而係示範：<b>官方《指導用書》做主線，教授個腦負責逐段幫你發現題眼同建立答題路線。</b></p><div class="rulecard green"><b>你應該開始內化嘅固定動作</b>數人物／數行為 → 找反常或多餘 facts → 問呢句點解要寫 → 打開對應法律 drawer → 只補當下所需規則 → 涵攝 → 觀點只在會改變結論時展開。</div><button class="btn primary" id="restart">由 Case 01 再做一次</button></div>`;document.getElementById('restart').onclick=()=>{state={fact:1,step:0,done:{},wrong:0};save();render()};nav();}
render();
</script>
</body>
</html>
